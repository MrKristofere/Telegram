name: Apply Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patches to"
        required: true
        default: "Test"
        type: string
      patch_url:
        description: "Patch/diff/archive URL or GitHub Actions artifact URL"
        required: true
        type: string
      commit_message:
        description: "Override commit message only when exactly one patch is imported; for squash/merge it overrides the final commit"
        required: false
        default: ""
        type: string
      strategy:
        description: "How the resulting history should be created"
        required: true
        default: "commit"
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
      ignore_whitespace:
        description: "Ignore whitespace changes when applying patches"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-patches-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply-patches:
    name: Parse, apply and push patches
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      PATCH_URL: ${{ inputs.patch_url }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      STRATEGY: ${{ inputs.strategy }}
      IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      - name: "2. Configure Git"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git config core.safecrlf false
          git --version

      - name: "3. Prepare workspace"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patch-work
          mkdir -p .patch-work/download .patch-work/extracted .patch-work/messages .patch-work/patches .patch-work/mailbox .patch-work/metadata .patch-work/manifest .patch-work/logs

      - name: "4. Download patch input"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$PATCH_URL"
          OUT=".patch-work/download/input"
          if [[ "$URL" =~ /actions/runs/[0-9]+/artifacts/([0-9]+)($|[/?#]) ]]; then
            ARTIFACT_ID="${BASH_REMATCH[1]}"
            curl --fail --show-error --silent --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 900 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o "${OUT}.zip"
            mv "${OUT}.zip" "$OUT"
          else
            curl --fail --show-error --silent --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 900 "$URL" -o "$OUT"
          fi
          test -s "$OUT"
          file "$OUT"
          ls -lh "$OUT"

      - name: "5. Extract input"
        shell: bash
        run: |
          set -euo pipefail
          INPUT=".patch-work/download/input"
          OUT=".patch-work/extracted"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          KIND="$(file -b "$INPUT")"
          case "$KIND" in
            *"Zip archive"*) unzip -q "$INPUT" -d "$OUT" ;;
            *"POSIX tar archive"*|*"tar archive"*) tar -xf "$INPUT" -C "$OUT" ;;
            *"gzip compressed data"*) if tar -tzf "$INPUT" >/dev/null 2>&1; then tar -xzf "$INPUT" -C "$OUT"; else gunzip -c "$INPUT" > "$OUT/input"; fi ;;
            *"bzip2 compressed data"*) if tar -tjf "$INPUT" >/dev/null 2>&1; then tar -xjf "$INPUT" -C "$OUT"; else bunzip2 -c "$INPUT" > "$OUT/input"; fi ;;
            *"XZ compressed data"*) if tar -tJf "$INPUT" >/dev/null 2>&1; then tar -xJf "$INPUT" -C "$OUT"; else xz -dc "$INPUT" > "$OUT/input"; fi ;;
            *) cp "$INPUT" "$OUT/input" ;;
          esac
          find "$OUT" -type f -print | sort

      - name: "6. Build patch metadata manifest"
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          EXTRACTED="$ROOT/.patch-work/extracted"
          MAILBOX="$ROOT/.patch-work/mailbox"
          PATCH_DIR="$ROOT/.patch-work/patches"
          MSG_DIR="$ROOT/.patch-work/messages"
          META_DIR="$ROOT/.patch-work/metadata"
          MANIFEST="$ROOT/.patch-work/manifest/manifest.jsonl"
          rm -rf "$MAILBOX" "$PATCH_DIR" "$MSG_DIR" "$META_DIR"
          mkdir -p "$MAILBOX" "$PATCH_DIR" "$MSG_DIR" "$META_DIR"
          : > "$MANIFEST"
          python3 <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"]); extracted=root/".patch-work"/"extracted"; mailbox_root=root/".patch-work"/"mailbox"; patch_root=root/".patch-work"/"patches"; msg_root=root/".patch-work"/"messages"; meta_root=root/".patch-work"/"metadata"; manifest_path=root/".patch-work"/"manifest"/"manifest.jsonl"
          DIFF_MAGIC=re.compile(rb"^diff --git ",re.MULTILINE); MAILBOX_MAGIC=re.compile(rb"^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$",re.MULTILINE)
          files=sorted([p for p in extracted.rglob("*") if p.is_file()],key=lambda p:[int(x) if x.isdigit() else x.lower() for x in re.split(r"([0-9]+)",str(p))])
          if not files: raise SystemExit("No files found after extraction.")
          candidates=[]
          for path in files:
              data=path.read_bytes()
              if b"\x00" in data[:8192]: continue
              is_mailbox=bool(MAILBOX_MAGIC.search(data)); is_diff=bool(DIFF_MAGIC.search(data))
              if is_mailbox or is_diff: candidates.append((path,is_mailbox))
          if not candidates: raise SystemExit("No patch/diff/format-patch content was found in the input.")
          kinds={"mailbox" if mailbox else "raw" for _,mailbox in candidates}
          if len(kinds)>1: raise SystemExit("Mixed mailbox/format-patch and raw diff inputs are not accepted in the same import.")
          def sha256(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          def split_message(message_path):
              data=message_path.read_bytes(); header,body=(data.split(b"\n\n",1) if b"\n\n" in data else (data,b"")); headers={}; current=None
              for raw in header.splitlines():
                  line=raw.decode("utf-8","replace")
                  if line[:1] in (" ","\t") and current: headers[current]+=" "+line.strip(); continue
                  if ":" in line: key,value=line.split(":",1); current=key.lower(); headers[current]=value.strip()
              return headers,body
          def run_mailinfo(message_file,msg_file,patch_file):
              proc=subprocess.run(["git","mailinfo","-b","--no-scissors","--quoted-cr=strip",str(msg_file),str(patch_file)],stdin=message_file.open("rb"),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              if proc.returncode!=0: raise RuntimeError(proc.stderr.decode("utf-8","replace"))
              metadata={"author_name":"","author_email":"","author_date":"","subject":""}
              for line in proc.stdout.decode("utf-8","replace").splitlines():
                  if line.startswith("Author:"): metadata["author_name"]=line[7:].strip()
                  elif line.startswith("Email:"): metadata["author_email"]=line[6:].strip()
                  elif line.startswith("Date:"): metadata["author_date"]=line[5:].strip()
                  elif line.startswith("Subject:"): metadata["subject"]=line[8:].strip()
              return metadata
          entries=[]; index=0
          if kinds=={"mailbox"}:
              for source_path,_ in candidates:
                  rel=source_path.relative_to(extracted); split_dir=mailbox_root/f"source-{index:04d}"; split_dir.mkdir(parents=True,exist_ok=True)
                  proc=subprocess.run(["git","mailsplit","-b","--keep-cr","-o",str(split_dir),"--",str(source_path)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=False)
                  if proc.returncode!=0: raise SystemExit(f"git mailsplit failed for {rel}:\n{proc.stderr}")
                  for message_path in sorted(split_dir.iterdir()):
                      if not message_path.is_file(): continue
                      local=index+1; patch_file=patch_root/f"{local:04d}.patch"; msg_file=msg_root/f"{local:04d}.txt"; meta_file=meta_root/f"{local:04d}.json"; metadata=run_mailinfo(message_path,msg_file,patch_file)
                      if not patch_file.exists() or patch_file.stat().st_size==0: continue
                      headers,_=split_message(message_path); metadata["author_name"]=metadata["author_name"] or headers.get("from","").rsplit("<",1)[0].strip(); metadata["author_email"]=metadata["author_email"] or (headers.get("from","").rsplit("<",1)[-1].rstrip("> ").strip() if "<" in headers.get("from","") else ""); metadata["author_date"]=metadata["author_date"] or headers.get("date",""); metadata["subject"]=metadata["subject"] or headers.get("subject","")
                      body=msg_file.read_text(encoding="utf-8",errors="replace").strip(); subject=metadata["subject"].strip(); message=f"{subject}\n\n{body}" if subject and body else (subject or body)
                      meta_file.write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                      entries.append({"index":local,"source_file":str(rel),"source_type":"mailbox","message_file":str(msg_file.relative_to(root)),"metadata_file":str(meta_file.relative_to(root)),"patch_file":str(patch_file.relative_to(root)),"patch_sha256":sha256(patch_file),"subject":subject,"body":body,"message":message,"author_name":metadata["author_name"].strip(),"author_email":metadata["author_email"].strip(),"author_date":metadata["author_date"].strip(),"metadata_source":"git-mailinfo","subject_source":"mailbox" if subject else "missing"}); index+=1
          else:
              for source_path,_ in candidates:
                  local=index+1; patch_file=patch_root/f"{local:04d}.patch"; meta_file=meta_root/f"{local:04d}.json"; shutil.copyfile(source_path,patch_file)
                  if patch_file.stat().st_size==0: raise SystemExit(f"Empty patch file: {source_path.relative_to(extracted)}")
                  metadata={"author_name":"","author_email":"","author_date":"","subject":""}; meta_file.write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  entries.append({"index":local,"source_file":str(source_path.relative_to(extracted)),"source_type":"raw-diff","message_file":"","metadata_file":str(meta_file.relative_to(root)),"patch_file":str(patch_file.relative_to(root)),"patch_sha256":sha256(patch_file),"subject":"","body":"","message":"","author_name":"","author_email":"","author_date":"","metadata_source":"none","subject_source":"missing"}); index+=1
          with manifest_path.open("w",encoding="utf-8") as f:
              for entry in entries: f.write(json.dumps(entry,ensure_ascii=False,sort_keys=True)+"\n")
          if not entries: raise SystemExit("No patches were extracted from the input.")
          print(f"Manifest entries: {len(entries)}")
          PY

      - name: "7. Validate manifest"
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path(".patch-work/manifest/manifest.jsonl"); lines=[x for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          if not lines: raise SystemExit("Manifest is empty.")
          for expected,line in enumerate(lines,1):
              item=json.loads(line)
              if item.get("index")!=expected: raise SystemExit(f"Manifest index mismatch at entry {expected}.")
              for key in ("patch_file","patch_sha256","source_file","source_type"):
                  if not item.get(key): raise SystemExit(f"Manifest entry {expected} is missing {key}.")
          print(f"Validated {len(lines)} manifest entries.")
          PY

      - name: "8. Record target SHA"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          BASE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Base SHA: $BASE_SHA"

      - name: "9. Create isolated patch branch"
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="patch-import/${GITHUB_RUN_ID}"
          git switch -C "$BRANCH" "$BASE_SHA"
          echo "PATCH_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: "10. Apply patches from manifest"
        shell: bash
        env:
          PATCH_MANIFEST: .patch-work/manifest/manifest.jsonl
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"]); manifest=root/os.environ["PATCH_MANIFEST"]; ignore_whitespace=os.environ.get("IGNORE_WHITESPACE","false").lower()=="true"; override=os.environ.get("COMMIT_MESSAGE","").strip(); entries=[json.loads(x) for x in manifest.read_text(encoding="utf-8").splitlines() if x.strip()]
          def run(cmd,check=True,**kwargs):
              proc=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False,**kwargs)
              if check and proc.returncode!=0: raise RuntimeError(f"Command failed: {' '.join(cmd)}\n{proc.stdout}\n{proc.stderr}")
              return proc
          def output(cmd): return run(cmd).stdout
          def patch_sha(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          def generated_subject():
              names=[x for x in output(["git","diff","--cached","--name-only"]).splitlines() if x]
              if not names: raise RuntimeError("Unable to generate a commit subject: staged diff has no files.")
              return f"Apply patch: {names[0]}" if len(names)==1 else f"Apply patch: {len(names)} files"
          for index,entry in enumerate(entries,1):
              patch_file=root/entry["patch_file"]; actual_sha=patch_sha(patch_file)
              if actual_sha!=entry["patch_sha256"]: raise RuntimeError(f"[{index}] Patch SHA256 mismatch: expected {entry['patch_sha256']}, got {actual_sha}")
              run(["git","reset","--hard","HEAD"]); run(["git","clean","-fd"])
              cmd=["git","apply","--index"] + (["--ignore-whitespace"] if ignore_whitespace else []) + [str(patch_file)]; run(cmd)
              if not output(["git","diff","--cached","--name-status"]).strip(): raise RuntimeError(f"[{index}] Patch produced an empty staged diff.")
              subject=entry.get("subject","").strip() or generated_subject(); body=str(entry.get("body","") or "").strip()
              if override and len(entries)==1: subject=override
              message=subject+("\n\n"+body if body else "")
              with tempfile.NamedTemporaryFile("w",encoding="utf-8",delete=False) as f: f.write(message); message_file=f.name
              try:
                  env=os.environ.copy(); author_name=entry.get("author_name","").strip(); author_email=entry.get("author_email","").strip(); author_date=entry.get("author_date","").strip()
                  if author_name and author_email: env["GIT_AUTHOR_NAME"]=author_name; env["GIT_AUTHOR_EMAIL"]=author_email
                  if author_date: env["GIT_AUTHOR_DATE"]=author_date
                  run(["git","commit","--no-verify","-F",message_file],env=env)
              finally: Path(message_file).unlink(missing_ok=True)
              actual_subject=output(["git","log","-1","--format=%s"]).strip(); actual_body=output(["git","log","-1","--format=%b"]).strip(); actual_author=output(["git","log","-1","--format=%an <%ae>"]).strip()
              if actual_subject!=subject: raise RuntimeError(f"[{index}] Commit subject mismatch: expected {subject!r}, got {actual_subject!r}")
              if actual_body!=body: raise RuntimeError(f"[{index}] Commit body mismatch.")
              if author_name and author_email and actual_author!=f"{author_name} <{author_email}>": raise RuntimeError(f"[{index}] Commit author mismatch: {actual_author!r}")
              status=output(["git","status","--porcelain","--untracked-files=no"]).strip()
              if status: raise RuntimeError(f"[{index}] Tracked repository files are dirty after commit:\n{status}")
          print(f"Applied and committed {len(entries)} patch(es).")
          PY

      - name: "11. Verify imported commits"
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count "${BASE_SHA}..HEAD")"
          EXPECTED="$(wc -l < .patch-work/manifest/manifest.jsonl)"
          if [[ "$COUNT" -ne "$EXPECTED" ]]; then echo "::error::Expected $EXPECTED imported commits, found $COUNT."; exit 1; fi
          git log --format='%H %s' "${BASE_SHA}..HEAD"

      - name: "12. Apply final history strategy"
        shell: bash
        run: |
          set -euo pipefail
          case "$STRATEGY" in
            commit|cherry-pick) ;;
            squash)
              git reset --soft "$BASE_SHA"
              MESSAGE="$COMMIT_MESSAGE"
              if [[ -z "$MESSAGE" ]]; then MESSAGE="$(git log -1 --format='%B' HEAD)"; fi
              git commit --no-verify -F <(printf '%s\n' "$MESSAGE")
              ;;
            merge)
              git switch -C "merge-result/${GITHUB_RUN_ID}" "$BASE_SHA"
              git merge --no-ff --no-edit "$PATCH_BRANCH"
              ;;
            *) echo "::error::Unknown strategy: $STRATEGY"; exit 1 ;;
          esac

      - name: "13. Final validation"
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..HEAD"
          SUBJECTS="$(
            git log \
              --format='%s' \
              "${BASE_SHA}..HEAD"
          )"
          if printf '%s\n' "$SUBJECTS" | grep -q '^$'; then
            echo "::error::At least one resulting commit has an empty subject."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean after final history operation."
            git status --short
            exit 1
          fi

      - name: "14. Verify remote target unchanged"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          REMOTE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [[ "$REMOTE_SHA" != "$BASE_SHA" ]]; then
            echo "::error::Target branch changed during the workflow."
            echo "Expected: $BASE_SHA"
            echo "Actual:   $REMOTE_SHA"
            exit 1
          fi

      - name: "15. Push result"
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:"$TARGET_BRANCH"

      - name: "16. Show final result"
        shell: bash
        run: |
          set -euo pipefail
          echo "Target branch: $TARGET_BRANCH"
          echo "Strategy: $STRATEGY"
          echo "Final SHA: $(git rev-parse HEAD)"
          echo
          git log -10 --oneline --decorate
