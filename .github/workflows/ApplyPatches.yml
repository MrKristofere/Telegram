name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patch to"
        required: true
        type: string

      patch_url:
        description: "Direct URL to a patch, diff, or archive containing patches"
        required: true
        type: string

      commit_message:
        description: "Commit message (optional)"
        required: false
        type: string
        default: ""

      strategy:
        description: "How to create the resulting history"
        required: true
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
        default: commit

      ignore_whitespace:
        description: "Ignore whitespace differences"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-patch-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout target branch
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      # ============================================================
      # 2. Configure Git and validate working tree
      # ============================================================

      - name: Configure Git and validate working tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

          echo "Target branch: $(git branch --show-current)"
          echo "Base commit: $(git rev-parse HEAD)"
          git --version

      # ============================================================
      # 3. Download patch / archive / GitHub Actions artifact
      # ============================================================

      - name: Download patch or GitHub Actions artifact
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/apply-patch"
          mkdir -p "$ROOT"

          OUTPUT="$ROOT/input"

          echo "========================================"
          echo "DOWNLOAD"
          echo "========================================"
          echo "$PATCH_URL"
          echo

          # ----------------------------------------------------------
          # GitHub Actions artifact URL
          #
          # https://github.com/OWNER/REPO/actions/runs/RUN_ID/artifacts/ARTIFACT_ID
          # ----------------------------------------------------------

          if [[ "$PATCH_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/[0-9]+/artifacts/([0-9]+)/?$ ]]; then

            OWNER="${BASH_REMATCH[1]}"
            REPO="${BASH_REMATCH[2]}"
            ARTIFACT_ID="${BASH_REMATCH[3]}"

            API="https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID"

            echo "Owner:       $OWNER"
            echo "Repository:  $REPO"
            echo "Artifact ID: $ARTIFACT_ID"
            echo

            # --------------------------------------------------------
            # Get artifact metadata.
            # --------------------------------------------------------

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API" \
              > "$ROOT/artifact.json"

            python3 - "$ROOT/artifact.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          if data.get("expired") is True:
              raise SystemExit("GitHub Actions artifact is expired.")

          if not data.get("id"):
              raise SystemExit("GitHub Actions artifact metadata has no id.")

          print("Artifact:", data.get("name", "<unnamed>"))
          print("Artifact ID:", data["id"])
          print("Expired:", data.get("expired"))
          PY

            # --------------------------------------------------------
            # Download artifact ZIP.
            #
            # IMPORTANT:
            # Do not use the workflow run URL itself as the download
            # endpoint. The artifact ID endpoint returns the download
            # redirect.
            # --------------------------------------------------------

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API/zip" \
              --output "$OUTPUT"

            echo
            echo "GitHub Actions artifact downloaded."

          else

            # --------------------------------------------------------
            # Ordinary URL.
            # --------------------------------------------------------

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              "$PATCH_URL" \
              --output "$OUTPUT"

          fi

          # ----------------------------------------------------------
          # Verify download.
          # ----------------------------------------------------------

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          echo
          echo "========================================"
          echo "DOWNLOADED FILE"
          echo "========================================"

          ls -lh "$OUTPUT"

          echo
          echo "File type:"
          file "$OUTPUT"

          echo
          echo "First bytes:"
          xxd -l 32 "$OUTPUT" || true

      # ============================================================
      # 4. Extract archives and identify real patch inputs
      # ============================================================

      - name: Extract and classify patches
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/apply-patch"

          INPUT="$ROOT/input"
          CONTENT="$ROOT/content"

          MAILBOXES="$ROOT/mailboxes.list"
          DIFFS="$ROOT/diffs.list"

          rm -rf "$CONTENT"
          mkdir -p "$CONTENT"

          : > "$MAILBOXES"
          : > "$DIFFS"

          TYPE="$(file -b "$INPUT")"

          echo "========================================"
          echo "INPUT TYPE"
          echo "========================================"
          echo "$TYPE"
          echo

          # ----------------------------------------------------------
          # ZIP
          # ----------------------------------------------------------

          if echo "$TYPE" | grep -qi 'Zip archive'; then

            echo "Detected ZIP archive."

            unzip -q "$INPUT" -d "$CONTENT"

          # ----------------------------------------------------------
          # TAR
          # ----------------------------------------------------------

          elif echo "$TYPE" | grep -qi 'tar archive'; then

            echo "Detected TAR archive."

            tar -xf "$INPUT" -C "$CONTENT"

          # ----------------------------------------------------------
          # GZIP / TAR.GZ
          # ----------------------------------------------------------

          elif echo "$TYPE" | grep -qi 'gzip compressed'; then

            if tar -tzf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.GZ archive."

              tar -xzf "$INPUT" -C "$CONTENT"

            else

              echo "Detected standalone GZIP."

              cp "$INPUT" "$CONTENT/input.gz"
              gunzip -f "$CONTENT/input.gz"

            fi

          # ----------------------------------------------------------
          # XZ / TAR.XZ
          # ----------------------------------------------------------

          elif echo "$TYPE" | grep -qi 'XZ compressed'; then

            if tar -tJf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.XZ archive."

              tar -xJf "$INPUT" -C "$CONTENT"

            else

              echo "Detected standalone XZ."

              cp "$INPUT" "$CONTENT/input.xz"
              unxz -f "$CONTENT/input.xz"

            fi

          # ----------------------------------------------------------
          # BZIP2 / TAR.BZ2
          # ----------------------------------------------------------

          elif echo "$TYPE" | grep -qi 'bzip2 compressed'; then

            if tar -tjf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.BZ2 archive."

              tar -xjf "$INPUT" -C "$CONTENT"

            else

              echo "Detected standalone BZIP2."

              cp "$INPUT" "$CONTENT/input.bz2"
              bunzip2 -f "$CONTENT/input.bz2"

            fi

          # ----------------------------------------------------------
          # Plain patch/diff.
          # ----------------------------------------------------------

          else

            cp "$INPUT" "$CONTENT/input"

          fi

          # ----------------------------------------------------------
          # Inspect every extracted file.
          #
          # We intentionally classify by CONTENT, not by filename.
          # ----------------------------------------------------------

          python3 - "$CONTENT" "$MAILBOXES" "$DIFFS" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          mailboxes = pathlib.Path(sys.argv[2])
          diffs = pathlib.Path(sys.argv[3])

          format_patch_marker = re.compile(
              rb"(?m)^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001\r?$"
          )

          git_diff_marker = re.compile(
              rb"(?m)^diff --git "
          )

          mailbox_files = []
          diff_files = []

          for path in sorted(
              root.rglob("*"),
              key=lambda p: str(p).lower()
          ):
              if not path.is_file():
                  continue

              try:
                  data = path.read_bytes()
              except OSError:
                  continue

              has_mailbox_marker = bool(format_patch_marker.search(data))
              has_git_diff = bool(git_diff_marker.search(data))

              # A format-patch mailbox must contain both the magic
              # mailbox marker and an actual Git diff.
              if has_mailbox_marker and has_git_diff:
                  mailbox_files.append(path)

              elif has_git_diff:
                  diff_files.append(path)

          # Do not guess the ordering of mixed formats.
          if mailbox_files and diff_files:
              raise SystemExit(
                  "Archive contains both format-patch mailboxes and "
                  "raw Git diffs. Refusing to guess their intended order."
              )

          if not mailbox_files and not diff_files:
              raise SystemExit(
                  "No usable Git patch/diff was found in the downloaded input."
              )

          with mailboxes.open("w", encoding="utf-8") as f:
              for path in mailbox_files:
                  f.write(str(path) + "\n")

          with diffs.open("w", encoding="utf-8") as f:
              for path in diff_files:
                  f.write(str(path) + "\n")

          print(f"format-patch mailbox files: {len(mailbox_files)}")
          print(f"raw diff files:              {len(diff_files)}")

          for path in mailbox_files:
              print("MAILBOX:", path)

          for path in diff_files:
              print("DIFF:", path)
          PY

          if [ -s "$MAILBOXES" ]; then
            echo "PATCH_KIND=mailbox" >> "$GITHUB_ENV"
          else
            echo "PATCH_KIND=diff" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 5. Create isolated branch for patch preparation
      # ============================================================

      - name: Create isolated patch branch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BRANCH="apply-patch/${GITHUB_RUN_ID}"

          echo "PATCH_BRANCH=$PATCH_BRANCH" >> "$GITHUB_ENV"

          git switch -c "$PATCH_BRANCH"

          PATCH_BASE="$(git rev-parse HEAD)"

          echo "PATCH_BASE=$PATCH_BASE" >> "$GITHUB_ENV"

          echo "Patch base:"
          git log -1 --oneline --decorate

      # ============================================================
      # 6. Apply format-patch series or raw diffs
      # ============================================================

      - name: Apply patches
        shell: bash
        env:
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/apply-patch"

          # ----------------------------------------------------------
          # format-patch / mailbox
          #
          # git am is intentionally used directly.
          # It reconstructs author/message/individual commits.
          # ----------------------------------------------------------

          if [ "$PATCH_KIND" = "mailbox" ]; then

            mapfile -t MAILBOXES < "$ROOT/mailboxes.list"

            if [ "${#MAILBOXES[@]}" -eq 0 ]; then
              echo "::error::No mailbox files were found."
              exit 1
            fi

            AM_ARGS=(
              --no-3way
              --no-verify
              --empty=drop
            )

            if [ "$IGNORE_WHITESPACE" = "true" ]; then
              AM_ARGS+=(--ignore-whitespace)
            fi

            echo "Applying format-patch mailbox series..."

            git am \
              "${AM_ARGS[@]}" \
              "${MAILBOXES[@]}"

          # ----------------------------------------------------------
          # Raw unified Git diffs.
          #
          # Each independent diff becomes one synthetic commit.
          # ----------------------------------------------------------

          else

            mapfile -t DIFFS < "$ROOT/diffs.list"

            if [ "${#DIFFS[@]}" -eq 0 ]; then
              echo "::error::No raw diff files were found."
              exit 1
            fi

            for PATCH in "${DIFFS[@]}"; do

              echo
              echo "========================================"
              echo "APPLYING RAW DIFF"
              echo "========================================"
              echo "$PATCH"

              APPLY_ARGS=(--index)

              if [ "$IGNORE_WHITESPACE" = "true" ]; then
                APPLY_ARGS+=(--ignore-whitespace)
              fi

              git apply \
                "${APPLY_ARGS[@]}" \
                "$PATCH"

              git commit \
                --allow-empty-message \
                -m "$COMMIT_MESSAGE"

            done

          fi

          # ----------------------------------------------------------
          # Never continue with an unfinished git-am operation.
          # ----------------------------------------------------------

          if [ -d .git/rebase-apply ]; then
            echo "::error::git am left an unfinished operation."
            git status
            exit 1
          fi

          # ----------------------------------------------------------
          # No dirty tree after preparation.
          # ----------------------------------------------------------

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after patch application."
            git status --short
            exit 1
          fi

          PATCH_HEAD="$(git rev-parse HEAD)"

          if [ "$PATCH_HEAD" = "$PATCH_BASE" ]; then
            echo "::error::Patch produced no commit."
            exit 1
          fi

          echo "PATCH_HEAD=$PATCH_HEAD" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "PREPARED COMMITS"
          echo "========================================"

          git log \
            --format='%H%x09%an <%ae>%x09%aI%x09%s' \
            "$PATCH_BASE..$PATCH_HEAD"

      # ============================================================
      # 7. Materialize selected strategy
      # ============================================================

      - name: Apply selected strategy
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${{ inputs.target_branch }}"

          # ----------------------------------------------------------
          # Return to the original target base.
          # ----------------------------------------------------------

          git switch "$TARGET_BRANCH"
          git reset --hard "$PATCH_BASE"

          echo
          echo "========================================"
          echo "STRATEGY"
          echo "========================================"

          echo "$STRATEGY"

          case "$STRATEGY" in

            # --------------------------------------------------------
            # commit
            #
            # Preserve every commit produced by git-am.
            # For raw diffs, every input diff is already one commit.
            # --------------------------------------------------------

            commit)

              git merge --ff-only "$PATCH_BRANCH"

              ;;

            # --------------------------------------------------------
            # squash
            #
            # Apply complete prepared history as one tree change,
            # then create exactly one new commit.
            # --------------------------------------------------------

            squash)

              git merge --squash "$PATCH_BRANCH"

              git commit \
                --allow-empty-message \
                -m "$COMMIT_MESSAGE"

              ;;

            # --------------------------------------------------------
            # merge
            #
            # Preserve the prepared history and create an actual
            # merge commit.
            # --------------------------------------------------------

            merge)

              if [ -n "$COMMIT_MESSAGE" ]; then

                git merge \
                  --no-ff \
                  -m "$COMMIT_MESSAGE" \
                  "$PATCH_BRANCH"

              else

                git merge \
                  --no-ff \
                  -m "" \
                  "$PATCH_BRANCH"

              fi

              ;;

            # --------------------------------------------------------
            # cherry-pick
            #
            # Transfer every prepared commit individually.
            # Original author/message metadata is retained by
            # cherry-pick.
            # --------------------------------------------------------

            cherry-pick)

              mapfile -t COMMITS < <(
                git rev-list \
                  --reverse \
                  "$PATCH_BASE..$PATCH_BRANCH"
              )

              if [ "${#COMMITS[@]}" -eq 0 ]; then
                echo "::error::No commits to cherry-pick."
                exit 1
              fi

              for COMMIT in "${COMMITS[@]}"; do

                echo
                echo "Cherry-picking:"
                git show \
                  --no-patch \
                  --format='%H %an <%ae> %s' \
                  "$COMMIT"

                git cherry-pick "$COMMIT"

              done

              ;;

            *)

              echo "::error::Unknown strategy: $STRATEGY"
              exit 1

              ;;

          esac

      # ============================================================
      # 8. Verify final repository state
      # ============================================================

      - name: Verify final result
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL VERIFICATION"
          echo "========================================"

          # ----------------------------------------------------------
          # No uncommitted files.
          # ----------------------------------------------------------

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty."
            git status --short
            exit 1
          fi

          # ----------------------------------------------------------
          # No unfinished merge.
          # ----------------------------------------------------------

          if [ -f .git/MERGE_HEAD ]; then
            echo "::error::Unfinished merge detected."
            exit 1
          fi

          # ----------------------------------------------------------
          # No unfinished git-am operation.
          # ----------------------------------------------------------

          if [ -d .git/rebase-apply ]; then
            echo "::error::Unfinished git-am/rebase operation detected."
            exit 1
          fi

          # ----------------------------------------------------------
          # HEAD must differ from the original base.
          # ----------------------------------------------------------

          if [ "$(git rev-parse HEAD)" = "$PATCH_BASE" ]; then
            echo "::error::Final branch is identical to the original base."
            exit 1
          fi

          echo
          echo "========================================"
          echo "FINAL HISTORY"
          echo "========================================"

          git log \
            --graph \
            --decorate \
            --oneline \
            -n 40

          echo
          echo "========================================"
          echo "FINAL STATUS"
          echo "========================================"

          git status --short

      # ============================================================
      # 9. Verify remote has not changed and push
      # ============================================================

      - name: Push result
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="${{ inputs.target_branch }}"

          echo "========================================"
          echo "REMOTE CHECK"
          echo "========================================"

          git fetch origin "$TARGET_BRANCH"

          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "Original base: $PATCH_BASE"
          echo "Remote HEAD:   $REMOTE_HEAD"
          echo "Local HEAD:    $LOCAL_HEAD"

          # ----------------------------------------------------------
          # Optimistic concurrency protection.
          #
          # If somebody pushed to the target branch while this job
          # was running, do not overwrite their work.
          # ----------------------------------------------------------

          if [ "$REMOTE_HEAD" != "$PATCH_BASE" ]; then

            echo "::error::Target branch changed while workflow was running."
            echo
            echo "Expected remote base:"
            echo "$PATCH_BASE"
            echo
            echo "Actual remote HEAD:"
            echo "$REMOTE_HEAD"

            exit 1
          fi

          if [ "$LOCAL_HEAD" = "$REMOTE_HEAD" ]; then
            echo "::error::There is nothing to push."
            exit 1
          fi

          echo
          echo "Pushing result..."

          git push \
            origin \
            "HEAD:$TARGET_BRANCH"

          echo
          echo "Push completed successfully."
