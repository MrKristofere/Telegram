name: Apply Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patches to"
        required: true
        default: "Test"
        type: string

      patch_url:
        description: "Patch/diff/archive URL or GitHub Actions artifact URL"
        required: true
        type: string

      commit_message:
        description: "Override commit message only when exactly one patch is imported; for squash/merge it overrides the final commit"
        required: false
        default: ""
        type: string

      strategy:
        description: "How the resulting history should be created"
        required: true
        default: "commit"
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick

      ignore_whitespace:
        description: "Ignore whitespace changes when applying patches"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-patches-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply-patches:
    name: Parse, apply and push patches
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      PATCH_URL: ${{ inputs.patch_url }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      STRATEGY: ${{ inputs.strategy }}
      IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout complete history
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      # ------------------------------------------------------------
      # 2. Configure Git
      # ------------------------------------------------------------
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config core.autocrlf false
          git config core.safecrlf false

          echo "Git version:"
          git --version

      # ------------------------------------------------------------
      # 3. Prepare directories
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .patch-work

          mkdir -p \
            .patch-work/download \
            .patch-work/extracted \
            .patch-work/messages \
            .patch-work/patches \
            .patch-work/mailbox \
            .patch-work/manifest \
            .patch-work/logs

      # ------------------------------------------------------------
      # 4. Download input
      #
      # Supports:
      #   - ordinary HTTP(S) URL
      #   - GitHub Actions artifact URL:
      #       /actions/runs/<run>/artifacts/<artifact_id>
      #
      # Artifact is downloaded by artifact_id directly.
      # ------------------------------------------------------------
      - name: Download patch input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          URL="$PATCH_URL"
          OUT=".patch-work/download/input"

          echo "Input URL:"
          echo "$URL"

          if [[ "$URL" =~ /actions/runs/[0-9]+/artifacts/([0-9]+)($|[/?#]) ]]; then
            ARTIFACT_ID="${BASH_REMATCH[1]}"

            echo "Detected GitHub Actions artifact."
            echo "Artifact ID: $ARTIFACT_ID"

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 900 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "${OUT}.zip"

            mv "${OUT}.zip" "$OUT"

          else
            echo "Downloading ordinary URL."

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 900 \
              "$URL" \
              -o "$OUT"
          fi

          test -s "$OUT"

          echo
          echo "Downloaded file:"
          file "$OUT"
          ls -lh "$OUT"

      # ------------------------------------------------------------
      # 5. Extract archives
      #
      # Supports:
      #   zip
      #   tar
      #   tar.gz / tgz
      #   tar.bz2
      #   tar.xz
      #   gzip-compressed single file
      #   plain patch/diff/mailbox
      # ------------------------------------------------------------
      - name: Extract input
        shell: bash
        run: |
          set -euo pipefail

          INPUT=".patch-work/download/input"
          OUT=".patch-work/extracted"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          KIND="$(file -b "$INPUT")"

          echo "Detected type:"
          echo "$KIND"

          case "$KIND" in
            *"Zip archive"*)
              unzip -q "$INPUT" -d "$OUT"
              ;;

            *"POSIX tar archive"*|*"tar archive"*)
              tar -xf "$INPUT" -C "$OUT"
              ;;

            *"gzip compressed data"*)
              if tar -tzf "$INPUT" >/dev/null 2>&1; then
                tar -xzf "$INPUT" -C "$OUT"
              else
                gunzip -c "$INPUT" > "$OUT/input"
              fi
              ;;

            *"bzip2 compressed data"*)
              if tar -tjf "$INPUT" >/dev/null 2>&1; then
                tar -xjf "$INPUT" -C "$OUT"
              else
                bunzip2 -c "$INPUT" > "$OUT/input"
              fi
              ;;

            *"XZ compressed data"*)
              if tar -tJf "$INPUT" >/dev/null 2>&1; then
                tar -xJf "$INPUT" -C "$OUT"
              else
                xz -dc "$INPUT" > "$OUT/input"
              fi
              ;;

            *)
              cp "$INPUT" "$OUT/input"
              ;;
          esac

          echo
          echo "Extracted files:"
          find "$OUT" -type f -print | sort

      # ------------------------------------------------------------
      # 6. Parse input and build manifest
      #
      # The parser:
      #
      #   A) detects Git mailbox / format-patch files
      #   B) splits mailbox with git mailsplit
      #   C) extracts metadata with git mailinfo
      #   D) ignores messages that contain no patch
      #      (cover letters / discussion messages)
      #   E) treats raw diff files as patches without source metadata
      #   F) creates manifest.jsonl
      #
      # Nothing is applied during this stage.
      # ------------------------------------------------------------
      - name: Build patch metadata manifest
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACTED="$ROOT/.patch-work/extracted"
          MAILBOX="$ROOT/.patch-work/mailbox"
          PATCH_DIR="$ROOT/.patch-work/patches"
          MSG_DIR="$ROOT/.patch-work/messages"
          MANIFEST="$ROOT/.patch-work/manifest/manifest.jsonl"

          rm -rf "$MAILBOX" "$PATCH_DIR" "$MSG_DIR"
          mkdir -p "$MAILBOX" "$PATCH_DIR" "$MSG_DIR"

          : > "$MANIFEST"

          python3 <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import hashlib
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          extracted = root / ".patch-work" / "extracted"
          mailbox_root = root / ".patch-work" / "mailbox"
          patch_root = root / ".patch-work" / "patches"
          msg_root = root / ".patch-work" / "messages"
          manifest_path = root / ".patch-work" / "manifest" / "manifest.jsonl"

          mailbox_root.mkdir(parents=True, exist_ok=True)
          patch_root.mkdir(parents=True, exist_ok=True)
          msg_root.mkdir(parents=True, exist_ok=True)

          PATCH_MAGIC = re.compile(
              rb"^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$",
              re.MULTILINE,
          )

          DIFF_MAGIC = re.compile(
              rb"^diff --git ",
              re.MULTILINE,
          )

          files = [
              p for p in extracted.rglob("*")
              if p.is_file()
          ]

          if not files:
              raise SystemExit("No files found after extraction.")

          def natural_key(path: Path):
              return [
                  int(x) if x.isdigit() else x.lower()
                  for x in re.split(r"([0-9]+)", str(path))
              ]

          files.sort(key=natural_key)

          candidates = []

          for path in files:
              try:
                  data = path.read_bytes()
              except Exception:
                  continue

              # Skip obviously unrelated binary files.
              if b"\x00" in data[:8192]:
                  continue

              has_diff = bool(DIFF_MAGIC.search(data))
              has_mailbox_magic = bool(PATCH_MAGIC.search(data))

              if has_diff or has_mailbox_magic:
                  candidates.append((path, data, has_mailbox_magic))

          if not candidates:
              raise SystemExit(
                  "No patch/diff/format-patch content was found in the input."
              )

          # A mailbox and standalone raw patches in the same input are
          # deliberately rejected. This avoids an ambiguous patch order.
          kinds = set()

          for _, _, is_mailbox in candidates:
              kinds.add("mailbox" if is_mailbox else "raw")

          if len(kinds) > 1:
              raise SystemExit(
                  "Mixed mailbox/format-patch and raw diff inputs are not "
                  "accepted in the same import."
              )

          manifest = []
          global_index = 0

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def run_mailinfo(message_file, msg_file, patch_file):
              command = [
                  "git",
                  "mailinfo",
                  "-b",
                  "--no-scissors",
                  "--quoted-cr=strip",
                  str(msg_file),
                  str(patch_file),
              ]

              with message_file.open("rb") as src:
                  proc = subprocess.run(
                      command,
                      stdin=src,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )

              if proc.returncode != 0:
                  stderr = proc.stderr.decode("utf-8", "replace")
                  raise RuntimeError(
                      f"git mailinfo failed for {message_file}: {stderr}"
                  )

              output = proc.stdout.decode("utf-8", "replace")

              metadata = {
                  "author_name": "",
                  "author_email": "",
                  "author_date": "",
                  "subject": "",
              }

              for line in output.splitlines():
                  if line.startswith("Author:"):
                      metadata["author_name"] = line[len("Author:"):].strip()
                  elif line.startswith("Email:"):
                      metadata["author_email"] = line[len("Email:"):].strip()
                  elif line.startswith("Date:"):
                      metadata["author_date"] = line[len("Date:"):].strip()
                  elif line.startswith("Subject:"):
                      metadata["subject"] = line[len("Subject:"):].strip()

              return metadata

          if kinds == {"mailbox"}:
              for source_path, source_data, _ in candidates:
                  rel = source_path.relative_to(extracted)

                  split_dir = mailbox_root / f"source-{len(manifest):04d}"
                  split_dir.mkdir(parents=True, exist_ok=True)

                  proc = subprocess.run(
                      [
                          "git",
                          "mailsplit",
                          "-b",
                          "--keep-cr",
                          "-o",
                          str(split_dir),
                          "--",
                          str(source_path),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      check=False,
                  )

                  if proc.returncode != 0:
                      raise SystemExit(
                          f"git mailsplit failed for {rel}:\n"
                          f"{proc.stderr}"
                      )

                  messages = sorted(split_dir.iterdir())

                  for message_path in messages:
                      if not message_path.is_file():
                          continue

                      local_id = global_index + 1

                      msg_file = msg_root / f"{local_id:04d}.txt"
                      patch_file = patch_root / f"{local_id:04d}.patch"

                      metadata = run_mailinfo(
                          message_path,
                          msg_file,
                          patch_file,
                      )

                      if patch_file.stat().st_size == 0:
                          # Cover letter / non-patch mail.
                          print(
                              f"Skipping non-patch mail: "
                              f"{source_path.name}:{message_path.name}"
                          )
                          continue

                      patch_sha = sha256(patch_file)

                      message_body = msg_file.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )

                      # mailinfo normally puts the subject separately.
                      # Reconstruct a normal Git commit message:
                      # subject + blank line + body.
                      subject = metadata["subject"].strip()
                      body = message_body.strip()

                      if subject and body:
                          full_message = f"{subject}\n\n{body}"
                      elif subject:
                          full_message = subject
                      else:
                          full_message = body

                      entry = {
                          "index": global_index + 1,
                          "source_file": str(rel),
                          "source_type": "mailbox",
                          "message_file": str(msg_file.relative_to(root)),
                          "patch_file": str(patch_file.relative_to(root)),
                          "patch_sha256": patch_sha,
                          "subject": subject,
                          "message": full_message,
                          "author_name": metadata["author_name"].strip(),
                          "author_email": metadata["author_email"].strip(),
                          "author_date": metadata["author_date"].strip(),
                          "metadata_source": "git-mailinfo",
                      }

                      manifest.append(entry)
                      global_index += 1

          else:
              # Raw diff mode.
              for source_path, source_data, _ in candidates:
                  rel = source_path.relative_to(extracted)

                  local_id = global_index + 1

                  patch_file = patch_root / f"{local_id:04d}.patch"
                  shutil.copyfile(source_path, patch_file)

                  if patch_file.stat().st_size == 0:
                      raise SystemExit(
                          f"Empty patch file: {rel}"
                      )

                  patch_sha = sha256(patch_file)

                  entry = {
                      "index": local_id,
                      "source_file": str(rel),
                      "source_type": "raw-diff",
                      "message_file": "",
                      "patch_file": str(patch_file.relative_to(root)),
                      "patch_sha256": patch_sha,
                      "subject": "",
                      "message": "",
                      "author_name": "",
                      "author_email": "",
                      "author_date": "",
                      "metadata_source": "none",
                  }

                  manifest.append(entry)
                  global_index += 1

          if not manifest:
              raise SystemExit(
                  "No actual patches were found. "
                  "Input contained no patch-bearing messages."
              )

          with manifest_path.open("w", encoding="utf-8") as f:
              for entry in manifest:
                  f.write(json.dumps(entry, ensure_ascii=False) + "\n")

          print()
          print("Manifest:")
          for entry in manifest:
              print(
                  f"{entry['index']:04d} | "
                  f"{entry['source_type']:10s} | "
                  f"{entry['subject'] or '(no subject)'} | "
                  f"{entry['author_name'] or '(no author)'} "
                  f"<{entry['author_email'] or 'no-email'}>"
              )

          print()
          print(f"Patch count: {len(manifest)}")
          PY

          test -s "$MANIFEST"

          echo
          echo "Manifest file:"
          cat "$MANIFEST"

      # ------------------------------------------------------------
      # 7. Validate manifest BEFORE touching target history
      # ------------------------------------------------------------
      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest_path = root / ".patch-work" / "manifest" / "manifest.jsonl"

          entries = []

          with manifest_path.open(encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      entries.append(json.loads(line))

          if not entries:
              raise SystemExit("Manifest is empty.")

          indexes = [x["index"] for x in entries]

          if indexes != list(range(1, len(entries) + 1)):
              raise SystemExit(
                  f"Manifest indexes are not continuous: {indexes}"
              )

          for entry in entries:
              patch = root / entry["patch_file"]

              if not patch.is_file():
                  raise SystemExit(
                      f"Patch file does not exist: {patch}"
                  )

              h = hashlib.sha256()

              with patch.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)

              actual_sha = h.hexdigest()

              if actual_sha != entry["patch_sha256"]:
                  raise SystemExit(
                      f"Patch SHA mismatch for {patch}: "
                      f"manifest={entry['patch_sha256']} "
                      f"actual={actual_sha}"
                  )

              if not patch.stat().st_size:
                  raise SystemExit(
                      f"Patch is empty: {patch}"
                  )

          print(f"Validated {len(entries)} patch entries.")
          PY

      # ------------------------------------------------------------
      # 8. Save the original target SHA
      #
      # This is used to prevent pushing over somebody else's changes.
      # ------------------------------------------------------------
      - name: Record target branch state
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          BASE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

          echo "Target branch: $TARGET_BRANCH"
          echo "Base SHA:      $BASE_SHA"

      # ------------------------------------------------------------
      # 9. Create isolated patch branch
      # ------------------------------------------------------------
      - name: Create isolated patch branch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BRANCH="patch-import/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "PATCH_BRANCH=$PATCH_BRANCH" >> "$GITHUB_ENV"

          git checkout -B "$PATCH_BRANCH" "$BASE_SHA"

          echo "Created:"
          git branch --show-current

      # ------------------------------------------------------------
      # 10. Apply every patch and create a commit
      #
      # Important:
      #
      #   - patch metadata is read from the manifest
      #   - patch SHA is checked again immediately before apply
      #   - patch is applied to index + working tree
      #   - fallback commit message is generated if necessary
      #   - no empty commit messages are allowed
      #   - author/date are restored when supplied by format-patch
      #
      # For multiple patches, COMMIT_MESSAGE is intentionally NOT used
      # for individual commits.
      # ------------------------------------------------------------
      - name: Apply patches from manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest_path = root / ".patch-work" / "manifest" / "manifest.jsonl"

          target_commit_message = os.environ.get("COMMIT_MESSAGE", "").strip()
          ignore_whitespace = os.environ.get(
              "IGNORE_WHITESPACE", "true"
          ).lower() == "true"

          entries = []

          with manifest_path.open(encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      entries.append(json.loads(line))

          if not entries:
              raise SystemExit("Manifest is empty.")

          single_patch = len(entries) == 1

          def run(command, **kwargs):
              print("+", " ".join(str(x) for x in command))
              return subprocess.run(
                  command,
                  check=True,
                  cwd=root,
                  **kwargs,
              )

          def output(command):
              return subprocess.check_output(
                  command,
                  cwd=root,
                  text=True,
                  stderr=subprocess.STDOUT,
              )

          def write_message(path, text):
              text = text.strip()

              if not text:
                  raise RuntimeError(
                      f"Refusing to create an empty commit message: {path}"
                  )

              path.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8",
              )

          def hash_file(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)

              return h.hexdigest()

          def generated_message():
              """
              Deterministic fallback based on the staged diff.

              This intentionally does not claim to reproduce an undocumented
              GitHub UI algorithm. It uses the actual staged diff, so the
              resulting message can never be empty merely because metadata
              was unavailable.
              """

              name_status = output([
                  "git",
                  "diff",
                  "--cached",
                  "--name-status",
                  "--find-renames",
                  "--find-copies",
              ]).strip()

              if not name_status:
                  raise RuntimeError(
                      "The patch produced no staged changes, and there is "
                      "no metadata from which to construct a commit message."
                  )

              rows = [
                  line
                  for line in name_status.splitlines()
                  if line.strip()
              ]

              if len(rows) == 1:
                  fields = rows[0].split("\t")

                  status = fields[0]
                  paths = fields[1:]

                  if status.startswith("A") and paths:
                      return f"Add {paths[-1]}"

                  if status.startswith("D") and paths:
                      return f"Delete {paths[-1]}"

                  if status.startswith("R") and len(paths) >= 2:
                      return f"Rename {paths[0]} to {paths[1]}"

                  if status.startswith("C") and len(paths) >= 2:
                      return f"Copy {paths[0]} to {paths[1]}"

                  if paths:
                      return f"Update {paths[-1]}"

              count = len(rows)

              if count == 1:
                  return "Update files"

              return f"Update {count} files"

          for entry in entries:
              index = entry["index"]

              patch_path = root / entry["patch_file"]

              if not patch_path.is_file():
                  raise RuntimeError(
                      f"[{index}] Missing patch: {patch_path}"
                  )

              actual_sha = hash_file(patch_path)

              if actual_sha != entry["patch_sha256"]:
                  raise RuntimeError(
                      f"[{index}] Patch changed after manifest creation."
                  )

              print()
              print("=" * 72)
              print(f"Applying patch #{index}")
              print(f"Source:  {entry['source_file']}")
              print(f"SHA256:  {entry['patch_sha256']}")
              print(f"Subject: {entry['subject'] or '(missing)'}")
              print(
                  f"Author:  "
                  f"{entry['author_name'] or '(missing)'} "
                  f"<{entry['author_email'] or 'missing'}>"
              )
              print(f"Date:    {entry['author_date'] or '(missing)'}")
              print("=" * 72)

              apply_args = [
                  "git",
                  "apply",
                  "--index",
              ]

              if ignore_whitespace:
                  apply_args.append("--ignore-whitespace")

              apply_args.append(str(patch_path))

              run(apply_args)

              # Make sure something was actually staged.
              staged_check = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"],
                  cwd=root,
              )

              if staged_check.returncode == 0:
                  raise RuntimeError(
                      f"[{index}] Patch applied but produced no staged changes."
                  )

              original_message = entry.get("message", "").strip()

              if single_patch and target_commit_message:
                  message = target_commit_message
                  message_source = "workflow input commit_message"

              elif original_message:
                  message = original_message
                  message_source = "patch metadata"

              else:
                  message = generated_message()
                  message_source = "generated from staged diff"

              message = message.strip()

              if not message:
                  raise RuntimeError(
                      f"[{index}] Final commit message is empty."
                  )

              message_file = (
                  root
                  / ".patch-work"
                  / "manifest"
                  / f"commit-{index:04d}.txt"
              )

              write_message(message_file, message)

              commit_args = [
                  "git",
                  "commit",
                  "--no-verify",
                  "-F",
                  str(message_file),
              ]

              author_name = entry.get("author_name", "").strip()
              author_email = entry.get("author_email", "").strip()
              author_date = entry.get("author_date", "").strip()

              if author_name and author_email:
                  commit_args.extend([
                      "--author",
                      f"{author_name} <{author_email}>",
                  ])

              if author_date:
                  commit_args.extend([
                      "--date",
                      author_date,
                  ])

              print(f"Commit message source: {message_source}")

              run(commit_args)

              commit_sha = output([
                  "git",
                  "rev-parse",
                  "HEAD",
              ]).strip()

              print(f"Created commit: {commit_sha}")

              # Verify commit message is non-empty.
              actual_subject = output([
                  "git",
                  "show",
                  "-s",
                  "--format=%s",
                  "HEAD",
              ]).strip()

              if not actual_subject:
                  raise RuntimeError(
                      f"[{index}] Git created a commit with an empty subject."
                  )

              # Verify author when metadata was available.
              if author_email:
                  actual_author_email = output([
                      "git",
                      "show",
                      "-s",
                      "--format=%ae",
                      "HEAD",
                  ]).strip()

                  if actual_author_email.lower() != author_email.lower():
                      raise RuntimeError(
                          f"[{index}] Author email mismatch: "
                          f"expected={author_email} "
                          f"actual={actual_author_email}"
                      )

              # Verify the worktree/index is clean after the commit.
              status = output([
                  "git",
                  "status",
                  "--porcelain",
              ]).strip()

              if status:
                  raise RuntimeError(
                      f"[{index}] Repository is dirty after commit:\n{status}"
                  )

          print()
          print("All patches were applied successfully.")
          PY

      # ------------------------------------------------------------
      # 11. Verify imported commit count and metadata
      # ------------------------------------------------------------
      - name: Verify imported commits
        shell: bash
        run: |
          set -euo pipefail

          PATCH_COUNT="$(wc -l < .patch-work/manifest/manifest.jsonl | tr -d ' ')"

          ACTUAL_COUNT="$(
            git rev-list \
              --count \
              "${BASE_SHA}..HEAD"
          )"

          echo "Manifest patches: $PATCH_COUNT"
          echo "Created commits:  $ACTUAL_COUNT"

          if [[ "$ACTUAL_COUNT" != "$PATCH_COUNT" ]]; then
            echo "::error::Expected $PATCH_COUNT imported commits, got $ACTUAL_COUNT."
            exit 1
          fi

          echo
          echo "Imported history:"
          git log \
            --format='%h | %an <%ae> | %ad | %s' \
            --date=iso-strict \
            "${BASE_SHA}..HEAD"

      # ------------------------------------------------------------
      # 12. Apply selected final strategy
      # ------------------------------------------------------------
      - name: Apply final history strategy
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BRANCH="$(git branch --show-current)"

          echo "Patch branch: $PATCH_BRANCH"
          echo "Strategy:     $STRATEGY"

          case "$STRATEGY" in

            commit)
              echo "Keeping individual patch commits."
              ;;

            squash)
              echo "Creating one squashed commit."

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              git merge --squash "$PATCH_BRANCH"

              if git diff --cached --quiet; then
                echo "::error::Squash produced no changes."
                exit 1
              fi

              if [[ -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="$(
                  python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest = root / ".patch-work" / "manifest" / "manifest.jsonl"

          entries = []

          with manifest.open(encoding="utf-8") as f:
              for line in f:
                  if line.strip():
                      entries.append(json.loads(line))

          subjects = [
              x.get("subject", "").strip()
              for x in entries
              if x.get("subject", "").strip()
          ]

          if subjects:
              first = subjects[0]

              if len(subjects) == 1:
                  print(first)
              else:
                  print(first)
                  print()
                  print("Applied patch series:")
                  for subject in subjects:
                      print(f"- {subject}")
          else:
              print("Update files")
          PY
                  )"
              fi

              if [[ -z "${FINAL_MESSAGE//[[:space:]]/}" ]]; then
                echo "::error::Generated squash commit message is empty."
                exit 1
              fi

              printf '%s\n' "$FINAL_MESSAGE" \
                > .patch-work/manifest/final-message.txt

              git commit \
                --no-verify \
                -F .patch-work/manifest/final-message.txt
              ;;

            merge)
              echo "Creating merge commit."

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              if [[ -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="$(
                  python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest = root / ".patch-work" / "manifest" / "manifest.jsonl"

          subjects = []

          with manifest.open(encoding="utf-8") as f:
              for line in f:
                  if line.strip():
                      obj = json.loads(line)
                      subject = obj.get("subject", "").strip()
                      if subject:
                          subjects.append(subject)

          if subjects:
              print(f"Merge patch series: {subjects[0]}")
          else:
              print("Merge applied patch series")
          PY
                  )"
              fi

              if [[ -z "${FINAL_MESSAGE//[[:space:]]/}" ]]; then
                echo "::error::Generated merge commit message is empty."
                exit 1
              fi

              printf '%s\n' "$FINAL_MESSAGE" \
                > .patch-work/manifest/final-message.txt

              git merge \
                --no-ff \
                --no-edit \
                "$PATCH_BRANCH"

              # Replace Git's automatically generated merge message only
              # when the user explicitly requested one or when our generated
              # deterministic message differs.
              git commit \
                --amend \
                --no-edit \
                -F .patch-work/manifest/final-message.txt
              ;;

            cherry-pick)
              echo "Replaying patch commits with cherry-pick."

              mapfile -t COMMITS < <(
                git rev-list \
                  --reverse \
                  "${BASE_SHA}..${PATCH_BRANCH}"
              )

              if [[ "${#COMMITS[@]}" -eq 0 ]]; then
                echo "::error::No commits available for cherry-pick."
                exit 1
              fi

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              for commit in "${COMMITS[@]}"; do
                echo "Cherry-picking $commit"

                git cherry-pick \
                  --no-commit \
                  "$commit"

                if git diff --cached --quiet; then
                  echo "::error::Cherry-pick $commit produced no changes."
                  exit 1
                fi

                git commit \
                  --no-verify \
                  -C "$commit"
              done

              # If there is exactly one patch and an explicit commit_message
              # was supplied, it is allowed to override that one commit.
              if [[ "${#COMMITS[@]}" -eq 1 && -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                printf '%s\n' "$COMMIT_MESSAGE" \
                  > .patch-work/manifest/final-message.txt

                git commit \
                  --amend \
                  --no-verify \
                  -F .patch-work/manifest/final-message.txt
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # 13. Final validation
      # ------------------------------------------------------------
      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch:"
          git branch --show-current

          echo
          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "History:"
          git log \
            --graph \
            --decorate \
            --oneline \
            -n 30

          echo
          echo "Working tree:"
          git status --short

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is dirty."
            exit 1
          fi

          echo
          echo "Commit subjects:"
          git log \
            --format='%h %s' \
            "${BASE_SHA}..HEAD"

          if git log \
              --format='%s' \
              "${BASE_SHA}..HEAD" \
              | grep -Fxq ""; then
            echo "::error::At least one resulting commit has an empty subject."
            exit 1
          fi

      # ------------------------------------------------------------
      # 14. Verify target branch did not move
      #
      # Normal push is intentionally used.
      #
      # Because the resulting branch was created from BASE_SHA,
      # a normal push will be rejected if someone changed the target
      # branch while this workflow was running.
      # ------------------------------------------------------------
      - name: Verify remote target is unchanged
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "Expected remote SHA: $BASE_SHA"
          echo "Current remote SHA:  $CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$BASE_SHA" ]]; then
            echo "::error::Target branch changed while the workflow was running."
            echo "::error::Nothing will be pushed."
            exit 1
          fi

      # ------------------------------------------------------------
      # 15. Push only after ALL validation succeeded
      # ------------------------------------------------------------
      - name: Push final history
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing:"
          echo "  HEAD -> $TARGET_BRANCH"

          git push \
            origin \
            "HEAD:refs/heads/${TARGET_BRANCH}"

      # ------------------------------------------------------------
      # 16. Print resulting history after push
      # ------------------------------------------------------------
      - name: Show final result
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          echo
          echo "Final remote HEAD:"
          git rev-parse "origin/$TARGET_BRANCH"

          echo
          echo "Final imported history:"
          git log \
            --graph \
            --decorate \
            --format='%h | %an <%ae> | %ad | %s' \
            --date=iso-strict \
            -n 30 \
            "origin/$TARGET_BRANCH"
