name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patch to"
        required: true
        type: string

      patch_url:
        description: "Direct URL to .patch or .diff"
        required: true
        type: string

      commit_message:
        description: "Commit message"
        required: true
        type: string
        default: "Apply patch"

      strategy:
        description: "How to create the resulting commit"
        required: true
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
        default: commit

      ignore_whitespace:
        description: "Ignore whitespace differences"
        required: true
        type: boolean
        default: true

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. Checkout target branch
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      # ============================================================
      # 2. Configure Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Working tree:"
          git status --short

      # ============================================================
      # 3. Download patch
      # ============================================================

      - name: Download patch
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/patch"

          echo "Downloading patch..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 300 \
            "$PATCH_URL" \
            --output "$RUNNER_TEMP/patch/input.patch"

          if [ ! -s "$RUNNER_TEMP/patch/input.patch" ]; then
            echo "::error::Downloaded patch is empty."
            exit 1
          fi

          echo
          echo "Patch information:"
          wc -l "$RUNNER_TEMP/patch/input.patch"
          file "$RUNNER_TEMP/patch/input.patch"

      # ============================================================
      # 4. Detect patch format
      # ============================================================

      - name: Detect patch format
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/input.patch"

          if grep -qE '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' "$PATCH"; then
            echo "PATCH_FORMAT=mailbox" >> "$GITHUB_ENV"
            echo "Detected format: Git mailbox / format-patch"

          elif grep -qE '^diff --git ' "$PATCH"; then
            echo "PATCH_FORMAT=diff" >> "$GITHUB_ENV"
            echo "Detected format: Git diff"

          else
            echo "::error::Unable to detect patch format."
            exit 1
          fi

      # ============================================================
      # 5. Extract diff from mailbox
      #
      # We intentionally don't use git am.
      #
      # This allows us to work with patches containing:
      #
      #   index 0000000..0000000
      #
      # and malformed format-patch metadata.
      # ============================================================

      - name: Extract patch payload
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$RUNNER_TEMP/patch/input.patch"
          OUTPUT="$RUNNER_TEMP/patch/patch.diff"

          if [ "$PATCH_FORMAT" = "mailbox" ]; then

            awk '
              /^diff --git / {
                started=1
              }

              started {
                print
              }
            ' "$INPUT" > "$OUTPUT"

          else

            cp "$INPUT" "$OUTPUT"

          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::Could not extract a Git diff from the patch."
            exit 1
          fi

          echo "Extracted diff:"
          echo "----------------------------------------"
          head -n 30 "$OUTPUT"
          echo "----------------------------------------"

      # ============================================================
      # 6. Basic patch validation
      # ============================================================

      - name: Validate patch structure
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          if ! grep -qE '^diff --git ' "$PATCH"; then
            echo "::error::Patch does not contain any Git diff sections."
            exit 1
          fi

          echo "Patch contains Git diff sections."

          echo
          echo "Files referenced by patch:"
          grep -E '^diff --git ' "$PATCH" || true

      # ============================================================
      # 7. Validate paths
      #
      # Don't allow absolute paths or ../ traversal.
      # ============================================================

      - name: Validate patch paths
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          if grep -nE '^--- (/[A-Za-z]|[A-Za-z]:[/\\])' "$PATCH"; then
            echo "::error::Patch contains an absolute path."
            exit 1
          fi

          if grep -nE '^\+\+\+ (/[A-Za-z]|[A-Za-z]:[/\\])' "$PATCH"; then
            echo "::error::Patch contains an absolute path."
            exit 1
          fi

          if grep -nE '^--- .*(^|/)\.\.(/|$)' "$PATCH"; then
            echo "::error::Patch contains parent-directory traversal."
            exit 1
          fi

          if grep -nE '^\+\+\+ .*(^|/)\.\.(/|$)' "$PATCH"; then
            echo "::error::Patch contains parent-directory traversal."
            exit 1
          fi

          echo "Patch paths look safe."

      # ============================================================
      # 8. Detect fake indexes
      #
      # This is informational only.
      #
      # We do NOT attempt a 3-way merge with these indexes.
      # ============================================================

      - name: Inspect patch indexes
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          if grep -qE '^index 0+\.0+ ' "$PATCH"; then
            echo "WARNING: patch contains zero/fake blob indexes."
            echo
            grep -nE '^index ' "$PATCH" || true
            echo
            echo "3-way application will NOT be used."
          else
            echo "Patch contains normal index information."
            grep -nE '^index ' "$PATCH" || true
          fi

      # ============================================================
      # 9. Check current working tree
      # ============================================================

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            echo
            git status --short
            exit 1
          fi

          echo "Working tree is clean."

      # ============================================================
      # 10. Test patch applicability
      #
      # --recount:
      #   Recalculate hunk line counts.
      #
      # We don't use --3way because the supplied patch has fake
      # indexes.
      # ============================================================

      - name: Check patch applicability
        shell: bash
        env:
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          ARGS=(
            --check
            --recount
            --verbose
          )

          if [ "$IGNORE_WHITESPACE" = "true" ]; then
            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )
          fi

          echo "Running strict patch check..."

          if git apply "${ARGS[@]}" "$PATCH"; then
            echo
            echo "Patch can be applied cleanly."

          else
            echo
            echo "::warning::Strict patch check failed."
            echo "Trying partial application with --reject."
          fi

      # ============================================================
      # 11. Apply patch
      #
      # --reject:
      #   Apply everything possible and write rejected hunks
      #   to .rej files.
      #
      # --recount:
      #   Ignore incorrect hunk counters.
      #
      # IMPORTANT:
      # We don't hide errors. The command result is recorded and
      # rejected hunks are checked immediately afterwards.
      # ============================================================

      - name: Apply patch
        shell: bash
        env:
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
        run: |
          set -uo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          ARGS=(
            --recount
            --reject
            --verbose
            --whitespace=nowarn
          )

          if [ "$IGNORE_WHITESPACE" = "true" ]; then
            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )
          fi

          echo "Applying patch..."

          git apply "${ARGS[@]}" "$PATCH"
          APPLY_EXIT=$?

          echo "git apply exit code: $APPLY_EXIT"

          echo
          echo "Working tree after applying patch:"
          git status --short

          # Don't immediately fail here.
          # The next step gives a much better diagnostic.
          exit 0

      # ============================================================
      # 12. Check rejected hunks
      # ============================================================

      - name: Check rejected hunks
        shell: bash
        run: |
          set -euo pipefail

          REJECTS="$(find . \
            -type f \
            -name '*.rej' \
            -not -path './.git/*' \
            -print)"

          if [ -n "$REJECTS" ]; then

            echo "::error::Patch was only partially applied."

            echo
            echo "Rejected files:"
            echo "$REJECTS"

            while IFS= read -r FILE; do
              echo
              echo "========================================"
              echo "REJECTED HUNKS: $FILE"
              echo "========================================"
              cat "$FILE"
            done <<< "$REJECTS"

            echo
            echo "No commit will be created."

            exit 1
          fi

          echo "No rejected hunks."

      # ============================================================
      # 13. Verify resulting changes
      # ============================================================

      - name: Verify resulting changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && \
             [ -z "$(git ls-files --others --exclude-standard)" ]; then

            echo "::error::Patch produced no changes."
            exit 1
          fi

          echo "Patch produced changes."

          echo
          echo "Changed files:"
          git status --short

          echo
          echo "Diff stat:"
          git diff --stat

      # ============================================================
      # 14. Commit / Squash
      #
      # For this workflow, both commit and squash produce one
      # resulting commit because the patch is applied as one
      # working-tree operation.
      # ============================================================

      - name: Create direct commit
        if: inputs.strategy == 'commit' || inputs.strategy == 'squash'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Nothing to commit."
            exit 1
          fi

          git commit \
            -m "$COMMIT_MESSAGE"

          echo "Created commit:"
          git log -1 --oneline

      # ============================================================
      # 15. Prepare temporary branch for merge/cherry-pick
      # ============================================================

      - name: Create patch branch
        if: inputs.strategy == 'merge' || inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          TEMP_BRANCH="patch/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"

          git switch -c "$TEMP_BRANCH"

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Nothing to commit."
            exit 1
          fi

          git commit \
            -m "$COMMIT_MESSAGE"

          PATCH_COMMIT="$(git rev-parse HEAD)"

          echo "PATCH_COMMIT=$PATCH_COMMIT" >> "$GITHUB_ENV"

          echo "Temporary patch branch:"
          echo "$TEMP_BRANCH"

          echo
          echo "Patch commit:"
          echo "$PATCH_COMMIT"

      # ============================================================
      # 16. Merge
      # ============================================================

      - name: Merge patch branch
        if: inputs.strategy == 'merge'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git merge \
            --no-ff \
            --no-edit \
            "$TEMP_BRANCH"

          echo
          echo "Merge completed."

          git log -2 --oneline --decorate

      # ============================================================
      # 17. Cherry-pick
      # ============================================================

      - name: Cherry-pick patch commit
        if: inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git cherry-pick "$PATCH_COMMIT"

          echo
          echo "Cherry-pick completed."

          git log -2 --oneline --decorate

      # ============================================================
      # 18. Final verification
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL STATE"
          echo "========================================"

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "HEAD:"
          git log -1 --oneline --decorate

          echo
          echo "Working tree:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after operation."
            exit 1
          fi

      # ============================================================
      # 19. Push target branch
      # ============================================================

      - name: Push target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push origin \
            "HEAD:$TARGET_BRANCH"

          echo "Pushed $TARGET_BRANCH."

      # ============================================================
      # 20. Cleanup temporary remote branch
      # ============================================================

      - name: Delete temporary remote branch
        if: inputs.strategy == 'merge' || inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TEMP_BRANCH: ${{ env.TEMP_BRANCH }}
        run: |
          set -euo pipefail

          git push origin \
            --delete "$TEMP_BRANCH" \
            2>/dev/null || true

          echo "Temporary branch cleanup completed."
