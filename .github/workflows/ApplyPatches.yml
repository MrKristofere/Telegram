name: Apply Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patches to"
        required: true
        default: "Test"
        type: string

      patch_url:
        description: "Patch/diff/archive URL or GitHub Actions artifact URL"
        required: true
        type: string

      commit_message:
        description: "Override commit message only when exactly one patch is imported; for squash/merge it overrides the final commit"
        required: false
        default: ""
        type: string

      strategy:
        description: "How the resulting history should be created"
        required: true
        default: "commit"
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick

      ignore_whitespace:
        description: "Ignore whitespace changes when applying patches"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-patches-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply-patches:
    name: Parse, apply and push patches
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      PATCH_URL: ${{ inputs.patch_url }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      STRATEGY: ${{ inputs.strategy }}
      IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout complete history
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      # ------------------------------------------------------------
      # 2. Configure Git
      # ------------------------------------------------------------
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config core.autocrlf false
          git config core.safecrlf false

          echo "Git version:"
          git --version

      # ------------------------------------------------------------
      # 3. Prepare directories
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .patch-work

          mkdir -p \
            .patch-work/download \
            .patch-work/extracted \
            .patch-work/messages \
            .patch-work/patches \
            .patch-work/mailbox \
            .patch-work/manifest \
            .patch-work/logs

      # ------------------------------------------------------------
      # 4. Download input
      #
      # Supports:
      #   - ordinary HTTP(S) URL
      #   - GitHub Actions artifact URL:
      #       /actions/runs/<run>/artifacts/<artifact_id>
      #
      # Artifact is downloaded by artifact_id directly.
      # ------------------------------------------------------------
      - name: Download patch input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          URL="$PATCH_URL"
          OUT=".patch-work/download/input"

          echo "Input URL:"
          echo "$URL"

          if [[ "$URL" =~ /actions/runs/[0-9]+/artifacts/([0-9]+)($|[/?#]) ]]; then
            ARTIFACT_ID="${BASH_REMATCH[1]}"

            echo "Detected GitHub Actions artifact."
            echo "Artifact ID: $ARTIFACT_ID"

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 900 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "${OUT}.zip"

            mv "${OUT}.zip" "$OUT"

          else
            echo "Downloading ordinary URL."

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 900 \
              "$URL" \
              -o "$OUT"
          fi

          test -s "$OUT"

          echo
          echo "Downloaded file:"
          file "$OUT"
          ls -lh "$OUT"

      # ------------------------------------------------------------
      # 5. Extract archives
      #
      # Supports:
      #   zip
      #   tar
      #   tar.gz / tgz
      #   tar.bz2
      #   tar.xz
      #   gzip-compressed single file
      #   plain patch/diff/mailbox
      # ------------------------------------------------------------
      - name: Extract input
        shell: bash
        run: |
          set -euo pipefail

          INPUT=".patch-work/download/input"
          OUT=".patch-work/extracted"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          KIND="$(file -b "$INPUT")"

          echo "Detected type:"
          echo "$KIND"

          case "$KIND" in
            *"Zip archive"*)
              unzip -q "$INPUT" -d "$OUT"
              ;;

            *"POSIX tar archive"*|*"tar archive"*)
              tar -xf "$INPUT" -C "$OUT"
              ;;

            *"gzip compressed data"*)
              if tar -tzf "$INPUT" >/dev/null 2>&1; then
                tar -xzf "$INPUT" -C "$OUT"
              else
                gunzip -c "$INPUT" > "$OUT/input"
              fi
              ;;

            *"bzip2 compressed data"*)
              if tar -tjf "$INPUT" >/dev/null 2>&1; then
                tar -xjf "$INPUT" -C "$OUT"
              else
                bunzip2 -c "$INPUT" > "$OUT/input"
              fi
              ;;

            *"XZ compressed data"*)
              if tar -tJf "$INPUT" >/dev/null 2>&1; then
                tar -xJf "$INPUT" -C "$OUT"
              else
                xz -dc "$INPUT" > "$OUT/input"
              fi
              ;;

            *)
              cp "$INPUT" "$OUT/input"
              ;;
          esac

          echo
          echo "Extracted files:"
          find "$OUT" -type f -print | sort

      # ------------------------------------------------------------
      # 6. Parse input and build manifest
      #
      # Every individual patch is parsed independently.
      #
      # Metadata supported:
      #   Author: Name <email>
      #   From: Name <email>
      #   Date: ...
      #   Subject: ...
      #
      # The message/body is everything after the metadata headers and
      # before the patch separator:
      #
      #   ---
      #   <diffstat>
      #
      # or:
      #
      #   diff --git ...
      #
      # IMPORTANT:
      #   - diffstat is NEVER part of the commit message
      #   - missing author is NOT invented
      #   - missing body is NOT invented
      #   - missing subject is generated later from the actual diff
      # ------------------------------------------------------------
      - name: Build patch metadata manifest
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACTED="$ROOT/.patch-work/extracted"
          MAILBOX="$ROOT/.patch-work/mailbox"
          PATCH_DIR="$ROOT/.patch-work/patches"
          MSG_DIR="$ROOT/.patch-work/messages"
          META_DIR="$ROOT/.patch-work/metadata"
          MANIFEST="$ROOT/.patch-work/manifest/manifest.jsonl"

          rm -rf "$MAILBOX" "$PATCH_DIR" "$MSG_DIR" "$META_DIR"
          mkdir -p \
            "$MAILBOX" \
            "$PATCH_DIR" \
            "$MSG_DIR" \
            "$META_DIR"

          : > "$MANIFEST"

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          extracted = root / ".patch-work" / "extracted"
          mailbox_root = root / ".patch-work" / "mailbox"
          patch_root = root / ".patch-work" / "patches"
          msg_root = root / ".patch-work" / "messages"
          meta_root = root / ".patch-work" / "metadata"
          manifest_path = root / ".patch-work" / "manifest" / "manifest.jsonl"

          mailbox_root.mkdir(parents=True, exist_ok=True)
          patch_root.mkdir(parents=True, exist_ok=True)
          msg_root.mkdir(parents=True, exist_ok=True)
          meta_root.mkdir(parents=True, exist_ok=True)

          DIFF_MAGIC = re.compile(rb"^diff --git ", re.MULTILINE)
          PATCH_MAGIC = re.compile(
              rb"^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$",
              re.MULTILINE,
          )

          files = [
              p for p in extracted.rglob("*")
              if p.is_file()
          ]

          if not files:
              raise SystemExit("No files found after extraction.")

          def natural_key(path):
              return [
                  int(x) if x.isdigit() else x.lower()
                  for x in re.split(r"([0-9]+)", str(path))
              ]

          files.sort(key=natural_key)

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def clean_header_value(value):
              return value.strip()

          def parse_author(value):
              value = value.strip()

              m = re.match(
                  r"^(.*?)\s*<([^<>]+)>\s*$",
                  value,
              )

              if m:
                  return (
                      m.group(1).strip(),
                      m.group(2).strip(),
                  )

              return value, ""

          def normalize_date(value):
              value = value.strip()

              if not value:
                  return ""

              try:
                  dt = parsedate_to_datetime(value)
                  return dt.isoformat()
              except Exception:
                  return value

          def split_patch_content(data):
              """
              Separate mail-style metadata/body from the actual diff.

              Returns:
                  metadata_part
                  diff_part
              """

              text = data.decode("utf-8", "replace")
              lines = text.splitlines(keepends=True)

              diff_index = None

              for i, line in enumerate(lines):
                  if line.startswith("diff --git "):
                      diff_index = i
                      break

              if diff_index is None:
                  raise ValueError(
                      "Patch does not contain 'diff --git'."
                  )

              before_diff = lines[:diff_index]
              diff_part = "".join(lines[diff_index:])

              separator_index = None

              for i, line in enumerate(before_diff):
                  if line.rstrip("\r\n") == "---":
                      separator_index = i
                      break

              if separator_index is not None:
                  header_and_body = before_diff[:separator_index]
              else:
                  header_and_body = before_diff

              return (
                  "".join(header_and_body),
                  diff_part,
              )

          def parse_metadata(data):
              """
              Parse metadata from a standalone patch.

              Supported forms:

                  Author: John Doe <john@example.com>
                  From: John Doe <john@example.com>
                  Date: ...
                  Subject: ...

              For standalone/raw patches without an explicit Subject:
              the first paragraph after the metadata headers is the
              subject and the following paragraphs form the body.
              """

              metadata_part, diff_part = split_patch_content(data)

              lines = metadata_part.splitlines()

              author_name = ""
              author_email = ""
              author_date = ""
              subject = ""
              body = ""

              header_re = re.compile(
                  r"^(Author|From|Date|Subject):\s*(.*)$",
                  re.IGNORECASE,
              )

              i = 0
              explicit_subject = False

              # Parse metadata headers.
              while i < len(lines):
                  line = lines[i]
                  match = header_re.match(line)

                  if match:
                      key = match.group(1).lower()
                      value = match.group(2).strip()

                      if key == "author":
                          author_name, author_email = parse_author(value)

                      elif key == "from":
                          if not author_name:
                              author_name, author_email = parse_author(value)

                      elif key == "date":
                          author_date = normalize_date(value)

                      elif key == "subject":
                          subject = value
                          explicit_subject = True

                      i += 1
                      continue

                  # RFC/mail-style continuation lines for Subject.
                  if (
                      line[:1].isspace()
                      and explicit_subject
                  ):
                      subject += " " + line.strip()
                      i += 1
                      continue

                  # The metadata header block ends at the first blank line.
                  if not line.strip():
                      i += 1
                      break

                  # Non-header text starts the commit message.
                  break

              # Skip blank lines between metadata and commit message.
              while i < len(lines) and not lines[i].strip():
                  i += 1

              message_lines = lines[i:]

              # Standalone format:
              #
              #   Author: ...
              #
              #   Subject
              #
              #   Body
              #
              # If Subject: was not explicitly supplied, the first
              # paragraph is the subject and everything after the next
              # blank line is the body.
              if not subject and message_lines:
                  subject_lines = []

                  while message_lines and message_lines[0].strip():
                      subject_lines.append(
                          message_lines.pop(0).strip()
                      )

                  subject = " ".join(subject_lines).strip()

                  # Remove the separator between subject and body.
                  while message_lines and not message_lines[0].strip():
                      message_lines.pop(0)

              body = "\n".join(message_lines).strip()

              return {
                  "author_name": author_name.strip(),
                  "author_email": author_email.strip(),
                  "author_date": author_date.strip(),
                  "subject": subject.strip(),
                  "body": body,
                  "diff": diff_part,
              }

          def parse_patch(path):
              data = path.read_bytes()

              # First try the explicit metadata format.
              try:
                  parsed = parse_metadata(data)

                  if parsed["diff"].strip():
                      return parsed
              except Exception:
                  pass

              # No usable metadata. Extract the actual diff only.
              text = data.decode("utf-8", "replace")
              match = re.search(
                  r"^diff --git ",
                  text,
                  re.MULTILINE,
              )

              if not match:
                  raise ValueError(
                      f"Unable to locate diff in {path}"
                  )

              return {
                  "author_name": "",
                  "author_email": "",
                  "author_date": "",
                  "subject": "",
                  "body": "",
                  "diff": text[match.start():],
              }

          candidates = []

          for path in files:
              try:
                  data = path.read_bytes()
              except Exception:
                  continue

              if b"\x00" in data[:8192]:
                  continue

              has_diff = bool(DIFF_MAGIC.search(data))
              has_mailbox = bool(PATCH_MAGIC.search(data))

              if has_diff or has_mailbox:
                  candidates.append(
                      (path, data, has_mailbox)
                  )

          if not candidates:
              raise SystemExit(
                  "No patch/diff/format-patch content was found."
              )

          kinds = {
              "mailbox" if is_mailbox else "raw"
              for _, _, is_mailbox in candidates
          }

          if len(kinds) > 1:
              raise SystemExit(
                  "Mixed mailbox and raw diff inputs are not supported "
                  "in one import."
              )

          manifest = []
          global_index = 0

          if kinds == {"mailbox"}:

              for source_path, _, _ in candidates:
                  rel = source_path.relative_to(extracted)

                  split_dir = (
                      mailbox_root
                      / f"source-{len(manifest):04d}"
                  )

                  split_dir.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  proc = subprocess.run(
                      [
                          "git",
                          "mailsplit",
                          "-b",
                          "--keep-cr",
                          "-o",
                          str(split_dir),
                          "--",
                          str(source_path),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      check=False,
                  )

                  if proc.returncode != 0:
                      raise SystemExit(
                          f"git mailsplit failed for {rel}:\n"
                          f"{proc.stderr}"
                      )

                  messages = sorted(
                      p for p in split_dir.iterdir()
                      if p.is_file()
                  )

                  for message_path in messages:
                      local_id = global_index + 1

                      msg_file = (
                          msg_root
                          / f"{local_id:04d}.txt"
                      )

                      meta_file = (
                          meta_root
                          / f"{local_id:04d}.json"
                      )

                      patch_file = (
                          patch_root
                          / f"{local_id:04d}.patch"
                      )

                      # Existing, reliable mailbox parser.
                      command = [
                          "git",
                          "mailinfo",
                          "-b",
                          "--no-scissors",
                          "--quoted-cr=strip",
                          str(msg_file),
                          str(patch_file),
                      ]

                      with message_path.open("rb") as src:
                          proc = subprocess.run(
                              command,
                              stdin=src,
                              stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE,
                              check=False,
                          )

                      if proc.returncode != 0:
                          raise SystemExit(
                              "git mailinfo failed for "
                              f"{message_path}:\n"
                              f"{proc.stderr.decode('utf-8', 'replace')}"
                          )

                      if (
                          not patch_file.exists()
                          or not patch_file.stat().st_size
                      ):
                          continue

                      output = proc.stdout.decode(
                          "utf-8",
                          "replace",
                      )

                      metadata = {
                          "author_name": "",
                          "author_email": "",
                          "author_date": "",
                          "subject": "",
                      }

                      for line in output.splitlines():
                          if line.startswith("Author:"):
                              (
                                  metadata["author_name"],
                                  metadata["author_email"],
                              ) = parse_author(
                                  line[len("Author:"):].strip()
                              )

                          elif line.startswith("Email:"):
                              metadata["author_email"] = (
                                  line[len("Email:"):].strip()
                              )

                          elif line.startswith("Date:"):
                              metadata["author_date"] = (
                                  normalize_date(
                                      line[len("Date:"):].strip()
                                  )
                              )

                          elif line.startswith("Subject:"):
                              metadata["subject"] = (
                                  line[len("Subject:"):].strip()
                              )

                      body = msg_file.read_text(
                          encoding="utf-8",
                          errors="replace",
                      ).strip()

                      metadata["body"] = body

                      subject = metadata["subject"].strip()

                      if subject and body:
                          full_message = (
                              f"{subject}\n\n{body}"
                          )
                      elif subject:
                          full_message = subject
                      else:
                          full_message = body

                      meta_file.write_text(
                          json.dumps(
                              metadata,
                              ensure_ascii=False,
                              indent=2,
                          ) + "\n",
                          encoding="utf-8",
                      )

                      entry = {
                          "index": local_id,
                          "source_file": str(rel),
                          "source_type": "mailbox",
                          "message_file": str(
                              msg_file.relative_to(root)
                          ),
                          "metadata_file": str(
                              meta_file.relative_to(root)
                          ),
                          "patch_file": str(
                              patch_file.relative_to(root)
                          ),
                          "patch_sha256": sha256(patch_file),
                          "subject": subject,
                          "body": body,
                          "message": full_message,
                          "author_name": metadata[
                              "author_name"
                          ].strip(),
                          "author_email": metadata[
                              "author_email"
                          ].strip(),
                          "author_date": metadata[
                              "author_date"
                          ].strip(),
                          "metadata_source": "git-mailinfo",
                          "subject_source": (
                              "patch"
                              if subject
                              else "missing"
                          ),
                      }

                      manifest.append(entry)
                      global_index += 1

          else:
              # ------------------------------------------------------
              # Standalone/raw diff mode.
              #
              # THIS is the important fix:
              # each diff is parsed independently before it is
              # ever applied.
              # ------------------------------------------------------

              for source_path, source_data, _ in candidates:
                  rel = source_path.relative_to(extracted)
                  local_id = global_index + 1

                  parsed = parse_patch(source_path)

                  patch_file = (
                      patch_root
                      / f"{local_id:04d}.patch"
                  )

                  msg_file = (
                      msg_root
                      / f"{local_id:04d}.txt"
                  )

                  meta_file = (
                      meta_root
                      / f"{local_id:04d}.json"
                  )

                  diff = parsed["diff"].lstrip()

                  if not diff:
                      raise SystemExit(
                          f"Empty diff extracted from {rel}"
                      )

                  patch_file.write_text(
                      diff,
                      encoding="utf-8",
                      newline="",
                  )

                  subject = parsed["subject"].strip()
                  body = parsed["body"].strip()

                  if subject and body:
                      full_message = (
                          f"{subject}\n\n{body}"
                      )
                  elif subject:
                      full_message = subject
                  else:
                      full_message = body

                  metadata = {
                      "author_name": parsed[
                          "author_name"
                      ].strip(),
                      "author_email": parsed[
                          "author_email"
                      ].strip(),
                      "author_date": parsed[
                          "author_date"
                      ].strip(),
                      "subject": subject,
                      "body": body,
                  }

                  meta_file.write_text(
                      json.dumps(
                          metadata,
                          ensure_ascii=False,
                          indent=2,
                      ) + "\n",
                      encoding="utf-8",
                  )

                  msg_file.write_text(
                      full_message.rstrip() + "\n"
                      if full_message.strip()
                      else "",
                      encoding="utf-8",
                  )

                  entry = {
                      "index": local_id,
                      "source_file": str(rel),
                      "source_type": "raw-diff",
                      "message_file": str(
                          msg_file.relative_to(root)
                      ),
                      "metadata_file": str(
                          meta_file.relative_to(root)
                      ),
                      "patch_file": str(
                          patch_file.relative_to(root)
                      ),
                      "patch_sha256": sha256(patch_file),
                      "subject": subject,
                      "body": body,
                      "message": full_message,
                      "author_name": parsed[
                          "author_name"
                      ].strip(),
                      "author_email": parsed[
                          "author_email"
                      ].strip(),
                      "author_date": parsed[
                          "author_date"
                      ].strip(),
                      "metadata_source": (
                          "standalone-diff"
                          if any([
                              parsed["author_name"],
                              parsed["author_email"],
                              parsed["author_date"],
                              parsed["subject"],
                              parsed["body"],
                          ])
                          else "none"
                      ),
                      "subject_source": (
                          "patch"
                          if subject
                          else "missing"
                      ),
                  }

                  manifest.append(entry)
                  global_index += 1

          if not manifest:
              raise SystemExit(
                  "No actual patches were found."
              )

          with manifest_path.open(
              "w",
              encoding="utf-8",
          ) as f:
              for entry in manifest:
                  f.write(
                      json.dumps(
                          entry,
                          ensure_ascii=False,
                      ) + "\n"
                  )

          print()
          print("=" * 80)
          print("PATCH MANIFEST")
          print("=" * 80)

          for entry in manifest:
              print(
                  f"{entry['index']:04d} | "
                  f"{entry['subject'] or '(subject missing)'}"
              )

              print(
                  f"      author: "
                  f"{entry['author_name'] or '(not supplied)'} "
                  f"<{entry['author_email'] or 'not supplied'}>"
              )

              print(
                  f"      body: "
                  f"{'yes' if entry['body'] else 'no'}"
              )

              print(
                  f"      subject source: "
                  f"{entry['subject_source']}"
              )

          print()
          print(f"Patch count: {len(manifest)}")
          PY

          test -s "$MANIFEST"

          echo
          echo "Manifest:"
          cat "$MANIFEST"

      # ------------------------------------------------------------
      # 7. Validate manifest BEFORE touching target history
      # ------------------------------------------------------------
      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest_path = root / ".patch-work" / "manifest" / "manifest.jsonl"

          entries = []

          with manifest_path.open(encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      entries.append(json.loads(line))

          if not entries:
              raise SystemExit("Manifest is empty.")

          indexes = [x["index"] for x in entries]

          if indexes != list(range(1, len(entries) + 1)):
              raise SystemExit(
                  f"Manifest indexes are not continuous: {indexes}"
              )

          for entry in entries:
              patch = root / entry["patch_file"]

              if not patch.is_file():
                  raise SystemExit(
                      f"Patch file does not exist: {patch}"
                  )

              h = hashlib.sha256()

              with patch.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)

              actual_sha = h.hexdigest()

              if actual_sha != entry["patch_sha256"]:
                  raise SystemExit(
                      f"Patch SHA mismatch for {patch}: "
                      f"manifest={entry['patch_sha256']} "
                      f"actual={actual_sha}"
                  )

              if not patch.stat().st_size:
                  raise SystemExit(
                      f"Patch is empty: {patch}"
                  )

          print(f"Validated {len(entries)} patch entries.")
          PY

      # ------------------------------------------------------------
      # 8. Save the original target SHA
      #
      # This is used to prevent pushing over somebody else's changes.
      # ------------------------------------------------------------
      - name: Record target branch state
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          BASE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

          echo "Target branch: $TARGET_BRANCH"
          echo "Base SHA:      $BASE_SHA"

      # ------------------------------------------------------------
      # 9. Create isolated patch branch
      # ------------------------------------------------------------
      - name: Create isolated patch branch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BRANCH="patch-import/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "PATCH_BRANCH=$PATCH_BRANCH" >> "$GITHUB_ENV"

          git checkout -B "$PATCH_BRANCH" "$BASE_SHA"

          echo "Created:"
          git branch --show-current

      # ------------------------------------------------------------
      # 10. Apply patches and create commits
      #
      # Rules:
      #
      #   Author:
      #       use supplied author, otherwise use GitHub Actions
      #
      #   Subject:
      #       use supplied subject
      #       OR generate ONLY the missing subject from the diff
      #
      #   Body:
      #       use supplied body
      #       NEVER invent one
      #
      #   Diffstat:
      #       NEVER included in commit message
      #
      #   Source path:
      #       NEVER used as primary commit subject
      # ------------------------------------------------------------
      - name: Apply patches from manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest_path = (
              root
              / ".patch-work"
              / "manifest"
              / "manifest.jsonl"
          )

          target_commit_message = (
              os.environ.get("COMMIT_MESSAGE", "").strip()
          )

          ignore_whitespace = (
              os.environ.get(
                  "IGNORE_WHITESPACE",
                  "true",
              ).lower() == "true"
          )

          entries = []

          with manifest_path.open(
              encoding="utf-8"
          ) as f:
              for line in f:
                  if line.strip():
                      entries.append(
                          json.loads(line)
                      )

          if not entries:
              raise SystemExit("Manifest is empty.")

          single_patch = len(entries) == 1

          def run(command, **kwargs):
              print(
                  "+",
                  " ".join(str(x) for x in command),
              )

              return subprocess.run(
                  command,
                  check=True,
                  cwd=root,
                  **kwargs,
              )

          def output(command):
              return subprocess.check_output(
                  command,
                  cwd=root,
                  text=True,
                  stderr=subprocess.STDOUT,
          )

          def hash_file(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  for block in iter(
                      lambda: f.read(1024 * 1024),
                      b"",
                  ):
                      h.update(block)

              return h.hexdigest()

          def write_message(path, text):
              text = text.strip()

              if not text:
                  raise RuntimeError(
                      f"Empty commit message: {path}"
                  )

              path.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8",
              )

          def changed_paths():
              result = output([
                  "git",
                  "diff",
                  "--cached",
                  "--name-only",
                  "--find-renames",
                  "--find-copies",
              ])

              return [
                  x.strip()
                  for x in result.splitlines()
                  if x.strip()
              ]

          def staged_diff():
              return output([
                  "git",
                  "diff",
                  "--cached",
                  "--no-ext-diff",
                  "--unified=3",
              ])

          def path_basename(path):
              path = path.replace("\\", "/")
              return path.rstrip("/").split("/")[-1]

          def java_class_name(path):
              name = path_basename(path)

              if name.endswith(".java"):
                  return name[:-5]

              if "." in name:
                  return name.rsplit(".", 1)[0]

              return name

          def infer_subject_from_diff():
              """
              Deterministic subject generator.

              IMPORTANT:
                  This function generates ONLY a subject.

              It never creates:
                  - author
                  - body/comment

              The staged diff is the source of truth.
              """

              diff = staged_diff()
              paths = changed_paths()

              if not diff.strip():
                  raise RuntimeError(
                      "Cannot generate subject: staged diff is empty."
                  )

              added = 0
              removed = 0

              for line in diff.splitlines():
                  if line.startswith("+++ "):
                      continue

                  if line.startswith("--- "):
                      continue

                  if line.startswith("+"):
                      added += 1

                  elif line.startswith("-"):
                      removed += 1

              # Detect common Java/Kotlin method/class changes.
              symbols = []

              for line in diff.splitlines():
                  if not line.startswith("@@"):
                      continue

                  match = re.search(
                      r"@@.*@@\s*(.*)$",
                      line,
                  )

                  if match:
                      symbol = match.group(1).strip()

                      if symbol:
                          symbols.append(symbol)

              # Prefer semantic information from the hunk.
              if symbols:
                  symbol = symbols[0]

                  # Common Java method signature.
                  method = re.search(
                      r"([A-Za-z_$][\w$]*)\s*\(",
                      symbol,
                  )

                  if method:
                      method_name = method.group(1)

                      if added and not removed:
                          return (
                              f"Update {method_name}"
                          )

                      if removed and not added:
                          return (
                              f"Remove {method_name}"
                          )

                      return (
                          f"Update {method_name}"
                      )

              # Class/file based fallback.
              if len(paths) == 1:
                  name = java_class_name(paths[0])

                  if added and not removed:
                      return f"Add {name}"

                  if removed and not added:
                      return f"Remove {name}"

                  return f"Update {name}"

              if paths:
                  names = [
                      java_class_name(p)
                      for p in paths[:3]
                  ]

                  if len(names) == 1:
                      return f"Update {names[0]}"

                  if len(names) == 2:
                      return (
                          f"Update {names[0]} and {names[1]}"
                      )

                  return (
                      f"Update {names[0]}, "
                      f"{names[1]} and {len(paths) - 2} more"
                  )

              raise RuntimeError(
                  "Unable to generate a commit subject."
              )

          for entry in entries:
              index = entry["index"]

              patch_path = root / entry["patch_file"]

              if not patch_path.is_file():
                  raise RuntimeError(
                      f"[{index}] Missing patch: {patch_path}"
                  )

              actual_sha = hash_file(patch_path)

              if actual_sha != entry["patch_sha256"]:
                  raise RuntimeError(
                      f"[{index}] Patch SHA mismatch."
                  )

              print()
              print("=" * 80)
              print(f"Applying patch #{index}")
              print(
                  f"Source:  {entry['source_file']}"
              )
              print(
                  f"Subject: "
                  f"{entry.get('subject') or '(missing)'}"
              )
              print(
                  f"Author:  "
                  f"{entry.get('author_name') or '(not supplied)'} "
                  f"<{entry.get('author_email') or 'not supplied'}>"
              )
              print(
                  f"Body:    "
                  f"{'yes' if entry.get('body', '').strip() else 'no'}"
              )
              print("=" * 80)

              apply_args = [
                  "git",
                  "apply",
                  "--index",
              ]

              if ignore_whitespace:
                  apply_args.append(
                      "--ignore-whitespace"
                  )

              apply_args.append(
                  str(patch_path)
              )

              run(apply_args)

              staged_check = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                  ],
                  cwd=root,
              )

              if staged_check.returncode == 0:
                  raise RuntimeError(
                      f"[{index}] Patch produced no staged changes."
                  )

              # ------------------------------------------------------
              # Subject
              # ------------------------------------------------------

              supplied_subject = (
                  entry.get("subject", "")
                  .strip()
              )

              if supplied_subject:
                  subject = supplied_subject
                  subject_source = "patch"

              else:
                  subject = infer_subject_from_diff()
                  subject_source = "generated"

              subject = subject.strip()

              if not subject:
                  raise RuntimeError(
                      f"[{index}] Unable to construct commit subject."
                  )

              # ------------------------------------------------------
              # Body
              #
              # NEVER generate a body.
              # ------------------------------------------------------

              body = (
                  entry.get("body", "")
                  .strip()
              )

              if body:
                  message = (
                      f"{subject}\n\n{body}"
                  )
              else:
                  message = subject

              # ------------------------------------------------------
              # Optional workflow override
              # ------------------------------------------------------

              if single_patch and target_commit_message:
                  message = target_commit_message
                  message_source = (
                      "workflow input commit_message"
                  )
              else:
                  message_source = (
                      "patch metadata"
                      if supplied_subject
                      else "generated subject"
                  )

              message_file = (
                  root
                  / ".patch-work"
                  / "manifest"
                  / f"commit-{index:04d}.txt"
              )

              write_message(
                  message_file,
                  message,
              )

              # ------------------------------------------------------
              # Commit
              # ------------------------------------------------------

              commit_args = [
                  "git",
                  "commit",
                  "--no-verify",
                  "-F",
                  str(message_file),
              ]

              author_name = (
                  entry.get(
                      "author_name",
                      "",
                  ).strip()
              )

              author_email = (
                  entry.get(
                      "author_email",
                      "",
                  ).strip()
              )

              author_date = (
                  entry.get(
                      "author_date",
                      "",
                  ).strip()
              )

              # Only override author when BOTH values exist.
              # Otherwise GitHub Actions' configured identity remains.
              if author_name and author_email:
                  commit_args.extend([
                      "--author",
                      (
                          f"{author_name} "
                          f"<{author_email}>"
                      ),
                  ])

              if author_date:
                  commit_args.extend([
                      "--date",
                      author_date,
                  ])

              print(
                  f"Subject source: {subject_source}"
              )

              print(
                  f"Message source: {message_source}"
              )

              run(commit_args)

              # ------------------------------------------------------
              # Verify commit
              # ------------------------------------------------------

              actual_subject = output([
                  "git",
                  "show",
                  "-s",
                  "--format=%s",
                  "HEAD",
              ]).strip()

              actual_body = output([
                  "git",
                  "show",
                  "-s",
                  "--format=%B",
                  "HEAD",
              ]).strip()

              actual_author_name = output([
                  "git",
                  "show",
                  "-s",
                  "--format=%an",
                  "HEAD",
              ]).strip()

              actual_author_email = output([
                  "git",
                  "show",
                  "-s",
                  "--format=%ae",
                  "HEAD",
              ]).strip()

              if actual_subject != subject:
                  raise RuntimeError(
                      f"[{index}] Subject mismatch.\n"
                      f"Expected: {subject!r}\n"
                      f"Actual:   {actual_subject!r}"
                  )

              expected_message = message.strip()

              if actual_body != expected_message:
                  raise RuntimeError(
                      f"[{index}] Commit message mismatch.\n"
                      f"Expected:\n{expected_message}\n"
                      f"Actual:\n{actual_body}"
                  )

              if author_name:
                  if actual_author_name != author_name:
                      raise RuntimeError(
                          f"[{index}] Author name mismatch.\n"
                          f"Expected: {author_name!r}\n"
                          f"Actual:   {actual_author_name!r}"
                      )

              if author_email:
                  if (
                      actual_author_email.lower()
                      != author_email.lower()
                  ):
                      raise RuntimeError(
                          f"[{index}] Author email mismatch.\n"
                          f"Expected: {author_email!r}\n"
                          f"Actual:   {actual_author_email!r}"
                      )

              print(
                  f"Created commit: "
                  f"{output(['git', 'rev-parse', 'HEAD']).strip()}"
              )

              # ------------------------------------------------------
              # Ensure the commit consumed the staged changes.
              # ------------------------------------------------------

              status = output([
                  "git",
                  "status",
                  "--porcelain",
                  "--untracked-files=no",
              ]).strip()

              if status:
                  raise RuntimeError(
                      f"[{index}] Repository is dirty after commit:\n"
                      f"{status}"
                  )

          print()
          print("All patches were applied successfully.")
          PY

      # ------------------------------------------------------------
      # 11. Verify imported commit count and metadata
      # ------------------------------------------------------------
      - name: Verify imported commits
        shell: bash
        run: |
          set -euo pipefail

          PATCH_COUNT="$(wc -l < .patch-work/manifest/manifest.jsonl | tr -d ' ')"

          ACTUAL_COUNT="$(
            git rev-list \
              --count \
              "${BASE_SHA}..HEAD"
          )"

          echo "Manifest patches: $PATCH_COUNT"
          echo "Created commits:  $ACTUAL_COUNT"

          if [[ "$ACTUAL_COUNT" != "$PATCH_COUNT" ]]; then
            echo "::error::Expected $PATCH_COUNT imported commits, got $ACTUAL_COUNT."
            exit 1
          fi

          echo
          echo "Imported history:"
          git log \
            --format='%h | %an <%ae> | %ad | %s' \
            --date=iso-strict \
            "${BASE_SHA}..HEAD"

      # ------------------------------------------------------------
      # 12. Apply selected final strategy
      # ------------------------------------------------------------
      - name: Apply final history strategy
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BRANCH="$(git branch --show-current)"

          echo "Patch branch: $PATCH_BRANCH"
          echo "Strategy:     $STRATEGY"

          case "$STRATEGY" in

            commit)
              echo "Keeping individual patch commits."
              ;;

            squash)
              echo "Creating one squashed commit."

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              git merge --squash "$PATCH_BRANCH"

              if git diff --cached --quiet; then
                echo "::error::Squash produced no changes."
                exit 1
              fi

              if [[ -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="$(
                  python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest = root / ".patch-work" / "manifest" / "manifest.jsonl"

          entries = []

          with manifest.open(encoding="utf-8") as f:
              for line in f:
                  if line.strip():
                      entries.append(json.loads(line))

          subjects = [
              x.get("subject", "").strip()
              for x in entries
              if x.get("subject", "").strip()
          ]

          if subjects:
              first = subjects[0]

              if len(subjects) == 1:
                  print(first)
              else:
                  print(first)
                  print()
                  print("Applied patch series:")
                  for subject in subjects:
                      print(f"- {subject}")
          else:
              print("Update files")
          PY
                  )"
              fi

              if [[ -z "${FINAL_MESSAGE//[[:space:]]/}" ]]; then
                echo "::error::Generated squash commit message is empty."
                exit 1
              fi

              printf '%s\n' "$FINAL_MESSAGE" \
                > .patch-work/manifest/final-message.txt

              git commit \
                --no-verify \
                -F .patch-work/manifest/final-message.txt
              ;;

            merge)
              echo "Creating merge commit."

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              if [[ -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="$(
                  python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest = root / ".patch-work" / "manifest" / "manifest.jsonl"

          subjects = []

          with manifest.open(encoding="utf-8") as f:
              for line in f:
                  if line.strip():
                      obj = json.loads(line)
                      subject = obj.get("subject", "").strip()
                      if subject:
                          subjects.append(subject)

          if subjects:
              print(f"Merge patch series: {subjects[0]}")
          else:
              print("Merge applied patch series")
          PY
                  )"
              fi

              if [[ -z "${FINAL_MESSAGE//[[:space:]]/}" ]]; then
                echo "::error::Generated merge commit message is empty."
                exit 1
              fi

              printf '%s\n' "$FINAL_MESSAGE" \
                > .patch-work/manifest/final-message.txt

              git merge \
                --no-ff \
                --no-edit \
                "$PATCH_BRANCH"

              # Replace Git's automatically generated merge message only
              # when the user explicitly requested one or when our generated
              # deterministic message differs.
              git commit \
                --amend \
                --no-edit \
                -F .patch-work/manifest/final-message.txt
              ;;

            cherry-pick)
              echo "Replaying patch commits with cherry-pick."

              mapfile -t COMMITS < <(
                git rev-list \
                  --reverse \
                  "${BASE_SHA}..${PATCH_BRANCH}"
              )

              if [[ "${#COMMITS[@]}" -eq 0 ]]; then
                echo "::error::No commits available for cherry-pick."
                exit 1
              fi

              git checkout -B "$TARGET_BRANCH" "$BASE_SHA"

              for commit in "${COMMITS[@]}"; do
                echo "Cherry-picking $commit"

                git cherry-pick \
                  --no-commit \
                  "$commit"

                if git diff --cached --quiet; then
                  echo "::error::Cherry-pick $commit produced no changes."
                  exit 1
                fi

                git commit \
                  --no-verify \
                  -C "$commit"
              done

              # If there is exactly one patch and an explicit commit_message
              # was supplied, it is allowed to override that one commit.
              if [[ "${#COMMITS[@]}" -eq 1 && -n "${COMMIT_MESSAGE//[[:space:]]/}" ]]; then
                printf '%s\n' "$COMMIT_MESSAGE" \
                  > .patch-work/manifest/final-message.txt

                git commit \
                  --amend \
                  --no-verify \
                  -F .patch-work/manifest/final-message.txt
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # 13. Final validation
      # ------------------------------------------------------------
      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch:"
          git branch --show-current

          echo
          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "History:"
          git log \
            --graph \
            --decorate \
            --oneline \
            -n 30

          echo
          echo "Working tree:"
          git status --short

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Working tree is dirty."
            exit 1
          fi

          SUBJECTS="$(
            git log \
              --format='%s' \
              "${BASE_SHA}..HEAD"
          )"

          if printf '%s\n' "$SUBJECTS" | grep -q '^$'; then
            echo "::error::At least one resulting commit has an empty subject."
            exit 1
          fi

      # ------------------------------------------------------------
      # 14. Verify target branch did not move
      #
      # Normal push is intentionally used.
      #
      # Because the resulting branch was created from BASE_SHA,
      # a normal push will be rejected if someone changed the target
      # branch while this workflow was running.
      # ------------------------------------------------------------
      - name: Verify remote target is unchanged
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "Expected remote SHA: $BASE_SHA"
          echo "Current remote SHA:  $CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$BASE_SHA" ]]; then
            echo "::error::Target branch changed while the workflow was running."
            echo "::error::Nothing will be pushed."
            exit 1
          fi

      # ------------------------------------------------------------
      # 15. Push only after ALL validation succeeded
      # ------------------------------------------------------------
      - name: Push final history
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing:"
          echo "  HEAD -> $TARGET_BRANCH"

          git push \
            origin \
            "HEAD:refs/heads/${TARGET_BRANCH}"

      # ------------------------------------------------------------
      # 16. Print resulting history after push
      # ------------------------------------------------------------
      - name: Show final result
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          echo
          echo "Final remote HEAD:"
          git rev-parse "origin/$TARGET_BRANCH"

          echo
          echo "Final imported history:"
          git log \
            --graph \
            --decorate \
            --format='%h | %an <%ae> | %ad | %s' \
            --date=iso-strict \
            -n 30 \
            "origin/$TARGET_BRANCH"
