name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patch to"
        required: true
        type: string

      patch_url:
        description: "Patch, archive, or GitHub Actions artifact URL"
        required: true
        type: string

      commit_message:
        description: "Commit message override for a plain patch or squash/merge commit (optional)"
        required: false
        type: string
        default: ""

      strategy:
        description: "How to create the resulting history"
        required: true
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
        default: commit

      ignore_whitespace:
        description: "Ignore whitespace differences"
        required: true
        type: boolean
        default: true

concurrency:
  group: apply-patch-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  apply-patch:
    name: Apply patch
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout target branch
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      # ============================================================
      # 2. Configure Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "TARGET_BRANCH=$(git branch --show-current)" >> "$GITHUB_ENV"

          echo "========================================"
          echo "TARGET BRANCH"
          echo "========================================"
          git branch --show-current

          echo
          echo "========================================"
          echo "CURRENT HEAD"
          echo "========================================"
          git log -1 --oneline --decorate

          echo
          echo "========================================"
          echo "GIT VERSION"
          echo "========================================"
          git --version

      # ============================================================
      # 3. Make sure working tree is clean
      # ============================================================

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

          echo "Working tree is clean."

      # ============================================================
      # 4. Download input
      #
      # Supports:
      #   - direct patch/diff URL
      #   - GitHub Actions artifact URL:
      #     /actions/runs/RUN_ID/artifacts/ARTIFACT_ID
      # ============================================================

      - name: Download patch or artifact
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/patch-work"

          mkdir -p "$WORK_DIR"

          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

          DOWNLOAD="$WORK_DIR/input.bin"

          echo "Input:"
          echo "$PATCH_URL"
          echo

          if [[ "$PATCH_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+)/?$ ]]; then

            OWNER="${BASH_REMATCH[1]}"
            REPO="${BASH_REMATCH[2]}"
            RUN_ID="${BASH_REMATCH[3]}"
            ARTIFACT_ID="${BASH_REMATCH[4]}"

            echo "Detected GitHub Actions artifact URL."
            echo "Repository: $OWNER/$REPO"
            echo "Run ID:      $RUN_ID"
            echo "Artifact ID: $ARTIFACT_ID"

            API="https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API" \
              > "$WORK_DIR/artifact.json"

            ARTIFACT_RUN_ID="$(
              jq -r '.workflow_run.id // empty' \
              "$WORK_DIR/artifact.json"
            )"

            EXPIRED="$(
              jq -r '.expired // true' \
              "$WORK_DIR/artifact.json"
            )"

            ARCHIVE_URL="$(
              jq -r '.archive_download_url // empty' \
              "$WORK_DIR/artifact.json"
            )"

            if [ -z "$ARTIFACT_RUN_ID" ] || [ -z "$ARCHIVE_URL" ]; then
              echo "::error::GitHub API did not return valid artifact metadata."
              cat "$WORK_DIR/artifact.json"
              exit 1
            fi

            if [ "$ARTIFACT_RUN_ID" != "$RUN_ID" ]; then
              echo "::error::Artifact $ARTIFACT_ID does not belong to workflow run $RUN_ID."
              echo "Actual run: $ARTIFACT_RUN_ID"
              exit 1
            fi

            if [ "$EXPIRED" = "true" ]; then
              echo "::error::GitHub Actions artifact $ARTIFACT_ID is expired."
              exit 1
            fi

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$ARCHIVE_URL" \
              --output "$DOWNLOAD"

          else

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              --output "$DOWNLOAD" \
              "$PATCH_URL"

          fi

          if [ ! -s "$DOWNLOAD" ]; then
            echo "::error::Downloaded input is empty."
            exit 1
          fi

          echo
          echo "Downloaded input:"
          ls -lh "$DOWNLOAD"

          echo
          echo "File type:"
          file "$DOWNLOAD"

      # ============================================================
      # 5. Detect and unpack archives
      #
      # Supports:
      #   ZIP
      #   TAR
      #   TAR.GZ
      #   TAR.XZ
      #   TAR.BZ2
      #   standalone GZIP/XZ/BZIP2
      # ============================================================

      - name: Detect and unpack input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$WORK_DIR/input.bin"
          SOURCE="$WORK_DIR/source"
          EXTRACTED="$WORK_DIR/extracted"

          mkdir -p "$SOURCE"
          mkdir -p "$EXTRACTED"

          TYPE="$(file -b "$INPUT")"

          echo "Detected file type:"
          echo "$TYPE"

          case "$TYPE" in

            Zip\ archive*)
              unzip -q "$INPUT" -d "$EXTRACTED"
              cp -a "$EXTRACTED"/. "$SOURCE"/
              echo "INPUT_KIND=archive" >> "$GITHUB_ENV"
              ;;

            POSIX\ tar\ archive*|GNU\ tar\ archive*|ustar\ archive*)
              tar -xf "$INPUT" -C "$EXTRACTED"
              cp -a "$EXTRACTED"/. "$SOURCE"/
              echo "INPUT_KIND=archive" >> "$GITHUB_ENV"
              ;;

            gzip\ compressed\ data*)
              if tar -tzf "$INPUT" >/dev/null 2>&1; then
                tar -xzf "$INPUT" -C "$EXTRACTED"
                cp -a "$EXTRACTED"/. "$SOURCE"/
                echo "INPUT_KIND=archive" >> "$GITHUB_ENV"
              else
                gunzip -c "$INPUT" > "$SOURCE/input.patch"
                echo "INPUT_KIND=single" >> "$GITHUB_ENV"
              fi
              ;;

            XZ\ compressed\ data*)
              if tar -tJf "$INPUT" >/dev/null 2>&1; then
                tar -xJf "$INPUT" -C "$EXTRACTED"
                cp -a "$EXTRACTED"/. "$SOURCE"/
                echo "INPUT_KIND=archive" >> "$GITHUB_ENV"
              else
                xz -dc "$INPUT" > "$SOURCE/input.patch"
                echo "INPUT_KIND=single" >> "$GITHUB_ENV"
              fi
              ;;

            bzip2\ compressed\ data*)
              if tar -tjf "$INPUT" >/dev/null 2>&1; then
                tar -xjf "$INPUT" -C "$EXTRACTED"
                cp -a "$EXTRACTED"/. "$SOURCE"/
                echo "INPUT_KIND=archive" >> "$GITHUB_ENV"
              else
                bzip2 -dc "$INPUT" > "$SOURCE/input.patch"
                echo "INPUT_KIND=single" >> "$GITHUB_ENV"
              fi
              ;;

            *)
              cp "$INPUT" "$SOURCE/input.patch"
              echo "INPUT_KIND=single" >> "$GITHUB_ENV"
              ;;

          esac

          echo
          echo "Source tree:"
          find "$SOURCE" -type f -print | sort

      # ============================================================
      # 6. Find patch inputs
      #
      # Finds:
      #   - .patch
      #   - .diff
      #   - format-patch / mbox
      #   - extensionless Git patches
      # ============================================================

      - name: Find patch inputs
        shell: bash
        run: |
          set -euo pipefail

          PATCH_LIST="$WORK_DIR/patch-list.txt"

          : > "$PATCH_LIST"

          while IFS= read -r -d '' FILE; do

            if grep -qE \
              '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' \
              "$FILE" 2>/dev/null \
              || grep -qE '^diff --git ' "$FILE" 2>/dev/null \
              || grep -qE '^Index: ' "$FILE" 2>/dev/null; then

              printf '%s\n' "$FILE" >> "$PATCH_LIST"

            fi

          done < <(
            find "$SOURCE" \
              -type f \
              -print0 |
            sort -z
          )

          if [ ! -s "$PATCH_LIST" ]; then
            echo "::error::No Git patch or format-patch file was found."
            exit 1
          fi

          echo "PATCH_LIST=$PATCH_LIST" >> "$GITHUB_ENV"

          echo
          echo "Patch inputs:"
          nl -ba "$PATCH_LIST"

      # ============================================================
      # 7. Classify patch inputs
      #
      # MAILBOX = format-patch/mbox
      # DIFF    = plain unified diff
      #
      # Mixing the two is rejected because their commit semantics
      # are different.
      # ============================================================

      - name: Classify patch inputs
        shell: bash
        run: |
          set -euo pipefail

          MAILBOX_COUNT=0
          DIFF_COUNT=0

          CLASS_FILE="$WORK_DIR/patch-classes.txt"

          : > "$CLASS_FILE"

          while IFS= read -r FILE; do

            if grep -qE \
              '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' \
              "$FILE" 2>/dev/null; then

              KIND="mailbox"
              MAILBOX_COUNT=$((MAILBOX_COUNT + 1))

            else

              KIND="diff"
              DIFF_COUNT=$((DIFF_COUNT + 1))

            fi

            printf '%s\t%s\n' "$KIND" "$FILE" >> "$CLASS_FILE"

          done < "$PATCH_LIST"

          if [ "$MAILBOX_COUNT" -gt 0 ] && [ "$DIFF_COUNT" -gt 0 ]; then
            echo "::error::The input contains both format-patch mailboxes and plain diffs."
            echo "Mixing them automatically would make commit history ambiguous."
            cat "$CLASS_FILE"
            exit 1
          fi

          if [ "$MAILBOX_COUNT" -gt 0 ]; then
            echo "PATCH_SET_KIND=mailbox" >> "$GITHUB_ENV"
          else
            echo "PATCH_SET_KIND=diff" >> "$GITHUB_ENV"
          fi

          echo "PATCH_CLASS_FILE=$CLASS_FILE" >> "$GITHUB_ENV"

          echo
          echo "Patch classification:"
          cat "$CLASS_FILE"

      # ============================================================
      # 8. Prepare patch series
      #
      # IMPORTANT:
      #
      # We do NOT concatenate format-patch files into one diff.
      #
      # git am preserves:
      #   - author
      #   - author date
      #   - subject
      #   - commit message
      #   - individual commit boundaries
      # ============================================================

      - name: Prepare patch series
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
        run: |
          set -euo pipefail

          BASE_COMMIT="$(git rev-parse HEAD)"

          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

          TEMP_BRANCH="patch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"

          git switch -c "$TEMP_BRANCH"

          if [ "$PATCH_SET_KIND" = "mailbox" ]; then

            echo "Preparing format-patch series with git am."

            MAILBOX_FILES=()

            while IFS=$'\t' read -r KIND FILE; do

              [ "$KIND" = "mailbox" ] || continue

              MAILBOX_FILES+=("$FILE")

            done < "$PATCH_CLASS_FILE"

            if [ "${#MAILBOX_FILES[@]}" -eq 0 ]; then
              echo "::error::No mailbox files were found."
              exit 1
            fi

            # Do not use --3way here.
            #
            # Some supplied patches contain zero/fake blob indexes.
            # Those indexes cannot be used for a three-way merge.
            #
            # Normal git-am application still preserves the original
            # author and commit message.

            git am \
              --no-3way \
              --empty=keep \
              --whitespace=nowarn \
              "${MAILBOX_FILES[@]}"

          else

            echo "Preparing plain diff series."

            COUNT=0

            while IFS=$'\t' read -r KIND FILE; do

              [ "$KIND" = "diff" ] || continue

              COUNT=$((COUNT + 1))

              NAME="$(basename "$FILE")"

              ARGS=(
                --verbose
                --recount
                --whitespace=nowarn
              )

              if [ "$IGNORE_WHITESPACE" = "true" ]; then
                ARGS+=(
                  --ignore-space-change
                  --ignore-whitespace
                )
              fi

              echo
              echo "Applying plain patch #$COUNT:"
              echo "$NAME"

              git apply \
                "${ARGS[@]}" \
                "$FILE"

              git add -A

              if git diff --cached --quiet; then
                echo "::error::Patch '$NAME' produced no changes."
                exit 1
              fi

              if [ -n "$COMMIT_MESSAGE" ]; then
                git commit -m "$COMMIT_MESSAGE"
              else
                git commit \
                  --allow-empty-message \
                  -m ""
              fi

            done < "$PATCH_CLASS_FILE"

            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No plain patches were applied."
              exit 1
            fi

          fi

          PATCH_HEAD="$(git rev-parse HEAD)"

          echo "PATCH_HEAD=$PATCH_HEAD" >> "$GITHUB_ENV"

          echo
          echo "Prepared history:"
          git log \
            --oneline \
            --decorate \
            "$BASE_COMMIT..$PATCH_HEAD"

      # ============================================================
      # 9. Inspect prepared history
      # ============================================================

      - name: Inspect prepared history
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PATCH COMMITS"
          echo "========================================"

          git log \
            --reverse \
            --format='commit %H%nAuthor: %an <%ae>%nDate:   %aI%nSubject: %s%n' \
            "$BASE_COMMIT..$PATCH_HEAD"

          echo
          echo "Commit count:"
          git rev-list --count "$BASE_COMMIT..$PATCH_HEAD"

      # ============================================================
      # 10. Verify prepared changes
      # ============================================================

      - name: Verify prepared changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE_COMMIT" "$PATCH_HEAD"; then
            echo "::error::Patch series produced no changes."
            exit 1
          fi

          echo "Changed files:"
          git diff --name-status "$BASE_COMMIT" "$PATCH_HEAD"

          echo
          echo "Diff stat:"
          git diff --stat "$BASE_COMMIT" "$PATCH_HEAD"

      # ============================================================
      # 11. Verify no rejected files / no in-progress Git operation
      # ============================================================

      - name: Verify Git state
        shell: bash
        run: |
          set -euo pipefail

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              -not -path './.git/*' \
              -print
          )"

          if [ -n "$REJECTS" ]; then
            echo "::error::Rejected patch files were created:"
            echo "$REJECTS"
            exit 1
          fi

          if [ -d .git/rebase-apply ] \
            || [ -d .git/rebase-merge ] \
            || [ -f .git/MERGE_HEAD ] \
            || [ -f .git/CHERRY_PICK_HEAD ]; then

            echo "::error::Git operation is still in progress."
            git status
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Prepared patch branch has uncommitted changes."
            git status --short
            exit 1
          fi

          echo "Git state is clean."

      # ============================================================
      # 12. Strategy validation
      #
      # TEMP_BRANCH contains the complete prepared history.
      # BASE_COMMIT is the target branch before applying patches.
      # ============================================================

      - name: Validate strategy
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            git rev-list \
              --count \
              "$BASE_COMMIT..$PATCH_HEAD"
          )"

          echo "Strategy:"
          echo "${{ inputs.strategy }}"

          echo
          echo "Prepared commits:"
          echo "$COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No prepared commits exist."
            exit 1
          fi

      # ============================================================
      # 13. Commit strategy
      #
      # format-patch:
      #   preserve every source commit.
      #
      # plain diff:
      #   use the synthetic commit created in Stage 8.
      #
      # commit_message is only an override for plain diffs.
      # ============================================================

      - name: Apply commit strategy
        if: inputs.strategy == 'commit'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git merge \
            --ff-only \
            "$TEMP_BRANCH"

          echo
          echo "Commit strategy completed."

          git log \
            -10 \
            --oneline \
            --decorate

      # ============================================================
      # 14. Squash strategy
      #
      # Collapse all prepared commits into one commit.
      #
      # Explicit commit_message wins.
      # Empty commit_message intentionally creates an empty message.
      # ============================================================

      - name: Apply squash strategy
        if: inputs.strategy == 'squash'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git merge \
            --squash \
            "$TEMP_BRANCH"

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Squash produced no staged changes."
            exit 1
          fi

          if [ -n "$COMMIT_MESSAGE" ]; then
            git commit \
              -m "$COMMIT_MESSAGE"
          else
            git commit \
              --allow-empty-message \
              -m ""
          fi

          echo
          echo "Squash completed."

          git log \
            -3 \
            --oneline \
            --decorate

      # ============================================================
      # 15. Merge strategy
      #
      # Keep the complete patch history on TEMP_BRANCH and create
      # a real merge commit on the target branch.
      # ============================================================

      - name: Apply merge strategy
        if: inputs.strategy == 'merge'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          if [ -n "$COMMIT_MESSAGE" ]; then

            git merge \
              --no-ff \
              --no-edit \
              "$TEMP_BRANCH" \
              -m "$COMMIT_MESSAGE"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$TEMP_BRANCH" \
              -m ""

          fi

          echo
          echo "Merge completed."

          git log \
            -10 \
            --oneline \
            --decorate \
            --graph

      # ============================================================
      # 16. Cherry-pick strategy
      #
      # Cherry-pick every prepared commit individually.
      #
      # This keeps the source series as separate commits on target.
      # ============================================================

      - name: Apply cherry-pick strategy
        if: inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          mapfile -t COMMITS < <(
            git rev-list \
              --reverse \
              "$BASE_COMMIT..$PATCH_HEAD"
          )

          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "::error::No commits available for cherry-pick."
            exit 1
          fi

          for COMMIT in "${COMMITS[@]}"; do

            echo
            echo "Cherry-picking:"
            git show \
              --no-patch \
              --format='%H %s' \
              "$COMMIT"

            git cherry-pick "$COMMIT"

          done

          echo
          echo "Cherry-pick completed."

          git log \
            -10 \
            --oneline \
            --decorate

      # ============================================================
      # 17. Final verification
      # ============================================================

      - name: Final verification
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          echo "========================================"
          echo "FINAL BRANCH"
          echo "========================================"

          git branch --show-current

          echo
          echo "========================================"
          echo "FINAL HEAD"
          echo "========================================"

          git log \
            -1 \
            --oneline \
            --decorate

          echo
          echo "========================================"
          echo "FINAL HISTORY"
          echo "========================================"

          git log \
            -10 \
            --oneline \
            --decorate

          echo
          echo "========================================"
          echo "FINAL STATUS"
          echo "========================================"

          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            exit 1
          fi

          git diff \
            --check \
            "$BASE_COMMIT" \
            HEAD

          echo
          echo "Working tree is clean."

      # ============================================================
      # 18. Verify resulting commits
      # ============================================================

      - name: Verify resulting commits
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          RESULT_COUNT="$(
            git rev-list \
              --count \
              "$BASE_COMMIT..HEAD"
          )"

          echo "Resulting commit count:"
          echo "$RESULT_COUNT"

          echo
          echo "Resulting commits:"

          git log \
            --reverse \
            --format='%h | %an <%ae> | %aI | %s' \
            "$BASE_COMMIT..HEAD"

          if [ "${{ inputs.strategy }}" = "squash" ]; then

            if [ "$RESULT_COUNT" -ne 1 ]; then
              echo "::error::Squash strategy produced $RESULT_COUNT commits instead of exactly 1."
              exit 1
            fi

          fi

      # ============================================================
      # 19. Push target branch
      #
      # Normal push is intentional.
      #
      # If target branch changed after checkout, push fails instead
      # of overwriting remote history.
      # ============================================================

      - name: Push target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:$TARGET_BRANCH"

          echo
          echo "Successfully pushed:"
          echo "$TARGET_BRANCH"
