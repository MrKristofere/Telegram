name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patch to"
        required: true
        type: string

      patch_url:
        description: "Direct URL to a patch, diff, or archive containing patches"
        required: true
        type: string

      commit_message:
        description: "Commit message (optional)"
        required: false
        type: string
        default: ""

      strategy:
        description: "How to create the resulting history"
        required: true
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
        default: commit

      ignore_whitespace:
        description: "Ignore whitespace differences"
        required: true
        type: boolean
        default: true

concurrency:
  group: apply-patch-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  apply-patch:
    name: Apply patch
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout target branch
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0


      # ============================================================
      # 2. Configure Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "TARGET BRANCH"
          echo "========================================"

          git branch --show-current

          echo
          echo "========================================"
          echo "CURRENT HEAD"
          echo "========================================"

          git log -1 --oneline --decorate

          echo
          echo "========================================"
          echo "GIT VERSION"
          echo "========================================"

          git --version

          echo
          echo "========================================"
          echo "WORKING TREE"
          echo "========================================"

          git status --short


      # ============================================================
      # 3. Make sure working tree is clean
      # ============================================================

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

          echo "Working tree is clean."


      # ============================================================
      # 4. Download patch, archive or GitHub Actions artifact
      # ============================================================

      - name: Download patch or archive
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PATCH_DIR="$RUNNER_TEMP/patch"
          INPUT_FILE="$PATCH_DIR/input"

          mkdir -p "$PATCH_DIR"

          echo "Downloading:"
          echo "$PATCH_URL"

          # ========================================================
          # GitHub Actions Artifact URL
          #
          # Example:
          #
          # https://github.com/OWNER/REPO/actions/runs/RUN_ID/artifacts/ARTIFACT_ID
          # ========================================================

          if [[ "$PATCH_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+)(/.*)?$ ]]; then

            OWNER="${BASH_REMATCH[1]}"
            REPO="${BASH_REMATCH[2]}"
            RUN_ID="${BASH_REMATCH[3]}"
            ARTIFACT_ID="${BASH_REMATCH[4]}"

            echo
            echo "========================================"
            echo "GITHUB ACTIONS ARTIFACT"
            echo "========================================"

            echo "Owner:        $OWNER"
            echo "Repository:   $REPO"
            echo "Run ID:       $RUN_ID"
            echo "Artifact ID:  $ARTIFACT_ID"

            API_BASE="https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID"

            ARTIFACT_JSON="$PATCH_DIR/artifact.json"

            # ------------------------------------------------------
            # Get artifact metadata.
            # ------------------------------------------------------

            echo
            echo "Getting artifact metadata..."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API_BASE" \
              -o "$ARTIFACT_JSON"

            # ------------------------------------------------------
            # Verify artifact belongs to supplied workflow run.
            # ------------------------------------------------------

            FOUND_RUN_ID="$(
              python3 - "$ARTIFACT_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          workflow_run = data.get("workflow_run") or {}

          print(workflow_run.get("id", ""))
          PY
            )"

            if [ -n "$FOUND_RUN_ID" ] && [ "$FOUND_RUN_ID" != "$RUN_ID" ]; then
              echo "::error::Artifact $ARTIFACT_ID does not belong to workflow run $RUN_ID."
              echo "Actual workflow run: $FOUND_RUN_ID"
              exit 1
            fi

            # ------------------------------------------------------
            # Check artifact expiration.
            # ------------------------------------------------------

            EXPIRED="$(
              python3 - "$ARTIFACT_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(str(data.get("expired", False)).lower())
          PY
            )"

            if [ "$EXPIRED" = "true" ]; then
              echo "::error::GitHub Actions artifact $ARTIFACT_ID has expired."
              exit 1
            fi

            # ------------------------------------------------------
            # Download actual artifact ZIP.
            # ------------------------------------------------------

            DOWNLOAD_URL="$API_BASE/zip"

            echo
            echo "Downloading artifact ZIP..."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$DOWNLOAD_URL" \
              -o "$INPUT_FILE"

            echo "GitHub Actions artifact downloaded."

          else

            # ======================================================
            # Normal URL
            # ======================================================

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              --output "$INPUT_FILE" \
              "$PATCH_URL"

          fi

          # ========================================================
          # Verify download
          # ========================================================

          if [ ! -s "$INPUT_FILE" ]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          echo
          echo "========================================"
          echo "DOWNLOADED FILE"
          echo "========================================"

          ls -lh "$INPUT_FILE"

          echo
          echo "File type:"
          file "$INPUT_FILE"

          echo
          echo "First bytes:"
          xxd -l 32 "$INPUT_FILE" || true


      # ============================================================
      # 5. Detect patch or archive
      # ============================================================

      - name: Detect patch or archive
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$RUNNER_TEMP/patch/input"
          EXTRACT_DIR="$RUNNER_TEMP/patch/extracted"

          mkdir -p "$EXTRACT_DIR"

          FILE_TYPE="$(file -b "$INPUT")"

          echo "========================================"
          echo "INPUT TYPE"
          echo "========================================"

          echo "$FILE_TYPE"

          echo

          # ========================================================
          # ZIP
          # ========================================================

          if file "$INPUT" | grep -qi 'Zip archive'; then

            echo "Detected ZIP archive."

            echo "INPUT_TYPE=archive" >> "$GITHUB_ENV"
            echo "ARCHIVE_TYPE=zip" >> "$GITHUB_ENV"

            unzip -q "$INPUT" -d "$EXTRACT_DIR"


          # ========================================================
          # TAR
          # ========================================================

          elif file "$INPUT" | grep -qi 'tar archive'; then

            echo "Detected TAR archive."

            echo "INPUT_TYPE=archive" >> "$GITHUB_ENV"
            echo "ARCHIVE_TYPE=tar" >> "$GITHUB_ENV"

            tar -xf "$INPUT" -C "$EXTRACT_DIR"


          # ========================================================
          # GZIP
          # ========================================================

          elif file "$INPUT" | grep -qi 'gzip compressed'; then

            if tar -tzf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.GZ archive."

              echo "INPUT_TYPE=archive" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=tar.gz" >> "$GITHUB_ENV"

              tar -xzf "$INPUT" -C "$EXTRACT_DIR"

            else

              echo "Detected standalone GZIP."

              echo "INPUT_TYPE=compressed_patch" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=gzip" >> "$GITHUB_ENV"

              cp "$INPUT" "$EXTRACT_DIR/input.gz"

              gunzip -f "$EXTRACT_DIR/input.gz"

            fi


          # ========================================================
          # XZ
          # ========================================================

          elif file "$INPUT" | grep -qi 'XZ compressed'; then

            if tar -tJf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.XZ archive."

              echo "INPUT_TYPE=archive" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=tar.xz" >> "$GITHUB_ENV"

              tar -xJf "$INPUT" -C "$EXTRACT_DIR"

            else

              echo "Detected standalone XZ."

              echo "INPUT_TYPE=compressed_patch" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=xz" >> "$GITHUB_ENV"

              cp "$INPUT" "$EXTRACT_DIR/input.xz"

              unxz -f "$EXTRACT_DIR/input.xz"

            fi


          # ========================================================
          # BZIP2
          # ========================================================

          elif file "$INPUT" | grep -qi 'bzip2 compressed'; then

            if tar -tjf "$INPUT" >/dev/null 2>&1; then

              echo "Detected TAR.BZ2 archive."

              echo "INPUT_TYPE=archive" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=tar.bz2" >> "$GITHUB_ENV"

              tar -xjf "$INPUT" -C "$EXTRACT_DIR"

            else

              echo "Detected standalone BZIP2."

              echo "INPUT_TYPE=compressed_patch" >> "$GITHUB_ENV"
              echo "ARCHIVE_TYPE=bzip2" >> "$GITHUB_ENV"

              cp "$INPUT" "$EXTRACT_DIR/input.bz2"

              bunzip2 -f "$EXTRACT_DIR/input.bz2"

            fi


          # ========================================================
          # Plain patch/diff
          # ========================================================

          else

            if grep -qE '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' "$INPUT"; then

              echo "Detected Git mailbox / format-patch."

              echo "INPUT_TYPE=patch" >> "$GITHUB_ENV"
              echo "PATCH_FORMAT=mailbox" >> "$GITHUB_ENV"

            elif grep -qE '^diff --git ' "$INPUT"; then

              echo "Detected Git unified diff."

              echo "INPUT_TYPE=patch" >> "$GITHUB_ENV"
              echo "PATCH_FORMAT=diff" >> "$GITHUB_ENV"

            else

              echo "::error::Downloaded file is neither a supported archive nor a Git patch."

              echo
              echo "File type:"
              file "$INPUT"

              exit 1

            fi

          fi


      # ============================================================
      # 6. Extract diff from patch / archive
      # ============================================================

      - name: Extract patch payload
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$RUNNER_TEMP/patch/input"
          EXTRACT_DIR="$RUNNER_TEMP/patch/extracted"
          PATCH_DIR="$RUNNER_TEMP/patch/patches"
          OUTPUT="$RUNNER_TEMP/patch/patch.diff"

          mkdir -p "$PATCH_DIR"

          rm -f "$OUTPUT"

          echo "========================================"
          echo "PREPARING PATCHES"
          echo "========================================"


          # ========================================================
          # Plain patch
          # ========================================================

          if [ "${INPUT_TYPE:-}" = "patch" ]; then

            cp "$INPUT" "$PATCH_DIR/0001-input.patch"


          # ========================================================
          # Standalone compressed patch
          # ========================================================

          elif [ "${INPUT_TYPE:-}" = "compressed_patch" ]; then

            FOUND=0

            while IFS= read -r FILE; do

              if grep -qE '^diff --git ' "$FILE" 2>/dev/null; then

                cp "$FILE" "$PATCH_DIR/0001-input.patch"
                FOUND=1
                break

              fi

              if grep -qE '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' "$FILE" 2>/dev/null; then

                cp "$FILE" "$PATCH_DIR/0001-input.patch"
                FOUND=1
                break

              fi

            done < <(
              find "$EXTRACT_DIR" \
                -type f \
                -print | sort
            )

            if [ "$FOUND" -eq 0 ]; then
              echo "::error::Compressed file does not contain a Git patch."
              exit 1
            fi


          # ========================================================
          # Archive
          # ========================================================

          elif [ "${INPUT_TYPE:-}" = "archive" ]; then

            echo "Searching archive recursively for patches."

            echo
            echo "Archive contents:"

            find "$EXTRACT_DIR" \
              -type f \
              -print | sort


            # ------------------------------------------------------
            # First collect files explicitly named .patch/.diff.
            # ------------------------------------------------------

            PATCH_INDEX=0

            while IFS= read -r FILE; do

              PATCH_INDEX=$((PATCH_INDEX + 1))

              BASENAME="$(basename "$FILE")"

              DEST="$PATCH_DIR/$(printf '%04d' "$PATCH_INDEX")-$BASENAME"

              echo
              echo "Found patch:"
              echo "$FILE"

              cp "$FILE" "$DEST"

            done < <(
              find "$EXTRACT_DIR" \
                -type f \
                \( \
                  -iname '*.patch' \
                  -o \
                  -iname '*.diff' \
                \) \
                -print | sort
            )


            # ------------------------------------------------------
            # Search files without .patch/.diff extension by content.
            # ------------------------------------------------------

            while IFS= read -r FILE; do

              BASENAME="$(basename "$FILE")"

              case "$BASENAME" in
                *.patch|*.PATCH|*.diff|*.DIFF)
                  continue
                  ;;
              esac

              # Skip obvious binary files.
              if ! grep -Iq . "$FILE" 2>/dev/null; then
                continue
              fi


              # ----------------------------------------------------
              # Git unified diff
              # ----------------------------------------------------

              if grep -qE '^diff --git ' "$FILE" 2>/dev/null; then

                PATCH_INDEX=$((PATCH_INDEX + 1))

                DEST="$PATCH_DIR/$(printf '%04d' "$PATCH_INDEX")-$BASENAME.patch"

                echo
                echo "Found patch by content:"
                echo "$FILE"

                cp "$FILE" "$DEST"


              # ----------------------------------------------------
              # Git mailbox
              # ----------------------------------------------------

              elif grep -qE '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' "$FILE" 2>/dev/null; then

                PATCH_INDEX=$((PATCH_INDEX + 1))

                DEST="$PATCH_DIR/$(printf '%04d' "$PATCH_INDEX")-$BASENAME.patch"

                echo
                echo "Found mailbox patch by content:"
                echo "$FILE"

                cp "$FILE" "$DEST"

              fi

            done < <(
              find "$EXTRACT_DIR" \
                -type f \
                -print | sort
            )


            if [ "$PATCH_INDEX" -eq 0 ]; then
              echo "::error::Archive does not contain any Git patches."
              exit 1
            fi


          else

            echo "::error::Unknown input type."
            exit 1

          fi


          # ========================================================
          # Show discovered files
          # ========================================================

          echo
          echo "========================================"
          echo "DISCOVERED PATCH FILES"
          echo "========================================"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print | sort


          PATCH_COUNT="$(
            find "$PATCH_DIR" \
              -maxdepth 1 \
              -type f \
              | wc -l
          )"

          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "::error::No patch files were found."
            exit 1
          fi


          # ========================================================
          # Combine patches
          # ========================================================

          echo
          echo "========================================"
          echo "BUILDING COMBINED PATCH"
          echo "========================================"

          : > "$OUTPUT"

          FINAL_INDEX=0

          while IFS= read -r PATCH; do

            FINAL_INDEX=$((FINAL_INDEX + 1))

            echo
            echo "Processing patch #$FINAL_INDEX:"
            echo "$PATCH"


            # ------------------------------------------------------
            # Git mailbox / format-patch
            # ------------------------------------------------------

            if grep -qE '^From [0-9a-fA-F]{40} Mon Sep 17 00:00:00 2001$' "$PATCH"; then

              echo "Format: Git mailbox / format-patch"

              awk '
                /^diff --git / {
                  started=1
                }

                started {
                  print
                }
              ' "$PATCH" >> "$OUTPUT"


            # ------------------------------------------------------
            # Normal unified diff
            # ------------------------------------------------------

            elif grep -qE '^diff --git ' "$PATCH"; then

              echo "Format: Git unified diff"

              cat "$PATCH" >> "$OUTPUT"


            else

              echo "::error::File does not contain a recognized Git patch:"
              echo "$PATCH"

              exit 1

            fi

            echo >> "$OUTPUT"

          done < <(
            find "$PATCH_DIR" \
              -maxdepth 1 \
              -type f \
              -print | sort
          )


          if [ ! -s "$OUTPUT" ]; then
            echo "::error::No diff payload was found."
            exit 1
          fi


          DIFF_COUNT="$(
            grep -c '^diff --git ' "$OUTPUT" || true
          )"

          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "::error::Combined patch contains no diff --git entries."
            exit 1
          fi


          echo
          echo "========================================"
          echo "PATCH PREPARATION COMPLETE"
          echo "========================================"

          echo "Patch files found: $PATCH_COUNT"
          echo "Diff sections:     $DIFF_COUNT"

          echo
          echo "Combined patch:"
          wc -l "$OUTPUT"


      # ============================================================
      # 7. Show patch structure
      # ============================================================

      - name: Inspect patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          echo "========================================"
          echo "PATCH FILES"
          echo "========================================"

          grep '^diff --git ' "$PATCH" || true

          echo
          echo "========================================"
          echo "PATCH HEADERS"
          echo "========================================"

          grep -nE '^(diff --git |new file mode |deleted file mode |old mode |new mode |--- |\+\+\+ |index |@@ )' "$PATCH" || true

          echo
          echo "========================================"
          echo "PATCH SIZE"
          echo "========================================"

          wc -l "$PATCH"


      # ============================================================
      # 8. Inspect fake indexes
      #
      # Informational only.
      # ============================================================

      - name: Inspect patch indexes
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          echo "Index lines:"
          grep -n '^index ' "$PATCH" || true

          if grep -qE '^index 0+\.0+([[:space:]]|$)' "$PATCH"; then

            echo
            echo "WARNING:"
            echo "Patch contains zero/fake blob indexes."
            echo "3-way application will not be attempted."

          fi


      # ============================================================
      # 9. Strict dry-run
      # ============================================================

      - name: Check patch applicability
        shell: bash
        env:
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          ARGS=(
            --check
            --recount
            --verbose
          )

          if [ "$IGNORE_WHITESPACE" = "true" ]; then

            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )

          fi

          echo "Running git apply --check..."

          if git apply "${ARGS[@]}" "$PATCH"; then

            echo
            echo "Patch passed strict applicability check."

          else

            echo
            echo "Strict check failed."
            echo "This does not necessarily mean that nothing can be applied."
            echo "The next step will use --reject."

          fi


      # ============================================================
      # 10. Apply patch
      # ============================================================

      - name: Apply patch
        shell: bash
        env:
          IGNORE_WHITESPACE: ${{ inputs.ignore_whitespace }}
        run: |
          set -uo pipefail

          PATCH="$RUNNER_TEMP/patch/patch.diff"

          ARGS=(
            --recount
            --reject
            --verbose
            --whitespace=nowarn
          )

          if [ "$IGNORE_WHITESPACE" = "true" ]; then

            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )

          fi

          echo "Applying patch..."

          git apply "${ARGS[@]}" "$PATCH"
          APPLY_EXIT=$?

          echo
          echo "git apply exit code: $APPLY_EXIT"

          echo
          echo "Working tree:"
          git status --short

          echo "PATCH_APPLY_EXIT=$APPLY_EXIT" >> "$GITHUB_ENV"

          # Don't fail yet.
          #
          # We first inspect .rej files.
          exit 0


      # ============================================================
      # 11. Detect rejected hunks
      # ============================================================

      - name: Check rejected hunks
        shell: bash
        run: |
          set -euo pipefail

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              -not -path './.git/*' \
              -print
          )"

          if [ -n "$REJECTS" ]; then

            echo "::error::Some patch hunks were rejected."

            echo
            echo "========================================"
            echo "REJECTED FILES"
            echo "========================================"

            echo "$REJECTS"

            while IFS= read -r FILE; do

              echo
              echo "========================================"
              echo "REJECTED HUNKS: $FILE"
              echo "========================================"

              cat "$FILE"

            done <<< "$REJECTS"

            echo
            echo "Patch was NOT committed."

            exit 1
          fi

          echo "No .rej files found."


      # ============================================================
      # 12. Check git apply exit code
      # ============================================================

      - name: Verify patch application
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PATCH_APPLY_EXIT:-1}" -ne 0 ]; then

            echo "::error::git apply returned exit code ${PATCH_APPLY_EXIT}."

            echo
            echo "Current working tree:"
            git status --short

            echo
            echo "Diff:"
            git diff --stat

            exit "$PATCH_APPLY_EXIT"
          fi

          echo "git apply completed successfully."


      # ============================================================
      # 13. Verify that patch actually changed something
      # ============================================================

      - name: Verify resulting changes
        shell: bash
        run: |
          set -euo pipefail

          MODIFIED="$(git diff --name-only)"
          UNTRACKED="$(git ls-files --others --exclude-standard)"

          if [ -z "$MODIFIED" ] && [ -z "$UNTRACKED" ]; then

            echo "::error::Patch produced no working tree changes."

            exit 1

          fi

          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "DIFF STAT"
          echo "========================================"

          git diff --stat


      # ============================================================
      # 14. Direct commit / squash
      #
      # Empty commit message is allowed.
      # ============================================================

      - name: Commit patch
        if: inputs.strategy == 'commit' || inputs.strategy == 'squash'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then

            echo "::error::Nothing is staged."

            exit 1

          fi

          if [ -n "$COMMIT_MESSAGE" ]; then

            git commit \
              -m "$COMMIT_MESSAGE"

          else

            echo "Commit message is empty."
            echo "Creating commit with an empty message."

            git commit \
              --allow-empty-message \
              -m ""

          fi

          echo
          echo "Created commit:"

          git log -1 --oneline --decorate


      # ============================================================
      # 15. Create temporary local branch
      # ============================================================

      - name: Create temporary patch branch
        if: inputs.strategy == 'merge' || inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          TEMP_BRANCH="patch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"

          git switch -c "$TEMP_BRANCH"

          git add -A

          if git diff --cached --quiet; then

            echo "::error::Nothing is staged."

            exit 1

          fi

          if [ -n "$COMMIT_MESSAGE" ]; then

            git commit \
              -m "$COMMIT_MESSAGE"

          else

            echo "Commit message is empty."
            echo "Creating temporary commit with an empty message."

            git commit \
              --allow-empty-message \
              -m ""

          fi

          PATCH_COMMIT="$(git rev-parse HEAD)"

          echo "PATCH_COMMIT=$PATCH_COMMIT" >> "$GITHUB_ENV"

          echo
          echo "Temporary branch:"
          echo "$TEMP_BRANCH"

          echo
          echo "Patch commit:"
          echo "$PATCH_COMMIT"


      # ============================================================
      # 16. Merge strategy
      # ============================================================

      - name: Merge patch branch
        if: inputs.strategy == 'merge'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git merge \
            --no-ff \
            --no-edit \
            "$TEMP_BRANCH"

          echo
          echo "Merge completed."

          git log -3 --oneline --decorate


      # ============================================================
      # 17. Cherry-pick strategy
      # ============================================================

      - name: Cherry-pick patch commit
        if: inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git cherry-pick "$PATCH_COMMIT"

          echo
          echo "Cherry-pick completed."

          git log -3 --oneline --decorate


      # ============================================================
      # 18. Final sanity check
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL BRANCH"
          echo "========================================"

          git branch --show-current

          echo
          echo "========================================"
          echo "FINAL HEAD"
          echo "========================================"

          git log -1 --oneline --decorate

          echo
          echo "========================================"
          echo "FINAL STATUS"
          echo "========================================"

          git status --short

          if [ -n "$(git status --porcelain)" ]; then

            echo "::error::Working tree is not clean."

            exit 1

          fi

          echo
          echo "Working tree is clean."


      # ============================================================
      # 19. Push target branch
      # ============================================================

      - name: Push target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push origin \
            "HEAD:$TARGET_BRANCH"

          echo
          echo "Successfully pushed:"
          echo "$TARGET_BRANCH"
