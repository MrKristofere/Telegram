name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply the patch to"
        required: true
        type: string

      patch_url:
        description: "Direct URL to .patch/.diff"
        required: true
        type: string

      commit_message:
        description: "Commit message"
        required: true
        type: string
        default: "Apply patch"

      strategy:
        description: "How to create/apply the resulting commit"
        required: true
        type: choice
        options:
          - commit
          - squash
          - merge
          - cherry-pick
        default: commit

      ignore_whitespace:
        description: "Ignore whitespace differences while applying"
        required: true
        type: boolean
        default: true

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # 1. Checkout selected target branch
      # ------------------------------------------------------------
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Configure Git
      # ------------------------------------------------------------
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short
          git branch --show-current
          git log -1 --oneline

      # ------------------------------------------------------------
      # 3. Download patch
      # ------------------------------------------------------------
      - name: Download patch
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/patch"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 300 \
            "$PATCH_URL" \
            --output "$RUNNER_TEMP/patch/input.patch"

          test -s "$RUNNER_TEMP/patch/input.patch"

          echo "Downloaded patch:"
          wc -l "$RUNNER_TEMP/patch/input.patch"
          file "$RUNNER_TEMP/patch/input.patch"

      # ------------------------------------------------------------
      # 4. Detect patch type
      # ------------------------------------------------------------
      - name: Detect patch format
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/input.patch"

          if grep -qE '^From [0-9a-f]{40} Mon Sep 17 00:00:00 2001$' "$PATCH"; then
            echo "PATCH_FORMAT=mailbox" >> "$GITHUB_ENV"
            echo "Detected: Git mailbox / format-patch"
          elif grep -qE '^diff --git ' "$PATCH"; then
            echo "PATCH_FORMAT=diff" >> "$GITHUB_ENV"
            echo "Detected: unified Git diff"
          else
            echo "::error::The downloaded file does not look like a Git patch."
            exit 1
          fi

      # ------------------------------------------------------------
      # 5. Extract the actual diff from a mailbox
      #
      # We intentionally do NOT use git am.
      #
      # The supplied patch has fake:
      #
      #   index 0000000..0000000
      #
      # so there is no useful blob information for a 3-way merge.
      #
      # We only need the diff part.
      # ------------------------------------------------------------
      - name: Extract patch payload
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$RUNNER_TEMP/patch/input.patch"
          DIFF="$RUNNER_TEMP/patch/normalized.diff"

          if [ "$PATCH_FORMAT" = "mailbox" ]; then
            awk '
              /^diff --git / {
                found=1
              }

              found {
                print
              }
            ' "$INPUT" > "$DIFF"
          else
            cp "$INPUT" "$DIFF"
          fi

          test -s "$DIFF"

          echo "Diff payload:"
          head -n 20 "$DIFF"

      # ------------------------------------------------------------
      # 6. Normalize obvious corruption
      #
      # The supplied patch contains duplicate:
      #
      # +++ b/path
      # +++ b/path
      #
      # Remove only consecutive identical file-header lines.
      #
      # We do NOT rewrite actual + lines inside hunks.
      # ------------------------------------------------------------
      - name: Normalize malformed file headers
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$RUNNER_TEMP/patch/normalized.diff"
          OUTPUT="$RUNNER_TEMP/patch/normalized-fixed.diff"

          awk '
            {
              if (
                ($0 ~ /^\+\+\+ / || $0 ~ /^--- /) &&
                $0 == previous &&
                previous ~ /^(\+\+\+|---) /
              ) {
                next
              }

              print
              previous=$0
            }
          ' "$INPUT" > "$OUTPUT"

          mv "$OUTPUT" "$INPUT"

          echo "Normalized diff:"
          grep -nE '^diff --git |^--- |^\+\+\+ |^@@ ' "$INPUT" || true

      # ------------------------------------------------------------
      # 7. Verify that the patch paths stay inside the repository
      # ------------------------------------------------------------
      - name: Validate patch paths
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/normalized.diff"

          if grep -nE '^(\+\+\+|---) (/[A-Za-z]|[A-Za-z]:[/\\])' "$PATCH"; then
            echo "::error::Patch contains absolute file paths."
            exit 1
          fi

          if grep -nE '^(\+\+\+|---) .*\.\./' "$PATCH"; then
            echo "::error::Patch contains parent-directory traversal."
            exit 1
          fi

      # ------------------------------------------------------------
      # 8. Dry-run
      #
      # --recount:
      #   Do not trust incorrect hunk line counts.
      #
      # --ignore-space-change / --ignore-whitespace:
      #   Optional tolerance for whitespace differences.
      #
      # IMPORTANT:
      #   --reject is NOT used here because --check only validates.
      # ------------------------------------------------------------
      - name: Check patch applicability
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/normalized.diff"

          ARGS=(
            --check
            --recount
            --verbose
          )

          if [ "${{ inputs.ignore_whitespace }}" = "true" ]; then
            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )
          fi

          echo "Checking patch..."

          if ! git apply "${ARGS[@]}" "$PATCH"; then
            echo "::warning::Strict patch check failed."
            echo "The next step will attempt a partial application using --reject."
          fi

      # ------------------------------------------------------------
      # 9. Apply patch
      #
      # --reject:
      #   Apply all hunks that can be applied.
      #   Unmatched hunks become *.rej files.
      #
      # --recount:
      #   Ignore broken hunk line counts.
      #
      # We deliberately do not use --3way because this patch has
      # fake zero blob IDs.
      # ------------------------------------------------------------
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$RUNNER_TEMP/patch/normalized.diff"

          ARGS=(
            --recount
            --reject
            --verbose
            --whitespace=nowarn
          )

          if [ "${{ inputs.ignore_whitespace }}" = "true" ]; then
            ARGS+=(
              --ignore-space-change
              --ignore-whitespace
            )
          fi

          git apply "${ARGS[@]}" "$PATCH" || true

          echo
          echo "Git status after patch:"
          git status --short

      # ------------------------------------------------------------
      # 10. Check rejected hunks
      #
      # Never silently commit an incomplete patch.
      # ------------------------------------------------------------
      - name: Check rejected hunks
        shell: bash
        run: |
          set -euo pipefail

          REJECTS=$(find . \
            -type f \
            -name '*.rej' \
            -not -path './.git/*' \
            -print)

          if [ -n "$REJECTS" ]; then
            echo "::error::Patch was only partially applied."
            echo
            echo "Rejected hunks:"
            echo "$REJECTS"
            echo

            while IFS= read -r file; do
              echo "========================================"
              echo "REJECTED: $file"
              echo "========================================"
              cat "$file"
              echo
            done <<< "$REJECTS"

            exit 1
          fi

          echo "All patch hunks were applied."

      # ------------------------------------------------------------
      # 11. Check that something actually changed
      # ------------------------------------------------------------
      - name: Verify changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git ls-files --others --exclude-standard | grep -q '^$'; then
            echo "::error::Patch produced no working tree changes."
            exit 1
          fi

          echo "Changed files:"
          git status --short

          echo
          echo "Diff stat:"
          git diff --stat

      # ------------------------------------------------------------
      # 12. Create temporary patch branch for merge/cherry-pick
      #
      # commit:
      #   commit directly on target branch
      #
      # squash:
      #   one commit containing all changes
      #
      # merge:
      #   create a temporary branch, commit there, merge --no-ff
      #
      # cherry-pick:
      #   create a temporary branch, commit there, then
      #   cherry-pick that commit onto target
      # ------------------------------------------------------------
      - name: Prepare commit
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Nothing is staged."
            exit 1
          fi

          if [ "$STRATEGY" = "merge" ] || [ "$STRATEGY" = "cherry-pick" ]; then
            TEMP_BRANCH="patch/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            git switch -c "$TEMP_BRANCH"

            git commit \
              -m "$COMMIT_MESSAGE"

            echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"
            echo "PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          else
            git commit \
              -m "$COMMIT_MESSAGE"
          fi

      # ------------------------------------------------------------
      # 13. Merge strategy
      # ------------------------------------------------------------
      - name: Merge patch branch
        if: inputs.strategy == 'merge'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git merge \
            --no-ff \
            --no-edit \
            "$TEMP_BRANCH"

      # ------------------------------------------------------------
      # 14. Cherry-pick strategy
      # ------------------------------------------------------------
      - name: Cherry-pick patch commit
        if: inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch "$TARGET_BRANCH"

          git cherry-pick "$PATCH_COMMIT"

      # ------------------------------------------------------------
      # 15. Show final result
      # ------------------------------------------------------------
      - name: Show final result
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"

          git status --short

          echo
          echo "HEAD:"
          git log -1 --oneline

          echo
          echo "Recent history:"
          git log --oneline --decorate -5

      # ------------------------------------------------------------
      # 16. Push target branch
      # ------------------------------------------------------------
      - name: Push target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push origin "HEAD:$TARGET_BRANCH"

      # ------------------------------------------------------------
      # 17. Cleanup temporary branch on remote
      # ------------------------------------------------------------
      - name: Delete temporary remote branch
        if: inputs.strategy == 'merge' || inputs.strategy == 'cherry-pick'
        shell: bash
        env:
          TEMP_BRANCH: ${{ env.TEMP_BRANCH }}
        run: |
          set -euo pipefail

          git push origin --delete "$TEMP_BRANCH" 2>/dev/null || true
