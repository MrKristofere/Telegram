name: Build Telegram Standalone FT - Firebase OFF

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name"
        type: string
        default: master
        required: true

env:
  APP_PACKAGE: ft.telegram.messenger
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Configure application package
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^APP_PACKAGE=' gradle.properties; then
            echo "ERROR: APP_PACKAGE was not found in gradle.properties"
            exit 1
          fi

          sed -i \
            "s/^APP_PACKAGE=.*/APP_PACKAGE=${APP_PACKAGE}/" \
            gradle.properties

          echo "Configured package:"
          grep '^APP_PACKAGE=' gradle.properties

          test "$(grep '^APP_PACKAGE=' gradle.properties | cut -d= -f2)" = "${APP_PACKAGE}"

      # ------------------------------------------------------------
      # Firebase removal
      # ------------------------------------------------------------

      - name: Remove Firebase Gradle integration
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "build.gradle"
            "TMessagesProj/build.gradle"
            "TMessagesProj_AppStandalone/build.gradle"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then

              sed -i \
                "/com.google.gms:google-services/d" \
                "$file"

              sed -i \
                "/com.google.firebase:firebase-crashlytics-gradle/d" \
                "$file"

              sed -i \
                "/apply plugin: 'com.google.gms.google-services'/d" \
                "$file"

              sed -i \
                '/id .com.google.gms.google-services./d' \
                "$file"

              sed -i \
                '/com.google.firebase/d' \
                "$file"

            fi
          done

      - name: Remove Firebase configuration files
        shell: bash
        run: |
          set -euo pipefail

          rm -f TMessagesProj/google-services.json
          rm -f TMessagesProj_AppStandalone/google-services.json

      # ------------------------------------------------------------
      # Remove Firebase Java sources
      # ------------------------------------------------------------

      - name: Remove Firebase push service
        shell: bash
        run: |
          set -euo pipefail

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/GcmPushListenerService.java"

          if [ -f "$FILE" ]; then
            rm -f "$FILE"
          fi

      - name: Remove Firebase imports
        shell: bash
        run: |
          set -euo pipefail

          LAUNCH="TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          BOT="TMessagesProj/src/main/java/org/telegram/ui/bots/BotStorage.java"
          PUSH="TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java"

          sed -i \
            '/^import com\.google\.firebase\./d' \
            "$LAUNCH"

          sed -i \
            '/^import com\.google\.firebase\./d' \
            "$BOT"

          sed -i \
            '/^import com\.google\.firebase\./d' \
            "$PUSH"

      # ------------------------------------------------------------
      # Replace Google/Firebase push provider
      # ------------------------------------------------------------

      - name: Disable Firebase push provider
        shell: bash
        run: |
          set -euo pipefail

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java")
          text = path.read_text()

          marker = "public final static class GooglePushListenerServiceProvider implements IPushListenerServiceProvider"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: GooglePushListenerServiceProvider was not found"
              )

          class_start = text.rfind("\n", 0, start) + 1

          brace_start = text.find("{", start)

          if brace_start == -1:
              raise SystemExit(
                  "ERROR: Opening brace of GooglePushListenerServiceProvider was not found"
              )

          depth = 0
          end = None

          for i in range(brace_start, len(text)):
              char = text[i]

              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: Could not find end of GooglePushListenerServiceProvider"
              )

          replacement = """\
              public final static class GooglePushListenerServiceProvider implements IPushListenerServiceProvider {
                  public final static GooglePushListenerServiceProvider INSTANCE =
                          new GooglePushListenerServiceProvider();

                  private GooglePushListenerServiceProvider() {
                  }

                  @Override
                  public boolean hasServices() {
                      return false;
                  }

                  @Override
                  public String getLogTitle() {
                      return "Firebase disabled";
                  }

                  @Override
                  public void onRequestPushToken() {
                      if (BuildVars.LOGS_ENABLED) {
                          FileLog.d("Firebase push provider disabled");
                      }
                  }

                  @Override
                  public int getPushType() {
                      return PUSH_TYPE_FIREBASE;
                  }
              }"""

          new_text = text[:class_start] + replacement + text[end:]

          path.write_text(new_text)

          print("GooglePushListenerServiceProvider replaced successfully.")
          PY

          if ! grep -q "Firebase push provider disabled" "$FILE"; then
            echo "ERROR: Firebase provider replacement failed."
            exit 1
          fi

          if grep -q "FirebaseMessaging" "$FILE"; then
            echo "ERROR: FirebaseMessaging reference remains."
            exit 1
          fi

          if grep -q "FirebaseApp" "$FILE"; then
            echo "ERROR: FirebaseApp reference remains."
            exit 1
          fi

      # ------------------------------------------------------------
      # Disable Firebase initialization
      # ------------------------------------------------------------

      - name: Disable Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"

          if grep -q "initPushServices();" "$FILE"; then
            sed -i \
              '/initPushServices();/d' \
              "$FILE"
          fi

          if grep -q "initPushServices();" "$FILE"; then
            echo "ERROR: initPushServices() is still called."
            exit 1
          fi

      # ------------------------------------------------------------
      # Manifest
      # ------------------------------------------------------------

      - name: Remove Firebase service from Standalone manifest
        shell: bash
        run: |
          set -euo pipefail

          FILE="TMessagesProj/config/release/AndroidManifest_standalone.xml"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("TMessagesProj/config/release/AndroidManifest_standalone.xml")
          text = path.read_text()

          pattern = re.compile(
              r'<service\b[^>]*'
              r'android:name\s*=\s*["\']org\.telegram\.messenger\.GcmPushListenerService["\']'
              r'[^>]*>'
              r'(?:.*?</service>\s*)?',
              re.DOTALL
          )

          new_text, count = pattern.subn("", text)

          if count:
              path.write_text(new_text)
              print(f"Removed {count} Firebase service declaration(s).")
          else:
              print("GcmPushListenerService declaration not found; continuing.")
          PY

          if grep -q "GcmPushListenerService" "$FILE"; then
            echo "ERROR: GcmPushListenerService remains in manifest."
            exit 1
          fi

      # ------------------------------------------------------------
      # Firebase verification
      # ------------------------------------------------------------

      - name: Verify Firebase is disabled
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Firebase verification"
          echo "========================================"

          echo
          echo "1. Gradle files"

          if grep -RniE \
            'com\.google\.gms:google-services|google-services|com\.google\.firebase' \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            build.gradle \
            TMessagesProj \
            TMessagesProj_AppStandalone; then

            echo
            echo "ERROR: Firebase Gradle references remain."
            exit 1
          fi

          echo "OK"

          echo
          echo "2. Firebase configuration files"

          if [ -f TMessagesProj/google-services.json ]; then
            echo "ERROR: TMessagesProj/google-services.json still exists."
            exit 1
          fi

          if [ -f TMessagesProj_AppStandalone/google-services.json ]; then
            echo "ERROR: TMessagesProj_AppStandalone/google-services.json still exists."
            exit 1
          fi

          echo "OK"

          echo
          echo "3. Firebase Java imports"

          if grep -Rni \
            'com\.google\.firebase' \
            TMessagesProj/src/main/java; then

            echo
            echo "ERROR: Firebase Java imports/references remain."
            exit 1
          fi

          echo "OK"

          echo
          echo "4. Firebase push service"

          if [ -f \
            TMessagesProj/src/main/java/org/telegram/messenger/GcmPushListenerService.java \
          ]; then

            echo "ERROR: GcmPushListenerService.java still exists."
            exit 1
          fi

          echo "OK"

          echo
          echo "5. Manifest"

          if grep -niE \
            'GcmPushListenerService|com\.google\.firebase|firebase_analytics|google_analytics' \
            TMessagesProj/config/release/AndroidManifest_standalone.xml; then

            echo
            echo "ERROR: Firebase references remain in Standalone manifest."
            exit 1
          fi

          echo "OK"

          echo
          echo "6. Firebase initialization"

          if grep -Rni \
            'initPushServices();' \
            TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java; then

            echo "ERROR: Firebase push initialization remains."
            exit 1
          fi

          echo "OK"

          echo
          echo "Firebase OFF verification passed."

      # ------------------------------------------------------------
      # Gradle
      # ------------------------------------------------------------

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          sed -i '/^org.gradle.caching=/d' gradle.properties
          sed -i '/^org.gradle.configuration-cache=/d' gradle.properties

          printf '\norg.gradle.caching=true\n' >> gradle.properties

      - name: Extract Android SDK versions
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          BUILD_GRADLE="TMessagesProj_AppStandalone/build.gradle"

          BUILD_TOOLS=$(grep -oP \
            "buildToolsVersion ['\"]\K[^'\"]+" \
            "$BUILD_GRADLE")

          COMPILE_SDK=$(grep -oP \
            "compileSdk(?:Version)?\s*=?\s*\K\d+" \
            "$BUILD_GRADLE")

          NDK=$(grep -oP \
            "ndkVersion ['\"]\K[^'\"]+" \
            "$BUILD_GRADLE")

          test -n "$BUILD_TOOLS"
          test -n "$COMPILE_SDK"
          test -n "$NDK"

          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"

          echo "Build Tools: $BUILD_TOOLS"
          echo "Compile SDK: $COMPILE_SDK"
          echo "NDK: $NDK"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;${{ steps.sdk.outputs.build_tools }}
            ndk;${{ steps.sdk.outputs.ndk }}
            platforms;android-${{ steps.sdk.outputs.compile_sdk }}

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Configure Gradle JVM
        shell: bash
        run: |
          set -euo pipefail

          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))

          echo "Detected memory: ${MEMORY_GB} GB"

          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties

            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" \
              >> gradle.properties
          fi

          grep '^org.gradle.jvmargs=' gradle.properties || true

      # ------------------------------------------------------------
      # Telegram BuildVars
      # ------------------------------------------------------------

      - name: Configure BuildVars
        shell: bash
        run: |
          set -euo pipefail

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"

          sed -i -E \
            's/public static int APP_ID = [0-9]+;/public static int APP_ID = 6;/' \
            "$FILE"

          sed -i -E \
            's/public static String APP_HASH = "[^"]*";/public static String APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e";/' \
            "$FILE"

          grep -q \
            'public static int APP_ID = 6;' \
            "$FILE"

          grep -q \
            'public static String APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e";' \
            "$FILE"

      # ------------------------------------------------------------
      # Native build
      # ------------------------------------------------------------

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ steps.sdk.outputs.ndk }}

      - name: Cache native build
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/cmake
            TMessagesProj/build/intermediates/ndkBuild
          key: ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-
            ${{ runner.os }}-ndk-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Standalone
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --build-cache \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      # ------------------------------------------------------------
      # APK verification
      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find \
            TMessagesProj_AppStandalone/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK: $APK"

          AAPT2="${ANDROID_HOME}/build-tools/${{ steps.sdk.outputs.build_tools }}/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found:"
            echo "$AAPT2"
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK")

          echo "$BADGING" | grep -q \
            "package: name='ft.telegram.messenger.web'"

          echo
          echo "Package verification passed:"
          echo "ft.telegram.messenger.web"

      # ------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: telegram-standalone-ft-firebase-off
          path: TMessagesProj_AppStandalone/build/outputs/**/*.apk
          if-no-files-found: error
          archive: false
