name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA via Space (required for cherry-pick, squash and merge-selected)"
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How to apply changes"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch

      source_branch:
        description: "Source branch (required for merge-branch and rebase-branch)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate inputs
        env:
          COMMITS: ${{ inputs.commits }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          echo "Strategy:       $STRATEGY"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Source branch:  ${SOURCE_BRANCH:-<not specified>}"
          echo "Commits:        ${COMMITS:-<not specified>}"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is required"
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)
              if [[ -z "$COMMITS" ]]; then
                echo "::error::commits is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            merge-branch|rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::source_branch is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;

          esac

      - name: Fetch target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin \
            "$TARGET_BRANCH:$TARGET_BRANCH"

      - name: Fetch source branch
        if: ${{ inputs.strategy == 'merge-branch' || inputs.strategy == 'rebase-branch' }}
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git fetch origin \
            "$SOURCE_BRANCH:$SOURCE_BRANCH"

      - name: Validate commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          for commit in $COMMITS; do
            echo "Validating commit: $commit"

            git cat-file -e "$commit^{commit}" || {
              echo "::error::Commit not found: $commit"
              exit 1
            }
          done

      - name: Apply changes
        env:
          COMMITS: ${{ inputs.commits }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          STRATEGY: ${{ inputs.strategy }}
        run: |

          case "$STRATEGY" in

            # ---------------------------------------------------------
            # CHERRY-PICK
            # ---------------------------------------------------------
            cherry-pick)
              echo "Applying selected commits using cherry-pick"

              git checkout "$TARGET_BRANCH"

              for commit in $COMMITS; do
                echo "Cherry-picking: $commit"

                git cherry-pick "$commit" || {
                  echo "::error::Cherry-pick failed for commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done
              ;;


            # ---------------------------------------------------------
            # SQUASH
            # ---------------------------------------------------------
            squash)
              echo "Applying selected commits using squash"

              git checkout "$TARGET_BRANCH"

              for commit in $COMMITS; do
                echo "Applying without commit: $commit"

                git cherry-pick --no-commit "$commit" || {
                  echo "::error::Failed to apply commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done

              git commit \
                -m "chore: squash selected commits"
              ;;


            # ---------------------------------------------------------
            # MERGE SELECTED
            # ---------------------------------------------------------
            merge-selected)
              echo "Merging selected commits"

              TEMP_BRANCH="automation/apply-${GITHUB_RUN_ID}"

              git checkout "$TARGET_BRANCH"

              git checkout -b "$TEMP_BRANCH"

              for commit in $COMMITS; do
                echo "Cherry-picking into temporary branch: $commit"

                git cherry-pick "$commit" || {
                  echo "::error::Cherry-pick failed for commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done

              git checkout "$TARGET_BRANCH"

              git merge \
                --no-ff \
                "$TEMP_BRANCH" \
                -m "Merge selected commits" || {
                  echo "::error::Merge failed"

                  if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                    git merge --abort
                  fi

                  exit 1
                }

              git branch -D "$TEMP_BRANCH"
              ;;


            # ---------------------------------------------------------
            # MERGE BRANCH
            # ---------------------------------------------------------
            merge-branch)
              echo "Merging source branch into target branch"
              echo "Source: $SOURCE_BRANCH"
              echo "Target: $TARGET_BRANCH"

              git checkout "$TARGET_BRANCH"

              git merge \
                --no-ff \
                "$SOURCE_BRANCH" \
                -m "Merge $SOURCE_BRANCH into $TARGET_BRANCH" || {
                  echo "::error::Merge failed"

                  if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                    git merge --abort
                  fi

                  exit 1
                }
              ;;


            # ---------------------------------------------------------
            # REBASE BRANCH
            # ---------------------------------------------------------
            rebase-branch)
              echo "Rebasing source branch onto target branch"
              echo "Source: $SOURCE_BRANCH"
              echo "Target: $TARGET_BRANCH"

              # Save the current source branch HEAD.
              SOURCE_HEAD="$(git rev-parse "$SOURCE_BRANCH")"

              # Find the common ancestor between source and target.
              MERGE_BASE="$(git merge-base \
                "$SOURCE_BRANCH" \
                "$TARGET_BRANCH")"

              echo "Source HEAD: $SOURCE_HEAD"
              echo "Merge base:  $MERGE_BASE"

              # Rebase source branch onto target branch.
              git checkout "$SOURCE_BRANCH"

              git rebase \
                --onto "$TARGET_BRANCH" \
                "$MERGE_BASE" || {
                  echo "::error::Rebase failed"

                  if git rebase --show-current-patch >/dev/null 2>&1; then
                    git rebase --abort
                  fi

                  exit 1
                }

              # The source branch now contains:
              #
              # target history + rebased source commits
              #
              # Move target branch to the rebased source HEAD.
              REBASED_HEAD="$(git rev-parse HEAD)"

              echo "Rebased HEAD: $REBASED_HEAD"

              git checkout "$TARGET_BRANCH"

              git merge \
                --ff-only \
                "$REBASED_HEAD" || {
                  echo "::error::Fast-forward of target branch failed"
                  exit 1
                }
              ;;

          esac

      - name: Show result
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          echo "========================================"
          echo "Strategy:      $STRATEGY"
          echo "Target branch: $TARGET_BRANCH"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            -10

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"
