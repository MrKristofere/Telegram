name: Apply selected commits

on:
  workflow_dispatch:
    inputs:

      strategy:
        description: "How the selected changes should be applied"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      target_branch:
        description: "Branch that receives the result"
        required: true
        type: string

      source_branch:
        description: "Source branch used for selection / merge / rebase"
        required: false
        type: string

      commits:
        description: |
          Commit SHA(s), separated by spaces or new lines.
          Include mode: apply only these commits.
          Exclude mode: apply all source commits except these.
        required: false
        type: string

      exclude_commits:
        description: |
          false = commits are the allow-list.
          true  = commits are the deny-list and all other source commits are selected.
        required: false
        default: false
        type: boolean

      mainline_parent:
        description: |
          Mainline parent for merge commits.
          1 is usually the branch that was checked out when the merge was made.
        required: true
        default: "1"
        type: string

      conflict_resolution:
        description: "Conflict handling"
        required: true
        default: fail
        type: choice
        options:
          - fail
          - rerere
          - ours
          - theirs

      preserve_merges:
        description: |
          For native rebase/merge operations, preserve merge topology where possible.
          Selective replay always uses the selected commits as the source of truth.
        required: true
        default: true
        type: boolean

      patch_file:
        description: "Repository-relative .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: |
          Custom commit message.
          For cherry-pick it is allowed only when exactly one commit is selected.
        required: false
        type: string

      fetch_step:
        description: "Number of commits to deepen when the Git graph is incomplete"
        required: true
        default: "64"
        type: string

      max_fetch_depth:
        description: |
          Maximum history depth that may be fetched adaptively.
          This is NOT fetch-depth and does not fetch all history automatically.
        required: true
        default: "4096"
        type: string

      dry_run:
        description: "Build and validate the complete plan without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-selected-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply selected changes
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # MINIMAL CHECKOUT
      #
      # IMPORTANT:
      # fetch-depth is intentionally 1.
      #
      # The workflow fetches/deepens only the graph required by the
      # selected operation.
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
          persist-credentials: true
          show-progress: false

      # ================================================================
      # GIT CONFIGURATION
      # ================================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false
          git config pull.rebase false

          git config core.autocrlf false
          git config core.safecrlf false

          git config merge.conflictStyle zdiff3

          git config rerere.enabled true
          git config rerere.autoupdate true

          git config rebase.autoStash false
          git config rebase.autoSquash false
          git config rebase.updateRefs false
          git config rebase.missingCommitsCheck error

      # ================================================================
      # PREPARE
      #
      # Responsibilities:
      #
      # 1. Validate inputs.
      # 2. Fetch target/source refs minimally.
      # 3. Normalize requested SHAs.
      # 4. Adaptively complete only the required graph.
      # 5. Build ONE selection file.
      # 6. Determine already-present commits.
      # 7. Produce the immutable operation plan.
      # ================================================================

      - name: Prepare operation
        id: prepare
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMITS_INPUT: ${{ inputs.commits }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          MAINLINE_PARENT: ${{ inputs.mainline_parent }}
          CONFLICT_RESOLUTION: ${{ inputs.conflict_resolution }}
          PRESERVE_MERGES: ${{ inputs.preserve_merges }}
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          FETCH_STEP: ${{ inputs.fetch_step }}
          MAX_FETCH_DEPTH: ${{ inputs.max_fetch_depth }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail

          TMP="$RUNNER_TEMP/apply-selected"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo "TMP=$TMP" >> "$GITHUB_ENV"

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          warning() {
            echo "::warning::$*" >&2
          }

          info() {
            echo "::notice::$*"
          }

          count_lines() {
            if [[ -s "$1" ]]; then
              wc -l < "$1" | tr -d ' '
            else
              echo 0
            fi
          }

          normalize_commits() {
            tr '[:space:]' '\n' |
              sed '/^[[:space:]]*$/d' |
              sed 's/^[[:space:]]*//' |
              sed 's/[[:space:]]*$//' |
              awk '!seen[$0]++'
          }

          is_commit_available() {
            git cat-file -e "$1^{commit}" 2>/dev/null
          }

          is_object_available() {
            git cat-file -e "$1" 2>/dev/null
          }

          commit_parent_count() {
            git rev-list \
              --parents \
              -n 1 \
              "$1" |
              awk '{print NF-1}'
          }

          # ==============================================================
          # VALIDATION
          # ==============================================================

          echo
          echo "============================================================"
          echo "INPUT VALIDATION"
          echo "============================================================"

          case "$STRATEGY" in
            cherry-pick)
              ;;
            squash)
              ;;
            merge-selected)
              ;;
            merge-branch)
              ;;
            rebase-branch)
              ;;
            apply-patch)
              ;;
            apply-diff)
              ;;
            *)
              error "Unknown strategy: $STRATEGY"
              ;;
          esac

          [[ -n "$TARGET_BRANCH" ]] ||
            error "target_branch is required."

          git check-ref-format \
            --branch "$TARGET_BRANCH" >/dev/null 2>&1 ||
            error "Invalid target branch: $TARGET_BRANCH"

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format \
              --branch "$SOURCE_BRANCH" >/dev/null 2>&1 ||
              error "Invalid source branch: $SOURCE_BRANCH"
          fi

          [[ "$MAINLINE_PARENT" =~ ^[1-9][0-9]*$ ]] ||
            error "mainline_parent must be a positive integer."

          [[ "$FETCH_STEP" =~ ^[1-9][0-9]*$ ]] ||
            error "fetch_step must be a positive integer."

          [[ "$MAX_FETCH_DEPTH" =~ ^[1-9][0-9]*$ ]] ||
            error "max_fetch_depth must be a positive integer."

          (( FETCH_STEP <= MAX_FETCH_DEPTH )) ||
            error "fetch_step cannot be greater than max_fetch_depth."

          case "$CONFLICT_RESOLUTION" in
            fail|rerere|ours|theirs)
              ;;
            *)
              error "Invalid conflict_resolution: $CONFLICT_RESOLUTION"
              ;;
          esac

          # --------------------------------------------------------------
          # Strategy requirements
          # --------------------------------------------------------------

          case "$STRATEGY" in

            apply-patch|apply-diff)

              [[ -n "$PATCH_FILE" ]] ||
                error "$STRATEGY requires patch_file."

              [[ -f "$PATCH_FILE" ]] ||
                error "Patch/diff file does not exist: $PATCH_FILE"

              [[ -z "$SOURCE_BRANCH" ]] ||
                error "$STRATEGY does not use source_branch."

              [[ -z "$COMMITS_INPUT" ]] ||
                error "$STRATEGY does not use commits."

              [[ "$EXCLUDE_COMMITS" == "false" ]] ||
                error "$STRATEGY does not support exclude_commits."

              ;;

            merge-branch|rebase-branch)

              [[ -n "$SOURCE_BRANCH" ]] ||
                error "$STRATEGY requires source_branch."

              ;;

            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" &&
                    -z "$COMMITS_INPUT" ]]; then

                error \
                  "$STRATEGY requires source_branch or commits."

              fi

              ;;

          esac

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] ||
              error \
                "exclude_commits=true requires source_branch."

            [[ -n "$COMMITS_INPUT" ]] ||
              error \
                "exclude_commits=true requires commits."

          fi

          # --------------------------------------------------------------
          # Custom commit message
          # --------------------------------------------------------------

          if [[ "$STRATEGY" == "rebase-branch" &&
                -n "$COMMIT_MESSAGE" ]]; then

            warning \
              "commit_message is ignored by rebase-branch."

          fi

          # ==============================================================
          # FETCH TARGET REF
          #
          # This does NOT fetch target history.
          # It only establishes the current remote target tip.
          # ==============================================================

          echo
          echo "============================================================"
          echo "FETCH TARGET TIP"
          echo "============================================================"

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA=$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          # ==============================================================
          # FETCH SOURCE REF
          #
          # Again: only the current source tip is fetched initially.
          # ==============================================================

          SOURCE_SHA=""

          if [[ -n "$SOURCE_BRANCH" ]]; then

            echo
            echo "============================================================"
            echo "FETCH SOURCE TIP"
            echo "============================================================"

            git fetch \
              --no-tags \
              --filter=blob:none \
              origin \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            SOURCE_SHA=$(
              git rev-parse \
                "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
            )

            echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          else

            echo "SOURCE_SHA=" >> "$GITHUB_ENV"

          fi

          # ==============================================================
          # NORMALIZE EXPLICIT COMMITS
          # ==============================================================

          : > "$TMP/input"

          if [[ -n "$COMMITS_INPUT" ]]; then

            printf '%s\n' "$COMMITS_INPUT" |
              normalize_commits |
              while IFS= read -r value; do

                [[ "$value" =~ ^[0-9a-fA-F]{7,64}$ ]] ||
                  error "Invalid commit SHA: $value"

                # First try the local object database.
                if ! is_commit_available "$value"; then

                  # Fetch the exact object only.
                  git fetch \
                    --no-tags \
                    --filter=blob:none \
                    origin \
                    "$value" ||
                    error \
                      "Cannot fetch requested commit object: $value"

                fi

                sha=$(
                  git rev-parse \
                    "$value^{commit}" \
                    2>/dev/null
                ) ||
                  error \
                    "Cannot resolve commit: $value"

                printf '%s\n' "$sha"

              done |
              awk '!seen[$0]++' \
              > "$TMP/input"

          fi

          INPUT_COUNT=$(
            count_lines "$TMP/input"
          )

          # ==============================================================
          # HELPER: CHECK SHALLOW STATE
          # ==============================================================

          is_shallow_repository() {
            [[ -f "$(git rev-parse --git-path shallow)" ]]
          }

          # ==============================================================
          # HELPER: DEEPEN A BRANCH
          #
          # This changes only the requested branch's shallow boundary.
          # We never request the entire repository unless Git itself
          # reports that the requested maximum depth has been reached.
          # ==============================================================

          CURRENT_SOURCE_DEPTH=1
          CURRENT_TARGET_DEPTH=1

          deepen_source() {

            [[ -n "$SOURCE_BRANCH" ]] || return 0

            if (( CURRENT_SOURCE_DEPTH >= MAX_FETCH_DEPTH )); then
              return 1
            fi

            local next
            next=$(( CURRENT_SOURCE_DEPTH + FETCH_STEP ))

            if (( next > MAX_FETCH_DEPTH )); then
              next="$MAX_FETCH_DEPTH"
            fi

            local delta
            delta=$(( next - CURRENT_SOURCE_DEPTH ))

            info \
              "Deepening source '$SOURCE_BRANCH' by $delta commits (target depth: $next)."

            git fetch \
              --no-tags \
              --filter=blob:none \
              --deepen="$delta" \
              origin \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            CURRENT_SOURCE_DEPTH="$next"

            return 0
          }

          deepen_target() {

            if (( CURRENT_TARGET_DEPTH >= MAX_FETCH_DEPTH )); then
              return 1
            fi

            local next
            next=$(( CURRENT_TARGET_DEPTH + FETCH_STEP ))

            if (( next > MAX_FETCH_DEPTH )); then
              next="$MAX_FETCH_DEPTH"
            fi

            local delta
            delta=$(( next - CURRENT_TARGET_DEPTH ))

            info \
              "Deepening target '$TARGET_BRANCH' by $delta commits (target depth: $next)."

            git fetch \
              --no-tags \
              --filter=blob:none \
              --deepen="$delta" \
              origin \
              "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

            CURRENT_TARGET_DEPTH="$next"

            return 0
          }

          # ==============================================================
          # HELPER: ENSURE COMMIT IS REACHABLE FROM SOURCE
          #
          # A shallow repository can make merge-base/ancestor checks
          # return false even though the relationship exists remotely.
          #
          # We therefore deepen before declaring a requested commit
          # unreachable.
          # ==============================================================

          ensure_commit_reachable_from_source() {

            local sha="$1"

            [[ -n "$SOURCE_BRANCH" ]] ||
              error \
                "Cannot verify source ancestry without source_branch."

            while true; do

              if git merge-base \
                --is-ancestor \
                "$sha" \
                "$SOURCE_SHA" \
                2>/dev/null; then

                return 0

              fi

              # Check whether the source graph is shallow.
              if ! is_shallow_repository; then
                return 1
              fi

              deepen_source ||
                return 1

            done
          }

          # ==============================================================
          # HELPER: ENSURE SOURCE/TARGET COMMON HISTORY
          #
          # We do not require exactly one merge-base.
          #
          # Multiple merge bases are valid Git topology. We only require
          # that the relevant graph is sufficiently complete to establish
          # the relationship.
          # ==============================================================

          ensure_common_history() {

            [[ -n "$SOURCE_SHA" ]] ||
              error "Source branch is required."

            while true; do

              BASES=()

              mapfile -t BASES < <(
                git merge-base \
                  --all \
                  "$TARGET_SHA" \
                  "$SOURCE_SHA" \
                  2>/dev/null || true
              )

              if (( ${#BASES[@]} > 0 )); then

                printf '%s\n' "${BASES[@]}" \
                  > "$TMP/merge_bases"

                return 0

              fi

              if ! is_shallow_repository; then

                return 1

              fi

              SOURCE_CAN_DEEPEN=0
              TARGET_CAN_DEEPEN=0

              if (( CURRENT_SOURCE_DEPTH < MAX_FETCH_DEPTH )); then
                SOURCE_CAN_DEEPEN=1
              fi

              if (( CURRENT_TARGET_DEPTH < MAX_FETCH_DEPTH )); then
                TARGET_CAN_DEEPEN=1
              fi

              if (( SOURCE_CAN_DEEPEN == 0 &&
                    TARGET_CAN_DEEPEN == 0 )); then

                return 1

              fi

              # Alternate the two sides so that one branch cannot
              # consume the entire fetch budget while the other remains
              # shallow.
              if (( CURRENT_SOURCE_DEPTH <= CURRENT_TARGET_DEPTH )); then

                deepen_source ||
                  deepen_target ||
                  return 1

              else

                deepen_target ||
                  deepen_source ||
                  return 1

              fi

            done
          }

          # ==============================================================
          # SOURCE HISTORY
          #
          # The selection model is:
          #
          #   source commits not already contained in target
          #
          # This is intentionally not based on "exactly one merge-base".
          #
          # We complete the relevant graph only when source-based
          # selection is actually needed.
          # ==============================================================

          : > "$TMP/source_history"
          : > "$TMP/merge_bases"

          SOURCE_COUNT=0
          MERGE_BASE=""

          if [[ -n "$SOURCE_SHA" ]]; then

            echo
            echo "============================================================"
            echo "ANALYZE SOURCE GRAPH"
            echo "============================================================"

            case "$STRATEGY" in

              merge-branch|rebase-branch)

                ensure_common_history ||
                  error \
                    "Could not establish common history between target and source within max_fetch_depth=$MAX_FETCH_DEPTH."

                ;;

              *)

                if [[ "$EXCLUDE_COMMITS" == "true" ||
                      -z "$COMMITS_INPUT" ]]; then

                  ensure_common_history ||
                    error \
                      "Could not establish common history between target and source within max_fetch_depth=$MAX_FETCH_DEPTH."

                fi

                ;;

            esac

            if [[ -s "$TMP/merge_bases" ]]; then

              MERGE_BASE=$(
                head -n 1 "$TMP/merge_bases"
              )

              # For source selection we intentionally use:
              #
              #   source --not target
              #
              # rather than:
              #
              #   merge-base..source
              #
              # This correctly expresses "commits reachable from source
              # but not reachable from target".
              git rev-list \
                --topo-order \
                --reverse \
                "$SOURCE_SHA" \
                --not "$TARGET_SHA" \
                > "$TMP/source_history"

            else

              # If the source/target relationship was not needed yet,
              # explicit commits can still be selected individually.
              : > "$TMP/source_history"

            fi

            SOURCE_COUNT=$(
              count_lines "$TMP/source_history"
            )

          fi

          # ==============================================================
          # EXPLICIT COMMIT VALIDATION
          #
          # When source_branch is supplied, explicit commits must be
          # reachable from source.
          #
          # We deepen source adaptively before declaring a SHA invalid.
          # ==============================================================

          if [[ -n "$SOURCE_BRANCH" &&
                "$INPUT_COUNT" -gt 0 ]]; then

            echo
            echo "============================================================"
            echo "VALIDATE EXPLICIT COMMITS"
            echo "============================================================"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              ensure_commit_reachable_from_source "$sha" ||
                error \
                  "Commit $sha is not reachable from source_branch '$SOURCE_BRANCH'."

            done < "$TMP/input"

          fi

          # ==============================================================
          # BUILD ONE UNIVERSAL SELECTION
          #
          # Rules:
          #
          # source + include:
          #     SELECTED = requested commits
          #
          # source + exclude:
          #     SELECTED = source history minus requested commits
          #
          # source only:
          #     SELECTED = all source changes not already in target
          #
          # explicit commits only:
          #     SELECTED = explicit commits
          #
          # include + exclude:
          #     EXCLUDE always wins.
          # ==============================================================

          : > "$TMP/selected"

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            # Exclusion requires a complete source-vs-target selection.
            [[ -n "$SOURCE_BRANCH" ]] ||
              error \
                "Exclude mode requires source_branch."

            [[ -s "$TMP/source_history" ]] ||
              error \
                "Source history is empty. There may be no changes to apply."

            awk '
              NR == FNR {
                excluded[$1] = 1
                next
              }

              !excluded[$1] {
                print $1
              }
            ' \
              "$TMP/input" \
              "$TMP/source_history" \
              > "$TMP/selected"

          elif [[ "$INPUT_COUNT" -gt 0 ]]; then

            # Explicit allow-list.
            cp \
              "$TMP/input" \
              "$TMP/selected"

          elif [[ -n "$SOURCE_BRANCH" ]]; then

            # Entire source delta.
            cp \
              "$TMP/source_history" \
              "$TMP/selected"

          fi

          # ==============================================================
          # DEDUPLICATE
          # ==============================================================

          awk '!seen[$0]++' \
            "$TMP/selected" \
            > "$TMP/selected.unique"

          mv \
            "$TMP/selected.unique" \
            "$TMP/selected"

          SELECTED_COUNT=$(
            count_lines "$TMP/selected"
          )

          # ==============================================================
          # ORDER EXPLICIT COMMITS
          #
          # When source is known, use source topology order.
          #
          # When source is not known, preserve the user's input order.
          # ==============================================================

          if [[ -n "$SOURCE_BRANCH" &&
                "$SELECTED_COUNT" -gt 0 ]]; then

            awk '
              NR == FNR {
                wanted[$1] = 1
                next
              }

              wanted[$1] {
                print $1
              }
            ' \
              "$TMP/selected" \
              "$TMP/source_history" \
              > "$TMP/selected.ordered"

            # Explicit commits that are not part of source_history are
            # still allowed if they were explicitly requested and have
            # already been proven reachable from source. This matters
            # when the commit is already contained in target and therefore
            # intentionally absent from source --not target.
            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if ! grep -qxF "$sha" "$TMP/selected.ordered"; then

                if [[ "$EXCLUDE_COMMITS" == "false" &&
                      "$INPUT_COUNT" -gt 0 ]]; then

                  if grep -qxF "$sha" "$TMP/input"; then

                    printf '%s\n' "$sha" \
                      >> "$TMP/selected.ordered"

                  fi

                fi

              fi

            done < "$TMP/selected"

            awk '!seen[$0]++' \
              "$TMP/selected.ordered" \
              > "$TMP/selected.final"

            mv \
              "$TMP/selected.final" \
              "$TMP/selected"

          fi

          # ==============================================================
          # VALIDATE EXPLICIT ALLOW-LIST
          # ==============================================================

          if [[ "$EXCLUDE_COMMITS" == "false" &&
                "$INPUT_COUNT" -gt 0 &&
                -n "$SOURCE_BRANCH" ]]; then

            : > "$TMP/missing"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if ! grep -qxF "$sha" "$TMP/selected"; then

                printf '%s\n' "$sha" \
                  >> "$TMP/missing"

              fi

            done < "$TMP/input"

            if [[ -s "$TMP/missing" ]]; then

              echo "::error::The following requested commits could not be selected:"

              cat "$TMP/missing" >&2

              error \
                "Explicit selection is incomplete."

            fi

          fi

          # ==============================================================
          # MERGE COMMIT VALIDATION
          #
          # Every merge commit needs a valid mainline parent.
          #
          # This is required by git cherry-pick -m.
          # ==============================================================

          if [[ "$SELECTED_COUNT" -gt 0 ]]; then

            echo
            echo "============================================================"
            echo "VALIDATE SELECTED COMMITS"
            echo "============================================================"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              PARENT_COUNT=$(
                commit_parent_count "$sha"
              )

              if (( PARENT_COUNT > 1 )); then

                (( MAINLINE_PARENT <= PARENT_COUNT )) ||
                  error \
                    "Commit $sha is a merge commit with $PARENT_COUNT parents; mainline_parent=$MAINLINE_PARENT is invalid."

              fi

            done < "$TMP/selected"

          fi

          # ==============================================================
          # DETERMINE COMMITS ALREADY IN TARGET
          #
          # This is ancestry-based only.
          #
          # We deliberately do NOT treat patch-id equivalence as proof
          # that a commit can be dropped. Two commits can introduce
          # similar changes while carrying different intent.
          # ==============================================================

          : > "$TMP/already_applied"

          if [[ "$SELECTED_COUNT" -gt 0 ]]; then

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if git merge-base \
                --is-ancestor \
                "$sha" \
                "$TARGET_SHA" \
                2>/dev/null; then

                printf '%s\n' "$sha" \
                  >> "$TMP/already_applied"

              fi

            done < "$TMP/selected"

          fi

          ALREADY_COUNT=$(
            count_lines "$TMP/already_applied"
          )

          # ==============================================================
          # BUILD EXECUTABLE SELECTION
          # ==============================================================

          if [[ -s "$TMP/already_applied" ]]; then

            grep -vxFf \
              "$TMP/already_applied" \
              "$TMP/selected" \
              > "$TMP/executable" || true

          else

            cp \
              "$TMP/selected" \
              "$TMP/executable"

          fi

          EXECUTABLE_COUNT=$(
            count_lines "$TMP/executable"
          )

          # ==============================================================
          # SAFETY CHECKS
          # ==============================================================

          case "$STRATEGY" in

            cherry-pick)

              if [[ -n "$COMMIT_MESSAGE" &&
                    "$EXECUTABLE_COUNT" -ne 1 ]]; then

                error \
                  "commit_message for cherry-pick requires exactly one executable commit."

              fi

              ;;

            squash)

              ;;

            merge-selected)

              ;;

            merge-branch)

              ;;

            rebase-branch)

              ;;

          esac

          # ==============================================================
          # PLAN
          # ==============================================================

          echo
          echo "============================================================"
          echo "OPERATION PLAN"
          echo "============================================================"

          echo "Strategy:             $STRATEGY"
          echo "Target branch:        $TARGET_BRANCH"
          echo "Target SHA:           $TARGET_SHA"
          echo "Source branch:        ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:           ${SOURCE_SHA:-<none>}"
          echo "Selection mode:       $([[ "$EXCLUDE_COMMITS" == "true" ]] && echo exclude || echo include)"
          echo "Conflict resolution:  $CONFLICT_RESOLUTION"
          echo "Preserve merges:      $PRESERVE_MERGES"
          echo "Mainline parent:      $MAINLINE_PARENT"
          echo "Input commits:        $INPUT_COUNT"
          echo "Source commits:       $SOURCE_COUNT"
          echo "Selected commits:     $SELECTED_COUNT"
          echo "Already in target:    $ALREADY_COUNT"
          echo "Executable commits:   $EXECUTABLE_COUNT"
          echo "Source depth used:    $CURRENT_SOURCE_DEPTH"
          echo "Target depth used:    $CURRENT_TARGET_DEPTH"
          echo "Merge bases found:    $(count_lines "$TMP/merge_bases")"
          echo

          if [[ -s "$TMP/merge_bases" ]]; then

            echo "Merge bases:"
            sed 's/^/  /' "$TMP/merge_bases"
            echo

          fi

          echo "Executable commits:"
          echo "------------------------------------------------------------"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            PARENT_COUNT=$(
              commit_parent_count "$sha"
            )

            echo
            echo "$sha"
            echo "  parents: $PARENT_COUNT"
            echo "  subject: $(git log -1 --format='%s' "$sha")"

            if (( PARENT_COUNT > 1 )); then

              echo "  mainline: $MAINLINE_PARENT"

            fi

          done < "$TMP/executable"

          echo
          echo "------------------------------------------------------------"

          {
            echo "MERGE_BASE=$MERGE_BASE"
            echo "SELECTED_COUNT=$SELECTED_COUNT"
            echo "EXECUTABLE_COUNT=$EXECUTABLE_COUNT"
            echo "ALREADY_COUNT=$ALREADY_COUNT"
            echo "SOURCE_COUNT=$SOURCE_COUNT"
            echo "SOURCE_DEPTH=$CURRENT_SOURCE_DEPTH"
            echo "TARGET_DEPTH=$CURRENT_TARGET_DEPTH"
          } >> "$GITHUB_ENV"

      # ================================================================
      # DRY RUN
      # ================================================================

      - name: Dry run
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "DRY RUN"
          echo "============================================================"

          case "$STRATEGY" in

            cherry-pick)
              echo "The executable commits would be cherry-picked individually."
              ;;

            squash)
              echo "The executable commits would be replayed without individual commits and combined into one commit."
              ;;

            merge-selected)
              echo "The executable commits would be replayed onto a temporary branch and merged with --no-ff."
              ;;

            merge-branch)

              if [[ "$EXCLUDE_COMMITS" == "true" ||
                    "${COMMITS_INPUT:-}" != "" ]]; then

                echo "A selective branch would be constructed and merged."

              else

                echo "The source branch would be merged natively."

              fi

              ;;

            rebase-branch)

              if [[ "$EXCLUDE_COMMITS" == "true" ||
                    "${COMMITS_INPUT:-}" != "" ]]; then

                echo "A selective rebase-equivalent replay would be performed."

              else

                echo "The complete source branch would be rebased onto target."

              fi

              ;;

            apply-patch)
              echo "The patch would be applied to target."
              ;;

            apply-diff)
              echo "The diff would be applied to target."
              ;;

          esac

          echo
          echo "No remote branch will be modified."

      # ================================================================
      # COMMON CHERRY-PICK ENGINE
      #
      # This is the fundamental primitive used by selective strategies.
      #
      # Merge commits are replayed with:
      #
      #   git cherry-pick -m <mainline>
      #
      # Conflict handling is centralized here.
      # ================================================================

      - name: Apply selected commits
        if: ${{ !inputs.dry_run && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'merge-branch' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          CONFLICT_RESOLUTION: ${{ inputs.conflict_resolution }}
          MAINLINE_PARENT: ${{ inputs.mainline_parent }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
          PRESERVE_MERGES: ${{ inputs.preserve_merges }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          warning() {
            echo "::warning::$*" >&2
          }

          commit_parent_count() {
            git rev-list \
              --parents \
              -n 1 \
              "$1" |
              awk '{print NF-1}'
          }

          unresolved_files() {
            git diff \
              --name-only \
              --diff-filter=U
          }

          resolve_conflicts() {

            case "$CONFLICT_RESOLUTION" in

              fail)

                echo "::error::Unresolved Git conflicts."
                echo
                echo "Conflicting files:"
                unresolved_files || true
                echo
                git status --short || true

                return 1
                ;;

              rerere)

                git rerere || true

                git add -A

                if unresolved_files | grep -q .; then

                  echo "::error::rerere did not resolve all conflicts."
                  unresolved_files || true

                  return 1

                fi

                ;;

              ours)

                git checkout \
                  --ours \
                  -- . || true

                git add -A

                if unresolved_files | grep -q .; then

                  return 1

                fi

                ;;

              theirs)

                git checkout \
                  --theirs \
                  -- . || true

                git add -A

                if unresolved_files | grep -q .; then

                  return 1

                fi

                ;;

              *)

                return 1
                ;;

            esac

            return 0
          }

          cherry_pick_one() {

            local sha="$1"
            local no_commit="${2:-false}"

            local parent_count

            parent_count=$(
              commit_parent_count "$sha"
            )

            args=(
              cherry-pick
              --empty=drop
            )

            if [[ "$no_commit" == "true" ]]; then

              args+=(
                --no-commit
              )

            else

              args+=(
                --no-edit
              )

            fi

            if (( parent_count > 1 )); then

              args+=(
                -m
                "$MAINLINE_PARENT"
              )

            fi

            if [[ "$CONFLICT_RESOLUTION" == "ours" ||
                  "$CONFLICT_RESOLUTION" == "theirs" ]]; then

              args+=(
                "-X$CONFLICT_RESOLUTION"
              )

            elif [[ "$CONFLICT_RESOLUTION" == "rerere" ]]; then

              args+=(
                --rerere-autoupdate
              )

            fi

            echo
            echo "Applying:"
            echo "  $sha"
            echo "  $(git log -1 --format='%s' "$sha")"

            if git "${args[@]}" "$sha"; then

              return 0

            fi

            echo
            echo "Automatic application failed."

            if ! resolve_conflicts; then

              git cherry-pick --abort || true

              return 1

            fi

            if git rev-parse \
              --verify \
              CHERRY_PICK_HEAD >/dev/null 2>&1; then

              git cherry-pick \
                --continue || {

                git cherry-pick --abort || true

                return 1

              }

            fi

            return 0
          }

          # ==============================================================
          # TARGET CHECKOUT
          # ==============================================================

          git switch \
            --detach \
            "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty before operation."

          # ==============================================================
          # CHERRY-PICK
          # ==============================================================

          if [[ "$STRATEGY" == "cherry-pick" ]]; then

            [[ -s "$TMP/executable" ]] ||
              error "No executable commits remain."

            COUNT="$EXECUTABLE_COUNT"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if [[ "$COUNT" -eq 1 &&
                    -n "$COMMIT_MESSAGE" ]]; then

                cherry_pick_one \
                  "$sha" \
                  true ||
                  error \
                    "Failed to cherry-pick $sha."

                git diff \
                  --cached \
                  --quiet &&
                  error \
                    "Cherry-pick produced no changes for $sha."

                git commit \
                  -m "$COMMIT_MESSAGE"

              else

                cherry_pick_one \
                  "$sha" ||
                  error \
                    "Failed to cherry-pick $sha."

              fi

            done < "$TMP/executable"

          # ==============================================================
          # SQUASH
          # ==============================================================

          elif [[ "$STRATEGY" == "squash" ]]; then

            [[ -s "$TMP/executable" ]] ||
              error "No executable commits remain for squash."

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              cherry_pick_one \
                "$sha" \
                true ||
                error \
                  "Failed to apply $sha during squash."

            done < "$TMP/executable"

            git diff \
              --cached \
              --quiet &&
              error \
                "Squash produced no changes."

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              MESSAGE="$COMMIT_MESSAGE"

            else

              MESSAGE="Squash selected commits"

            fi

            git commit \
              -m "$MESSAGE"

          # ==============================================================
          # SELECTIVE MERGE
          #
          # We first create a temporary branch containing exactly the
          # selected changes, then merge that result into target.
          # ==============================================================

          elif [[ "$STRATEGY" == "merge-selected" ]]; then

            [[ -s "$TMP/executable" ]] ||
              error \
                "No executable commits remain for merge-selected."

            TEMP_BRANCH="workflow-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            git switch \
              -c "$TEMP_BRANCH"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              cherry_pick_one \
                "$sha" ||
                {
                  git cherry-pick --abort || true
                  git switch --detach "$TARGET_SHA" || true
                  git branch -D "$TEMP_BRANCH" || true
                  error \
                    "Failed to replay $sha."
                }

            done < "$TMP/executable"

            SELECTED_SHA=$(
              git rev-parse HEAD
            )

            [[ "$SELECTED_SHA" != "$TARGET_SHA" ]] ||
              error \
                "Selected commits produced no changes."

            git switch \
              --detach \
              "$TARGET_SHA"

            MERGE_ARGS=(
              merge
              --no-ff
              --no-edit
            )

            if [[ "$CONFLICT_RESOLUTION" == "ours" ||
                  "$CONFLICT_RESOLUTION" == "theirs" ]]; then

              MERGE_ARGS+=(
                "-X$CONFLICT_RESOLUTION"
              )

            elif [[ "$CONFLICT_RESOLUTION" == "rerere" ]]; then

              MERGE_ARGS+=(
                --rerere-autoupdate
              )

            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              MERGE_ARGS+=(
                -m
                "$COMMIT_MESSAGE"
              )

            fi

            git "${MERGE_ARGS[@]}" \
              "$SELECTED_SHA" || {

              if ! resolve_conflicts; then

                git merge --abort || true
                git branch -D "$TEMP_BRANCH" || true

                error \
                  "Selective merge failed."

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                git commit \
                  -m "$COMMIT_MESSAGE"

              else

                git commit \
                  -m "Merge selected commits"

              fi

            }

            git branch \
              -D "$TEMP_BRANCH" \
              >/dev/null 2>&1 || true

          # ==============================================================
          # MERGE BRANCH
          #
          # No selection/exclusion:
          #     native merge
          #
          # Selection/exclusion:
          #     selective replay -> merge
          # ==============================================================

          elif [[ "$STRATEGY" == "merge-branch" ]]; then

            [[ -n "$SOURCE_SHA" ]] ||
              error "Source SHA is required."

            if [[ "$INPUT_COUNT" -eq 0 &&
                  "$EXCLUDE_COMMITS" == "false" ]]; then

              if git merge-base \
                --is-ancestor \
                "$SOURCE_SHA" \
                "$TARGET_SHA"; then

                error \
                  "Source branch is already contained in target."

              fi

              MERGE_ARGS=(
                merge
                --no-ff
                --no-edit
              )

              if [[ "$CONFLICT_RESOLUTION" == "ours" ||
                    "$CONFLICT_RESOLUTION" == "theirs" ]]; then

                MERGE_ARGS+=(
                  "-X$CONFLICT_RESOLUTION"
                )

              elif [[ "$CONFLICT_RESOLUTION" == "rerere" ]]; then

                MERGE_ARGS+=(
                  --rerere-autoupdate
                )

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                MERGE_ARGS+=(
                  -m
                  "$COMMIT_MESSAGE"
                )

              fi

              git "${MERGE_ARGS[@]}" \
                "$SOURCE_SHA" || {

                if ! resolve_conflicts; then

                  git merge --abort || true

                  error \
                    "Native merge failed."

                fi

                if [[ -n "$COMMIT_MESSAGE" ]]; then

                  git commit \
                    -m "$COMMIT_MESSAGE"

                else

                  git commit \
                    -m "Merge ${{ inputs.source_branch }}"

                fi

              }

            else

              [[ -s "$TMP/executable" ]] ||
                error \
                  "No executable commits remain for selective merge."

              TEMP_BRANCH="workflow-merge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

              git switch \
                -c "$TEMP_BRANCH"

              while IFS= read -r sha; do

                [[ -n "$sha" ]] || continue

                cherry_pick_one \
                  "$sha" ||
                  {
                    git cherry-pick --abort || true
                    git switch --detach "$TARGET_SHA" || true
                    git branch -D "$TEMP_BRANCH" || true
                    error \
                      "Failed to replay $sha for selective merge."
                  }

              done < "$TMP/executable"

              SELECTED_SHA=$(
                git rev-parse HEAD
              )

              [[ "$SELECTED_SHA" != "$TARGET_SHA" ]] ||
                error \
                  "Selected changes produced no result."

              git switch \
                --detach \
                "$TARGET_SHA"

              MERGE_ARGS=(
                merge
                --no-ff
                --no-edit
              )

              if [[ "$CONFLICT_RESOLUTION" == "ours" ||
                    "$CONFLICT_RESOLUTION" == "theirs" ]]; then

                MERGE_ARGS+=(
                  "-X$CONFLICT_RESOLUTION"
                )

              elif [[ "$CONFLICT_RESOLUTION" == "rerere" ]]; then

                MERGE_ARGS+=(
                  --rerere-autoupdate
                )

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                MERGE_ARGS+=(
                  -m
                  "$COMMIT_MESSAGE"
                )

              fi

              git "${MERGE_ARGS[@]}" \
                "$SELECTED_SHA" || {

                if ! resolve_conflicts; then

                  git merge --abort || true
                  git branch -D "$TEMP_BRANCH" || true

                  error \
                    "Selective merge failed."

                fi

                if [[ -n "$COMMIT_MESSAGE" ]]; then

                  git commit \
                    -m "$COMMIT_MESSAGE"

                else

                  git commit \
                    -m "Merge selected commits"

                fi

              }

              git branch \
                -D "$TEMP_BRANCH" \
                >/dev/null 2>&1 || true

            fi

          # ==============================================================
          # REBASE
          #
          # Full source, no selection:
          #
          #   Native git rebase.
          #
          # Any explicit selection/exclusion:
          #
          #   Selective replay.
          #
          # This deliberately avoids generating a fragile custom rebase
          # todo for arbitrary commit selection.
          #
          # The resulting history is a rebase-equivalent history:
          # selected changes are replayed onto target.
          # ==============================================================

          elif [[ "$STRATEGY" == "rebase-branch" ]]; then

            [[ -n "$SOURCE_SHA" ]] ||
              error "Source SHA is required."

            if [[ "$INPUT_COUNT" -eq 0 &&
                  "$EXCLUDE_COMMITS" == "false" ]]; then

              REBASE_ARGS=(
                rebase
                --onto
                "$TARGET_SHA"
                "$MERGE_BASE"
                "$SOURCE_SHA"
              )

              if [[ "$PRESERVE_MERGES" == "true" ]]; then

                REBASE_ARGS+=(
                  --rebase-merges
                )

              else

                REBASE_ARGS+=(
                  --no-rebase-merges
                )

              fi

              REBASE_ARGS+=(
                --empty=drop
              )

              if [[ "$CONFLICT_RESOLUTION" == "ours" ||
                    "$CONFLICT_RESOLUTION" == "theirs" ]]; then

                REBASE_ARGS+=(
                  "-X$CONFLICT_RESOLUTION"
                )

              fi

              set +e

              GIT_EDITOR=true \
                git "${REBASE_ARGS[@]}"

              RC=$?

              set -e

              while [[ -d .git/rebase-merge ||
                       -d .git/rebase-apply ]]; do

                if git diff \
                  --name-only \
                  --diff-filter=U |
                  grep -q .; then

                  resolve_conflicts ||
                    {
                      git rebase --abort || true
                      error \
                        "Rebase conflicts could not be resolved."
                    }

                fi

                set +e

                GIT_EDITOR=true \
                  git rebase --continue

                RC=$?

                set -e

                if [[ "$RC" -ne 0 ]]; then

                  if git diff \
                    --name-only \
                    --diff-filter=U |
                    grep -q .; then

                    continue

                  fi

                  git rebase --abort || true

                  error \
                    "Rebase failed."

                fi

              done

              [[ "$RC" -eq 0 ]] ||
                error \
                  "Rebase failed."

            else

              # ----------------------------------------------------------
              # SELECTIVE REBASE
              #
              # Start at target and replay the universal selection.
              # ----------------------------------------------------------

              [[ -s "$TMP/executable" ]] ||
                error \
                  "No executable commits remain for selective rebase."

              git switch \
                --detach \
                "$TARGET_SHA"

              while IFS= read -r sha; do

                [[ -n "$sha" ]] || continue

                cherry_pick_one \
                  "$sha" ||
                  error \
                    "Selective rebase failed on $sha."

              done < "$TMP/executable"

            fi

          fi

          # ==============================================================
          # FINAL SHA
          # ==============================================================

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          [[ "$FINAL_SHA" != "$TARGET_SHA" ]] ||
            error \
              "Operation produced no changes."

          [[ -z "$(git status --porcelain)" ]] ||
            error \
              "Working tree is dirty after operation."

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ================================================================
      # PATCH / DIFF
      # ================================================================

      - name: Apply patch or diff
        if: ${{ !inputs.dry_run && (inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff') }}
        shell: bash
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git switch \
            --detach \
            "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error \
              "Working tree is dirty."

          [[ -f "$PATCH_FILE" ]] ||
            error \
              "Patch/diff file does not exist: $PATCH_FILE"

          git apply \
            --check \
            --3way \
            "$PATCH_FILE" ||
            error \
              "Patch/diff cannot be applied cleanly."

          git apply \
            --3way \
            "$PATCH_FILE" ||
            error \
              "Patch/diff application failed."

          git diff \
            --quiet &&
            error \
              "Patch/diff produced no changes."

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            MESSAGE="$COMMIT_MESSAGE"

          else

            MESSAGE="Apply $(basename "$PATCH_FILE")"

          fi

          git commit \
            -m "$MESSAGE"

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ================================================================
      # FINAL VALIDATION
      # ================================================================

      - name: Final validation
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          FINAL_SHA: ${{ env.FINAL_SHA }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          echo
          echo "============================================================"
          echo "FINAL VALIDATION"
          echo "============================================================"

          [[ -n "$FINAL_SHA" ]] ||
            error \
              "FINAL_SHA is empty."

          git cat-file \
            -e "$FINAL_SHA^{commit}" ||
            error \
              "Final SHA is not a valid commit."

          [[ "$FINAL_SHA" != "$TARGET_SHA" ]] ||
            error \
              "Final SHA equals original target."

          [[ -z "$(git status --porcelain)" ]] ||
            error \
              "Working tree is dirty."

          echo
          echo "Original target:"
          echo "  $TARGET_SHA"

          echo
          echo "Final commit:"
          echo "  $FINAL_SHA"

          echo
          git show \
            --no-ext-diff \
            --stat \
            --oneline \
            "$FINAL_SHA"

      # ================================================================
      # REMOTE RACE PROTECTION
      #
      # We re-fetch ONLY the target branch tip.
      #
      # We do not fetch its history again.
      # ================================================================

      - name: Validate target has not changed
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_SHA=$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )

          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then

            error \
              "Target branch changed while the workflow was running. No push will be performed."

          fi

      # ================================================================
      # PUSH
      # ================================================================

      - name: Push result
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
          FINAL_SHA: ${{ env.FINAL_SHA }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "PUSH"
          echo "============================================================"

          case "$STRATEGY" in

            rebase-branch)

              # Rebase intentionally rewrites the source-derived result.
              #
              # The lease protects the target from an unexpected update
              # between preparation and push.

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              # All other strategies are expected to be descendants of
              # the original target.

              if ! git merge-base \
                --is-ancestor \
                "$TARGET_SHA" \
                "$FINAL_SHA"; then

                echo "::error::Final result is not a descendant of target."
                exit 1

              fi

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

          echo
          echo "============================================================"
          echo "SUCCESS"
          echo "============================================================"

          echo "Strategy:       $STRATEGY"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Previous SHA:   $TARGET_SHA"
          echo "Final SHA:      $FINAL_SHA"
