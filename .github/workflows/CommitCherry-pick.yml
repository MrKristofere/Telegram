name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA via Space. If empty, commits are taken from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How to apply changes"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch

      source_branch:
        description: "Source branch. Used when commits are empty or for merge/rebase."
        required: false
        type: string

      commit_message:
        description: "Commit/merge message. If empty, generated automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate inputs
        env:
          COMMITS: ${{ inputs.commits }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          echo "Strategy:      $STRATEGY"
          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: ${SOURCE_BRANCH:-<not specified>}"
          echo "Commits:       ${COMMITS:-<not specified>}"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is required"
            exit 1
          fi

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected)
              if [[ -z "$COMMITS" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::Either commits or source_branch is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            merge-branch|rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::source_branch is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same"
            exit 1
          fi

      - name: Fetch target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git fetch origin "$SOURCE_BRANCH"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Resolve and sort commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        env:
          COMMITS: ${{ inputs.commits }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          rm -f /tmp/input_commits.txt
          rm -f /tmp/sorted_commits.txt

          #
          # If explicit SHAs were provided, use them.
          #
          if [[ -n "$COMMITS" ]]; then
            echo "Using explicitly selected commits"

            for commit in $COMMITS; do
              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              echo "$commit" >> /tmp/input_commits.txt
            done

          #
          # Otherwise take all commits that exist on source_branch
          # but not on target_branch.
          #
          elif [[ -n "$SOURCE_BRANCH" ]]; then
            echo "No explicit commits provided."
            echo "Collecting commits from source branch: $SOURCE_BRANCH"

            git rev-list \
              "origin/$TARGET_BRANCH..origin/$SOURCE_BRANCH" \
              > /tmp/input_commits.txt

          else
            echo "::error::No commits or source_branch provided"
            exit 1
          fi

          #
          # Remove duplicates.
          #
          sort -u /tmp/input_commits.txt > /tmp/unique_commits.txt

          #
          # Sort commits by AUTHOR DATE from oldest to newest.
          #
          # Format:
          # timestamp<TAB>SHA
          #
          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue

            author_timestamp="$(git show -s --format=%at "$commit")"

            printf '%s\t%s\n' \
              "$author_timestamp" \
              "$commit"

          done < /tmp/unique_commits.txt \
            | sort -n -k1,1 -k2,2 \
            | cut -f2 \
            > /tmp/sorted_commits.txt

          if [[ ! -s /tmp/sorted_commits.txt ]]; then
            echo "::error::No commits found to apply"
            exit 1
          fi

          echo ""
          echo "Commits will be applied in chronological order:"
          echo ""

          while IFS= read -r commit; do
            timestamp="$(git show -s --format='%aI' "$commit")"
            subject="$(git show -s --format='%s' "$commit")"

            echo "$timestamp $commit $subject"
          done < /tmp/sorted_commits.txt

          #
          # Make the list available to following steps.
          #
          {
            echo 'COMMITS_TO_APPLY<<EOF'
            cat /tmp/sorted_commits.txt
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Apply changes
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          STRATEGY: ${{ inputs.strategy }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          case "$STRATEGY" in

            # =========================================================
            # CHERRY-PICK
            # =========================================================
            cherry-pick)
              echo "Strategy: cherry-pick"

              git checkout "$TARGET_BRANCH"

              while IFS= read -r commit; do
                [[ -z "$commit" ]] && continue

                echo "Cherry-picking: $commit"

                git cherry-pick "$commit" || {
                  echo "::error::Cherry-pick failed for commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done <<< "$COMMITS_TO_APPLY"
              ;;


            # =========================================================
            # SQUASH
            # =========================================================
            squash)
              echo "Strategy: squash"

              git checkout "$TARGET_BRANCH"

              while IFS= read -r commit; do
                [[ -z "$commit" ]] && continue

                echo "Applying without commit: $commit"

                git cherry-pick --no-commit "$commit" || {
                  echo "::error::Failed to apply commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done <<< "$COMMITS_TO_APPLY"

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              elif [[ -n "$SOURCE_BRANCH" ]]; then
                FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"
              else
                FINAL_MESSAGE="chore: squash selected commits"
              fi

              git commit -m "$FINAL_MESSAGE"
              ;;


            # =========================================================
            # MERGE SELECTED
            # =========================================================
            merge-selected)
              echo "Strategy: merge-selected"

              TEMP_BRANCH="automation/apply-${GITHUB_RUN_ID}"

              git checkout "$TARGET_BRANCH"
              git checkout -b "$TEMP_BRANCH"

              while IFS= read -r commit; do
                [[ -z "$commit" ]] && continue

                echo "Cherry-picking into temporary branch: $commit"

                git cherry-pick "$commit" || {
                  echo "::error::Cherry-pick failed for commit: $commit"

                  if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
                    git cherry-pick --abort
                  fi

                  exit 1
                }
              done <<< "$COMMITS_TO_APPLY"

              git checkout "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              elif [[ -n "$SOURCE_BRANCH" ]]; then
                FINAL_MESSAGE="Merge selected commits from $SOURCE_BRANCH"
              else
                FINAL_MESSAGE="Merge selected commits"
              fi

              git merge \
                --no-ff \
                "$TEMP_BRANCH" \
                -m "$FINAL_MESSAGE" || {
                  echo "::error::Merge failed"

                  if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                    git merge --abort
                  fi

                  exit 1
                }

              git branch -D "$TEMP_BRANCH"
              ;;


            # =========================================================
            # MERGE BRANCH
            # =========================================================
            merge-branch)
              echo "Strategy: merge-branch"
              echo "Source: $SOURCE_BRANCH"
              echo "Target: $TARGET_BRANCH"

              git checkout "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
              fi

              git merge \
                --no-ff \
                "origin/$SOURCE_BRANCH" \
                -m "$FINAL_MESSAGE" || {
                  echo "::error::Merge failed"

                  if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                    git merge --abort
                  fi

                  exit 1
                }
              ;;


            # =========================================================
            # REBASE BRANCH
            # =========================================================
            rebase-branch)
              echo "Strategy: rebase-branch"
              echo "Source: $SOURCE_BRANCH"
              echo "Target: $TARGET_BRANCH"

              git fetch origin \
                "$SOURCE_BRANCH:$SOURCE_BRANCH"

              git fetch origin \
                "$TARGET_BRANCH:$TARGET_BRANCH"

              #
              # Make sure source branch is based on the latest
              # target branch.
              #
              git checkout "$SOURCE_BRANCH"

              MERGE_BASE="$(git merge-base \
                "$SOURCE_BRANCH" \
                "$TARGET_BRANCH")"

              echo "Merge base: $MERGE_BASE"

              git rebase \
                --onto "$TARGET_BRANCH" \
                "$MERGE_BASE" || {
                  echo "::error::Rebase failed"

                  if git rebase --show-current-patch >/dev/null 2>&1; then
                    git rebase --abort
                  fi

                  exit 1
                }

              REBASED_HEAD="$(git rev-parse HEAD)"

              echo "Rebased HEAD: $REBASED_HEAD"

              #
              # Move target branch forward.
              #
              git checkout "$TARGET_BRANCH"

              git merge \
                --ff-only \
                "$REBASED_HEAD" || {
                  echo "::error::Fast-forward of target branch failed"
                  exit 1
                }
              ;;

          esac

      - name: Show result
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          echo "========================================"
          echo "Strategy:      $STRATEGY"
          echo "Target branch: $TARGET_BRANCH"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            -10

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"
