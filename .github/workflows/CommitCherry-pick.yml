name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:

      strategy:
        description: "How changes should be applied"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: false
        type: string

      commits:
        description: "Commit SHA(s), separated by spaces or new lines"
        required: false
        type: string

      exclude_commits:
        description: "If enabled, commits become exclusions from source branch"
        required: false
        default: false
        type: boolean

      patch_file:
        description: "Repository-relative .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom commit message"
        required: false
        type: string

      dry_run:
        description: "Validate and show the planned operation without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false
          git config pull.rebase false
          git config rebase.autoStash false
          git config rebase.autoSquash false
          git config rebase.updateRefs false
          git config rebase.missingCommitsCheck error

      - name: Prepare operation
        id: prepare
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMITS_INPUT: ${{ inputs.commits }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail

          TMP="$RUNNER_TEMP/apply-commits"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo "TMP=$TMP" >> "$GITHUB_ENV"

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          echo "========================================"
          echo "INPUT VALIDATION"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick|
            squash|
            merge-selected|
            merge-branch|
            rebase-branch|
            apply-patch|
            apply-diff)
              ;;
            *)
              error "Unknown strategy: $STRATEGY"
              ;;
          esac

          [[ -n "$TARGET_BRANCH" ]] ||
            error "target_branch is required"

          git check-ref-format \
            --branch "$TARGET_BRANCH" >/dev/null 2>&1 ||
            error "Invalid target branch: $TARGET_BRANCH"

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format \
              --branch "$SOURCE_BRANCH" >/dev/null 2>&1 ||
              error "Invalid source branch: $SOURCE_BRANCH"
          fi

          # --------------------------------------------------------
          # Strategy-specific validation
          # --------------------------------------------------------

          case "$STRATEGY" in

            apply-patch|apply-diff)

              [[ -n "$PATCH_FILE" ]] ||
                error "$STRATEGY requires patch_file"

              [[ -f "$PATCH_FILE" ]] ||
                error "Patch/diff file does not exist: $PATCH_FILE"

              [[ -z "$SOURCE_BRANCH" ]] ||
                error "$STRATEGY does not use source_branch"

              [[ -z "$COMMITS_INPUT" ]] ||
                error "$STRATEGY does not use commits"

              [[ "$EXCLUDE_COMMITS" == "false" ]] ||
                error "$STRATEGY does not support exclude_commits"

              ;;

            merge-branch|rebase-branch)

              [[ -n "$SOURCE_BRANCH" ]] ||
                error "$STRATEGY requires source_branch"

              ;;

            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" &&
                    -z "$COMMITS_INPUT" ]]; then
                error "$STRATEGY requires source_branch or commits"
              fi

              ;;

          esac

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] ||
              error "exclude_commits=true requires source_branch"

            [[ -n "$COMMITS_INPUT" ]] ||
              error "exclude_commits=true requires commits"

          fi

          # --------------------------------------------------------
          # Custom message rules
          # --------------------------------------------------------

          case "$STRATEGY" in

            cherry-pick)

              COUNT=$(
                printf '%s\n' "$COMMITS_INPUT" |
                tr ' ' '\n' |
                sed '/^[[:space:]]*$/d' |
                awk '!seen[$0]++' |
                wc -l |
                tr -d ' '
              )

              if [[ -n "$COMMIT_MESSAGE" &&
                    "$COUNT" -ne 1 ]]; then

                error \
                  "For cherry-pick, commit_message is allowed only when exactly one commit is selected."

              fi

              ;;

            squash|merge-selected|merge-branch)

              ;;

            rebase-branch)

              # Rebase preserves individual commits.
              # A custom commit message is therefore NOT applied
              # to the entire rebase.
              if [[ -n "$COMMIT_MESSAGE" ]]; then
                echo "::warning::commit_message is ignored for rebase-branch."
              fi

              ;;

            apply-patch|apply-diff)

              ;;

          esac

          # --------------------------------------------------------
          # Fetch target
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FETCH TARGET"
          echo "========================================"

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA=$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Fetch source
          # --------------------------------------------------------

          SOURCE_SHA=""

          if [[ -n "$SOURCE_BRANCH" ]]; then

            echo
            echo "========================================"
            echo "FETCH SOURCE"
            echo "========================================"

            git fetch \
              --no-tags \
              --filter=blob:none \
              origin \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            SOURCE_SHA=$(
              git rev-parse \
                "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
            )

          fi

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Normalize explicit SHA input
          # --------------------------------------------------------

          : > "$TMP/input.raw"
          : > "$TMP/input"

          if [[ -n "$COMMITS_INPUT" ]]; then

            printf '%s\n' "$COMMITS_INPUT" |
              tr ' ' '\n' |
              sed '/^[[:space:]]*$/d' |
              sed 's/^[[:space:]]*//' |
              sed 's/[[:space:]]*$//' \
              > "$TMP/input.raw"

            while IFS= read -r value; do

              [[ -n "$value" ]] || continue

              [[ "$value" =~ ^[0-9a-fA-F]{7,64}$ ]] ||
                error "Invalid commit SHA: $value"

              if ! git cat-file -e "$value^{commit}" 2>/dev/null; then

                git fetch \
                  --no-tags \
                  --filter=blob:none \
                  origin \
                  "$value" ||
                  error "Cannot fetch commit: $value"

              fi

              sha=$(
                git rev-parse "$value^{commit}" 2>/dev/null
              ) ||
                error "Cannot resolve commit: $value"

              printf '%s\n' "$sha"

            done < "$TMP/input.raw" |
              awk '!seen[$0]++' \
              > "$TMP/input"

          fi

          INPUT_COUNT=$(
            wc -l < "$TMP/input" |
            tr -d ' '
          )

          # --------------------------------------------------------
          # Source topology
          # --------------------------------------------------------

          MERGE_BASE=""

          if [[ -n "$SOURCE_SHA" ]]; then

            echo
            echo "========================================"
            echo "BUILD SOURCE HISTORY"
            echo "========================================"

            mapfile -t BASES < <(
              git merge-base --all \
                "$TARGET_SHA" \
                "$SOURCE_SHA"
            )

            (( ${#BASES[@]} == 1 )) ||
              error \
                "Expected exactly one merge base, found ${#BASES[@]}."

            MERGE_BASE="${BASES[0]}"

            git rev-list \
              --topo-order \
              --reverse \
              "$MERGE_BASE..$SOURCE_SHA" \
              > "$TMP/source_history"

          else

            : > "$TMP/source_history"

          fi

          SOURCE_COUNT=$(
            wc -l < "$TMP/source_history" |
            tr -d ' '
          )

          # --------------------------------------------------------
          # Build selection
          # --------------------------------------------------------

          : > "$TMP/selected"

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              cp \
                "$TMP/source_history" \
                "$TMP/selected"

              ;;

            cherry-pick|squash|merge-selected)

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                # source history MINUS requested commits

                awk '
                  NR == FNR {
                    excluded[$1] = 1
                    next
                  }

                  !excluded[$1] {
                    print $1
                  }
                ' \
                  "$TMP/input" \
                  "$TMP/source_history" \
                  > "$TMP/selected"

              elif [[ -n "$SOURCE_BRANCH" &&
                      -n "$COMMITS_INPUT" ]]; then

                # Explicit commits, but ordered according to
                # source topology.

                awk '
                  NR == FNR {
                    wanted[$1] = 1
                    next
                  }

                  wanted[$1] {
                    print $1
                  }
                ' \
                  "$TMP/input" \
                  "$TMP/source_history" \
                  > "$TMP/selected"

                sort -u \
                  "$TMP/input" \
                  > "$TMP/input.sorted"

                sort -u \
                  "$TMP/selected" \
                  > "$TMP/selected.sorted"

                MISSING=$(
                  comm \
                    -23 \
                    "$TMP/input.sorted" \
                    "$TMP/selected.sorted"
                )

                [[ -z "$MISSING" ]] ||
                  error \
                  "The following commits are not reachable from source_branch: $MISSING"

              elif [[ -n "$COMMITS_INPUT" ]]; then

                cp \
                  "$TMP/input" \
                  "$TMP/selected"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                cp \
                  "$TMP/source_history" \
                  "$TMP/selected"

              fi

              ;;

          esac

          # --------------------------------------------------------
          # Deduplicate selection
          # --------------------------------------------------------

          awk '!seen[$0]++' \
            "$TMP/selected" \
            > "$TMP/selected.unique"

          mv \
            "$TMP/selected.unique" \
            "$TMP/selected"

          SELECTED_COUNT=$(
            wc -l < "$TMP/selected" |
            tr -d ' '
          )

          # --------------------------------------------------------
          # Already present in target
          #
          # We check commit ancestry only.
          #
          # No full patch-id scan of target history.
          # --------------------------------------------------------

          : > "$TMP/already_applied"

          if [[ "$SELECTED_COUNT" -gt 0 ]]; then

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if git merge-base \
                --is-ancestor \
                "$sha" \
                "$TARGET_SHA" \
                2>/dev/null; then

                printf '%s\n' "$sha" \
                  >> "$TMP/already_applied"

              fi

            done < "$TMP/selected"

          fi

          if [[ -s "$TMP/already_applied" ]]; then

            grep -vxFf \
              "$TMP/already_applied" \
              "$TMP/selected" \
              > "$TMP/executable" || true

          else

            cp \
              "$TMP/selected" \
              "$TMP/executable"

          fi

          EXECUTABLE_COUNT=$(
            wc -l < "$TMP/executable" |
            tr -d ' '
          )

          ALREADY_COUNT=$(
            wc -l < "$TMP/already_applied" |
            tr -d ' '
          )

          # --------------------------------------------------------
          # Summary
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "PLAN"
          echo "========================================"

          echo "Strategy:          $STRATEGY"
          echo "Target branch:     $TARGET_BRANCH"
          echo "Source branch:     ${SOURCE_BRANCH:-<none>}"
          echo "Exclude:           $EXCLUDE_COMMITS"
          echo "Input commits:     $INPUT_COUNT"
          echo "Source commits:    $SOURCE_COUNT"
          echo "Selected commits:  $SELECTED_COUNT"
          echo "Already in target: $ALREADY_COUNT"
          echo "To process:        $EXECUTABLE_COUNT"
          echo "Target SHA:        $TARGET_SHA"
          echo "Source SHA:        ${SOURCE_SHA:-<none>}"
          echo "Merge base:        ${MERGE_BASE:-<none>}"

          echo
          echo "Selected commits:"
          echo "----------------------------------------"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            echo "$sha"
            echo "  $(git log -1 --format='%s' "$sha")"

          done < "$TMP/executable"

          echo "----------------------------------------"

          # --------------------------------------------------------
          # Store environment
          # --------------------------------------------------------

          {
            echo "MERGE_BASE=$MERGE_BASE"
            echo "SELECTED_COUNT=$SELECTED_COUNT"
            echo "EXECUTABLE_COUNT=$EXECUTABLE_COUNT"
            echo "ALREADY_COUNT=$ALREADY_COUNT"
          } >> "$GITHUB_ENV"

      # =================================================================
      # DRY RUN
      # =================================================================

      - name: Dry run plan
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          case "$STRATEGY" in

            cherry-pick)
              echo "Selected commits would be cherry-picked individually."
              ;;

            squash)
              echo "Selected commits would be combined into one commit."
              ;;

            merge-selected)
              echo "Selected commits would be replayed and merged."
              ;;

            merge-branch)
              echo "Source branch would be merged into target."
              ;;

            rebase-branch)
              echo "Source branch would be rebased onto target."

              if [[ "${EXCLUDE_COMMITS:-false}" == "true" ]]; then
                echo "Excluded commits will be explicitly dropped."
              fi

              ;;

            apply-patch)
              echo "Patch would be applied to target."
              ;;

            apply-diff)
              echo "Diff would be applied to target."
              ;;

          esac

          echo
          echo "No changes will be pushed."

      # =================================================================
      # REBASE
      # =================================================================

      - name: Rebase branch
        if: ${{ !inputs.dry_run && inputs.strategy == 'rebase-branch' }}
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git switch --detach "$SOURCE_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          if [[ "$EXCLUDE_COMMITS" != "true" ]]; then

            git rebase \
              --onto "$TARGET_SHA" \
              --no-rebase-merges \
              --empty=drop \
              "$MERGE_BASE" \
              "$SOURCE_SHA" ||
            {
              git rebase --abort || true
              error "Rebase failed."
            }

          else

            : > "$TMP/rebase_exclude"

            cp \
              "$TMP/input" \
              "$TMP/rebase_exclude"

            sort -u \
              "$TMP/source_history" \
              > "$TMP/source_history.sorted"

            sort -u \
              "$TMP/rebase_exclude" \
              > "$TMP/rebase_exclude.sorted"

            MISSING=$(
              comm \
                -23 \
                "$TMP/rebase_exclude.sorted" \
                "$TMP/source_history.sorted"
            )

            [[ -z "$MISSING" ]] ||
              error \
              "Excluded commit is not in source branch history: $MISSING"

            : > "$TMP/rebase_todo"

            while IFS= read -r sha; do

              [[ -n "$sha" ]] || continue

              if grep \
                -qxF \
                "$sha" \
                "$TMP/rebase_exclude"; then

                printf \
                  'drop %s # %s\n' \
                  "$sha" \
                  "$(git log -1 --format='%s' "$sha")" \
                  >> "$TMP/rebase_todo"

              else

                printf \
                  'pick %s # %s\n' \
                  "$sha" \
                  "$(git log -1 --format='%s' "$sha")" \
                  >> "$TMP/rebase_todo"

              fi

            done < "$TMP/source_history"

            PICK_COUNT=$(
              grep -c '^pick ' "$TMP/rebase_todo" || true
            )

            DROP_COUNT=$(
              grep -c '^drop ' "$TMP/rebase_todo" || true
            )

            (( PICK_COUNT > 0 )) ||
              error "All source commits were excluded."

            echo
            echo "Selective rebase plan:"
            echo "pick: $PICK_COUNT"
            echo "drop: $DROP_COUNT"
            echo

            cat "$TMP/rebase_todo"

            export GIT_SEQUENCE_EDITOR="
              bash -c 'cat \"$TMP/rebase_todo\" > \"\$1\"' --
            "

            git rebase \
              --interactive \
              --no-rebase-merges \
              --onto "$TARGET_SHA" \
              "$MERGE_BASE" \
              "$SOURCE_SHA" ||
            {
              git rebase --abort || true
              error "Selective rebase failed."
            }

            while IFS= read -r excluded; do

              [[ -n "$excluded" ]] || continue

              if git merge-base \
                --is-ancestor \
                "$excluded" \
                HEAD \
                2>/dev/null; then

                error \
                  "Excluded commit is still present in rebased history: $excluded"

              fi

            done < "$TMP/rebase_exclude"

          fi

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          [[ "$FINAL_SHA" != "$TARGET_SHA" ]] ||
            error "Operation produced no changes."

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # CHERRY-PICK
      # =================================================================

      - name: Cherry-pick
        if: ${{ !inputs.dry_run && inputs.strategy == 'cherry-pick' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          [[ -s "$TMP/executable" ]] ||
            error "No commits remain to cherry-pick."

          git switch --detach "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          COUNT=$(
            wc -l < "$TMP/executable" |
            tr -d ' '
          )

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if [[ "$COUNT" -eq 1 &&
                  -n "$COMMIT_MESSAGE" ]]; then

              git cherry-pick \
                --no-commit \
                --empty=drop \
                "$sha" ||
              {
                git cherry-pick --abort || true
                error "Cherry-pick failed: $sha"
              }

              git diff --cached --quiet &&
                error "Cherry-pick produced no changes."

              git commit \
                -m "$COMMIT_MESSAGE"

            else

              git cherry-pick \
                --no-edit \
                --empty=drop \
                "$sha" ||
              {
                git cherry-pick --abort || true
                error "Cherry-pick failed: $sha"
              }

            fi

          done < "$TMP/executable"

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          [[ "$FINAL_SHA" != "$TARGET_SHA" ]] ||
            error "Operation produced no changes."

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # SQUASH
      # =================================================================

      - name: Squash
        if: ${{ !inputs.dry_run && inputs.strategy == 'squash' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          [[ -s "$TMP/executable" ]] ||
            error "No commits remain for squash."

          git switch --detach "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            PARENT_COUNT=$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )

            (( PARENT_COUNT == 1 )) ||
              error \
              "Squash does not accept merge commits in selective mode: $sha"

            git cherry-pick \
              --no-commit \
              --empty=drop \
              "$sha" ||
            {
              git cherry-pick --abort || true
              error "Failed to apply $sha."
            }

          done < "$TMP/executable"

          git diff --cached --quiet &&
            error "Squash produced no changes."

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Squash selected commits"
          fi

          git commit \
            -m "$MESSAGE"

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # MERGE SELECTED
      # =================================================================

      - name: Merge selected
        if: ${{ !inputs.dry_run && inputs.strategy == 'merge-selected' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          [[ -s "$TMP/executable" ]] ||
            error "No commits remain for merge-selected."

          git switch --detach "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          TEMP_BRANCH="workflow-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$TEMP_BRANCH"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            PARENT_COUNT=$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )

            (( PARENT_COUNT == 1 )) ||
              error \
              "merge-selected does not accept merge commits: $sha"

            git cherry-pick \
              --no-edit \
              --empty=drop \
              "$sha" ||
            {
              git cherry-pick --abort || true
              error "Failed to replay $sha."
            }

          done < "$TMP/executable"

          SELECTED_SHA=$(
            git rev-parse HEAD
          )

          [[ "$SELECTED_SHA" != "$TARGET_SHA" ]] ||
            error "Selected commits produced no changes."

          git switch --detach "$TARGET_SHA"

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SELECTED_SHA"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SELECTED_SHA"

          fi

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          git branch \
            -D "$TEMP_BRANCH" \
            >/dev/null 2>&1 || true

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # MERGE BRANCH
      # =================================================================

      - name: Merge branch
        if: ${{ !inputs.dry_run && inputs.strategy == 'merge-branch' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git switch --detach "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          if git merge-base \
            --is-ancestor \
            "$SOURCE_SHA" \
            "$TARGET_SHA"; then

            error "Source branch is already contained in target."

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SOURCE_SHA"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SOURCE_SHA"

          fi

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # PATCH / DIFF
      # =================================================================

      - name: Apply patch or diff
        if: ${{ !inputs.dry_run && (inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff') }}
        shell: bash
        env:
          STRATEGY: ${{ inputs.strategy }}
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git switch --detach "$TARGET_SHA"

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          [[ -f "$PATCH_FILE" ]] ||
            error "Patch/diff file does not exist: $PATCH_FILE"

          git apply \
            --check \
            --3way \
            "$PATCH_FILE" ||
            error "Patch/diff cannot be applied cleanly."

          git apply \
            --3way \
            "$PATCH_FILE"

          git diff --quiet &&
            error "Patch/diff produced no changes."

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply $(basename "$PATCH_FILE")"
          fi

          git commit \
            -m "$MESSAGE"

          FINAL_SHA=$(
            git rev-parse HEAD
          )

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # =================================================================
      # FINAL VALIDATION
      # =================================================================

      - name: Final validation
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          echo
          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          [[ -n "${FINAL_SHA:-}" ]] ||
            error "FINAL_SHA is empty."

          git cat-file \
            -e "$FINAL_SHA^{commit}" ||
            error "Final SHA is invalid."

          [[ "$FINAL_SHA" != "$TARGET_SHA" ]] ||
            error "Operation produced no changes."

          [[ -z "$(git status --porcelain)" ]] ||
            error "Working tree is dirty."

          echo "Original target: $TARGET_SHA"
          echo "Final SHA:       $FINAL_SHA"

      # =================================================================
      # REMOTE RACE PROTECTION
      # =================================================================

      - name: Validate remote target
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -Eeuo pipefail

          error() {
            echo "::error::$*" >&2
            exit 1
          }

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_SHA=$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )

          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then

            error \
              "Target branch changed while workflow was running. Push cancelled."

          fi

      # =================================================================
      # PUSH
      # =================================================================

      - name: Push
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "PUSH"
          echo "========================================"

          if [[ "${STRATEGY:-}" == "rebase-branch" ||
                "${{ inputs.strategy }}" == "rebase-branch" ]]; then

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          else

            git push \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          fi

          echo
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          echo "Strategy:     ${{ inputs.strategy }}"
          echo "Target:       $TARGET_BRANCH"
          echo "Previous SHA: $TARGET_SHA"
          echo "Final SHA:    $FINAL_SHA"
