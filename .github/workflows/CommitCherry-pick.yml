name: Apply changes

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA(s), separated by spaces. With exclude_commits enabled, these SHA(s) are excluded from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How changes should be applied"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Optional for cherry-pick/squash, required for merge-branch/rebase-branch."
        required: false
        type: string

      exclude_commits:
        description: "When enabled with source_branch, commits contains SHA(s) to EXCLUDE instead of include."
        required: false
        type: boolean
        default: false

      patch_file:
        description: "Path to .patch or .diff file inside repository"
        required: false
        type: string

      commit_message:
        description: "Custom commit / merge message. Optional."
        required: false
        type: string

      dry_run:
        description: "Validate and show the planned operation without pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      STRATEGY: ${{ inputs.strategy }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # INITIAL FAST CHECKOUT
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config core.quotePath false
          git config rerere.enabled true

          git --version

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Strategy:         $STRATEGY"
          echo "Target branch:    $TARGET_BRANCH"
          echo "Source branch:    ${SOURCE_BRANCH:-<none>}"
          echo "Commits:          ${COMMITS_INPUT:-<none>}"
          echo "Exclude commits:  $EXCLUDE_COMMITS"
          echo "Patch file:       ${PATCH_FILE:-<none>}"
          echo "Dry run:          $DRY_RUN"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is empty."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::target_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::source_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

          # ----------------------------------------------------------
          # Exclude mode only makes sense with a source branch.
          # ----------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" && -z "$SOURCE_BRANCH" ]]; then
            echo "::error::exclude_commits requires source_branch."
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::cherry-pick requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with cherry-pick."
                exit 1
              fi
              ;;

            squash)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::squash requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with squash."
                exit 1
              fi
              ;;

            merge-selected)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-selected requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with merge-selected."
                exit 1
              fi
              ;;

            merge-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::merge-branch does not use commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits is not supported with merge-branch."
                echo "::error::Use merge-selected if you need to merge a branch while excluding commits."
                exit 1
              fi
              ;;

            rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::rebase-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::rebase-branch does not use commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits is not supported with rebase-branch."
                exit 1
              fi
              ;;

            apply-patch|apply-diff)
              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::$STRATEGY requires patch_file."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" || -n "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY does not use commits/source_branch."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits cannot be used with patch/diff."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # ============================================================
      # CLEAN WORKTREE
      # ============================================================

      - name: Verify clean worktree
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

          INITIAL_TARGET_SHA="$(git rev-parse HEAD)"

          echo "INITIAL_TARGET_SHA=$INITIAL_TARGET_SHA" >> "$GITHUB_ENV"

          echo "Initial target SHA:"
          echo "$INITIAL_TARGET_SHA"

      # ============================================================
      # REFRESH TARGET
      # ============================================================

      - name: Refresh target reference
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          if [[ "$REMOTE_TARGET_SHA" != "$INITIAL_TARGET_SHA" ]]; then
            echo "::error::Target branch changed during checkout."
            echo "::error::Expected: $INITIAL_TARGET_SHA"
            echo "::error::Actual:   $REMOTE_TARGET_SHA"
            exit 1
          fi

      # ============================================================
      # FETCH SOURCE BRANCH
      # ============================================================

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --depth=1 \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source SHA:"
          echo "$SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Invalid commit SHA: $commit"
              exit 1
            fi

            echo "Fetching commit: $commit"

            git fetch \
              --no-tags \
              origin \
              "$commit"

          done < <(printf '%s\n' "$COMMITS_INPUT" | tr ' ' '\n')

      # ============================================================
      # RESOLVE MERGE BASE
      #
      # Needed for branch -> target commit calculation.
      #
      # Start shallow and progressively deepen the repository.
      # ============================================================

      - name: Resolve source history
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_DEPTH=1048576
          DEEPEN=32
          ATTEMPTS=0

          while true; do

            ATTEMPTS=$((ATTEMPTS + 1))

            echo ""
            echo "History resolution attempt: $ATTEMPTS"
            echo "Current deepen amount: $DEEPEN"

            if MERGE_BASE="$(
              git merge-base \
                "origin/$TARGET_BRANCH" \
                "origin/$SOURCE_BRANCH" \
                2>/dev/null
            )"; then

              echo "Merge base:"
              echo "$MERGE_BASE"

              echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

              break
            fi

            if [[ "$DEEPEN" -ge "$MAX_DEPTH" ]]; then
              echo "::error::Unable to find merge-base."
              echo "::error::History limit reached."
              exit 1
            fi

            git fetch \
              --no-tags \
              --deepen="$DEEPEN" \
              origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
              "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            DEEPEN=$((DEEPEN * 2))

          done

      # ============================================================
      # RESOLVE COMMITS
      #
      # Modes:
      #
      # source_branch absent:
      #   commits = INCLUDE
      #
      # source_branch present:
      #
      #   exclude_commits=false
      #       commits = INCLUDE
      #
      #   exclude_commits=true
      #       commits = EXCLUDE
      #
      # If commits is empty with source_branch:
      #   all source commits are selected.
      # ============================================================

      - name: Resolve commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ALL_SOURCE="/tmp/all_source_commits.txt"
          RAW="/tmp/raw_commits.txt"
          UNIQUE="/tmp/unique_commits.txt"
          EXCLUDED="/tmp/excluded_commits.txt"
          CANDIDATES="/tmp/candidates.txt"
          FINAL="/tmp/final_commits.txt"
          SORTED="/tmp/sorted_commits.txt"

          : > "$ALL_SOURCE"
          : > "$RAW"
          : > "$UNIQUE"
          : > "$EXCLUDED"
          : > "$CANDIDATES"
          : > "$FINAL"
          : > "$SORTED"

          # ==========================================================
          # CASE A:
          # SOURCE BRANCH
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            echo "Source branch mode."

            # --------------------------------------------------------
            # Get all commits introduced by source and not target.
            #
            # --cherry-pick removes patch-equivalent commits.
            # --right-only keeps only source side.
            # --no-merges keeps ordinary commits only.
            # --------------------------------------------------------

            git rev-list \
              --right-only \
              --cherry-pick \
              --no-merges \
              --reverse \
              "origin/$TARGET_BRANCH...origin/$SOURCE_BRANCH" \
              > "$ALL_SOURCE"

            echo ""
            echo "All applicable source commits:"
            cat "$ALL_SOURCE" || true

            # --------------------------------------------------------
            # User explicitly provided SHA(s)
            # --------------------------------------------------------

            if [[ -n "$COMMITS_INPUT" ]]; then

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                  echo "::error::Invalid commit SHA: $commit"
                  exit 1
                fi

                if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                  echo "::error::Commit not found: $commit"
                  exit 1
                fi

                FULL_SHA="$(git rev-parse "$commit^{commit}")"

                # ----------------------------------------------------
                # The SHA must belong to source branch history.
                # ----------------------------------------------------

                if ! git merge-base \
                  --is-ancestor \
                  "$FULL_SHA" \
                  "origin/$SOURCE_BRANCH" \
                  2>/dev/null; then

                  echo "::error::Commit is not part of source_branch:"
                  echo "::error::$FULL_SHA"
                  echo "::error::Source branch: $SOURCE_BRANCH"

                  exit 1
                fi

                echo "$FULL_SHA" >> "$UNIQUE"

              done < <(printf '%s\n' "$COMMITS_INPUT" | tr ' ' '\n')

              sort -u "$UNIQUE" -o "$UNIQUE"

              # ------------------------------------------------------
              # Exclusion mode
              # ------------------------------------------------------

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                echo ""
                echo "Exclusion mode enabled."

                cp "$UNIQUE" "$EXCLUDED"

                # Start with ALL source commits.
                cp "$ALL_SOURCE" "$CANDIDATES"

                # Remove exact excluded SHA(s).
                while IFS= read -r excluded; do

                  [[ -z "$excluded" ]] && continue

                  if grep -Fxq "$excluded" "$CANDIDATES"; then

                    echo "Excluding:"
                    echo "$excluded"

                    grep -Fxv "$excluded" \
                      "$CANDIDATES" \
                      > "${CANDIDATES}.tmp"

                    mv \
                      "${CANDIDATES}.tmp" \
                      "$CANDIDATES"

                  else

                    echo "::warning::Excluded commit is not in the applicable source commit set:"
                    echo "::warning::$excluded"
                    echo "::warning::It may already exist in target or be patch-equivalent."

                  fi

                done < "$EXCLUDED"

              # ------------------------------------------------------
              # Inclusion mode
              # ------------------------------------------------------

              else

                echo ""
                echo "Inclusion mode enabled."

                cp "$UNIQUE" "$CANDIDATES"

              fi

            # --------------------------------------------------------
            # No SHA supplied.
            #
            # All applicable source commits are used.
            # --------------------------------------------------------

            else

              echo ""
              echo "No commit SHA supplied."
              echo "Using all applicable source commits."

              cp "$ALL_SOURCE" "$CANDIDATES"

            fi

          # ==========================================================
          # CASE B:
          # NO SOURCE BRANCH
          #
          # commits = INCLUDE
          # ==========================================================

          else

            echo "Explicit commit mode."

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "::error::exclude_commits requires source_branch."
              exit 1
            fi

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$RAW"

            done < <(printf '%s\n' "$COMMITS_INPUT" | tr ' ' '\n')

            sort -u "$RAW" > "$CANDIDATES"

          fi

          # ==========================================================
          # VALIDATE CANDIDATES
          # ==========================================================

          if [[ ! -s "$CANDIDATES" ]]; then

            echo "::error::No commits remain after source/exclusion filtering."

            exit 1

          fi

          # ==========================================================
          # REMOVE EXACT COMMITS ALREADY IN TARGET
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            PARENT_COUNT="$(
              git rev-list \
                --parents \
                -n 1 \
                "$commit" \
                | awk '{print NF-1}'
            )"

            # --------------------------------------------------------
            # We deliberately refuse merge commits.
            #
            # Git requires --mainline when cherry-picking a merge.
            # We do not guess which parent the user means.
            # --------------------------------------------------------

            if [[ "$PARENT_COUNT" -gt 1 ]]; then

              echo "::error::Merge commit is not supported:"
              echo "::error::$commit"
              echo "::error::Select the individual commits instead."

              exit 1

            fi

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "origin/$TARGET_BRANCH" \
              2>/dev/null; then

              echo "::warning::Already in target:"
              echo "::warning::$commit"
              echo "::warning::Skipping."

              continue

            fi

            echo "$commit" >> "$FINAL"

          done < "$CANDIDATES"

          # ==========================================================
          # REMOVE DUPLICATES AFTER FILTERING
          # ==========================================================

          sort -u "$FINAL" -o "$FINAL"

          if [[ ! -s "$FINAL" ]]; then

            echo "::error::No new commits remain after target filtering."

            exit 1

          fi

          # ==========================================================
          # FINAL CHRONOLOGICAL ORDER
          #
          # Even if SHA(s) were entered in random order.
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            AUTHOR_TS="$(git show -s --format='%at' "$commit")"
            COMMITTER_TS="$(git show -s --format='%ct' "$commit")"

            printf '%s\t%s\t%s\n' \
              "$AUTHOR_TS" \
              "$COMMITTER_TS" \
              "$commit"

          done < "$FINAL" \
            | sort -n -k1,1 -k2,2 -k3,3 \
            | cut -f3 \
            > "$SORTED"

          if [[ ! -s "$SORTED" ]]; then

            echo "::error::Sorted commit list is empty."

            exit 1

          fi

          # ==========================================================
          # FINAL REPORT
          # ==========================================================

          echo ""
          echo "========================================"
          echo "COMMITS TO APPLY"
          echo "========================================"

          while IFS= read -r commit; do

            git show \
              -s \
              --format='%aI | %H | %s' \
              "$commit"

          done < "$SORTED"

          echo "========================================"

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ============================================================
      # PATCH VALIDATION
      # ============================================================

      - name: Validate patch / diff
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file does not exist:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch file is empty:"
            echo "$PATCH_FILE"
            exit 1
          fi

          echo "Patch:"
          echo "$PATCH_FILE"

          echo ""
          echo "Size:"
          wc -c "$PATCH_FILE"

          if [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --stat \
              "$PATCH_FILE"

          else

            git mailinfo \
              /tmp/patch-message \
              /tmp/patch-info \
              < "$PATCH_FILE" \
              >/dev/null 2>&1 || {

                echo "::error::File is not a valid format-patch/mailbox."
                exit 1
              }

          fi

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Dry-run report
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          echo ""
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:        $STRATEGY"
          echo "Target:          $TARGET_BRANCH"
          echo "Source:          ${SOURCE_BRANCH:-<none>}"
          echo "Exclude mode:    $EXCLUDE_COMMITS"
          echo ""

          if [[ -n "$SOURCE_BRANCH" ]]; then

            echo "Source branch:"
            echo "$SOURCE_BRANCH"
            echo ""

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "Excluded SHA(s):"
              printf '%s\n' "${COMMITS_INPUT:-<none>}"
              echo ""
            else
              echo "Included SHA(s):"
              printf '%s\n' "${COMMITS_INPUT:-<all>}"
              echo ""
            fi

          fi

          case "$STRATEGY" in

            cherry-pick)
              echo "Would cherry-pick:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              ;;

            squash)
              echo "Would squash:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              ;;

            merge-selected)
              echo "Would create temporary selected branch from:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              echo ""
              echo "Then merge it into target."
              ;;

            merge-branch)
              echo "Would merge entire branch:"
              echo "$SOURCE_BRANCH"
              ;;

            rebase-branch)
              echo "Would rebase:"
              echo "$SOURCE_BRANCH"
              echo ""
              echo "Onto:"
              echo "$TARGET_BRANCH"
              ;;

            apply-patch)
              echo "Would apply patch:"
              echo "$PATCH_FILE"
              ;;

            apply-diff)
              echo "Would apply diff:"
              echo "$PATCH_FILE"
              ;;

          esac

          echo ""
          echo "No changes were made."
          echo "No push will be performed."

      # ============================================================
      # APPLY
      # ============================================================

      - name: Apply changes
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            # ========================================================
            # CHERRY-PICK
            # ========================================================

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Cherry-picking:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Cherry-pick failed:"
                  echo "$commit"

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  git reset --hard HEAD

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            # ========================================================
            # SQUASH
            #
            # Uses sequential cherry-pick --no-commit.
            #
            # This intentionally works the same way whether the source
            # came from:
            #
            #   explicit SHA(s)
            #   source branch
            #   source branch + exclusions
            #
            # Git documents --no-commit as applying the changes of the
            # named commits without creating intermediate commits.
            # ========================================================

            squash)

              APPLIED=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Squash-applying:"
                echo "$commit"

                if git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  APPLIED=$((APPLIED + 1))

                  continue
                fi

                # ----------------------------------------------------
                # Empty result after previous changes.
                # ----------------------------------------------------

                if git diff --quiet && git diff --cached --quiet; then

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  echo "::warning::Commit produced no new changes:"
                  echo "::warning::$commit"

                  continue
                fi

                echo "::error::Conflict while applying:"
                echo "$commit"

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                  git cherry-pick --abort
                fi

                git reset --hard HEAD

                exit 1

              done <<< "$COMMITS_TO_APPLY"

              if [[ "$APPLIED" -eq 0 ]]; then

                echo "::error::Squash produced no changes."

                exit 1

              fi

              git add -A

              if git diff --cached --quiet; then

                echo "::error::Nothing to commit after squash."

                exit 1

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"
                fi

              else

                FINAL_MESSAGE="Squash selected commits"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            # ========================================================
            # MERGE-SELECTED
            #
            # This can also use source_branch + exclusions.
            #
            # The resulting temporary branch contains only the final
            # selected commit set.
            # ========================================================

            merge-selected)

              TEMP_BRANCH="automation/merge-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Applying to temporary branch:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Unable to build temporary selected branch."

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  git switch "$TARGET_BRANCH" || true
                  git branch -D "$TEMP_BRANCH" || true

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              TEMP_SHA="$(git rev-parse HEAD)"

              if git diff \
                --quiet \
                "$INITIAL_TARGET_SHA" \
                "$TEMP_SHA"; then

                echo "::error::Selected commits produced no changes."

                git switch "$TARGET_BRANCH"
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git switch "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Merge $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Merge selected commits from $SOURCE_BRANCH"
                fi

              else

                FINAL_MESSAGE="Merge selected commits"

              fi

              if ! git merge \
                --no-ff \
                "$TEMP_BRANCH" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Merge of selected commits failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # MERGE-BRANCH
            # ========================================================

            merge-branch)

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
              fi

              if ! git merge \
                --no-ff \
                "origin/$SOURCE_BRANCH" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Branch merge failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                git reset --hard HEAD

                exit 1
              fi

              ;;

            # ========================================================
            # REBASE-BRANCH
            # ========================================================

            rebase-branch)

              TEMP_BRANCH="automation/rebase-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH" \
                "origin/$SOURCE_BRANCH"

              if ! git rebase \
                --onto "origin/$TARGET_BRANCH" \
                "$MERGE_BASE" \
                --empty=drop; then

                echo "::error::Rebase failed."

                git rebase --abort || true

                git switch "$TARGET_BRANCH" || true
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              REBASED_HEAD="$(git rev-parse HEAD)"

              git switch "$TARGET_BRANCH"

              if ! git merge \
                --ff-only \
                "$REBASED_HEAD"; then

                echo "::error::Unable to fast-forward target to rebased branch."

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # APPLY-PATCH
            # ========================================================

            apply-patch)

              BEFORE_PATCH_SHA="$(git rev-parse HEAD)"

              if ! git am \
                --3way \
                --empty=drop \
                "$PATCH_FILE"; then

                echo "::error::git am failed."

                git am --show-current-patch=raw || true
                git am --abort || true

                git reset --hard "$BEFORE_PATCH_SHA"

                exit 1
              fi

              AFTER_PATCH_SHA="$(git rev-parse HEAD)"

              if [[ "$BEFORE_PATCH_SHA" == "$AFTER_PATCH_SHA" ]]; then

                echo "::error::Patch produced no new commits."

                exit 1

              fi

              ;;

            # ========================================================
            # APPLY-DIFF
            # ========================================================

            apply-diff)

              echo "Checking whether diff is already applied..."

              if git apply \
                --check \
                --reverse \
                "$PATCH_FILE" \
                >/dev/null 2>&1; then

                echo "::error::Patch appears to be already applied."
                echo "::error::Refusing to apply it twice."

                exit 1
              fi

              echo "Checking forward applicability..."

              if ! git apply \
                --check \
                "$PATCH_FILE"; then

                echo "::error::Patch cannot be applied cleanly."

                exit 1
              fi

              echo "Applying diff..."

              if ! git apply \
                --3way \
                "$PATCH_FILE"; then

                echo "::error::git apply failed."

                git reset --hard HEAD

                exit 1
              fi

              git add -A

              if git diff --cached --quiet; then

                echo "::error::Patch produced no changes."

                git reset --hard HEAD

                exit 1

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                PATCH_NAME="$(basename "$PATCH_FILE")"

                FINAL_MESSAGE="Apply patch: $PATCH_NAME"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            *)
              echo "::error::Unsupported strategy:"
              echo "$STRATEGY"
              exit 1
              ;;

          esac

      # ============================================================
      # FINAL LOCAL VALIDATION
      # ============================================================

      - name: Validate final repository state
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved cherry-pick state."
            exit 1
          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved merge state."
            exit 1
          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved rebase state."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."

            git status --short

            exit 1

          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$FINAL_SHA" == "$INITIAL_TARGET_SHA" ]]; then

            echo "::error::Operation produced no new commit."

            exit 1

          fi

          echo ""
          echo "Initial target:"
          echo "$INITIAL_TARGET_SHA"

          echo ""
          echo "Final HEAD:"
          echo "$FINAL_SHA"

          echo ""
          echo "Recent history:"

          git log \
            --oneline \
            --decorate \
            -10

      # ============================================================
      # FINAL REMOTE RACE CHECK
      # ============================================================

      - name: Verify remote target has not changed
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Expected:"
          echo "$INITIAL_TARGET_SHA"

          echo "Current:"
          echo "$CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$INITIAL_TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."

            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            echo "Pushing rebased history with explicit lease..."

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$INITIAL_TARGET_SHA" \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          else

            echo "Pushing normal update..."

            git push \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          fi

          echo ""
          echo "Successfully pushed:"
          echo "$FINAL_SHA"

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply changes"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Source | \`${SOURCE_BRANCH:-}\` |"
            echo "| Exclude mode | \`$EXCLUDE_COMMITS\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Initial SHA | \`$INITIAL_TARGET_SHA\` |"

            if git rev-parse HEAD >/dev/null 2>&1; then
              echo "| Final SHA | \`$(git rev-parse HEAD)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
