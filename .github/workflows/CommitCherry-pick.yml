name: Apply commits, branches, patches

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA(s), separated by spaces. Optional."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How changes should be applied"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Used by squash / merge-branch / rebase-branch, or when commits is empty."
        required: false
        type: string

      patch_file:
        description: "Path to .patch or .diff file inside the checked-out repository"
        required: false
        type: string

      commit_message:
        description: "Custom commit / merge message. Optional."
        required: false
        type: string

      dry_run:
        description: "Validate and show the planned operation without pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      STRATEGY: ${{ inputs.strategy }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # FAST INITIAL CHECKOUT
      #
      # Only the target branch tip is downloaded.
      # History is deepened later only when required.
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # GIT CONFIGURATION
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config core.quotePath false
          git config rerere.enabled true

          echo "Git version:"
          git --version

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Strategy:       ${STRATEGY:-cherry-pick}"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Source branch:  ${SOURCE_BRANCH:-<none>}"
          echo "Commits:        ${COMMITS_INPUT:-<none>}"
          echo "Patch file:     ${PATCH_FILE:-<none>}"
          echo "Dry run:        ${DRY_RUN:-false}"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is empty."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::target_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::source_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::cherry-pick requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with cherry-pick."
                exit 1
              fi
              ;;

            squash)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::squash requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with squash."
                exit 1
              fi
              ;;

            merge-selected)
              if [[ -z "$COMMITS_INPUT" ]]; then
                echo "::error::merge-selected requires explicit commit SHA(s)."
                exit 1
              fi

              if [[ -n "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-selected does not use source_branch."
                exit 1
              fi
              ;;

            merge-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::merge-branch does not use commits."
                exit 1
              fi
              ;;

            rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::rebase-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::rebase-branch does not use commits."
                exit 1
              fi
              ;;

            apply-patch|apply-diff)
              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::$STRATEGY requires patch_file."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" || -n "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY does not use commits/source_branch."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # ============================================================
      # VERIFY INITIAL WORKTREE
      # ============================================================

      - name: Verify clean worktree
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

          INITIAL_TARGET_SHA="$(git rev-parse HEAD)"

          echo "INITIAL_TARGET_SHA=$INITIAL_TARGET_SHA" >> "$GITHUB_ENV"

          echo "Initial target SHA:"
          echo "$INITIAL_TARGET_SHA"

      # ============================================================
      # FETCH TARGET TIP
      #
      # This also makes origin/<target> explicit.
      # ============================================================

      - name: Refresh target reference
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          if [[ "$REMOTE_TARGET_SHA" != "$INITIAL_TARGET_SHA" ]]; then
            echo "::error::Target branch changed during checkout."
            echo "::error::Expected: $INITIAL_TARGET_SHA"
            echo "::error::Actual:   $REMOTE_TARGET_SHA"
            exit 1
          fi

      # ============================================================
      # FETCH SOURCE BRANCH
      # ============================================================

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --depth=1 \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source SHA:"
          echo "$SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue

            if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Invalid commit SHA: $commit"
              exit 1
            fi

            echo "Fetching commit: $commit"

            git fetch \
              --no-tags \
              origin \
              "$commit"

          done < <(printf '%s\n' "$COMMITS_INPUT" | tr ' ' '\n')

      # ============================================================
      # PATCH VALIDATION
      # ============================================================

      - name: Validate patch / diff
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file does not exist:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch file is empty:"
            echo "$PATCH_FILE"
            exit 1
          fi

          echo "Patch file:"
          echo "$PATCH_FILE"

          echo ""
          echo "Patch size:"
          wc -c "$PATCH_FILE"

          echo ""
          echo "Patch summary:"

          if [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --stat \
              "$PATCH_FILE"

          else

            git mailinfo \
              /tmp/patch-message \
              /tmp/patch-info \
              < "$PATCH_FILE" \
              >/dev/null 2>&1 || {
                echo "::error::File does not look like a valid mailbox/format-patch."
                echo "::error::Use apply-diff for a normal unified diff."
                exit 1
              }

          fi

      # ============================================================
      # ENSURE HISTORY FOR BRANCH-BASED OPERATIONS
      #
      # Start shallow and deepen progressively.
      #
      # git fetch --deepen is specifically designed for shallow repos.
      # ============================================================

      - name: Resolve source history
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_DEPTH=1048576
          DEEPEN=32
          ATTEMPTS=0

          while true; do

            ATTEMPTS=$((ATTEMPTS + 1))

            echo ""
            echo "History resolution attempt: $ATTEMPTS"
            echo "Current deepen amount: $DEEPEN"

            if MERGE_BASE="$(
              git merge-base \
                "origin/$TARGET_BRANCH" \
                "origin/$SOURCE_BRANCH" \
                2>/dev/null
            )"; then

              echo "Merge base:"
              echo "$MERGE_BASE"

              echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

              break
            fi

            if [[ "$DEEPEN" -ge "$MAX_DEPTH" ]]; then
              echo "::error::Unable to find merge-base."
              echo "::error::History limit reached."
              exit 1
            fi

            git fetch \
              --no-tags \
              --deepen="$DEEPEN" \
              origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
              "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            DEEPEN=$((DEEPEN * 2))

          done

      # ============================================================
      # RESOLVE SELECTED COMMITS
      #
      # Sources:
      #
      # 1. explicit SHA(s)
      # 2. source branch
      #
      # Protection:
      #
      # - malformed SHA
      # - duplicate SHA
      # - merge commit without explicit mainline support
      # - commit already in target
      # - patch-equivalent commit
      # - chronological ordering
      # ============================================================

      - name: Resolve commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW="/tmp/raw_commits.txt"
          UNIQUE="/tmp/unique_commits.txt"
          CANDIDATES="/tmp/candidates.txt"
          FINAL="/tmp/final_commits.txt"

          : > "$RAW"
          : > "$UNIQUE"
          : > "$CANDIDATES"
          : > "$FINAL"

          # ==========================================================
          # SOURCE: EXPLICIT SHA
          # ==========================================================

          if [[ -n "$COMMITS_INPUT" ]]; then

            echo "Resolving explicit commits..."

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$RAW"

            done < <(printf '%s\n' "$COMMITS_INPUT" | tr ' ' '\n')

          # ==========================================================
          # SOURCE: BRANCH
          # ==========================================================

          else

            echo "Resolving commits from source branch..."

            git rev-list \
              --right-only \
              --cherry-pick \
              --no-merges \
              "origin/$TARGET_BRANCH...origin/$SOURCE_BRANCH" \
              > "$RAW"

          fi

          # ==========================================================
          # REMOVE DUPLICATE SHA
          # ==========================================================

          sort -u "$RAW" > "$UNIQUE"

          echo ""
          echo "Unique commits:"
          cat "$UNIQUE" || true

          # ==========================================================
          # FILTER COMMITS
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            # --------------------------------------------------------
            # Reject merge commits for explicit SHA mode.
            #
            # Cherry-picking a merge commit requires a mainline parent.
            # We deliberately do not guess which parent the user means.
            # --------------------------------------------------------

            PARENT_COUNT="$(
              git rev-list \
                --parents \
                -n 1 \
                "$commit" \
                | awk '{print NF-1}'
            )"

            if [[ "$PARENT_COUNT" -gt 1 ]]; then
              echo "::error::Commit is a merge commit:"
              echo "::error::$commit"
              echo "::error::Merge commits are not accepted by selected-commit modes."
              echo "::error::Select the individual commits instead."
              exit 1
            fi

            # --------------------------------------------------------
            # Exact SHA already reachable from target.
            # --------------------------------------------------------

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "origin/$TARGET_BRANCH" \
              2>/dev/null; then

              echo "::warning::Already in target:"
              echo "::warning::$commit"
              echo "::warning::Skipping."

              continue
            fi

            echo "$commit" >> "$CANDIDATES"

          done < "$UNIQUE"

          # ==========================================================
          # NOTHING LEFT
          # ==========================================================

          if [[ ! -s "$CANDIDATES" ]]; then

            echo "::error::No new commits remain after duplicate checks."

            exit 1

          fi

          # ==========================================================
          # PATCH-EQUIVALENT CHECK
          #
          # git cherry identifies changes that are already represented
          # on the target side.
          #
          # If history is shallow and the check cannot be trusted,
          # we fail closed instead of silently applying a duplicate.
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if git cherry \
              "origin/$TARGET_BRANCH" \
              "$commit" \
              >/tmp/cherry_check.txt 2>/tmp/cherry_error.txt; then

              if grep -q '^-' /tmp/cherry_check.txt; then

                echo "::warning::Patch-equivalent change already exists:"
                echo "::warning::$commit"
                echo "::warning::Skipping."

                continue

              fi

            else

              echo "::error::Unable to reliably check patch-equivalence."
              cat /tmp/cherry_error.txt || true
              echo "::error::Refusing to continue."
              exit 1

            fi

            echo "$commit" >> "$FINAL"

          done < "$CANDIDATES"

          if [[ ! -s "$FINAL" ]]; then
            echo "::error::All requested commits are already present."
            exit 1
          fi

          # ==========================================================
          # SORT BY AUTHOR DATE
          #
          # User asked for commits to be applied by creation date even
          # when entered in another order.
          #
          # Primary:   author timestamp
          # Secondary: committer timestamp
          # Tertiary:  SHA
          # ==========================================================

          SORTED="/tmp/sorted_commits.txt"

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            AUTHOR_TS="$(
              git show -s --format='%at' "$commit"
            )"

            COMMITTER_TS="$(
              git show -s --format='%ct' "$commit"
            )"

            printf '%s\t%s\t%s\n' \
              "$AUTHOR_TS" \
              "$COMMITTER_TS" \
              "$commit"

          done < "$FINAL" \
            | sort -n -k1,1 -k2,2 -k3,3 \
            | cut -f3 \
            > "$SORTED"

          if [[ ! -s "$SORTED" ]]; then
            echo "::error::Sorted commit list is empty."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "FINAL COMMITS"
          echo "========================================"

          while IFS= read -r commit; do

            git show \
              -s \
              --format='%aI | %H | %s' \
              "$commit"

          done < "$SORTED"

          echo "========================================"

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ============================================================
      # DRY RUN REPORT
      # ============================================================

      - name: Dry-run report
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:       $STRATEGY"
          echo "Target:         $TARGET_BRANCH"
          echo "Source:         ${SOURCE_BRANCH:-<none>}"
          echo ""

          case "$STRATEGY" in

            cherry-pick)
              echo "Would cherry-pick:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              ;;

            squash)
              echo "Would squash:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              ;;

            merge-selected)
              echo "Would create a temporary branch from selected commits:"
              printf '%s\n' "${COMMITS_TO_APPLY:-}"
              echo ""
              echo "Then create a merge commit into target."
              ;;

            merge-branch)
              echo "Would merge:"
              echo "$SOURCE_BRANCH"
              ;;

            rebase-branch)
              echo "Would rebase:"
              echo "$SOURCE_BRANCH"
              echo ""
              echo "Onto:"
              echo "$TARGET_BRANCH"
              ;;

            apply-patch)
              echo "Would apply format-patch:"
              echo "$PATCH_FILE"
              ;;

            apply-diff)
              echo "Would apply diff:"
              echo "$PATCH_FILE"
              ;;

          esac

          echo ""
          echo "No changes were made."
          echo "No push will be performed."

      # ============================================================
      # APPLY CHANGES
      # ============================================================

      - name: Apply changes
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            # ========================================================
            # CHERRY-PICK
            # ========================================================

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Cherry-picking:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Cherry-pick failed:"
                  echo "$commit"

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                    git cherry-pick --abort
                  fi

                  git reset --hard HEAD

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            # ========================================================
            # SQUASH
            #
            # Works from:
            #
            # - explicit SHA(s)
            # - source branch
            #
            # We deliberately use sequential cherry-pick --no-commit
            # instead of git merge --squash.
            # ========================================================

            squash)

              APPLIED=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Squash-applying:"
                echo "$commit"

                if git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  APPLIED=$((APPLIED + 1))

                  continue

                fi

                # ----------------------------------------------------
                # If the operation became empty, clean up and continue.
                # ----------------------------------------------------

                if git diff --quiet && git diff --cached --quiet; then

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                    git cherry-pick --abort
                  fi

                  echo "::warning::Commit produced no new changes:"
                  echo "::warning::$commit"

                  continue
                fi

                echo "::error::Conflict while applying:"
                echo "$commit"

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                  git cherry-pick --abort
                fi

                git reset --hard HEAD

                exit 1

              done <<< "$COMMITS_TO_APPLY"

              if [[ "$APPLIED" -eq 0 ]]; then
                echo "::error::Squash produced no changes."
                exit 1
              fi

              git add -A

              if git diff --cached --quiet; then
                echo "::error::Nothing to commit after squash."
                exit 1
              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"

              else

                FINAL_MESSAGE="Squash selected commits"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            # ========================================================
            # MERGE-SELECTED
            #
            # selected commits
            #       ↓
            # temporary branch
            #       ↓
            # real merge commit
            # ========================================================

            merge-selected)

              TEMP_BRANCH="automation/merge-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo ""
                echo "Applying to temporary branch:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Unable to build temporary selected branch."

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                    git cherry-pick --abort
                  fi

                  git switch "$TARGET_BRANCH" || true
                  git branch -D "$TEMP_BRANCH" || true

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              TEMP_SHA="$(git rev-parse HEAD)"

              if git diff \
                --quiet \
                "$INITIAL_TARGET_SHA" \
                "$TEMP_SHA"; then

                echo "::error::Selected commits produced no changes."

                git switch "$TARGET_BRANCH"
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git switch "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                FINAL_MESSAGE="Merge selected commits"

              fi

              if ! git merge \
                --no-ff \
                "$TEMP_BRANCH" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Merge of selected commits failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then

                  git merge --abort
                fi

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # MERGE-BRANCH
            # ========================================================

            merge-branch)

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"

              fi

              if ! git merge \
                --no-ff \
                "origin/$SOURCE_BRANCH" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Branch merge failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then

                  git merge --abort
                fi

                git reset --hard HEAD

                exit 1
              fi

              ;;

            # ========================================================
            # REBASE-BRANCH
            #
            # Rebase source commits onto target.
            #
            # A temporary local branch is used so target is not moved
            # until rebase has completed successfully.
            # ========================================================

            rebase-branch)

              TEMP_BRANCH="automation/rebase-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH" \
                "origin/$SOURCE_BRANCH"

              if ! git rebase \
                --onto "origin/$TARGET_BRANCH" \
                "$MERGE_BASE" \
                --empty=drop; then

                echo "::error::Rebase failed."

                if git rebase --show-current-patch \
                  >/dev/null 2>&1; then

                  git rebase --abort
                fi

                git switch "$TARGET_BRANCH" || true
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              REBASED_HEAD="$(git rev-parse HEAD)"

              git switch "$TARGET_BRANCH"

              if ! git merge \
                --ff-only \
                "$REBASED_HEAD"; then

                echo "::error::Unable to fast-forward target to rebased branch."

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # APPLY-PATCH
            #
            # format-patch / mailbox.
            #
            # git am creates commits from the patch.
            # ========================================================

            apply-patch)

              BEFORE_PATCH_SHA="$(git rev-parse HEAD)"

              if ! git am \
                --3way \
                --empty=drop \
                "$PATCH_FILE"; then

                echo "::error::git am failed."

                if git am --show-current-patch \
                  >/dev/null 2>&1; then

                  echo ""
                  echo "Current patch:"
                  git am --show-current-patch=raw || true

                  git am --abort
                fi

                git reset --hard "$BEFORE_PATCH_SHA"

                exit 1
              fi

              AFTER_PATCH_SHA="$(git rev-parse HEAD)"

              if [[ "$BEFORE_PATCH_SHA" == "$AFTER_PATCH_SHA" ]]; then

                echo "::error::Patch produced no new commits."
                exit 1

              fi

              ;;

            # ========================================================
            # APPLY-DIFF
            #
            # Ordinary unified diff.
            #
            # Reverse check MUST happen before forward check.
            #
            # If reverse applies cleanly, the patch is already present.
            # ========================================================

            apply-diff)

              echo "Checking whether diff is already applied..."

              if git apply \
                --check \
                --reverse \
                "$PATCH_FILE" \
                >/dev/null 2>&1; then

                echo "::error::Patch appears to be already applied."
                echo "::error::Refusing to apply it twice."

                exit 1
              fi

              echo "Checking forward applicability..."

              if ! git apply \
                --check \
                "$PATCH_FILE"; then

                echo "::error::Patch cannot be applied cleanly."
                exit 1
              fi

              echo "Applying diff..."

              if ! git apply \
                --3way \
                "$PATCH_FILE"; then

                echo "::error::git apply failed."

                git reset --hard HEAD

                exit 1
              fi

              git add -A

              if git diff --cached --quiet; then

                echo "::error::Patch produced no changes."

                git reset --hard HEAD

                exit 1
              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                PATCH_NAME="$(basename "$PATCH_FILE")"

                FINAL_MESSAGE="Apply patch: $PATCH_NAME"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            *)
              echo "::error::Unsupported strategy:"
              echo "$STRATEGY"
              exit 1
              ;;

          esac

      # ============================================================
      # FINAL LOCAL VALIDATION
      # ============================================================

      - name: Validate final repository state
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          # ----------------------------------------------------------
          # No unresolved operations.
          # ----------------------------------------------------------

          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved cherry-pick state."
            exit 1
          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved merge state."
            exit 1
          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved rebase state."
            exit 1
          fi

          # ----------------------------------------------------------
          # Clean worktree.
          # ----------------------------------------------------------

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."

            git status --short

            exit 1
          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$FINAL_SHA" == "$INITIAL_TARGET_SHA" ]]; then

            echo "::error::Operation produced no new commit."
            exit 1
          fi

          echo ""
          echo "Initial target:"
          echo "$INITIAL_TARGET_SHA"

          echo ""
          echo "Final HEAD:"
          echo "$FINAL_SHA"

          echo ""
          echo "Recent history:"

          git log \
            --oneline \
            --decorate \
            -10

      # ============================================================
      # FINAL REMOTE RACE CHECK
      #
      # The remote target must still point at exactly the commit on
      # which the operation started.
      # ============================================================

      - name: Verify remote target has not changed
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Expected remote target:"
          echo "$INITIAL_TARGET_SHA"

          echo "Current remote target:"
          echo "$CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$INITIAL_TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."
            echo "::error::Expected: $INITIAL_TARGET_SHA"
            echo "::error::Actual:   $CURRENT_REMOTE_SHA"

            exit 1
          fi

      # ============================================================
      # PUSH
      #
      # For normal operations:
      #   normal fast-forward push
      #
      # For rebase:
      #   explicit force-with-lease using the exact original SHA.
      #
      # This prevents overwriting a target that changed while the
      # workflow was running.
      # ============================================================

      - name: Push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            echo "Pushing rebased history with explicit lease..."

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$INITIAL_TARGET_SHA" \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          else

            echo "Pushing normal update..."

            git push \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          fi

          echo ""
          echo "Successfully pushed:"
          echo "$FINAL_SHA"

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply changes"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Source | \`${SOURCE_BRANCH:-}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Initial SHA | \`$INITIAL_TARGET_SHA\` |"

            if git rev-parse HEAD >/dev/null 2>&1; then
              echo "| Final SHA | \`$(git rev-parse HEAD)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
