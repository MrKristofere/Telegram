name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:

      strategy:
        description: "How changes should be applied"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch. Optional for explicit commit selection"
        required: false
        type: string

      commits:
        description: "Commit SHA(s), separated by spaces or new lines"
        required: false
        type: string

      exclude_commits:
        description: "When true: use source branch EXCEPT the specified commits"
        required: false
        default: false
        type: boolean

      merge_mainline:
        description: "Parent number for merge commits used by squash/merge-selected"
        required: false
        default: "1"
        type: string

      patch_file:
        description: "Repository-relative .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom commit message"
        required: false
        type: string

      dry_run:
        description: "Validate and show planned operation without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-commits-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:

  apply:
    runs-on: ubuntu-latest

    env:
      STRATEGY: ${{ inputs.strategy }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      MERGE_MAINLINE: ${{ inputs.merge_mainline }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false
          git config merge.autoStash false

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUT VALIDATION"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected|merge-branch|rebase-branch|apply-patch|apply-diff)
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # Target
          # --------------------------------------------------------

          [[ -n "$TARGET_BRANCH" ]] || {
            echo "::error::target_branch is required"
            exit 1
          }

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1 || {
            echo "::error::Invalid target branch: $TARGET_BRANCH"
            exit 1
          }

          # --------------------------------------------------------
          # Source
          # --------------------------------------------------------

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null 2>&1 || {
              echo "::error::Invalid source branch: $SOURCE_BRANCH"
              exit 1
            }
          fi

          # --------------------------------------------------------
          # Mainline
          # --------------------------------------------------------

          if ! [[ "$MERGE_MAINLINE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::merge_mainline must be a positive integer"
            exit 1
          fi

          # --------------------------------------------------------
          # Patch / diff
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "apply-patch" || "$STRATEGY" == "apply-diff" ]]; then

            [[ -n "$PATCH_FILE" ]] || {
              echo "::error::patch_file is required for $STRATEGY"
              exit 1
            }

          else

            if [[ -n "$PATCH_FILE" ]]; then
              echo "::error::patch_file is only valid for apply-patch/apply-diff"
              exit 1
            fi

          fi

          # --------------------------------------------------------
          # Branch-based strategies
          # --------------------------------------------------------

          case "$STRATEGY" in
            merge-branch|rebase-branch)

              [[ -n "$SOURCE_BRANCH" ]] || {
                echo "::error::$STRATEGY requires source_branch"
                exit 1
              }

              ;;

          esac

          # --------------------------------------------------------
          # Selection strategies
          # --------------------------------------------------------

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
                echo "::error::$STRATEGY requires source_branch or commits"
                exit 1
              fi

              ;;

          esac

          # --------------------------------------------------------
          # Exclusion mode
          # --------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] || {
              echo "::error::exclude_commits=true requires source_branch"
              exit 1
            }

            [[ -n "$COMMITS_INPUT" ]] || {
              echo "::error::exclude_commits=true requires commits"
              exit 1
            }

          fi

          # --------------------------------------------------------
          # Commit message
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" && "$STRATEGY" == "rebase-branch" ]]; then
            echo "::error::commit_message is not supported for rebase-branch"
            exit 1
          fi

          echo "Inputs are valid."

      # ============================================================
      # FETCH TARGET
      # ============================================================

      - name: Fetch target branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(
            git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target:"
          echo "  branch: $TARGET_BRANCH"
          echo "  sha:    $TARGET_SHA"

      # ============================================================
      # FETCH SOURCE
      # ============================================================

      - name: Fetch source branch
        if: ${{ env.SOURCE_BRANCH != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(
            git rev-parse "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
          )"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source:"
          echo "  branch: $SOURCE_BRANCH"
          echo "  sha:    $SOURCE_SHA"

      # ============================================================
      # NORMALIZE INPUT SHAs
      # ============================================================

      - name: Normalize commit input
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_commits"
          touch "$RUNNER_TEMP/input_commits"

          if [[ -z "$COMMITS_INPUT" ]]; then

            echo "INPUT_COUNT=0" >> "$GITHUB_ENV"
            exit 0

          fi

          printf '%s\n' "$COMMITS_INPUT" |
            tr ' ' '\n' |
            sed '/^[[:space:]]*$/d' |
            while IFS= read -r value; do

              if [[ ! "$value" =~ ^[0-9a-fA-F]{7,64}$ ]]; then
                echo "::error::Invalid commit SHA: $value"
                exit 1
              fi

              if ! git cat-file -e "$value^{commit}" 2>/dev/null; then

                git fetch \
                  --no-tags \
                  --filter=blob:none \
                  origin \
                  "$value"

              fi

              sha="$(
                git rev-parse "$value^{commit}"
              )"

              echo "$sha"

            done |
            awk '!seen[$0]++' \
            > "$RUNNER_TEMP/input_commits"

          INPUT_COUNT="$(
            wc -l < "$RUNNER_TEMP/input_commits" |
            tr -d ' '
          )"

          echo "INPUT_COUNT=$INPUT_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Normalized explicit commits: $INPUT_COUNT"

      # ============================================================
      # SOURCE HISTORY
      #
      # Only calculated when we actually need branch selection.
      # ============================================================

      - name: Build source history
        if: ${{ env.SOURCE_SHA != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t BASES < <(
            git merge-base --all "$TARGET_SHA" "$SOURCE_SHA"
          )

          if (( ${#BASES[@]} == 0 )); then

            echo "::error::Target and source have no common ancestor."
            exit 1

          fi

          if (( ${#BASES[@]} > 1 )); then

            echo "::error::Multiple merge bases detected."
            echo "::error::Workflow refuses to guess the correct base."

            printf '%s\n' "${BASES[@]}"

            exit 1

          fi

          MERGE_BASE="${BASES[0]}"

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Only branch-selection operations need this history.
          # Explicit-only selection does not.
          # --------------------------------------------------------

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              git rev-list \
                --topo-order \
                --reverse \
                "$MERGE_BASE..$SOURCE_SHA" \
                > "$RUNNER_TEMP/source_history"

              ;;

            cherry-pick|squash|merge-selected)

              if [[ -n "$SOURCE_BRANCH" ]]; then

                git rev-list \
                  --topo-order \
                  --reverse \
                  "$MERGE_BASE..$SOURCE_SHA" \
                  > "$RUNNER_TEMP/source_history"

              else

                touch "$RUNNER_TEMP/source_history"

              fi

              ;;

            *)
              touch "$RUNNER_TEMP/source_history"
              ;;

          esac

          SOURCE_COUNT="$(
            wc -l < "$RUNNER_TEMP/source_history" |
            tr -d ' '
          )"

          echo "SOURCE_COUNT=$SOURCE_COUNT" >> "$GITHUB_ENV"

          echo "Source history: $SOURCE_COUNT commits"

      # ============================================================
      # BUILD SELECTION PLAN
      # ============================================================

      - name: Build selection plan
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/selected"
          touch "$RUNNER_TEMP/selected"

          # ========================================================
          # PATCH / DIFF
          # ========================================================

          if [[ "$STRATEGY" == "apply-patch" || "$STRATEGY" == "apply-diff" ]]; then
            echo "SELECTED_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # ========================================================
          # MERGE BRANCH / REBASE BRANCH
          # ========================================================

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              cp \
                "$RUNNER_TEMP/source_history" \
                "$RUNNER_TEMP/selected"

              ;;

            # ======================================================
            # SELECTIVE STRATEGIES
            # ======================================================

            cherry-pick|squash|merge-selected)

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                # Source branch minus explicitly excluded commits.

                awk '
                  NR == FNR {
                    excluded[$1] = 1
                    next
                  }

                  !excluded[$1] {
                    print $1
                  }
                ' \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/source_history" \
                  > "$RUNNER_TEMP/selected"

              elif [[ -n "$COMMITS_INPUT" ]]; then

                # Explicit SHA selection.

                cp \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/selected"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                # Entire source branch.

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected"

              fi

              ;;

          esac

          # ========================================================
          # REMOVE DUPLICATES
          # ========================================================

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/selected.unique"

          mv \
            "$RUNNER_TEMP/selected.unique" \
            "$RUNNER_TEMP/selected"

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected" |
            tr -d ' '
          )"

          echo "SELECTED_COUNT=$SELECTED_COUNT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "SELECTION PLAN"
          echo "========================================"

          echo "Strategy: $STRATEGY"
          echo "Target:   $TARGET_BRANCH"
          echo "Source:   ${SOURCE_BRANCH:-<none>}"
          echo "Exclude:  $EXCLUDE_COMMITS"
          echo "Selected: $SELECTED_COUNT"
          echo

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            echo "$sha"
            echo "  $(git log -1 --format='%s' "$sha")"

          done < "$RUNNER_TEMP/selected"

      # ============================================================
      # MERGE COMMIT VALIDATION
      # ============================================================

      - name: Validate merge commits
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/merge_commits"
          touch "$RUNNER_TEMP/merge_commits"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then
              echo "$sha" >> "$RUNNER_TEMP/merge_commits"
            fi

          done < "$RUNNER_TEMP/selected"

          MERGE_COUNT="$(
            wc -l < "$RUNNER_TEMP/merge_commits" |
            tr -d ' '
          )"

          echo "MERGE_COUNT=$MERGE_COUNT" >> "$GITHUB_ENV"

          case "$STRATEGY" in

            cherry-pick|rebase-branch)

              if (( MERGE_COUNT > 0 )); then

                echo "::error::$STRATEGY does not allow merge commits."

                echo "Merge commits:"
                cat "$RUNNER_TEMP/merge_commits"

                exit 1

              fi

              ;;

            squash|merge-selected)

              while IFS= read -r sha; do

                parent_count="$(
                  git rev-list \
                    --parents \
                    -n 1 \
                    "$sha" |
                  awk '{print NF-1}'
                )"

                if (( MERGE_MAINLINE > parent_count )); then

                  echo "::error::merge_mainline=$MERGE_MAINLINE is invalid for $sha"
                  echo "::error::Commit has $parent_count parents."

                  exit 1

                fi

              done < "$RUNNER_TEMP/merge_commits"

              ;;

          esac

      # ============================================================
      # FAST DUPLICATE / ALREADY-APPLIED CHECK
      #
      # IMPORTANT:
      # We DO NOT scan target history with patch-id.
      #
      # Exact ancestors are detected here.
      # Redundant changes are handled by cherry-pick itself with
      # --empty=drop.
      # ============================================================

      - name: Remove commits already in target history
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/already_applied"
          touch "$RUNNER_TEMP/already_applied"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if git merge-base --is-ancestor "$sha" "$TARGET_SHA"; then

              echo "$sha" >> "$RUNNER_TEMP/already_applied"

              echo "Already in target history: $sha"

            fi

          done < "$RUNNER_TEMP/selected"

          sort -u \
            "$RUNNER_TEMP/already_applied" \
            -o "$RUNNER_TEMP/already_applied"

          grep -vxFf \
            "$RUNNER_TEMP/already_applied" \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/executable" || true

          EXECUTABLE_COUNT="$(
            wc -l < "$RUNNER_TEMP/executable" |
            tr -d ' '
          )"

          ALREADY_COUNT="$(
            wc -l < "$RUNNER_TEMP/already_applied" |
            tr -d ' '
          )"

          echo "EXECUTABLE_COUNT=$EXECUTABLE_COUNT" >> "$GITHUB_ENV"
          echo "ALREADY_COUNT=$ALREADY_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Already in target: $ALREADY_COUNT"
          echo "To process:       $EXECUTABLE_COUNT"

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Dry run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:          $STRATEGY"
          echo "Target branch:     $TARGET_BRANCH"
          echo "Target SHA:        $TARGET_SHA"
          echo "Source branch:     ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:        ${SOURCE_SHA:-<none>}"
          echo "Merge base:        ${MERGE_BASE:-<none>}"
          echo "Exclude:           $EXCLUDE_COMMITS"
          echo "Input commits:     ${INPUT_COUNT:-0}"
          echo "Selected commits:  ${SELECTED_COUNT:-0}"
          echo "Already in target: ${ALREADY_COUNT:-0}"
          echo "To process:        ${EXECUTABLE_COUNT:-0}"
          echo "Merge commits:     ${MERGE_COUNT:-0}"
          echo "Mainline:          $MERGE_MAINLINE"
          echo "Patch:             ${PATCH_FILE:-<none>}"
          echo "Message:           ${COMMIT_MESSAGE:-<automatic>}"
          echo
          echo "No changes will be made."

          echo
          echo "Planned commits:"

          if [[ -s "$RUNNER_TEMP/executable" ]]; then

            while IFS= read -r sha; do

              echo "- $sha"
              echo "  $(git log -1 --format='%s' "$sha")"

            done < "$RUNNER_TEMP/executable"

          else

            echo "- none"

          fi

      # ============================================================
      # STOP HERE FOR DRY RUN
      # ============================================================

      - name: Stop after dry run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "Dry run completed successfully."
          exit 0

      # ============================================================
      # PREPARE TARGET
      # ============================================================

      - name: Prepare target
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch --detach "$TARGET_SHA"

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1

          fi

      # ============================================================
      # CHERRY-PICK
      # ============================================================

      - name: Execute cherry-pick
        if: ${{ env.STRATEGY == 'cherry-pick' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain to cherry-pick."
            exit 1

          fi

          COUNT="$EXECUTABLE_COUNT"

          while IFS= read -r sha; do

            echo
            echo "Cherry-pick: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            # ------------------------------------------------------
            # Custom message is valid only for exactly one selected
            # executable commit.
            # ------------------------------------------------------

            if [[ "$COUNT" -eq 1 && -n "$COMMIT_MESSAGE" ]]; then

              if ! git cherry-pick \
                --no-commit \
                --empty=stop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

              if git diff --cached --quiet; then

                git reset --hard "$TARGET_SHA"

                echo "::error::Commit produced no changes: $sha"
                exit 1

              fi

              git commit -m "$COMMIT_MESSAGE"

            else

              # ----------------------------------------------------
              # --empty=drop protects against a commit becoming
              # redundant because of previous selected commits.
              # ----------------------------------------------------

              if ! git cherry-pick \
                --no-edit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

      # ============================================================
      # SQUASH
      # ============================================================

      - name: Execute squash
        if: ${{ env.STRATEGY == 'squash' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain for squash."
            exit 1

          fi

          BEFORE="$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Squash apply: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              if ! git cherry-pick \
                --no-commit \
                --mainline "$MERGE_MAINLINE" \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BEFORE"

                echo "::error::Failed to apply merge commit: $sha"
                exit 1

              fi

            else

              if ! git cherry-pick \
                --no-commit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BEFORE"

                echo "::error::Failed to apply commit: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          # --------------------------------------------------------
          # All changes may have become redundant.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            git reset --hard "$BEFORE"

            echo "::error::Squash produced no changes."
            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Squash selected commits from ${SOURCE_BRANCH:-source}"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # REBASE-BRANCH
      #
      # This intentionally replays the source commits in topology
      # order instead of relying on timestamp ordering.
      # ============================================================

      - name: Execute rebase-branch
        if: ${{ env.STRATEGY == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain for rebase."
            exit 1

          fi

          while IFS= read -r sha; do

            echo
            echo "Replay: $sha"

            if ! git cherry-pick \
              --no-edit \
              --empty=drop \
              "$sha"; then

              git cherry-pick --abort || true

              echo "::error::Replay failed: $sha"
              exit 1

            fi

          done < "$RUNNER_TEMP/executable"

      # ============================================================
      # MERGE BRANCH
      # ============================================================

      - name: Execute merge-branch
        if: ${{ env.STRATEGY == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git merge-base --is-ancestor "$SOURCE_SHA" "$TARGET_SHA"; then

            echo "::error::Source branch is already completely contained in target."
            exit 1

          fi

          # --------------------------------------------------------
          # Test merge before changing the working tree.
          # --------------------------------------------------------

          git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SOURCE_SHA" \
            > "$RUNNER_TEMP/merge_tree"

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SOURCE_SHA"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SOURCE_SHA"

          fi

      # ============================================================
      # MERGE SELECTED
      # ============================================================

      - name: Execute merge-selected
        if: ${{ env.STRATEGY == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain for merge-selected."
            exit 1

          fi

          TMP_BRANCH="workflow-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            git branch -D "$TMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          git switch -c "$TMP_BRANCH" "$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Selected replay: $sha"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              if ! git cherry-pick \
                --no-edit \
                --mainline "$MERGE_MAINLINE" \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay merge commit: $sha"
                exit 1

              fi

            else

              if ! git cherry-pick \
                --no-edit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay commit: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          SELECTED_HEAD="$(
            git rev-parse HEAD
          )"

          if [[ "$SELECTED_HEAD" == "$TARGET_SHA" ]]; then

            echo "::error::Selected commits produced no changes."
            exit 1

          fi

          git switch --detach "$TARGET_SHA"

          # --------------------------------------------------------
          # Validate merge.
          # --------------------------------------------------------

          git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SELECTED_HEAD" \
            > "$RUNNER_TEMP/selected_merge_tree"

          # --------------------------------------------------------
          # Create merge commit.
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SELECTED_HEAD"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SELECTED_HEAD"

          fi

      # ============================================================
      # APPLY PATCH
      # ============================================================

      - name: Execute patch
        if: ${{ env.STRATEGY == 'apply-patch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f "$PATCH_FILE" ]] || {
            echo "::error::Patch file does not exist: $PATCH_FILE"
            exit 1
          }

          git apply \
            --check \
            --3way \
            "$PATCH_FILE"

          if ! git apply \
            --3way \
            "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply patch: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # APPLY DIFF
      # ============================================================

      - name: Execute diff
        if: ${{ env.STRATEGY == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f "$PATCH_FILE" ]] || {
            echo "::error::Diff file does not exist: $PATCH_FILE"
            exit 1
          }

          git apply \
            --check \
            "$PATCH_FILE"

          if ! git apply "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply diff: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Final validation
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(
            git rev-parse HEAD
          )"

          echo "Original target: $TARGET_SHA"
          echo "Final SHA:       $FINAL_SHA"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no changes."
            exit 1

          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is dirty."
            git status --short

            exit 1

          fi

          git cat-file -e "$FINAL_SHA^{commit}" || {
            echo "::error::Final SHA is invalid."
            exit 1
          }

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ============================================================
      # REMOTE RACE PROTECTION
      # ============================================================

      - name: Verify remote target
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_SHA="$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "Planned target: $TARGET_SHA"
          echo "Remote target:  $REMOTE_SHA"

          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed during workflow execution."
            echo "::error::Push cancelled to prevent overwriting someone else's changes."

            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            rebase-branch)

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply commits"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-unknown}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-<none>}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-<none>}\` |"
            echo "| Merge base | \`${MERGE_BASE:-<none>}\` |"
            echo "| Exclude | \`$EXCLUDE_COMMITS\` |"
            echo "| Input commits | \`${INPUT_COUNT:-0}\` |"
            echo "| Selected | \`${SELECTED_COUNT:-0}\` |"
            echo "| Already in target | \`${ALREADY_COUNT:-0}\` |"
            echo "| Executed | \`${EXECUTABLE_COUNT:-0}\` |"
            echo "| Merge commits | \`${MERGE_COUNT:-0}\` |"
            echo "| Mainline | \`$MERGE_MAINLINE\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Final SHA | \`${FINAL_SHA:-<none>}\` |"
            echo
            echo "### Selected commits"
            echo

            if [[ -s "$RUNNER_TEMP/selected" ]]; then

              while IFS= read -r sha; do

                echo "- \`$sha\` — $(git log -1 --format='%s' "$sha" 2>/dev/null || echo 'unknown')"

              done < "$RUNNER_TEMP/selected"

            else

              echo "_none_"

            fi

          } >> "$GITHUB_STEP_SUMMARY"
