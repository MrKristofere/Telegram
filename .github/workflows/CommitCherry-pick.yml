name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "How to apply changes"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Required for branch-based strategies"
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA(s), separated by spaces or new lines"
        required: false
        type: string

      exclude_commits:
        description: "If true, use source branch commits EXCEPT commits listed above"
        required: false
        default: false
        type: boolean

      patch_file:
        description: "Repository-relative .patch/.diff file"
        required: false
        type: string

      commit_message:
        description: "Custom commit message. For cherry-pick used only with one selected commit; for squash used for the final commit"
        required: false
        type: string

      dry_run:
        description: "Validate and show the planned operation without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-commits-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      STRATEGY: ${{ inputs.strategy }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      # ============================================================
      # CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false
          git config merge.autoStash false

      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUT VALIDATION"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected|merge-branch|rebase-branch|apply-patch|apply-diff)
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          [[ -n "$TARGET_BRANCH" ]] || {
            echo "::error::target_branch is required"
            exit 1
          }

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1 || {
            echo "::error::Invalid target branch: $TARGET_BRANCH"
            exit 1
          }

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null 2>&1 || {
              echo "::error::Invalid source branch: $SOURCE_BRANCH"
              exit 1
            }
          fi

          # --------------------------------------------------------
          # PATCH / DIFF
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "apply-patch" || "$STRATEGY" == "apply-diff" ]]; then

            [[ -n "$PATCH_FILE" ]] || {
              echo "::error::patch_file is required for $STRATEGY"
              exit 1
            }

            [[ -f "$PATCH_FILE" ]] || {
              echo "::error::Patch/diff file not found: $PATCH_FILE"
              exit 1
            }

          elif [[ -n "$PATCH_FILE" ]]; then

            echo "::error::patch_file can only be used with apply-patch/apply-diff"
            exit 1

          fi

          # --------------------------------------------------------
          # SOURCE BRANCH
          # --------------------------------------------------------

          case "$STRATEGY" in
            merge-branch|rebase-branch|merge-selected)
              [[ -n "$SOURCE_BRANCH" ]] || {
                echo "::error::source_branch is required for $STRATEGY"
                exit 1
              }
              ;;
          esac

          # --------------------------------------------------------
          # CHERRY-PICK
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "cherry-pick" ]]; then
            [[ -n "$COMMITS_INPUT" ]] || {
              echo "::error::commits is required for cherry-pick"
              exit 1
            }
          fi

          # --------------------------------------------------------
          # EXCLUDE
          # --------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] || {
              echo "::error::source_branch is required when exclude_commits=true"
              exit 1
            }

            [[ -n "$COMMITS_INPUT" ]] || {
              echo "::error::commits is required when exclude_commits=true"
              exit 1
            }

          fi

          # --------------------------------------------------------
          # SQUASH
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "squash" ]]; then

            if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
              echo "::error::squash requires source_branch or commits"
              exit 1
            fi

          fi

          # --------------------------------------------------------
          # COMMIT MESSAGE
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            case "$STRATEGY" in
              cherry-pick|squash|merge-selected|merge-branch|apply-patch|apply-diff)
                ;;
              rebase-branch)
                echo "::error::commit_message cannot be used with rebase-branch"
                exit 1
                ;;
            esac

          fi

      # ============================================================
      # RESOLVE TARGET / SOURCE
      # ============================================================

      - name: Resolve branch snapshots
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "RESOLVING BRANCH SNAPSHOTS"
          echo "========================================"

          git fetch \
            --no-tags \
            --prune \
            --no-progress \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(
            git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          if [[ -n "$SOURCE_BRANCH" ]]; then

            git fetch \
              --no-tags \
              --prune \
              --no-progress \
              origin \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            SOURCE_SHA="$(
              git rev-parse "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
            )"

            MERGE_BASE="$(
              git merge-base "$TARGET_SHA" "$SOURCE_SHA"
            )"

            echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
            echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          else

            echo "SOURCE_SHA=" >> "$GITHUB_ENV"
            echo "MERGE_BASE=" >> "$GITHUB_ENV"

          fi

          echo
          echo "Target:     $TARGET_BRANCH"
          echo "Target SHA: $TARGET_SHA"

          if [[ -n "$SOURCE_BRANCH" ]]; then
            echo "Source:     $SOURCE_BRANCH"
            echo "Source SHA: $SOURCE_SHA"
            echo "Merge base: $MERGE_BASE"
          fi

      # ============================================================
      # NORMALIZE INPUT COMMITS
      # ============================================================

      - name: Normalize commit input
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_commits"
          touch "$RUNNER_TEMP/input_commits"

          if [[ -n "$COMMITS_INPUT" ]]; then

            printf '%s\n' "$COMMITS_INPUT" \
              | tr ' ' '\n' \
              | sed '/^[[:space:]]*$/d' \
              | while IFS= read -r value; do

                  value="${value#"${value%%[![:space:]]*}"}"
                  value="${value%"${value##*[![:space:]]}"}"

                  [[ -n "$value" ]] || continue

                  if [[ ! "$value" =~ ^[0-9a-fA-F]{7,64}$ ]]; then
                    echo "::error::Invalid commit SHA: $value"
                    exit 1
                  fi

                  full_sha="$(
                    git rev-parse "$value^{commit}" 2>/dev/null
                  )" || {
                    echo "::error::Commit not found: $value"
                    exit 1
                  }

                  printf '%s\n' "$full_sha"

                done \
              | sort -u \
              > "$RUNNER_TEMP/input_commits"

          fi

          INPUT_COUNT="$(
            wc -l < "$RUNNER_TEMP/input_commits" | tr -d ' '
          )"

          echo "INPUT_COMMIT_COUNT=$INPUT_COUNT" >> "$GITHUB_ENV"

          echo "Normalized input commits:"
          cat "$RUNNER_TEMP/input_commits" || true

      # ============================================================
      # BUILD SOURCE HISTORY
      #
      # --topo-order is intentional.
      # We do NOT sort by commit timestamp.
      # ============================================================

      - name: Build source history
        if: ${{ env.SOURCE_SHA != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "SOURCE HISTORY"
          echo "========================================"

          git rev-list \
            --topo-order \
            --reverse \
            "$MERGE_BASE..$SOURCE_SHA" \
            > "$RUNNER_TEMP/source_history"

          SOURCE_COUNT="$(
            wc -l < "$RUNNER_TEMP/source_history" | tr -d ' '
          )"

          echo "SOURCE_COMMIT_COUNT=$SOURCE_COUNT" >> "$GITHUB_ENV"

          echo "Source commits: $SOURCE_COUNT"

      # ============================================================
      # BUILD UNIFIED SELECTION
      # ============================================================

      - name: Build unified selection
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/selected_commits"
          touch "$RUNNER_TEMP/selected_commits"

          case "$STRATEGY" in

            apply-patch|apply-diff)
              ;;

            merge-branch)
              cp \
                "$RUNNER_TEMP/source_history" \
                "$RUNNER_TEMP/selected_commits"
              ;;

            rebase-branch)

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected_commits"

              elif [[ -n "$COMMITS_INPUT" ]]; then

                cp \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/selected_commits"

              else

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected_commits"

              fi

              ;;

            merge-selected|squash)

              if [[ -n "$SOURCE_SHA" && "$EXCLUDE_COMMITS" == "true" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected_commits"

              elif [[ -n "$COMMITS_INPUT" ]]; then

                cp \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/selected_commits"

              elif [[ -n "$SOURCE_SHA" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected_commits"

              fi

              ;;

            cherry-pick)

              cp \
                "$RUNNER_TEMP/input_commits" \
                "$RUNNER_TEMP/selected_commits"

              ;;

          esac

          # ========================================================
          # EXCLUDE
          # ========================================================

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            awk '
              NR == FNR {
                excluded[$1] = 1
                next
              }

              !excluded[$1]
            ' \
              "$RUNNER_TEMP/input_commits" \
              "$RUNNER_TEMP/selected_commits" \
              > "$RUNNER_TEMP/selected_filtered"

            mv \
              "$RUNNER_TEMP/selected_filtered" \
              "$RUNNER_TEMP/selected_commits"

          fi

          # ========================================================
          # REMOVE DUPLICATES
          # ========================================================

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/selected_commits" \
            > "$RUNNER_TEMP/selected_unique"

          mv \
            "$RUNNER_TEMP/selected_unique" \
            "$RUNNER_TEMP/selected_commits"

          # ========================================================
          # SOURCE TOPOLOGICAL ORDER
          # ========================================================

          if [[ -n "$SOURCE_SHA" && -s "$RUNNER_TEMP/selected_commits" ]]; then

            awk '
              NR == FNR {
                wanted[$1] = 1
                next
              }

              wanted[$1] {
                print $1
              }
            ' \
              "$RUNNER_TEMP/selected_commits" \
              "$RUNNER_TEMP/source_history" \
              > "$RUNNER_TEMP/selected_ordered"

            missing="$(
              comm -23 \
                <(sort "$RUNNER_TEMP/selected_commits") \
                <(sort "$RUNNER_TEMP/selected_ordered") \
                || true
            )"

            if [[ -n "$missing" ]]; then
              echo "::error::Selected commit is not part of source branch history:"
              echo "$missing"
              exit 1
            fi

            mv \
              "$RUNNER_TEMP/selected_ordered" \
              "$RUNNER_TEMP/selected_commits"

          fi

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected_commits" | tr -d ' '
          )"

          echo "SELECTED_COMMIT_COUNT=$SELECTED_COUNT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "SELECTED COMMITS"
          echo "========================================"

          if [[ "$SELECTED_COUNT" -eq 0 ]]; then
            echo "<none>"
          else
            cat "$RUNNER_TEMP/selected_commits"
          fi

      # ============================================================
      # CHERRY-PICK CUSTOM MESSAGE
      #
      # Multiple commits + custom message:
      # warning only; it is ignored.
      # ============================================================

      - name: Validate custom commit message
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -n "$COMMIT_MESSAGE" ]] || exit 0

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected_commits" | tr -d ' '
          )"

          case "$STRATEGY" in

            cherry-pick)

              if [[ "$SELECTED_COUNT" -ne 1 ]]; then
                echo "::warning::commit_message is ignored because $SELECTED_COUNT commits are selected for cherry-pick."
              fi

              ;;

            squash|merge-selected|merge-branch|apply-patch|apply-diff)
              ;;

            rebase-branch)
              echo "::error::commit_message is not supported for rebase-branch"
              exit 1
              ;;

          esac

      # ============================================================
      # ANALYZE SELECTED COMMITS
      #
      # IMPORTANT:
      #
      # cherry-pick:
      #   merge commit -> forbidden
      #
      # rebase-branch:
      #   merge commit -> forbidden
      #
      # squash:
      #   merge commit -> ALLOWED
      #
      # merge-selected:
      #   merge commit -> ALLOWED
      # ============================================================

      - name: Analyze selected commits
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/selected_commits" ]]; then

            case "$STRATEGY" in
              cherry-pick|squash|merge-selected|rebase-branch)
                echo "::error::No commits selected."
                exit 1
                ;;
            esac

            exit 0

          fi

          rm -f "$RUNNER_TEMP/merge_commits"
          touch "$RUNNER_TEMP/merge_commits"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            parent_count="$(
              git rev-list --parents -n 1 "$sha" \
              | awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then
              echo "$sha" >> "$RUNNER_TEMP/merge_commits"
            fi

            echo
            echo "Commit:  $sha"
            echo "Subject: $(git log -1 --format=%s "$sha")"
            echo "Parents: $parent_count"

          done < "$RUNNER_TEMP/selected_commits"

          MERGE_COUNT="$(
            wc -l < "$RUNNER_TEMP/merge_commits" | tr -d ' '
          )"

          echo "MERGE_COMMIT_COUNT=$MERGE_COUNT" >> "$GITHUB_ENV"

          if (( MERGE_COUNT > 0 )); then

            case "$STRATEGY" in

              cherry-pick|rebase-branch)

                echo "::error::Selected history contains merge commits."
                echo "::error::Merge commits are not supported by $STRATEGY."
                echo "::error::Use squash or merge-selected if merge commits must be included."

                cat "$RUNNER_TEMP/merge_commits"

                exit 1
                ;;

              squash)

                echo
                echo "Merge commits are allowed for squash."
                echo "They will be replayed relative to mainline parent 1."

                ;;

              merge-selected|merge-branch)

                echo
                echo "Merge commits are allowed for $STRATEGY."

                ;;

            esac

          fi

      # ============================================================
      # EXCLUDED DEPENDENCY CHECK
      # ============================================================

      - name: Check excluded dependencies
        if: ${{ env.EXCLUDE_COMMITS == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "DEPENDENCY CHECK"
          echo "========================================"

          [[ -s "$RUNNER_TEMP/selected_commits" ]] || exit 0

          while IFS= read -r selected; do

            [[ -n "$selected" ]] || continue

            while IFS= read -r parent; do

              [[ -n "$parent" ]] || continue

              if grep -qx "$parent" "$RUNNER_TEMP/input_commits"; then

                echo "::error::Selected commit depends directly on excluded commit."
                echo "::error::Selected: $selected"
                echo "::error::Excluded parent: $parent"

                exit 1
              fi

            done < <(
              git rev-list \
                --parents \
                -n 1 \
                "$selected" \
                | cut -d' ' -f2-
            )

          done < "$RUNNER_TEMP/selected_commits"

      # ============================================================
      # PATCH EQUIVALENCE
      #
      # Merge commits are handled separately.
      # ============================================================

      - name: Analyze already-applied changes
        if: ${{ env.SELECTED_COMMIT_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "PATCH EQUIVALENCE"
          echo "========================================"

          rm -f "$RUNNER_TEMP/already_applied"
          touch "$RUNNER_TEMP/already_applied"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            parent_count="$(
              git rev-list --parents -n 1 "$sha" \
              | awk '{print NF-1}'
            )"

            # ------------------------------------------------------
            # For merge commits we intentionally do not use the
            # normal patch-id shortcut.
            #
            # They require mainline semantics.
            # ------------------------------------------------------

            if (( parent_count > 1 )); then
              continue
            fi

            patch_id="$(
              git diff-tree \
                --patch \
                "$sha^" "$sha" \
                | git patch-id --stable \
                | awk '{print $1}'
            )"

            [[ -n "$patch_id" ]] || continue

            target_has_patch="$(
              git rev-list --no-merges "$TARGET_SHA" \
                | while IFS= read -r existing; do
                    existing_patch="$(
                      git diff-tree \
                        --patch \
                        "$existing^" "$existing" \
                        | git patch-id --stable \
                        | awk '{print $1}'
                    )"

                    if [[ "$existing_patch" == "$patch_id" ]]; then
                      echo "yes"
                      break
                    fi
                  done
            )"

            if [[ "$target_has_patch" == "yes" ]]; then

              echo "$sha" >> "$RUNNER_TEMP/already_applied"

              echo "Already applied by patch-id: $sha"

            fi

          done < "$RUNNER_TEMP/selected_commits"

          APPLIED_EQUIVALENT_COUNT="$(
            wc -l < "$RUNNER_TEMP/already_applied" | tr -d ' '
          )"

          echo "PATCH_EQUIVALENT_COUNT=$APPLIED_EQUIVALENT_COUNT" >> "$GITHUB_ENV"

      # ============================================================
      # PLAN
      # ============================================================

      - name: Show planned operation
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "PLANNED OPERATION"
          echo "========================================"

          echo "Strategy:              $STRATEGY"
          echo "Target branch:         $TARGET_BRANCH"
          echo "Target SHA:            $TARGET_SHA"
          echo "Source branch:         ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:            ${SOURCE_SHA:-<none>}"
          echo "Merge base:            ${MERGE_BASE:-<none>}"
          echo "Exclude:               $EXCLUDE_COMMITS"
          echo "Input commits:         $INPUT_COMMIT_COUNT"
          echo "Selected commits:      $SELECTED_COMMIT_COUNT"
          echo "Merge commits:         ${MERGE_COMMIT_COUNT:-0}"
          echo "Already equivalent:    ${PATCH_EQUIVALENT_COUNT:-0}"
          echo "Patch file:            ${PATCH_FILE:-<none>}"
          echo "Custom message:        ${COMMIT_MESSAGE:-<auto>}"
          echo "Dry run:               $DRY_RUN"

          echo
          echo "Selected commits:"

          if [[ -s "$RUNNER_TEMP/selected_commits" ]]; then
            cat "$RUNNER_TEMP/selected_commits"
          else
            echo "<none>"
          fi

          echo
          echo "========================================"

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Stop after dry run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "DRY RUN COMPLETE"
          echo "========================================"
          echo "No changes were pushed."
          echo "========================================"

      # ============================================================
      # PREPARE TARGET
      # ============================================================

      - name: Prepare target worktree
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch --detach "$TARGET_SHA"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      # ============================================================
      # CHERRY-PICK
      #
      # Merge commits are already rejected by Analyze step.
      # ============================================================

      - name: Execute cherry-pick
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'cherry-pick' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/selected_commits" ]]; then
            echo "::error::No commits selected."
            exit 1
          fi

          COMMIT_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected_commits" | tr -d ' '
          )"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if grep -qx "$sha" "$RUNNER_TEMP/already_applied"; then
              echo "Skipping patch-equivalent commit: $sha"
              continue
            fi

            echo "Cherry-picking: $sha"

            # ------------------------------------------------------
            # ONE COMMIT + CUSTOM MESSAGE
            # ------------------------------------------------------

            if [[ -n "$COMMIT_MESSAGE" && "$COMMIT_COUNT" -eq 1 ]]; then

              if ! git cherry-pick \
                --no-commit \
                --empty=stop \
                "$sha"; then

                echo "::error::Cherry-pick failed for commit: $sha"

                git cherry-pick --abort || true

                exit 1
              fi

              if git diff --cached --quiet; then

                echo "::error::Cherry-pick produced no staged changes: $sha"

                git reset --hard HEAD

                exit 1
              fi

              git commit -m "$COMMIT_MESSAGE"

            else

              # ----------------------------------------------------
              # NORMAL CHERRY-PICK
              # ----------------------------------------------------

              if ! git cherry-pick \
                --no-edit \
                --empty=stop \
                "$sha"; then

                echo "::error::Cherry-pick failed for commit: $sha"

                git cherry-pick --abort || true

                exit 1
              fi

            fi

          done < "$RUNNER_TEMP/selected_commits"

      # ============================================================
      # SQUASH
      #
      # Merge commits ARE allowed.
      #
      # Normal commit:
      #   git cherry-pick --no-commit
      #
      # Merge commit:
      #   git cherry-pick --no-commit --mainline 1
      #
      # Everything is accumulated in the index.
      # At the end exactly ONE commit is created.
      # ============================================================

      - name: Execute squash
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'squash' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/selected_commits" ]]; then
            echo "::error::No commits selected for squash."
            exit 1
          fi

          BEFORE_SHA="$TARGET_SHA"

          APPLIED_COUNT=0

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            # ------------------------------------------------------
            # Already applied normal commit.
            # ------------------------------------------------------

            if grep -qx "$sha" "$RUNNER_TEMP/already_applied"; then
              echo "Skipping patch-equivalent commit: $sha"
              continue
            fi

            parent_count="$(
              git rev-list --parents -n 1 "$sha" \
              | awk '{print NF-1}'
            )"

            echo
            echo "Applying to squash:"
            echo "  SHA:     $sha"
            echo "  Subject: $(git log -1 --format=%s "$sha")"
            echo "  Parents: $parent_count"

            # ------------------------------------------------------
            # MERGE COMMIT
            #
            # Git requires --mainline for cherry-picking a merge.
            #
            # Parent 1 is the mainline.
            # ------------------------------------------------------

            if (( parent_count > 1 )); then

              echo "  Type: merge commit"
              echo "  Mainline: parent 1"

              if ! git cherry-pick \
                --no-commit \
                --mainline 1 \
                --empty=keep \
                "$sha"; then

                echo "::error::Failed to apply merge commit during squash: $sha"

                git cherry-pick --abort || true
                git reset --hard "$BEFORE_SHA"

                exit 1
              fi

            else

              # ----------------------------------------------------
              # NORMAL COMMIT
              # ----------------------------------------------------

              echo "  Type: normal commit"

              if ! git cherry-pick \
                --no-commit \
                --empty=keep \
                "$sha"; then

                echo "::error::Failed to apply commit during squash: $sha"

                git cherry-pick --abort || true
                git reset --hard "$BEFORE_SHA"

                exit 1
              fi

            fi

            APPLIED_COUNT=$((APPLIED_COUNT + 1))

          done < "$RUNNER_TEMP/selected_commits"

          # ========================================================
          # IMPORTANT:
          #
          # It is possible for all selected commits to be empty
          # because their changes already exist in target.
          # Do not create an empty squash commit.
          # ========================================================

          if git diff --cached --quiet; then

            echo "::error::Squash produced no changes."

            git reset --hard "$BEFORE_SHA"

            exit 1

          fi

          # ========================================================
          # CUSTOM MESSAGE
          # ========================================================

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            FINAL_MESSAGE="$COMMIT_MESSAGE"

          else

            FINAL_MESSAGE="Squash selected commits from ${SOURCE_BRANCH:-source}"

          fi

          echo
          echo "Creating final squash commit:"
          echo "$FINAL_MESSAGE"

          git commit \
            -m "$FINAL_MESSAGE"

      # ============================================================
      # REBASE-BRANCH
      #
      # Merge commits are deliberately forbidden.
      # ============================================================

      - name: Execute rebase-branch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/selected_commits" ]]; then
            echo "::error::rebase-branch has no commits to replay."
            exit 1
          fi

          BEFORE_SHA="$TARGET_SHA"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if grep -qx "$sha" "$RUNNER_TEMP/already_applied"; then
              echo "Skipping patch-equivalent commit: $sha"
              continue
            fi

            echo "Replaying: $sha"

            if ! git cherry-pick \
              --no-edit \
              --empty=stop \
              "$sha"; then

              echo "::error::Rebase replay failed for commit: $sha"

              git cherry-pick --abort || true

              exit 1
            fi

          done < "$RUNNER_TEMP/selected_commits"

          if [[ "$(git rev-parse HEAD)" == "$BEFORE_SHA" ]]; then
            echo "::error::Rebase produced no changes although commits were selected."
            exit 1
          fi

      # ============================================================
      # MERGE-BRANCH
      # ============================================================

      - name: Execute merge-branch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git merge-base --is-ancestor "$SOURCE_SHA" "$TARGET_SHA"; then
            echo "::error::Source branch is already fully contained in target."
            exit 1
          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SOURCE_SHA"

          else

            GIT_MERGE_AUTOEDIT=no \
              git merge \
              --no-ff \
              --no-edit \
              "$SOURCE_SHA"

          fi

      # ============================================================
      # MERGE-SELECTED
      # ============================================================

      - name: Execute merge-selected
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/selected_commits" ]]; then
            echo "::error::No commits selected for merge-selected."
            exit 1
          fi

          TMP_BRANCH="__workflow_selected_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            git branch -D "$TMP_BRANCH" 2>/dev/null || true
          }

          trap cleanup EXIT

          git switch -c "$TMP_BRANCH" "$TARGET_SHA"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if grep -qx "$sha" "$RUNNER_TEMP/already_applied"; then
              echo "Skipping patch-equivalent commit: $sha"
              continue
            fi

            echo "Building selected history: $sha"

            parent_count="$(
              git rev-list --parents -n 1 "$sha" \
              | awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              echo "Merge commit detected."
              echo "Using mainline parent 1."

              if ! git cherry-pick \
                --no-edit \
                --mainline 1 \
                --empty=stop \
                "$sha"; then

                echo "::error::Cannot apply merge commit: $sha"

                git cherry-pick --abort || true

                exit 1
              fi

            else

              if ! git cherry-pick \
                --no-edit \
                --empty=stop \
                "$sha"; then

                echo "::error::Cannot apply commit: $sha"

                git cherry-pick --abort || true

                exit 1
              fi

            fi

          done < "$RUNNER_TEMP/selected_commits"

          SELECTED_HEAD="$(git rev-parse HEAD)"

          if [[ "$SELECTED_HEAD" == "$TARGET_SHA" ]]; then
            echo "::error::Selected history produced no changes."
            exit 1
          fi

          git switch --detach "$TARGET_SHA"

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SELECTED_HEAD"

          else

            GIT_MERGE_AUTOEDIT=no \
              git merge \
              --no-ff \
              --no-edit \
              "$SELECTED_HEAD"

          fi

      # ============================================================
      # APPLY PATCH
      # ============================================================

      - name: Execute apply-patch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'apply-patch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git apply --check "$PATCH_FILE"

          if ! git apply --3way "$PATCH_FILE"; then

            echo "::error::Patch application failed."

            git status --short
            git reset --hard "$TARGET_SHA"

            exit 1
          fi

          if git diff --quiet; then
            echo "::error::Patch produced no changes."
            exit 1
          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            FINAL_MESSAGE="$COMMIT_MESSAGE"
          else
            FINAL_MESSAGE="Apply patch: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$FINAL_MESSAGE"

      # ============================================================
      # APPLY DIFF
      # ============================================================

      - name: Execute apply-diff
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git apply --check "$PATCH_FILE"

          if ! git apply "$PATCH_FILE"; then

            echo "::error::Diff application failed."

            git status --short
            git reset --hard "$TARGET_SHA"

            exit 1
          fi

          if git diff --quiet; then
            echo "::error::Diff produced no changes."
            exit 1
          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            FINAL_MESSAGE="$COMMIT_MESSAGE"
          else
            FINAL_MESSAGE="Apply diff: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$FINAL_MESSAGE"

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Final validation
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          FINAL_SHA="$(git rev-parse HEAD)"

          echo "Initial target: $TARGET_SHA"
          echo "Final result:   $FINAL_SHA"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then
            echo "::error::Operation produced no changes."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is dirty after operation."
            git status --short
            exit 1
          fi

          if ! git cat-file -e "$FINAL_SHA^{commit}"; then
            echo "::error::Final SHA is not a valid commit."
            exit 1
          fi

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ============================================================
      # REMOTE RACE CHECK
      # ============================================================

      - name: Verify remote target has not changed
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --no-progress \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_SHA="$(
            git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "Expected remote SHA: $TARGET_SHA"
          echo "Actual remote SHA:   $REMOTE_SHA"

          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Expected: $TARGET_SHA"
            echo "::error::Actual:   $REMOTE_SHA"

            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push result
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "PUSH"
          echo "========================================"

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          else

            git push \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          fi

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply commits"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`$TARGET_SHA\` |"
            echo "| Source | \`${SOURCE_BRANCH:-<none>}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-<none>}\` |"
            echo "| Merge base | \`${MERGE_BASE:-<none>}\` |"
            echo "| Exclude mode | \`$EXCLUDE_COMMITS\` |"
            echo "| Input commits | \`$INPUT_COMMIT_COUNT\` |"
            echo "| Selected commits | \`${SELECTED_COMMIT_COUNT:-0}\` |"
            echo "| Merge commits | \`${MERGE_COMMIT_COUNT:-0}\` |"
            echo "| Patch-equivalent | \`${PATCH_EQUIVALENT_COUNT:-0}\` |"
            echo "| Custom message | \`${COMMIT_MESSAGE:-<auto>}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Final SHA | \`${FINAL_SHA:-<not created>}\` |"
            echo
            echo "### Selected commits"
            echo

            if [[ -s "$RUNNER_TEMP/selected_commits" ]]; then

              while IFS= read -r sha; do
                echo "- \`$sha\` — $(git log -1 --format='%s' "$sha" 2>/dev/null || echo 'unknown')"
              done < "$RUNNER_TEMP/selected_commits"

            else
              echo "_none_"
            fi

          } >> "$GITHUB_STEP_SUMMARY"
