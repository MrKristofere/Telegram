name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:

      strategy:
        description: "How changes should be applied"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch. Optional when commits are provided"
        required: false
        type: string

      commits:
        description: "Commit SHA(s), separated by spaces or new lines"
        required: false
        type: string

      exclude_commits:
        description: "Use source branch but exclude the specified commits"
        required: false
        default: false
        type: boolean

      patch_file:
        description: "Repository-relative .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom commit message"
        required: false
        type: string

      dry_run:
        description: "Validate and show planned operation without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-commits-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:

  apply:
    runs-on: ubuntu-latest

    env:
      STRATEGY: ${{ inputs.strategy }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false

          # Do not let local Git configuration change workflow semantics.
          git config rebase.autoStash false
          git config rebase.autoSquash false
          git config pull.rebase false

      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUT VALIDATION"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected|merge-branch|rebase-branch|apply-patch|apply-diff)
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          [[ -n "$TARGET_BRANCH" ]] || {
            echo "::error::target_branch is required"
            exit 1
          }

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1 || {
            echo "::error::Invalid target branch: $TARGET_BRANCH"
            exit 1
          }

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null 2>&1 || {
              echo "::error::Invalid source branch: $SOURCE_BRANCH"
              exit 1
            }
          fi

          # --------------------------------------------------------
          # Patch / diff
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "apply-patch" || "$STRATEGY" == "apply-diff" ]]; then

            [[ -n "$PATCH_FILE" ]] || {
              echo "::error::patch_file is required for $STRATEGY"
              exit 1
            }

          elif [[ -n "$PATCH_FILE" ]]; then

            echo "::error::patch_file is only valid for apply-patch/apply-diff"
            exit 1

          fi

          # --------------------------------------------------------
          # Branch strategies
          # --------------------------------------------------------

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              [[ -n "$SOURCE_BRANCH" ]] || {
                echo "::error::$STRATEGY requires source_branch"
                exit 1
              }

              ;;

          esac

          # --------------------------------------------------------
          # Selective strategies
          # --------------------------------------------------------

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
                echo "::error::$STRATEGY requires source_branch or commits"
                exit 1
              fi

              ;;

          esac

          # --------------------------------------------------------
          # Exclusion mode
          # --------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] || {
              echo "::error::exclude_commits=true requires source_branch"
              exit 1
            }

            [[ -n "$COMMITS_INPUT" ]] || {
              echo "::error::exclude_commits=true requires commits"
              exit 1
            }

          fi

          # --------------------------------------------------------
          # commit_message
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            case "$STRATEGY" in
              rebase-branch)
                echo "::error::commit_message is not supported for rebase-branch"
                exit 1
                ;;
            esac

          fi

          echo "Inputs are valid."

      # ============================================================
      # FETCH TARGET
      #
      # Only target tip is fetched here.
      #
      # This is intentionally NOT fetch-depth: 0.
      # ============================================================

      - name: Fetch target branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(
            git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target branch: $TARGET_BRANCH"
          echo "Target SHA:    $TARGET_SHA"

      # ============================================================
      # FETCH SOURCE
      #
      # Only needed when source_branch is actually supplied.
      # ============================================================

      - name: Fetch source branch
        if: ${{ env.SOURCE_BRANCH != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(
            git rev-parse "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
          )"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Source SHA:    $SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      #
      # Only requested SHA objects are fetched.
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ env.COMMITS_INPUT != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_raw"
          touch "$RUNNER_TEMP/input_raw"

          printf '%s\n' "$COMMITS_INPUT" |
            tr ' ' '\n' |
            sed '/^[[:space:]]*$/d' \
            > "$RUNNER_TEMP/input_raw"

          while IFS= read -r value; do

            [[ "$value" =~ ^[0-9a-fA-F]{7,64}$ ]] || {
              echo "::error::Invalid commit SHA: $value"
              exit 1
            }

            if ! git cat-file -e "$value^{commit}" 2>/dev/null; then

              echo "Fetching commit: $value"

              git fetch \
                --no-tags \
                --filter=blob:none \
                origin \
                "$value"

            fi

            git rev-parse "$value^{commit}" >/dev/null || {
              echo "::error::Unable to resolve commit: $value"
              exit 1
            }

          done < "$RUNNER_TEMP/input_raw"

      # ============================================================
      # NORMALIZE EXPLICIT COMMITS
      #
      # Duplicate SHA values are removed here.
      # ============================================================

      - name: Normalize commits
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_commits"
          touch "$RUNNER_TEMP/input_commits"

          if [[ ! -s "$RUNNER_TEMP/input_raw" ]]; then

            echo "INPUT_COUNT=0" >> "$GITHUB_ENV"
            exit 0

          fi

          while IFS= read -r value; do

            sha="$(
              git rev-parse "$value^{commit}"
            )"

            printf '%s\n' "$sha"

          done < "$RUNNER_TEMP/input_raw" |
            awk '!seen[$0]++' \
            > "$RUNNER_TEMP/input_commits"

          INPUT_COUNT="$(
            wc -l < "$RUNNER_TEMP/input_commits" |
            tr -d ' '
          )"

          echo "INPUT_COUNT=$INPUT_COUNT" >> "$GITHUB_ENV"

          echo "Unique explicit commits: $INPUT_COUNT"

      # ============================================================
      # BUILD SOURCE RANGE
      #
      # This is the only place where source/target history needs
      # to be traversed.
      #
      # It is NOT executed for explicit-commit-only operations.
      # ============================================================

      - name: Build source range
        if: ${{ env.SOURCE_SHA != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Calculating merge base..."

          mapfile -t BASES < <(
            git merge-base --all "$TARGET_SHA" "$SOURCE_SHA"
          )

          if (( ${#BASES[@]} == 0 )); then

            echo "::error::Target and source have no common ancestor."
            exit 1

          fi

          if (( ${#BASES[@]} > 1 )); then

            echo "::error::Multiple merge bases detected."
            echo "::error::Workflow refuses to guess the correct history."

            printf '%s\n' "${BASES[@]}"

            exit 1

          fi

          MERGE_BASE="${BASES[0]}"

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          git rev-list \
            --topo-order \
            --reverse \
            "$MERGE_BASE..$SOURCE_SHA" \
            > "$RUNNER_TEMP/source_history"

          SOURCE_COUNT="$(
            wc -l < "$RUNNER_TEMP/source_history" |
            tr -d ' '
          )"

          echo "SOURCE_COUNT=$SOURCE_COUNT" >> "$GITHUB_ENV"

          echo "Merge base:    $MERGE_BASE"
          echo "Source commits: $SOURCE_COUNT"

      # ============================================================
      # BUILD SELECTION
      # ============================================================

      - name: Build selection plan
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/selected"
          touch "$RUNNER_TEMP/selected"

          case "$STRATEGY" in

            apply-patch|apply-diff)

              ;;

            merge-branch|rebase-branch)

              cp \
                "$RUNNER_TEMP/source_history" \
                "$RUNNER_TEMP/selected"

              ;;

            cherry-pick|squash|merge-selected)

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                # --------------------------------------------------
                # Source branch MINUS explicitly supplied commits.
                # --------------------------------------------------

                awk '
                  NR == FNR {
                    excluded[$1] = 1
                    next
                  }

                  !excluded[$1] {
                    print $1
                  }
                ' \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/source_history" \
                  > "$RUNNER_TEMP/selected"

              elif [[ -n "$COMMITS_INPUT" && -n "$SOURCE_BRANCH" ]]; then

                # --------------------------------------------------
                # Explicit commits + source branch:
                #
                # use source topology as the canonical order,
                # regardless of the order entered by the user.
                # --------------------------------------------------

                awk '
                  NR == FNR {
                    wanted[$1] = 1
                    next
                  }

                  wanted[$1] {
                    print $1
                  }
                ' \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/source_history" \
                  > "$RUNNER_TEMP/selected"

                # --------------------------------------------------
                # Safety:
                # every explicitly requested SHA must exist in
                # source history when source_branch is provided.
                # --------------------------------------------------

                sort -u \
                  "$RUNNER_TEMP/input_commits" \
                  > "$RUNNER_TEMP/input_sorted"

                sort -u \
                  "$RUNNER_TEMP/selected" \
                  > "$RUNNER_TEMP/selected_sorted"

                MISSING="$(
                  comm \
                    -23 \
                    "$RUNNER_TEMP/input_sorted" \
                    "$RUNNER_TEMP/selected_sorted"
                )"

                if [[ -n "$MISSING" ]]; then

                  echo "::error::Some explicitly selected commits are not reachable from source_branch:"
                  echo "$MISSING"

                  exit 1

                fi

              elif [[ -n "$COMMITS_INPUT" ]]; then

                # --------------------------------------------------
                # No source branch:
                # preserve explicit input order.
                #
                # Duplicate SHAs have already been removed.
                # --------------------------------------------------

                cp \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/selected"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/selected"

              fi

              ;;

          esac

          # --------------------------------------------------------
          # Final duplicate protection.
          # --------------------------------------------------------

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/selected.unique"

          mv \
            "$RUNNER_TEMP/selected.unique" \
            "$RUNNER_TEMP/selected"

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected" |
            tr -d ' '
          )"

          echo "SELECTED_COUNT=$SELECTED_COUNT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "SELECTION PLAN"
          echo "========================================"

          echo "Strategy: $STRATEGY"
          echo "Target:   $TARGET_BRANCH"
          echo "Source:   ${SOURCE_BRANCH:-<none>}"
          echo "Exclude:  $EXCLUDE_COMMITS"
          echo "Selected: $SELECTED_COUNT"
          echo

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            echo "$sha"
            echo "  $(git log -1 --format='%s' "$sha")"

          done < "$RUNNER_TEMP/selected"

      # ============================================================
      # REMOVE EXACT ANCESTORS
      #
      # IMPORTANT:
      # This only checks selected commits.
      #
      # There is NO target-wide patch-id scan.
      # ============================================================

      - name: Remove commits already in target
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/already_applied"
          touch "$RUNNER_TEMP/already_applied"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            if git merge-base --is-ancestor "$sha" "$TARGET_SHA" 2>/dev/null; then

              echo "$sha" >> "$RUNNER_TEMP/already_applied"

              echo "Already present in target: $sha"

            fi

          done < "$RUNNER_TEMP/selected"

          sort -u \
            "$RUNNER_TEMP/already_applied" \
            -o "$RUNNER_TEMP/already_applied"

          if [[ -s "$RUNNER_TEMP/already_applied" ]]; then

            grep -vxFf \
              "$RUNNER_TEMP/already_applied" \
              "$RUNNER_TEMP/selected" \
              > "$RUNNER_TEMP/executable" || true

          else

            cp \
              "$RUNNER_TEMP/selected" \
              "$RUNNER_TEMP/executable"

          fi

          EXECUTABLE_COUNT="$(
            wc -l < "$RUNNER_TEMP/executable" |
            tr -d ' '
          )"

          ALREADY_COUNT="$(
            wc -l < "$RUNNER_TEMP/already_applied" |
            tr -d ' '
          )"

          echo "EXECUTABLE_COUNT=$EXECUTABLE_COUNT" >> "$GITHUB_ENV"
          echo "ALREADY_COUNT=$ALREADY_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Already in target: $ALREADY_COUNT"
          echo "To process:       $EXECUTABLE_COUNT"

      # ============================================================
      # DETECT MERGE COMMITS
      # ============================================================

      - name: Analyze selected merge commits
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/merge_commits"
          touch "$RUNNER_TEMP/merge_commits"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              printf '%s\t%s\n' \
                "$sha" \
                "$parent_count" \
                >> "$RUNNER_TEMP/merge_commits"

            fi

          done < "$RUNNER_TEMP/executable"

          MERGE_COUNT="$(
            wc -l < "$RUNNER_TEMP/merge_commits" |
            tr -d ' '
          )"

          echo "MERGE_COUNT=$MERGE_COUNT" >> "$GITHUB_ENV"

          echo "Merge commits selected: $MERGE_COUNT"

      # ============================================================
      # AUTOMATIC MAINLINE RESOLUTION
      #
      # No user input.
      #
      # For each merge commit:
      #
      # 1. If exactly one parent is an ancestor of target,
      #    that parent is the mainline.
      #
      # 2. Otherwise, if source branch is available and exactly one
      #    parent is an ancestor of merge-base, use it.
      #
      # 3. Otherwise stop safely.
      #
      # We NEVER guess.
      # ============================================================

      - name: Resolve merge parents
        if: ${{ env.MERGE_COUNT != '0' && (env.STRATEGY == 'squash' || env.STRATEGY == 'merge-selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/merge_mainlines"
          touch "$RUNNER_TEMP/merge_mainlines"

          while IFS=$'\t' read -r sha parent_count; do

            [[ -n "$sha" ]] || continue

            mapfile -t PARENTS < <(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              cut -d' ' -f2-
            )

            TARGET_MATCHES=()

            for i in "${!PARENTS[@]}"; do

              parent="${PARENTS[$i]}"

              if git merge-base \
                --is-ancestor \
                "$parent" \
                "$TARGET_SHA" \
                2>/dev/null; then

                TARGET_MATCHES+=("$((i + 1))")

              fi

            done

            if (( ${#TARGET_MATCHES[@]} == 1 )); then

              MAINLINE="${TARGET_MATCHES[0]}"

            else

              BASE_MATCHES=()

              if [[ -n "${MERGE_BASE:-}" ]]; then

                for i in "${!PARENTS[@]}"; do

                  parent="${PARENTS[$i]}"

                  if git merge-base \
                    --is-ancestor \
                    "$parent" \
                    "$MERGE_BASE" \
                    2>/dev/null; then

                    BASE_MATCHES+=("$((i + 1))")

                  fi

                done

              fi

              if (( ${#BASE_MATCHES[@]} == 1 )); then

                MAINLINE="${BASE_MATCHES[0]}"

              else

                echo "::error::Cannot safely determine mainline for merge commit."
                echo "::error::Merge commit: $sha"

                echo
                echo "Parents:"

                for i in "${!PARENTS[@]}"; do

                  parent="${PARENTS[$i]}"

                  echo
                  echo "Parent $((i + 1)): $parent"
                  echo "Subject: $(git log -1 --format='%s' "$parent")"

                done

                echo
                echo "The workflow refuses to guess."

                exit 1

              fi

            fi

            printf '%s\t%s\n' \
              "$sha" \
              "$MAINLINE" \
              >> "$RUNNER_TEMP/merge_mainlines"

            echo "Merge:    $sha"
            echo "Mainline: $MAINLINE"

          done < "$RUNNER_TEMP/merge_commits"

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Dry run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:          $STRATEGY"
          echo "Target branch:     $TARGET_BRANCH"
          echo "Target SHA:        $TARGET_SHA"
          echo "Source branch:     ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:        ${SOURCE_SHA:-<none>}"
          echo "Merge base:        ${MERGE_BASE:-<none>}"
          echo "Exclude:           $EXCLUDE_COMMITS"
          echo "Input commits:     ${INPUT_COUNT:-0}"
          echo "Selected commits:  ${SELECTED_COUNT:-0}"
          echo "Already in target: ${ALREADY_COUNT:-0}"
          echo "To process:        ${EXECUTABLE_COUNT:-0}"
          echo "Merge commits:     ${MERGE_COUNT:-0}"
          echo "Patch:             ${PATCH_FILE:-<none>}"
          echo "Message:           ${COMMIT_MESSAGE:-<automatic>}"
          echo
          echo "Planned operation:"
          echo

          case "$STRATEGY" in

            cherry-pick)
              echo "Replay selected commits individually."
              ;;

            squash)
              echo "Apply selected commits without creating intermediate commits."
              echo "Create one final commit."
              ;;

            merge-selected)
              echo "Replay selected commits into a temporary branch."
              echo "Merge that branch into target."
              ;;

            merge-branch)
              echo "Merge source branch into target."
              ;;

            rebase-branch)
              echo "Rebase source branch onto target."
              ;;

            apply-patch)
              echo "Apply patch file."
              ;;

            apply-diff)
              echo "Apply diff file."
              ;;

          esac

          echo
          echo "Selected commits:"

          if [[ -s "$RUNNER_TEMP/executable" ]]; then

            while IFS= read -r sha; do

              echo "- $sha"
              echo "  $(git log -1 --format='%s' "$sha")"

            done < "$RUNNER_TEMP/executable"

          else

            echo "- none"

          fi

          if [[ -s "$RUNNER_TEMP/merge_mainlines" ]]; then

            echo
            echo "Automatically resolved merge parents:"

            while IFS=$'\t' read -r sha parent; do

              echo "- $sha -> parent $parent"

            done < "$RUNNER_TEMP/merge_mainlines"

          fi

          echo
          echo "NO PUSH WILL BE PERFORMED."

      # ============================================================
      # STOP DRY RUN
      # ============================================================

      - name: Stop after dry run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "Dry run completed successfully."
          exit 0

      # ============================================================
      # PREPARE TARGET
      # ============================================================

      - name: Prepare target
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch --detach "$TARGET_SHA"

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1

          fi

      # ============================================================
      # CHERRY-PICK
      # ============================================================

      - name: Execute cherry-pick
        if: ${{ env.STRATEGY == 'cherry-pick' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain to cherry-pick."
            exit 1

          fi

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected" |
            tr -d ' '
          )"

          while IFS= read -r sha; do

            echo
            echo "Cherry-pick: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            # ------------------------------------------------------
            # Initially empty commit:
            # there is nothing to replay.
            # ------------------------------------------------------

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count == 1 )); then

              parent="$(
                git rev-list \
                  --parents \
                  -n 1 \
                  "$sha" |
                awk '{print $2}'
              )"

              if git diff-tree \
                --quiet \
                "$parent" \
                "$sha"; then

                echo "Skipping initially empty commit: $sha"
                continue

              fi

            fi

            # ------------------------------------------------------
            # Exactly ONE selected commit + custom message.
            # ------------------------------------------------------

            if [[ "$SELECTED_COUNT" -eq 1 && -n "$COMMIT_MESSAGE" ]]; then

              if ! git cherry-pick \
                --no-commit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

              if git diff --cached --quiet; then

                git reset --hard "$TARGET_SHA"

                echo "::error::Selected commit produced no changes: $sha"
                exit 1

              fi

              git commit \
                -m "$COMMIT_MESSAGE"

            else

              if ! git cherry-pick \
                --no-edit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

      # ============================================================
      # SQUASH
      # ============================================================

      - name: Execute squash
        if: ${{ env.STRATEGY == 'squash' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain for squash."
            exit 1

          fi

          BEFORE="$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Squash apply: $sha"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            # ------------------------------------------------------
            # Initially empty ordinary commit.
            # ------------------------------------------------------

            if (( parent_count == 1 )); then

              parent="$(
                git rev-list \
                  --parents \
                  -n 1 \
                  "$sha" |
                awk '{print $2}'
              )"

              if git diff-tree \
                --quiet \
                "$parent" \
                "$sha"; then

                echo "Skipping empty commit: $sha"
                continue

              fi

            fi

            # ------------------------------------------------------
            # Ordinary commit
            # ------------------------------------------------------

            if (( parent_count == 1 )); then

              if ! git cherry-pick \
                --no-commit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BEFORE"

                echo "::error::Failed to apply commit: $sha"
                exit 1

              fi

            # ------------------------------------------------------
            # Merge commit
            # ------------------------------------------------------

            else

              MAINLINE="$(
                awk -F '\t' \
                  -v sha="$sha" \
                  '$1 == sha {print $2}' \
                  "$RUNNER_TEMP/merge_mainlines"
              )"

              [[ -n "$MAINLINE" ]] || {
                echo "::error::No automatic mainline was resolved for $sha"
                exit 1
              }

              if ! git cherry-pick \
                --no-commit \
                --mainline "$MAINLINE" \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BEFORE"

                echo "::error::Failed to apply merge commit: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          # --------------------------------------------------------
          # Nothing accumulated.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            git reset --hard "$BEFORE"

            echo "::error::Squash produced no changes."
            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            MESSAGE="$COMMIT_MESSAGE"

          else

            MESSAGE="Squash selected commits from ${SOURCE_BRANCH:-source}"

          fi

          git commit \
            -m "$MESSAGE"

      # ============================================================
      # MERGE SELECTED
      # ============================================================

      - name: Execute merge-selected
        if: ${{ env.STRATEGY == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/executable" ]]; then

            echo "::error::No commits remain for merge-selected."
            exit 1

          fi

          TEMP_BRANCH="workflow-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          git switch -c "$TEMP_BRANCH" "$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Replay selected: $sha"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" |
              awk '{print NF-1}'
            )"

            if (( parent_count == 1 )); then

              parent="$(
                git rev-list \
                  --parents \
                  -n 1 \
                  "$sha" |
                awk '{print $2}'
              )"

              if git diff-tree \
                --quiet \
                "$parent" \
                "$sha"; then

                echo "Skipping empty commit: $sha"
                continue

              fi

              if ! git cherry-pick \
                --no-edit \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay $sha"
                exit 1

              fi

            else

              MAINLINE="$(
                awk -F '\t' \
                  -v sha="$sha" \
                  '$1 == sha {print $2}' \
                  "$RUNNER_TEMP/merge_mainlines"
              )"

              [[ -n "$MAINLINE" ]] || {
                echo "::error::No automatic mainline was resolved for $sha"
                exit 1
              }

              if ! git cherry-pick \
                --no-edit \
                --mainline "$MAINLINE" \
                --empty=drop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay merge commit $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          SELECTED_HEAD="$(
            git rev-parse HEAD
          )"

          if [[ "$SELECTED_HEAD" == "$TARGET_SHA" ]]; then

            echo "::error::Selected commits produced no changes."
            exit 1

          fi

          git switch --detach "$TARGET_SHA"

          # --------------------------------------------------------
          # Preflight merge without modifying index/worktree.
          # --------------------------------------------------------

          if ! git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SELECTED_HEAD" \
            > "$RUNNER_TEMP/merge_tree"; then

            echo "::error::Selected changes cannot be merged cleanly."
            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SELECTED_HEAD"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SELECTED_HEAD"

          fi

      # ============================================================
      # MERGE BRANCH
      # ============================================================

      - name: Execute merge-branch
        if: ${{ env.STRATEGY == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git merge-base \
            --is-ancestor \
            "$SOURCE_SHA" \
            "$TARGET_SHA"; then

            echo "::error::Source branch is already contained in target."
            exit 1

          fi

          # --------------------------------------------------------
          # Preflight merge.
          # --------------------------------------------------------

          if ! git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SOURCE_SHA" \
            > "$RUNNER_TEMP/merge_tree"; then

            echo "::error::Source branch cannot be merged cleanly."
            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SOURCE_SHA"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SOURCE_SHA"

          fi

      # ============================================================
      # REBASE BRANCH
      #
      # Real git rebase.
      #
      # --rebase-merges preserves merge topology instead of
      # silently flattening it.
      # ============================================================

      - name: Execute rebase-branch
        if: ${{ env.STRATEGY == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$SOURCE_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Source and target point to the same commit."
            exit 1

          fi

          # --------------------------------------------------------
          # Start from source.
          # --------------------------------------------------------

          git switch --detach "$SOURCE_SHA"

          # --------------------------------------------------------
          # Rebase source history onto target.
          #
          # Topology is preserved.
          # --------------------------------------------------------

          if ! git rebase \
            --rebase-merges \
            --empty=drop \
            --onto "$TARGET_SHA" \
            "$MERGE_BASE" \
            "$SOURCE_SHA"; then

            git rebase --abort || true

            echo "::error::Rebase failed."
            exit 1

          fi

          REBASED_SHA="$(
            git rev-parse HEAD
          )"

          echo "REBASED_SHA=$REBASED_SHA" >> "$GITHUB_ENV"

          if [[ "$REBASED_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Rebase produced no changes."
            exit 1

          fi

      # ============================================================
      # APPLY PATCH
      # ============================================================

      - name: Execute patch
        if: ${{ env.STRATEGY == 'apply-patch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f "$PATCH_FILE" ]] || {
            echo "::error::Patch file does not exist: $PATCH_FILE"
            exit 1
          }

          git apply \
            --check \
            --3way \
            "$PATCH_FILE"

          if ! git apply \
            --3way \
            "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply patch: $(basename "$PATCH_FILE")"
          fi

          git commit \
            -m "$MESSAGE"

      # ============================================================
      # APPLY DIFF
      # ============================================================

      - name: Execute diff
        if: ${{ env.STRATEGY == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f "$PATCH_FILE" ]] || {
            echo "::error::Diff file does not exist: $PATCH_FILE"
            exit 1
          }

          git apply \
            --check \
            "$PATCH_FILE"

          if ! git apply "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply diff: $(basename "$PATCH_FILE")"
          fi

          git commit \
            -m "$MESSAGE"

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Final validation
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(
            git rev-parse HEAD
          )"

          echo "Original target: $TARGET_SHA"
          echo "Final SHA:       $FINAL_SHA"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no changes."
            exit 1

          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is dirty."
            git status --short

            exit 1

          fi

          git cat-file -e "$FINAL_SHA^{commit}" || {
            echo "::error::Final SHA is invalid."
            exit 1
          }

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ============================================================
      # REMOTE RACE PROTECTION
      #
      # Never overwrite target if somebody changed it while the
      # workflow was running.
      # ============================================================

      - name: Verify target has not changed
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          REMOTE_SHA="$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "Original target: $TARGET_SHA"
          echo "Remote target:   $REMOTE_SHA"

          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed during workflow execution."
            echo "::error::Push cancelled."
            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            rebase-branch)

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply commits"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-unknown}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-<none>}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-<none>}\` |"
            echo "| Merge base | \`${MERGE_BASE:-<none>}\` |"
            echo "| Exclude | \`$EXCLUDE_COMMITS\` |"
            echo "| Input commits | \`${INPUT_COUNT:-0}\` |"
            echo "| Selected | \`${SELECTED_COUNT:-0}\` |"
            echo "| Already in target | \`${ALREADY_COUNT:-0}\` |"
            echo "| Executed | \`${EXECUTABLE_COUNT:-0}\` |"
            echo "| Merge commits | \`${MERGE_COUNT:-0}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Final SHA | \`${FINAL_SHA:-<none>}\` |"
            echo
            echo "### Selected commits"
            echo

            if [[ -s "$RUNNER_TEMP/selected" ]]; then

              while IFS= read -r sha; do

                echo "- \`$sha\` — $(git log -1 --format='%s' "$sha" 2>/dev/null || echo 'unknown')"

              done < "$RUNNER_TEMP/selected"

            else

              echo "_none_"

            fi

          } >> "$GITHUB_STEP_SUMMARY"
