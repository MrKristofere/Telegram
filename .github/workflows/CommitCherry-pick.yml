name: Apply Commit changes

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA(s), separated by spaces. With exclude_commits enabled, these SHA(s) are excluded from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How changes should be applied"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Optional for cherry-pick/squash/merge-selected."
        required: false
        type: string

      exclude_commits:
        description: "With source_branch: treat commits as SHA(s) to EXCLUDE instead of include."
        required: false
        type: boolean
        default: false

      patch_file:
        description: "Path to .patch or .diff file inside repository"
        required: false
        type: string

      commit_message:
        description: "Custom commit / merge message. Optional."
        required: false
        type: string

      dry_run:
        description: "Validate and show the planned operation without pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      STRATEGY: ${{ inputs.strategy }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # FAST INITIAL CHECKOUT
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # GIT CONFIGURATION
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config core.quotePath false
          git config rerere.enabled true

          git --version

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Strategy:        $STRATEGY"
          echo "Target branch:   $TARGET_BRANCH"
          echo "Source branch:   ${SOURCE_BRANCH:-<none>}"
          echo "Commits:         ${COMMITS_INPUT:-<none>}"
          echo "Exclude:         $EXCLUDE_COMMITS"
          echo "Patch:           ${PATCH_FILE:-<none>}"
          echo "Dry run:         $DRY_RUN"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is empty."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::target_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::source_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

          if [[ "$EXCLUDE_COMMITS" == "true" && -z "$SOURCE_BRANCH" ]]; then
            echo "::error::exclude_commits requires source_branch."
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)
              if [[ -z "$COMMITS_INPUT" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY requires commits or source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with $STRATEGY."
                exit 1
              fi
              ;;

            merge-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::merge-branch does not use commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits is not supported with merge-branch."
                echo "::error::Use merge-selected for selective branch merging."
                exit 1
              fi
              ;;

            rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::rebase-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::rebase-branch does not use commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits is not supported with rebase-branch."
                echo "::error::Use merge-selected or squash for selective application."
                exit 1
              fi
              ;;

            apply-patch|apply-diff)
              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::$STRATEGY requires patch_file."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" || -n "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY does not use commits or source_branch."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits cannot be used with patch/diff."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # ============================================================
      # CLEAN WORKTREE
      # ============================================================

      - name: Verify clean worktree
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      # ============================================================
      # SNAPSHOT TARGET
      #
      # IMPORTANT:
      # This SHA is the exact target version against which the whole
      # operation will be calculated.
      # ============================================================

      - name: Snapshot target branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target snapshot:"
          echo "$TARGET_SHA"

          git reset --hard "$TARGET_SHA"

      # ============================================================
      # SNAPSHOT SOURCE BRANCH
      #
      # IMPORTANT:
      # Source is also frozen to one SHA.
      #
      # If source branch changes while workflow is running,
      # those new commits are NOT silently included.
      # ============================================================

      - name: Snapshot source branch
        if: ${{ inputs.source_branch != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --depth=1 \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source snapshot:"
          echo "$SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Invalid commit SHA: $commit"
              exit 1
            fi

            git fetch \
              --no-tags \
              origin \
              "$commit"

          done < <(
            printf '%s\n' "$COMMITS_INPUT" |
            tr ' ' '\n'
          )

      # ============================================================
      # RESOLVE MERGE BASE
      #
      # The repository starts shallow.
      # History is deepened only until the actual merge-base exists.
      # ============================================================

      - name: Resolve merge base
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_DEPTH=1048576
          DEEPEN=32
          ATTEMPTS=0

          while true; do

            ATTEMPTS=$((ATTEMPTS + 1))

            echo ""
            echo "Merge-base attempt: $ATTEMPTS"
            echo "Deepen: $DEEPEN"

            if MERGE_BASE="$(
              git merge-base \
                "$TARGET_SHA" \
                "$SOURCE_SHA" \
                2>/dev/null
            )"; then

              echo ""
              echo "MERGE_BASE=$MERGE_BASE"

              echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

              break
            fi

            if [[ "$DEEPEN" -ge "$MAX_DEPTH" ]]; then
              echo "::error::Unable to find merge-base."
              echo "::error::History limit reached."
              exit 1
            fi

            git fetch \
              --no-tags \
              --deepen="$DEEPEN" \
              origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
              "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            DEEPEN=$((DEEPEN * 2))

          done

      # ============================================================
      # RESOLVE SELECTED COMMITS
      # ============================================================

      - name: Resolve commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ALL_SOURCE="/tmp/all_source_commits.txt"
          INPUT_COMMITS="/tmp/input_commits.txt"
          CANDIDATES="/tmp/candidates.txt"
          FINAL="/tmp/final_commits.txt"
          SORTED="/tmp/sorted_commits.txt"

          : > "$ALL_SOURCE"
          : > "$INPUT_COMMITS"
          : > "$CANDIDATES"
          : > "$FINAL"
          : > "$SORTED"

          # ==========================================================
          # SOURCE BRANCH MODE
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            echo "Source branch mode."

            git rev-list \
              --right-only \
              --cherry-pick \
              --no-merges \
              --reverse \
              "$TARGET_SHA...$SOURCE_SHA" \
              > "$ALL_SOURCE"

            echo ""
            echo "All applicable source commits:"
            cat "$ALL_SOURCE" || true

            # --------------------------------------------------------
            # Explicit SHA list
            # --------------------------------------------------------

            if [[ -n "$COMMITS_INPUT" ]]; then

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                  echo "::error::Invalid commit SHA: $commit"
                  exit 1
                fi

                if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                  echo "::error::Commit not found: $commit"
                  exit 1
                fi

                FULL_SHA="$(git rev-parse "$commit^{commit}")"

                if ! git merge-base \
                  --is-ancestor \
                  "$FULL_SHA" \
                  "$SOURCE_SHA" \
                  2>/dev/null; then

                  echo "::error::Commit is not part of source branch:"
                  echo "::error::$FULL_SHA"
                  echo "::error::Source snapshot: $SOURCE_SHA"

                  exit 1
                fi

                echo "$FULL_SHA" >> "$INPUT_COMMITS"

              done < <(
                printf '%s\n' "$COMMITS_INPUT" |
                tr ' ' '\n'
              )

              # Remove duplicate SHA(s).
              sort -u "$INPUT_COMMITS" -o "$INPUT_COMMITS"

              # ------------------------------------------------------
              # EXCLUSION MODE
              # ------------------------------------------------------

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                echo ""
                echo "Exclusion mode."

                cp "$ALL_SOURCE" "$CANDIDATES"

                while IFS= read -r excluded; do

                  [[ -z "$excluded" ]] && continue

                  if grep -Fxq "$excluded" "$CANDIDATES"; then

                    echo "Excluding:"
                    echo "$excluded"

                    grep -Fxv \
                      "$excluded" \
                      "$CANDIDATES" \
                      > "${CANDIDATES}.tmp"

                    mv \
                      "${CANDIDATES}.tmp" \
                      "$CANDIDATES"

                  else

                    echo "::warning::Excluded commit is not in the applicable source set:"
                    echo "::warning::$excluded"

                  fi

                done < "$INPUT_COMMITS"

              # ------------------------------------------------------
              # INCLUSION MODE
              # ------------------------------------------------------

              else

                echo ""
                echo "Inclusion mode."

                cp "$INPUT_COMMITS" "$CANDIDATES"

              fi

            # --------------------------------------------------------
            # No SHA:
            #
            # Use every applicable source commit.
            # --------------------------------------------------------

            else

              echo ""
              echo "No SHA supplied."
              echo "Using all applicable source commits."

              cp "$ALL_SOURCE" "$CANDIDATES"

            fi

          # ==========================================================
          # EXPLICIT SHA MODE
          # ==========================================================

          else

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "::error::exclude_commits requires source_branch."
              exit 1
            fi

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$CANDIDATES"

            done < <(
              printf '%s\n' "$COMMITS_INPUT" |
              tr ' ' '\n'
            )

          fi

          # ==========================================================
          # REMOVE DUPLICATES
          # ==========================================================

          sort -u "$CANDIDATES" -o "$CANDIDATES"

          if [[ ! -s "$CANDIDATES" ]]; then
            echo "::error::No commits remain after filtering."
            exit 1
          fi

          # ==========================================================
          # REMOVE COMMITS ALREADY IN TARGET
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            PARENT_COUNT="$(
              git rev-list \
                --parents \
                -n 1 \
                "$commit" |
              awk '{print NF-1}'
            )"

            if [[ "$PARENT_COUNT" -gt 1 ]]; then

              echo "::error::Merge commit is not supported:"
              echo "::error::$commit"
              echo "::error::Select its individual commits instead."

              exit 1

            fi

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "$TARGET_SHA" \
              2>/dev/null; then

              echo "::warning::Already in target, skipping:"
              echo "::warning::$commit"

              continue

            fi

            echo "$commit" >> "$FINAL"

          done < "$CANDIDATES"

          sort -u "$FINAL" -o "$FINAL"

          if [[ ! -s "$FINAL" ]]; then
            echo "::error::No new commits remain after target filtering."
            exit 1
          fi

          # ==========================================================
          # CHRONOLOGICAL ORDER
          #
          # Author timestamp first, committer timestamp second.
          # Therefore input order is irrelevant.
          # ==========================================================

          while IFS= read -r commit; do

            AUTHOR_TS="$(git show -s --format='%at' "$commit")"
            COMMITTER_TS="$(git show -s --format='%ct' "$commit")"

            printf '%s\t%s\t%s\n' \
              "$AUTHOR_TS" \
              "$COMMITTER_TS" \
              "$commit"

          done < "$FINAL" |
            sort -n -k1,1 -k2,2 -k3,3 |
            cut -f3 |
            uniq > "$SORTED"

          if [[ ! -s "$SORTED" ]]; then
            echo "::error::Sorted commit list is empty."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "COMMITS TO APPLY"
          echo "========================================"

          while IFS= read -r commit; do
            git show \
              -s \
              --format='%aI | %H | %s' \
              "$commit"
          done < "$SORTED"

          echo "========================================"

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ============================================================
      # PATCH / DIFF VALIDATION
      # ============================================================

      - name: Validate patch or diff
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file does not exist:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch file is empty:"
            echo "$PATCH_FILE"
            exit 1
          fi

          echo "Patch file:"
          echo "$PATCH_FILE"

          if [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --stat \
              "$PATCH_FILE"

          else

            git mailinfo \
              /tmp/patch-message \
              /tmp/patch-info \
              < "$PATCH_FILE" \
              >/dev/null 2>&1 || {

                echo "::error::Invalid format-patch/mailbox file."
                exit 1
              }

          fi

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:       $STRATEGY"
          echo "Target:         $TARGET_BRANCH"
          echo "Target SHA:     $TARGET_SHA"
          echo "Source:         ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:     ${SOURCE_SHA:-<none>}"
          echo "Exclude mode:   $EXCLUDE_COMMITS"
          echo ""

          case "$STRATEGY" in

            cherry-pick)
              echo "Would cherry-pick:"
              printf '%s\n' "$COMMITS_TO_APPLY"
              ;;

            squash)
              echo "Would squash:"
              printf '%s\n' "$COMMITS_TO_APPLY"
              ;;

            merge-selected)
              echo "Would merge selected commits:"
              printf '%s\n' "$COMMITS_TO_APPLY"
              ;;

            merge-branch)
              echo "Would merge:"
              echo "$SOURCE_SHA"
              ;;

            rebase-branch)
              echo "Would rebase source snapshot:"
              echo "$SOURCE_SHA"
              echo ""
              echo "Onto target snapshot:"
              echo "$TARGET_SHA"
              echo ""
              echo "Merge base:"
              echo "$MERGE_BASE"
              ;;

            apply-patch)
              echo "Would apply patch:"
              echo "$PATCH_FILE"
              ;;

            apply-diff)
              echo "Would apply diff:"
              echo "$PATCH_FILE"
              ;;

          esac

          echo ""
          echo "No changes will be pushed."

      # ============================================================
      # APPLY
      # ============================================================

      - name: Apply changes
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            # ========================================================
            # CHERRY-PICK
            # ========================================================

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Cherry-picking: $commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Cherry-pick failed: $commit"

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  git reset --hard "$TARGET_SHA"

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            # ========================================================
            # SQUASH
            # ========================================================

            squash)

              APPLIED=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Squash-applying: $commit"

                if git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  APPLIED=$((APPLIED + 1))
                  continue

                fi

                if git diff --quiet && git diff --cached --quiet; then

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  echo "::warning::Commit produced no changes:"
                  echo "::warning::$commit"

                  continue

                fi

                echo "::error::Conflict while applying: $commit"

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                  git cherry-pick --abort
                fi

                git reset --hard "$TARGET_SHA"

                exit 1

              done <<< "$COMMITS_TO_APPLY"

              if [[ "$APPLIED" -eq 0 ]]; then
                echo "::error::Squash produced no changes."
                exit 1
              fi

              git add -A

              if git diff --cached --quiet; then
                echo "::error::Nothing to commit after squash."
                exit 1
              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"
                fi

              else

                FINAL_MESSAGE="Squash selected commits"

              fi

              git commit -m "$FINAL_MESSAGE"

              ;;

            # ========================================================
            # MERGE-SELECTED
            # ========================================================

            merge-selected)

              TEMP_BRANCH="automation/merge-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH" \
                "$TARGET_SHA"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Applying selected commit: $commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Unable to build selected branch."

                  if git rev-parse -q \
                    --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                    git cherry-pick --abort
                  fi

                  git switch "$TARGET_BRANCH" || true
                  git branch -D "$TEMP_BRANCH" || true

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              SELECTED_SHA="$(git rev-parse HEAD)"

              git switch "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Merge $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Merge selected commits from $SOURCE_BRANCH"
                fi

              else

                FINAL_MESSAGE="Merge selected commits"

              fi

              if ! git merge \
                --no-ff \
                "$SELECTED_SHA" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Selected merge failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # MERGE-BRANCH
            #
            # Uses the SNAPSHOT source SHA.
            # ========================================================

            merge-branch)

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
              fi

              if ! git merge \
                --no-ff \
                "$SOURCE_SHA" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::Branch merge failed."

                if git rev-parse -q \
                  --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                git reset --hard "$TARGET_SHA"

                exit 1
              fi

              ;;

            # ========================================================
            # REBASE-BRANCH
            #
            # IMPORTANT:
            #
            # Rebase is performed against immutable snapshots:
            #
            #   SOURCE_SHA
            #   TARGET_SHA
            #   MERGE_BASE
            #
            # It does NOT use origin/$SOURCE_BRANCH or
            # origin/$TARGET_BRANCH here.
            #
            # Therefore new commits appearing on source during this
            # workflow cannot unexpectedly enter the result.
            # ========================================================

            rebase-branch)

              TEMP_BRANCH="automation/rebase-${GITHUB_RUN_ID}"

              echo "========================================"
              echo "REBASE"
              echo "========================================"

              echo "Source snapshot:"
              echo "$SOURCE_SHA"

              echo ""
              echo "Target snapshot:"
              echo "$TARGET_SHA"

              echo ""
              echo "Merge base:"
              echo "$MERGE_BASE"

              # ------------------------------------------------------
              # Create temporary branch from EXACT source snapshot.
              # ------------------------------------------------------

              git switch \
                --create "$TEMP_BRANCH" \
                "$SOURCE_SHA"

              # ------------------------------------------------------
              # Rebase exactly the source commits after merge-base
              # onto exactly the target snapshot.
              # ------------------------------------------------------

              if ! git rebase \
                --onto "$TARGET_SHA" \
                "$MERGE_BASE" \
                "$SOURCE_SHA" \
                --empty=drop; then

                echo "::error::Rebase failed."

                echo ""
                echo "Current patch:"
                git rebase --show-current-patch || true

                echo ""
                echo "Rebase status:"
                git status --short || true

                git rebase --abort || true

                git switch "$TARGET_BRANCH" || true
                git reset --hard "$TARGET_SHA" || true

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              # ------------------------------------------------------
              # Make absolutely sure rebase is finished.
              # ------------------------------------------------------

              if git rev-parse -q \
                --verify REBASE_HEAD >/dev/null 2>&1; then

                echo "::error::Rebase is still in progress."

                git rebase --abort || true

                git switch "$TARGET_BRANCH" || true
                git reset --hard "$TARGET_SHA" || true

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              REBASED_SHA="$(git rev-parse HEAD)"

              echo ""
              echo "Rebased SHA:"
              echo "$REBASED_SHA"

              # ------------------------------------------------------
              # Ensure temporary branch actually contains changes.
              # ------------------------------------------------------

              if [[ "$REBASED_SHA" == "$TARGET_SHA" ]]; then

                echo "::error::Rebase produced no commits."
                echo "::error::All source commits may already exist in target."

                git switch "$TARGET_BRANCH"
                git reset --hard "$TARGET_SHA"

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              # ------------------------------------------------------
              # Switch back to local target branch.
              # ------------------------------------------------------

              git switch "$TARGET_BRANCH"

              # ------------------------------------------------------
              # Target must still be exactly the snapshot we started
              # from.
              # ------------------------------------------------------

              CURRENT_LOCAL_TARGET="$(git rev-parse HEAD)"

              if [[ "$CURRENT_LOCAL_TARGET" != "$TARGET_SHA" ]]; then

                echo "::error::Local target changed unexpectedly."
                echo "::error::Expected: $TARGET_SHA"
                echo "::error::Actual:   $CURRENT_LOCAL_TARGET"

                git reset --hard "$TARGET_SHA"

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              # ------------------------------------------------------
              # Fast-forward target to rebased history.
              # ------------------------------------------------------

              if ! git merge \
                --ff-only \
                "$REBASED_SHA"; then

                echo "::error::Unable to fast-forward target."

                git reset --hard "$TARGET_SHA"

                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # APPLY PATCH
            # ========================================================

            apply-patch)

              BEFORE_PATCH_SHA="$(git rev-parse HEAD)"

              if ! git am \
                --3way \
                --empty=drop \
                "$PATCH_FILE"; then

                echo "::error::git am failed."

                git am --show-current-patch=raw || true
                git am --abort || true

                git reset --hard "$TARGET_SHA"

                exit 1
              fi

              AFTER_PATCH_SHA="$(git rev-parse HEAD)"

              if [[ "$BEFORE_PATCH_SHA" == "$AFTER_PATCH_SHA" ]]; then
                echo "::error::Patch produced no new commit."
                exit 1
              fi

              ;;

            # ========================================================
            # APPLY DIFF
            # ========================================================

            apply-diff)

              # ------------------------------------------------------
              # Detect already-applied diff.
              # ------------------------------------------------------

              if git apply \
                --check \
                --reverse \
                "$PATCH_FILE" \
                >/dev/null 2>&1; then

                echo "::error::Patch appears to be already applied."
                echo "::error::Refusing to apply it twice."

                exit 1
              fi

              # ------------------------------------------------------
              # Verify forward applicability.
              # ------------------------------------------------------

              if ! git apply \
                --check \
                "$PATCH_FILE"; then

                echo "::error::Patch cannot be applied cleanly."
                exit 1
              fi

              # ------------------------------------------------------
              # Apply.
              # ------------------------------------------------------

              if ! git apply \
                --3way \
                "$PATCH_FILE"; then

                echo "::error::git apply failed."

                git reset --hard "$TARGET_SHA"

                exit 1
              fi

              git add -A

              if git diff --cached --quiet; then
                echo "::error::Patch produced no changes."

                git reset --hard "$TARGET_SHA"

                exit 1
              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                PATCH_NAME="$(basename "$PATCH_FILE")"

                FINAL_MESSAGE="Apply patch: $PATCH_NAME"

              fi

              git commit -m "$FINAL_MESSAGE"

              ;;

            *)
              echo "::error::Unsupported strategy: $STRATEGY"
              exit 1
              ;;

          esac

      # ============================================================
      # FINAL LOCAL VALIDATION
      # ============================================================

      - name: Validate final state
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved cherry-pick state."
            exit 1
          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved merge state."
            exit 1
          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved rebase state."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1
          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no new commit."
            exit 1
          fi

          echo ""
          echo "Initial target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Final HEAD:"
          echo "$FINAL_SHA"

          echo ""
          echo "Recent history:"

          git log \
            --oneline \
            --decorate \
            -10

      # ============================================================
      # REMOTE RACE CHECK
      #
      # This is especially important for rebase because it rewrites
      # target history.
      # ============================================================

      - name: Verify target has not changed
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_TARGET="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Original target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Current remote target:"
          echo "$CURRENT_REMOTE_TARGET"

          if [[ "$CURRENT_REMOTE_TARGET" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."
            echo "::error::Nothing will be overwritten."

            exit 1
          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(git rev-parse HEAD)"

          case "$STRATEGY" in

            rebase-branch)

              echo "Pushing rebased history with explicit lease."

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              echo "Pushing normal update."

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

          echo ""
          echo "Successfully pushed:"
          echo "$FINAL_SHA"

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply changes"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-}\` |"
            echo "| Exclude mode | \`$EXCLUDE_COMMITS\` |"
            echo "| Dry run | \`$DRY_RUN\` |"

            if [[ -n "${MERGE_BASE:-}" ]]; then
              echo "| Merge base | \`${MERGE_BASE}\` |"
            fi

            if git rev-parse HEAD >/dev/null 2>&1; then
              echo "| Final SHA | \`$(git rev-parse HEAD)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
