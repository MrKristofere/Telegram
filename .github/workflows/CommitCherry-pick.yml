name: Apply changes to branch

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA via Space. If empty, commits are taken from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How to apply changes"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Used when commits are empty or for merge/rebase."
        required: false
        type: string

      patch_file:
        description: "Path to .patch/.diff file in repository. Used for apply-patch/apply-diff."
        required: false
        type: string

      commit_message:
        description: "Commit/merge message. If empty, generated automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      # ===============================================================
      # CHECKOUT
      # ===============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===============================================================
      # GIT CONFIG
      # ===============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ===============================================================
      # VALIDATE INPUTS
      # ===============================================================

      - name: Validate inputs
        env:
          COMMITS: ${{ inputs.commits }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Strategy:       ${STRATEGY:-cherry-pick}"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Source branch:  ${SOURCE_BRANCH:-<none>}"
          echo "Commits:        ${COMMITS:-<none>}"
          echo "Patch file:     ${PATCH_FILE:-<none>}"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is required"
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)
              if [[ -z "$COMMITS" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::Either commits or source_branch is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            merge-branch|rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::source_branch is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            apply-patch|apply-diff)
              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::patch_file is required for strategy '$STRATEGY'"
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same"
            exit 1
          fi

      # ===============================================================
      # FETCH TARGET
      # ===============================================================

      - name: Fetch target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git fetch origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

      # ===============================================================
      # FETCH SOURCE
      # ===============================================================

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          git fetch origin \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

      # ===============================================================
      # VALIDATE PATCH
      # ===============================================================

      - name: Validate patch file
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file not found: $PATCH_FILE"
            exit 1
          fi

          echo "Patch file:"
          echo "$PATCH_FILE"

          echo ""
          echo "First lines:"
          head -n 20 "$PATCH_FILE"

      # ===============================================================
      # CHECKOUT TARGET
      # ===============================================================

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git switch --create "$TARGET_BRANCH" \
            --track "origin/$TARGET_BRANCH"

      # ===============================================================
      # RESOLVE AND SORT COMMITS
      #
      # Used by:
      #   - cherry-pick
      #   - squash
      #   - merge-selected
      #
      # If explicit SHA are supplied:
      #   use those SHA.
      #
      # If SHA are empty:
      #   use commits from source_branch that are not in target_branch.
      #
      # In both cases:
      #   sort by commit/committer date from oldest to newest.
      # ===============================================================

      - name: Resolve and sort commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        env:
          COMMITS: ${{ inputs.commits }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          INPUT_COMMITS="/tmp/input_commits.txt"
          UNIQUE_COMMITS="/tmp/unique_commits.txt"
          SORTED_COMMITS="/tmp/sorted_commits.txt"

          rm -f \
            "$INPUT_COMMITS" \
            "$UNIQUE_COMMITS" \
            "$SORTED_COMMITS"

          # -----------------------------------------------------------
          # Explicit SHAs
          # -----------------------------------------------------------

          if [[ -n "$COMMITS" ]]; then
            echo "Using explicitly selected commits."

            for commit in $COMMITS; do

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              echo "$commit" >> "$INPUT_COMMITS"
            done

          # -----------------------------------------------------------
          # Source branch
          # -----------------------------------------------------------

          elif [[ -n "$SOURCE_BRANCH" ]]; then
            echo "No explicit commits supplied."
            echo "Collecting commits from source branch."

            git rev-list \
              "origin/$TARGET_BRANCH..origin/$SOURCE_BRANCH" \
              > "$INPUT_COMMITS"

          else
            echo "::error::No commits or source_branch provided"
            exit 1
          fi

          # -----------------------------------------------------------
          # Remove duplicates
          # -----------------------------------------------------------

          sort -u "$INPUT_COMMITS" > "$UNIQUE_COMMITS"

          # -----------------------------------------------------------
          # Sort by commit date:
          #
          # oldest
          #   ↓
          # newest
          #
          # %ct = committer timestamp
          # -----------------------------------------------------------

          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue

            timestamp="$(git show -s --format='%ct' "$commit")"

            printf '%s\t%s\n' \
              "$timestamp" \
              "$commit"

          done < "$UNIQUE_COMMITS" \
            | sort -n -k1,1 -k2,2 \
            | cut -f2 \
            > "$SORTED_COMMITS"

          # -----------------------------------------------------------
          # Validate result
          # -----------------------------------------------------------

          if [[ ! -s "$SORTED_COMMITS" ]]; then
            echo "::error::No commits found to apply"
            exit 1
          fi

          # -----------------------------------------------------------
          # Show final order
          # -----------------------------------------------------------

          echo ""
          echo "Commits will be applied in chronological order:"
          echo ""

          while IFS= read -r commit; do
            timestamp="$(git show -s --format='%aI' "$commit")"
            subject="$(git show -s --format='%s' "$commit")"

            echo "$timestamp $commit $subject"
          done < "$SORTED_COMMITS"

          # -----------------------------------------------------------
          # Export to next step
          # -----------------------------------------------------------

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED_COMMITS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ===============================================================
      # APPLY CHANGES
      # ===============================================================

      - name: Apply changes
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          STRATEGY: ${{ inputs.strategy }}
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          # ===========================================================
          # CHERRY-PICK
          # ===========================================================

          if [[ "$STRATEGY" == "cherry-pick" ]]; then

            echo "Strategy: cherry-pick"

            while IFS= read -r commit; do
              [[ -z "$commit" ]] && continue

              echo "Cherry-picking: $commit"

              git cherry-pick "$commit" || {
                echo "::error::Cherry-pick failed for commit: $commit"

                if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                  git cherry-pick --abort
                fi

                exit 1
              }

            done <<< "$COMMITS_TO_APPLY"

          # ===========================================================
          # SQUASH
          # ===========================================================

          elif [[ "$STRATEGY" == "squash" ]]; then

            echo "Strategy: squash"

            while IFS= read -r commit; do
              [[ -z "$commit" ]] && continue

              echo "Applying without commit: $commit"

              git cherry-pick --no-commit "$commit" || {
                echo "::error::Failed to apply commit: $commit"

                if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                  git cherry-pick --abort
                fi

                exit 1
              }

            done <<< "$COMMITS_TO_APPLY"

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              FINAL_MESSAGE="$COMMIT_MESSAGE"
            elif [[ -n "$SOURCE_BRANCH" ]]; then
              FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"
            else
              FINAL_MESSAGE="chore: squash selected commits"
            fi

            echo "Commit message:"
            echo "$FINAL_MESSAGE"

            git commit -m "$FINAL_MESSAGE"

          # ===========================================================
          # MERGE SELECTED
          # ===========================================================

          elif [[ "$STRATEGY" == "merge-selected" ]]; then

            echo "Strategy: merge-selected"

            TEMP_BRANCH="automation/apply-${GITHUB_RUN_ID}"

            git switch --create "$TEMP_BRANCH"

            while IFS= read -r commit; do
              [[ -z "$commit" ]] && continue

              echo "Cherry-picking into temporary branch: $commit"

              git cherry-pick "$commit" || {
                echo "::error::Failed to apply commit: $commit"

                if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
                  git cherry-pick --abort
                fi

                exit 1
              }

            done <<< "$COMMITS_TO_APPLY"

            git switch "$TARGET_BRANCH"

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              FINAL_MESSAGE="$COMMIT_MESSAGE"
            elif [[ -n "$SOURCE_BRANCH" ]]; then
              FINAL_MESSAGE="Merge selected commits from $SOURCE_BRANCH"
            else
              FINAL_MESSAGE="Merge selected commits"
            fi

            git merge \
              --no-ff \
              "$TEMP_BRANCH" \
              -m "$FINAL_MESSAGE" || {
                echo "::error::Merge failed"

                if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                exit 1
              }

            git branch -D "$TEMP_BRANCH"

          # ===========================================================
          # MERGE BRANCH
          # ===========================================================

          elif [[ "$STRATEGY" == "merge-branch" ]]; then

            echo "Strategy: merge-branch"
            echo "Source: $SOURCE_BRANCH"
            echo "Target: $TARGET_BRANCH"

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              FINAL_MESSAGE="$COMMIT_MESSAGE"
            else
              FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
            fi

            git merge \
              --no-ff \
              "origin/$SOURCE_BRANCH" \
              -m "$FINAL_MESSAGE" || {
                echo "::error::Merge failed"

                if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
                  git merge --abort
                fi

                exit 1
              }

          # ===========================================================
          # REBASE BRANCH
          # ===========================================================

          elif [[ "$STRATEGY" == "rebase-branch" ]]; then

            echo "Strategy: rebase-branch"
            echo "Source: $SOURCE_BRANCH"
            echo "Target: $TARGET_BRANCH"

            MERGE_BASE="$(
              git merge-base \
                "origin/$SOURCE_BRANCH" \
                "origin/$TARGET_BRANCH"
            )"

            echo "Merge base: $MERGE_BASE"

            # Create a temporary local branch from source.
            TEMP_BRANCH="automation/rebase-${GITHUB_RUN_ID}"

            git switch \
              --create "$TEMP_BRANCH" \
              "origin/$SOURCE_BRANCH"

            # Rebase source commits onto target.
            git rebase \
              --onto "origin/$TARGET_BRANCH" \
              "$MERGE_BASE" || {

                echo "::error::Rebase failed"

                if git rebase --show-current-patch >/dev/null 2>&1; then
                  git rebase --abort
                fi

                exit 1
              }

            REBASED_HEAD="$(git rev-parse HEAD)"

            echo "Rebased HEAD: $REBASED_HEAD"

            # Move target to the rebased source.
            git switch "$TARGET_BRANCH"

            git merge \
              --ff-only \
              "$REBASED_HEAD" || {
                echo "::error::Fast-forward of target branch failed"
                exit 1
              }

            git branch -D "$TEMP_BRANCH"

          # ===========================================================
          # APPLY PATCH
          #
          # For patches produced by:
          #
          #   git format-patch
          #
          # Uses git am and preserves patch metadata.
          # ===========================================================

          elif [[ "$STRATEGY" == "apply-patch" ]]; then

            echo "Strategy: apply-patch"
            echo "Patch: $PATCH_FILE"

            git am \
              --3way \
              "$PATCH_FILE" || {

                echo "::error::Failed to apply patch: $PATCH_FILE"

                if git am --show-current-patch >/dev/null 2>&1; then
                  git am --abort
                fi

                exit 1
              }

          # ===========================================================
          # APPLY DIFF
          #
          # For regular .diff / .patch files without Git commit
          # metadata.
          # ===========================================================

          elif [[ "$STRATEGY" == "apply-diff" ]]; then

            echo "Strategy: apply-diff"
            echo "Patch: $PATCH_FILE"

            git apply \
              --3way \
              "$PATCH_FILE" || {

                echo "::error::Failed to apply diff: $PATCH_FILE"

                git reset --hard HEAD

                exit 1
              }

            git add -A

            if git diff --cached --quiet; then
              echo "::error::Patch produced no changes"
              exit 1
            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              FINAL_MESSAGE="$COMMIT_MESSAGE"
            else
              PATCH_NAME="$(basename "$PATCH_FILE")"
              FINAL_MESSAGE="Apply patch: $PATCH_NAME"
            fi

            echo "Commit message:"
            echo "$FINAL_MESSAGE"

            git commit -m "$FINAL_MESSAGE"

          else

            echo "::error::Unsupported strategy: $STRATEGY"
            exit 1

          fi

      # ===============================================================
      # RESULT
      # ===============================================================

      - name: Show result
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          echo ""
          echo "========================================"
          echo "Operation completed"
          echo "========================================"
          echo "Strategy:      $STRATEGY"
          echo "Target branch: $TARGET_BRANCH"
          echo "========================================"
          echo ""

          git log \
            --oneline \
            --decorate \
            -10

      # ===============================================================
      # PUSH
      # ===============================================================

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push origin "$TARGET_BRANCH"
