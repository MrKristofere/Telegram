name: Apply commits / branch changes

on:
  workflow_dispatch:
    inputs:

      commits:
        description: "Commit SHA(s), separated by spaces. With exclude_commits=true, these commits are excluded from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch. Optional when commits are provided directly."
        required: false
        type: string

      strategy:
        description: "How changes should be applied"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      exclude_commits:
        description: "If true, commits becomes an exclusion list for source_branch."
        required: false
        type: boolean
        default: false

      patch_file:
        description: "Repository-relative path to .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom message for a newly created aggregate commit. Ignored by cherry-pick/rebase-branch."
        required: false
        type: string

      dry_run:
        description: "Validate and simulate the operation without pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:

  apply:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      STRATEGY: ${{ inputs.strategy }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # INITIAL CHECKOUT
      #
      # Only one commit is downloaded initially.
      # Additional history is fetched on demand.
      # ============================================================

      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config core.quotePath false
          git config rerere.enabled true

          echo "Git version:"
          git --version

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUTS"
          echo "========================================"
          echo "Strategy:        $STRATEGY"
          echo "Target branch:   $TARGET_BRANCH"
          echo "Source branch:   ${SOURCE_BRANCH:-<none>}"
          echo "Commits:         ${COMMITS_INPUT:-<none>}"
          echo "Exclude:         $EXCLUDE_COMMITS"
          echo "Patch:           ${PATCH_FILE:-<none>}"
          echo "Commit message:  ${COMMIT_MESSAGE:-<auto>}"
          echo "Dry run:         $DRY_RUN"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is empty."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::target_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::source_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected|rebase-branch)

              if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
                echo "::error::$STRATEGY requires source_branch or commits."
                exit 1
              fi

              if [[ "$STRATEGY" == "rebase-branch" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::rebase-branch requires source_branch."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::exclude_commits requires source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with $STRATEGY."
                exit 1
              fi

              ;;

            merge-branch)

              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::merge-branch does not accept commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::merge-branch cannot use exclude_commits."
                echo "::error::Use merge-selected instead."
                exit 1
              fi

              ;;

            apply-patch|apply-diff)

              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::$STRATEGY requires patch_file."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" || -n "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY does not use commits or source_branch."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits cannot be used with patch/diff."
                exit 1
              fi

              ;;

            *)

              echo "::error::Unknown strategy: $STRATEGY"
              exit 1

              ;;
          esac

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            case "$STRATEGY" in
              cherry-pick|rebase-branch)
                echo "::notice::commit_message is ignored for $STRATEGY."
                ;;
            esac

          fi

      # ============================================================
      # CLEAN WORKTREE
      # ============================================================

      - name: Verify clean worktree
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      # ============================================================
      # SNAPSHOT TARGET
      #
      # This SHA is immutable for this workflow execution.
      # ============================================================

      - name: Snapshot target
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target snapshot:"
          echo "$TARGET_SHA"

          git reset --hard "$TARGET_SHA"

      # ============================================================
      # SNAPSHOT SOURCE
      #
      # Source is frozen as well.
      # New commits pushed to source after this point are ignored.
      # ============================================================

      - name: Snapshot source
        if: ${{ inputs.source_branch != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source snapshot:"
          echo "$SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Invalid commit SHA: $commit"
              exit 1
            fi

            git fetch \
              --no-tags \
              origin \
              "$commit"

          done < <(
            printf '%s\n' "$COMMITS_INPUT" |
            tr ' ' '\n'
          )

      # ============================================================
      # FIND MERGE BASE
      #
      # History is deepened only when required.
      # ============================================================

      - name: Resolve merge base
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_DEPTH=1048576
          DEEPEN=32

          while true; do

            if MERGE_BASE="$(
              git merge-base \
                "$TARGET_SHA" \
                "$SOURCE_SHA" \
                2>/dev/null
            )"; then

              echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

              echo "Merge base:"
              echo "$MERGE_BASE"

              break

            fi

            if [[ "$DEEPEN" -ge "$MAX_DEPTH" ]]; then
              echo "::error::Unable to find merge-base."
              exit 1
            fi

            echo "Merge base not available. Deepening history by $DEEPEN."

            git fetch \
              --no-tags \
              --deepen="$DEEPEN" \
              origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
              "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            DEEPEN=$((DEEPEN * 2))

          done

      # ============================================================
      # BUILD UNIFIED SELECTION
      #
      # This is the central part of the workflow.
      #
      # Result:
      #
      #   COMMITS_TO_APPLY
      #
      # Every strategy except merge-branch and patch/diff consumes
      # this exact list.
      # ============================================================

      - name: Build commit selection
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ALL_SOURCE="/tmp/all_source_commits"
          INPUT_COMMITS="/tmp/input_commits"
          SELECTED="/tmp/selected_commits"
          UNIQUE="/tmp/unique_commits"
          SORTED="/tmp/sorted_commits"
          FINAL="/tmp/final_commits"

          : > "$ALL_SOURCE"
          : > "$INPUT_COMMITS"
          : > "$SELECTED"
          : > "$UNIQUE"
          : > "$SORTED"
          : > "$FINAL"

          # ==========================================================
          # STEP 1
          # Get all source commits that are not already present or
          # patch-equivalent in target.
          #
          # --cherry-pick --right-only omits commits whose changes
          # already exist on the target side.
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            git rev-list \
              --reverse \
              --right-only \
              --cherry-pick \
              --no-merges \
              "$TARGET_SHA...$SOURCE_SHA" \
              > "$ALL_SOURCE"

          fi

          # ==========================================================
          # STEP 2
          # Normalize explicit SHA input.
          # Duplicate SHA values are removed.
          # ==========================================================

          if [[ -n "$COMMITS_INPUT" ]]; then

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                echo "::error::Invalid commit SHA: $commit"
                exit 1
              fi

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$INPUT_COMMITS"

            done < <(
              printf '%s\n' "$COMMITS_INPUT" |
              tr ' ' '\n'
            )

            sort -u "$INPUT_COMMITS" -o "$INPUT_COMMITS"

          fi

          # ==========================================================
          # STEP 3
          #
          # Determine the requested selection.
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            if [[ -z "$COMMITS_INPUT" ]]; then

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                echo "::error::exclude_commits=true requires at least one SHA."
                exit 1

              fi

              # Whole source branch.
              cp "$ALL_SOURCE" "$SELECTED"

            else

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                # ----------------------------------------------------
                # EXCLUSION MODE
                #
                # Source branch minus explicitly supplied commits.
                # ----------------------------------------------------

                cp "$ALL_SOURCE" "$SELECTED"

                while IFS= read -r excluded; do

                  [[ -z "$excluded" ]] && continue

                  if grep -Fxq "$excluded" "$SELECTED"; then

                    echo "Excluding:"
                    echo "$excluded"

                    grep -Fxv \
                      "$excluded" \
                      "$SELECTED" \
                      > "${SELECTED}.tmp"

                    mv \
                      "${SELECTED}.tmp" \
                      "$SELECTED"

                  else

                    # It may already be excluded because it is
                    # patch-equivalent to a target commit.
                    echo "::notice::Excluded commit is not in the currently applicable source set:"
                    echo "$excluded"

                  fi

                done < "$INPUT_COMMITS"

              else

                # ----------------------------------------------------
                # INCLUSION MODE
                #
                # Only explicitly selected commits.
                # ----------------------------------------------------

                cp "$INPUT_COMMITS" "$SELECTED"

              fi

            fi

          else

            # --------------------------------------------------------
            # No source branch.
            #
            # Explicit commits are mandatory.
            # --------------------------------------------------------

            if [[ -z "$COMMITS_INPUT" ]]; then
              echo "::error::No source_branch and no commits."
              exit 1
            fi

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "::error::exclude_commits requires source_branch."
              exit 1
            fi

            cp "$INPUT_COMMITS" "$SELECTED"

          fi

          # ==========================================================
          # STEP 4
          # Remove duplicates again after selection.
          # ==========================================================

          sort -u "$SELECTED" -o "$UNIQUE"

          if [[ ! -s "$UNIQUE" ]]; then
            echo "::error::No commits remain after selection."
            exit 1
          fi

          # ==========================================================
          # STEP 5
          # Validate explicit commits belong to source branch.
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git merge-base \
                --is-ancestor \
                "$commit" \
                "$SOURCE_SHA" \
                2>/dev/null; then

                echo "::error::Commit is not an ancestor of source_branch snapshot:"
                echo "::error::$commit"
                echo "::error::Source SHA: $SOURCE_SHA"

                exit 1
              fi

              # Merge commits are deliberately rejected.
              # They require a mainline selection and cannot be safely
              # treated as an ordinary independent change.
              PARENTS="$(
                git rev-list \
                  --parents \
                  -n 1 \
                  "$commit" |
                awk '{print NF-1}'
              )"

              if [[ "$PARENTS" -gt 1 ]]; then

                echo "::error::Merge commit is not supported as a selected commit:"
                echo "::error::$commit"
                echo "::error::Select its individual commits or use merge-branch."

                exit 1
              fi

            done < "$UNIQUE"

          fi

          # ==========================================================
          # STEP 6
          # Remove commits that are already direct ancestors of target.
          #
          # Patch-equivalent commits are handled safely by
          # cherry-pick/replay with --empty=drop as well.
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "$TARGET_SHA" \
              2>/dev/null; then

              echo "::warning::Commit already exists in target. Skipping:"
              echo "::warning::$commit"

              continue

            fi

            echo "$commit" >> "$FINAL"

          done < "$UNIQUE"

          # ==========================================================
          # STEP 7
          # Chronological order.
          #
          # Author timestamp -> committer timestamp -> SHA.
          #
          # Thus:
          #
          #   input: C A B
          #
          # does not matter.
          # ==========================================================

          while IFS= read -r commit; do

            AUTHOR_TS="$(git show -s --format='%at' "$commit")"
            COMMITTER_TS="$(git show -s --format='%ct' "$commit")"

            printf '%s\t%s\t%s\n' \
              "$AUTHOR_TS" \
              "$COMMITTER_TS" \
              "$commit"

          done < "$FINAL" |
            sort -n -k1,1 -k2,2 -k3,3 |
            cut -f3 |
            uniq > "$SORTED"

          if [[ ! -s "$SORTED" ]]; then

            echo "::error::No new commits remain after filtering."
            exit 1

          fi

          # ==========================================================
          # STEP 8
          # Save selection.
          # ==========================================================

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

          # ==========================================================
          # STEP 9
          # Display final selection.
          # ==========================================================

          echo ""
          echo "========================================"
          echo "FINAL COMMIT SELECTION"
          echo "========================================"

          while IFS= read -r commit; do

            git show \
              -s \
              --format='%aI | %H | %s' \
              "$commit"

          done < "$SORTED"

          echo "========================================"

      # ============================================================
      # VALIDATE PATCH / DIFF
      # ============================================================

      - name: Validate patch or diff
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch/diff file does not exist:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch/diff file is empty:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --stat \
              "$PATCH_FILE"

            git apply \
              --check \
              "$PATCH_FILE"

          else

            git mailinfo \
              /tmp/patch-message \
              /tmp/patch-info \
              < "$PATCH_FILE" \
              >/dev/null 2>&1 || {

                echo "::error::Invalid format-patch file."
                exit 1
              }

          fi

      # ============================================================
      # DISPLAY PLAN
      # ============================================================

      - name: Show plan
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          echo ""
          echo "========================================"
          echo "EXECUTION PLAN"
          echo "========================================"

          echo "Strategy:       $STRATEGY"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Target SHA:      $TARGET_SHA"

          if [[ -n "${SOURCE_BRANCH:-}" ]]; then
            echo "Source branch:  $SOURCE_BRANCH"
            echo "Source SHA:     $SOURCE_SHA"
            echo "Merge base:     ${MERGE_BASE:-<none>}"
          fi

          echo "Exclude mode:   $EXCLUDE_COMMITS"
          echo "Dry run:        $DRY_RUN"

          if [[ -n "${COMMITS_TO_APPLY:-}" ]]; then

            echo ""
            echo "Commits to apply:"

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              git show \
                -s \
                --format='- %H | %aI | %s' \
                "$commit"

            done <<< "$COMMITS_TO_APPLY"

          fi

          echo "========================================"

      # ============================================================
      # SIMULATE OPERATION
      #
      # For dry_run we actually execute the operation on a temporary
      # branch, but never push it.
      #
      # This catches real conflicts instead of merely displaying
      # what would happen.
      # ============================================================

      - name: Simulate operation
        if: ${{ inputs.dry_run == true && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          TEMP_BRANCH="dry-run-${GITHUB_RUN_ID}"

          git switch \
            --create "$TEMP_BRANCH" \
            "$TARGET_SHA"

          cleanup() {
            git cherry-pick --abort >/dev/null 2>&1 || true
            git rebase --abort >/dev/null 2>&1 || true
            git merge --abort >/dev/null 2>&1 || true
            git switch --detach "$TARGET_SHA" >/dev/null 2>&1 || true
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          case "$STRATEGY" in

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run cherry-pick conflict:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            squash)

              APPLIED=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  APPLIED=$((APPLIED + 1))
                  continue

                fi

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                  echo "::error::Dry-run squash conflict:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              if ! git diff --quiet || ! git diff --cached --quiet; then

                git add -A

                MESSAGE="${COMMIT_MESSAGE:-Squash selected commits}"

                git commit -m "$MESSAGE"

              fi

              ;;

            merge-selected)

              TEMP_SELECTED="dry-run-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_SELECTED" \
                "$TARGET_SHA"

              for commit in $COMMITS_TO_APPLY; do

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run selected merge conflict:"
                  echo "$commit"

                  git cherry-pick --abort || true

                  exit 1

                fi

              done

              SELECTED_SHA="$(git rev-parse HEAD)"

              git switch "$TEMP_BRANCH"

              MESSAGE="${COMMIT_MESSAGE:-Merge selected commits}"

              if ! git merge \
                --no-ff \
                "$SELECTED_SHA" \
                -m "$MESSAGE"; then

                echo "::error::Dry-run merge-selected conflict."

                git merge --abort || true

                exit 1

              fi

              git branch -D "$TEMP_SELECTED"

              ;;

            rebase-branch)

              # ------------------------------------------------------
              # Unified selection is replayed one commit at a time.
              #
              # This gives rebase-branch the same selection semantics
              # as cherry-pick/squash while retaining individual
              # commits.
              # ------------------------------------------------------

              for commit in $COMMITS_TO_APPLY; do

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run rebase conflict:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true

                  exit 1

                fi

              done

              ;;

          esac

          echo ""
          echo "========================================"
          echo "DRY RUN RESULT"
          echo "========================================"

          echo "Operation completed successfully in temporary branch."

          echo ""
          echo "Resulting commits:"

          git log \
            --oneline \
            --decorate \
            "$TARGET_SHA..HEAD"

          echo ""
          echo "No push will be performed."

      # ============================================================
      # DRY RUN PATCH
      # ============================================================

      - name: Simulate patch or diff
        if: ${{ inputs.dry_run == true && (inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TEMP_BRANCH="dry-run-${GITHUB_RUN_ID}"

          git switch \
            --create "$TEMP_BRANCH" \
            "$TARGET_SHA"

          cleanup() {
            git am --abort >/dev/null 2>&1 || true
            git switch --detach "$TARGET_SHA" >/dev/null 2>&1 || true
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          if [[ "$STRATEGY" == "apply-patch" ]]; then

            if ! git am \
              --3way \
              --empty=drop \
              "$PATCH_FILE"; then

              echo "::error::Dry-run patch application failed."

              git am --show-current-patch=raw || true
              git am --abort || true

              exit 1
            fi

          else

            if ! git apply \
              --3way \
              "$PATCH_FILE"; then

              echo "::error::Dry-run diff application failed."

              git status --short || true

              exit 1
            fi

            git add -A

            if ! git diff --cached --quiet; then

              MESSAGE="${COMMIT_MESSAGE:-Apply diff: $(basename "$PATCH_FILE")}"

              git commit -m "$MESSAGE"

            fi

          fi

          echo ""
          echo "========================================"
          echo "DRY RUN RESULT"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            "$TARGET_SHA..HEAD"

          echo ""
          echo "No push will be performed."

      # ============================================================
      # APPLY REAL OPERATION
      # ============================================================

      - name: Apply operation
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            # ========================================================
            # CHERRY-PICK
            #
            # Each source commit creates its own new commit.
            # commit_message is deliberately ignored.
            # ========================================================

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Cherry-picking:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Cherry-pick failed:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true
                  git reset --hard "$TARGET_SHA"

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            # ========================================================
            # SQUASH
            #
            # All selected changes become ONE commit.
            # ========================================================

            squash)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Adding to squash:"
                echo "$commit"

                if ! git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Squash conflict:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true
                  git reset --hard "$TARGET_SHA"

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              git add -A

              if git diff --cached --quiet; then

                echo "::error::Squash produced no changes."
                git reset --hard "$TARGET_SHA"

                exit 1

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Squash selected commits from $SOURCE_BRANCH"
                fi

              else

                FINAL_MESSAGE="Squash selected commits"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            # ========================================================
            # MERGE-SELECTED
            #
            # Selected commits are first replayed onto target on a
            # temporary branch, then that result is merged with --no-ff.
            # ========================================================

            merge-selected)

              TEMP_BRANCH="merge-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH" \
                "$TARGET_SHA"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Applying selected commit:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Selected commit could not be applied:"
                  echo "$commit"

                  git cherry-pick --abort || true

                  git switch "$TARGET_BRANCH" || true
                  git reset --hard "$TARGET_SHA"

                  git branch -D "$TEMP_BRANCH" || true

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              SELECTED_SHA="$(git rev-parse HEAD)"

              git switch "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Merge selected changes from $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Merge selected changes from $SOURCE_BRANCH"
                fi

              else

                FINAL_MESSAGE="Merge selected commits"

              fi

              if ! git merge \
                --no-ff \
                "$SELECTED_SHA" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::merge-selected failed."

                git merge --abort || true
                git reset --hard "$TARGET_SHA"

                git branch -D "$TEMP_BRANCH" || true

                exit 1

              fi

              git branch -D "$TEMP_BRANCH"

              ;;

            # ========================================================
            # MERGE-BRANCH
            #
            # Entire frozen source snapshot is merged.
            # ========================================================

            merge-branch)

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              else
                FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
              fi

              if ! git merge \
                --no-ff \
                "$SOURCE_SHA" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::merge-branch failed."

                git merge --abort || true
                git reset --hard "$TARGET_SHA"

                exit 1

              fi

              ;;

            # ========================================================
            # REBASE-BRANCH
            #
            # Unified selection:
            #
            #   whole branch
            #   selected commits
            #   branch minus excluded commits
            #
            # Each selected commit remains an individual commit.
            #
            # This is intentionally replayed sequentially rather than
            # using a blind:
            #
            #   git rebase --onto ...
            #
            # because the latter cannot express arbitrary exclusion.
            # ========================================================

            rebase-branch)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Replaying for rebase:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Rebase/replay conflict:"
                  echo "$commit"

                  echo ""
                  echo "Current patch:"
                  git show \
                    --format=fuller \
                    "$commit" || true

                  echo ""
                  echo "Working tree:"
                  git status --short || true

                  git cherry-pick --abort || true
                  git reset --hard "$TARGET_SHA"

                  exit 1

                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            # ========================================================
            # APPLY-PATCH
            #
            # format-patch/mailbox -> git am
            # ========================================================

            apply-patch)

              if ! git am \
                --3way \
                --empty=drop \
                "$PATCH_FILE"; then

                echo "::error::Patch application failed."

                git am --show-current-patch=raw || true
                git am --abort || true
                git reset --hard "$TARGET_SHA"

                exit 1

              fi

              ;;

            # ========================================================
            # APPLY-DIFF
            #
            # Plain diff -> working tree -> one commit.
            # ========================================================

            apply-diff)

              # Already-applied detection.
              if git apply \
                --check \
                --reverse \
                "$PATCH_FILE" \
                >/dev/null 2>&1; then

                echo "::error::Diff appears to be already applied."
                exit 1

              fi

              if ! git apply \
                --3way \
                "$PATCH_FILE"; then

                echo "::error::Diff application failed."

                git reset --hard "$TARGET_SHA"

                exit 1

              fi

              git add -A

              if git diff --cached --quiet; then

                echo "::error::Diff produced no changes."

                git reset --hard "$TARGET_SHA"

                exit 1

              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then

                FINAL_MESSAGE="$COMMIT_MESSAGE"

              else

                FINAL_MESSAGE="Apply diff: $(basename "$PATCH_FILE")"

              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

          esac

      # ============================================================
      # FINAL LOCAL VALIDATION
      # ============================================================

      - name: Validate result
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved cherry-pick state."
            exit 1

          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved merge state."
            exit 1

          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved rebase state."
            exit 1

          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1

          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no changes."
            exit 1

          fi

          echo "Initial target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Final:"
          echo "$FINAL_SHA"

      # ============================================================
      # REMOTE RACE CHECK
      #
      # Must happen immediately before push.
      # ============================================================

      - name: Verify remote target is unchanged
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Expected target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Current remote target:"
          echo "$CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."

            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            rebase-branch)

              echo "Pushing rebase result with explicit force-with-lease."

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          {
            echo "## Apply changes"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-}\` |"
            echo "| Exclude mode | \`$EXCLUDE_COMMITS\` |"
            echo "| Dry run | \`$DRY_RUN\` |"

            if [[ -n "${MERGE_BASE:-}" ]]; then
              echo "| Merge base | \`${MERGE_BASE}\` |"
            fi

            echo ""
            echo "### Selected commits"

            if [[ -n "${COMMITS_TO_APPLY:-}" ]]; then

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "- \`$commit\` — $(git show -s --format='%s' "$commit")"

              done <<< "$COMMITS_TO_APPLY"

            else

              echo "No commit selection."

            fi

          } >> "$GITHUB_STEP_SUMMARY"
