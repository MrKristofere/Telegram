name: Apply changes to branch

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commit SHA via Space. If empty, commits are taken from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      strategy:
        description: "How to apply changes"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      source_branch:
        description: "Source branch. Used when commits are empty or for merge/rebase."
        required: false
        type: string

      patch_file:
        description: "Path to .patch/.diff file in repository."
        required: false
        type: string

      commit_message:
        description: "Commit/merge message. If empty, generated automatically."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:

      # ===============================================================
      # FAST INITIAL CHECKOUT
      # ===============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===============================================================
      # CONFIGURE GIT
      # ===============================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config protocol.version 2

      # ===============================================================
      # VALIDATE INPUTS
      # ===============================================================

      - name: Validate inputs
        env:
          COMMITS: ${{ inputs.commits }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRATEGY: ${{ inputs.strategy }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Strategy:       ${STRATEGY:-cherry-pick}"
          echo "Target branch:  $TARGET_BRANCH"
          echo "Source branch:  ${SOURCE_BRANCH:-<none>}"
          echo "Commits:        ${COMMITS:-<none>}"
          echo "Patch file:     ${PATCH_FILE:-<none>}"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick|squash|merge-selected)
              if [[ -z "$COMMITS" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::Either commits or source_branch is required."
                exit 1
              fi
              ;;

            merge-branch|rebase-branch)
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::source_branch is required for $STRATEGY."
                exit 1
              fi
              ;;

            apply-patch|apply-diff)
              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::patch_file is required for $STRATEGY."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

      # ===============================================================
      # VERIFY CLEAN WORKTREE
      # ===============================================================

      - name: Verify clean worktree
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      # ===============================================================
      # FETCH TARGET
      # ===============================================================

      - name: Fetch target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            --prune \
            --depth=1 \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target SHA:"
          echo "$TARGET_SHA"

      # ===============================================================
      # FETCH SOURCE
      # ===============================================================

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            --prune \
            --depth=1 \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source SHA:"
          echo "$SOURCE_SHA"

      # ===============================================================
      # FETCH EXPLICIT SHAs
      # ===============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          set -euo pipefail

          for commit in $COMMITS; do
            echo "Fetching commit: $commit"

            git fetch \
              --no-tags \
              origin \
              "$commit" || {
                echo "::error::Unable to fetch commit: $commit"
                exit 1
              }
          done

      # ===============================================================
      # HISTORY HELPER
      #
      # Gradually deepen target/source history until a merge-base exists.
      # We never jump directly to fetch-depth=0.
      # ===============================================================

      - name: Resolve required history
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'merge-branch' || inputs.strategy == 'rebase-branch' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          TARGET_REF="origin/$TARGET_BRANCH"

          DEPTH=32
          MAX_DEPTH=1000000

          # -----------------------------------------------------------
          # If we have a source branch, find its merge-base with target.
          # -----------------------------------------------------------

          if [[ -n "$SOURCE_BRANCH" ]]; then

            SOURCE_REF="origin/$SOURCE_BRANCH"

            while true; do

              echo ""
              echo "Checking history depth: $DEPTH"

              if MERGE_BASE="$(
                git merge-base \
                  "$TARGET_REF" \
                  "$SOURCE_REF" \
                  2>/dev/null
              ); then

                echo "Merge base found:"
                echo "$MERGE_BASE"

                echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

                break
              fi

              if [[ "$DEPTH" -ge "$MAX_DEPTH" ]]; then
                echo "::error::Unable to find merge-base."
                echo "::error::Maximum history depth reached: $MAX_DEPTH"
                exit 1
              fi

              git fetch \
                --no-tags \
                --deepen="$DEPTH" \
                origin \
                "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
                "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

              DEPTH=$((DEPTH * 2))

            done

          # -----------------------------------------------------------
          # No source branch.
          #
          # Explicit SHAs will be handled individually.
          # -----------------------------------------------------------

          else

            echo "No source branch supplied."
            echo "History will be resolved from explicit SHAs."

          fi

      # ===============================================================
      # RESOLVE AND FILTER COMMITS
      #
      # Protections:
      #
      # 1. Duplicate SHA in input -> removed.
      #
      # 2. SHA already in target history -> skipped.
      #
      # 3. Patch-equivalent commit already in target -> skipped.
      #
      # 4. For source_branch, git rev-list --cherry-pick automatically
      #    excludes patch-equivalent commits.
      #
      # 5. Final list sorted chronologically.
      # ===============================================================

      - name: Resolve and filter commits
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        env:
          COMMITS: ${{ inputs.commits }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          INPUT="/tmp/input_commits.txt"
          UNIQUE="/tmp/unique_commits.txt"
          FILTERED="/tmp/filtered_commits.txt"
          SORTED="/tmp/sorted_commits.txt"

          rm -f \
            "$INPUT" \
            "$UNIQUE" \
            "$FILTERED" \
            "$SORTED"

          # ===========================================================
          # STEP 1
          # Get requested commits
          # ===========================================================

          if [[ -n "$COMMITS" ]]; then

            echo "Using explicitly selected commits."

            for commit in $COMMITS; do

              # Full object validation.
              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              # Resolve abbreviated SHA to full SHA.
              FULL_SHA="$(
                git rev-parse "$commit^{commit}"
              )"

              echo "$FULL_SHA" >> "$INPUT"

            done

          elif [[ -n "$SOURCE_BRANCH" ]]; then

            echo "No explicit SHAs supplied."

            echo "Selecting commits from:"
            echo "  origin/$SOURCE_BRANCH"

            echo "excluding:"
            echo "  origin/$TARGET_BRANCH"

            # --cherry-pick excludes patch-equivalent commits.
            #
            # --right-only means only source-side commits are returned.
            #
            # --no-merges prevents merge commits from being treated as
            # individual changes in the selected set.

            git rev-list \
              --right-only \
              --cherry-pick \
              --no-merges \
              --reverse \
              "origin/$TARGET_BRANCH...origin/$SOURCE_BRANCH" \
              > "$INPUT"

          else

            echo "::error::No commits or source_branch available."
            exit 1

          fi

          # ===========================================================
          # STEP 2
          # Remove duplicate SHA from user input.
          # ===========================================================

          sort -u "$INPUT" > "$UNIQUE"

          echo ""
          echo "Unique requested commits:"
          cat "$UNIQUE" || true

          # ===========================================================
          # STEP 3
          # Check exact SHA already exists in target.
          #
          # If target history is shallow, deepen it until:
          #
          #   - SHA becomes reachable
          #   - or target history is complete.
          # ===========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "origin/$TARGET_BRANCH" \
              2>/dev/null; then

              echo "::warning::Commit already exists in target history:"
              echo "::warning::$commit"
              echo "::warning::Skipping duplicate."

              continue
            fi

            # =========================================================
            # STEP 4
            # Detect patch-equivalent commits.
            #
            # git cherry compares changes rather than SHA values.
            # A '-' means the change is already represented upstream.
            # =========================================================

            IS_DUPLICATE=false

            if git cherry \
              "origin/$TARGET_BRANCH" \
              "$commit" \
              >/tmp/cherry_result.txt 2>/dev/null; then

              if grep -q '^-' /tmp/cherry_result.txt; then
                IS_DUPLICATE=true
              fi
            fi

            if [[ "$IS_DUPLICATE" == "true" ]]; then

              echo "::warning::Patch-equivalent change already exists:"
              echo "::warning::$commit"
              echo "::warning::Skipping duplicate."

              continue
            fi

            echo "$commit" >> "$FILTERED"

          done < "$UNIQUE"

          # ===========================================================
          # STEP 5
          # If everything was already applied, stop safely.
          # ===========================================================

          if [[ ! -s "$FILTERED" ]]; then

            echo ""
            echo "::error::No new commits remain after duplicate detection."
            echo "::error::All selected commits are already represented in target."
            exit 1

          fi

          # ===========================================================
          # STEP 6
          # Sort commits by committer date:
          #
          # oldest
          #    ↓
          # newest
          #
          # SHA is used as deterministic tie-breaker.
          # ===========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            timestamp="$(
              git show \
                -s \
                --format='%ct' \
                "$commit"
            )"

            printf '%s\t%s\n' \
              "$timestamp" \
              "$commit"

          done < "$FILTERED" \
            | sort -n -k1,1 -k2,2 \
            | cut -f2 \
            > "$SORTED"

          # ===========================================================
          # STEP 7
          # Final verification.
          # ===========================================================

          if [[ ! -s "$SORTED" ]]; then
            echo "::error::Commit list became empty."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Final commits to apply"
          echo "========================================"

          while IFS= read -r commit; do

            git show \
              -s \
              --format='%aI %H %s' \
              "$commit"

          done < "$SORTED"

          echo "========================================"

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$SORTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ===============================================================
      # VALIDATE PATCH
      # ===============================================================

      - name: Validate patch
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file not found:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch file is empty:"
            echo "$PATCH_FILE"
            exit 1
          fi

      # ===============================================================
      # APPLY
      # ===============================================================

      - name: Apply changes
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          STRATEGY: ${{ inputs.strategy }}
          PATCH_FILE: ${{ inputs.patch_file }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          # ===========================================================
          # CHERRY-PICK
          # ===========================================================

          if [[ "$STRATEGY" == "cherry-pick" ]]; then

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              echo ""
              echo "Cherry-picking:"
              echo "$commit"

              # --empty=drop prevents an already represented change
              # from stopping the operation.
              #
              # This is an additional runtime protection after the
              # pre-flight duplicate checks.

              if ! git cherry-pick \
                --empty=drop \
                "$commit"; then

                echo "::error::Cherry-pick failed:"
                echo "$commit"

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                  git cherry-pick --abort
                fi

                exit 1
              fi

            done <<< "$COMMITS_TO_APPLY"

          # ===========================================================
          # SQUASH
          # ===========================================================

          elif [[ "$STRATEGY" == "squash" ]]; then

            # We use a temporary index/worktree state and apply commits
            # one at a time.
            #
            # If an individual commit becomes empty, it is simply
            # ignored without aborting the whole accumulated squash.

            APPLIED_COUNT=0

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              echo ""
              echo "Applying without commit:"
              echo "$commit"

              if git cherry-pick \
                --no-commit \
                "$commit"; then

                APPLIED_COUNT=$((APPLIED_COUNT + 1))

                continue
              fi

              # -------------------------------------------------------
              # If the commit produced no changes, cleanly skip it.
              # -------------------------------------------------------

              if git diff --quiet && git diff --cached --quiet; then

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                  git cherry-pick --abort
                fi

                echo "::warning::Commit produced no changes:"
                echo "::warning::$commit"

                continue
              fi

              # -------------------------------------------------------
              # Actual conflict.
              # -------------------------------------------------------

              echo "::error::Failed to apply commit:"
              echo "$commit"

              if git rev-parse -q \
                --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                git cherry-pick --abort
              fi

              git reset --hard HEAD

              exit 1

            done <<< "$COMMITS_TO_APPLY"

            if [[ "$APPLIED_COUNT" -eq 0 ]]; then
              echo "::error::Squash produced no new changes."
              exit 1
            fi

            git add -A

            if git diff --cached --quiet; then
              echo "::error::Nothing to commit after squash."
              exit 1
            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              FINAL_MESSAGE="$COMMIT_MESSAGE"

            elif [[ -n "$SOURCE_BRANCH" ]]; then

              FINAL_MESSAGE="Squash $SOURCE_BRANCH into $TARGET_BRANCH"

            else

              FINAL_MESSAGE="chore: squash selected commits"

            fi

            git commit -m "$FINAL_MESSAGE"

          # ===========================================================
          # MERGE SELECTED
          # ===========================================================

          elif [[ "$STRATEGY" == "merge-selected" ]]; then

            TEMP_BRANCH="automation/apply-${GITHUB_RUN_ID}"

            git switch --create "$TEMP_BRANCH"

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cherry-pick \
                --empty=drop \
                "$commit"; then

                echo "::error::Failed to apply:"
                echo "$commit"

                if git rev-parse -q \
                  --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

                  git cherry-pick --abort
                fi

                git switch "$TARGET_BRANCH"
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

            done <<< "$COMMITS_TO_APPLY"

            # -----------------------------------------------------------
            # Check whether temporary branch actually contains changes.
            # -----------------------------------------------------------

            if git diff \
              --quiet \
              "origin/$TARGET_BRANCH" \
              "$TEMP_BRANCH"; then

              echo "::error::Selected commits produced no new changes."
              git switch "$TARGET_BRANCH"
              git branch -D "$TEMP_BRANCH" || true
              exit 1
            fi

            git switch "$TARGET_BRANCH"

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              FINAL_MESSAGE="$COMMIT_MESSAGE"

            elif [[ -n "$SOURCE_BRANCH" ]]; then

              FINAL_MESSAGE="Merge selected commits from $SOURCE_BRANCH"

            else

              FINAL_MESSAGE="Merge selected commits"

            fi

            git merge \
              --no-ff \
              "$TEMP_BRANCH" \
              -m "$FINAL_MESSAGE" || {

              echo "::error::Merge failed."

              if git rev-parse -q \
                --verify MERGE_HEAD >/dev/null 2>&1; then

                git merge --abort
              fi

              git branch -D "$TEMP_BRANCH" || true

              exit 1
            }

            git branch -D "$TEMP_BRANCH"

          # ===========================================================
          # MERGE BRANCH
          # ===========================================================

          elif [[ "$STRATEGY" == "merge-branch" ]]; then

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              FINAL_MESSAGE="$COMMIT_MESSAGE"

            else

              FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"

            fi

            git merge \
              --no-ff \
              "origin/$SOURCE_BRANCH" \
              -m "$FINAL_MESSAGE" || {

              echo "::error::Merge failed."

              if git rev-parse -q \
                --verify MERGE_HEAD >/dev/null 2>&1; then

                git merge --abort
              fi

              exit 1
            }

          # ===========================================================
          # REBASE BRANCH
          # ===========================================================

          elif [[ "$STRATEGY" == "rebase-branch" ]]; then

            TEMP_BRANCH="automation/rebase-${GITHUB_RUN_ID}"

            git switch \
              --create "$TEMP_BRANCH" \
              "origin/$SOURCE_BRANCH"

            git rebase \
              --onto "origin/$TARGET_BRANCH" \
              "$MERGE_BASE" || {

              echo "::error::Rebase failed."

              if git rebase --show-current-patch \
                >/dev/null 2>&1; then

                git rebase --abort
              fi

              git switch "$TARGET_BRANCH" || true
              git branch -D "$TEMP_BRANCH" || true

              exit 1
            }

            REBASED_HEAD="$(git rev-parse HEAD)"

            git switch "$TARGET_BRANCH"

            git merge \
              --ff-only \
              "$REBASED_HEAD" || {

              echo "::error::Target cannot be fast-forwarded."

              git branch -D "$TEMP_BRANCH" || true

              exit 1
            }

            git branch -D "$TEMP_BRANCH"

          # ===========================================================
          # APPLY PATCH
          #
          # For git format-patch output.
          # ===========================================================

          elif [[ "$STRATEGY" == "apply-patch" ]]; then

            git am \
              --3way \
              "$PATCH_FILE" || {

              echo "::error::git am failed."

              if git am --show-current-patch \
                >/dev/null 2>&1; then

                git am --abort
              fi

              exit 1
            }

          # ===========================================================
          # APPLY DIFF
          #
          # For ordinary diff/patch without commit metadata.
          # ===========================================================

          elif [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --3way \
              "$PATCH_FILE" || {

              echo "::error::git apply failed."

              git reset --hard HEAD

              exit 1
            }

            git add -A

            if git diff --cached --quiet; then

              echo "::error::Patch produced no changes."

              git reset --hard HEAD

              exit 1
            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then

              FINAL_MESSAGE="$COMMIT_MESSAGE"

            else

              PATCH_NAME="$(basename "$PATCH_FILE")"

              FINAL_MESSAGE="Apply patch: $PATCH_NAME"

            fi

            git commit -m "$FINAL_MESSAGE"

          else

            echo "::error::Unsupported strategy:"
            echo "$STRATEGY"

            exit 1

          fi

      # ===============================================================
      # FINAL LOCAL VALIDATION
      # ===============================================================

      - name: Verify result
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final validation"
          echo "========================================"

          # No unresolved Git operation.
          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::CHERRY_PICK_HEAD still exists."
            exit 1
          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::MERGE_HEAD still exists."
            exit 1
          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::REBASE_HEAD still exists."
            exit 1
          fi

          # No uncommitted changes.
          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."

            git status --short

            exit 1
          fi

          echo ""
          echo "HEAD:"
          git rev-parse HEAD

          echo ""
          echo "Recent commits:"
          git log \
            --oneline \
            --decorate \
            -10

      # ===============================================================
      # REMOTE RACE PROTECTION
      #
      # Do not push if target changed while workflow was running.
      # ===============================================================

      - name: Verify target has not changed
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Original target:"
          echo "$TARGET_SHA"

          echo "Current remote target:"
          echo "$CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Expected: $TARGET_SHA"
            echo "::error::Actual:   $CURRENT_REMOTE_SHA"
            echo "::error::Push cancelled to prevent overwriting changes."

            exit 1
          fi

      # ===============================================================
      # FINAL PUSH
      # ===============================================================

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:$TARGET_BRANCH"
