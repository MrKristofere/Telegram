name: Apply commits / branch changes

on:
  workflow_dispatch:
    inputs:

      commits:
        description: "Commit SHA(s), separated by spaces. With exclude_commits=true, these commits are excluded from source_branch."
        required: false
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch. Required for branch-based operations."
        required: false
        type: string

      strategy:
        description: "How changes should be applied"
        required: false
        type: choice
        default: cherry-pick
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      exclude_commits:
        description: "Treat commits as exclusions from source_branch instead of inclusions."
        required: false
        type: boolean
        default: false

      patch_file:
        description: "Repository-relative path to .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom message for squash/merge commits. Empty = automatic."
        required: false
        type: string

      dry_run:
        description: "Validate and simulate the operation without pushing."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apply-changes-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:

  apply:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      STRATEGY: ${{ inputs.strategy }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config fetch.prune true
          git config core.quotePath false
          git config rerere.enabled true

          echo "Git version:"
          git --version

      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUTS"
          echo "========================================"
          echo "Strategy:        $STRATEGY"
          echo "Target branch:   $TARGET_BRANCH"
          echo "Source branch:   ${SOURCE_BRANCH:-<none>}"
          echo "Commits:         ${COMMITS_INPUT:-<none>}"
          echo "Exclude:         $EXCLUDE_COMMITS"
          echo "Patch:           ${PATCH_FILE:-<none>}"
          echo "Commit message:  ${COMMIT_MESSAGE:-<auto>}"
          echo "Dry run:         $DRY_RUN"
          echo "========================================"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::target_branch is empty."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::target_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::source_branch contains whitespace."
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" && "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::source_branch and target_branch cannot be the same."
            exit 1
          fi

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
                echo "::error::$STRATEGY requires source_branch or commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" && -z "$SOURCE_BRANCH" ]]; then
                echo "::error::exclude_commits requires source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with $STRATEGY."
                exit 1
              fi

              ;;

            rebase-branch)

              # A real rebase needs a branch.
              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::rebase-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$PATCH_FILE" ]]; then
                echo "::error::patch_file cannot be used with rebase-branch."
                exit 1
              fi

              ;;

            merge-branch)

              if [[ -z "$SOURCE_BRANCH" ]]; then
                echo "::error::merge-branch requires source_branch."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" ]]; then
                echo "::error::merge-branch does not accept commits."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::merge-branch cannot use exclude_commits."
                echo "::error::Use merge-selected instead."
                exit 1
              fi

              ;;

            apply-patch|apply-diff)

              if [[ -z "$PATCH_FILE" ]]; then
                echo "::error::$STRATEGY requires patch_file."
                exit 1
              fi

              if [[ -n "$COMMITS_INPUT" || -n "$SOURCE_BRANCH" ]]; then
                echo "::error::$STRATEGY does not use commits or source_branch."
                exit 1
              fi

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits cannot be used with patch/diff."
                exit 1
              fi

              ;;

            *)

              echo "::error::Unknown strategy: $STRATEGY"
              exit 1

              ;;
          esac

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            case "$STRATEGY" in
              cherry-pick|rebase-branch)
                echo "::notice::commit_message is ignored for $STRATEGY."
                ;;
            esac
          fi

      # ============================================================
      # CLEAN WORKTREE
      # ============================================================

      - name: Verify clean worktree
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      # ============================================================
      # FETCH TARGET
      # ============================================================

      - name: Fetch target branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          git reset --hard "$TARGET_SHA"

          echo "Target SHA:"
          echo "$TARGET_SHA"

      # ============================================================
      # FETCH SOURCE
      # ============================================================

      - name: Fetch source branch
        if: ${{ inputs.source_branch != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(git rev-parse "origin/$SOURCE_BRANCH")"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source SHA:"
          echo "$SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT COMMITS
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ inputs.commits != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if [[ ! "$commit" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Invalid commit SHA: $commit"
              exit 1
            fi

            git fetch \
              --no-tags \
              origin \
              "$commit"

          done < <(
            printf '%s\n' "$COMMITS_INPUT" |
            tr ' ' '\n'
          )

      # ============================================================
      # FIND MERGE BASE
      # ============================================================

      - name: Find merge base
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_DEEPEN=1048576
          DEEPEN=32

          while true; do

            if MERGE_BASE="$(
              git merge-base \
                "$TARGET_SHA" \
                "$SOURCE_SHA" \
                2>/dev/null
            )"; then

              echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

              echo "Merge base:"
              echo "$MERGE_BASE"

              break
            fi

            if [[ "$DEEPEN" -ge "$MAX_DEEPEN" ]]; then
              echo "::error::Unable to find merge base."
              exit 1
            fi

            echo "Merge base not found. Deepening history by $DEEPEN."

            git fetch \
              --no-tags \
              --deepen="$DEEPEN" \
              origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
              "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

            DEEPEN=$((DEEPEN * 2))

          done

      # ============================================================
      # BUILD SOURCE TOPOLOGICAL ORDER
      #
      # IMPORTANT:
      # No timestamp sorting.
      #
      # --topo-order:
      #   preserves graph topology.
      #
      # --reverse:
      #   oldest -> newest within that topology.
      #
      # --no-merges:
      #   merge commits are intentionally rejected for selective
      #   commit operations.
      # ============================================================

      - name: Build source commit order
        if: ${{ inputs.source_branch != '' && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' || inputs.strategy == 'rebase-branch') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ORDER="/tmp/source_order"

          git rev-list \
            --reverse \
            --topo-order \
            --no-merges \
            "$MERGE_BASE..$SOURCE_SHA" \
            > "$SOURCE_ORDER"

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            if [[ -s "$SOURCE_ORDER" ]]; then

              echo "Source commits:"
              cat "$SOURCE_ORDER"

            else

              echo "::notice::Source branch contains no non-merge commits after merge-base."

            fi

          fi

      # ============================================================
      # BUILD SELECTION FOR NON-REBASE MODES
      # ============================================================

      - name: Build commit selection
        if: ${{ inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ORDER="/tmp/source_order"
          INPUT_COMMITS="/tmp/input_commits"
          SELECTED="/tmp/selected_commits"
          FINAL="/tmp/final_commits"

          : > "$INPUT_COMMITS"
          : > "$SELECTED"
          : > "$FINAL"

          # ==========================================================
          # NORMALIZE INPUT SHA LIST
          #
          # sort -u is safe here because this is only the input set.
          # It does NOT define execution order.
          # ==========================================================

          if [[ -n "$COMMITS_INPUT" ]]; then

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$INPUT_COMMITS"

            done < <(
              printf '%s\n' "$COMMITS_INPUT" |
              tr ' ' '\n'
            )

            sort -u "$INPUT_COMMITS" -o "$INPUT_COMMITS"

          fi

          # ==========================================================
          # SOURCE BRANCH
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            # --------------------------------------------------------
            # Whole source branch
            # --------------------------------------------------------

            if [[ -z "$COMMITS_INPUT" ]]; then

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                echo "::error::exclude_commits=true requires SHA(s)."
                exit 1
              fi

              cp "$SOURCE_ORDER" "$SELECTED"

            # --------------------------------------------------------
            # Explicit inclusion
            # --------------------------------------------------------

            elif [[ "$EXCLUDE_COMMITS" != "true" ]]; then

              while IFS= read -r source_commit; do

                [[ -z "$source_commit" ]] && continue

                if grep -Fxq "$source_commit" "$INPUT_COMMITS"; then
                  echo "$source_commit" >> "$SELECTED"
                fi

              done < "$SOURCE_ORDER"

            # --------------------------------------------------------
            # Explicit exclusion
            # --------------------------------------------------------

            else

              while IFS= read -r source_commit; do

                [[ -z "$source_commit" ]] && continue

                if grep -Fxq "$source_commit" "$INPUT_COMMITS"; then

                  echo "Excluding:"
                  echo "$source_commit"

                  continue
                fi

                echo "$source_commit" >> "$SELECTED"

              done < "$SOURCE_ORDER"

            fi

          # ==========================================================
          # EXPLICIT SHAs WITHOUT SOURCE BRANCH
          # ==========================================================

          else

            if [[ -z "$COMMITS_INPUT" ]]; then
              echo "::error::No source_branch and no commits."
              exit 1
            fi

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "::error::exclude_commits requires source_branch."
              exit 1
            fi

            # We cannot know branch-relative order here.
            #
            # We therefore use Git's topology traversal over the
            # selected commits themselves.
            #
            # This is NOT timestamp sorting.
            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! grep -Fxq "$commit" "$SELECTED"; then
                echo "$commit" >> "$SELECTED"
              fi

            done < "$INPUT_COMMITS"

          fi

          # ==========================================================
          # REMOVE DUPLICATES WITHOUT SORTING
          # ==========================================================

          awk '!seen[$0]++' \
            "$SELECTED" \
            > "${SELECTED}.unique"

          mv \
            "${SELECTED}.unique" \
            "$SELECTED"

          # ==========================================================
          # VALIDATE SELECTED COMMITS
          # ==========================================================

          if [[ ! -s "$SELECTED" ]]; then
            echo "::error::No commits remain after selection."
            exit 1
          fi

          # ==========================================================
          # SOURCE MEMBERSHIP VALIDATION
          # ==========================================================

          if [[ -n "$SOURCE_BRANCH" ]]; then

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git merge-base \
                --is-ancestor \
                "$commit" \
                "$SOURCE_SHA"; then

                echo "::error::Selected commit is not part of source_branch:"
                echo "::error::$commit"

                exit 1
              fi

              PARENT_COUNT="$(
                git rev-list \
                  --parents \
                  -n 1 \
                  "$commit" |
                awk '{print NF-1}'
              )"

              if [[ "$PARENT_COUNT" -gt 1 ]]; then

                echo "::error::Merge commit cannot be selected:"
                echo "::error::$commit"
                echo "::error::Use merge-branch instead."

                exit 1
              fi

            done < "$SELECTED"

          fi

          # ==========================================================
          # REMOVE COMMITS ALREADY PRESENT IN TARGET
          #
          # This prevents accidental duplicate application.
          # ==========================================================

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if git merge-base \
              --is-ancestor \
              "$commit" \
              "$TARGET_SHA" \
              2>/dev/null; then

              echo "::warning::Already present in target. Skipping:"
              echo "::warning::$commit"

              continue
            fi

            echo "$commit" >> "$FINAL"

          done < "$SELECTED"

          if [[ ! -s "$FINAL" ]]; then

            echo "::error::No commits remain after duplicate/target filtering."
            exit 1

          fi

          {
            echo "COMMITS_TO_APPLY<<EOF"
            cat "$FINAL"
            echo "EOF"
          } >> "$GITHUB_ENV"

          # ==========================================================
          # SHOW FINAL ORDER
          # ==========================================================

          echo ""
          echo "========================================"
          echo "FINAL COMMIT ORDER"
          echo "========================================"

          POSITION=0

          while IFS= read -r commit; do

            POSITION=$((POSITION + 1))

            echo ""
            echo "#$POSITION"

            git show \
              -s \
              --format='SHA:         %H%nAuthor:       %an <%ae>%nAuthor date:  %aI%nCommitter:    %cn <%ce>%nCommit date:  %cI%nSubject:      %s' \
              "$commit"

          done < "$FINAL"

          echo ""
          echo "========================================"

      # ============================================================
      # PREPARE REAL REBASE
      #
      # This is the important difference:
      #
      # rebase-branch is now a REAL git rebase.
      #
      # We generate a custom todo list and let Git perform the
      # actual rebase onto TARGET_SHA.
      # ============================================================

      - name: Prepare rebase selection
        if: ${{ inputs.strategy == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ORDER="/tmp/source_order"
          INPUT_COMMITS="/tmp/input_commits"
          REBASE_SELECTED="/tmp/rebase_selected"

          : > "$REBASE_SELECTED"

          # ----------------------------------------------------------
          # Normalize explicit commits.
          # ----------------------------------------------------------

          if [[ -n "$COMMITS_INPUT" ]]; then

            : > "$INPUT_COMMITS"

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "::error::Commit not found: $commit"
                exit 1
              fi

              FULL_SHA="$(git rev-parse "$commit^{commit}")"

              echo "$FULL_SHA" >> "$INPUT_COMMITS"

            done < <(
              printf '%s\n' "$COMMITS_INPUT" |
              tr ' ' '\n'
            )

            sort -u "$INPUT_COMMITS" -o "$INPUT_COMMITS"

          fi

          # ----------------------------------------------------------
          # Build the exact commits that should survive rebase.
          #
          # IMPORTANT:
          # Order comes from SOURCE_ORDER.
          # ----------------------------------------------------------

          if [[ -z "$COMMITS_INPUT" ]]; then

            if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
              echo "::error::exclude_commits=true requires commits."
              exit 1
            fi

            cp "$SOURCE_ORDER" "$REBASE_SELECTED"

          elif [[ "$EXCLUDE_COMMITS" != "true" ]]; then

            while IFS= read -r source_commit; do

              [[ -z "$source_commit" ]] && continue

              if grep -Fxq "$source_commit" "$INPUT_COMMITS"; then
                echo "$source_commit" >> "$REBASE_SELECTED"
              fi

            done < "$SOURCE_ORDER"

          else

            while IFS= read -r source_commit; do

              [[ -z "$source_commit" ]] && continue

              if grep -Fxq "$source_commit" "$INPUT_COMMITS"; then

                echo "Rebase exclusion:"
                echo "$source_commit"

                continue
              fi

              echo "$source_commit" >> "$REBASE_SELECTED"

            done < "$SOURCE_ORDER"

          fi

          # ----------------------------------------------------------
          # Remove duplicate entries while preserving order.
          # ----------------------------------------------------------

          awk '!seen[$0]++' \
            "$REBASE_SELECTED" \
            > "${REBASE_SELECTED}.unique"

          mv \
            "${REBASE_SELECTED}.unique" \
            "$REBASE_SELECTED"

          if [[ ! -s "$REBASE_SELECTED" ]]; then
            echo "::error::No commits remain for rebase."
            exit 1
          fi

          # ----------------------------------------------------------
          # Validate every selected commit.
          # ----------------------------------------------------------

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            if ! git merge-base \
              --is-ancestor \
              "$commit" \
              "$SOURCE_SHA"; then

              echo "::error::Commit is not part of source branch:"
              echo "::error::$commit"

              exit 1
            fi

            PARENT_COUNT="$(
              git rev-list \
                --parents \
                -n 1 \
                "$commit" |
              awk '{print NF-1}'
            )"

            if [[ "$PARENT_COUNT" -gt 1 ]]; then

              echo "::error::Merge commits are not supported by selective rebase:"
              echo "::error::$commit"
              echo "::error::Use merge-branch or merge-selected."

              exit 1
            fi

          done < "$REBASE_SELECTED"

          # ----------------------------------------------------------
          # Save selected commits.
          # ----------------------------------------------------------

          {
            echo "REBASE_COMMITS<<EOF"
            cat "$REBASE_SELECTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "REBASE COMMITS"
          echo "========================================"

          POSITION=0

          while IFS= read -r commit; do

            POSITION=$((POSITION + 1))

            echo "$POSITION. $commit"
            echo "   $(git show -s --format='%s' "$commit")"

          done < "$REBASE_SELECTED"

          echo "========================================"

      # ============================================================
      # VALIDATE PATCH / DIFF
      # ============================================================

      - name: Validate patch or diff
        if: ${{ inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch/diff file does not exist:"
            echo "$PATCH_FILE"
            exit 1
          fi

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch/diff file is empty."
            exit 1
          fi

          if [[ "$STRATEGY" == "apply-diff" ]]; then

            git apply \
              --stat \
              "$PATCH_FILE"

            git apply \
              --check \
              "$PATCH_FILE"

          else

            if ! git mailinfo \
              /tmp/patch-message \
              /tmp/patch-info \
              < "$PATCH_FILE" \
              >/dev/null 2>&1; then

              echo "::error::Invalid format-patch file."
              exit 1

            fi

          fi

      # ============================================================
      # SHOW PLAN
      # ============================================================

      - name: Show planned operation
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
          REBASE_COMMITS: ${{ env.REBASE_COMMITS }}
        run: |
          set -Eeuo pipefail

          echo ""
          echo "========================================"
          echo "PLANNED OPERATION"
          echo "========================================"

          echo "Strategy:        $STRATEGY"
          echo "Target branch:   $TARGET_BRANCH"
          echo "Target SHA:      $TARGET_SHA"
          echo "Source branch:   ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:      ${SOURCE_SHA:-<none>}"
          echo "Merge base:      ${MERGE_BASE:-<none>}"
          echo "Exclude:         $EXCLUDE_COMMITS"
          echo "Dry run:         $DRY_RUN"

          echo ""

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            echo "Rebase commits:"

            POSITION=0

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              POSITION=$((POSITION + 1))

              echo "$POSITION. $commit"
              echo "   $(git show -s --format='%s' "$commit")"

            done <<< "$REBASE_COMMITS"

          elif [[ -n "${COMMITS_TO_APPLY:-}" ]]; then

            echo "Commits to apply:"

            POSITION=0

            while IFS= read -r commit; do

              [[ -z "$commit" ]] && continue

              POSITION=$((POSITION + 1))

              echo "$POSITION. $commit"
              echo "   $(git show -s --format='%s' "$commit")"

            done <<< "$COMMITS_TO_APPLY"

          fi

          echo "========================================"

      # ============================================================
      # REAL REBASE FUNCTION
      #
      # Uses GIT_SEQUENCE_EDITOR to transform Git's automatically
      # generated rebase todo.
      #
      # Every commit not present in REBASE_COMMITS becomes "drop".
      #
      # Then Git itself performs:
      #
      #   git rebase --onto TARGET_SHA MERGE_BASE SOURCE_SHA
      #
      # This gives us real rebase semantics while retaining our
      # selection/exclusion mechanism.
      # ============================================================

      - name: Rebase branch
        if: ${{ inputs.strategy == 'rebase-branch' && inputs.dry_run != true }}
        shell: bash
        env:
          REBASE_COMMITS: ${{ env.REBASE_COMMITS }}
        run: |
          set -Eeuo pipefail

          TODO_EDITOR="/tmp/rebase-todo-editor.sh"

          cat > "$TODO_EDITOR" <<'EDITOR'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          TODO_FILE="$1"
          SELECTED_FILE="/tmp/rebase_selected"

          TMP_FILE="${TODO_FILE}.tmp"

          awk '
            BEGIN {
              while ((getline line < "'"$SELECTED_FILE"'") > 0) {
                selected[line] = 1
              }
              close("'"$SELECTED_FILE"'")
            }

            /^[[:space:]]*pick[[:space:]]+[0-9a-fA-F]+/ {
              sha = $2

              if (sha in selected) {
                print
              } else {
                sub(/^[[:space:]]*pick[[:space:]]+/, "drop ")
                print
              }

              next
            }

            {
              print
            }
          ' "$TODO_FILE" > "$TMP_FILE"

          mv "$TMP_FILE" "$TODO_FILE"
          EDITOR

          chmod +x "$TODO_EDITOR"

          # Recreate the selected list because the environment variable
          # is not a filesystem object.
          printf '%s\n' "$REBASE_COMMITS" \
            > /tmp/rebase_selected

          export GIT_SEQUENCE_EDITOR="$TODO_EDITOR"

          echo ""
          echo "Starting real git rebase:"
          echo "  onto:     $TARGET_SHA"
          echo "  upstream: $MERGE_BASE"
          echo "  branch:   $SOURCE_SHA"
          echo ""

          # Checkout source branch in detached form.
          git switch \
            --detach \
            "$SOURCE_SHA"

          # Real rebase.
          #
          # --reapply-cherry-picks:
          # don't preemptively drop commits just because Git detects
          # an equivalent upstream cherry-pick.
          #
          # --empty=drop:
          # if a selected commit becomes empty after rebase, drop it.
          if ! git rebase \
            --onto "$TARGET_SHA" \
            --reapply-cherry-picks \
            --empty=drop \
            -i \
            "$MERGE_BASE"; then

            echo "::error::Rebase failed."

            echo ""
            echo "Current rebase patch:"
            git rebase --show-current-patch || true

            echo ""
            echo "Status:"
            git status --short || true

            git rebase --abort || true
            git switch --detach "$TARGET_SHA" || true
            git reset --hard "$TARGET_SHA"

            exit 1
          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          echo "REBASE_RESULT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

          echo ""
          echo "Rebase result:"
          echo "$FINAL_SHA"

      # ============================================================
      # DRY RUN REBASE
      # ============================================================

      - name: Dry run rebase
        if: ${{ inputs.strategy == 'rebase-branch' && inputs.dry_run == true }}
        shell: bash
        env:
          REBASE_COMMITS: ${{ env.REBASE_COMMITS }}
        run: |
          set -Eeuo pipefail

          TODO_EDITOR="/tmp/rebase-todo-editor.sh"

          cat > "$TODO_EDITOR" <<'EDITOR'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          TODO_FILE="$1"
          SELECTED_FILE="/tmp/rebase_selected"

          TMP_FILE="${TODO_FILE}.tmp"

          awk '
            BEGIN {
              while ((getline line < "'"$SELECTED_FILE"'") > 0) {
                selected[line] = 1
              }
              close("'"$SELECTED_FILE"'")
            }

            /^[[:space:]]*pick[[:space:]]+[0-9a-fA-F]+/ {
              sha = $2

              if (sha in selected) {
                print
              } else {
                sub(/^[[:space:]]*pick[[:space:]]+/, "drop ")
                print
              }

              next
            }

            {
              print
            }
          ' "$TODO_FILE" > "$TMP_FILE"

          mv "$TMP_FILE" "$TODO_FILE"
          EDITOR

          chmod +x "$TODO_EDITOR"

          printf '%s\n' "$REBASE_COMMITS" \
            > /tmp/rebase_selected

          export GIT_SEQUENCE_EDITOR="$TODO_EDITOR"

          TEMP_BRANCH="dry-run-rebase-${GITHUB_RUN_ID}"

          git switch \
            --create "$TEMP_BRANCH" \
            "$SOURCE_SHA"

          cleanup() {
            git rebase --abort >/dev/null 2>&1 || true
            git switch --detach "$TARGET_SHA" >/dev/null 2>&1 || true
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo ""
          echo "Dry-run real git rebase:"
          echo "  onto:     $TARGET_SHA"
          echo "  upstream: $MERGE_BASE"
          echo "  branch:   $SOURCE_SHA"
          echo ""

          if ! git rebase \
            --onto "$TARGET_SHA" \
            --reapply-cherry-picks \
            --empty=drop \
            -i \
            "$MERGE_BASE"; then

            echo "::error::Dry-run rebase failed."

            echo ""
            echo "Current patch:"
            git rebase --show-current-patch || true

            echo ""
            echo "Status:"
            git status --short || true

            git rebase --abort || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "DRY RUN REBASE RESULT"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            "$TARGET_SHA..HEAD"

          echo ""
          echo "No push performed."

      # ============================================================
      # DRY RUN CHERRY-PICK / SQUASH / MERGE-SELECTED
      # ============================================================

      - name: Dry run selected commits
        if: ${{ inputs.dry_run == true && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          TEMP_BRANCH="dry-run-${GITHUB_RUN_ID}"

          git switch \
            --create "$TEMP_BRANCH" \
            "$TARGET_SHA"

          cleanup() {
            git cherry-pick --abort >/dev/null 2>&1 || true
            git merge --abort >/dev/null 2>&1 || true
            git switch --detach "$TARGET_SHA" >/dev/null 2>&1 || true
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          case "$STRATEGY" in

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run cherry-pick failed:"
                  echo "$commit"

                  git cherry-pick --abort || true
                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            squash)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if ! git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run squash failed:"
                  echo "$commit"

                  git cherry-pick --abort || true
                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              git add -A

              if ! git diff --cached --quiet; then

                MESSAGE="${COMMIT_MESSAGE:-Squash selected commits}"

                git commit \
                  -m "$MESSAGE"

              fi

              ;;

            merge-selected)

              TEMP_SELECTED="dry-run-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_SELECTED" \
                "$TARGET_SHA"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Dry-run merge-selected failed:"
                  echo "$commit"

                  git cherry-pick --abort || true
                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              SELECTED_SHA="$(git rev-parse HEAD)"

              git switch "$TEMP_BRANCH"

              MESSAGE="${COMMIT_MESSAGE:-Merge selected commits}"

              if ! git merge \
                --no-ff \
                "$SELECTED_SHA" \
                -m "$MESSAGE"; then

                echo "::error::Dry-run merge-selected failed."

                git merge --abort || true
                exit 1

              fi

              git branch -D "$TEMP_SELECTED"

              ;;

          esac

          echo ""
          echo "========================================"
          echo "DRY RUN RESULT"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            "$TARGET_SHA..HEAD"

          echo ""
          echo "No push performed."

      # ============================================================
      # DRY RUN PATCH / DIFF
      # ============================================================

      - name: Dry run patch or diff
        if: ${{ inputs.dry_run == true && (inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TEMP_BRANCH="dry-run-${GITHUB_RUN_ID}"

          git switch \
            --create "$TEMP_BRANCH" \
            "$TARGET_SHA"

          cleanup() {
            git am --abort >/dev/null 2>&1 || true
            git switch --detach "$TARGET_SHA" >/dev/null 2>&1 || true
            git branch -D "$TEMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          if [[ "$STRATEGY" == "apply-patch" ]]; then

            if ! git am \
              --3way \
              --empty=drop \
              "$PATCH_FILE"; then

              echo "::error::Dry-run patch application failed."

              git am --show-current-patch=raw || true
              git am --abort || true

              exit 1
            fi

          else

            if ! git apply \
              --3way \
              "$PATCH_FILE"; then

              echo "::error::Dry-run diff application failed."
              git status --short || true

              exit 1
            fi

            git add -A

            if ! git diff --cached --quiet; then

              MESSAGE="${COMMIT_MESSAGE:-Apply diff: $(basename "$PATCH_FILE")}"

              git commit \
                -m "$MESSAGE"

            fi

          fi

          echo ""
          echo "========================================"
          echo "DRY RUN RESULT"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            "$TARGET_SHA..HEAD"

          echo ""
          echo "No push performed."

      # ============================================================
      # APPLY NON-REBASE STRATEGIES
      # ============================================================

      - name: Apply selected commits
        if: ${{ inputs.dry_run != true && (inputs.strategy == 'cherry-pick' || inputs.strategy == 'squash' || inputs.strategy == 'merge-selected') }}
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
        run: |
          set -Eeuo pipefail

          git switch \
            --create \
            "$TARGET_BRANCH" \
            "$TARGET_SHA"

          case "$STRATEGY" in

            cherry-pick)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Cherry-picking:"
                echo "$commit"

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Cherry-pick failed:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true
                  git reset --hard "$TARGET_SHA"

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              ;;

            squash)

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                echo "Adding to squash:"
                echo "$commit"

                if ! git cherry-pick \
                  --no-commit \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Squash failed:"
                  echo "$commit"

                  git status --short || true
                  git cherry-pick --abort || true
                  git reset --hard "$TARGET_SHA"

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              git add -A

              if git diff --cached --quiet; then
                echo "::error::Squash produced no changes."
                git reset --hard "$TARGET_SHA"
                exit 1
              fi

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              elif [[ -n "$SOURCE_BRANCH" ]]; then
                if [[ "$EXCLUDE_COMMITS" == "true" ]]; then
                  FINAL_MESSAGE="Squash $SOURCE_BRANCH excluding selected commits"
                else
                  FINAL_MESSAGE="Squash selected commits from $SOURCE_BRANCH"
                fi
              else
                FINAL_MESSAGE="Squash selected commits"
              fi

              git commit \
                -m "$FINAL_MESSAGE"

              ;;

            merge-selected)

              TEMP_BRANCH="merge-selected-${GITHUB_RUN_ID}"

              git switch \
                --create "$TEMP_BRANCH" \
                "$TARGET_SHA"

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                if ! git cherry-pick \
                  --empty=drop \
                  "$commit"; then

                  echo "::error::Selected commit could not be applied:"
                  echo "$commit"

                  git cherry-pick --abort || true
                  git switch --detach "$TARGET_SHA" || true
                  git branch -D "$TEMP_BRANCH" || true

                  exit 1
                fi

              done <<< "$COMMITS_TO_APPLY"

              SELECTED_SHA="$(git rev-parse HEAD)"

              git switch "$TARGET_BRANCH"

              if [[ -n "$COMMIT_MESSAGE" ]]; then
                FINAL_MESSAGE="$COMMIT_MESSAGE"
              elif [[ -n "$SOURCE_BRANCH" ]]; then
                FINAL_MESSAGE="Merge selected changes from $SOURCE_BRANCH"
              else
                FINAL_MESSAGE="Merge selected commits"
              fi

              if ! git merge \
                --no-ff \
                "$SELECTED_SHA" \
                -m "$FINAL_MESSAGE"; then

                echo "::error::merge-selected failed."

                git merge --abort || true
                git reset --hard "$TARGET_SHA"
                git branch -D "$TEMP_BRANCH" || true

                exit 1
              fi

              git branch -D "$TEMP_BRANCH"

              ;;

          esac

      # ============================================================
      # MERGE ENTIRE BRANCH
      # ============================================================

      - name: Merge branch
        if: ${{ inputs.dry_run != true && inputs.strategy == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch \
            --create \
            "$TARGET_BRANCH" \
            "$TARGET_SHA"

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            FINAL_MESSAGE="$COMMIT_MESSAGE"
          else
            FINAL_MESSAGE="Merge $SOURCE_BRANCH into $TARGET_BRANCH"
          fi

          if ! git merge \
            --no-ff \
            "$SOURCE_SHA" \
            -m "$FINAL_MESSAGE"; then

            echo "::error::merge-branch failed."

            git merge --abort || true
            git reset --hard "$TARGET_SHA"

            exit 1
          fi

      # ============================================================
      # APPLY PATCH / DIFF
      # ============================================================

      - name: Apply patch or diff
        if: ${{ inputs.dry_run != true && (inputs.strategy == 'apply-patch' || inputs.strategy == 'apply-diff') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch \
            --create \
            "$TARGET_BRANCH" \
            "$TARGET_SHA"

          if [[ "$STRATEGY" == "apply-patch" ]]; then

            if ! git am \
              --3way \
              --empty=drop \
              "$PATCH_FILE"; then

              echo "::error::Patch application failed."

              git am --show-current-patch=raw || true
              git am --abort || true
              git reset --hard "$TARGET_SHA"

              exit 1
            fi

          else

            if git apply \
              --check \
              --reverse \
              "$PATCH_FILE" \
              >/dev/null 2>&1; then

              echo "::error::Diff appears to be already applied."
              exit 1
            fi

            if ! git apply \
              --3way \
              "$PATCH_FILE"; then

              echo "::error::Diff application failed."

              git status --short || true
              git reset --hard "$TARGET_SHA"

              exit 1
            fi

            git add -A

            if git diff --cached --quiet; then
              echo "::error::Diff produced no changes."
              git reset --hard "$TARGET_SHA"
              exit 1
            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              FINAL_MESSAGE="$COMMIT_MESSAGE"
            else
              FINAL_MESSAGE="Apply diff: $(basename "$PATCH_FILE")"
            fi

            git commit \
              -m "$FINAL_MESSAGE"

          fi

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate result
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          if git rev-parse -q \
            --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved cherry-pick state."
            exit 1

          fi

          if git rev-parse -q \
            --verify MERGE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved merge state."
            exit 1

          fi

          if git rev-parse -q \
            --verify REBASE_HEAD >/dev/null 2>&1; then

            echo "::error::Unresolved rebase state."
            exit 1

          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1
          fi

          FINAL_SHA="$(git rev-parse HEAD)"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no changes."
            exit 1

          fi

          echo "Initial target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Final:"
          echo "$FINAL_SHA"

      # ============================================================
      # REMOTE RACE PROTECTION
      # ============================================================

      - name: Verify remote target is unchanged
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse "origin/$TARGET_BRANCH"
          )"

          echo "Expected target:"
          echo "$TARGET_SHA"

          echo ""
          echo "Current remote target:"
          echo "$CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."

            exit 1
          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            rebase-branch)

              echo "Pushing rebased branch with force-with-lease."

              git push \
                --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

            *)

              git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"

              ;;

          esac

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Job summary
        if: always()
        shell: bash
        env:
          COMMITS_TO_APPLY: ${{ env.COMMITS_TO_APPLY }}
          REBASE_COMMITS: ${{ env.REBASE_COMMITS }}
        run: |
          {
            echo "## Apply changes"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-}\` |"
            echo "| Merge base | \`${MERGE_BASE:-}\` |"
            echo "| Exclude | \`$EXCLUDE_COMMITS\` |"
            echo "| Dry run | \`$DRY_RUN\` |"

            echo ""
            echo "### Selected commits"

            if [[ "$STRATEGY" == "rebase-branch" && -n "${REBASE_COMMITS:-}" ]]; then

              POSITION=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                POSITION=$((POSITION + 1))

                SUBJECT="$(git show -s --format='%s' "$commit")"

                echo "$POSITION. \`$commit\` — $SUBJECT"

              done <<< "$REBASE_COMMITS"

            elif [[ -n "${COMMITS_TO_APPLY:-}" ]]; then

              POSITION=0

              while IFS= read -r commit; do

                [[ -z "$commit" ]] && continue

                POSITION=$((POSITION + 1))

                SUBJECT="$(git show -s --format='%s' "$commit")"

                echo "$POSITION. \`$commit\` — $SUBJECT"

              done <<< "$COMMITS_TO_APPLY"

            else

              echo "No explicit commit selection."

            fi

          } >> "$GITHUB_STEP_SUMMARY"
