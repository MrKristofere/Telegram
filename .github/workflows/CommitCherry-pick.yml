name: Apply commits to branch

on:
  workflow_dispatch:
    inputs:

      strategy:
        description: "How changes should be applied"
        required: true
        type: choice
        options:
          - cherry-pick
          - squash
          - merge-selected
          - merge-branch
          - rebase-branch
          - apply-patch
          - apply-diff

      target_branch:
        description: "Target branch"
        required: true
        type: string

      source_branch:
        description: "Source branch. Optional unless branch-based selection is required"
        required: false
        type: string

      commits:
        description: "Commit SHA(s), separated by spaces or new lines"
        required: false
        type: string

      exclude_commits:
        description: "Use source branch history EXCEPT the listed commits"
        required: false
        default: false
        type: boolean

      merge_mainline:
        description: "Parent number for merge commits used by squash/merge-selected"
        required: false
        default: "1"
        type: string

      patch_file:
        description: "Repository-relative .patch or .diff file"
        required: false
        type: string

      commit_message:
        description: "Custom final commit message"
        required: false
        type: string

      dry_run:
        description: "Validate and show planned operation without pushing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-commits-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:

  apply:
    runs-on: ubuntu-latest

    env:
      STRATEGY: ${{ inputs.strategy }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      COMMITS_INPUT: ${{ inputs.commits }}
      EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
      MERGE_MAINLINE: ${{ inputs.merge_mainline }}
      PATCH_FILE: ${{ inputs.patch_file }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          show-progress: false

      # ============================================================
      # CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config advice.detachedHead false
          git config merge.autoStash false

      # ============================================================
      # INPUT VALIDATION
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "INPUT VALIDATION"
          echo "========================================"

          case "$STRATEGY" in
            cherry-pick)
              ;;
            squash)
              ;;
            merge-selected)
              ;;
            merge-branch)
              ;;
            rebase-branch)
              ;;
            apply-patch)
              ;;
            apply-diff)
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # TARGET
          # --------------------------------------------------------

          [[ -n "$TARGET_BRANCH" ]] || {
            echo "::error::target_branch is required"
            exit 1
          }

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1 || {
            echo "::error::Invalid target branch: $TARGET_BRANCH"
            exit 1
          }

          # --------------------------------------------------------
          # SOURCE
          # --------------------------------------------------------

          if [[ -n "$SOURCE_BRANCH" ]]; then
            git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null 2>&1 || {
              echo "::error::Invalid source branch: $SOURCE_BRANCH"
              exit 1
            }
          fi

          # --------------------------------------------------------
          # MERGE MAINLINE
          # --------------------------------------------------------

          if ! [[ "$MERGE_MAINLINE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::merge_mainline must be a positive integer"
            exit 1
          fi

          # --------------------------------------------------------
          # PATCH / DIFF
          # --------------------------------------------------------

          if [[ "$STRATEGY" == "apply-patch" || "$STRATEGY" == "apply-diff" ]]; then

            [[ -n "$PATCH_FILE" ]] || {
              echo "::error::patch_file is required for $STRATEGY"
              exit 1
            }

            [[ -f "$PATCH_FILE" ]] || {
              echo "::error::Patch/diff file does not exist: $PATCH_FILE"
              exit 1
            }

            if [[ "$STRATEGY" == "apply-patch" ]]; then

              if [[ ! "$PATCH_FILE" =~ \.patch$ ]]; then
                echo "::warning::apply-patch is being used with a file that does not end in .patch"
              fi

            fi

            if [[ "$STRATEGY" == "apply-diff" ]]; then

              if [[ ! "$PATCH_FILE" =~ \.(diff|patch)$ ]]; then
                echo "::warning::apply-diff is being used with a file that does not end in .diff/.patch"
              fi

            fi

          else

            if [[ -n "$PATCH_FILE" ]]; then
              echo "::error::patch_file can only be used with apply-patch/apply-diff"
              exit 1
            fi

          fi

          # --------------------------------------------------------
          # SOURCE REQUIREMENTS
          # --------------------------------------------------------

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              [[ -n "$SOURCE_BRANCH" ]] || {
                echo "::error::$STRATEGY requires source_branch"
                exit 1
              }

              ;;

          esac

          # --------------------------------------------------------
          # EXCLUDE
          # --------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            [[ -n "$SOURCE_BRANCH" ]] || {
              echo "::error::exclude_commits=true requires source_branch"
              exit 1
            }

            [[ -n "$COMMITS_INPUT" ]] || {
              echo "::error::exclude_commits=true requires commits"
              exit 1
            }

          fi

          # --------------------------------------------------------
          # SELECTION REQUIREMENTS
          # --------------------------------------------------------

          case "$STRATEGY" in

            cherry-pick|squash|merge-selected)

              if [[ -z "$SOURCE_BRANCH" && -z "$COMMITS_INPUT" ]]; then
                echo "::error::$STRATEGY requires source_branch or commits"
                exit 1
              fi

              ;;

          esac

          # --------------------------------------------------------
          # COMMIT MESSAGE
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            case "$STRATEGY" in

              cherry-pick)
                ;;

              squash)
                ;;

              merge-selected|merge-branch)
                ;;

              apply-patch|apply-diff)
                ;;

              rebase-branch)
                echo "::error::commit_message is not supported for rebase-branch"
                exit 1
                ;;

            esac

          fi

          echo "Inputs are valid."

      # ============================================================
      # FETCH TARGET
      #
      # Partial clone keeps blobs out until they are needed.
      # ============================================================

      - name: Fetch target branch
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Fetching target branch..."

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          TARGET_SHA="$(
            git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          echo "Target SHA: $TARGET_SHA"

      # ============================================================
      # FETCH SOURCE
      # ============================================================

      - name: Fetch source branch
        if: ${{ env.SOURCE_BRANCH != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Fetching source branch..."

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          SOURCE_SHA="$(
            git rev-parse "refs/remotes/origin/$SOURCE_BRANCH^{commit}"
          )"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source SHA: $SOURCE_SHA"

      # ============================================================
      # FETCH EXPLICIT SHAs
      #
      # Explicit SHA does NOT need to belong to source_branch.
      # ============================================================

      - name: Fetch explicit commits
        if: ${{ env.COMMITS_INPUT != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_raw"
          touch "$RUNNER_TEMP/input_raw"

          printf '%s\n' "$COMMITS_INPUT" \
            | tr ' ' '\n' \
            | sed '/^[[:space:]]*$/d' \
            > "$RUNNER_TEMP/input_raw"

          while IFS= read -r value; do

            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"

            [[ -n "$value" ]] || continue

            if [[ ! "$value" =~ ^[0-9a-fA-F]{7,64}$ ]]; then
              echo "::error::Invalid commit SHA: $value"
              exit 1
            fi

            if git cat-file -e "$value^{commit}" 2>/dev/null; then
              continue
            fi

            echo "Fetching commit object: $value"

            git fetch \
              --no-tags \
              --filter=blob:none \
              origin \
              "$value"

          done < "$RUNNER_TEMP/input_raw"

      # ============================================================
      # NORMALIZE EXPLICIT SHAs
      # ============================================================

      - name: Normalize commit list
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/input_commits"
          touch "$RUNNER_TEMP/input_commits"

          while IFS= read -r value; do

            [[ -n "$value" ]] || continue

            sha="$(
              git rev-parse "$value^{commit}" 2>/dev/null
            )" || {
              echo "::error::Commit not found: $value"
              exit 1
            }

            echo "$sha"

          done < "$RUNNER_TEMP/input_raw" \
            | awk '!seen[$0]++' \
            > "$RUNNER_TEMP/input_commits"

          INPUT_COUNT="$(
            wc -l < "$RUNNER_TEMP/input_commits" | tr -d ' '
          )"

          echo "INPUT_COUNT=$INPUT_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Normalized commits:"
          cat "$RUNNER_TEMP/input_commits" || true

      # ============================================================
      # MERGE BASE
      #
      # If there are multiple best merge bases, stop rather than
      # silently selecting an arbitrary one.
      # ============================================================

      - name: Resolve merge base
        if: ${{ env.SOURCE_SHA != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t BASES < <(
            git merge-base --all "$TARGET_SHA" "$SOURCE_SHA"
          )

          if (( ${#BASES[@]} == 0 )); then

            echo "::error::Target and source have no common merge base."
            echo "::error::Use an explicit commit selection or merge unrelated histories explicitly."
            exit 1

          fi

          if (( ${#BASES[@]} > 1 )); then

            echo "::error::Target and source have multiple merge bases."
            echo "::error::Workflow refuses to choose one implicitly."

            printf '%s\n' "${BASES[@]}"

            exit 1

          fi

          MERGE_BASE="${BASES[0]}"

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          echo "Merge base: $MERGE_BASE"

      # ============================================================
      # BUILD SOURCE HISTORY
      # ============================================================

      - name: Build source history
        if: ${{ env.SOURCE_SHA != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git rev-list \
            --topo-order \
            --reverse \
            "$MERGE_BASE..$SOURCE_SHA" \
            > "$RUNNER_TEMP/source_history"

          SOURCE_COUNT="$(
            wc -l < "$RUNNER_TEMP/source_history" | tr -d ' '
          )"

          echo "SOURCE_COUNT=$SOURCE_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Source history: $SOURCE_COUNT commits"

      # ============================================================
      # BUILD UNIFIED PLAN
      #
      # This is the most important part.
      #
      # The execution steps below NEVER decide which commits to use.
      # They only consume selected_commits.
      # ============================================================

      - name: Build unified selection plan
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/candidates"
          rm -f "$RUNNER_TEMP/selected"
          rm -f "$RUNNER_TEMP/excluded"

          touch \
            "$RUNNER_TEMP/candidates" \
            "$RUNNER_TEMP/selected" \
            "$RUNNER_TEMP/excluded"

          # --------------------------------------------------------
          # Determine candidates
          # --------------------------------------------------------

          case "$STRATEGY" in

            merge-branch|rebase-branch)

              cp \
                "$RUNNER_TEMP/source_history" \
                "$RUNNER_TEMP/candidates"

              ;;

            cherry-pick|squash|merge-selected)

              if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/candidates"

              elif [[ -n "$COMMITS_INPUT" ]]; then

                cp \
                  "$RUNNER_TEMP/input_commits" \
                  "$RUNNER_TEMP/candidates"

              elif [[ -n "$SOURCE_BRANCH" ]]; then

                cp \
                  "$RUNNER_TEMP/source_history" \
                  "$RUNNER_TEMP/candidates"

              fi

              ;;

            apply-patch|apply-diff)
              ;;

          esac

          # --------------------------------------------------------
          # Exclusions
          # --------------------------------------------------------

          if [[ "$EXCLUDE_COMMITS" == "true" ]]; then

            cp \
              "$RUNNER_TEMP/input_commits" \
              "$RUNNER_TEMP/excluded"

            awk '
              NR == FNR {
                excluded[$1] = 1
                next
              }

              !excluded[$1] {
                print $1
              }
            ' \
              "$RUNNER_TEMP/excluded" \
              "$RUNNER_TEMP/candidates" \
              > "$RUNNER_TEMP/selected"

          else

            cp \
              "$RUNNER_TEMP/candidates" \
              "$RUNNER_TEMP/selected"

          fi

          # --------------------------------------------------------
          # Remove duplicates
          # --------------------------------------------------------

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/selected.unique"

          mv \
            "$RUNNER_TEMP/selected.unique" \
            "$RUNNER_TEMP/selected"

          # --------------------------------------------------------
          # If source history exists, reorder selected commits
          # according to source topology.
          #
          # Explicit commits outside source history remain valid.
          # They are appended in their explicit input order.
          # --------------------------------------------------------

          if [[ -s "$RUNNER_TEMP/source_history" && -s "$RUNNER_TEMP/selected" ]]; then

            awk '
              NR == FNR {
                source[$1] = ++order
                next
              }

              {
                selected[$1] = 1
                input[++n] = $1
              }

              END {
                for (i = 1; i <= n; i++) {
                  if (input[i] in source)
                    in_source[++a] = input[i]
                  else
                    outside[++b] = input[i]
                }

                for (i = 1; i <= a; i++)
                  printf "%d\t%s\n", source[in_source[i]], in_source[i]

                print "---"

                for (i = 1; i <= b; i++)
                  print outside[i]
              }
            ' \
              "$RUNNER_TEMP/source_history" \
              "$RUNNER_TEMP/selected" \
              > "$RUNNER_TEMP/ordered_raw"

            sed '/^---$/d' "$RUNNER_TEMP/ordered_raw" \
              | sort -n -k1,1 \
              | cut -f2 \
              > "$RUNNER_TEMP/in_source"

            awk '
              found {
                print
                next
              }

              $0 == "---" {
                found = 1
              }
            ' \
              "$RUNNER_TEMP/ordered_raw" \
              > "$RUNNER_TEMP/outside"

            cat \
              "$RUNNER_TEMP/in_source" \
              "$RUNNER_TEMP/outside" \
              > "$RUNNER_TEMP/selected.final"

            mv \
              "$RUNNER_TEMP/selected.final" \
              "$RUNNER_TEMP/selected"

          fi

          # --------------------------------------------------------
          # Final duplicate protection
          # --------------------------------------------------------

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/selected.unique"

          mv \
            "$RUNNER_TEMP/selected.unique" \
            "$RUNNER_TEMP/selected"

          SELECTED_COUNT="$(
            wc -l < "$RUNNER_TEMP/selected" | tr -d ' '
          )"

          echo "SELECTED_COUNT=$SELECTED_COUNT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "UNIFIED PLAN"
          echo "========================================"

          echo "Strategy:        $STRATEGY"
          echo "Target:          $TARGET_BRANCH"
          echo "Source:          ${SOURCE_BRANCH:-<none>}"
          echo "Exclude:         $EXCLUDE_COMMITS"
          echo "Input commits:   $INPUT_COUNT"
          echo "Selected:        $SELECTED_COUNT"
          echo "Mainline:        $MERGE_MAINLINE"
          echo

          if [[ -s "$RUNNER_TEMP/selected" ]]; then

            while IFS= read -r sha; do

              echo "$sha"
              echo "  $(git log -1 --format='%s' "$sha")"

            done < "$RUNNER_TEMP/selected"

          else

            echo "<none>"

          fi

      # ============================================================
      # EMPTY SELECTION VALIDATION
      # ============================================================

      - name: Validate selection
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$STRATEGY" in

            apply-patch|apply-diff)
              exit 0
              ;;

            merge-branch)
              exit 0
              ;;

          esac

          if [[ "$SELECTED_COUNT" -eq 0 ]]; then

            echo "::error::The operation has no selected commits."
            echo "::error::Check source_branch, commits and exclude_commits."
            exit 1

          fi

      # ============================================================
      # ANALYZE MERGE COMMITS
      # ============================================================

      - name: Analyze merge commits
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/merge_commits"
          touch "$RUNNER_TEMP/merge_commits"

          while IFS= read -r sha; do

            parents="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha"
            )"

            parent_count="$(
              awk '{print NF-1}' <<< "$parents"
            )"

            if (( parent_count > 1 )); then
              echo "$sha" >> "$RUNNER_TEMP/merge_commits"
            fi

          done < "$RUNNER_TEMP/selected"

          MERGE_COUNT="$(
            wc -l < "$RUNNER_TEMP/merge_commits" | tr -d ' '
          )"

          echo "MERGE_COUNT=$MERGE_COUNT" >> "$GITHUB_ENV"

          case "$STRATEGY" in

            cherry-pick|rebase-branch)

              if (( MERGE_COUNT > 0 )); then

                echo "::error::$STRATEGY does not support merge commits."

                echo "Merge commits:"
                cat "$RUNNER_TEMP/merge_commits"

                echo
                echo "Use squash or merge-selected instead."

                exit 1

              fi

              ;;

            squash|merge-selected)

              if (( MERGE_COUNT > 0 )); then

                echo "Merge commits are allowed for $STRATEGY."
                echo "Mainline parent: $MERGE_MAINLINE"

              fi

              ;;

          esac

      # ============================================================
      # VALIDATE MERGE MAINLINE
      # ============================================================

      - name: Validate merge mainline
        if: ${{ env.MERGE_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r sha; do

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" \
                | awk '{print NF-1}'
            )"

            if (( MERGE_MAINLINE > parent_count )); then

              echo "::error::Commit $sha has $parent_count parents, but merge_mainline=$MERGE_MAINLINE"
              exit 1

            fi

          done < "$RUNNER_TEMP/merge_commits"

      # ============================================================
      # DEPENDENCY CHECK
      #
      # We don't silently invent missing ancestors.
      #
      # If a selected commit has a direct parent that was explicitly
      # excluded, fail because the user's requested history is
      # internally inconsistent.
      # ============================================================

      - name: Check excluded dependencies
        if: ${{ env.EXCLUDE_COMMITS == 'true' && env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r selected_sha; do

            while IFS= read -r parent_sha; do

              [[ -n "$parent_sha" ]] || continue

              if grep -qx "$parent_sha" "$RUNNER_TEMP/excluded"; then

                echo "::error::Selected commit depends directly on an excluded parent."
                echo "::error::Selected: $selected_sha"
                echo "::error::Excluded parent: $parent_sha"

                exit 1

              fi

            done < <(
              git rev-list \
                --parents \
                -n 1 \
                "$selected_sha" \
                | cut -d' ' -f2-
            )

          done < "$RUNNER_TEMP/selected"

      # ============================================================
      # BUILD TARGET PATCH-ID INDEX
      #
      # One traversal instead of:
      # selected commits × complete target history.
      # ============================================================

      - name: Build target patch-id index
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/target_patch_ids"
          touch "$RUNNER_TEMP/target_patch_ids"

          git log \
            --format='%H' \
            --no-merges \
            "$TARGET_SHA" \
            > "$RUNNER_TEMP/target_normal_commits"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            patch_id="$(
              git diff-tree \
                --root \
                --patch \
                "$sha" \
                | git patch-id --stable \
                | awk '{print $1}'
            )"

            [[ -n "$patch_id" ]] || continue

            printf '%s\t%s\n' \
              "$patch_id" \
              "$sha"

          done < "$RUNNER_TEMP/target_normal_commits" \
            > "$RUNNER_TEMP/target_patch_ids"

      # ============================================================
      # ALREADY-APPLIED ANALYSIS
      # ============================================================

      - name: Analyze already applied commits
        if: ${{ env.SELECTED_COUNT != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$RUNNER_TEMP/already_applied"
          touch "$RUNNER_TEMP/already_applied"

          while IFS= read -r sha; do

            [[ -n "$sha" ]] || continue

            # ------------------------------------------------------
            # Exact ancestry check.
            #
            # This also handles merge commits.
            # ------------------------------------------------------

            if git merge-base --is-ancestor "$sha" "$TARGET_SHA"; then

              echo "$sha" >> "$RUNNER_TEMP/already_applied"

              echo "Already present in target history: $sha"

              continue

            fi

            # ------------------------------------------------------
            # Patch equivalence only for non-merge commits.
            # ------------------------------------------------------

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" \
                | awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then
              continue
            fi

            patch_id="$(
              git diff-tree \
                --root \
                --patch \
                "$sha" \
                | git patch-id --stable \
                | awk '{print $1}'
            )"

            [[ -n "$patch_id" ]] || continue

            if awk -F '\t' -v wanted="$patch_id" '
              $1 == wanted {
                found = 1
                exit
              }

              END {
                exit(found ? 0 : 1)
              }
            ' "$RUNNER_TEMP/target_patch_ids"; then

              echo "$sha" >> "$RUNNER_TEMP/already_applied"

              echo "Patch-equivalent commit already exists: $sha"

            fi

          done < "$RUNNER_TEMP/selected"

          awk '!seen[$0]++' \
            "$RUNNER_TEMP/already_applied" \
            > "$RUNNER_TEMP/already_applied.unique"

          mv \
            "$RUNNER_TEMP/already_applied.unique" \
            "$RUNNER_TEMP/already_applied"

          ALREADY_COUNT="$(
            wc -l < "$RUNNER_TEMP/already_applied" | tr -d ' '
          )"

          echo "ALREADY_COUNT=$ALREADY_COUNT" >> "$GITHUB_ENV"

      # ============================================================
      # FINAL EXECUTION PLAN
      # ============================================================

      - name: Build executable plan
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -vxFf \
            "$RUNNER_TEMP/already_applied" \
            "$RUNNER_TEMP/selected" \
            > "$RUNNER_TEMP/executable" || true

          EXECUTABLE_COUNT="$(
            wc -l < "$RUNNER_TEMP/executable" | tr -d ' '
          )"

          echo "EXECUTABLE_COUNT=$EXECUTABLE_COUNT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "EXECUTABLE PLAN"
          echo "========================================"

          if [[ -s "$RUNNER_TEMP/executable" ]]; then

            while IFS= read -r sha; do

              echo "$sha"
              echo "  $(git log -1 --format='%s' "$sha")"

            done < "$RUNNER_TEMP/executable"

          else

            echo "<none>"

          fi

      # ============================================================
      # DRY RUN
      # ============================================================

      - name: Dry run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "DRY RUN"
          echo "========================================"

          echo "Strategy:          $STRATEGY"
          echo "Target:            $TARGET_BRANCH"
          echo "Target SHA:        $TARGET_SHA"
          echo "Source:            ${SOURCE_BRANCH:-<none>}"
          echo "Source SHA:        ${SOURCE_SHA:-<none>}"
          echo "Merge base:        ${MERGE_BASE:-<none>}"
          echo "Exclude:           $EXCLUDE_COMMITS"
          echo "Input commits:     $INPUT_COUNT"
          echo "Selected commits:  $SELECTED_COUNT"
          echo "Already applied:   $ALREADY_COUNT"
          echo "To execute:        $EXECUTABLE_COUNT"
          echo "Merge commits:     $MERGE_COUNT"
          echo "Mainline:          $MERGE_MAINLINE"
          echo "Patch file:        ${PATCH_FILE:-<none>}"
          echo "Message:           ${COMMIT_MESSAGE:-<automatic>}"
          echo
          echo "No changes were made and nothing will be pushed."

      # ============================================================
      # PREPARE TARGET
      # ============================================================

      - name: Prepare target
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git switch --detach "$TARGET_SHA"

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is not clean."
            git status --short

            exit 1

          fi

      # ============================================================
      # CHERRY-PICK
      # ============================================================

      - name: Execute cherry-pick
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'cherry-pick' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -s "$RUNNER_TEMP/executable" ]] || {
            echo "::error::No changes remain after duplicate/already-applied filtering."
            exit 1
          }

          COUNT="$EXECUTABLE_COUNT"

          while IFS= read -r sha; do

            echo
            echo "Cherry-pick: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            if [[ "$COUNT" -eq 1 && -n "$COMMIT_MESSAGE" ]]; then

              if ! git cherry-pick \
                --no-commit \
                --empty=stop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

              if git diff --cached --quiet; then

                git reset --hard "$TARGET_SHA"

                echo "::error::Cherry-pick produced no changes: $sha"
                exit 1

              fi

              git commit -m "$COMMIT_MESSAGE"

            else

              if ! git cherry-pick \
                --no-edit \
                --empty=stop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Cherry-pick failed: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

      # ============================================================
      # SQUASH
      #
      # Merge commits are supported.
      # ============================================================

      - name: Execute squash
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'squash' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -s "$RUNNER_TEMP/executable" ]] || {
            echo "::error::No changes remain after filtering."
            exit 1
          }

          BASE="$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Squash apply: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" \
                | awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              echo "Merge commit."
              echo "Mainline: $MERGE_MAINLINE"

              if ! git cherry-pick \
                --no-commit \
                --mainline "$MERGE_MAINLINE" \
                --empty=keep \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BASE"

                echo "::error::Failed to apply merge commit: $sha"
                exit 1

              fi

            else

              if ! git cherry-pick \
                --no-commit \
                --empty=keep \
                "$sha"; then

                git cherry-pick --abort || true
                git reset --hard "$BASE"

                echo "::error::Failed to apply commit: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          # --------------------------------------------------------
          # All changes may have become redundant.
          # Do not create an empty squash commit.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            git reset --hard "$BASE"

            echo "::error::Squash produced no changes."
            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Squash selected commits from ${SOURCE_BRANCH:-source}"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # REBASE-BRANCH
      #
      # This is intentionally selective replay, not raw git rebase.
      # ============================================================

      - name: Execute rebase-branch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'rebase-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -s "$RUNNER_TEMP/executable" ]] || {
            echo "::error::No changes remain after filtering."
            exit 1
          }

          while IFS= read -r sha; do

            echo
            echo "Replay: $sha"
            echo "Subject: $(git log -1 --format='%s' "$sha")"

            if ! git cherry-pick \
              --no-edit \
              --empty=stop \
              "$sha"; then

              git cherry-pick --abort || true

              echo "::error::Replay failed: $sha"
              exit 1

            fi

          done < "$RUNNER_TEMP/executable"

      # ============================================================
      # MERGE BRANCH
      # ============================================================

      - name: Validate branch merge
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git merge-base --is-ancestor "$SOURCE_SHA" "$TARGET_SHA"; then

            echo "::warning::Source branch is already fully contained in target."
            echo "::warning::No merge is necessary."

            exit 1

          fi

          if git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then

            echo "Source contains target. A non-fast-forward merge will still be created because merge-branch uses --no-ff."

          fi

      - name: Execute merge-branch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'merge-branch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # --------------------------------------------------------
          # Test the actual merge without touching the worktree.
          # --------------------------------------------------------

          if ! git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SOURCE_SHA" \
            > "$RUNNER_TEMP/merge_tree_output"; then

            echo "::error::Source branch cannot be merged cleanly into target."

            cat "$RUNNER_TEMP/merge_tree_output"

            exit 1

          fi

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SOURCE_SHA"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SOURCE_SHA"

          fi

      # ============================================================
      # MERGE SELECTED
      #
      # Selected commits are replayed onto a temporary branch.
      # That selected history is then merged into target.
      # ============================================================

      - name: Execute merge-selected
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'merge-selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -s "$RUNNER_TEMP/executable" ]] || {
            echo "::error::No changes remain after filtering."
            exit 1
          }

          TMP_BRANCH="workflow-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            git branch -D "$TMP_BRANCH" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          git switch -c "$TMP_BRANCH" "$TARGET_SHA"

          while IFS= read -r sha; do

            echo
            echo "Selected merge replay: $sha"

            parent_count="$(
              git rev-list \
                --parents \
                -n 1 \
                "$sha" \
                | awk '{print NF-1}'
            )"

            if (( parent_count > 1 )); then

              if ! git cherry-pick \
                --no-edit \
                --mainline "$MERGE_MAINLINE" \
                --empty=stop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay merge commit: $sha"
                exit 1

              fi

            else

              if ! git cherry-pick \
                --no-edit \
                --empty=stop \
                "$sha"; then

                git cherry-pick --abort || true

                echo "::error::Failed to replay commit: $sha"
                exit 1

              fi

            fi

          done < "$RUNNER_TEMP/executable"

          SELECTED_HEAD="$(git rev-parse HEAD)"

          if [[ "$SELECTED_HEAD" == "$TARGET_SHA" ]]; then

            echo "::error::Selected commits produced no changes."
            exit 1

          fi

          # --------------------------------------------------------
          # Return to target.
          # --------------------------------------------------------

          git switch --detach "$TARGET_SHA"

          # --------------------------------------------------------
          # Validate final merge without touching index first.
          # --------------------------------------------------------

          if ! git merge-tree \
            --write-tree \
            "$TARGET_SHA" \
            "$SELECTED_HEAD" \
            > "$RUNNER_TEMP/selected_merge_tree"; then

            echo "::error::Selected history cannot be merged into target."

            cat "$RUNNER_TEMP/selected_merge_tree"

            exit 1

          fi

          # --------------------------------------------------------
          # Create actual merge.
          # --------------------------------------------------------

          if [[ -n "$COMMIT_MESSAGE" ]]; then

            git merge \
              --no-ff \
              --no-edit \
              -m "$COMMIT_MESSAGE" \
              "$SELECTED_HEAD"

          else

            git merge \
              --no-ff \
              --no-edit \
              "$SELECTED_HEAD"

          fi

      # ============================================================
      # APPLY PATCH
      # ============================================================

      - name: Execute apply-patch
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'apply-patch' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git apply \
            --check \
            --3way \
            "$PATCH_FILE"

          if ! git apply \
            --3way \
            "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Patch produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply patch: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # APPLY DIFF
      # ============================================================

      - name: Execute apply-diff
        if: ${{ env.DRY_RUN != 'true' && env.STRATEGY == 'apply-diff' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git apply \
            --check \
            "$PATCH_FILE"

          if ! git apply "$PATCH_FILE"; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff application failed."
            exit 1

          fi

          if git diff --quiet; then

            git reset --hard "$TARGET_SHA"

            echo "::error::Diff produced no changes."
            exit 1

          fi

          git add -A

          if [[ -n "$COMMIT_MESSAGE" ]]; then
            MESSAGE="$COMMIT_MESSAGE"
          else
            MESSAGE="Apply diff: $(basename "$PATCH_FILE")"
          fi

          git commit -m "$MESSAGE"

      # ============================================================
      # FINAL LOCAL VALIDATION
      # ============================================================

      - name: Final local validation
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_SHA="$(git rev-parse HEAD)"

          echo "Initial target: $TARGET_SHA"
          echo "Final SHA:      $FINAL_SHA"

          if [[ "$FINAL_SHA" == "$TARGET_SHA" ]]; then

            echo "::error::Operation produced no changes."
            exit 1

          fi

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "::error::Working tree is dirty."
            git status --short

            exit 1

          fi

          git cat-file -e "$FINAL_SHA^{commit}" || {
            echo "::error::Final SHA is not a valid commit."
            exit 1
          }

          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      # ============================================================
      # REMOTE RACE CHECK
      #
      # Never push if target moved since planning.
      # ============================================================

      - name: Verify target has not changed
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch \
            --no-tags \
            --prune \
            --filter=blob:none \
            origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          CURRENT_REMOTE_SHA="$(
            git rev-parse \
              "refs/remotes/origin/$TARGET_BRANCH^{commit}"
          )"

          echo "Original target: $TARGET_SHA"
          echo "Current remote:  $CURRENT_REMOTE_SHA"

          if [[ "$CURRENT_REMOTE_SHA" != "$TARGET_SHA" ]]; then

            echo "::error::Target branch changed while workflow was running."
            echo "::error::Push cancelled."

            exit 1

          fi

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push result
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$STRATEGY" == "rebase-branch" ]]; then

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          else

            git push \
              origin \
              "HEAD:refs/heads/$TARGET_BRANCH"

          fi

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply commits"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`$STRATEGY\` |"
            echo "| Target | \`$TARGET_BRANCH\` |"
            echo "| Target SHA | \`${TARGET_SHA:-unknown}\` |"
            echo "| Source | \`${SOURCE_BRANCH:-<none>}\` |"
            echo "| Source SHA | \`${SOURCE_SHA:-<none>}\` |"
            echo "| Merge base | \`${MERGE_BASE:-<none>}\` |"
            echo "| Exclude | \`$EXCLUDE_COMMITS\` |"
            echo "| Input commits | \`${INPUT_COUNT:-0}\` |"
            echo "| Selected commits | \`${SELECTED_COUNT:-0}\` |"
            echo "| Already applied | \`${ALREADY_COUNT:-0}\` |"
            echo "| Executed | \`${EXECUTABLE_COUNT:-0}\` |"
            echo "| Merge commits | \`${MERGE_COUNT:-0}\` |"
            echo "| Mainline | \`$MERGE_MAINLINE\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Final SHA | \`${FINAL_SHA:-<not created>}\` |"
            echo
            echo "### Selected commits"
            echo

            if [[ -s "$RUNNER_TEMP/selected" ]]; then

              while IFS= read -r sha; do

                echo "- \`$sha\` — $(git log -1 --format='%s' "$sha" 2>/dev/null || echo 'unknown')"

              done < "$RUNNER_TEMP/selected"

            else

              echo "_none_"

            fi

          } >> "$GITHUB_STEP_SUMMARY"
