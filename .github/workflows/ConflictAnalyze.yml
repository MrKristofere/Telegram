name: Analyze selected commits

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by a space"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare analysis file
        run: |
          mkdir -p analysis
          : > analysis/conflict-analysis.txt

      - name: Analyze commits
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          for commit in $COMMITS; do

            {
              echo ""
              echo "========================================"
              echo "Processing: $commit"
              echo "========================================"
            } | tee -a analysis/conflict-analysis.txt

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then

              echo "Commit is not available locally. Fetching..." | tee -a analysis/conflict-analysis.txt

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: commit not found" | tee -a analysis/conflict-analysis.txt
                continue
              fi
            fi

            echo "Commit found: $commit" | tee -a analysis/conflict-analysis.txt

            AUTHOR_NAME=$(git log -1 --format='%an' "$commit" 2>/dev/null || true)
            AUTHOR_EMAIL=$(git log -1 --format='%ae' "$commit" 2>/dev/null || true)
            AUTHOR_DATE=$(git log -1 --format='%aI' "$commit" 2>/dev/null || true)

            echo "Author: $AUTHOR_NAME <$AUTHOR_EMAIL>" | tee -a analysis/conflict-analysis.txt
            echo "Author date: $AUTHOR_DATE" | tee -a analysis/conflict-analysis.txt

            PARENT=$(git rev-parse "$commit^" 2>/dev/null || true)

            if [ -n "$PARENT" ]; then
              echo "Parent: $PARENT" | tee -a analysis/conflict-analysis.txt
            else
              echo "Parent: none" | tee -a analysis/conflict-analysis.txt
            fi

            {
              echo ""
              echo "----------------------------------------"
              echo "Original commit diff"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            if [ -n "$PARENT" ]; then
              git diff --no-ext-diff "$PARENT" "$commit" 2>&1 | tee -a analysis/conflict-analysis.txt || true
            else
              git show --format=fuller --stat "$commit" 2>&1 | tee -a analysis/conflict-analysis.txt || true
            fi

            {
              echo ""
              echo "----------------------------------------"
              echo "Trying cherry-pick --no-commit"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            if git cherry-pick --no-commit "$commit"; then

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "NO CONFLICT" | tee -a analysis/conflict-analysis.txt
              echo "Commit can be applied cleanly." | tee -a analysis/conflict-analysis.txt

              git reset --hard HEAD

              continue
            fi

            {
              echo ""
              echo "========================================"
              echo "CONFLICT DETECTED"
              echo "========================================"
            } | tee -a analysis/conflict-analysis.txt

            {
              echo ""
              echo "----------------------------------------"
              echo "Git status"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            git status --short 2>&1 | tee -a analysis/conflict-analysis.txt || true

            {
              echo ""
              echo "----------------------------------------"
              echo "Unmerged files"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            git diff --name-only --diff-filter=U 2>&1 | tee -a analysis/conflict-analysis.txt || true

            {
              echo ""
              echo "----------------------------------------"
              echo "Index stages"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            git ls-files --unmerged 2>&1 | tee -a analysis/conflict-analysis.txt || true

            {
              echo ""
              echo "----------------------------------------"
              echo "Combined conflict diff"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            git diff --cc 2>&1 | tee -a analysis/conflict-analysis.txt || true

            {
              echo ""
              echo "----------------------------------------"
              echo "Normal conflict diff"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            git diff 2>&1 | tee -a analysis/conflict-analysis.txt || true

            {
              echo ""
              echo "----------------------------------------"
              echo "Detailed file analysis"
              echo "----------------------------------------"
            } | tee -a analysis/conflict-analysis.txt

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            while IFS= read -r file; do

              [ -z "$file" ] && continue

              {
                echo ""
                echo "========================================"
                echo "CONFLICT FILE:"
                echo "$file"
                echo "========================================"
              } | tee -a analysis/conflict-analysis.txt

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "File status:" | tee -a analysis/conflict-analysis.txt
              git status --short -- "$file" 2>&1 | tee -a analysis/conflict-analysis.txt || true

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "Index entries:" | tee -a analysis/conflict-analysis.txt
              git ls-files --stage -- "$file" 2>&1 | tee -a analysis/conflict-analysis.txt || true

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- BASE (stage 1) -----" | tee -a analysis/conflict-analysis.txt

              if git show ":1:$file" > /tmp/base_file 2>/dev/null; then
                wc -l /tmp/base_file | tee -a analysis/conflict-analysis.txt
                cat /tmp/base_file | tee -a analysis/conflict-analysis.txt
              else
                echo "[No BASE version]" | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- OURS / TARGET (stage 2) -----" | tee -a analysis/conflict-analysis.txt

              if git show ":2:$file" > /tmp/ours_file 2>/dev/null; then
                wc -l /tmp/ours_file | tee -a analysis/conflict-analysis.txt
                cat /tmp/ours_file | tee -a analysis/conflict-analysis.txt
              else
                echo "[No OURS version]" | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- THEIRS / SOURCE COMMIT (stage 3) -----" | tee -a analysis/conflict-analysis.txt

              if git show ":3:$file" > /tmp/theirs_file 2>/dev/null; then
                wc -l /tmp/theirs_file | tee -a analysis/conflict-analysis.txt
                cat /tmp/theirs_file | tee -a analysis/conflict-analysis.txt
              else
                echo "[No THEIRS version]" | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- CURRENT WORKTREE -----" | tee -a analysis/conflict-analysis.txt

              if [ -f "$file" ]; then
                wc -l "$file" | tee -a analysis/conflict-analysis.txt
                cat "$file" | tee -a analysis/conflict-analysis.txt
              else
                echo "[File does not exist in working tree]" | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- DIFF: BASE -> OURS -----" | tee -a analysis/conflict-analysis.txt

              if [ -f /tmp/base_file ] && [ -f /tmp/ours_file ]; then
                diff -u /tmp/base_file /tmp/ours_file 2>&1 | tee -a analysis/conflict-analysis.txt || true
              elif [ -f /tmp/base_file ]; then
                echo "OURS deleted the file." | tee -a analysis/conflict-analysis.txt
              elif [ -f /tmp/ours_file ]; then
                echo "OURS added the file." | tee -a analysis/conflict-analysis.txt
              else
                echo "No BASE or OURS version." | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- DIFF: BASE -> THEIRS -----" | tee -a analysis/conflict-analysis.txt

              if [ -f /tmp/base_file ] && [ -f /tmp/theirs_file ]; then
                diff -u /tmp/base_file /tmp/theirs_file 2>&1 | tee -a analysis/conflict-analysis.txt || true
              elif [ -f /tmp/base_file ]; then
                echo "THEIRS deleted the file." | tee -a analysis/conflict-analysis.txt
              elif [ -f /tmp/theirs_file ]; then
                echo "THEIRS added the file." | tee -a analysis/conflict-analysis.txt
              else
                echo "No BASE or THEIRS version." | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- DIFF: OURS -> THEIRS -----" | tee -a analysis/conflict-analysis.txt

              if [ -f /tmp/ours_file ] && [ -f /tmp/theirs_file ]; then
                diff -u /tmp/ours_file /tmp/theirs_file 2>&1 | tee -a analysis/conflict-analysis.txt || true
              elif [ -f /tmp/ours_file ]; then
                echo "THEIRS deleted the file." | tee -a analysis/conflict-analysis.txt
              elif [ -f /tmp/theirs_file ]; then
                echo "THEIRS added the file." | tee -a analysis/conflict-analysis.txt
              else
                echo "No OURS or THEIRS version." | tee -a analysis/conflict-analysis.txt
              fi

              echo "" | tee -a analysis/conflict-analysis.txt
              echo "----- Conflict markers in working tree -----" | tee -a analysis/conflict-analysis.txt

              if [ -f "$file" ]; then
                grep -n -E '^(<<<<<<<|=======|>>>>>>>)' "$file" 2>&1 | tee -a analysis/conflict-analysis.txt || true
              else
                echo "No working tree file." | tee -a analysis/conflict-analysis.txt
              fi

            done <<< "$CONFLICTED_FILES"

            {
              echo ""
              echo "========================================"
              echo "END ANALYSIS: $commit"
              echo "========================================"
              echo ""
              echo "This commit was NOT applied."
              echo "Repository will be restored before processing the next commit."
            } | tee -a analysis/conflict-analysis.txt

            git reset --hard HEAD

          done

      - name: Create summary
        if: always()
        run: |
          {
            echo "# Conflict Analysis"
            echo ""
            echo "Source repository: ${{ inputs.source_repository }}"
            echo "Source branch: ${{ inputs.source_branch }}"
            echo "Target branch: ${{ inputs.target_branch }}"
            echo ""
            echo "Commits:"
            for commit in ${{ inputs.commits }}; do
              echo "- $commit"
            done
            echo ""
            echo "Detailed analysis is available in the artifact."
          } > analysis/summary.md

          cat analysis/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload conflict analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conflict-analysis-${{ github.run_number }}
          path: analysis/
          if-no-files-found: error
          retention-days: 30
