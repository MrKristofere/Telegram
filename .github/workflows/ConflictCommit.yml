name: Conflict Commit Cherry-pick

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by spaces"
        required: true
        type: string

      exclude_paths:
        description: "Exclusions: SHA:path,path SHA:path"
        required: false
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > /tmp/applied.log
          : > /tmp/modified.log
          : > /tmp/skipped.log

      - name: Cherry-pick selected commits
        env:
          COMMITS: ${{ inputs.commits }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"

            # --------------------------------------------------
            # Find commit.
            # --------------------------------------------------

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then

              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: $commit"
                echo "$commit | commit not found or cannot be fetched" >> /tmp/skipped.log

                continue
              fi
            fi

            echo "Commit found: $commit"

            # --------------------------------------------------
            # Save commit message.
            # --------------------------------------------------

            git log -1 --format=%B "$commit" > /tmp/commit_message

            # --------------------------------------------------
            # Find exclusions for this commit.
            #
            # Format:
            #
            # SHA:path,path
            # --------------------------------------------------

            EXCLUDED=""

            for rule in $EXCLUDE_PATHS; do

              RULE_SHA="${rule%%:*}"

              if [ "$RULE_SHA" = "$commit" ]; then
                EXCLUDED="${rule#*:}"

                echo "Excluded paths:"
                echo "$EXCLUDED"

                break
              fi

            done

            # --------------------------------------------------
            # Apply commit.
            #
            # If exclusions exist, build a patch without those
            # paths and apply only the remaining changes.
            # --------------------------------------------------

            if [ -n "$EXCLUDED" ]; then

              echo "Applying commit with exclusions..."

              EXCLUDE_ARGS=()

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                # Remove invisible Unicode direction marks.
                path="$(printf '%s' "$path" | tr -d '\u200e\u200f\u202a\u202b\u202c\u202d\u202e')"

                # Normalize path.
                path="${path#./}"
                path="${path#/}"

                echo "Excluding: [$path]"

                EXCLUDE_ARGS+=(":(exclude)$path")

              done

              IFS="$OLDIFS"

              # ------------------------------------------------
              # Create filtered patch.
              # ------------------------------------------------

              PATCH_FILE="$(mktemp)"

              git diff \
                --binary \
                "$commit^" "$commit" \
                -- . "${EXCLUDE_ARGS[@]}" \
                > "$PATCH_FILE"

              # ------------------------------------------------
              # Apply filtered patch.
              # ------------------------------------------------

              if git apply --3way --index "$PATCH_FILE"; then

                echo "Filtered patch applied successfully."

                rm -f "$PATCH_FILE"

              else

                echo "Filtered patch could not be applied cleanly."

                rm -f "$PATCH_FILE"

                # Reset anything left by git apply.
                git reset --hard HEAD

                # ------------------------------------------------
                # Fall back to normal cherry-pick so the existing
                # conflict-resolution logic can handle conflicts.
                # ------------------------------------------------

                if git cherry-pick --no-commit "$commit"; then

                  echo "Fallback cherry-pick completed without conflicts."

                else

                  echo "Conflict detected."

                  CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

                  echo "Conflicted files:"
                  echo "$CONFLICTED_FILES"

                  UNEXPECTED_CONFLICT=0
                  RESOLVED_FILES=""

                  # ----------------------------------------------
                  # Process conflicted files.
                  # ----------------------------------------------

                  while IFS= read -r file; do

                    [ -z "$file" ] && continue

                    FOUND=0

                    OLDIFS="$IFS"
                    IFS=','

                    for excluded_path in $EXCLUDED; do

                      excluded_path="$(printf '%s' "$excluded_path" | tr -d '\u200e\u200f\u202a\u202b\u202c\u202d\u202e')"
                      excluded_path="${excluded_path#./}"
                      excluded_path="${excluded_path#/}"

                      normalized_file="${file#./}"
                      normalized_file="${normalized_file#/}"

                      if [ "$normalized_file" = "$excluded_path" ]; then
                        FOUND=1
                        break
                      fi

                    done

                    IFS="$OLDIFS"

                    # --------------------------------------------
                    # Explicitly excluded conflict.
                    # --------------------------------------------

                    if [ "$FOUND" -eq 1 ]; then

                      echo "Resolving excluded conflict: $file"

                      if git cat-file -e "HEAD:$file" 2>/dev/null; then

                        echo "Target contains $file."
                        echo "Keeping target version."

                        git restore \
                          --source=HEAD \
                          --staged \
                          --worktree \
                          -- "$file"

                      else

                        echo "Target deleted $file."
                        echo "Keeping deletion."

                        git rm \
                          -f \
                          --ignore-unmatch \
                          -- "$file" || true

                        rm -f -- "$file" || true

                      fi

                      if [ -n "$RESOLVED_FILES" ]; then
                        RESOLVED_FILES="$RESOLVED_FILES, $file"
                      else
                        RESOLVED_FILES="$file"
                      fi

                    else

                      echo "Unexpected conflict: $file"
                      UNEXPECTED_CONFLICT=1

                    fi

                  done <<< "$CONFLICTED_FILES"

                  # ----------------------------------------------
                  # Unexpected conflict.
                  # ----------------------------------------------

                  if [ "$UNEXPECTED_CONFLICT" -eq 1 ]; then

                    echo "Skipping $commit because of unspecified conflict."

                    git reset --hard HEAD

                    echo "$commit | unspecified conflict: $CONFLICTED_FILES" >> /tmp/skipped.log

                    continue

                  fi

                  # ----------------------------------------------
                  # All conflicts explicitly handled.
                  # ----------------------------------------------

                  echo "All conflicts were explicitly handled."

                  git add -A

                  # ----------------------------------------------
                  # Make sure no unmerged paths remain.
                  # ----------------------------------------------

                  if git diff --name-only --diff-filter=U | grep -q .; then

                    echo "ERROR: Unresolved conflicts remain."

                    git reset --hard HEAD

                    echo "$commit | unresolved conflicts remain after exclusions" >> /tmp/skipped.log

                    continue

                  fi

                fi

              fi

            else

              # --------------------------------------------------
              # No exclusions.
              # Use normal cherry-pick.
              # --------------------------------------------------

              if git cherry-pick --no-commit "$commit"; then

                echo "Cherry-pick completed without conflicts."

              else

                echo "Conflict detected."

                CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

                echo "Conflicted files:"
                echo "$CONFLICTED_FILES"

                UNEXPECTED_CONFLICT=1

                git reset --hard HEAD

                echo "$commit | unspecified conflict: $CONFLICTED_FILES" >> /tmp/skipped.log

                continue

              fi

            fi

            # --------------------------------------------------
            # Verify excluded paths.
            #
            # This is the important safety check:
            # if an excluded file somehow appears in the staged
            # diff, do NOT create the commit.
            # --------------------------------------------------

            EXCLUDED_FOUND=0

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                path="$(printf '%s' "$path" | tr -d '\u200e\u200f\u202a\u202b\u202c\u202d\u202e')"
                path="${path#./}"
                path="${path#/}"

                echo "Verifying exclusion: [$path]"

                if git diff --cached --name-only -- "$path" | grep -Fxq "$path"; then

                  echo "ERROR: Excluded path is still staged: $path"

                  EXCLUDED_FOUND=1

                else

                  echo "Verified exclusion: $path"

                fi

              done

              IFS="$OLDIFS"

            fi

            # --------------------------------------------------
            # Never create a commit if an excluded file remains.
            # --------------------------------------------------

            if [ "$EXCLUDED_FOUND" -ne 0 ]; then

              echo "ERROR: Excluded files are present in the staged diff."
              echo "Skipping $commit."

              git reset --hard HEAD

              echo "$commit | excluded paths verification failed" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Stage everything.
            # --------------------------------------------------

            git add -A

            # --------------------------------------------------
            # Verify exclusions again after git add -A.
            # --------------------------------------------------

            EXCLUDED_FOUND=0

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                path="$(printf '%s' "$path" | tr -d '\u200e\u200f\u202a\u202b\u202c\u202d\u202e')"
                path="${path#./}"
                path="${path#/}"

                if git diff --cached --name-only -- "$path" | grep -Fxq "$path"; then

                  echo "ERROR: Excluded path is still staged after git add -A: $path"

                  EXCLUDED_FOUND=1

                else

                  echo "Verified after staging: $path"

                fi

              done

              IFS="$OLDIFS"

            fi

            if [ "$EXCLUDED_FOUND" -ne 0 ]; then

              echo "ERROR: Excluded files are still present."
              echo "Skipping $commit."

              git reset --hard HEAD

              echo "$commit | excluded paths remained after staging" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Nothing remains.
            # --------------------------------------------------

            if git diff --cached --quiet; then

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | nothing to apply after exclusions" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Create commit.
            # --------------------------------------------------

            if git commit \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
              --file=/tmp/commit_message
            then

              if [ -n "$EXCLUDED" ]; then

                echo "MODIFIED: $commit"
                echo "$commit | applied with exclusions: $EXCLUDED" >> /tmp/modified.log

              else

                echo "APPLIED: $commit"
                echo "$commit | applied" >> /tmp/applied.log

              fi

            else

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create commit" >> /tmp/skipped.log

            fi

          done

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"

      - name: Summary
        if: always()
        run: |
          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/applied.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/applied.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with exclusions" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/modified.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/modified.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/skipped.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/skipped.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi
