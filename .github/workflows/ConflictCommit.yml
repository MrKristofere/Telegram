name: Conflict Commit Cherry-pick

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by spaces"
        required: true
        type: string

      exclude_paths:
        description: "Exclusions: SHA:path,path SHA:path"
        required: false
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > /tmp/applied.log
          : > /tmp/modified.log
          : > /tmp/skipped.log

      - name: Cherry-pick selected commits
        env:
          COMMITS: ${{ inputs.commits }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          # ----------------------------------------------------------
          # Normalize a path.
          #
          # Removes Unicode Format characters such as:
          # U+200E LEFT-TO-RIGHT MARK
          # U+200F RIGHT-TO-LEFT MARK
          # and other Unicode \p{Cf} characters.
          #
          # Also removes leading ./ and /.
          # ----------------------------------------------------------
          normalize_path() {
            local path="$1"

            path="$(printf '%s' "$path" | perl -CS -pe 's/\p{Cf}//g')"

            path="${path#./}"
            path="${path#/}"

            printf '%s' "$path"
          }

          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"

            # --------------------------------------------------
            # Find commit.
            # --------------------------------------------------

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then

              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: $commit"
                echo "$commit | commit not found or cannot be fetched" >> /tmp/skipped.log

                continue
              fi
            fi

            echo "Commit found: $commit"

            # --------------------------------------------------
            # Save commit message.
            # --------------------------------------------------

            git log -1 --format=%B "$commit" > /tmp/commit_message

            # --------------------------------------------------
            # Find exclusions for this commit.
            #
            # Format:
            #
            # SHA:path,path
            # --------------------------------------------------

            EXCLUDED=""

            for rule in $EXCLUDE_PATHS; do

              RULE_SHA="${rule%%:*}"

              if [ "$RULE_SHA" = "$commit" ]; then
                EXCLUDED="${rule#*:}"
                break
              fi

            done

            echo ""
            echo "Exclusion rule for commit:"
            printf 'RAW: [%s]\n' "$EXCLUDED"

            # --------------------------------------------------
            # Normalize every excluded path.
            # --------------------------------------------------

            NORMALIZED_EXCLUDED=""

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                RAW_PATH="$path"

                path="$(normalize_path "$path")"

                echo "----------------------------------------"
                printf 'RAW PATH:        [%s]\n' "$RAW_PATH"
                printf 'NORMALIZED PATH: [%s]\n' "$path"

                if [ -z "$path" ]; then
                  echo "WARNING: Empty exclusion path after normalization."
                  continue
                fi

                if [ -n "$NORMALIZED_EXCLUDED" ]; then
                  NORMALIZED_EXCLUDED="$NORMALIZED_EXCLUDED,$path"
                else
                  NORMALIZED_EXCLUDED="$path"
                fi

              done

              IFS="$OLDIFS"

            fi

            EXCLUDED="$NORMALIZED_EXCLUDED"

            echo ""
            echo "Final normalized exclusions:"
            if [ -n "$EXCLUDED" ]; then
              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do
                printf '  [%s]\n' "$path"
              done

              IFS="$OLDIFS"
            else
              echo "  None"
            fi

            # --------------------------------------------------
            # Apply commit without creating commit.
            # --------------------------------------------------

            if git cherry-pick --no-commit "$commit"; then

              echo "Cherry-pick completed without conflicts."

              # ------------------------------------------------
              # Explicit exclusions even if there was no conflict.
              # ------------------------------------------------

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for path in $EXCLUDED; do

                  path="$(normalize_path "$path")"

                  echo ""
                  echo "Excluding: [$path]"

                  # --------------------------------------------
                  # If file exists in HEAD, restore target version.
                  # --------------------------------------------

                  if git cat-file -e "HEAD:$path" 2>/dev/null; then

                    echo "Target contains [$path]."
                    echo "Restoring target version."

                    git restore \
                      --source=HEAD \
                      --staged \
                      --worktree \
                      -- "$path"

                  else

                    # ------------------------------------------
                    # File does not exist in target branch.
                    # Remove imported version completely.
                    # ------------------------------------------

                    echo "Target does not contain [$path]."
                    echo "Removing imported version."

                    git rm \
                      -f \
                      --ignore-unmatch \
                      -- "$path" || true

                    rm -f -- "$path" || true

                  fi

                done

                IFS="$OLDIFS"

              fi

              # ------------------------------------------------
              # Stage everything.
              # ------------------------------------------------

              git add -A

              # ------------------------------------------------
              # Verify excluded paths are NOT part of commit.
              # ------------------------------------------------

              EXCLUSION_VIOLATION=0

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for path in $EXCLUDED; do

                  path="$(normalize_path "$path")"

                  if git diff --cached --name-only --diff-filter=ACMRTUXB -- "$path" | grep -Fxq "$path"; then

                    echo ""
                    echo "ERROR: Excluded path is still staged:"
                    echo "[$path]"

                    EXCLUSION_VIOLATION=1

                  else

                    echo "Verified excluded path:"
                    echo "[$path]"

                  fi

                done

                IFS="$OLDIFS"

              fi

              # ------------------------------------------------
              # If exclusion verification failed, abort commit.
              # ------------------------------------------------

              if [ "$EXCLUSION_VIOLATION" -eq 1 ]; then

                echo ""
                echo "ERROR: One or more excluded paths are still present."
                echo "Resetting cherry-pick."

                git reset --hard HEAD

                echo "$commit | excluded paths still present after filtering" >> /tmp/skipped.log

                continue

              fi

              # ------------------------------------------------
              # Nothing remains.
              # ------------------------------------------------

              if git diff --cached --quiet; then

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | nothing to apply after exclusions" >> /tmp/skipped.log

                continue

              fi

              # ------------------------------------------------
              # Create new commit.
              # ------------------------------------------------

              if git commit \
                --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
                --file=/tmp/commit_message
              then

                if [ -n "$EXCLUDED" ]; then

                  echo "MODIFIED: $commit"

                  echo "$commit | applied with exclusions: $EXCLUDED" >> /tmp/modified.log

                else

                  echo "APPLIED: $commit"

                  echo "$commit | applied" >> /tmp/applied.log

                fi

              else

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | failed to create commit" >> /tmp/skipped.log

              fi

              continue
            fi

            # --------------------------------------------------
            # Conflict detected.
            # --------------------------------------------------

            echo "Conflict detected."

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            echo "Conflicted files:"
            echo "$CONFLICTED_FILES"

            UNEXPECTED_CONFLICT=0
            RESOLVED_FILES=""

            # --------------------------------------------------
            # Process conflicted files.
            # --------------------------------------------------

            while IFS= read -r file; do

              [ -z "$file" ] && continue

              file="$(normalize_path "$file")"

              FOUND=0

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for excluded_path in $EXCLUDED; do

                  excluded_path="$(normalize_path "$excluded_path")"

                  if [ "$file" = "$excluded_path" ]; then

                    FOUND=1

                    break

                  fi

                done

                IFS="$OLDIFS"

              fi

              # ------------------------------------------------
              # Explicitly excluded conflict.
              # ------------------------------------------------

              if [ "$FOUND" -eq 1 ]; then

                echo "Resolving excluded conflict: [$file]"

                # ----------------------------------------------
                # If target branch has this file:
                # restore target version.
                #
                # If target branch deleted this file:
                # remove it completely.
                # ----------------------------------------------

                if git cat-file -e "HEAD:$file" 2>/dev/null; then

                  echo "Target contains [$file]."
                  echo "Keeping target version."

                  git restore \
                    --source=HEAD \
                    --staged \
                    --worktree \
                    -- "$file"

                else

                  echo "Target deleted [$file]."
                  echo "Keeping deletion."

                  git rm \
                    -f \
                    --ignore-unmatch \
                    -- "$file" || true

                  rm -f -- "$file" || true

                fi

                if [ -n "$RESOLVED_FILES" ]; then

                  RESOLVED_FILES="$RESOLVED_FILES, $file"

                else

                  RESOLVED_FILES="$file"

                fi

              else

                # ------------------------------------------------
                # Conflict was not specified by user.
                # ------------------------------------------------

                echo "Unexpected conflict: [$file]"

                UNEXPECTED_CONFLICT=1

              fi

            done <<< "$CONFLICTED_FILES"

            # --------------------------------------------------
            # Unexpected conflict.
            # --------------------------------------------------

            if [ "$UNEXPECTED_CONFLICT" -eq 1 ]; then

              echo "Skipping $commit because of unspecified conflict."

              git reset --hard HEAD

              echo "$commit | unspecified conflict: $CONFLICTED_FILES" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # All conflicts were explicitly handled.
            # --------------------------------------------------

            echo "All conflicts were explicitly handled."

            git add -A

            # --------------------------------------------------
            # Make sure no unmerged paths remain.
            # --------------------------------------------------

            if git diff --name-only --diff-filter=U | grep -q .; then

              echo "ERROR: Unresolved conflicts remain."

              git reset --hard HEAD

              echo "$commit | unresolved conflicts remain after exclusions" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Verify excluded paths are NOT part of commit.
            # --------------------------------------------------

            EXCLUSION_VIOLATION=0

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                path="$(normalize_path "$path")"

                if git diff --cached --name-only --diff-filter=ACMRTUXB -- "$path" | grep -Fxq "$path"; then

                  echo ""
                  echo "ERROR: Excluded path is still staged:"
                  echo "[$path]"

                  EXCLUSION_VIOLATION=1

                else

                  echo "Verified excluded path:"
                  echo "[$path]"

                fi

              done

              IFS="$OLDIFS"

            fi

            # --------------------------------------------------
            # Exclusion verification failed.
            # --------------------------------------------------

            if [ "$EXCLUSION_VIOLATION" -eq 1 ]; then

              echo ""
              echo "ERROR: One or more excluded paths are still present."

              git reset --hard HEAD

              echo "$commit | excluded paths still present after conflict resolution" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Nothing remains.
            # --------------------------------------------------

            if git diff --cached --quiet; then

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | all changes were excluded" >> /tmp/skipped.log

              continue

            fi

            # --------------------------------------------------
            # Create modified commit.
            # --------------------------------------------------

            if git commit \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
              --file=/tmp/commit_message
            then

              echo "MODIFIED: $commit"

              echo "$commit | applied with excluded paths: $RESOLVED_FILES" >> /tmp/modified.log

            else

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create modified commit" >> /tmp/skipped.log

            fi

          done

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"

      - name: Summary
        if: always()
        run: |
          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/applied.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/applied.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with exclusions" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/modified.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/modified.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/skipped.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/skipped.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi
