name: Conflict Commit Cherry-pick

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by spaces"
        required: true
        type: string

      exclude_paths:
        description: "Exclusions: SHA:path,path"
        required: false
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > /tmp/applied.log
          : > /tmp/modified.log
          : > /tmp/skipped.log

      - name: Cherry-pick selected commits
        env:
          COMMITS: ${{ inputs.commits }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |

          # ==========================================================
          # Normalize path
          # ==========================================================

          normalize_path() {
            local path="$1"

            # Remove Unicode Format characters:
            # U+200E LEFT-TO-RIGHT MARK
            # U+200F RIGHT-TO-LEFT MARK
            # and other Unicode \p{Cf} characters.
            path="$(printf '%s' "$path" | perl -CS -pe 's/\p{Cf}//g')"

            # Normalize leading ./ and /
            path="${path#./}"
            path="${path#/}"

            printf '%s' "$path"
          }


          # ==========================================================
          # Process commits
          # ==========================================================

          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"


            # ========================================================
            # Find commit
            # ========================================================

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then

              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then

                echo "SKIPPED: $commit"

                echo "$commit | commit not found or cannot be fetched" \
                  >> /tmp/skipped.log

                continue
              fi
            fi

            echo "Commit found: $commit"


            # ========================================================
            # Save commit message
            # ========================================================

            git log -1 --format=%B "$commit" > /tmp/commit_message


            # ========================================================
            # Find exclusions for this commit
            #
            # Format:
            #
            # SHA:path,path
            # ========================================================

            EXCLUDED=""

            for rule in $EXCLUDE_PATHS; do

              RULE_SHA="${rule%%:*}"

              if [ "$RULE_SHA" = "$commit" ]; then

                EXCLUDED="${rule#*:}"

                break
              fi

            done


            # ========================================================
            # Normalize ALL excluded paths
            # ========================================================

            NORMALIZED_EXCLUDED=""

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                RAW_PATH="$path"

                path="$(normalize_path "$path")"

                echo ""
                echo "Exclusion path:"
                printf 'RAW:        [%s]\n' "$RAW_PATH"
                printf 'NORMALIZED: [%s]\n' "$path"

                if [ -z "$path" ]; then
                  echo "WARNING: empty exclusion path after normalization"
                  continue
                fi

                if [ -n "$NORMALIZED_EXCLUDED" ]; then
                  NORMALIZED_EXCLUDED="$NORMALIZED_EXCLUDED,$path"
                else
                  NORMALIZED_EXCLUDED="$path"
                fi

              done

              IFS="$OLDIFS"

            fi

            EXCLUDED="$NORMALIZED_EXCLUDED"


            # ========================================================
            # Show final exclusions
            # ========================================================

            echo ""
            echo "Final normalized exclusions:"

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do
                printf '  [%s]\n' "$path"
              done

              IFS="$OLDIFS"

            else

              echo "  None"

            fi


            # ========================================================
            # First attempt:
            # cherry-pick without creating commit
            # ========================================================

            if git cherry-pick --no-commit "$commit"; then

              echo ""
              echo "Cherry-pick completed without conflicts."


              # ======================================================
              # IMPORTANT:
              #
              # Restore EVERY excluded file.
              #
              # This is required even when the file did NOT have
              # a merge conflict.
              # ======================================================

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for path in $EXCLUDED; do

                  path="$(normalize_path "$path")"

                  echo ""
                  echo "Restoring excluded path: [$path]"


                  # --------------------------------------------------
                  # File exists in target HEAD
                  # --------------------------------------------------

                  if git cat-file -e "HEAD:$path" 2>/dev/null; then

                    echo "Target contains [$path]."
                    echo "Keeping target version."

                    git restore \
                      --source=HEAD \
                      --staged \
                      --worktree \
                      -- "$path"


                  # --------------------------------------------------
                  # File does NOT exist in target HEAD
                  # --------------------------------------------------

                  else

                    echo "Target does not contain [$path]."
                    echo "Removing imported version."

                    git rm \
                      -f \
                      --ignore-unmatch \
                      -- "$path" || true

                    rm -f -- "$path" || true

                  fi

                done

                IFS="$OLDIFS"

              fi


              # ======================================================
              # Stage changes
              # ======================================================

              git add -A


              # ======================================================
              # Verify exclusions
              # ======================================================

              EXCLUSION_VIOLATION=0

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for path in $EXCLUDED; do

                  path="$(normalize_path "$path")"

                  if git diff \
                    --cached \
                    --name-only \
                    --diff-filter=ACMRTUXB \
                    -- "$path" |
                    grep -Fxq "$path"
                  then

                    echo ""
                    echo "ERROR: Excluded path is still staged:"
                    echo "[$path]"

                    EXCLUSION_VIOLATION=1

                  else

                    echo "Verified excluded path:"
                    echo "[$path]"

                  fi

                done

                IFS="$OLDIFS"

              fi


              # ======================================================
              # Exclusion validation failed
              # ======================================================

              if [ "$EXCLUSION_VIOLATION" -eq 1 ]; then

                echo ""
                echo "ERROR: One or more excluded paths are still present."

                git reset --hard HEAD

                echo "$commit | excluded paths still present after filtering" \
                  >> /tmp/skipped.log

                continue

              fi


              # ======================================================
              # Nothing remains
              # ======================================================

              if git diff --cached --quiet; then

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | nothing to apply after exclusions" \
                  >> /tmp/skipped.log

                continue

              fi


              # ======================================================
              # Create commit
              # ======================================================

              if git commit \
                --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
                --file=/tmp/commit_message
              then

                if [ -n "$EXCLUDED" ]; then

                  echo "MODIFIED: $commit"

                  echo "$commit | applied with exclusions: $EXCLUDED" \
                    >> /tmp/modified.log

                else

                  echo "APPLIED: $commit"

                  echo "$commit | applied" \
                    >> /tmp/applied.log

                fi

              else

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | failed to create commit" \
                  >> /tmp/skipped.log

              fi

              continue

            fi


            # ========================================================
            # Conflict detected
            # ========================================================

            echo ""
            echo "Conflict detected."


            # ========================================================
            # Get conflicted files
            # ========================================================

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            echo ""
            echo "Conflicted files:"
            echo "$CONFLICTED_FILES"


            UNEXPECTED_CONFLICT=0
            RESOLVED_FILES=""


            # ========================================================
            # Process conflicts
            # ========================================================

            while IFS= read -r file; do

              [ -z "$file" ] && continue

              file="$(normalize_path "$file")"

              FOUND=0


              # ------------------------------------------------------
              # Check whether conflict is excluded
              # ------------------------------------------------------

              if [ -n "$EXCLUDED" ]; then

                OLDIFS="$IFS"
                IFS=','

                for excluded_path in $EXCLUDED; do

                  excluded_path="$(normalize_path "$excluded_path")"

                  if [ "$file" = "$excluded_path" ]; then

                    FOUND=1

                    break

                  fi

                done

                IFS="$OLDIFS"

              fi


              # ------------------------------------------------------
              # Excluded conflict
              # ------------------------------------------------------

              if [ "$FOUND" -eq 1 ]; then

                echo ""
                echo "Resolving excluded conflict: [$file]"


                if git cat-file -e "HEAD:$file" 2>/dev/null; then

                  echo "Target contains [$file]."
                  echo "Keeping target version."

                  git restore \
                    --source=HEAD \
                    --staged \
                    --worktree \
                    -- "$file"

                else

                  echo "Target does not contain [$file]."
                  echo "Keeping deletion."

                  git rm \
                    -f \
                    --ignore-unmatch \
                    -- "$file" || true

                  rm -f -- "$file" || true

                fi


                if [ -n "$RESOLVED_FILES" ]; then

                  RESOLVED_FILES="$RESOLVED_FILES, $file"

                else

                  RESOLVED_FILES="$file"

                fi


              # ------------------------------------------------------
              # Unexpected conflict
              # ------------------------------------------------------

              else

                echo ""
                echo "Unexpected conflict: [$file]"

                UNEXPECTED_CONFLICT=1

              fi

            done <<< "$CONFLICTED_FILES"


            # ========================================================
            # Unexpected conflict
            # ========================================================

            if [ "$UNEXPECTED_CONFLICT" -eq 1 ]; then

              echo ""
              echo "Skipping $commit because of unspecified conflict."

              git reset --hard HEAD

              echo "$commit | unspecified conflict: $CONFLICTED_FILES" \
                >> /tmp/skipped.log

              continue

            fi


            echo ""
            echo "All conflicts were explicitly handled."


            # ========================================================
            # IMPORTANT:
            #
            # Restore ALL excluded paths.
            #
            # This catches excluded files that had NO conflict.
            #
            # Example:
            #
            # README.md                  -> conflict
            # UserConfig.java            -> conflict
            # TranslateController.java   -> no conflict
            #
            # All three must nevertheless be excluded.
            # ========================================================

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                path="$(normalize_path "$path")"

                echo ""
                echo "Restoring excluded path: [$path]"


                # --------------------------------------------------
                # File exists in target HEAD
                # --------------------------------------------------

                if git cat-file -e "HEAD:$path" 2>/dev/null; then

                  echo "Target contains [$path]."
                  echo "Keeping target version."

                  git restore \
                    --source=HEAD \
                    --staged \
                    --worktree \
                    -- "$path"


                # --------------------------------------------------
                # File does not exist in target HEAD
                # --------------------------------------------------

                else

                  echo "Target does not contain [$path]."
                  echo "Removing imported version."

                  git rm \
                    -f \
                    --ignore-unmatch \
                    -- "$path" || true

                  rm -f -- "$path" || true

                fi

              done

              IFS="$OLDIFS"

            fi


            # ========================================================
            # Stage AFTER all exclusions have been restored
            # ========================================================

            git add -A


            # ========================================================
            # Verify no unresolved conflicts remain
            # ========================================================

            if git diff --name-only --diff-filter=U | grep -q .; then

              echo ""
              echo "ERROR: Unresolved conflicts remain."

              git reset --hard HEAD

              echo "$commit | unresolved conflicts remain after exclusions" \
                >> /tmp/skipped.log

              continue

            fi


            # ========================================================
            # Verify ALL excluded paths
            # ========================================================

            EXCLUSION_VIOLATION=0

            if [ -n "$EXCLUDED" ]; then

              OLDIFS="$IFS"
              IFS=','

              for path in $EXCLUDED; do

                path="$(normalize_path "$path")"

                echo ""
                echo "Checking excluded path:"
                echo "[$path]"


                # --------------------------------------------------
                # Check whether excluded path is staged
                # --------------------------------------------------

                if git diff \
                  --cached \
                  --name-only \
                  --diff-filter=ACMRTUXB \
                  -- "$path" |
                  grep -Fxq "$path"
                then

                  echo ""
                  echo "ERROR: Excluded path is still staged:"
                  echo "[$path]"

                  EXCLUSION_VIOLATION=1

                else

                  echo "Verified excluded path:"
                  echo "[$path]"

                fi

              done

              IFS="$OLDIFS"

            fi


            # ========================================================
            # Exclusion validation failed
            # ========================================================

            if [ "$EXCLUSION_VIOLATION" -eq 1 ]; then

              echo ""
              echo "ERROR: One or more excluded paths are still present."

              git reset --hard HEAD

              echo "$commit | excluded paths still present after conflict resolution" \
                >> /tmp/skipped.log

              continue

            fi


            # ========================================================
            # Nothing remains
            # ========================================================

            if git diff --cached --quiet; then

              echo ""
              echo "SKIPPED: $commit"
              echo "All changes from this commit were excluded."

              git reset --hard HEAD

              echo "$commit | all changes were excluded" \
                >> /tmp/skipped.log

              continue

            fi


            # ========================================================
            # Create modified commit
            # ========================================================

            if git commit \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
              --file=/tmp/commit_message
            then

              echo ""
              echo "MODIFIED: $commit"

              echo "$commit | applied with excluded paths: $EXCLUDED" \
                >> /tmp/modified.log

            else

              echo ""
              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create modified commit" \
                >> /tmp/skipped.log

            fi

          done


      # ============================================================
      # Push
      # ============================================================

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"


      # ============================================================
      # Summary
      # ============================================================

      - name: Summary
        if: always()
        run: |

          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"


          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/applied.log ]; then

            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/applied.log

          else

            echo "None" >> "$GITHUB_STEP_SUMMARY"

          fi


          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with exclusions" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/modified.log ]; then

            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/modified.log

          else

            echo "None" >> "$GITHUB_STEP_SUMMARY"

          fi


          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/skipped.log ]; then

            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/skipped.log

          else

            echo "None" >> "$GITHUB_STEP_SUMMARY"

          fi
