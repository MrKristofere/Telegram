name: Build with custom Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_REPOSITORY: MrKristofere/firebase-android-sdk
  FIREBASE_PATH: firebase-android-sdk
  TELEGRAM_PATH: Telegram
  MAVEN_REPO: ${{ github.workspace }}/maven-repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout Telegram
      # ============================================================
      - name: Checkout Telegram
        uses: actions/checkout@v7
        with:
          path: ${{ env.TELEGRAM_PATH }}
          submodules: recursive
          ref: Tmp

      # ============================================================
      # 2. Checkout Firebase fork
      # ============================================================
      - name: Checkout Firebase fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FIREBASE_REPOSITORY }}
          path: ${{ env.FIREBASE_PATH }}
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 3. Java
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      # ============================================================
      # 5. Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ============================================================
      # 6. Show versions
      # ============================================================
      - name: Show Firebase version
        working-directory: ${{ env.FIREBASE_PATH }}
        run: |
          echo "Firebase Messaging version:"
          grep '^version=' firebase-messaging/gradle.properties

          echo
          echo "Firebase commit:"
          git rev-parse HEAD

      - name: Show Telegram commit
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          echo "Telegram commit:"
          git rev-parse HEAD

      # ============================================================
      # 7. Patch Firebase
      # ============================================================
      - name: Patch Firebase source
        working-directory: ${{ env.FIREBASE_PATH }}
        run: |
          echo "Firebase patch step"

          # ========================================================
          # ДОБАВЬ СЮДА СВОЁ ИЗМЕНЕНИЕ
          # ========================================================
          #
          # Например:
          #
          # sed -i 's/foo/bar/g' \
          #   firebase-messaging/src/main/java/...
          #

      # ============================================================
      # 8. Read Firebase Messaging version
      # ============================================================
      - name: Read Firebase Messaging version
        id: firebase_version
        working-directory: ${{ env.FIREBASE_PATH }}
        run: |
          VERSION=$(grep '^version=' firebase-messaging/gradle.properties | cut -d= -f2)

          if [ -z "$VERSION" ]; then
            echo "Unable to determine Firebase Messaging version"
            exit 1
          fi

          echo "Firebase Messaging version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. Prepare local Maven repository
      # ============================================================
      - name: Prepare Maven repository
        run: |
          rm -rf "$MAVEN_REPO"
          mkdir -p "$MAVEN_REPO"

          echo "Maven repository:"
          echo "$MAVEN_REPO"

      # ============================================================
      # 10. Publish custom Firebase Messaging
      #
      # IMPORTANT:
      # We explicitly redirect Gradle's Maven local repository
      # to $GITHUB_WORKSPACE/maven-repo.
      # ============================================================
      - name: Publish custom Firebase Messaging
        working-directory: ${{ env.FIREBASE_PATH }}
        run: |
          ./gradlew \
            -Dmaven.repo.local="$MAVEN_REPO" \
            -PprojectsToPublish="firebase-messaging" \
            publishReleasingLibrariesToMavenLocal \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 11. Verify Firebase artifact
      # ============================================================
      - name: Verify Firebase Maven artifact
        run: |
          VERSION="${{ steps.firebase_version.outputs.version }}"

          ARTIFACT_DIR="$MAVEN_REPO/com/google/firebase/firebase-messaging/$VERSION"

          echo "Expected artifact directory:"
          echo "$ARTIFACT_DIR"

          if [ ! -d "$ARTIFACT_DIR" ]; then
            echo ""
            echo "ERROR: Firebase Maven artifact was not generated!"
            echo ""
            echo "Contents of Maven repository:"
            find "$MAVEN_REPO" -type f -print || true
            exit 1
          fi

          echo ""
          echo "Firebase artifact files:"
          find "$ARTIFACT_DIR" -type f -print

          echo ""
          echo "AAR:"
          ls -lh "$ARTIFACT_DIR"/*.aar

          echo ""
          echo "POM:"
          ls -lh "$ARTIFACT_DIR"/*.pom

      # ============================================================
      # 12. Upload Firebase Maven repository
      # ============================================================
      - name: Upload Firebase Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: firebase-maven-repository
          path: |
            ${{ env.MAVEN_REPO }}/com/google/firebase/**
          if-no-files-found: error

      # ============================================================
      # 13. Configure Telegram
      #
      # IMPORTANT:
      # Do NOT use mavenLocal().
      #
      # Use the exact workspace Maven repository instead.
      # ============================================================
      - name: Configure Telegram for custom Firebase
        working-directory: ${{ env.TELEGRAM_PATH }}
        env:
          FIREBASE_VERSION: ${{ steps.firebase_version.outputs.version }}
          FIREBASE_MAVEN_REPO: /home/runner/.m2/repository
        run: |
          python3 - "$FIREBASE_VERSION" "$FIREBASE_MAVEN_REPO" <<'PY'
          from pathlib import Path
          import re
          import sys

          firebase_version = sys.argv[1]
          maven_repo = sys.argv[2]

          path = Path("TMessagesProj/build.gradle")
          text = path.read_text()

          # --------------------------------------------------------
          # Replace repositories block.
          #
          # DO NOT use mavenLocal().
          # Use the exact Maven repository where Firebase was published.
          # --------------------------------------------------------

          old_repositories = """repositories {
              mavenCentral()
              google()
          }"""

          new_repositories = f"""repositories {{
              maven {{
                  url = uri("{maven_repo}")
              }}
              mavenCentral()
              google()
          }}"""

          if old_repositories not in text:
              print("Expected repositories block was not found.")
              sys.exit(1)

          text = text.replace(
              old_repositories,
              new_repositories,
              1
          )

          # --------------------------------------------------------
          # Replace Firebase Messaging version.
          # --------------------------------------------------------

          pattern = (
              r"com\.google\.firebase:"
              r"firebase-messaging:"
              r"[0-9.]+"
          )

          replacement = (
              f"com.google.firebase:"
              f"firebase-messaging:"
              f"{firebase_version}"
          )

          text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1
          )

          if count != 1:
              print("firebase-messaging dependency was not found.")
              sys.exit(1)

          path.write_text(text)

          print("Configured Telegram:")
          print(f"  Firebase Messaging: {firebase_version}")
          print(f"  Firebase Maven repo: {maven_repo}")
          PY

      # ============================================================
      # 14. Verify Telegram Gradle configuration
      # ============================================================
      - name: Show Firebase configuration
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          echo "Firebase dependencies:"
          grep -n "firebase-" TMessagesProj/build.gradle || true

          echo
          echo "Repositories:"
          sed -n '/repositories {/,/}/p' TMessagesProj/build.gradle

          echo
          echo "Expected Firebase Maven repository:"
          echo "$MAVEN_REPO"

      - name: Verify Firebase Maven repository
        working-directory: ${{ env.TELEGRAM_PATH }}
        env:
          FIREBASE_VERSION: ${{ steps.firebase_version.outputs.version }}
          FIREBASE_MAVEN_REPO: /home/runner/.m2/repository
        run: |
          echo "=== Firebase Maven repository ==="
          find "$FIREBASE_MAVEN_REPO/com/google/firebase/firebase-messaging/$FIREBASE_VERSION" \
            -type f \
            -print

          echo
          echo "=== Firebase POM ==="
          cat "$FIREBASE_MAVEN_REPO/com/google/firebase/firebase-messaging/$FIREBASE_VERSION/firebase-messaging-$FIREBASE_VERSION.pom"

          echo
          echo "=== Telegram repositories ==="
          sed -n '/repositories {/,/}/p' TMessagesProj/build.gradle

          echo
          echo "=== Gradle Maven repository property ==="
          ./gradlew properties \
            --no-daemon \
            | grep -E "maven|gradleUserHome" \
            || true

      # ============================================================
      # 15. Resolve Firebase dependency
      # ============================================================
      - name: Resolve Firebase Messaging
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          ./gradlew \
            :TMessagesProj:dependencyInsight \
            --dependency firebase-messaging \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 16. Firebase dependency tree
      # ============================================================
      - name: Show Firebase dependency tree
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          ./gradlew \
            :TMessagesProj:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > firebase-dependencies.txt

          grep -i -E \
            "firebase|datatransport|transport" \
            firebase-dependencies.txt \
            || true

      - name: Upload Firebase dependency tree
        uses: actions/upload-artifact@v7
        with:
          name: firebase-dependency-tree
          path: |
            ${{ env.TELEGRAM_PATH }}/firebase-dependencies.txt

      # ============================================================
      # 17. Build Telegram
      # ============================================================
      - name: Build Telegram Release
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          ./gradlew \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 18. Find APKs
      # ============================================================
      - name: Find generated APKs
        working-directory: ${{ env.TELEGRAM_PATH }}
        run: |
          echo "Generated APK files:"

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print

      # ============================================================
      # 19. Upload APK
      # ============================================================
      - name: Upload Telegram APK
        uses: actions/upload-artifact@v7
        with:
          name: telegram-custom-firebase
          path: |
            ${{ env.TELEGRAM_PATH }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
