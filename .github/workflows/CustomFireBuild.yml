name: Build with custom Firebase

on:
  workflow_dispatch:

permissions:
  contents: read


# ================================================================
# ================================================================
# JOB 1 — BUILD FIREBASE
# ================================================================
# ================================================================

jobs:

  build-firebase:

    name: Build Firebase Messaging

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout your Firebase fork
      # ------------------------------------------------------------

      - name: Checkout Firebase
        uses: actions/checkout@v4
        with:
          repository: MrKristofere/firebase-android-sdk
          path: firebase-android-sdk
          submodules: recursive
          fetch-depth: 1


      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018


      # ------------------------------------------------------------
      # Gradle
      # ------------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # ------------------------------------------------------------
      # Show Firebase version
      # ------------------------------------------------------------

      - name: Read Firebase Messaging version
        id: firebase
        working-directory: firebase-android-sdk
        shell: bash
        run: |

          set -e

          VERSION=$(grep '^version=' \
            firebase-messaging/gradle.properties \
            | cut -d= -f2)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Firebase Messaging version not found"
            exit 1
          fi

          echo "Firebase Messaging version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # Modify Firebase source
      #
      # PUT YOUR FIREBASE PATCHES HERE
      # ------------------------------------------------------------

      - name: Patch Firebase
        working-directory: firebase-android-sdk
        run: |

          echo "Firebase patch step"

          # ========================================================
          # EXAMPLE:
          #
          # sed -i 's/OLD_VALUE/NEW_VALUE/g' \
          #   firebase-messaging/src/main/java/...
          #
          # ========================================================


      # ------------------------------------------------------------
      # Build Firebase Messaging
      #
      # We do NOT rely on Maven Local here.
      #
      # First try the official Firebase publishing mechanism.
      # ------------------------------------------------------------

      - name: Build Firebase Messaging
        working-directory: firebase-android-sdk
        run: |

          ./gradlew \
            -PprojectsToPublish="firebase-messaging" \
            publishReleasingLibrariesToMavenLocal \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # Locate the generated Firebase files
      # ------------------------------------------------------------

      - name: Locate Firebase artifacts
        id: locate
        working-directory: firebase-android-sdk
        shell: bash
        run: |

          set -e

          VERSION="${{ steps.firebase.outputs.version }}"

          echo "Firebase version:"
          echo "$VERSION"

          echo
          echo "Searching entire workspace for Firebase Messaging files..."

          find "$HOME/.m2" \
            -type f \
            \( \
              -name "firebase-messaging-${VERSION}.aar" \
              -o \
              -name "firebase-messaging-${VERSION}.pom" \
            \) \
            -print \
            || true

          echo
          echo "Searching workspace..."

          find .. \
            -type f \
            \( \
              -name "firebase-messaging-${VERSION}.aar" \
              -o \
              -name "firebase-messaging-${VERSION}.pom" \
            \) \
            -print \
            || true


      # ------------------------------------------------------------
      # Create a clean Maven repository artifact
      #
      # We create the Maven directory ourselves so Telegram can
      # consume it later as a normal Maven repository.
      # ------------------------------------------------------------

      - name: Prepare Firebase artifact
        shell: bash
        run: |

          set -e

          VERSION="${{ steps.firebase.outputs.version }}"

          mkdir -p firebase-artifact/com/google/firebase/firebase-messaging/${VERSION}

          echo "Looking for Firebase AAR..."

          AAR=$(find "$HOME/.m2" \
            -type f \
            -name "firebase-messaging-${VERSION}.aar" \
            | head -n 1)

          if [ -z "$AAR" ]; then
            echo
            echo "ERROR: Firebase AAR was not found."
            echo
            echo "Full ~/.m2 contents:"
            find "$HOME/.m2" -type f -print || true
            exit 1
          fi

          echo "Found AAR:"
          echo "$AAR"

          cp "$AAR" \
            "firebase-artifact/com/google/firebase/firebase-messaging/${VERSION}/"


          echo
          echo "Looking for Firebase POM..."

          POM=$(find "$HOME/.m2" \
            -type f \
            -name "firebase-messaging-${VERSION}.pom" \
            | head -n 1)

          if [ -z "$POM" ]; then
            echo
            echo "ERROR: Firebase POM was not found."
            echo
            echo "Full ~/.m2 contents:"
            find "$HOME/.m2" -type f -print || true
            exit 1
          fi

          echo "Found POM:"
          echo "$POM"

          cp "$POM" \
            "firebase-artifact/com/google/firebase/firebase-messaging/${VERSION}/"


          echo
          echo "Firebase artifact prepared:"
          find firebase-artifact -type f -print


      # ------------------------------------------------------------
      # Upload Firebase artifact
      # ------------------------------------------------------------

      - name: Upload Firebase artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebase-messaging
          path: firebase-artifact
          if-no-files-found: error


# ================================================================
# ================================================================
# JOB 2 — BUILD TELEGRAM
# ================================================================
# ================================================================

  build-telegram:

    name: Build Telegram

    runs-on: ubuntu-latest

    needs: build-firebase


    steps:

      # ------------------------------------------------------------
      # Checkout Telegram
      #
      # THIS IS THE ORIGINAL TELEGRAM BUILD PART.
      # ------------------------------------------------------------

      - name: Checkout Telegram
        uses: actions/checkout@v7
        with:
          path: Telegram
          ref: Tmp
          submodules: recursive


      # ------------------------------------------------------------
      # Download Firebase artifact
      # ------------------------------------------------------------

      - name: Download Firebase artifact
        uses: actions/download-artifact@v7
        with:
          name: firebase-messaging
          path: firebase-messaging


      # ------------------------------------------------------------
      # Show downloaded Firebase
      # ------------------------------------------------------------

      - name: Verify Firebase artifact
        shell: bash
        run: |

          set -e

          echo "Downloaded Firebase files:"

          find firebase-messaging \
            -type f \
            -print


      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018


      # ------------------------------------------------------------
      # Gradle
      # ------------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------------
      # Get Firebase version
      # ------------------------------------------------------------

      - name: Read Firebase version
        id: firebase
        shell: bash
        run: |

          set -e

          POM=$(find firebase-messaging \
            -name "firebase-messaging-*.pom" \
            | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: Firebase POM not found"
            exit 1
          fi

          VERSION=$(basename "$POM" \
            | sed 's/firebase-messaging-//' \
            | sed 's/.pom//')

          echo "Firebase Messaging version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # Configure Telegram
      #
      # We add the downloaded directory as a Maven repository.
      #
      # IMPORTANT:
      # The downloaded artifact has exactly this structure:
      #
      # firebase-messaging/
      # └── com/
      #     └── google/
      #         └── firebase/
      #             └── firebase-messaging/
      #                 └── VERSION/
      #                     ├── firebase-messaging-VERSION.aar
      #                     └── firebase-messaging-VERSION.pom
      #
      # Therefore the repository root is:
      #
      # ../firebase-messaging
      # ------------------------------------------------------------

      - name: Configure Telegram Firebase dependency
        working-directory: Telegram
        env:
          FIREBASE_VERSION: ${{ steps.firebase.outputs.version }}
        shell: bash
        run: |

          set -e

          python3 - "$FIREBASE_VERSION" <<'PY'

          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]

          path = Path("TMessagesProj/build.gradle")

          text = path.read_text()

          # --------------------------------------------------------
          # Add local Maven repository.
          # --------------------------------------------------------

          repository_block = """repositories {
              mavenCentral()
              google()
          }"""

          replacement = """repositories {
              maven {
                  url = uri("${rootDir}/../firebase-messaging")
              }
              mavenCentral()
              google()
          }"""

          if repository_block not in text:

              # Handle possible existing mavenLocal()
              text = text.replace(
                  """repositories {
              mavenLocal()
              mavenCentral()
              google()
          }""",
                  replacement,
                  1
              )

          else:

              text = text.replace(
                  repository_block,
                  replacement,
                  1
              )


          # --------------------------------------------------------
          # Replace firebase-messaging version.
          # --------------------------------------------------------

          pattern = (
              r"com\.google\.firebase:"
              r"firebase-messaging:"
              r"[0-9.]+"
          )

          replacement_dependency = (
              "com.google.firebase:"
              f"firebase-messaging:{version}"
          )

          text, count = re.subn(
              pattern,
              replacement_dependency,
              text,
              count=1
          )

          if count != 1:

              print(
                  "ERROR: firebase-messaging dependency "
                  "was not found."
              )

              print()
              print("Firebase lines:")

              for line in text.splitlines():

                  if "firebase" in line.lower():
                      print(line)

              sys.exit(1)


          path.write_text(text)


          print()
          print("Telegram configured successfully.")
          print()
          print(
              f"Firebase Messaging: "
              f"{version}"
          )

          print(
              "Firebase Maven repository:"
          )

          print(
              "${rootDir}/../firebase-messaging"
          )

          print()
          print("Firebase dependency:")

          for line in text.splitlines():

              if "firebase-messaging" in line:
                  print(line)

          PY


      # ------------------------------------------------------------
      # Show final configuration
      # ------------------------------------------------------------

      - name: Show Telegram Firebase configuration
        working-directory: Telegram
        run: |

          echo "=== Firebase dependency ==="

          grep -n \
            "firebase-messaging" \
            TMessagesProj/build.gradle

          echo
          echo "=== Repositories ==="

          sed \
            -n \
            '/repositories {/,/}/p' \
            TMessagesProj/build.gradle


      # ============================================================
      # FROM HERE DOWN — TELEGRAM BUILD
      # ============================================================
      #
      # This is intentionally kept as the Telegram build part.
      # ============================================================


      # ------------------------------------------------------------
      # Resolve Firebase dependency
      # ------------------------------------------------------------

      - name: Resolve Firebase Messaging
        working-directory: Telegram
        run: |

          ./gradlew \
            :TMessagesProj:dependencyInsight \
            --dependency firebase-messaging \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # Firebase dependency tree
      # ------------------------------------------------------------

      - name: Show Firebase dependency tree
        working-directory: Telegram
        run: |

          ./gradlew \
            :TMessagesProj:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > firebase-dependencies.txt

          grep -i -E \
            "firebase|datatransport|transport" \
            firebase-dependencies.txt \
            || true


      - name: Upload Firebase dependency tree
        uses: actions/upload-artifact@v7
        with:
          name: firebase-dependency-tree
          path: Telegram/firebase-dependencies.txt


      # ------------------------------------------------------------
      # BUILD TELEGRAM
      # ------------------------------------------------------------

      - name: Build Telegram Release
        working-directory: Telegram
        run: |

          ./gradlew \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # Find APK
      # ------------------------------------------------------------

      - name: Find generated APKs
        working-directory: Telegram
        run: |

          echo "Generated APK files:"

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print


      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------

      - name: Upload Telegram APK
        uses: actions/upload-artifact@v7
        with:
          name: telegram-custom-firebase
          path: |
            Telegram/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
