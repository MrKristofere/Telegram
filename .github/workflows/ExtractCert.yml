name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "apk link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    env:
      APK_URL: ${{ inputs.link }}
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:

      # ============================================================
      # Android SDK / apksigner
      # ============================================================
      - name: Install Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      # ============================================================
      # Download APK
      # ============================================================
      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -o telegram.apk \
            "$APK_URL"

          file telegram.apk
          ls -lh telegram.apk

      # ============================================================
      # Basic APK inspection
      # ============================================================
      - name: Inspect APK
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "APK FILE"
          echo "============================================================"

          file telegram.apk
          ls -lh telegram.apk

          echo
          echo "============================================================"
          echo "ZIP ENTRIES"
          echo "============================================================"

          unzip -l telegram.apk 2>/dev/null | head -100 || true

          echo
          echo "============================================================"
          echo "META-INF"
          echo "============================================================"

          unzip -l telegram.apk 2>/dev/null \
            | grep -Ei 'META-INF/.*\.(RSA|DSA|EC|SF)$' \
            || echo "No traditional META-INF signature files found"

      # ============================================================
      # Official Android signature verification
      #
      # apksigner/apksig understands:
      #   v1
      #   v2
      #   v3
      #   newer supported schemes
      # ============================================================
      - name: Verify APK with apksigner
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "apksigner --verbose"
          echo "============================================================"

          apksigner verify \
            --verbose \
            telegram.apk \
            2>&1 | tee apksigner-verify.txt

          echo
          echo "============================================================"
          echo "apksigner --print-certs"
          echo "============================================================"

          apksigner verify \
            --print-certs \
            telegram.apk \
            2>&1 | tee apksigner-certs.txt

          echo
          echo "============================================================"
          echo "apksigner --print-certs-pem"
          echo "============================================================"

          apksigner verify \
            --print-certs-pem \
            telegram.apk \
            2>&1 | tee apksigner-certs-pem.txt

          exit 0

      # ============================================================
      # Extract ALL certificates returned by apksigner
      # ============================================================
      - name: Extract certificates from apksigner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf certs
          mkdir -p certs

          python3 <<'PY'
          import re
          from pathlib import Path

          source = Path("apksigner-certs-pem.txt")

          if not source.exists():
              print("apksigner output does not exist")
              raise SystemExit(0)

          data = source.read_text(errors="replace")

          pattern = re.compile(
              r"-----BEGIN CERTIFICATE-----.*?"
              r"-----END CERTIFICATE-----",
              re.S,
          )

          certs = pattern.findall(data)

          print(f"Certificates found by apksigner: {len(certs)}")

          for index, cert in enumerate(certs, 1):
              path = Path("certs") / f"apksigner-cert-{index}.pem"

              path.write_text(
                  cert.strip() + "\n"
              )

              print(f"  {path}")

          if not certs:
              print("No PEM certificates found in apksigner output.")
          PY

          ls -lah certs || true

      # ============================================================
      # Deep parser
      #
      # Searches the APK Signing Block directly.
      #
      # APK Signing Block:
      #
      #   size
      #   ID/value pairs
      #   size
      #   magic:
      #       APK Sig Block 42
      #
      # v2 ID = 0x7109871a
      # v3 ID = 0xf05368c0
      # ============================================================
      - name: Deep scan APK Signing Block
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deep-certs
          mkdir -p deep-certs

          python3 <<'PY'
          from pathlib import Path
          import struct
          import hashlib
          import subprocess

          APK = Path("telegram.apk")
          data = APK.read_bytes()

          MAGIC = b"APK Sig Block 42"

          V2_ID = 0x7109871a
          V3_ID = 0xf05368c0

          print("=" * 70)
          print("DEEP APK SIGNATURE BLOCK SCAN")
          print("=" * 70)

          print(f"APK size: {len(data)} bytes")

          # ----------------------------------------------------------
          # Helpers
          # ----------------------------------------------------------

          def read_u32(buf, offset):
              if offset + 4 > len(buf):
                  raise ValueError("u32 outside buffer")

              return struct.unpack_from("<I", buf, offset)[0]


          def read_u64(buf, offset):
              if offset + 8 > len(buf):
                  raise ValueError("u64 outside buffer")

              return struct.unpack_from("<Q", buf, offset)[0]


          def read_length_prefixed(buf, offset):
              """
              Android APK signature structures use:
                  uint32 length
                  byte[length] value
              """

              length = read_u32(buf, offset)

              start = offset + 4
              end = start + length

              if end > len(buf):
                  raise ValueError(
                      f"length-prefixed field outside buffer: "
                      f"start={start}, length={length}"
                  )

              return buf[start:end], end


          # ----------------------------------------------------------
          # Find ZIP EOCD
          # ----------------------------------------------------------

          eocd = data.rfind(b"PK\x05\x06")

          if eocd < 0:
              print("ERROR: ZIP EOCD not found.")
              raise SystemExit(1)

          print(f"EOCD offset: 0x{eocd:x}")

          if eocd + 22 > len(data):
              print("ERROR: truncated EOCD.")
              raise SystemExit(1)

          # ZIP EOCD:
          #
          # +16 = offset of central directory
          # +12 = size of central directory
          #

          central_dir_offset = read_u32(
              data,
              eocd + 16
          )

          central_dir_size = read_u32(
              data,
              eocd + 12
          )

          print(
              f"Central directory offset: "
              f"0x{central_dir_offset:x}"
          )

          print(
              f"Central directory size: "
              f"{central_dir_size}"
          )

          # ----------------------------------------------------------
          # Find APK Signing Block footer
          #
          # Footer:
          #
          #   uint64 size
          #   16 bytes "APK Sig Block 42"
          #
          # It is immediately before Central Directory.
          # ----------------------------------------------------------

          footer_start = central_dir_offset - 24

          if footer_start < 0:
              print("No room for APK Signing Block.")
              raise SystemExit(10)

          footer_size = read_u64(
              data,
              footer_start
          )

          footer_magic = data[
              footer_start + 8:
              footer_start + 24
          ]

          print(
              f"Signing block footer size: "
              f"{footer_size}"
          )

          print(
              f"Signing block magic: "
              f"{footer_magic!r}"
          )

          if footer_magic != MAGIC:
              print(
                  "Standard APK Signing Block was not found."
              )
              raise SystemExit(10)

          # ----------------------------------------------------------
          # Signing Block start
          #
          # First field is size-of-block excluding this uint64.
          # ----------------------------------------------------------

          block_start = (
              footer_start
              - footer_size
              + 8
          )

          if block_start < 0:
              print("Invalid Signing Block start.")
              raise SystemExit(1)

          block_size = read_u64(
              data,
              block_start
          )

          print(
              f"Signing block start: "
              f"0x{block_start:x}"
          )

          print(
              f"Signing block size: "
              f"{block_size}"
          )

          if block_size != footer_size:
              print(
                  "WARNING: Signing Block size fields differ."
              )

          # ----------------------------------------------------------
          # Parse ID/value pairs
          # ----------------------------------------------------------

          pairs_start = block_start + 8
          pairs_end = footer_start

          position = pairs_start

          v2_blocks = []
          v3_blocks = []

          while position < pairs_end:

              if position + 8 > pairs_end:
                  print("Truncated pair length.")
                  break

              pair_size = read_u64(
                  data,
                  position
              )

              if pair_size < 4:
                  print(
                      f"Invalid pair size: {pair_size}"
                  )
                  break

              pair_end = (
                  position
                  + 8
                  + pair_size
              )

              if pair_end > pairs_end:
                  print(
                      "Pair extends beyond Signing Block."
                  )
                  break

              pair_id = read_u32(
                  data,
                  position + 8
              )

              value_start = position + 12
              value_end = pair_end

              value = data[
                  value_start:value_end
              ]

              print()
              print(
                  f"ID: 0x{pair_id:08x}"
              )

              print(
                  f"Value size: {len(value)}"
              )

              print(
                  f"Value offset: "
                  f"0x{value_start:x}"
              )

              if pair_id == V2_ID:
                  print("Detected APK Signature Scheme v2")
                  v2_blocks.append(value)

              elif pair_id == V3_ID:
                  print("Detected APK Signature Scheme v3")
                  v3_blocks.append(value)

              position = pair_end

          print()
          print(
              f"v2 blocks: {len(v2_blocks)}"
          )

          print(
              f"v3 blocks: {len(v3_blocks)}"
          )

          # ----------------------------------------------------------
          # Extract certificates from v2/v3 block
          #
          # v2:
          #
          #   signers
          #     signer
          #       signed data
          #         digests
          #         certificates
          #
          # v3:
          #
          #   signers
          #     signer
          #       signed data
          #         digests
          #         certificates
          #         minSDK
          #         maxSDK
          # ----------------------------------------------------------

          cert_hashes = set()
          cert_counter = 0

          def save_certificate(cert_der, source):
              global cert_counter

              if len(cert_der) < 64:
                  return

              # Validate with OpenSSL.
              temp = Path(
                  "deep-certs/.candidate.der"
              )

              temp.write_bytes(cert_der)

              result = subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "DER",
                      "-in",
                      str(temp),
                      "-noout",
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              temp.unlink(missing_ok=True)

              if result.returncode != 0:
                  return

              digest = hashlib.sha256(
                  cert_der
              ).hexdigest()

              if digest in cert_hashes:
                  print(
                      f"Duplicate certificate ignored: "
                      f"{digest}"
                  )
                  return

              cert_hashes.add(digest)

              cert_counter += 1

              output = Path(
                  "deep-certs"
              ) / f"deep-cert-{cert_counter}.der"

              output.write_bytes(cert_der)

              print()
              print(
                  "VALID X.509 CERTIFICATE"
              )

              print(
                  f"Source: {source}"
              )

              print(
                  f"File: {output}"
              )

              print(
                  f"Size: {len(cert_der)}"
              )

              print(
                  f"SHA-256: {digest}"
              )


          def parse_v2_v3_signature_block(
              block,
              version
          ):
              print()
              print("=" * 70)
              print(
                  f"PARSING APK SIGNATURE SCHEME {version}"
              )
              print("=" * 70)

              # Top-level:
              #
              # length-prefixed signers

              try:
                  signers, end = read_length_prefixed(
                      block,
                      0
                  )

              except Exception as exc:
                  print(
                      f"Unable to read signers: {exc}"
                  )
                  return

              print(
                  f"Signers container size: "
                  f"{len(signers)}"
              )

              position = 0
              signer_index = 0

              while position < len(signers):

                  signer_index += 1

                  try:
                      signer, next_position = (
                          read_length_prefixed(
                              signers,
                              position
                          )
                      )

                  except Exception as exc:
                      print(
                          f"Signer #{signer_index} "
                          f"parse error: {exc}"
                      )
                      break

                  position = next_position

                  print()
                  print(
                      f"Signer #{signer_index}"
                  )

                  # signer begins with:
                  #
                  # length-prefixed signedData

                  try:
                      signed_data, signer_pos = (
                          read_length_prefixed(
                              signer,
                              0
                          )
                      )

                  except Exception as exc:
                      print(
                          f"Unable to read signedData: "
                          f"{exc}"
                      )
                      continue

                  print(
                      f"Signed data size: "
                      f"{len(signed_data)}"
                  )

                  # signedData:
                  #
                  # length-prefixed digests
                  # length-prefixed certificates
                  #

                  try:
                      digests, sd_pos = (
                          read_length_prefixed(
                              signed_data,
                              0
                          )
                      )

                      certificates, sd_pos = (
                          read_length_prefixed(
                              signed_data,
                              sd_pos
                          )
                      )

                  except Exception as exc:
                      print(
                          f"Unable to read certificates: "
                          f"{exc}"
                      )
                      continue

                  print(
                      f"Certificates container size: "
                      f"{len(certificates)}"
                  )

                  # --------------------------------------------------
                  # Certificate sequence
                  #
                  # It is a sequence of:
                  #
                  #   uint32 length
                  #   DER certificate
                  # --------------------------------------------------

                  cert_position = 0
                  certificate_index = 0

                  while (
                      cert_position
                      < len(certificates)
                  ):
                      certificate_index += 1

                      try:
                          certificate, next_cert = (
                              read_length_prefixed(
                                  certificates,
                                  cert_position
                              )
                          )

                      except Exception as exc:
                          print(
                              f"Certificate #{certificate_index} "
                              f"parse error: {exc}"
                          )
                          break

                      cert_position = next_cert

                      save_certificate(
                          certificate,
                          (
                              f"APK Signature Scheme "
                              f"{version}, "
                              f"signer #{signer_index}, "
                              f"certificate "
                              f"#{certificate_index}"
                          )
                      )


          # ----------------------------------------------------------
          # Parse v2
          # ----------------------------------------------------------

          for block in v2_blocks:
              parse_v2_v3_signature_block(
                  block,
                  "v2"
              )

          # ----------------------------------------------------------
          # Parse v3
          # ----------------------------------------------------------

          for block in v3_blocks:
              parse_v2_v3_signature_block(
                  block,
                  "v3"
              )

          # ----------------------------------------------------------
          # Report
          # ----------------------------------------------------------

          print()
          print("=" * 70)
          print(
              f"Certificates extracted from Signing Block: "
              f"{cert_counter}"
          )
          print("=" * 70)

          Path(
              "deep-scan-report.txt"
          ).write_text(
              "\n".join(
                  [
                      "APK Signing Block scan",
                      f"APK size: {len(data)}",
                      f"v2 blocks: {len(v2_blocks)}",
                      f"v3 blocks: {len(v3_blocks)}",
                      (
                          "certificates extracted: "
                          f"{cert_counter}"
                      ),
                  ]
              )
              + "\n"
          )

          PY
      # ============================================================
      # Raw fallback scan
      #
      # If the APK does not have a normal Signing Block, search the
      # entire binary for valid DER X.509 certificates.
      # ============================================================
      - name: Raw X.509 certificate fallback
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p raw-certs

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import hashlib

          apk = Path("telegram.apk").read_bytes()

          print("=" * 70)
          print("RAW X.509 FALLBACK SCAN")
          print("=" * 70)

          candidates = []

          # DER SEQUENCE with two-byte length.
          for m in re.finditer(
              b"\x30\x82",
              apk
          ):
              start = m.start()

              if start + 4 > len(apk):
                  continue

              length = int.from_bytes(
                  apk[start + 2:start + 4],
                  "big"
              )

              end = start + 4 + length

              if end > len(apk):
                  continue

              candidates.append(
                  apk[start:end]
              )

          # DER SEQUENCE with one-byte length.
          for m in re.finditer(
              b"\x30\x81",
              apk
          ):
              start = m.start()

              if start + 3 > len(apk):
                  continue

              length = apk[start + 2]

              end = start + 3 + length

              if end > len(apk):
                  continue

              candidates.append(
                  apk[start:end]
              )

          print(
              f"Raw DER candidates: {len(candidates)}"
          )

          seen = set()
          valid = 0

          for candidate in candidates:
              digest = hashlib.sha256(
                  candidate
              ).hexdigest()

              if digest in seen:
                  continue

              seen.add(digest)

              temp = Path(
                  "raw-certs/.candidate.der"
              )

              temp.write_bytes(candidate)

              result = subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "DER",
                      "-in",
                      str(temp),
                      "-noout",
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              temp.unlink(missing_ok=True)

              if result.returncode != 0:
                  continue

              valid += 1

              output = Path(
                  "raw-certs"
              ) / f"raw-cert-{valid}.der"

              output.write_bytes(candidate)

              print(
                  f"VALID X.509: {output} "
                  f"size={len(candidate)} "
                  f"sha256={digest}"
              )

          print(
              f"Valid raw X.509 certificates: {valid}"
          )
          PY

      # ============================================================
      # Convert every discovered certificate to PEM
      # ============================================================
      - name: Normalize all certificates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p normalized

          counter=0

          # Deep parser certificates
          for cert in deep-certs/*.der; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            openssl x509 \
              -inform DER \
              -in "$cert" \
              -out "normalized/cert-${counter}.pem"
          done

          # Raw fallback certificates
          for cert in raw-certs/*.der; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            openssl x509 \
              -inform DER \
              -in "$cert" \
              -out "normalized/cert-${counter}.pem"
          done

          # apksigner certificates
          for cert in certs/*.pem; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            cp "$cert" \
              "normalized/cert-${counter}.pem"
          done

          echo "Total certificate files:"
          find normalized \
            -type f \
            -name '*.pem' \
            -print \
            | sort

      # ============================================================
      # Deduplicate certificates by SHA-256
      # ============================================================
      - name: Deduplicate certificates
        shell: bash
        run: |
          set -euo pipefail

          rm -rf unique-certs
          mkdir -p unique-certs

          declare -A seen

          counter=0

          for cert in normalized/*.pem; do
            [ -f "$cert" ] || continue

            fingerprint=$(
              openssl x509 \
                -in "$cert" \
                -outform DER \
                | sha256sum \
                | awk '{print $1}'
            )

            if [[ -n "${seen[$fingerprint]:-}" ]]; then
              echo "Duplicate: $cert"
              continue
            fi

            seen[$fingerprint]=1

            counter=$((counter + 1))

            openssl x509 \
              -in "$cert" \
              -out "unique-certs/cert-${counter}.pem"

            openssl x509 \
              -in "$cert" \
              -outform DER \
              -out "unique-certs/cert-${counter}.der"

            echo "Unique certificate #$counter"
            echo "SHA-256: $fingerprint"
            echo
          done

          echo "Unique certificates: $counter"

          if [ "$counter" -eq 0 ]; then
            echo
            echo "============================================================"
            echo "NO CERTIFICATE FOUND"
            echo "============================================================"
            echo
            echo "The APK does not expose an X.509 certificate through:"
            echo "  1. apksigner"
            echo "  2. APK Signing Block v2/v3"
            echo "  3. raw DER fallback scan"
            echo
            echo "This may mean:"
            echo "  - the file is not a normal APK;"
            echo "  - the APK is not signed;"
            echo "  - the signature/certificate is outside the APK;"
            echo "  - the file uses a signing mechanism not covered by this parser."
            echo
          fi

      # ============================================================
      # Print information for every unique certificate
      # ============================================================
      - name: Print certificate information
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "CERTIFICATE INFORMATION"
          echo "============================================================"

          for cert in unique-certs/*.pem; do
            [ -f "$cert" ] || continue

            echo
            echo "############################################################"
            echo "CERTIFICATE: $cert"
            echo "############################################################"

            echo
            echo "--- SHA-256 ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -fingerprint \
              -sha256

            echo
            echo "--- SHA-1 ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -fingerprint \
              -sha1

            echo
            echo "--- Subject ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -subject

            echo
            echo "--- Issuer ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -issuer

            echo
            echo "--- Serial ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -serial

            echo
            echo "--- Validity ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -dates
          done

      # ============================================================
      # Select primary certificate
      #
      # Priority:
      #   1. unique certificate #1
      #
      # This preserves the original workflow behavior while still
      # saving all discovered certificates.
      # ============================================================
      - name: Select primary certificate
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "unique-certs/cert-1.pem" ]; then
            echo "No certificate available."
            exit 1
          fi

          cp \
            unique-certs/cert-1.pem \
            telegram-cert.pem

          cp \
            unique-certs/cert-1.der \
            telegram-cert.der

          echo "Primary certificate selected:"
          echo "telegram-cert.pem"
          echo "telegram-cert.der"

      # ============================================================
      # Generate Kotlin byte array from primary certificate
      # ============================================================
      - name: Generate Kotlin byte array
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          data = Path(
              "telegram-cert.der"
          ).read_bytes()

          lines = []

          for i in range(0, len(data), 16):
              chunk = data[i:i + 16]

              values = ", ".join(
                  f"0x{b:02x}.toByte()"
                  for b in chunk
              )

              lines.append(
                  f"    {values},"
              )

          output = "byteArrayOf(\n"
          output += "\n".join(lines)
          output += "\n)\n"

          Path(
              "telegram-cert.kt.txt"
          ).write_text(output)

          print(
              f"Certificate size: {len(data)} bytes"
          )
          PY

      # ============================================================
      # Print primary certificate
      # ============================================================
      - name: Show primary certificate
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "PRIMARY CERTIFICATE"
          echo "============================================================"

          cat telegram-cert.pem

          echo
          echo "============================================================"
          echo "PRIMARY CERTIFICATE DER SHA-256"
          echo "============================================================"

          sha256sum telegram-cert.der

          echo
          echo "============================================================"
          echo "KOTLIN BYTE ARRAY"
          echo "============================================================"

          cat telegram-cert.kt.txt

      # ============================================================
      # Upload everything
      # ============================================================
      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificate
          path: |
            telegram.apk

            telegram-cert.pem
            telegram-cert.der
            telegram-cert.kt.txt

            apksigner-verify.txt
            apksigner-certs.txt
            apksigner-certs-pem.txt

            deep-scan-report.txt

            certs/
            deep-certs/
            raw-certs/
            normalized/
            unique-certs/
