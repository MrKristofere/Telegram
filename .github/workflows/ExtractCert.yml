name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "APK link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 "${{ inputs.link }}" -o telegram.apk
          ls -lh telegram.apk

      - name: Extract certificates
        run: |
          set -euo pipefail

          cat > extract.py <<'PY'
          import hashlib
          import struct
          import subprocess
          import sys
          from pathlib import Path

          APK = Path(sys.argv[1])
          D = APK.read_bytes()

          V2 = 0x7109871A
          V3 = 0xF05368C0
          MAGIC = b"APK Sig Block 42"

          def u32(p):
              return struct.unpack_from("<I", D, p)[0]

          def u64(p):
              return struct.unpack_from("<Q", D, p)[0]

          def cert_at(p, end):
              if p >= end or D[p] != 0x30:
                  return None

              if p + 2 > end:
                  return None

              n = D[p + 1]
              h = 2

              if n & 0x80:
                  count = n & 0x7f
                  if count == 0 or count > 4:
                      return None
                  if p + 2 + count > end:
                      return None

                  n = int.from_bytes(
                      D[p + 2:p + 2 + count],
                      "big"
                  )
                  h += count

              e = p + h + n

              if e > end or e <= p or e - p < 128:
                  return None

              cert = D[p:e]

              tmp = Path("/tmp/cert.der")
              tmp.write_bytes(cert)

              r = subprocess.run(
                  [
                      "openssl", "x509",
                      "-inform", "DER",
                      "-in", str(tmp),
                      "-noout"
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return cert if r.returncode == 0 else None

          # ----------------------------------------------------------
          # ZIP Central Directory
          # ----------------------------------------------------------

          eocd = D.rfind(b"PK\x05\x06")

          if eocd < 0:
              raise SystemExit("ERROR: ZIP EOCD not found")

          cd_size = u32(eocd + 12)
          cd_offset = u32(eocd + 16)

          print("ZIP Central Directory")
          print(f"  Offset: 0x{cd_offset:08X}")
          print(f"  Size:   {cd_size}")
          print(f"  End:    0x{cd_offset + cd_size:08X}")

          # ----------------------------------------------------------
          # APK Signing Block
          # ----------------------------------------------------------

          footer = cd_offset - 24

          if footer < 0:
              raise SystemExit(
                  "ERROR: Invalid Central Directory offset"
              )

          block_size = u64(footer)
          magic = D[footer + 8:footer + 24]

          if magic != MAGIC:
              raise SystemExit(
                  "ERROR: APK Signing Block not found"
              )

          block_offset = cd_offset - block_size - 8

          if block_offset < 0:
              raise SystemExit(
                  "ERROR: Invalid Signing Block offset"
              )

          print()
          print("APK Signing Block")
          print(f"  Offset: 0x{block_offset:08X}")
          print(f"  Size:   {block_size + 8}")
          print(f"  End:    0x{cd_offset:08X}")

          # ----------------------------------------------------------
          # Find v2/v3 entries
          # ----------------------------------------------------------

          pos = block_offset + 8
          pair_end = cd_offset - 24
          entries = []

          while pos < pair_end:
              if pos + 8 > pair_end:
                  break

              pair_size = u64(pos)
              pair_value = pos + 8
              end = pair_value + pair_size

              if end > pair_end or pair_size < 4:
                  break

              entry_id = u32(pair_value)
              value_start = pair_value + 4

              if entry_id in (V2, V3):
                  entries.append(
                      (
                          2 if entry_id == V2 else 3,
                          value_start,
                          end
                      )
                  )

              pos = end

          print()
          print("Signature entries:")

          if not entries:
              raise SystemExit(
                  "ERROR: v2/v3 entry not found"
              )

          # ----------------------------------------------------------
          # Flexible X.509 search
          # ----------------------------------------------------------

          found = {}

          for version, start, end in entries:

              print()
              print(
                  f"v{version}: "
                  f"0x{start:08X} - 0x{end:08X}"
              )

              count = 0

              for p in range(start, end):
                  cert = cert_at(p, end)

                  if cert is None:
                      continue

                  digest = hashlib.sha256(cert).hexdigest().upper()

                  # Same certificate can occur in v2 and v3.
                  if digest in found:
                      continue

                  found[digest] = (
                      version,
                      p,
                      cert
                  )

                  count += 1

                  der = Path(
                      f"telegram-cert-{len(found)}.der"
                  )
                  pem = der.with_suffix(".pem")
                  kt = der.with_suffix(".kt.txt")

                  der.write_bytes(cert)

                  subprocess.run(
                      [
                          "openssl", "x509",
                          "-inform", "DER",
                          "-in", str(der),
                          "-out", str(pem)
                      ],
                      check=True
                  )

                  values = ", ".join(
                      f"0x{x:02x}.toByte()"
                      for x in cert
                  )

                  kt.write_text(
                      "byteArrayOf(\n    "
                      + values
                      + "\n)\n"
                  )

                  sha1 = hashlib.sha1(cert).hexdigest().upper()

                  print(
                      f"  FOUND certificate #{len(found)}"
                  )
                  print(
                      f"    Offset: 0x{p:08X}"
                  )
                  print(
                      f"    End:    0x{p + len(cert):08X}"
                  )
                  print(
                      f"    Size:   {len(cert)} bytes"
                  )
                  print(
                      f"    SHA-256: {digest}"
                  )
                  print(
                      f"    SHA-1:   {sha1}"
                  )
                  print(
                      f"    DER: {der}"
                  )
                  print(
                      f"    PEM: {pem}"
                  )
                  print(
                      f"    Kotlin: {kt}"
                  )

              print(
                  f"  Certificates in v{version}: {count}"
              )

          print()
          print("=" * 55)
          print(
              f"Unique certificates: {len(found)}"
          )
          print("=" * 55)

          if not found:
              raise SystemExit(
                  "ERROR: No X.509 certificate found"
              )
          PY

          python3 extract.py telegram.apk

      - name: Upload certificates
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificates
          path: |
            telegram-cert-*.der
            telegram-cert-*.pem
            telegram-cert-*.kt.txt
