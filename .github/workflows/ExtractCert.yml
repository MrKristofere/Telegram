name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "APK link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    env:
      APK_URL: ${{ inputs.link }}
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:
      - name: Install Android SDK Build Tools
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Download APK
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            -o telegram.apk \
            "$APK_URL"

          file telegram.apk
          ls -lh telegram.apk

      - name: Verify APK with apksigner
        continue-on-error: true
        run: |
          set +e

          echo "=================================================="
          echo "apksigner verify"
          echo "=================================================="

          apksigner verify \
            --verbose \
            telegram.apk

          VERIFY_EXIT=$?

          echo
          echo "=================================================="
          echo "apksigner certificate information"
          echo "=================================================="

          apksigner verify \
            --print-certs \
            telegram.apk

          echo
          echo "apksigner exit code: $VERIFY_EXIT"

          exit "$VERIFY_EXIT"

      - name: Extract v2/v3 certificates from APK Signing Block
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import struct
          import subprocess
          import tempfile
          from pathlib import Path

          APK = Path("telegram.apk")

          V2_ID = 0x7109871A
          V3_ID = 0xF05368C0

          MAGIC = b"APK Sig Block 42"


          def u32(data, offset):
              if offset + 4 > len(data):
                  raise ValueError(
                      f"u32 out of bounds: 0x{offset:X}"
                  )
              return struct.unpack_from("<I", data, offset)[0]


          def u64(data, offset):
              if offset + 8 > len(data):
                  raise ValueError(
                      f"u64 out of bounds: 0x{offset:X}"
                  )
              return struct.unpack_from("<Q", data, offset)[0]


          def read_lp(data, pos, end, name):
              if pos + 4 > end:
                  raise ValueError(
                      f"{name}: missing length at 0x{pos:X}"
                  )

              size = u32(data, pos)
              value_start = pos + 4
              value_end = value_start + size

              if value_end > end:
                  raise ValueError(
                      f"{name}: size {size} exceeds container"
                  )

              return (
                  data[value_start:value_end],
                  pos,
                  value_start,
                  value_end,
                  value_end,
              )


          def sha256(data):
              return hashlib.sha256(data).hexdigest().upper()


          def sha1(data):
              return hashlib.sha1(data).hexdigest().upper()


          def find_eocd(data):
              start = max(0, len(data) - 65557)
              pos = data.rfind(b"PK\x05\x06", start)

              if pos < 0:
                  raise ValueError("ZIP EOCD not found")

              if pos + 22 > len(data):
                  raise ValueError("Truncated ZIP EOCD")

              return pos


          def find_central_directory(data):
              eocd = find_eocd(data)

              cd_size = u32(data, eocd + 12)
              cd_offset = u32(data, eocd + 16)

              if cd_offset == 0xFFFFFFFF:
                  raise ValueError("ZIP64 Central Directory offset unsupported")

              if cd_size == 0xFFFFFFFF:
                  raise ValueError("ZIP64 Central Directory size unsupported")

              if cd_offset + cd_size > len(data):
                  raise ValueError("Central Directory exceeds APK size")

              return cd_offset, cd_size


          def find_signing_block(data, cd_offset):
              footer_offset = cd_offset - 24

              if footer_offset < 0:
                  raise ValueError("Not enough data before Central Directory")

              block_size = u64(data, footer_offset)

              magic = data[
                  footer_offset + 8:
                  footer_offset + 24
              ]

              if magic != MAGIC:
                  raise ValueError(
                      "APK Signing Block magic not found"
                  )

              total_size = block_size + 8
              block_offset = cd_offset - total_size

              if block_offset < 0:
                  raise ValueError(
                      "Invalid APK Signing Block offset"
                  )

              first_size = u64(data, block_offset)

              if first_size != block_size:
                  raise ValueError(
                      "APK Signing Block size mismatch"
                  )

              return block_offset, total_size


          def parse_signing_block(data, block_offset, total_size):
              pair_start = block_offset + 8
              pair_end = block_offset + total_size - 24

              pos = pair_start
              entries = []

              while pos < pair_end:
                  if pos + 8 > pair_end:
                      raise ValueError(
                          f"Truncated pair at 0x{pos:X}"
                      )

                  pair_size = u64(data, pos)

                  if pair_size < 4:
                      raise ValueError(
                          f"Invalid pair size {pair_size}"
                      )

                  pair_value_start = pos + 8
                  pair_end_offset = pair_value_start + pair_size

                  if pair_end_offset > pair_end:
                      raise ValueError(
                          "Signing block pair exceeds block"
                      )

                  pair_id = u32(data, pair_value_start)

                  value_start = pair_value_start + 4
                  value_end = pair_end_offset

                  entries.append({
                      "id": pair_id,
                      "pair_offset": pos,
                      "pair_size": pair_size,
                      "value_offset": value_start,
                      "value": data[value_start:value_end],
                  })

                  pos = pair_end_offset

              if pos != pair_end:
                  raise ValueError(
                      "Signing block does not end exactly"
                  )

              return entries


          def parse_digest_sequence(blob):
              result = []
              pos = 0

              while pos < len(blob):
                  record, _, _, _, pos = read_lp(
                      blob,
                      pos,
                      len(blob),
                      "digest record",
                  )

                  if len(record) < 8:
                      raise ValueError(
                          "Digest record is too short"
                      )

                  algorithm_id = u32(record, 0)

                  digest, _, _, _, digest_pos = read_lp(
                      record,
                      4,
                      len(record),
                      "digest",
                  )

                  if digest_pos != len(record):
                      raise ValueError(
                          "Trailing bytes in digest record"
                      )

                  result.append({
                      "algorithm_id": algorithm_id,
                      "digest": digest,
                  })

              return result


          def parse_certificates(blob):
              result = []
              pos = 0

              while pos < len(blob):
                  cert, _, _, _, pos = read_lp(
                      blob,
                      pos,
                      len(blob),
                      "certificate",
                  )

                  result.append(cert)

              return result


          def parse_attributes(blob):
              result = []
              pos = 0

              while pos < len(blob):
                  attr, _, _, _, pos = read_lp(
                      blob,
                      pos,
                      len(blob),
                      "additional attribute",
                  )

                  if len(attr) < 4:
                      raise ValueError(
                          "Additional attribute is too short"
                      )

                  result.append({
                      "id": u32(attr, 0),
                      "value": attr[4:],
                  })

              return result


          def parse_signatures(blob):
              result = []
              pos = 0

              while pos < len(blob):
                  record, _, _, _, pos = read_lp(
                      blob,
                      pos,
                      len(blob),
                      "signature record",
                  )

                  if len(record) < 8:
                      raise ValueError(
                          "Signature record is too short"
                      )

                  algorithm_id = u32(record, 0)

                  signature, _, _, _, signature_pos = read_lp(
                      record,
                      4,
                      len(record),
                      "signature",
                  )

                  if signature_pos != len(record):
                      raise ValueError(
                          "Trailing bytes in signature record"
                      )

                  result.append({
                      "algorithm_id": algorithm_id,
                      "signature": signature,
                  })

              return result


          def parse_v2(value):
              signers = []
              pos = 0

              while pos < len(value):
                  signer, _, _, _, pos = read_lp(
                      value,
                      pos,
                      len(value),
                      "v2 signer",
                  )

                  signer_pos = 0

                  signed_data, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v2 SignedData",
                  )

                  sd_pos = 0

                  digests_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v2 digests",
                  )

                  certs_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v2 certificates",
                  )

                  attrs_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v2 additional attributes",
                  )

                  # Some APKs contain an additional empty LP field
                  # at the end of v2 SignedData.
                  if sd_pos < len(signed_data):
                      reserved, _, _, _, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v2 reserved field",
                      )

                      if reserved:
                          raise ValueError(
                              "Unexpected non-empty v2 reserved field"
                          )

                  if sd_pos != len(signed_data):
                      raise ValueError(
                          "Trailing data in v2 SignedData"
                      )

                  signatures_blob, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v2 signatures",
                  )

                  public_key, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v2 public key",
                  )

                  if signer_pos != len(signer):
                      raise ValueError(
                          "Trailing data in v2 signer"
                      )

                  signers.append({
                      "digests": parse_digest_sequence(digests_blob),
                      "certificates": parse_certificates(certs_blob),
                      "attributes": parse_attributes(attrs_blob),
                      "signatures": parse_signatures(signatures_blob),
                      "public_key": public_key,
                  })

              return signers


          def parse_v3(value):
              signers = []
              pos = 0

              while pos < len(value):
                  signer, _, _, _, pos = read_lp(
                      value,
                      pos,
                      len(value),
                      "v3 signer",
                  )

                  signer_pos = 0

                  signed_data, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v3 SignedData",
                  )

                  sd_pos = 0

                  digests_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v3 digests",
                  )

                  certs_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v3 certificates",
                  )

                  if sd_pos + 8 > len(signed_data):
                      raise ValueError(
                          "v3 SignedData missing SDK range"
                      )

                  min_sdk = u32(signed_data, sd_pos)
                  sd_pos += 4

                  max_sdk = u32(signed_data, sd_pos)
                  sd_pos += 4

                  attrs_blob, _, _, _, sd_pos = read_lp(
                      signed_data,
                      sd_pos,
                      len(signed_data),
                      "v3 additional attributes",
                  )

                  if sd_pos != len(signed_data):
                      raise ValueError(
                          "Trailing data in v3 SignedData"
                      )

                  if signer_pos + 8 > len(signer):
                      raise ValueError(
                          "v3 signer missing SDK range"
                      )

                  signer_min_sdk = u32(signer, signer_pos)
                  signer_pos += 4

                  signer_max_sdk = u32(signer, signer_pos)
                  signer_pos += 4

                  signatures_blob, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v3 signatures",
                  )

                  public_key, _, _, _, signer_pos = read_lp(
                      signer,
                      signer_pos,
                      len(signer),
                      "v3 public key",
                  )

                  if signer_pos != len(signer):
                      raise ValueError(
                          "Trailing data in v3 signer"
                      )

                  signers.append({
                      "digests": parse_digest_sequence(digests_blob),
                      "certificates": parse_certificates(certs_blob),
                      "attributes": parse_attributes(attrs_blob),
                      "min_sdk": min_sdk,
                      "max_sdk": max_sdk,
                      "signer_min_sdk": signer_min_sdk,
                      "signer_max_sdk": signer_max_sdk,
                      "signatures": parse_signatures(signatures_blob),
                      "public_key": public_key,
                  })

              return signers


          def algorithm_name(algorithm_id):
              return {
                  0x0101: "RSASSA-PSS / SHA-256",
                  0x0102: "RSASSA-PSS / SHA-512",
                  0x0103: "RSASSA-PKCS1-v1_5 / SHA-256",
                  0x0104: "RSASSA-PKCS1-v1_5 / SHA-512",
                  0x0201: "ECDSA / SHA-256",
                  0x0202: "ECDSA / SHA-512",
                  0x0301: "DSA / SHA-256",
              }.get(
                  algorithm_id,
                  f"UNKNOWN (0x{algorithm_id:08X})",
              )


          def save_certificate(cert, version, signer, index):
              der = Path(
                  f"telegram-cert-v{version}-"
                  f"signer{signer}-"
                  f"cert{index}.der"
              )

              pem = der.with_suffix(".pem")

              der.write_bytes(cert)

              subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "DER",
                      "-in",
                      str(der),
                      "-out",
                      str(pem),
                  ],
                  check=True,
              )

              print(f"      DER: {der}")
              print(f"      PEM: {pem}")
              print(f"      Size: {len(cert)} bytes")
              print(f"      SHA-256: {sha256(cert)}")
              print(f"      SHA-1:   {sha1(cert)}")

              with tempfile.NamedTemporaryFile(
                  suffix=".der",
                  delete=False,
              ) as f:
                  f.write(cert)
                  temp_path = f.name

              try:
                  info = subprocess.run(
                      [
                          "openssl",
                          "x509",
                          "-inform",
                          "DER",
                          "-in",
                          temp_path,
                          "-noout",
                          "-subject",
                          "-issuer",
                          "-serial",
                          "-dates",
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )

                  print("      Certificate information:")
                  for line in info.stdout.strip().splitlines():
                      print(f"        {line}")

              finally:
                  Path(temp_path).unlink(missing_ok=True)


          def print_scheme(version, signers):
              print()
              print("=" * 60)
              print(f"APK SIGNATURE SCHEME v{version}")
              print("=" * 60)

              print(f"Signers: {len(signers)}")

              for signer_index, signer in enumerate(signers, 1):
                  print()
                  print(f"  Signer #{signer_index}")

                  print(
                      f"    Certificates: "
                      f"{len(signer['certificates'])}"
                  )

                  for cert_index, cert in enumerate(
                      signer["certificates"],
                      1,
                  ):
                      print()
                      print(
                          f"    Certificate #{cert_index}"
                      )

                      save_certificate(
                          cert,
                          version,
                          signer_index,
                          cert_index,
                      )

                  print(
                      f"    Digests: "
                      f"{len(signer['digests'])}"
                  )

                  for digest_index, digest in enumerate(
                      signer["digests"],
                      1,
                  ):
                      print(
                          f"      Digest #{digest_index}: "
                          f"algorithm=0x"
                          f"{digest['algorithm_id']:08X} "
                          f"({algorithm_name(digest['algorithm_id'])})"
                      )

                      print(
                          f"        {digest['digest'].hex().upper()}"
                      )

                  print(
                      f"    Signatures: "
                      f"{len(signer['signatures'])}"
                  )

                  for signature_index, signature in enumerate(
                      signer["signatures"],
                      1,
                  ):
                      print(
                          f"      Signature #{signature_index}: "
                          f"algorithm=0x"
                          f"{signature['algorithm_id']:08X} "
                          f"({algorithm_name(signature['algorithm_id'])}), "
                          f"size={len(signature['signature'])}"
                      )

                  print(
                      f"    Public key: "
                      f"{len(signer['public_key'])} bytes"
                  )

                  if version == 3:
                      print(
                          f"    SignedData minSDK: "
                          f"{signer['min_sdk']}"
                      )
                      print(
                          f"    SignedData maxSDK: "
                          f"{signer['max_sdk']}"
                      )
                      print(
                          f"    Signer minSDK: "
                          f"{signer['signer_min_sdk']}"
                      )
                      print(
                          f"    Signer maxSDK: "
                          f"{signer['signer_max_sdk']}"
                      )


          data = APK.read_bytes()

          print("=" * 60)
          print("DEEP APK SIGNATURE INSPECTION")
          print("=" * 60)
          print(f"APK: {APK}")
          print(f"Size: {len(data)} bytes")
          print()

          cd_offset, cd_size = find_central_directory(data)

          print("ZIP Central Directory")
          print(f"  Offset: 0x{cd_offset:08X}")
          print(f"  Size:   {cd_size} bytes")
          print(f"  End:    0x{cd_offset + cd_size:08X}")
          print()

          block_offset, block_size = find_signing_block(
              data,
              cd_offset,
          )

          print("APK Signing Block")
          print(f"  Offset: 0x{block_offset:08X}")
          print(f"  Size:   {block_size} bytes")
          print(f"  End:    0x{cd_offset:08X}")
          print(f"  Magic:  {MAGIC.decode()}")
          print()

          entries = parse_signing_block(
              data,
              block_offset,
              block_size,
          )

          v2_found = False
          v3_found = False

          print("Signing Block entries:")
          print()

          for entry in entries:
              entry_id = entry["id"]

              print(
                  f"  ID: 0x{entry_id:08X}, "
                  f"pair size: {entry['pair_size']} bytes, "
                  f"value offset: "
                  f"0x{entry['value_offset']:08X}, "
                  f"value size: {len(entry['value'])} bytes"
              )

              if entry_id == V2_ID:
                  v2_found = True

                  signers = parse_v2(
                      entry["value"],
                  )

                  print_scheme(
                      2,
                      signers,
                  )

              elif entry_id == V3_ID:
                  v3_found = True

                  signers = parse_v3(
                      entry["value"],
                  )

                  print_scheme(
                      3,
                      signers,
                  )

              else:
                  print("    Other signing block entry")

              print()

          if not v2_found:
              print("ERROR: v2 signing block not found")
              raise SystemExit(1)

          if not v3_found:
              print("ERROR: v3 signing block not found")
              raise SystemExit(1)

          v2_certs = list(
              Path(".").glob("telegram-cert-v2-*.der")
          )

          v3_certs = list(
              Path(".").glob("telegram-cert-v3-*.der")
          )

          if not v2_certs:
              raise SystemExit(
                  "ERROR: No v2 certificates extracted"
              )

          if not v3_certs:
              raise SystemExit(
                  "ERROR: No v3 certificates extracted"
              )

          print("=" * 60)
          print("EXTRACTION RESULT")
          print("=" * 60)
          print(f"v2 certificates: {len(v2_certs)}")
          print(f"v3 certificates: {len(v3_certs)}")
          print()

          print("Extracted files:")

          for path in sorted(
              Path(".").glob("telegram-cert-v*.der")
          ):
              print(f"  {path}")
          PY

      - name: Export apksigner output
        run: |
          set -euo pipefail

          apksigner verify \
            --print-certs-pem \
            telegram.apk \
            > certificate-output.txt

          echo "=================================================="
          echo "apksigner PEM output"
          echo "=================================================="

          cat certificate-output.txt

      - name: Print extracted certificate fingerprints
        run: |
          set -euo pipefail

          found=0

          for pem in telegram-cert-v*.pem; do
            [ -f "$pem" ] || continue

            found=1

            echo
            echo "=================================================="
            echo "$pem"
            echo "=================================================="

            echo "--- Subject / Issuer / Serial / Dates ---"

            openssl x509 \
              -in "$pem" \
              -noout \
              -subject \
              -issuer \
              -serial \
              -dates

            echo
            echo "--- SHA-256 fingerprint ---"

            openssl x509 \
              -in "$pem" \
              -noout \
              -fingerprint \
              -sha256

            echo
            echo "--- SHA-1 fingerprint ---"

            openssl x509 \
              -in "$pem" \
              -noout \
              -fingerprint \
              -sha1
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No PEM certificates found"
            exit 1
          fi

      - name: Generate Kotlin byte arrays
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          files = sorted(
              Path(".").glob("telegram-cert-v*.der")
          )

          if not files:
              raise SystemExit(
                  "No DER certificates found"
              )

          for der in files:
              data = der.read_bytes()

              lines = []

              for i in range(0, len(data), 16):
                  chunk = data[i:i + 16]

                  values = ", ".join(
                      f"0x{byte:02x}.toByte()"
                      for byte in chunk
                  )

                  lines.append(
                      f"    {values},"
                  )

              output = "byteArrayOf(\n"
              output += "\n".join(lines)
              output += "\n)\n"

              out = der.with_suffix(".kt.txt")
              out.write_text(
                  output,
                  encoding="utf-8",
              )

              print(
                  f"Generated {out} "
                  f"({len(data)} bytes)"
              )
          PY

      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificate
          path: |
            telegram-cert-v*.der
            telegram-cert-v*.pem
            telegram-cert-v*.kt.txt
            certificate-output.txt
