name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "apk link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    env:
      APK_URL: ${{ inputs.link }}
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:

      # ============================================================
      # Android SDK / apksigner
      # ============================================================
      - name: Install Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      # ============================================================
      # Download APK
      # ============================================================
      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -o telegram.apk \
            "$APK_URL"

          file telegram.apk
          ls -lh telegram.apk

      # ============================================================
      # Basic APK inspection
      # ============================================================
      - name: Inspect APK
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "APK FILE"
          echo "============================================================"

          file telegram.apk
          ls -lh telegram.apk

          echo
          echo "============================================================"
          echo "ZIP ENTRIES"
          echo "============================================================"

          unzip -l telegram.apk 2>/dev/null | head -100 || true

          echo
          echo "============================================================"
          echo "META-INF"
          echo "============================================================"

          unzip -l telegram.apk 2>/dev/null \
            | grep -Ei 'META-INF/.*\.(RSA|DSA|EC|SF)$' \
            || echo "No traditional META-INF signature files found"

      # ============================================================
      # Official Android signature verification
      #
      # apksigner/apksig understands:
      #   v1
      #   v2
      #   v3
      #   newer supported schemes
      # ============================================================
      - name: Verify APK with apksigner
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "apksigner --verbose"
          echo "============================================================"

          apksigner verify \
            --verbose \
            telegram.apk \
            2>&1 | tee apksigner-verify.txt

          echo
          echo "============================================================"
          echo "apksigner --print-certs"
          echo "============================================================"

          apksigner verify \
            --print-certs \
            telegram.apk \
            2>&1 | tee apksigner-certs.txt

          echo
          echo "============================================================"
          echo "apksigner --print-certs-pem"
          echo "============================================================"

          apksigner verify \
            --print-certs-pem \
            telegram.apk \
            2>&1 | tee apksigner-certs-pem.txt

          exit 0

      # ============================================================
      # Extract ALL certificates returned by apksigner
      # ============================================================
      - name: Extract certificates from apksigner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf certs
          mkdir -p certs

          python3 <<'PY'
          import re
          from pathlib import Path

          source = Path("apksigner-certs-pem.txt")

          if not source.exists():
              print("apksigner output does not exist")
              raise SystemExit(0)

          data = source.read_text(errors="replace")

          pattern = re.compile(
              r"-----BEGIN CERTIFICATE-----.*?"
              r"-----END CERTIFICATE-----",
              re.S,
          )

          certs = pattern.findall(data)

          print(f"Certificates found by apksigner: {len(certs)}")

          for index, cert in enumerate(certs, 1):
              path = Path("certs") / f"apksigner-cert-{index}.pem"

              path.write_text(
                  cert.strip() + "\n"
              )

              print(f"  {path}")

          if not certs:
              print("No PEM certificates found in apksigner output.")
          PY

          ls -lah certs || true

      # ============================================================
      # Deep parser
      #
      # Searches the APK Signing Block directly.
      #
      # APK Signing Block:
      #
      #   size
      #   ID/value pairs
      #   size
      #   magic:
      #       APK Sig Block 42
      #
      # v2 ID = 0x7109871a
      # v3 ID = 0xf05368c0
      # ============================================================
      - name: Deep scan APK Signing Block
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deep-certs
          rm -f deep-scan-report.txt

          python3 <<'PY'
          from pathlib import Path
          import struct
          import hashlib
          import re

          APK = Path("telegram.apk")
          data = APK.read_bytes()

          MAGIC = b"APK Sig Block 42"

          V2_ID = 0x7109871a
          V3_ID = 0xf05368c0

          print("=" * 70)
          print("DEEP APK SIGNATURE SCAN")
          print("=" * 70)

          print(f"APK size: {len(data)} bytes")

          # ----------------------------------------------------------
          # Locate ZIP End Of Central Directory
          # ----------------------------------------------------------
          eocd = data.rfind(b"PK\x05\x06")

          if eocd < 0:
              print("ERROR: ZIP End Of Central Directory not found.")
              raise SystemExit(0)

          print(f"EOCD offset: 0x{eocd:x}")

          if eocd + 22 > len(data):
              print("ERROR: Invalid EOCD.")
              raise SystemExit(0)

          central_dir_offset = struct.unpack_from(
              "<I",
              data,
              eocd + 16
          )[0]

          central_dir_size = struct.unpack_from(
              "<I",
              data,
              eocd + 12
          )[0]

          print(
              f"Central directory offset from EOCD: "
              f"0x{central_dir_offset:x}"
          )

          print(
              f"Central directory size: "
              f"0x{central_dir_size:x}"
          )

          # ----------------------------------------------------------
          # Locate APK Signing Block.
          #
          # The signing block is immediately before the central
          # directory. Its last 24 bytes contain:
          #
          #   uint64 size
          #   uint64 size
          #   "APK Sig Block 42"
          # ----------------------------------------------------------
          footer = central_dir_offset

          if footer < 24:
              print("No room for APK Signing Block.")
              raise SystemExit(0)

          footer_start = footer - 24

          footer_size = struct.unpack_from(
              "<Q",
              data,
              footer_start
          )[0]

          footer_magic = data[
              footer_start + 8:
              footer_start + 24
          ]

          print(f"Signing block footer size: {footer_size}")
          print(f"Signing block magic: {footer_magic!r}")

          if footer_magic != MAGIC:
              print()
              print("Standard APK Signing Block was not found.")
              print("Trying raw DER certificate fallback scan.")
              raise SystemExit(10)

          block_start = footer_start + 8 - footer_size

          if block_start < 0:
              print("Invalid APK Signing Block start.")
              raise SystemExit(1)

          block_size_at_start = struct.unpack_from(
              "<Q",
              data,
              block_start
          )[0]

          print(f"Signing block start: 0x{block_start:x}")
          print(f"Signing block size: {block_size_at_start}")

          if block_size_at_start != footer_size:
              print("WARNING: start/end signing block sizes differ.")

          pairs_start = block_start + 8
          pairs_end = footer_start

          print(f"Pairs: 0x{pairs_start:x} - 0x{pairs_end:x}")

          found_blocks = []

          # ----------------------------------------------------------
          # Parse ID/value pairs
          # ----------------------------------------------------------
          pos = pairs_start

          while pos < pairs_end:
              if pos + 8 > pairs_end:
                  print("Truncated ID/value pair.")
                  break

              pair_size = struct.unpack_from(
                  "<Q",
                  data,
                  pos
              )[0]

              if pair_size < 4:
                  print(
                      f"Invalid pair size {pair_size} "
                      f"at 0x{pos:x}"
                  )
                  break

              pair_end = pos + 8 + pair_size

              if pair_end > pairs_end:
                  print(
                      "Pair extends outside Signing Block: "
                      f"0x{pos:x}"
                  )
                  break

              pair_id = struct.unpack_from(
                  "<I",
                  data,
                  pos + 8
              )[0]

              value_start = pos + 12
              value_end = pair_end

              value = data[value_start:value_end]

              print()
              print(
                  f"PAIR ID=0x{pair_id:08x} "
                  f"size={len(value)} "
                  f"offset=0x{value_start:x}"
              )

              if pair_id in (V2_ID, V3_ID):
                  found_blocks.append(
                      (
                          pair_id,
                          value
                      )
                  )

                  print(
                      "  -> APK Signature Scheme "
                      + ("v2" if pair_id == V2_ID else "v3")
                  )

              pos = pair_end

          print()
          print(
              f"Known signature blocks found: "
              f"{len(found_blocks)}"
          )

          # ----------------------------------------------------------
          # DER certificate extraction
          #
          # X.509 certificates are DER SEQUENCE values.
          # We use strict OpenSSL validation afterwards.
          # ----------------------------------------------------------
          def extract_der_candidates(blob):
              candidates = []

              for m in re.finditer(
                  b"\x30\x82",
                  blob
              ):
                  start = m.start()

                  if start + 4 > len(blob):
                      continue

                  length = int.from_bytes(
                      blob[start + 2:start + 4],
                      "big"
                  )

                  total = 4 + length
                  end = start + total

                  if end > len(blob):
                      continue

                  candidate = blob[start:end]

                  # Certificate DER almost always starts with:
                  # 30 82 ... and contains ASN.1 structures.
                  if len(candidate) < 128:
                      continue

                  candidates.append(candidate)

              # Also support DER with 0x81 length.
              for m in re.finditer(
                  b"\x30\x81",
                  blob
              ):
                  start = m.start()

                  if start + 3 > len(blob):
                      continue

                  length = blob[start + 2]

                  total = 3 + length
                  end = start + total

                  if end > len(blob):
                      continue

                  candidate = blob[start:end]

                  if len(candidate) < 128:
                      continue

                  candidates.append(candidate)

              # Deduplicate.
              unique = []
              seen = set()

              for candidate in candidates:
                  digest = hashlib.sha256(candidate).hexdigest()

                  if digest not in seen:
                      seen.add(digest)
                      unique.append(candidate)

              return unique

          # ----------------------------------------------------------
          # Save certificate candidates.
          # OpenSSL decides whether candidate is actually X.509.
          # ----------------------------------------------------------
          import subprocess

          cert_counter = 0

          def save_candidates(blob, source):
              nonlocal cert_counter

              candidates = extract_der_candidates(blob)

              print(
                  f"{source}: DER candidates = "
                  f"{len(candidates)}"
              )

              for candidate in candidates:
                  temp = Path("deep-certs") / (
                      f".candidate-{cert_counter}.der"
                  )

                  temp.write_bytes(candidate)

                  result = subprocess.run(
                      [
                          "openssl",
                          "x509",
                          "-inform",
                          "DER",
                          "-in",
                          str(temp),
                          "-noout",
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  )

                  if result.returncode != 0:
                      temp.unlink(missing_ok=True)
                      continue

                  cert_counter += 1

                  final = Path("deep-certs") / (
                      f"deep-cert-{cert_counter}.der"
                  )

                  temp.rename(final)

                  print(
                      f"  VALID X.509: {final} "
                      f"({len(candidate)} bytes)"
                  )

          for pair_id, value in found_blocks:
              version = (
                  "v2"
                  if pair_id == V2_ID
                  else "v3"
              )

              save_candidates(
                  value,
                  f"APK Signature Scheme {version}"
              )

          print()
          print(
              f"Valid certificates from Signing Block: "
              f"{cert_counter}"
          )

          Path("deep-scan-report.txt").write_text(
              "Deep APK Signing Block scan completed.\n"
              f"APK size: {len(data)}\n"
              f"Signing block found: yes\n"
              f"v2/v3 blocks found: {len(found_blocks)}\n"
              f"Valid certificates: {cert_counter}\n"
          )

          raise SystemExit(0)
          PY

          status=$?

          # Exit code 10 means no standard Signing Block.
          if [ "$status" -eq 10 ]; then
            echo "No standard Signing Block. Continuing with raw scan."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      # ============================================================
      # Raw fallback scan
      #
      # If the APK does not have a normal Signing Block, search the
      # entire binary for valid DER X.509 certificates.
      # ============================================================
      - name: Raw X.509 certificate fallback
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p raw-certs

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import hashlib

          apk = Path("telegram.apk").read_bytes()

          print("=" * 70)
          print("RAW X.509 FALLBACK SCAN")
          print("=" * 70)

          candidates = []

          # DER SEQUENCE with two-byte length.
          for m in re.finditer(
              b"\x30\x82",
              apk
          ):
              start = m.start()

              if start + 4 > len(apk):
                  continue

              length = int.from_bytes(
                  apk[start + 2:start + 4],
                  "big"
              )

              end = start + 4 + length

              if end > len(apk):
                  continue

              candidates.append(
                  apk[start:end]
              )

          # DER SEQUENCE with one-byte length.
          for m in re.finditer(
              b"\x30\x81",
              apk
          ):
              start = m.start()

              if start + 3 > len(apk):
                  continue

              length = apk[start + 2]

              end = start + 3 + length

              if end > len(apk):
                  continue

              candidates.append(
                  apk[start:end]
              )

          print(
              f"Raw DER candidates: {len(candidates)}"
          )

          seen = set()
          valid = 0

          for candidate in candidates:
              digest = hashlib.sha256(
                  candidate
              ).hexdigest()

              if digest in seen:
                  continue

              seen.add(digest)

              temp = Path(
                  "raw-certs/.candidate.der"
              )

              temp.write_bytes(candidate)

              result = subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "DER",
                      "-in",
                      str(temp),
                      "-noout",
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              temp.unlink(missing_ok=True)

              if result.returncode != 0:
                  continue

              valid += 1

              output = Path(
                  "raw-certs"
              ) / f"raw-cert-{valid}.der"

              output.write_bytes(candidate)

              print(
                  f"VALID X.509: {output} "
                  f"size={len(candidate)} "
                  f"sha256={digest}"
              )

          print(
              f"Valid raw X.509 certificates: {valid}"
          )
          PY

      # ============================================================
      # Convert every discovered certificate to PEM
      # ============================================================
      - name: Normalize all certificates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p normalized

          counter=0

          # Deep parser certificates
          for cert in deep-certs/*.der; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            openssl x509 \
              -inform DER \
              -in "$cert" \
              -out "normalized/cert-${counter}.pem"
          done

          # Raw fallback certificates
          for cert in raw-certs/*.der; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            openssl x509 \
              -inform DER \
              -in "$cert" \
              -out "normalized/cert-${counter}.pem"
          done

          # apksigner certificates
          for cert in certs/*.pem; do
            [ -f "$cert" ] || continue

            counter=$((counter + 1))

            cp "$cert" \
              "normalized/cert-${counter}.pem"
          done

          echo "Total certificate files:"
          find normalized \
            -type f \
            -name '*.pem' \
            -print \
            | sort

      # ============================================================
      # Deduplicate certificates by SHA-256
      # ============================================================
      - name: Deduplicate certificates
        shell: bash
        run: |
          set -euo pipefail

          rm -rf unique-certs
          mkdir -p unique-certs

          declare -A seen

          counter=0

          for cert in normalized/*.pem; do
            [ -f "$cert" ] || continue

            fingerprint=$(
              openssl x509 \
                -in "$cert" \
                -outform DER \
                | sha256sum \
                | awk '{print $1}'
            )

            if [[ -n "${seen[$fingerprint]:-}" ]]; then
              echo "Duplicate: $cert"
              continue
            fi

            seen[$fingerprint]=1

            counter=$((counter + 1))

            openssl x509 \
              -in "$cert" \
              -out "unique-certs/cert-${counter}.pem"

            openssl x509 \
              -in "$cert" \
              -outform DER \
              -out "unique-certs/cert-${counter}.der"

            echo "Unique certificate #$counter"
            echo "SHA-256: $fingerprint"
            echo
          done

          echo "Unique certificates: $counter"

          if [ "$counter" -eq 0 ]; then
            echo
            echo "============================================================"
            echo "NO CERTIFICATE FOUND"
            echo "============================================================"
            echo
            echo "The APK does not expose an X.509 certificate through:"
            echo "  1. apksigner"
            echo "  2. APK Signing Block v2/v3"
            echo "  3. raw DER fallback scan"
            echo
            echo "This may mean:"
            echo "  - the file is not a normal APK;"
            echo "  - the APK is not signed;"
            echo "  - the signature/certificate is outside the APK;"
            echo "  - the file uses a signing mechanism not covered by this parser."
            echo
          fi

      # ============================================================
      # Print information for every unique certificate
      # ============================================================
      - name: Print certificate information
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "CERTIFICATE INFORMATION"
          echo "============================================================"

          for cert in unique-certs/*.pem; do
            [ -f "$cert" ] || continue

            echo
            echo "############################################################"
            echo "CERTIFICATE: $cert"
            echo "############################################################"

            echo
            echo "--- SHA-256 ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -fingerprint \
              -sha256

            echo
            echo "--- SHA-1 ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -fingerprint \
              -sha1

            echo
            echo "--- Subject ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -subject

            echo
            echo "--- Issuer ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -issuer

            echo
            echo "--- Serial ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -serial

            echo
            echo "--- Validity ---"
            openssl x509 \
              -in "$cert" \
              -noout \
              -dates
          done

      # ============================================================
      # Select primary certificate
      #
      # Priority:
      #   1. unique certificate #1
      #
      # This preserves the original workflow behavior while still
      # saving all discovered certificates.
      # ============================================================
      - name: Select primary certificate
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "unique-certs/cert-1.pem" ]; then
            echo "No certificate available."
            exit 1
          fi

          cp \
            unique-certs/cert-1.pem \
            telegram-cert.pem

          cp \
            unique-certs/cert-1.der \
            telegram-cert.der

          echo "Primary certificate selected:"
          echo "telegram-cert.pem"
          echo "telegram-cert.der"

      # ============================================================
      # Generate Kotlin byte array from primary certificate
      # ============================================================
      - name: Generate Kotlin byte array
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          data = Path(
              "telegram-cert.der"
          ).read_bytes()

          lines = []

          for i in range(0, len(data), 16):
              chunk = data[i:i + 16]

              values = ", ".join(
                  f"0x{b:02x}.toByte()"
                  for b in chunk
              )

              lines.append(
                  f"    {values},"
              )

          output = "byteArrayOf(\n"
          output += "\n".join(lines)
          output += "\n)\n"

          Path(
              "telegram-cert.kt.txt"
          ).write_text(output)

          print(
              f"Certificate size: {len(data)} bytes"
          )
          PY

      # ============================================================
      # Print primary certificate
      # ============================================================
      - name: Show primary certificate
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "PRIMARY CERTIFICATE"
          echo "============================================================"

          cat telegram-cert.pem

          echo
          echo "============================================================"
          echo "PRIMARY CERTIFICATE DER SHA-256"
          echo "============================================================"

          sha256sum telegram-cert.der

          echo
          echo "============================================================"
          echo "KOTLIN BYTE ARRAY"
          echo "============================================================"

          cat telegram-cert.kt.txt

      # ============================================================
      # Upload everything
      # ============================================================
      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificate
          path: |
            telegram.apk

            telegram-cert.pem
            telegram-cert.der
            telegram-cert.kt.txt

            apksigner-verify.txt
            apksigner-certs.txt
            apksigner-certs-pem.txt

            deep-scan-report.txt

            certs/
            deep-certs/
            raw-certs/
            normalized/
            unique-certs/
