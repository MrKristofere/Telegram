name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "APK link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    env:
      APK_URL: ${{ inputs.link }}
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:
      - name: Install Android SDK Build Tools
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Download APK
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            -o telegram.apk \
            "$APK_URL"

          file telegram.apk
          ls -lh telegram.apk

      # ------------------------------------------------------------
      # Independent verification using Google's apksigner
      # ------------------------------------------------------------

      - name: Verify APK with apksigner
        run: |
          set +e

          echo "=================================================="
          echo "apksigner verify"
          echo "=================================================="

          apksigner verify \
            --verbose \
            telegram.apk

          VERIFY_EXIT=$?

          echo
          echo "=================================================="
          echo "apksigner certificate information"
          echo "=================================================="

          apksigner verify \
            --print-certs \
            telegram.apk

          echo
          echo "apksigner exit code: $VERIFY_EXIT"

          exit $VERIFY_EXIT

      # ------------------------------------------------------------
      # Deep APK Signing Block parser
      # ------------------------------------------------------------

      - name: Deep extract v2/v3 certificates
        run: |
          set -euo pipefail

          cat > inspect_apk_signature.py <<'PY'
          #!/usr/bin/env python3

          import hashlib
          import struct
          import subprocess
          import sys
          import tempfile
          from pathlib import Path


          APK_SIG_BLOCK_MAGIC = b"APK Sig Block 42"

          V2_ID = 0x7109871A
          V3_ID = 0xF05368C0

          UINT32_MAX = 0xFFFFFFFF


          def u32(data, offset):
              if offset + 4 > len(data):
                  raise ValueError(
                      f"u32 out of bounds at 0x{offset:X}"
                  )
              return struct.unpack_from("<I", data, offset)[0]


          def u64(data, offset):
              if offset + 8 > len(data):
                  raise ValueError(
                      f"u64 out of bounds at 0x{offset:X}"
                  )
              return struct.unpack_from("<Q", data, offset)[0]


          def read_lp(data, offset, end, name):
              if offset + 4 > end:
                  raise ValueError(
                      f"{name}: missing uint32 length at "
                      f"0x{offset:X}"
                  )

              size = u32(data, offset)
              value_start = offset + 4
              value_end = value_start + size

              if value_end > end:
                  raise ValueError(
                      f"{name}: length {size} exceeds container "
                      f"(remaining {end - value_start})"
                  )

              return (
                  data[value_start:value_end],
                  offset,
                  value_start,
                  value_end,
                  value_end,
              )


          def sha256(data):
              return hashlib.sha256(data).hexdigest().upper()


          def sha1(data):
              return hashlib.sha1(data).hexdigest().upper()


          def find_eocd(data):
              signature = b"PK\x05\x06"

              # EOCD must be inside the final 65557 bytes.
              start = max(0, len(data) - 65557)

              pos = data.rfind(signature, start)

              if pos < 0:
                  raise ValueError("ZIP EOCD not found")

              if pos + 22 > len(data):
                  raise ValueError("Truncated ZIP EOCD")

              return pos


          def find_central_directory(data):
              eocd = find_eocd(data)

              cd_size = u32(data, eocd + 12)
              cd_offset = u32(data, eocd + 16)

              # ZIP64 is intentionally rejected here because this workflow
              # is intended for normal Android APKs.
              if cd_offset == UINT32_MAX or cd_size == UINT32_MAX:
                  raise ValueError(
                      "ZIP64 APK is not supported by this parser"
                  )

              if cd_offset + cd_size > len(data):
                  raise ValueError(
                      "Central Directory exceeds APK size"
                  )

              return cd_offset, cd_size


          def find_apk_signing_block(data, cd_offset):
              footer_size_offset = cd_offset - 24

              if footer_size_offset < 0:
                  raise ValueError(
                      "Not enough data before Central Directory"
                  )

              block_size = u64(data, footer_size_offset)

              magic = data[
                  footer_size_offset + 8:
                  footer_size_offset + 24
              ]

              if magic != APK_SIG_BLOCK_MAGIC:
                  raise ValueError(
                      "APK Signing Block magic not found"
                  )

              total_size = block_size + 8

              block_offset = cd_offset - total_size

              if block_offset < 0:
                  raise ValueError(
                      "Invalid APK Signing Block offset"
                  )

              first_size = u64(data, block_offset)

              if first_size != block_size:
                  raise ValueError(
                      "APK Signing Block size mismatch"
                  )

              return block_offset, total_size


          def parse_signing_block(data, block_offset, total_size):
              pair_start = block_offset + 8
              pair_end = block_offset + total_size - 24

              pos = pair_start
              entries = []

              while pos < pair_end:
                  if pos + 8 > pair_end:
                      raise ValueError(
                          f"Truncated signing block pair at "
                          f"0x{pos:X}"
                      )

                  pair_size = u64(data, pos)

                  if pair_size < 4:
                      raise ValueError(
                          f"Invalid pair size {pair_size} "
                          f"at 0x{pos:X}"
                      )

                  pair_value_start = pos + 8
                  pair_end_offset = pair_value_start + pair_size

                  if pair_end_offset > pair_end:
                      raise ValueError(
                          f"Pair at 0x{pos:X} exceeds signing block"
                      )

                  pair_id = u32(data, pair_value_start)

                  value_start = pair_value_start + 4
                  value_end = pair_end_offset

                  entries.append({
                      "id": pair_id,
                      "pair_offset": pos,
                      "pair_size": pair_size,
                      "value_offset": value_start,
                      "value_end": value_end,
                      "value": data[value_start:value_end],
                  })

                  pos = pair_end_offset

              if pos != pair_end:
                  raise ValueError(
                      "Signing block pair area does not end exactly"
                  )

              return entries


          def parse_digest_sequence(blob, absolute_offset):
              """
              AOSP format:

                digests =
                  length-prefixed digest record
                  length-prefixed digest record
                  ...

                digest record =
                  uint32 algorithm ID
                  length-prefixed digest
              """

              result = []

              pos = 0

              while pos < len(blob):
                  record, record_header, record_start, record_end, pos = \
                      read_lp(
                          blob,
                          pos,
                          len(blob),
                          "digest record"
                      )

                  if len(record) < 8:
                      raise ValueError(
                          "Digest record is too short"
                      )

                  algorithm_id = u32(record, 0)

                  digest, _, digest_start, digest_end, digest_pos = \
                      read_lp(
                          record,
                          4,
                          len(record),
                          "digest"
                      )

                  if digest_pos != len(record):
                      raise ValueError(
                          "Trailing bytes in digest record"
                      )

                  result.append({
                      "algorithm_id": algorithm_id,
                      "algorithm_offset":
                          absolute_offset + record_start,
                      "digest_offset":
                          absolute_offset + record_start + digest_start,
                      "digest": digest,
                      "digest_size": len(digest),
                  })

              return result


          def parse_certificates(blob, absolute_offset):
              result = []

              pos = 0
              number = 0

              while pos < len(blob):
                  number += 1

                  cert, _, cert_start, cert_end, pos = \
                      read_lp(
                          blob,
                          pos,
                          len(blob),
                          "certificate"
                      )

                  result.append({
                      "number": number,
                      "offset": absolute_offset + cert_start,
                      "size": len(cert),
                      "data": cert,
                  })

              return result


          def parse_additional_attributes(blob, absolute_offset):
              result = []

              pos = 0

              while pos < len(blob):
                  attr, _, attr_start, attr_end, pos = \
                      read_lp(
                          blob,
                          pos,
                          len(blob),
                          "additional attribute"
                      )

                  if len(attr) < 4:
                      raise ValueError(
                          "Additional attribute is too short"
                      )

                  attr_id = u32(attr, 0)

                  result.append({
                      "id": attr_id,
                      "offset": absolute_offset + attr_start,
                      "size": len(attr),
                      "value": attr[4:],
                  })

              return result


          def parse_signatures(blob):
              result = []

              pos = 0

              while pos < len(blob):
                  record, _, record_start, record_end, pos = \
                      read_lp(
                          blob,
                          pos,
                          len(blob),
                          "signature record"
                      )

                  if len(record) < 8:
                      raise ValueError(
                          "Signature record is too short"
                      )

                  algorithm_id = u32(record, 0)

                  signature, _, signature_start, signature_end, signature_pos = \
                      read_lp(
                          record,
                          4,
                          len(record),
                          "signature"
                      )

                  if signature_pos != len(record):
                      raise ValueError(
                          "Trailing bytes in signature record"
                      )

                  result.append({
                      "algorithm_id": algorithm_id,
                      "signature": signature,
                  })

              return result


          def parse_v2(value, value_absolute_offset):
              result = {
                  "version": 2,
                  "signers": [],
              }

              pos = 0

              while pos < len(value):
                  signer_blob, _, signer_start, signer_end, pos = \
                      read_lp(
                          value,
                          pos,
                          len(value),
                          "v2 signer"
                      )

                  signer_absolute = (
                      value_absolute_offset + signer_start
                  )

                  signer_pos = 0

                  signed_data, _, signed_data_start, signed_data_end, \
                      signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v2 signed data"
                      )

                  signed_data_absolute = (
                      signer_absolute + signed_data_start
                  )

                  sd_pos = 0

                  digest_blob, _, digest_start, digest_end, sd_pos = \
                      read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v2 digests"
                      )

                  digest_absolute = (
                      signed_data_absolute + digest_start
                  )

                  certificates_blob, _, certificates_start, \
                      certificates_end, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v2 certificates"
                      )

                  certificates_absolute = (
                      signed_data_absolute + certificates_start
                  )

                  attributes_blob, _, attributes_start, \
                      attributes_end, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v2 additional attributes"
                      )

                  attributes_absolute = (
                      signed_data_absolute + attributes_start
                  )

                  # Some signing implementations leave an additional
                  # empty LP field here. Accept it when present.
                  reserved = b""

                  if sd_pos < len(signed_data):
                      reserved, _, reserved_start, \
                          reserved_end, sd_pos = read_lp(
                              signed_data,
                              sd_pos,
                              len(signed_data),
                              "v2 reserved field"
                          )

                  if sd_pos != len(signed_data):
                      raise ValueError(
                          f"v2 SignedData has "
                          f"{len(signed_data) - sd_pos} trailing bytes"
                      )

                  signatures_blob, _, signatures_start, \
                      signatures_end, signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v2 signatures"
                      )

                  public_key_blob, _, public_key_start, \
                      public_key_end, signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v2 public key"
                      )

                  if signer_pos != len(signer_blob):
                      raise ValueError(
                          f"v2 signer has "
                          f"{len(signer_blob) - signer_pos} trailing bytes"
                      )

                  certificates = parse_certificates(
                      certificates_blob,
                      certificates_absolute
                  )

                  result["signers"].append({
                      "signed_data": signed_data,
                      "signed_data_offset": signed_data_absolute,
                      "digests": parse_digest_sequence(
                          digest_blob,
                          digest_absolute
                      ),
                      "certificates": certificates,
                      "attributes": parse_additional_attributes(
                          attributes_blob,
                          attributes_absolute
                      ),
                      "signatures": parse_signatures(
                          signatures_blob
                      ),
                      "public_key": public_key_blob,
                  })

              return result


          def parse_v3(value, value_absolute_offset):
              result = {
                  "version": 3,
                  "signers": [],
              }

              pos = 0

              while pos < len(value):
                  signer_blob, _, signer_start, signer_end, pos = \
                      read_lp(
                          value,
                          pos,
                          len(value),
                          "v3 signer"
                      )

                  signer_absolute = (
                      value_absolute_offset + signer_start
                  )

                  signer_pos = 0

                  signed_data, _, signed_data_start, \
                      signed_data_end, signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v3 signed data"
                      )

                  signed_data_absolute = (
                      signer_absolute + signed_data_start
                  )

                  sd_pos = 0

                  digest_blob, _, digest_start, \
                      digest_end, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v3 digests"
                      )

                  digest_absolute = (
                      signed_data_absolute + digest_start
                  )

                  certificates_blob, _, certificates_start, \
                      certificates_end, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v3 certificates"
                      )

                  certificates_absolute = (
                      signed_data_absolute + certificates_start
                  )

                  min_sdk = u32(signed_data, sd_pos)
                  min_sdk_offset = (
                      signed_data_absolute + sd_pos
                  )
                  sd_pos += 4

                  max_sdk = u32(signed_data, sd_pos)
                  max_sdk_offset = (
                      signed_data_absolute + sd_pos
                  )
                  sd_pos += 4

                  attributes_blob, _, attributes_start, \
                      attributes_end, sd_pos = read_lp(
                          signed_data,
                          sd_pos,
                          len(signed_data),
                          "v3 additional attributes"
                      )

                  attributes_absolute = (
                      signed_data_absolute + attributes_start
                  )

                  if sd_pos != len(signed_data):
                      raise ValueError(
                          f"v3 SignedData has "
                          f"{len(signed_data) - sd_pos} trailing bytes"
                      )

                  signer_min_sdk = u32(signer_blob, signer_pos)
                  signer_min_sdk_offset = (
                      signer_absolute + signer_pos
                  )
                  signer_pos += 4

                  signer_max_sdk = u32(signer_blob, signer_pos)
                  signer_max_sdk_offset = (
                      signer_absolute + signer_pos
                  )
                  signer_pos += 4

                  signatures_blob, _, signatures_start, \
                      signatures_end, signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v3 signatures"
                      )

                  public_key_blob, _, public_key_start, \
                      public_key_end, signer_pos = read_lp(
                          signer_blob,
                          signer_pos,
                          len(signer_blob),
                          "v3 public key"
                      )

                  if signer_pos != len(signer_blob):
                      raise ValueError(
                          f"v3 signer has "
                          f"{len(signer_blob) - signer_pos} trailing bytes"
                      )

                  certificates = parse_certificates(
                      certificates_blob,
                      certificates_absolute
                  )

                  result["signers"].append({
                      "signed_data": signed_data,
                      "signed_data_offset": signed_data_absolute,
                      "digests": parse_digest_sequence(
                          digest_blob,
                          digest_absolute
                      ),
                      "certificates": certificates,
                      "attributes": parse_additional_attributes(
                          attributes_blob,
                          attributes_absolute
                      ),
                      "min_sdk": min_sdk,
                      "max_sdk": max_sdk,
                      "min_sdk_offset": min_sdk_offset,
                      "max_sdk_offset": max_sdk_offset,
                      "signer_min_sdk": signer_min_sdk,
                      "signer_max_sdk": signer_max_sdk,
                      "signer_min_sdk_offset":
                          signer_min_sdk_offset,
                      "signer_max_sdk_offset":
                          signer_max_sdk_offset,
                      "signatures": parse_signatures(
                          signatures_blob
                      ),
                      "public_key": public_key_blob,
                  })

              return result


          def openssl_certificate_info(cert):
              with tempfile.NamedTemporaryFile(
                  suffix=".der",
                  delete=False
              ) as f:
                  path = Path(f.name)
                  f.write(cert)

              try:
                  proc = subprocess.run(
                      [
                          "openssl",
                          "x509",
                          "-inform",
                          "DER",
                          "-in",
                          str(path),
                          "-noout",
                          "-subject",
                          "-issuer",
                          "-serial",
                          "-dates",
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if proc.returncode != 0:
                      return proc.stderr.strip()

                  return proc.stdout.strip()

              finally:
                  path.unlink(missing_ok=True)


          def algorithm_name(algorithm_id):
              names = {
                  0x0101:
                      "RSASSA-PSS / SHA-256",
                  0x0102:
                      "RSASSA-PSS / SHA-512",
                  0x0103:
                      "RSASSA-PKCS1-v1_5 / SHA-256",
                  0x0104:
                      "RSASSA-PKCS1-v1_5 / SHA-512",
                  0x0201:
                      "ECDSA / SHA-256",
                  0x0202:
                      "ECDSA / SHA-512",
                  0x0301:
                      "DSA / SHA-256",
              }

              return names.get(
                  algorithm_id,
                  f"UNKNOWN (0x{algorithm_id:08X})"
              )


          def print_certificates(apk_path, version, scheme):
              certificates = []

              for signer_index, signer in enumerate(
                  scheme["signers"],
                  1
              ):
                  print()
                  print(f"  Signer #{signer_index}")

                  print(
                      f"    SignedData: "
                      f"{len(signer['signed_data'])} bytes"
                  )

                  print(
                      f"    Digests: "
                      f"{len(signer['digests'])}"
                  )

                  for digest_index, digest in enumerate(
                      signer["digests"],
                      1
                  ):
                      print(
                          f"      Digest #{digest_index}"
                      )
                      print(
                          f"        Algorithm: "
                          f"0x{digest['algorithm_id']:08X}"
                      )
                      print(
                          f"        Algorithm name: "
                          f"{algorithm_name(digest['algorithm_id'])}"
                      )
                      print(
                          f"        Offset: "
                          f"0x{digest['digest_offset']:08X}"
                      )
                      print(
                          f"        Size: "
                          f"{digest['digest_size']} bytes"
                      )
                      print(
                          f"        Digest: "
                          f"{digest['digest'].hex().upper()}"
                      )

                  print(
                      f"    Certificates: "
                      f"{len(signer['certificates'])}"
                  )

                  for cert_index, cert in enumerate(
                      signer["certificates"],
                      1
                  ):
                      cert_data = cert["data"]

                      print()
                      print(
                          f"      Certificate #{cert_index}"
                      )
                      print(
                          f"        Offset: "
                          f"0x{cert['offset']:08X}"
                      )
                      print(
                          f"        Size: "
                          f"{cert['size']} bytes"
                      )
                      print(
                          f"        SHA-256: "
                          f"{sha256(cert_data)}"
                      )
                      print(
                          f"        SHA-1:   "
                          f"{sha1(cert_data)}"
                      )

                      print(
                          "        "
                          + openssl_certificate_info(cert_data)
                          .replace("\n", "\n        ")
                      )

                      out = Path(
                          f"telegram-cert-v{version}-"
                          f"signer{signer_index}-"
                          f"cert{cert_index}.der"
                      )

                      out.write_bytes(cert_data)

                      print(
                          f"        Saved: {out}"
                      )

                      certificates.append(cert_data)

                  if version == 3:
                      print(
                          f"    minSDK: "
                          f"{signer['min_sdk']}"
                      )
                      print(
                          f"    maxSDK: "
                          f"{signer['max_sdk']}"
                      )

                      print(
                          f"    Signer minSDK: "
                          f"{signer['signer_min_sdk']}"
                      )

                      print(
                          f"    Signer maxSDK: "
                          f"{signer['signer_max_sdk']}"
                      )

                  print(
                      f"    Signatures: "
                      f"{len(signer['signatures'])}"
                  )

                  for sig_index, signature in enumerate(
                      signer["signatures"],
                      1
                  ):
                      print(
                          f"      Signature #{sig_index}: "
                          f"algorithm "
                          f"0x{signature['algorithm_id']:08X} "
                          f"({algorithm_name(signature['algorithm_id'])}), "
                          f"{len(signature['signature'])} bytes"
                      )

                  print(
                      f"    Public key: "
                      f"{len(signer['public_key'])} bytes"
                  )

              return certificates


          def main():
              if len(sys.argv) != 2:
                  print(
                      f"Usage: {sys.argv[0]} APK",
                      file=sys.stderr
                  )
                  return 2

              apk_path = Path(sys.argv[1])

              data = apk_path.read_bytes()

              print("==================================================")
              print("DEEP APK SIGNATURE INSPECTION")
              print("==================================================")
              print(f"APK: {apk_path}")
              print(f"Size: {len(data)} bytes")
              print()

              cd_offset, cd_size = find_central_directory(data)

              print("ZIP Central Directory")
              print(
                  f"  offset: 0x{cd_offset:08X}"
              )
              print(
                  f"  size: {cd_size} bytes"
              )
              print(
                  f"  end: 0x{cd_offset + cd_size:08X}"
              )
              print()

              block_offset, block_size = \
                  find_apk_signing_block(
                      data,
                      cd_offset
                  )

              print("APK Signing Block")
              print(
                  f"  offset: 0x{block_offset:08X}"
              )
              print(
                  f"  size: {block_size} bytes"
              )
              print(
                  f"  end: 0x{cd_offset:08X}"
              )
              print(
                  f"  magic: {APK_SIG_BLOCK_MAGIC.decode()}"
              )
              print()

              entries = parse_signing_block(
                  data,
                  block_offset,
                  block_size
              )

              print("Signing blocks:")
              print()

              v2 = None
              v3 = None

              for entry in entries:
                  entry_id = entry["id"]

                  print(
                      f"  ID: 0x{entry_id:08X}"
                  )

                  print(
                      f"  pair size: "
                      f"{entry['pair_size']} bytes"
                  )

                  print(
                      f"  value offset: "
                      f"0x{entry['value_offset']:08X}"
                  )

                  print(
                      f"  value size: "
                      f"{len(entry['value'])} bytes"
                  )

                  if entry_id == V2_ID:
                      print(
                          "  APK Signature Scheme v2"
                      )

                      v2 = parse_v2(
                          entry["value"],
                          entry["value_offset"]
                      )

                      print_certificates(
                          apk_path,
                          2,
                          v2
                      )

                  elif entry_id == V3_ID:
                      print(
                          "  APK Signature Scheme v3"
                      )

                      v3 = parse_v3(
                          entry["value"],
                          entry["value_offset"]
                      )

                      print_certificates(
                          apk_path,
                          3,
                          v3
                      )

                  else:
                      print(
                          "  Other Signing Block entry"
                      )

                  print()

              print("==================================================")
              print("RESULT")
              print("==================================================")

              if v2:
                  print(
                      f"v2 signers: "
                      f"{len(v2['signers'])}"
                  )

                  for signer_index, signer in enumerate(
                      v2["signers"],
                      1
                  ):
                      print(
                          f"  v2 signer #{signer_index}: "
                          f"{len(signer['certificates'])} certificate(s)"
                      )
              else:
                  print("v2: NOT FOUND")

              if v3:
                  print(
                      f"v3 signers: "
                      f"{len(v3['signers'])}"
                  )

                  for signer_index, signer in enumerate(
                      v3["signers"],
                      1
                  ):
                      print(
                          f"  v3 signer #{signer_index}: "
                          f"{len(signer['certificates'])} certificate(s)"
                      )
              else:
                  print("v3: NOT FOUND")

              print()
              print(
                  f"Total Signing Block entries: "
                  f"{len(entries)}"
              )


          if __name__ == "__main__":
              main()
          PY

          chmod +x inspect_apk_signature.py

          python3 inspect_apk_signature.py telegram.apk

      # ------------------------------------------------------------
      # Convert every extracted v2/v3 certificate to PEM
      # ------------------------------------------------------------

      - name: Convert extracted certificates to PEM
        run: |
          set -euo pipefail

          found=0

          for der in telegram-cert-v*.der; do
            [ -f "$der" ] || continue

            found=1

            pem="${der%.der}.pem"

            openssl x509 \
              -inform DER \
              -in "$der" \
              -out "$pem"

            echo
            echo "=================================================="
            echo "$pem"
            echo "=================================================="

            openssl x509 \
              -in "$pem" \
              -noout \
              -subject \
              -issuer \
              -serial \
              -dates \
              -fingerprint \
              -sha256 \
              -fingerprint \
              -sha1
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No v2/v3 certificates extracted"
            exit 1
          fi

      # ------------------------------------------------------------
      # Keep the old apksigner PEM output as a comparison artifact
      # ------------------------------------------------------------

      - name: Export apksigner output
        run: |
          set -euo pipefail

          apksigner verify \
            --print-certs-pem \
            telegram.apk \
            > certificate-output.txt

          cat certificate-output.txt

      # ------------------------------------------------------------
      # Kotlin byte arrays for every extracted certificate
      # ------------------------------------------------------------

      - name: Generate Kotlin byte arrays
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          for der in sorted(
              Path(".").glob("telegram-cert-v*.der")
          ):
              data = der.read_bytes()

              lines = []

              for i in range(0, len(data), 16):
                  chunk = data[i:i + 16]

                  values = ", ".join(
                      f"0x{b:02x}.toByte()"
                      for b in chunk
                  )

                  lines.append(
                      f"    {values},"
                  )

              output = "byteArrayOf(\n"
              output += "\n".join(lines)
              output += "\n)\n"

              out = der.with_suffix(".kt.txt")
              out.write_text(output)

              print(
                  f"Generated {out} "
                  f"({len(data)} bytes)"
              )
          PY

      # ------------------------------------------------------------
      # Upload everything
      # ------------------------------------------------------------

      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificate
          path: |
            telegram.apk
            telegram-cert-v*.der
            telegram-cert-v*.pem
            telegram-cert-v*.kt.txt
            certificate-output.txt
            inspect_apk_signature.py
