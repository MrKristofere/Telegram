name: Extract Telegram APK data

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_URL: "https://telegram.org/dl/android/apk"

  ANDROID_SDK_ROOT: "${{ github.workspace }}/android-sdk"
  BUILD_TOOLS_VERSION: "36.1.0"
  CMDLINE_TOOLS_VERSION: "14742923"

  # JADX version
  JADX_VERSION: "1.5.0"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Basic environment
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show environment
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "ENVIRONMENT"
          echo "============================================================"

          echo "OS:"
          uname -a

          echo
          echo "Java:"
          java -version || true

          echo
          echo "Python:"
          python3 --version || true

          echo
          echo "Workspace:"
          pwd

          echo "============================================================"


      # ============================================================
      # 2. Install Android SDK command line tools
      # ============================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALL ANDROID SDK"
          echo "============================================================"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          echo "Downloading Android command line tools..."
          curl -fL \
            -o commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          echo "Extracting..."
          unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing Build Tools ${BUILD_TOOLS_VERSION}..."
          sdkmanager \
            "platform-tools" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          echo
          echo "Android SDK installed."

          echo "============================================================"


      # ============================================================
      # 3. Install JADX
      # ============================================================

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALL JADX"
          echo "============================================================"

          mkdir -p "$RUNNER_TEMP/jadx"

          JADX_URL="https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          echo "Downloading:"
          echo "$JADX_URL"

          curl -fL \
            -o "$RUNNER_TEMP/jadx/jadx.zip" \
            "$JADX_URL"

          echo "Extracting JADX..."
          unzip -q \
            "$RUNNER_TEMP/jadx/jadx.zip" \
            -d "$RUNNER_TEMP/jadx"

          JADX_BIN="$RUNNER_TEMP/jadx/bin/jadx"

          if [ ! -x "$JADX_BIN" ]; then
            echo "::error::JADX executable was not found."
            find "$RUNNER_TEMP/jadx" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "JADX:"
          "$JADX_BIN" --version

          echo "============================================================"


      # ============================================================
      # 4. Download official Telegram APK
      # ============================================================

      - name: Download Telegram APK
        run: |
          set -euo pipefail

          mkdir -p artifacts

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --continue-at - \
            -o artifacts/telegram.apk \
            "$APK_URL"

          file artifacts/telegram.apk
          ls -lh artifacts/telegram.apk
          echo
          echo "SHA-256 of APK:"
          sha256sum artifacts/telegram.apk


      # ============================================================
      # 5. Locate Android tools
      # ============================================================

      - name: Locate Android tools
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "ANDROID TOOLS"
          echo "============================================================"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt2"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found:"
            echo "$AAPT2"
            exit 1
          fi

          echo "apksigner:"
          "$APKSIGNER" --version || true

          echo
          echo "aapt2:"
          "$AAPT2" version || true

          echo "============================================================"


      # ============================================================
      # 6. APK basic information
      # ============================================================

      - name: Extract APK metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "APK METADATA"
          echo "============================================================"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt2"

          APK="artifacts/telegram.apk"

          mkdir -p artifacts/metadata

          echo "[1/3] aapt2 badging"
          "$AAPT2" dump badging "$APK" \
            | tee artifacts/metadata/badging.txt

          echo
          echo "[2/3] package name"

          PACKAGE_NAME="$(
            "$AAPT2" dump packagename "$APK" \
              | tr -d '\r' \
              | tail -n 1
          )"

          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not extract package name."
            exit 1
          fi

          echo "PACKAGE_NAME=$PACKAGE_NAME" \
            | tee artifacts/metadata/package.env

          echo
          echo "Detected package:"
          echo "$PACKAGE_NAME"

          echo
          echo "[3/3] APK signature verification"

          "$APKSIGNER" verify \
            --verbose \
            "$APK" \
            2>&1 \
            | tee artifacts/metadata/apksigner_verify.txt

          echo "============================================================"


      # ============================================================
      # 7. Extract certificate
      # ============================================================

      - name: Extract signing certificate
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SIGNING CERTIFICATE"
          echo "============================================================"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          APK="artifacts/telegram.apk"

          mkdir -p artifacts/certificate

          echo "[1/4] Certificate information"

          "$APKSIGNER" verify \
            --print-certs \
            "$APK" \
            2>&1 \
            | tee artifacts/certificate/cert-info.txt

          echo
          echo "[2/4] Extracting PEM"

          "$APKSIGNER" verify \
            --print-certs-pem \
            "$APK" \
            > artifacts/certificate/certificate-output.txt

          if ! grep -q "BEGIN CERTIFICATE" \
              artifacts/certificate/certificate-output.txt; then

            echo "::error::No PEM certificate was found."
            cat artifacts/certificate/certificate-output.txt
            exit 1
          fi

          awk '
            /-----BEGIN CERTIFICATE-----/ {
              inside=1
            }

            inside {
              print
            }

            /-----END CERTIFICATE-----/ {
              exit
            }
          ' artifacts/certificate/certificate-output.txt \
            > artifacts/certificate/certificate.pem

          echo
          echo "[3/4] Converting PEM -> DER"

          openssl x509 \
            -in artifacts/certificate/certificate.pem \
            -outform DER \
            -out artifacts/certificate/certificate.der

          echo
          echo "[4/4] Certificate fingerprints"

          openssl x509 \
            -in artifacts/certificate/certificate.pem \
            -noout \
            -subject \
            -issuer \
            -serial \
            -fingerprint -sha256 \
            -fingerprint -sha1 \
            | tee artifacts/certificate/openssl-fingerprints.txt

          echo
          echo "============================================================"
          echo "CERTIFICATE FILES"
          echo "============================================================"

          ls -lh artifacts/certificate/

          echo "============================================================"


      # ============================================================
      # 8. Dump all APK resources
      # ============================================================

      - name: Dump APK resources
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "APK RESOURCES"
          echo "============================================================"

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt2"

          APK="artifacts/telegram.apk"

          mkdir -p artifacts/firebase

          echo "Running aapt2 dump resources..."

          "$AAPT2" dump resources "$APK" \
            > artifacts/firebase/resources.txt

          if [ ! -s artifacts/firebase/resources.txt ]; then
            echo "::error::aapt2 produced an empty resources dump."
            exit 1
          fi

          echo "Resource dump created."

          echo
          echo "Searching for Firebase resources..."

          grep -nE \
            'string/(google_app_id|gcm_defaultSenderId|default_web_client_id|ga_trackingId|firebase_database_url|google_api_key|google_crash_reporting_api_key|project_id)' \
            artifacts/firebase/resources.txt \
            | tee artifacts/firebase/firebase-resource-lines.txt \
            || true

          echo "============================================================"


      # ============================================================
      # 9. Extract Firebase values
      # ============================================================

      - name: Extract Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FIREBASE EXTRACTION"
          echo "============================================================"

          python3 <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          resource_file = Path(
              "artifacts/firebase/resources.txt"
          )

          values_file = Path(
              "artifacts/firebase/Values.env"
          )

          json_file = Path(
              "artifacts/firebase/google-services.reconstructed.json"
          )

          text = resource_file.read_text(
              encoding="utf-8",
              errors="replace"
          )

          lines = text.splitlines()

          wanted = [
              "google_app_id",
              "gcm_defaultSenderId",
              "default_web_client_id",
              "ga_trackingId",
              "firebase_database_url",
              "google_api_key",
              "google_crash_reporting_api_key",
              "project_id",
          ]

          extracted = {}
          locations = {}

          current_name = None

          for index, line in enumerate(lines):

              match = re.search(
                  r'\bresource\s+0x[0-9a-fA-F]+\s+string/([A-Za-z0-9_]+)',
                  line
              )

              if match:
                  current_name = match.group(1)

                  if current_name in wanted:
                      for j in range(
                          index + 1,
                          min(index + 30, len(lines))
                      ):
                          candidate = lines[j]

                          if re.search(
                              r'\bresource\s+0x[0-9a-fA-F]+\s+',
                              candidate
                          ):
                              break

                          value_match = re.search(
                              r'\(\)\s+"(.*)"',
                              candidate
                          )

                          if value_match:
                              extracted[current_name] = (
                                  value_match.group(1)
                              )
                              locations[current_name] = (
                                  index + 1,
                                  j + 1
                              )
                              break

          print()
          print("Firebase extraction results:")
          print("--------------------------------------------")

          failed = []

          for name in wanted:
              if name in extracted:
                  line_no = locations[name][1]
                  print(
                      f"[OK]   {name} = {extracted[name]} "
                      f"(resources.txt:{line_no})"
                  )
              else:
                  print(
                      f"[FAIL] {name} NOT FOUND"
                  )
                  failed.append(name)

          print("--------------------------------------------")

          values_file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with values_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for name in wanted:
                  if name in extracted:
                      f.write(
                          f"{name}={extracted[name]}\n"
                      )

          # --------------------------------------------------------
          # Reconstruct a minimal google-services.json
          # --------------------------------------------------------

          package_name = ""

          package_env = Path(
              "artifacts/metadata/package.env"
          )

          if package_env.exists():
              for line in package_env.read_text().splitlines():
                  if line.startswith("PACKAGE_NAME="):
                      package_name = line.split(
                          "=",
                          1
                      )[1].strip()

          client = {
              "client_info": {
                  "android_client_info": {
                      "package_name": package_name
                  }
              },
              "api_key": [],
              "oauth_client": [],
              "services": {
                  "appinvite_service": {
                      "status": 2
                  }
              }
          }

          if "google_app_id" in extracted:
              client["client_info"]["mobilesdk_app_id"] = (
                  extracted["google_app_id"]
              )

          if "google_api_key" in extracted:
              client["api_key"].append({
                  "current_key": extracted["google_api_key"]
              })

          if "default_web_client_id" in extracted:
              client["oauth_client"].append({
                  "client_id": extracted["default_web_client_id"],
                  "client_type": 3
              })

          project_info = {}

          for src, dst in [
              ("project_id", "project_id"),
              ("gcm_defaultSenderId", "project_number"),
              ("firebase_database_url", "firebase_url"),
          ]:
              if src in extracted:
                  project_info[dst] = extracted[src]

          reconstructed = {
              "project_info": project_info,
              "client": [client]
          }

          json_file.write_text(
              json.dumps(
                  reconstructed,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print(f"Written: {values_file}")
          print(f"Written: {json_file}")

          if failed:
              print()
              print("Firebase extraction FAILED.")
              print("Missing:")
              for item in failed:
                  print(f"  - {item}")

              # Do not immediately fail here.
              # We want the complete workflow log/artifacts.
              Path(
                  "artifacts/firebase/EXTRACTION_FAILED"
              ).write_text(
                  "\n".join(failed) + "\n",
                  encoding="utf-8"
              )

          else:
              print()
              print("Firebase extraction: PASS")
          PY

          echo "============================================================"


      # ============================================================
      # 10. Decompile APK with JADX
      # ============================================================

      - name: Decompile APK with JADX
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "JADX DECOMPILATION"
          echo "============================================================"

          APK="artifacts/telegram.apk"
          JADX_BIN="$RUNNER_TEMP/jadx/bin/jadx"

          mkdir -p artifacts/buildvars/jadx

          echo "JADX version:"
          "$JADX_BIN" --version || true

          echo
          echo "Starting decompilation..."

          set +e

          "$JADX_BIN" \
            --log-level INFO \
            -d artifacts/buildvars/jadx \
            "$APK" \
            2>&1 \
            | tee artifacts/buildvars/jadx.log

          JADX_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "JADX exit code: $JADX_EXIT"

          if [ "$JADX_EXIT" -ne 0 ]; then
            echo "::warning::JADX returned exit code $JADX_EXIT."
            echo "This does not necessarily mean BuildVars extraction failed."
          fi

          echo
          echo "Searching for BuildVars.java..."

          find artifacts/buildvars/jadx \
            -type f \
            -name "BuildVars.java" \
            -print \
            | tee artifacts/buildvars/buildvars-paths.txt

          echo "============================================================"


      # ============================================================
      # 11. Extract BuildVars
      # ============================================================

      - name: Extract BuildVars values
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "BUILDVARS EXTRACTION"
          echo "============================================================"

          BUILDVARS_FILE="$(
            find artifacts/buildvars/jadx \
              -type f \
              -name "BuildVars.java" \
              | head -n 1
          )"

          OUTPUT="artifacts/buildvars/BuildVars.extracted.txt"

          mkdir -p artifacts/buildvars

          echo "Looking for:"
          echo "  APP_ID"
          echo "  APP_HASH"
          echo "  GOOGLE_AUTH_CLIENT_ID"
          echo "  HUAWEI_APP_ID"
          echo "  SAFETYNET_KEY"

          echo

          if [ -z "$BUILDVARS_FILE" ]; then
            echo "[FAIL] BuildVars.java was not found."

            echo
            echo "Files containing 'BuildVars':"
            grep -Ril \
              --include='*.java' \
              "class BuildVars" \
              artifacts/buildvars/jadx \
              2>/dev/null \
              | head -50 \
              || true

            echo
            echo "Files containing APP_ID:"
            grep -Ril \
              --include='*.java' \
              "APP_ID" \
              artifacts/buildvars/jadx \
              2>/dev/null \
              | head -50 \
              || true

            {
              echo "BUILDVARS_FILE="
              echo "APP_ID="
              echo "APP_HASH="
              echo "GOOGLE_AUTH_CLIENT_ID="
              echo "HUAWEI_APP_ID="
              echo "SAFETYNET_KEY="
            } > "$OUTPUT"

            echo
            echo "::error::Could not locate BuildVars.java."
            exit 1
          fi

          echo "[OK] BuildVars.java:"
          echo "$BUILDVARS_FILE"

          cp "$BUILDVARS_FILE" \
            artifacts/buildvars/BuildVars.java

          echo
          echo "Relevant lines from BuildVars.java:"
          echo "------------------------------------------------------------"

          grep -nE \
            'APP_ID|APP_HASH|GOOGLE_AUTH_CLIENT_ID|HUAWEI_APP_ID|SAFETYNET_KEY' \
            "$BUILDVARS_FILE" \
            | tee artifacts/buildvars/relevant-lines.txt \
            || true

          echo "------------------------------------------------------------"
          echo

          python3 <<'PY'
          import re
          from pathlib import Path

          src = Path(
              "artifacts/buildvars/BuildVars.java"
          )

          out = Path(
              "artifacts/buildvars/BuildVars.extracted.txt"
          )

          text = src.read_text(
              encoding="utf-8",
              errors="replace"
          )

          fields = [
              "APP_ID",
              "APP_HASH",
              "GOOGLE_AUTH_CLIENT_ID",
              "HUAWEI_APP_ID",
              "SAFETYNET_KEY",
          ]

          results = {}
          failed = []

          print("Field extraction:")
          print("------------------------------------------------------------")

          for field in fields:

              # Handles examples such as:
              #
              # public static int APP_ID = 4;
              # public static String APP_HASH = "....";
              #
              # Also tolerates final/static/whitespace variations.

              pattern = re.compile(
                  rf'\b{re.escape(field)}\s*=\s*'
                  rf'(?:"([^"]*)"|([0-9]+)|([^;]+))\s*;'
              )

              match = pattern.search(text)

              if not match:
                  print(
                      f"[FAIL] {field}: NOT FOUND"
                  )
                  failed.append(field)
                  continue

              value = next(
                  (
                      group
                      for group in match.groups()
                      if group is not None
                  ),
                  ""
              ).strip()

              # Remove accidental surrounding whitespace.
              value = value.strip()

              results[field] = value

              line_number = (
                  text[:match.start()].count("\n") + 1
              )

              print(
                  f"[OK]   {field} = {value} "
                  f"(BuildVars.java:{line_number})"
              )

          print("------------------------------------------------------------")

          with out.open(
              "w",
              encoding="utf-8"
          ) as f:
              for field in fields:
                  f.write(
                      f"{field}="
                      f"{results.get(field, '')}\n"
                  )

          print()
          print(f"Written: {out}")

          if failed:
              print()
              print("BuildVars extraction FAILED.")
              print("Missing fields:")

              for field in failed:
                  print(f"  - {field}")

              Path(
                  "artifacts/buildvars/EXTRACTION_FAILED"
              ).write_text(
                  "\n".join(failed) + "\n",
                  encoding="utf-8"
              )

              raise SystemExit(1)

          print()
          print("BuildVars extraction: PASS")
          PY

          echo "============================================================"


      # ============================================================
      # 12. Compare Firebase values
      # ============================================================

      - name: Compare Firebase client ID values
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "FIREBASE / BUILDVARS COMPARISON"
          echo "============================================================"

          FIREBASE_FILE="artifacts/firebase/Values.env"
          BUILDVARS_FILE="artifacts/buildvars/BuildVars.extracted.txt"

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "[FAIL] Firebase Values.env does not exist."
            exit 0
          fi

          if [ ! -f "$BUILDVARS_FILE" ]; then
            echo "[FAIL] BuildVars.extracted.txt does not exist."
            exit 0
          fi

          FIREBASE_CLIENT_ID="$(
            grep '^default_web_client_id=' \
              "$FIREBASE_FILE" \
              | cut -d= -f2-
          )"

          GOOGLE_AUTH_CLIENT_ID="$(
            grep '^GOOGLE_AUTH_CLIENT_ID=' \
              "$BUILDVARS_FILE" \
              | cut -d= -f2-
          )"

          echo "Firebase default_web_client_id:"
          echo "$FIREBASE_CLIENT_ID"

          echo
          echo "BuildVars GOOGLE_AUTH_CLIENT_ID:"
          echo "$GOOGLE_AUTH_CLIENT_ID"

          echo

          if [ -n "$FIREBASE_CLIENT_ID" ] &&
             [ -n "$GOOGLE_AUTH_CLIENT_ID" ]; then

            if [ "$FIREBASE_CLIENT_ID" = "$GOOGLE_AUTH_CLIENT_ID" ]; then
              echo "[MATCH] IDs are identical."
            else
              echo "[DIFFERENT] IDs are different."
              echo "This is expected if Telegram uses separate OAuth clients."
            fi
          else
            echo "[SKIP] One or both values are unavailable."
          fi

          echo "============================================================"


      # ============================================================
      # 13. Create extraction summary
      # ============================================================

      - name: Create extraction summary
        if: always()
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "FINAL EXTRACTION SUMMARY"
          echo "============================================================"

          SUMMARY="artifacts/EXTRACTION_SUMMARY.txt"

          {
            echo "Telegram APK extraction summary"
            echo "================================"
            echo
            echo "APK URL:"
            echo "$APK_URL"
            echo
            echo "APK SHA-256:"
            sha256sum artifacts/telegram.apk \
              | awk '{print $1}' \
              || true
            echo
            echo "Package:"
            cat artifacts/metadata/package.env \
              2>/dev/null \
              || echo "NOT FOUND"
            echo
            echo "Certificate:"
            grep -E \
              'Signer|SHA-256|SHA-1' \
              artifacts/certificate/cert-info.txt \
              2>/dev/null \
              || true
            echo
            echo "BuildVars:"
            cat artifacts/buildvars/BuildVars.extracted.txt \
              2>/dev/null \
              || true
            echo
            echo "Firebase:"
            cat artifacts/firebase/Values.env \
              2>/dev/null \
              || true
            echo
            echo "Firebase failures:"
            cat artifacts/firebase/EXTRACTION_FAILED \
              2>/dev/null \
              || echo "none"
            echo
            echo "BuildVars failures:"
            cat artifacts/buildvars/EXTRACTION_FAILED \
              2>/dev/null \
              || echo "none"
          } | tee "$SUMMARY"

          echo
          echo "============================================================"


      # ============================================================
      # 14. Upload everything
      # ============================================================

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk-extraction
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
