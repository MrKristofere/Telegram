name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "APK link"
        required: true
        type: string

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          set -e
          curl -fL --retry 3 "${{ inputs.link }}" -o telegram.apk
          ls -lh telegram.apk

      - name: Extract certificates
        run: |
          set -e

          cat > extract.py <<'PY'
          import sys, struct, hashlib, subprocess
          from pathlib import Path

          apk = Path(sys.argv[1])
          data = apk.read_bytes()

          def u32(p):
              return struct.unpack_from("<I", data, p)[0]

          def u64(p):
              return struct.unpack_from("<Q", data, p)[0]

          def der_cert(p, end):
              if p >= end or data[p] != 0x30:
                  return None

              if p + 2 > end:
                  return None

              n = data[p + 1]
              h = 2

              if n & 0x80:
                  count = n & 0x7f
                  if count == 0 or count > 4 or p + 2 + count > end:
                      return None
                  n = int.from_bytes(data[p + 2:p + 2 + count], "big")
                  h += count

              size = h + n

              if size < 128 or p + size > end:
                  return None

              cert = data[p:p + size]

              Path("/tmp/cert.der").write_bytes(cert)

              r = subprocess.run(
                  ["openssl", "x509", "-inform", "DER",
                   "-in", "/tmp/cert.der", "-noout"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return cert if r.returncode == 0 else None

          print("APK:", apk)
          print("Size:", len(data))

          eocd = data.rfind(b"PK\x05\x06")
          if eocd < 0:
              raise SystemExit("ERROR: EOCD not found")

          cd_size = u32(eocd + 12)
          cd_offset = u32(eocd + 16)

          print(f"Central Directory: 0x{cd_offset:X}")
          print(f"CD size: {cd_size}")

          footer = cd_offset - 24

          if footer < 0 or data[footer + 8:footer + 24] != b"APK Sig Block 42":
              raise SystemExit("ERROR: APK Signing Block not found")

          block_size = u64(footer)
          block_start = cd_offset - block_size - 8

          print(f"Signing Block: 0x{block_start:X}-0x{cd_offset:X}")

          entries = []
          p = block_start + 8
          end = footer

          while p < end:
              pair_size = u64(p)
              pair_end = p + 8 + pair_size

              if pair_end > end or pair_size < 4:
                  break

              entry_id = u32(p + 8)
              value_start = p + 12

              if entry_id == 0x7109871A:
                  entries.append(("v2", value_start, pair_end))

              elif entry_id == 0xF05368C0:
                  entries.append(("v3", value_start, pair_end))

              p = pair_end

          if not entries:
              raise SystemExit("ERROR: v2/v3 signing block not found")

          found = {}

          for version, start, finish in entries:
              print(f"Scanning {version}: 0x{start:X}-0x{finish:X}")

              before = len(found)

              for pos in range(start, finish):
                  cert = der_cert(pos, finish)

                  if not cert:
                      continue

                  sha256 = hashlib.sha256(cert).hexdigest().upper()

                  if sha256 in found:
                      continue

                  sha1 = hashlib.sha1(cert).hexdigest().upper()

                  found[sha256] = (version, pos, cert, sha1)

              print(f"  New certificates: {len(found) - before}")

          if not found:
              raise SystemExit("ERROR: No X.509 certificate found")

          print()
          print("=" * 55)
          print(f"Certificates found: {len(found)}")
          print("=" * 55)

          for number, (sha256, item) in enumerate(found.items(), 1):
              version, offset, cert, sha1 = item

              base = Path(f"telegram-cert-{number}")

              der = base.with_suffix(".der")
              pem = base.with_suffix(".pem")
              txt = base.with_suffix(".txt")
              kt = Path(f"{base}.kt.txt")

              der.write_bytes(cert)

              subprocess.run(
                  ["openssl", "x509", "-inform", "DER",
                   "-in", str(der), "-out", str(pem)],
                  check=True
              )

              info = subprocess.check_output(
                  ["openssl", "x509", "-inform", "DER",
                   "-in", str(der), "-noout",
                   "-subject", "-issuer", "-serial",
                   "-dates", "-fingerprint", "-sha256",
                   "-fingerprint", "-sha1", "-text"],
                  text=True
              )

              txt.write_text(
                  f"Certificate: #{number}\n"
                  f"Signature scheme: {version}\n"
                  f"Offset: 0x{offset:08X}\n"
                  f"Size: {len(cert)} bytes\n"
                  f"SHA-256: {sha256}\n"
                  f"SHA-1: {sha1}\n\n"
                  f"{info}",
                  encoding="utf-8"
              )

              kt.write_text(
                  "val certificate = byteArrayOf(\n    "
                  + ", ".join(f"0x{b:02X}" for b in cert)
                  + "\n)\n",
                  encoding="utf-8"
              )

              print(
                  f"#{number}: {version}, "
                  f"offset=0x{offset:08X}, "
                  f"size={len(cert)}, "
                  f"SHA-256={sha256}"
              )
          PY

          python3 extract.py telegram.apk

      - name: Upload certificates
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificates
          path: |
            telegram-cert-*.der
            telegram-cert-*.pem
            telegram-cert-*.txt
            telegram-cert-*.kt.txt
