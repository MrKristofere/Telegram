name: Extract Telegram certificate

on:
  workflow_dispatch:
    inputs:
      link:
        description: "apk link"
        type: string
        default: ""
        required: true

jobs:
  extract-cert:
    runs-on: ubuntu-latest

    env:
      APK_URL: ${{ inputs.link }}
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:
      - name: Install Android SDK Build Tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;$BUILD_TOOLS_VERSION"

          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Download Telegram APK
        run: |
          curl -fL --retry 3 \
            -o telegram.apk \
            "$APK_URL"

          file telegram.apk
          ls -lh telegram.apk

      - name: Verify APK and print certificate
        run: |
          apksigner verify --verbose telegram.apk
          apksigner verify --print-certs telegram.apk

      - name: Extract certificate PEM
        run: |
          apksigner verify --print-certs-pem telegram.apk > certificate-output.txt

          awk '
            /-----BEGIN CERTIFICATE-----/ { found=1 }
            found { print }
            /-----END CERTIFICATE-----/ {
              exit
            }
          ' certificate-output.txt > telegram-cert.pem

          test -s telegram-cert.pem

      - name: Convert certificate to DER
        run: |
          openssl x509 \
            -in telegram-cert.pem \
            -outform DER \
            -out telegram-cert.der

      - name: Print fingerprints
        run: |
          echo "=== SHA-256 ==="
          openssl x509 \
            -in telegram-cert.pem \
            -noout \
            -fingerprint \
            -sha256

          echo
          echo "=== SHA-1 ==="
          openssl x509 \
            -in telegram-cert.pem \
            -noout \
            -fingerprint \
            -sha1

          echo
          echo "=== Subject ==="
          openssl x509 \
            -in telegram-cert.pem \
            -noout \
            -subject

          echo
          echo "=== Issuer ==="
          openssl x509 \
            -in telegram-cert.pem \
            -noout \
            -issuer

          echo
          echo "=== Serial ==="
          openssl x509 \
            -in telegram-cert.pem \
            -noout \
            -serial

      - name: Generate Kotlin byte array
        run: |
          python3 <<'PY'
          from pathlib import Path

          data = Path("telegram-cert.der").read_bytes()

          lines = []

          for i in range(0, len(data), 16):
              chunk = data[i:i + 16]

              values = ", ".join(
                  f"0x{b:02x}.toByte()"
                  for b in chunk
              )

              lines.append(f"    {values},")

          output = "byteArrayOf(\n"
          output += "\n".join(lines)
          output += "\n)\n"

          Path("telegram-cert.kt.txt").write_text(output)

          print(f"Certificate size: {len(data)} bytes")
          PY

      - name: Show certificate information
        run: |
          echo "=== Certificate ==="
          cat telegram-cert.pem

          echo
          echo "=== DER SHA-256 ==="
          sha256sum telegram-cert.der

      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telegram-certificate
          path: |
            telegram-cert.pem
            telegram-cert.der
            telegram-cert.kt.txt
            certificate-output.txt
