name: Extract Telegram Android APK data

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_URL: "https://telegram.org/dl/android/apk"

  ANDROID_SDK_ROOT: "${{ github.workspace }}/android-sdk"
  ANDROID_HOME: "${{ github.workspace }}/android-sdk"

  CMDLINE_TOOLS_VERSION: "14742923"
  BUILD_TOOLS_VERSION: "36.1.0"
  JADX_VERSION: "1.5.0"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Install Java
      # ------------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ------------------------------------------------------------
      # 2. Install Android SDK command line tools
      # ------------------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Export exact Build Tools directory for subsequent steps.
          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo
          echo "Installed Build Tools:"
          ls -la "$BUILD_TOOLS"

          echo
          echo "sdkmanager:"
          sdkmanager --version

          echo
          echo "apksigner:"
          "$BUILD_TOOLS/apksigner" --version

          echo
          echo "aapt2:"
          "$BUILD_TOOLS/aapt2" version

      # ------------------------------------------------------------
      # 3. Install JADX
      # ------------------------------------------------------------
      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          mkdir -p "$HOME/jadx"
          unzip -q /tmp/jadx.zip -d "$HOME/jadx"

          echo "$HOME/jadx/bin" >> "$GITHUB_PATH"

          "$HOME/jadx/bin/jadx" --version

      # ------------------------------------------------------------
      # 4. Prepare directories
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts work
          mkdir -p artifacts/result
          mkdir -p work

      # ------------------------------------------------------------
      # 5. Download official Telegram APK
      # ------------------------------------------------------------
      - name: Download Telegram APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading:"
          echo "$APK_URL"
          echo

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --continue-at - \
            -o work/telegram.apk \
            "$APK_URL"

          echo
          echo "Downloaded APK:"
          file work/telegram.apk
          ls -lh work/telegram.apk

          echo
          echo "APK SHA256:"
          sha256sum work/telegram.apk

      # ------------------------------------------------------------
      # 6. Extract package name and basic APK metadata
      # ------------------------------------------------------------
      - name: Extract APK metadata
        shell: bash
        run: |
          set -euo pipefail

          LOG="artifacts/result/extraction.log"

          {
            echo "============================================================"
            echo "Telegram APK extraction"
            echo "============================================================"
            echo
            echo "APK URL: $APK_URL"
            echo
            echo "APK SHA256:"
            sha256sum work/telegram.apk
            echo
          } > "$LOG"

          echo "=== APK BADGING ===" | tee artifacts/result/manifest.txt
          "$ANDROID_BUILD_TOOLS/aapt2" dump badging work/telegram.apk \
            | tee -a artifacts/result/manifest.txt \
            | grep -m1 "^package:" || true

          PACKAGE_NAME="$(
            "$ANDROID_BUILD_TOOLS/aapt2" dump badging work/telegram.apk 2>/dev/null \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n1
          )"

          if [ -n "$PACKAGE_NAME" ]; then
            echo "package_name=$PACKAGE_NAME" \
              | tee artifacts/result/summary.txt
          else
            echo "package_name=NOT_FOUND" \
              | tee artifacts/result/summary.txt

            echo "[FAIL] Package name was not extracted" | tee -a "$LOG"
          fi

          echo >> artifacts/result/summary.txt

          echo "APK metadata extraction completed."

      # ------------------------------------------------------------
      # 7. Extract signing certificate
      # ------------------------------------------------------------
      - name: Extract signing certificate
        shell: bash
        run: |
          set -euo pipefail

          LOG="artifacts/result/extraction.log"
          CERT_PEM="artifacts/result/certificate.pem"
          CERT_DER="artifacts/result/certificate.der"
          CERT_INFO="artifacts/result/certificate.txt"

          echo
          echo "============================================================"
          echo "SIGNING CERTIFICATE"
          echo "============================================================"

          # --------------------------------------------------------
          # Certificate information
          # --------------------------------------------------------

          echo "=== apksigner certificate information ===" \
            | tee "$CERT_INFO"

          "$ANDROID_BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            work/telegram.apk \
            2>&1 \
            | tee -a "$CERT_INFO"

          # --------------------------------------------------------
          # Extract ONLY PEM certificate
          # --------------------------------------------------------

          echo
          echo "Extracting PEM certificate..."

          "$ANDROID_BUILD_TOOLS/apksigner" verify \
            --print-certs-pem \
            work/telegram.apk \
            2>/dev/null \
            | awk '
                /-----BEGIN CERTIFICATE-----/ {
                    inside=1
                }

                inside {
                    print
                }

                /-----END CERTIFICATE-----/ {
                    exit
                }
            ' > "$CERT_PEM"

          # --------------------------------------------------------
          # Validate PEM
          # --------------------------------------------------------

          if [ ! -s "$CERT_PEM" ]; then
            echo "[FAIL] Certificate PEM was not extracted." \
              | tee -a "$LOG"
            exit 1
          fi

          if ! grep -q '^-----BEGIN CERTIFICATE-----$' "$CERT_PEM"; then
            echo "[FAIL] Invalid PEM: BEGIN CERTIFICATE not found." \
              | tee -a "$LOG"
            exit 1
          fi

          if ! grep -q '^-----END CERTIFICATE-----$' "$CERT_PEM"; then
            echo "[FAIL] Invalid PEM: END CERTIFICATE not found." \
              | tee -a "$LOG"
            exit 1
          fi

          echo
          echo "PEM certificate:"
          cat "$CERT_PEM"

          # --------------------------------------------------------
          # Convert PEM -> DER
          # --------------------------------------------------------

          openssl x509 \
            -in "$CERT_PEM" \
            -outform DER \
            -out "$CERT_DER"

          # --------------------------------------------------------
          # Additional certificate information
          # --------------------------------------------------------

          echo
          echo "=== OpenSSL certificate information ===" \
            | tee -a "$CERT_INFO"

          openssl x509 \
            -in "$CERT_PEM" \
            -noout \
            -subject \
            -issuer \
            -serial \
            -dates \
            -fingerprint -md5 \
            -fingerprint -sha1 \
            -fingerprint -sha256 \
            | tee -a "$CERT_INFO"

          echo
          echo "Certificate files:"
          ls -lh "$CERT_PEM" "$CERT_DER"

      # ------------------------------------------------------------
      # 8. Run JADX
      #
      # Temporary only:
      #   work/jadx
      #
      # It is NOT uploaded to artifacts.
      # ------------------------------------------------------------
      - name: Decompile APK with JADX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/jadx

          echo
          echo "============================================================"
          echo "JADX"
          echo "============================================================"
          echo

          jadx \
            --no-replace-consts \
            --show-bad-code \
            --threads-count 4 \
            -d work/jadx \
            work/telegram.apk \
            > work/jadx.log 2>&1 || {
              STATUS=$?

              echo "[WARN] JADX exited with status $STATUS"
              echo "[WARN] Extraction will continue."
              echo
              echo "Last JADX log lines:"
              tail -n 100 work/jadx.log || true
            }

          echo
          echo "JADX output created."
          find work/jadx -maxdepth 3 -type f | head -100 || true

      # ------------------------------------------------------------
      # 9. Find BuildVars.java
      # ------------------------------------------------------------
      - name: Find BuildVars.java
        shell: bash
        run: |
          set -euo pipefail

          LOG="artifacts/result/extraction.log"

          BUILDVARS_FILE="$(
            find work/jadx \
              -type f \
              -name "BuildVars.java" \
              | head -n1
          )"

          if [ -z "$BUILDVARS_FILE" ]; then
            echo "[FAIL] BuildVars.java was not found." \
              | tee -a "$LOG"

            echo "BuildVars.java: NOT_FOUND" \
              > artifacts/result/BuildVars.extracted.txt

            exit 1
          fi

          echo "BuildVars.java: $BUILDVARS_FILE" \
            | tee artifacts/result/BuildVars.locations.txt

          echo
          echo "=== Relevant BuildVars lines ===" \
            | tee -a artifacts/result/BuildVars.locations.txt

          grep -nE \
            'APP_ID|APP_HASH|GOOGLE_AUTH_CLIENT_ID|HUAWEI_APP_ID|SAFETYNET_KEY' \
            "$BUILDVARS_FILE" \
            | tee -a artifacts/result/BuildVars.locations.txt || true

      # ------------------------------------------------------------
      # 10. Extract ALL non-null BuildVars values
      # ------------------------------------------------------------
      - name: Extract BuildVars values
        shell: bash
        run: |
          set -euo pipefail

          BUILDVARS_FILE="$(
            find work/jadx \
              -type f \
              -name "BuildVars.java" \
              | head -n1
          )"

          OUTPUT="artifacts/result/BuildVars.extracted.txt"
          LOCATIONS="artifacts/result/BuildVars.locations.txt"
          LOG="artifacts/result/extraction.log"

          if [ -z "$BUILDVARS_FILE" ]; then
            echo "[FAIL] BuildVars.java not found." | tee -a "$LOG"
            exit 1
          fi

          python3 - "$BUILDVARS_FILE" "$OUTPUT" "$LOCATIONS" <<'PY'
          import re
          import sys
          from pathlib import Path

          source_file = Path(sys.argv[1])
          output_file = Path(sys.argv[2])
          locations_file = Path(sys.argv[3])

          text = source_file.read_text(
              encoding="utf-8",
              errors="replace"
          )

          fields = [
              "APP_ID",
              "APP_HASH",
              "GOOGLE_AUTH_CLIENT_ID",
              "HUAWEI_APP_ID",
              "SAFETYNET_KEY",
          ]

          output = []
          locations = []

          output.append("BuildVars extracted from APK")
          output.append("=" * 60)
          output.append("")

          total_values = 0

          for field in fields:
              output.append(f"[{field}]")

              # Matches:
              #
              # APP_ID = 4;
              # APP_ID=4;
              # APP_HASH = "abc";
              # APP_HASH=null;
              #
              pattern = re.compile(
                  rf'(?<![\w$])'
                  rf'{re.escape(field)}'
                  rf'\s*=\s*'
                  rf'(?:'
                  rf'"([^"]*)"'
                  rf'|'
                  rf"'([^']*)'"
                  rf'|'
                  rf'(-?\d+)'
                  rf'|'
                  rf'(null)'
                  rf')'
                  rf'\s*;'
              )

              matches = list(pattern.finditer(text))

              if not matches:
                  output.append("NOT_FOUND")
                  output.append("")

                  locations.append(
                      f"{field}: NOT_FOUND"
                  )
                  continue

              non_null = []

              for index, match in enumerate(matches, start=1):
                  value = (
                      match.group(1)
                      if match.group(1) is not None
                      else match.group(2)
                      if match.group(2) is not None
                      else match.group(3)
                      if match.group(3) is not None
                      else None
                  )

                  is_null = match.group(4) is not None

                  line_number = text.count(
                      "\n",
                      0,
                      match.start()
                  ) + 1

                  line_text = text.splitlines()[line_number - 1].strip()

                  locations.append(
                      f"{field}[{index}] "
                      f"line={line_number} "
                      f"value={'null' if is_null else value}"
                  )
                  locations.append(
                      f"    {line_text}"
                  )

                  # IMPORTANT:
                  # null values are deliberately ignored.
                  if not is_null and value is not None:
                      non_null.append(value)

              if non_null:
                  for value in non_null:
                      output.append(f"{field}={value}")
                      total_values += 1
              else:
                  output.append("NO_NON_NULL_VALUE")

              output.append("")

          output.append("=" * 60)
          output.append(f"Total non-null values: {total_values}")

          output_file.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          locations_file.write_text(
              locations_file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              + "\n\n"
              + "\n".join(locations)
              + "\n",
              encoding="utf-8"
          )

          print()
          print("=== BuildVars extraction result ===")
          print(output_file.read_text(encoding="utf-8"))

          print()
          print("=== BuildVars locations ===")
          print("\n".join(locations))
          PY

      # ------------------------------------------------------------
      # 11. Extract Firebase values from decoded resources
      # ------------------------------------------------------------
      - name: Extract Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          LOG="artifacts/result/extraction.log"

          echo
          echo "============================================================"
          echo "FIREBASE"
          echo "============================================================"
          echo

          VALUES_FILE="$(
            find work/jadx \
              -type f \
              -path "*/resources/res/values/strings.xml" \
              | head -n1
          )"

          if [ -z "$VALUES_FILE" ]; then
            echo "[WARN] strings.xml was not found in JADX resources." \
              | tee -a "$LOG"

            echo "Firebase resources: NOT_FOUND" \
              > artifacts/result/firebase.json

            echo "Firebase Values.env: NOT_FOUND" \
              > artifacts/result/Values.env

            exit 0
          fi

          echo "Using:"
          echo "$VALUES_FILE"

          python3 - "$VALUES_FILE" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_file = Path(sys.argv[1])

          root = ET.parse(xml_file).getroot()

          values = {}

          for item in root.findall("string"):
              name = item.attrib.get("name")
              if not name:
                  continue

              value = "".join(item.itertext()).strip()
              values[name] = value

          firebase_keys = {
              "google_app_id": values.get("google_app_id"),
              "google_api_key": values.get("google_api_key"),
              "google_crash_reporting_api_key": values.get(
                  "google_crash_reporting_api_key"
              ),
              "gcm_defaultSenderId": values.get(
                  "gcm_defaultSenderId"
              ),
              "firebase_database_url": values.get(
                  "firebase_database_url"
              ),
              "project_id": values.get("project_id"),
              "default_web_client_id": values.get(
                  "default_web_client_id"
              ),
          }

          firebase_keys = {
              k: v
              for k, v in firebase_keys.items()
              if v
          }

          Path("artifacts/result/firebase.json").write_text(
              json.dumps(
                  firebase_keys,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          with open(
              "artifacts/result/Values.env",
              "w",
              encoding="utf-8"
          ) as f:
              for key, value in firebase_keys.items():
                  f.write(f"{key}={value}\n")

          print("Firebase values extracted:")
          for key, value in firebase_keys.items():
              print(f"{key}={value}")

          missing = [
              key
              for key in (
                  "google_app_id",
                  "google_api_key",
                  "gcm_defaultSenderId",
                  "project_id",
              )
              if not firebase_keys.get(key)
          ]

          if missing:
              print()
              print(
                  "WARNING: missing Firebase values: "
                  + ", ".join(missing)
              )
          PY

      # ------------------------------------------------------------
      # 12. Add extraction summary
      # ------------------------------------------------------------
      - name: Create final summary
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="artifacts/result/summary.txt"

          {
            echo "============================================================"
            echo "Telegram APK extraction summary"
            echo "============================================================"
            echo

            echo "APK:"
            sha256sum work/telegram.apk
            echo

            echo "Package:"
            grep '^package_name=' "$SUMMARY" 2>/dev/null || true
            echo

            echo "BuildVars:"
            if [ -f artifacts/result/BuildVars.extracted.txt ]; then
              cat artifacts/result/BuildVars.extracted.txt
            else
              echo "NOT_FOUND"
            fi

            echo
            echo "Firebase:"
            if [ -f artifacts/result/firebase.json ]; then
              cat artifacts/result/firebase.json
            else
              echo "NOT_FOUND"
            fi

            echo
            echo "Certificate:"
            if [ -f artifacts/result/certificate.txt ]; then
              grep -E \
                'Signer|Subject|Issuer|Serial|MD5|SHA-1|SHA-256' \
                artifacts/result/certificate.txt \
                || true
            else
              echo "NOT_FOUND"
            fi

          } > "$SUMMARY"

          cat "$SUMMARY"

      # ------------------------------------------------------------
      # 13. Remove all heavy temporary files
      # ------------------------------------------------------------
      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing temporary APK and JADX output..."

          rm -rf work/jadx
          rm -f work/jadx.log
          rm -f work/telegram.apk
          rm -rf work

          echo
          echo "Files that will be uploaded:"
          find artifacts/result \
            -type f \
            -printf '%P %s bytes\n' \
            | sort

      # ------------------------------------------------------------
      # 14. Upload ONLY small extraction results
      # ------------------------------------------------------------
      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-extraction
          path: artifacts/result
          if-no-files-found: warn
          retention-days: 7
