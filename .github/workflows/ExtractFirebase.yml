name: Extract Android APK data

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Direct URL to APK, APKS, XAPK, APKM or ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    name: Analyze Android package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: "21"
      CMDLINE_TOOLS_VERSION: "14742923"
      ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
      JADX_VERSION: "1.5.6"

    steps:

      # ============================================================
      # Java
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # Android SDK
      # ============================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

          cd "$RUNNER_TEMP"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 300 \
            -o commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          rm -rf "$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$RUNNER_TEMP/cmdline-tools"

          unzip -q commandlinetools.zip \
            -d "$RUNNER_TEMP/cmdline-tools"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* \
             "$SDK_ROOT/cmdline-tools/latest/"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"

          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"

          echo "ANDROID_BUILD_TOOLS=$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" \
            >> "$GITHUB_ENV"

          echo
          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo
          echo "Build Tools:"
          "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2" version

          echo
          echo "apksigner:"
          "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" version

      # ============================================================
      # JADX
      # ============================================================

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 300 \
            -o jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          rm -rf "$RUNNER_TEMP/jadx"
          mkdir -p "$RUNNER_TEMP/jadx"

          unzip -q jadx.zip \
            -d "$RUNNER_TEMP/jadx"

          test -x "$RUNNER_TEMP/jadx/bin/jadx"

          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/jadx/bin/jadx" --version

      # ============================================================
      # Workspace
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work artifacts

          mkdir -p \
            work/input \
            work/apks \
            work/jadx \
            work/tmp \
            artifacts/result \
            artifacts/certs

      # ============================================================
      # Download
      # ============================================================

      - name: Download package
        shell: bash
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
        run: |
          set -euo pipefail

          if [[ -z "$PACKAGE_URL" ]]; then
            echo "ERROR: package_url is empty"
            exit 1
          fi

          echo "Downloading package..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -o work/input/package \
            "$PACKAGE_URL"

          test -s work/input/package

          echo
          echo "Downloaded file:"
          file work/input/package

          echo
          echo "Size:"
          ls -lh work/input/package

      # ============================================================
      # Detect APK vs container
      #
      # Important:
      # An APK itself is a ZIP archive.
      # Therefore simply checking "is ZIP" is NOT enough.
      #
      # If the archive has a root AndroidManifest.xml, it is treated
      # as an ordinary APK.
      #
      # Otherwise all embedded *.apk files are extracted.
      # ============================================================

      - name: Detect and extract APK files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import shutil
          import zipfile
          from pathlib import Path

          source = Path("work/input/package")
          output = Path("work/apks")

          output.mkdir(parents=True, exist_ok=True)

          def is_ordinary_apk(path: Path) -> bool:
              if not zipfile.is_zipfile(path):
                  return False

              try:
                  with zipfile.ZipFile(path) as zf:
                      names = set(zf.namelist())
                      return "AndroidManifest.xml" in names
              except Exception:
                  return False

          if is_ordinary_apk(source):
              print("Detected ordinary APK.")

              destination = output / "base.apk"
              shutil.copy2(source, destination)

          elif zipfile.is_zipfile(source):
              print("Detected APK container/archive.")

              with zipfile.ZipFile(source) as zf:
                  entries = [
                      info
                      for info in zf.infolist()
                      if not info.is_dir()
                      and info.filename.lower().endswith(".apk")
                  ]

                  if not entries:
                      raise SystemExit(
                          "ERROR: ZIP archive does not contain any APK files."
                      )

                  print(f"Found {len(entries)} embedded APK file(s).")

                  used_names = set()

                  for index, info in enumerate(entries, start=1):
                      original_name = Path(info.filename).name

                      if not original_name:
                          continue

                      # Avoid collisions when different directories contain
                      # APKs with the same filename.
                      candidate = original_name

                      if candidate in used_names:
                          candidate = f"{index:03d}_{candidate}"

                      used_names.add(candidate)

                      destination = output / candidate

                      with zf.open(info) as src:
                          with destination.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

                      print(f"Extracted: {destination}")

          else:
              raise SystemExit(
                  "ERROR: downloaded file is neither an APK nor a ZIP archive."
              )

          apks = sorted(output.glob("*.apk"))

          if not apks:
              raise SystemExit("ERROR: no APK files found.")

          # Try to identify base APK.
          base_candidates = [
              apk for apk in apks
              if apk.name.lower() == "base.apk"
              or "base" in apk.stem.lower()
          ]

          base_apk = base_candidates[0] if base_candidates else apks[0]

          (output / ".base-apk").write_text(
              base_apk.name,
              encoding="utf-8",
          )

          print()
          print("APK files:")
          for apk in apks:
              marker = " [BASE]" if apk == base_apk else ""
              print(f" - {apk.name}{marker}")
          PY

          echo
          echo "Base APK:"
          cat work/apks/.base-apk

      # ============================================================
      # Validate APK files
      # ============================================================

      - name: Validate APK files
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' apk; do
            count=$((count + 1))

            echo
            echo "============================================================"
            echo "Validating: $apk"
            echo "============================================================"

            unzip -tq "$apk"

            if ! unzip -l "$apk" | grep -q 'AndroidManifest.xml'; then
              echo "ERROR: AndroidManifest.xml not found:"
              echo "$apk"
              exit 1
            fi

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
            | sort -z
          )

          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: no APK files found."
            exit 1
          fi

          echo
          echo "Validated $count APK file(s)."

      # ============================================================
      # APK metadata
      #
      # The aapt2 path is exported into the environment.
      # Python reads it with os.environ[].
      #
      # This specifically avoids the previous:
      #
      # FileNotFoundError:
      # '${ANDROID_BUILD_TOOLS}/aapt2'
      # ============================================================

      - name: Extract APK metadata
        shell: bash
        run: |
          set -euo pipefail

          export AAPT2="$ANDROID_BUILD_TOOLS/aapt2"

          test -x "$AAPT2"

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          aapt2 = os.environ["AAPT2"]

          apk_dir = Path("work/apks")
          result_dir = Path("artifacts/result")

          result_dir.mkdir(parents=True, exist_ok=True)

          records = []

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          def run_aapt2(apk: Path, command: str):
              return subprocess.run(
                  [
                      aapt2,
                      "dump",
                      command,
                      str(apk),
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  errors="replace",
                  check=False,
              )

          for apk in sorted(apk_dir.glob("*.apk")):
              print(f"Processing: {apk}")

              badging = run_aapt2(apk, "badging")

              if badging.returncode != 0:
                  raise RuntimeError(
                      f"aapt2 dump badging failed for {apk}\n"
                      f"{badging.stdout}"
                  )

              permissions = run_aapt2(apk, "permissions")

              package = None
              version_code = None
              version_name = None
              min_sdk = None
              target_sdk = None

              match = re.search(
                  r"package:\s+"
                  r"name='([^']+)'"
                  r"(?:\s+versionCode='([^']*)')?"
                  r"(?:\s+versionName='([^']*)')?",
                  badging.stdout,
              )

              if match:
                  package = match.group(1)
                  version_code = match.group(2)
                  version_name = match.group(3)

              match = re.search(
                  r"sdkVersion:'([^']+)'",
                  badging.stdout,
              )

              if match:
                  min_sdk = match.group(1)

              match = re.search(
                  r"targetSdkVersion:'([^']+)'",
                  badging.stdout,
              )

              if match:
                  target_sdk = match.group(1)

              record = {
                  "file": apk.name,
                  "size_bytes": apk.stat().st_size,
                  "sha256": sha256(apk),
                  "package": package,
                  "version_code": version_code,
                  "version_name": version_name,
                  "min_sdk": min_sdk,
                  "target_sdk": target_sdk,
                  "badging": badging.stdout,
                  "permissions": permissions.stdout
                  if permissions.returncode == 0
                  else "",
              }

              records.append(record)

              safe_name = re.sub(
                  r"[^A-Za-z0-9_.-]+",
                  "_",
                  apk.stem,
              )

              (
                  result_dir / f"{safe_name}.badging.txt"
              ).write_text(
                  badging.stdout,
                  encoding="utf-8",
              )

              (
                  result_dir / f"{safe_name}.permissions.txt"
              ).write_text(
                  permissions.stdout,
                  encoding="utf-8",
              )

          (
              result_dir / "apk-metadata.json"
          ).write_text(
              json.dumps(
                  records,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          with (
              result_dir / "apk-list.tsv"
          ).open(
              "w",
              encoding="utf-8",
          ) as f:
              f.write(
                  "file\tpackage\tversion_code\tversion_name\tsha256\n"
              )

              for record in records:
                  f.write(
                      f"{record['file']}\t"
                      f"{record['package'] or ''}\t"
                      f"{record['version_code'] or ''}\t"
                      f"{record['version_name'] or ''}\t"
                      f"{record['sha256']}\n"
                  )
          PY

      # ============================================================
      # Certificates
      # ============================================================

      - name: Extract signing certificates
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          PEM_SUPPORTED=0

          if "$APKSIGNER" help 2>&1 | grep -q -- "--print-certs-pem"; then
            PEM_SUPPORTED=1
          fi

          while IFS= read -r -d '' apk; do

            base="$(basename "$apk" .apk)"

            safe="$(
              printf '%s' "$base" |
              tr -c 'A-Za-z0-9_.-' '_'
            )"

            cert_txt="artifacts/certs/${safe}.certs.txt"
            cert_pem="artifacts/certs/${safe}.certs.pem"
            status_file="artifacts/certs/${safe}.status.txt"

            echo
            echo "============================================================"
            echo "Certificate: $apk"
            echo "============================================================"

            if "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$apk" \
              > "$cert_txt" \
              2>&1
            then
              echo "VALID" > "$status_file"
            else
              echo "INVALID_OR_UNVERIFIABLE" > "$status_file"
            fi

            if [[ "$PEM_SUPPORTED" -eq 1 ]]; then
              "$APKSIGNER" verify \
                --print-certs-pem \
                "$apk" \
                > "$cert_pem" \
                2>&1 || true
            else
              printf '%s\n' \
                "This apksigner does not support --print-certs-pem." \
                > "$cert_pem"
            fi

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
            | sort -z
          )

      # ============================================================
      # Identify base APK
      # ============================================================

      - name: Record base APK
        shell: bash
        run: |
          set -euo pipefail

          BASE_APK="$(cat work/apks/.base-apk)"

          {
            echo "base_apk=$BASE_APK"
            echo
            echo "Base APK:"
            echo "$BASE_APK"
          } > artifacts/result/base-apk.txt

      # ============================================================
      # JADX
      #
      # Each APK gets its own output directory.
      # This avoids merging split APKs into one potentially conflicting
      # decompilation tree.
      # ============================================================

      - name: Decompile APK files with JADX
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' apk; do
            count=$((count + 1))

            stem="$(basename "$apk" .apk)"

            output_dir="work/jadx/$stem"

            rm -rf "$output_dir"
            mkdir -p "$output_dir"

            echo
            echo "============================================================"
            echo "JADX: $apk"
            echo "Output: $output_dir"
            echo "============================================================"

            jadx \
              --show-bad-code \
              --threads-count 4 \
              -d "$output_dir" \
              "$apk"

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
            | sort -z
          )

          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: JADX received no APK files."
            exit 1
          fi

          echo
          echo "JADX processed $count APK file(s)."

      # ============================================================
      # BuildVars
      # ============================================================

      - name: Extract BuildVars
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="artifacts/result/buildvars.txt"

          {
            echo "=== BuildVars files ==="

            find work/jadx \
              -type f \
              \( \
                -name 'BuildVars.java' \
                -o \
                -name 'BuildVars.kt' \
              \) \
              -print \
            | sort

            echo
            echo "=== Relevant constants ==="

            grep -RniE \
              --include='BuildVars.java' \
              --include='BuildVars.kt' \
              'APP_ID|APP_HASH|GOOGLE_AUTH_CLIENT_ID|HUAWEI_APP_ID|SAFETYNET_KEY' \
              work/jadx \
              || true

          } > "$OUTPUT"

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("work/jadx")
          out = Path("artifacts/result/buildvars-values.json")

          patterns = {
              "APP_ID": [
                  r"\bAPP_ID\s*=\s*([0-9]+)",
                  r'\bAPP_ID\s*=\s*["\']([^"\']+)["\']',
              ],
              "APP_HASH": [
                  r'\bAPP_HASH\s*=\s*["\']([^"\']+)["\']',
              ],
              "GOOGLE_AUTH_CLIENT_ID": [
                  r'\bGOOGLE_AUTH_CLIENT_ID\s*=\s*["\']([^"\']+)["\']',
              ],
              "HUAWEI_APP_ID": [
                  r'\bHUAWEI_APP_ID\s*=\s*["\']([^"\']+)["\']',
              ],
              "SAFETYNET_KEY": [
                  r'\bSAFETYNET_KEY\s*=\s*["\']([^"\']+)["\']',
              ],
          }

          result = {}

          files = sorted(
              list(root.rglob("BuildVars.java"))
              + list(root.rglob("BuildVars.kt"))
          )

          for key, regexes in patterns.items():
              values = []

              for path in files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  for pattern in regexes:
                      for match in re.finditer(
                          pattern,
                          text,
                      ):
                          value = match.group(1)

                          if value not in values:
                              values.append(value)

              result[key] = values

          out.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

      # ============================================================
      # Firebase
      # ============================================================

      - name: Extract Firebase values
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="artifacts/result/firebase.txt"

          {
            echo "=== Firebase-related files ==="

            find work/jadx \
              -type f \
              \( \
                -iname '*google-services*' \
                -o \
                -iname '*firebase*' \
                -o \
                -name 'strings.xml' \
              \) \
              -print \
            | sort

            echo
            echo "=== Firebase-related values ==="

            grep -RniE \
              --include='strings.xml' \
              'firebase|google_app_id|gcm_defaultSenderId|default_web_client_id|google_api_key|google_crash_reporting_api_key|project_id|firebase_database_url' \
              work/jadx \
              || true

          } > "$OUTPUT"

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("work/jadx")
          out = Path("artifacts/result/firebase-values.json")

          keys = [
              "google_app_id",
              "gcm_defaultSenderId",
              "default_web_client_id",
              "google_api_key",
              "google_crash_reporting_api_key",
              "project_id",
              "firebase_database_url",
          ]

          result = {
              key: []
              for key in keys
          }

          for path in root.rglob("strings.xml"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              for key in keys:
                  pattern = (
                      rf'<string\s+'
                      rf'name=["\']{re.escape(key)}["\']'
                      rf'[^>]*>'
                      rf'(.*?)'
                      rf'</string>'
                  )

                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE | re.DOTALL,
                  ):
                      value = match.group(1).strip()

                      value = re.sub(
                          r'<[^>]+>',
                          '',
                          value,
                      )

                      if value and value not in result[key]:
                          result[key].append(value)

          out.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

      # ============================================================
      # General search
      # ============================================================

      - name: Search extracted source
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== APP_ID / APP_HASH ==="

            grep -RniE \
              'APP_ID|APP_HASH|applicationId' \
              work/jadx \
              | head -n 1000 \
              || true

            echo
            echo "=== Firebase ==="

            grep -RniE \
              'firebase|google_app_id|google_api_key|default_web_client_id' \
              work/jadx \
              | head -n 1000 \
              || true

          } > artifacts/result/search-results.txt

      # ============================================================
      # Summary
      # ============================================================

      - name: Create summary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          metadata_file = Path(
              "artifacts/result/apk-metadata.json"
          )

          records = json.loads(
              metadata_file.read_text(
                  encoding="utf-8"
              )
          )

          base_apk = Path(
              "artifacts/result/base-apk.txt"
          ).read_text(
              encoding="utf-8"
          ).split("base_apk=", 1)[-1].splitlines()[0]

          summary = Path(
              "artifacts/result/SUMMARY.md"
          )

          with summary.open(
              "w",
              encoding="utf-8",
          ) as f:

              f.write("# Android APK analysis\n\n")

              f.write(
                  f"- APK files: **{len(records)}**\n"
              )
              f.write(
                  f"- Base APK: **{base_apk}**\n"
              )
              f.write(
                  "- JADX: **1.5.6**\n"
              )
              f.write(
                  "- Android Build Tools: **36.1.0**\n\n"
              )

              f.write("## APKs\n\n")

              f.write(
                  "| File | Package | Version code | Version name | SHA-256 |\n"
              )
              f.write(
                  "|---|---|---:|---|---|\n"
              )

              for item in records:
                  f.write(
                      "| "
                      + " | ".join(
                          str(
                              item.get(key) or ""
                          ).replace("|", "\\|")
                          for key in (
                              "file",
                              "package",
                              "version_code",
                              "version_name",
                              "sha256",
                          )
                      )
                      + " |\n"
                  )

          print(summary.read_text(encoding="utf-8"))

          with open(
              "artifacts/result/SUMMARY.md",
              "r",
              encoding="utf-8",
          ) as f:
              print(
                  f.read(),
                  file=open(
                      "/dev/stdout",
                      "w",
                      encoding="utf-8",
                  ),
              )
          PY

          cat artifacts/result/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # Remove APKs before artifact upload
      # ============================================================

      - name: Remove downloaded APK files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/input
          rm -rf work/apks

      # ============================================================
      # Upload results
      # ============================================================

      - name: Upload analysis results
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-analysis
          path: |
            artifacts/result
            artifacts/certs
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # Upload JADX output
      # ============================================================

      - name: Upload JADX source
        uses: actions/upload-artifact@v7
