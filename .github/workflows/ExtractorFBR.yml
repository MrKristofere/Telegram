name: Extract Firebase

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Direct URL to APK, APKS, XAPK or ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract-firebase:
    name: Extract and verify FirebaseInstallationServiceClient
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: "21"
      JADX_VERSION: "1.5.6"

    steps:

      # ============================================================
      # Java
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # Install JADX
      # ============================================================

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail

          JADX_DIR="$RUNNER_TEMP/jadx"
          JADX_ZIP="$RUNNER_TEMP/jadx.zip"

          rm -rf "$JADX_DIR"
          mkdir -p "$JADX_DIR"

          echo "Downloading JADX ${JADX_VERSION}..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 300 \
            -o "$JADX_ZIP" \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          echo "Extracting JADX..."

          unzip -q "$JADX_ZIP" -d "$JADX_DIR"

          echo
          echo "Searching for JADX executable..."

          find "$JADX_DIR" \
            -type f \
            -path '*/bin/jadx' \
            -print

          JADX_BIN="$(find "$JADX_DIR" \
            -type f \
            -path '*/bin/jadx' \
            -print -quit)"

          if [[ -z "$JADX_BIN" ]]; then
            echo "::error::JADX executable was not found."

            echo
            echo "JADX directory contents:"
            find "$JADX_DIR" -maxdepth 4 -type f -print

            exit 1
          fi

          chmod +x "$JADX_BIN"

          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

          echo
          echo "JADX executable:"
          echo "$JADX_BIN"

          echo
          echo "JADX version:"
          "$JADX_BIN" --version

      # ============================================================
      # Prepare directories
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work artifacts

          mkdir -p \
            work/input \
            work/apks \
            work/jadx \
            artifacts/firebase \
            artifacts/certs

      # ============================================================
      # Download package
      # ============================================================

      - name: Parse APK URL
        id: source
        env:
          APK_URL: ${{ inputs.package_url }}
        run: |
          set -euo pipefail

          echo "Source:"
          echo "$APK_URL"

          if [[ "$APK_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+)/?$ ]]; then
            echo "type=github-artifact" >> "$GITHUB_OUTPUT"
            echo "repository=${BASH_REMATCH[1]}/${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "run_id=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "artifact_id=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"

            echo "GitHub Actions artifact detected"
            echo "Repository: ${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            echo "Run ID: ${BASH_REMATCH[3]}"
            echo "Artifact ID: ${BASH_REMATCH[4]}"
          else
            echo "type=direct" >> "$GITHUB_OUTPUT"
            echo "url=$APK_URL" >> "$GITHUB_OUTPUT"

            echo "Direct URL detected"
          fi

      - name: Download GitHub Artifact
        if: steps.source.outputs.type == 'github-artifact'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          repository: ${{ steps.source.outputs.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/input/downloaded

      - name: Normalize downloaded package
        if: steps.source.outputs.type == 'github-artifact'
        shell: bash
        run: |
          set -euo pipefail

          rm -f work/input/package

          mapfile -d '' FILES < <(
            find work/input/downloaded \
              -type f \
              -print0 |
            sort -z
          )

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::GitHub artifact contains no files."
            exit 1
          fi

          if [[ "${#FILES[@]}" -ne 1 ]]; then
            echo "::error::GitHub artifact must contain exactly one package file."
            echo "Files found:"
            printf '  %s\n' "${FILES[@]}"
            exit 1
          fi

          SOURCE="${FILES[0]}"

          case "${SOURCE,,}" in
            *.apk|*.apks|*.xapk|*.zip)
              ;;
            *)
              echo "::error::Unsupported package file:"
              echo "$SOURCE"
              exit 1
              ;;
          esac

          cp -- "$SOURCE" work/input/package

          echo "Normalized package:"
          ls -lh work/input/package

          echo
          echo "SHA-256:"
          sha256sum work/input/package

          echo
          echo "File type:"
          file work/input/package

      - name: Download Direct APK
        if: steps.source.outputs.type == 'direct'
        env:
          APK_URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          curl \
            --location \
            --fail-with-body \
            --retry 3 \
            --retry-delay 4 \
            --connect-timeout 30 \
            --max-time 600 \
            --output work/input/package \
            "$APK_URL"

      # ============================================================
      # Extract APKs
      # ============================================================

      - name: Extract APK files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          source = Path("work/input/package")
          output = Path("work/apks")

          output.mkdir(parents=True, exist_ok=True)

          def is_apk(path):
              try:
                  with zipfile.ZipFile(path) as zf:
                      return "AndroidManifest.xml" in zf.namelist()
              except Exception:
                  return False

          # --------------------------------------------------------
          # Ordinary APK
          # --------------------------------------------------------

          if is_apk(source):
              print("Input is an APK.")

              destination = output / "base.apk"
              shutil.copy2(source, destination)

          # --------------------------------------------------------
          # APK container: APKS / XAPK / ZIP
          # --------------------------------------------------------

          elif zipfile.is_zipfile(source):
              print("Input is a ZIP/APKS/XAPK container.")

              with zipfile.ZipFile(source) as zf:

                  entries = []

                  for info in zf.infolist():

                      if info.is_dir():
                          continue

                      if not info.filename.lower().endswith(".apk"):
                          continue

                      entries.append(info)

                  if not entries:
                      raise SystemExit(
                          "ERROR: archive does not contain APK files."
                      )

                  used_names = set()

                  for index, info in enumerate(entries, start=1):

                      name = Path(info.filename).name

                      if not name:
                          continue

                      candidate = name

                      if candidate in used_names:
                          candidate = f"{index:03d}_{candidate}"

                      used_names.add(candidate)

                      destination = output / candidate

                      print(
                          f"Extracting {info.filename} "
                          f"-> {destination}"
                      )

                      with zf.open(info) as src:
                          with destination.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

          else:
              raise SystemExit(
                  "ERROR: input is neither APK nor ZIP/APKS/XAPK."
              )

          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          apks = sorted(output.glob("*.apk"))

          if not apks:
              raise SystemExit("ERROR: no APK files found.")

          print()
          print("APK files found:")

          for apk in apks:
              print(f"  {apk}")

          print()
          print(f"Total APK files: {len(apks)}")
          PY

      # ============================================================
      # Validate APKs
      # ============================================================

      - name: Validate APK files
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' apk; do

            count=$((count + 1))

            echo
            echo "============================================================"
            echo "Validating:"
            echo "$apk"
            echo "============================================================"

            unzip -tq "$apk"

            if ! unzip -l "$apk" | grep -q 'AndroidManifest.xml'; then
              echo "::error::AndroidManifest.xml not found in $apk"
              exit 1
            fi

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 |
            sort -z
          )

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No APK files found."
            exit 1
          fi

          echo
          echo "Validated APK files: $count"

      # ============================================================
      # Decompile APKs with JADX
      # ============================================================

      - name: Decompile APK files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${JADX_BIN:-}" ]]; then
            echo "::error::JADX_BIN is not set."
            exit 1
          fi

          if [[ ! -x "$JADX_BIN" ]]; then
            echo "::error::JADX executable is not executable:"
            echo "$JADX_BIN"
            exit 1
          fi

          echo "Using JADX:"
          echo "$JADX_BIN"

          "$JADX_BIN" --version

          while IFS= read -r -d '' apk; do

            stem="$(basename "$apk" .apk)"
            output_dir="work/jadx/$stem"

            rm -rf "$output_dir"
            mkdir -p "$output_dir"

            echo
            echo "============================================================"
            echo "JADX"
            echo "APK: $apk"
            echo "OUTPUT: $output_dir"
            echo "============================================================"

            set +e

            "$JADX_BIN" \
              --show-bad-code \
              --threads-count 4 \
              --log-level WARN \
              -d "$output_dir" \
              "$apk" \
              > "work/jadx/${stem}.log" \
              2>&1

            JADX_EXIT=$?

            set -e

            echo "JADX exit code: $JADX_EXIT"

            if [[ ! -d "$output_dir" ]]; then
              echo "::error::JADX did not create output directory."
              exit 1
            fi

            if [[ "$JADX_EXIT" -ne 0 ]]; then
              echo "::warning::JADX returned exit code $JADX_EXIT."
              echo "Continuing because partial decompilation may still be usable."
            fi

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 |
            sort -z
          )

      # ============================================================
      # Find FirebaseInstallationServiceClient
      # ============================================================

      - name: Locate FirebaseInstallationServiceClient
        shell: bash
        run: |
          set -euo pipefail

          LOCATION_REPORT="artifacts/firebase/firebase-location.txt"

          : > "$LOCATION_REPORT"

          {
            echo "FirebaseInstallationServiceClient locations"
            echo
          } >> "$LOCATION_REPORT"

          mapfile -d '' FILES < <(
            find work/jadx \
              -type f \
              -name 'FirebaseInstallationServiceClient.java' \
              -print0 |
            sort -z
          )

          echo "Found files: ${#FILES[@]}" | tee -a "$LOCATION_REPORT"

          echo >> "$LOCATION_REPORT"

          if [[ "${#FILES[@]}" -eq 0 ]]; then

            echo "No FirebaseInstallationServiceClient.java found." \
              | tee -a "$LOCATION_REPORT"

            echo
            echo "Searching for class name in all Java files..."

            grep -Rni \
              --include='*.java' \
              'FirebaseInstallationServiceClient' \
              work/jadx \
              >> "$LOCATION_REPORT" \
              || true

            echo
            echo "::error::FirebaseInstallationServiceClient.java was not found."
            exit 1
          fi

          for file in "${FILES[@]}"; do
            echo "$file" | tee -a "$LOCATION_REPORT"
          done

      # ============================================================
      # Extract target Java file
      # ============================================================

      - name: Extract FirebaseInstallationServiceClient
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="artifacts/firebase/files"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          count=0

          while IFS= read -r -d '' file; do

            count=$((count + 1))

            safe_name="$(
              printf '%s' "$file" |
              sed \
                -e 's#/#_#g' \
                -e 's#^_#file_#'
            )"

            destination="$OUTPUT_DIR/${count}_${safe_name}"

            cp "$file" "$destination"

            echo
            echo "Extracted:"
            echo "  SOURCE: $file"
            echo "  TARGET: $destination"

          done < <(
            find work/jadx \
              -type f \
              -name 'FirebaseInstallationServiceClient.java' \
              -print0 |
            sort -z
          )

          if [[ "$count" -eq 0 ]]; then
            echo "::error::Target Java file was not extracted."
            exit 1
          fi

          echo
          echo "Extracted files: $count"

      # ============================================================
      # Analyze first Morphe modification
      #
      # Expected patched implementation:
      #
      # private String getFingerprintHashForPackage() {
      #     return "40_HEX_CHAR_SHA1";
      # }
      #
      # Original implementation contains:
      #
      # AndroidUtilsLight.getPackageCertificateHashBytes(...)
      # ============================================================

      - name: Verify getFingerprintHashForPackage patch
        shell: bash
        run: |
          set -euo pipefail

          REPORT="artifacts/firebase/fingerprint-method.txt"

          : > "$REPORT"

          {
            echo "============================================================"
            echo "CHECK 1: getFingerprintHashForPackage()"
            echo "============================================================"
            echo
          } >> "$REPORT"

          total=0
          patched=0
          original=0
          unknown=0

          while IFS= read -r -d '' file; do

            total=$((total + 1))

            {
              echo
              echo "------------------------------------------------------------"
              echo "FILE:"
              echo "$file"
              echo "------------------------------------------------------------"
              echo
            } >> "$REPORT"

            # ------------------------------------------------------
            # Extract method
            # ------------------------------------------------------

            METHOD="$(
              awk '
                /getFingerprintHashForPackage[[:space:]]*\(/ {
                  found=1
                  depth=0
                }

                found {
                  print

                  opens = gsub(/\{/, "{")
                  closes = gsub(/\}/, "}")

                  depth += opens
                  depth -= closes

                  if (depth <= 0 && NR > 1) {
                    exit
                  }
                }
              ' "$file"
            )"

            if [[ -z "$METHOD" ]]; then

              echo "METHOD: NOT FOUND" >> "$REPORT"
              echo "VERDICT: UNKNOWN" >> "$REPORT"

              unknown=$((unknown + 1))

              continue
            fi

            echo "METHOD:" >> "$REPORT"
            echo "$METHOD" >> "$REPORT"
            echo >> "$REPORT"

            # ------------------------------------------------------
            # Detect Morphe-style constant return
            # ------------------------------------------------------

            if printf '%s\n' "$METHOD" |
              grep -qE \
                'return[[:space:]]+"[0-9A-Fa-f]{40}"[[:space:]]*;' \
              &&
              ! printf '%s\n' "$METHOD" |
              grep -q \
                'AndroidUtilsLight.getPackageCertificateHashBytes'; then

              echo "VERDICT: MORPHE_PATCH_DETECTED" >> "$REPORT"

              patched=$((patched + 1))

            # ------------------------------------------------------
            # Detect original Firebase implementation
            # ------------------------------------------------------

            elif printf '%s\n' "$METHOD" |
              grep -q \
                'AndroidUtilsLight.getPackageCertificateHashBytes'; then

              echo "VERDICT: ORIGINAL_IMPLEMENTATION" >> "$REPORT"

              original=$((original + 1))

            else

              echo "VERDICT: UNKNOWN" >> "$REPORT"

              unknown=$((unknown + 1))

            fi

          done < <(
            find work/jadx \
              -type f \
              -name 'FirebaseInstallationServiceClient.java' \
              -print0 |
            sort -z
          )

          {
            echo
            echo "============================================================"
            echo "CHECK 1 SUMMARY"
            echo "============================================================"
            echo
            echo "Total: $total"
            echo "Morphe patch detected: $patched"
            echo "Original implementation: $original"
            echo "Unknown: $unknown"
          } >> "$REPORT"

          cat "$REPORT"

      # ============================================================
      # Analyze second Morphe modification
      #
      # This checks the X-Android-Cert call site.
      # ============================================================

      - name: Verify X-Android-Cert patch
        shell: bash
        run: |
          set -euo pipefail

          REPORT="artifacts/firebase/x-android-cert.txt"

          : > "$REPORT"

          {
            echo "============================================================"
            echo "CHECK 2: X-Android-Cert"
            echo "============================================================"
            echo
          } >> "$REPORT"

          total=0

          while IFS= read -r -d '' file; do

            total=$((total + 1))

            {
              echo
              echo "------------------------------------------------------------"
              echo "FILE:"
              echo "$file"
              echo "------------------------------------------------------------"
              echo
              echo "X-Android-Cert context:"
              echo
            } >> "$REPORT"

            # ------------------------------------------------------
            # Print context around X_ANDROID_CERT_HEADER_KEY
            # ------------------------------------------------------

            grep -n \
              -B20 \
              -A20 \
              'X_ANDROID_CERT_HEADER_KEY' \
              "$file" \
              >> "$REPORT" \
              || true

            echo >> "$REPORT"

            # ------------------------------------------------------
            # Look for literal SHA-1 constants in the file.
            # ------------------------------------------------------

            echo "40-character SHA-1 constants:" >> "$REPORT"

            grep -nE \
              '"[0-9A-Fa-f]{40}"' \
              "$file" \
              >> "$REPORT" \
              || true

            echo >> "$REPORT"

          done < <(
            find work/jadx \
              -type f \
              -name 'FirebaseInstallationServiceClient.java' \
              -print0 |
            sort -z
          )

          cat "$REPORT"

      # ============================================================
      # Extract SHA-1 literals
      # ============================================================

      - name: Extract SHA-1 constants
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="artifacts/firebase/sha1-constants.txt"

          : > "$OUTPUT"

          {
            echo "SHA-1 constants found in"
            echo "FirebaseInstallationServiceClient.java"
            echo
          } >> "$OUTPUT"

          grep -RniE \
            --include='FirebaseInstallationServiceClient.java' \
            '"[0-9A-Fa-f]{40}"' \
            work/jadx \
            >> "$OUTPUT" \
            || true

          cat "$OUTPUT"

      # ============================================================
      # Search Firebase-related classes
      # ============================================================

      - name: List Firebase installation classes
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="artifacts/firebase/firebase-classes.txt"

          : > "$OUTPUT"

          echo "Firebase-related Java classes:" >> "$OUTPUT"
          echo >> "$OUTPUT"

          find work/jadx \
            -type f \
            -path '*/com/google/firebase/installations/*' \
            -name '*.java' \
            -print \
            | sort \
            >> "$OUTPUT"

          cat "$OUTPUT"

      # ============================================================
      # Save JADX log
      # ============================================================

      - name: Collect JADX logs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/firebase/jadx-logs

          find work/jadx \
            -maxdepth 1 \
            -type f \
            -name '*.log' \
            -exec cp {} artifacts/firebase/jadx-logs/ \;

      # ============================================================
      # Save complete target source
      # ============================================================

      - name: Save Firebase source context
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="artifacts/firebase/source-context"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          while IFS= read -r -d '' file; do

            relative="${file#work/jadx/}"

            destination="$OUTPUT/$relative"

            mkdir -p "$(dirname "$destination")"

            cp "$file" "$destination"

          done < <(
            find work/jadx \
              -type f \
              -path '*/com/google/firebase/installations/remote/*.java' \
              -print0 |
            sort -z
          )

      # ============================================================
      # Signing certificate information
      # ============================================================

      - name: Extract APK certificate information
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d artifacts/certs ]]; then
            mkdir -p artifacts/certs
          fi

          # apksigner may not be installed on the runner.
          # Certificate extraction is therefore performed with
          # keytool where possible.

          while IFS= read -r -d '' apk; do

            name="$(basename "$apk" .apk)"

            output="artifacts/certs/${name}.txt"

            {
              echo "APK:"
              echo "$apk"
              echo
              echo "ZIP entries containing certificates:"
              unzip -l "$apk" |
                grep -Ei \
                  'META-INF/.*\.(RSA|DSA|EC)$' \
                || true

              echo
              echo "APK SHA-256:"
              sha256sum "$apk"

            } > "$output"

          done < <(
            find work/apks \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 |
            sort -z
          )

      # ============================================================
      # Final summary
      # ============================================================

      - name: Final summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "FINAL ARTIFACTS"
          echo "============================================================"
          echo

          find artifacts \
            -type f \
            -printf '%p\n' |
          sort

          echo
          echo "Firebase target:"
          echo "com.google.firebase.installations.remote.FirebaseInstallationServiceClient"
          echo
          echo "Checks:"
          echo "  1. getFingerprintHashForPackage()"
          echo "  2. X-Android-Cert"
          echo
          echo "Results are available in the GitHub Actions artifact:"
          echo "firebase-analysis"

      # ============================================================
      # Upload everything
      # ============================================================

      - name: Upload analysis
        uses: actions/upload-artifact@v7
        with:
          name: firebase-analysis
          path: |
            artifacts/firebase/
            artifacts/certs/
          if-no-files-found: error
          retention-days: 7
