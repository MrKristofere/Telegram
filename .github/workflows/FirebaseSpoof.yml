name: Firebase Spoof

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK"
        required: true
        type: string

      certificate_hash:
        description: "Original Firebase certificate SHA-1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Android Build Tools
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --max-filesize 524288000 \
            "$APK_URL" \
            --output input.apk

          file input.apk
          unzip -t input.apk >/dev/null

      - name: Build Firebase patcher
        working-directory: patcher
        run: |
          mvn -B -DskipTests package

      - name: Patch Firebase certificate
        env:
          CERTIFICATE_HASH: ${{ inputs.certificate_hash }}
        run: |
          java -jar \
            patcher/firebase-apk-patcher-1.0.0-all.jar \
            input.apk \
            patched-unsigned.apk \
            "$CERTIFICATE_HASH"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p 4 \
            patched-unsigned.apk \
            patched-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "env:KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out patched.apk \
            patched-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            patched.apk

      - name: Calculate SHA-256
        run: |
          sha256sum patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: patched-telegram-apk
          path: patched.apk
          archive: false
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f release.keystore
