name: Firebase Spoof

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK"
        required: true
        type: string

      certificate_hash:
        description: "Original Firebase certificate SHA-1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Android Build Tools
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Parse APK URL
        id: source
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail

          echo "Source:"
          echo "$APK_URL"

          if [[ "$APK_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+)/?$ ]]; then
            echo "type=github-artifact" >> "$GITHUB_OUTPUT"
            echo "repository=${BASH_REMATCH[1]}/${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "run_id=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "artifact_id=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"

            echo "GitHub Actions artifact detected"
            echo "Repository: ${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            echo "Run ID: ${BASH_REMATCH[3]}"
            echo "Artifact ID: ${BASH_REMATCH[4]}"
          else
            echo "type=direct" >> "$GITHUB_OUTPUT"
            echo "url=$APK_URL" >> "$GITHUB_OUTPUT"

            echo "Direct URL detected"
          fi

      - name: Download GitHub Artifact
        if: steps.source.outputs.type == 'github-artifact'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          repository: ${{ steps.source.outputs.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Download Direct APK
        if: steps.source.outputs.type == 'direct'
        env:
          APK_URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          curl \
            --location \
            --fail-with-body \
            --retry 3 \
            --retry-delay 4 \
            --connect-timeout 30 \
            --max-time 600 \
            --output downloaded/app.apk \
            "$APK_URL"

      - name: Prepare APK
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          find downloaded -type f -printf '%p (%s bytes)\n'

          APK="$(find downloaded -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" input.apk

          echo "Input APK:"
          ls -lh input.apk

          echo "APK type:"
          file input.apk

          echo "Testing APK ZIP structure..."
          unzip -t input.apk >/dev/null

          echo "Checking DEX files..."
          DEX_FILES="$(unzip -Z1 input.apk | grep -E '^classes([0-9]+)?\.dex$' || true)"

          if [ -z "$DEX_FILES" ]; then
            echo "ERROR: No DEX files found"
            exit 1
          fi

          echo "DEX files found:"
          echo "$DEX_FILES"

          echo "APK is valid."

      - name: APK information
        run: |
          echo "APK size:"
          ls -lh input.apk

          echo "DEX files:"
          unzip -l input.apk | grep -E '(^|/)classes([0-9]*)\.dex$' || true
      
      - name: Show APK
        run: |
          ls -lh input.apk
          file input.apk

      - name: Build Firebase patcher
        working-directory: patcher
        run: |
          mvn -B -DskipTests package

      - name: Patch Firebase certificate
        env:
          CERTIFICATE_HASH: ${{ inputs.certificate_hash }}
        run: |
          java -jar \
            patcher/target/firebase-apk-patcher-1.0.0-all.jar \
            input.apk \
            patched-unsigned.apk \
            "$CERTIFICATE_HASH"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p 4 \
            patched-unsigned.apk \
            patched-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "env:KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out patched.apk \
            patched-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            patched.apk

      - name: Calculate SHA-256
        run: |
          sha256sum patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: patched-telegram-apk
          path: patched.apk
          archive: false
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f release.keystore
