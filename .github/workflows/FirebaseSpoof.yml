name: Firebase Spoof

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK"
        required: true
        type: string

      certificate_hash:
        description: "Original Firebase certificate SHA-1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Android Build Tools
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail

          echo "Downloading APK..."

          curl \
            --location \
            --fail-with-body \
            --retry 3 \
            --retry-delay 4 \
            --connect-timeout 30 \
            --max-time 600 \
            --output download \
            "$APK_URL"

          echo "Downloaded file:"
          ls -lh download

          FILE_TYPE="$(file -b download)"
          echo "File type: $FILE_TYPE"

          # Прямой APK
          if unzip -t download >/dev/null 2>&1; then
            if unzip -l download | grep -q 'AndroidManifest.xml'; then
              mv download input.apk
              echo "Detected APK"
              exit 0
            fi
          fi

          # ZIP с APK внутри
          if unzip -t download >/dev/null 2>&1; then
            mkdir -p downloaded-artifact
            unzip -q download -d downloaded-artifact

            APK="$(find downloaded-artifact -type f -name '*.apk' | head -n 1)"

            if [ -n "$APK" ]; then
              cp "$APK" input.apk
              echo "Found APK inside archive: $APK"
              exit 0
            fi
          fi

          echo "ERROR: URL did not provide an APK or an archive containing an APK."
          exit 1

      - name: Show APK
        run: |
          ls -lh input.apk
          file input.apk

      - name: Build Firebase patcher
        working-directory: patcher
        run: |
          mvn -B -DskipTests package

      - name: Patch Firebase certificate
        env:
          CERTIFICATE_HASH: ${{ inputs.certificate_hash }}
        run: |
          java -jar \
            patcher/target/firebase-apk-patcher-1.0.0-all.jar \
            input.apk \
            patched-unsigned.apk \
            "$CERTIFICATE_HASH"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p 4 \
            patched-unsigned.apk \
            patched-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "env:KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out patched.apk \
            patched-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            patched.apk

      - name: Calculate SHA-256
        run: |
          sha256sum patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: patched-telegram-apk
          path: patched.apk
          archive: false
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f release.keystore
