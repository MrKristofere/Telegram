name: Firebase Spoof

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK"
        required: true
        type: string

      certificate_hash:
        description: "Original Firebase certificate SHA-1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Android Build Tools
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Downloading:"
          echo "$APK_URL"

          # GitHub Actions Artifact URL
          if [[ "$APK_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+) ]]; then
            echo "GitHub Actions artifact detected"

            curl \
              --location \
              --fail-with-body \
              --retry 3 \
              --retry-delay 4 \
              --connect-timeout 30 \
              --max-time 600 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              --output download \
              "$APK_URL"

          else
            echo "Direct download URL detected"

            curl \
              --location \
              --fail-with-body \
              --retry 3 \
              --retry-delay 4 \
              --connect-timeout 30 \
              --max-time 600 \
              --output download \
              "$APK_URL"
          fi

          echo ""
          echo "Downloaded file:"
          ls -lh download

          echo ""
          echo "File information:"
          file download

          # --------------------------------------------------
          # 1. Проверяем: это непосредственно APK?
          # APK является ZIP-контейнером, поэтому проверяем
          # наличие AndroidManifest.xml.
          # --------------------------------------------------

          if unzip -t download >/dev/null 2>&1 && \
             unzip -l download | grep -qE '(^|/)AndroidManifest\.xml$'; then

            echo "Detected APK directly."

            mv download input.apk

          # --------------------------------------------------
          # 2. Если это ZIP, возможно это старый/архивированный
          # GitHub Artifact с APK внутри.
          # --------------------------------------------------

          elif unzip -t download >/dev/null 2>&1; then

            echo "Detected ZIP archive."
            echo "Searching for APK..."

            rm -rf artifact
            mkdir -p artifact

            unzip -q download -d artifact

            APK="$(find artifact -type f -iname '*.apk' -print -quit || true)"

            if [ -z "$APK" ]; then
              echo "ERROR: ZIP does not contain an APK."
              echo ""
              echo "Archive contents:"
              find artifact -type f -print
              exit 1
            fi

            echo "Found APK:"
            echo "$APK"

            cp "$APK" input.apk

          # --------------------------------------------------
          # 3. Не APK и не ZIP.
          # --------------------------------------------------

          else
            echo "ERROR: Downloaded file is neither an APK nor a ZIP archive."
            file download
            exit 1
          fi

          # --------------------------------------------------
          # Финальная проверка APK.
          # --------------------------------------------------

          echo ""
          echo "Validating APK..."

          if ! unzip -t input.apk >/dev/null 2>&1; then
            echo "ERROR: input.apk is not a valid ZIP/APK."
            exit 1
          fi

          if ! unzip -l input.apk | grep -qE '(^|/)AndroidManifest\.xml$'; then
            echo "ERROR: input.apk does not contain AndroidManifest.xml."
            exit 1
          fi

          echo ""
          echo "APK successfully downloaded:"
          ls -lh input.apk
          file input.apk
      
      - name: Show APK
        run: |
          ls -lh input.apk
          file input.apk

      - name: Build Firebase patcher
        working-directory: patcher
        run: |
          mvn -B -DskipTests package

      - name: Patch Firebase certificate
        env:
          CERTIFICATE_HASH: ${{ inputs.certificate_hash }}
        run: |
          java -jar \
            patcher/target/firebase-apk-patcher-1.0.0-all.jar \
            input.apk \
            patched-unsigned.apk \
            "$CERTIFICATE_HASH"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p 4 \
            patched-unsigned.apk \
            patched-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "env:KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out patched.apk \
            patched-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            patched.apk

      - name: Calculate SHA-256
        run: |
          sha256sum patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: patched-telegram-apk
          path: patched.apk
          archive: false
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f release.keystore
