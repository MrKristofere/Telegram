name: Firebase Spoof

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK"
        required: true
        type: string

      certificate_hash:
        description: "Original Firebase certificate SHA-1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Android Build Tools
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Source URL:"
          echo "$APK_URL"

          # GitHub Actions artifact
          if [[ "$APK_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+) ]]; then
            OWNER="${BASH_REMATCH[1]}"
            REPO="${BASH_REMATCH[2]}"
            ARTIFACT_ID="${BASH_REMATCH[4]}"

            echo "Detected GitHub Actions artifact"
            echo "Repository: $OWNER/$REPO"
            echo "Artifact ID: $ARTIFACT_ID"

            curl \
              --location \
              --fail-with-body \
              --retry 3 \
              --retry-delay 4 \
              --connect-timeout 30 \
              --max-time 600 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --output artifact.zip \
              "https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID/zip"

            mkdir -p artifact
            unzip -q artifact.zip -d artifact

            APK="$(find artifact -type f -name '*.apk' | head -n 1)"

            if [ -z "$APK" ]; then
              echo "ERROR: No APK found inside GitHub artifact"
              exit 1
            fi

            cp "$APK" input.apk

          else
            # Обычный прямой URL
            echo "Detected direct download URL"

            curl \
              --location \
              --fail-with-body \
              --retry 3 \
              --retry-delay 4 \
              --connect-timeout 30 \
              --max-time 600 \
              --output download \
              "$APK_URL"

            # Проверяем, является ли скачанное непосредственно APK
            if unzip -t download >/dev/null 2>&1 &&
               unzip -l download | grep -q 'AndroidManifest.xml'; then

              mv download input.apk

            else
              # Возможно, это ZIP с APK внутри
              mkdir -p artifact
              unzip -q download -d artifact

              APK="$(find artifact -type f -name '*.apk' | head -n 1)"

              if [ -z "$APK" ]; then
                echo "ERROR: URL did not contain an APK"
                exit 1
              fi

              cp "$APK" input.apk
            fi
          fi

          echo "APK successfully obtained:"
          ls -lh input.apk
          file input.apk
      
      - name: Show APK
        run: |
          ls -lh input.apk
          file input.apk

      - name: Build Firebase patcher
        working-directory: patcher
        run: |
          mvn -B -DskipTests package

      - name: Patch Firebase certificate
        env:
          CERTIFICATE_HASH: ${{ inputs.certificate_hash }}
        run: |
          java -jar \
            patcher/target/firebase-apk-patcher-1.0.0-all.jar \
            input.apk \
            patched-unsigned.apk \
            "$CERTIFICATE_HASH"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p 4 \
            patched-unsigned.apk \
            patched-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "env:KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out patched.apk \
            patched-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            patched.apk

      - name: Calculate SHA-256
        run: |
          sha256sum patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: patched-telegram-apk
          path: patched.apk
          archive: false
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f release.keystore
