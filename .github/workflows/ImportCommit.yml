name: Import selected commits

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by a space"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > /tmp/applied.log
          : > /tmp/modified.log
          : > /tmp/skipped.log

      - name: Import selected commits
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"

            # --------------------------------------------------
            # Make sure the commit exists locally.
            # If it does not, try to fetch this exact commit.
            # --------------------------------------------------

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: $commit"
                echo "$commit | commit not found or cannot be fetched" >> /tmp/skipped.log
                continue
              fi
            fi

            echo "Commit found: $commit"

            # --------------------------------------------------
            # Save original commit message.
            # --------------------------------------------------

            git log -1 --format=%B "$commit" > /tmp/commit_message

            # --------------------------------------------------
            # Try to cherry-pick without creating a commit.
            #
            # IMPORTANT:
            # Because this command is inside "if", a conflict
            # does not terminate the GitHub Actions step.
            # --------------------------------------------------

            if git cherry-pick --no-commit "$commit"; then

              echo "Cherry-pick completed without conflicts."

              # ------------------------------------------------
              # Nothing changed.
              # This usually means the changes are already
              # present in the target branch.
              # ------------------------------------------------

              if git diff --cached --quiet && git diff --quiet; then
                echo "SKIPPED: $commit"
                echo "$commit | empty / changes already present" >> /tmp/skipped.log
                continue
              fi

              # Add only actual repository changes.
              git add -A

              # Create a new commit from the current user.
              if git commit \
                --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
                --file=/tmp/commit_message
              then

                echo "APPLIED: $commit"
                echo "$commit | applied" >> /tmp/applied.log

              else

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | failed to create commit" >> /tmp/skipped.log
              fi

              continue
            fi

            # --------------------------------------------------
            # Cherry-pick failed.
            # Git has left the repository in conflict state.
            # --------------------------------------------------

            echo "Conflict detected for $commit"

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            echo "Conflicted files:"
            echo "$CONFLICTED_FILES"

            NON_MD_CONFLICT=0
            MD_CONFLICT_FILES=""

            # --------------------------------------------------
            # Analyze every conflicted file.
            # --------------------------------------------------

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in

                *.md)
                  echo "Markdown conflict: $file"
                  echo "Keeping target branch version."

                  # Keep target branch version of .md.
                  git checkout --ours -- "$file"
                  git add -- "$file"

                  if [ -n "$MD_CONFLICT_FILES" ]; then
                    MD_CONFLICT_FILES="$MD_CONFLICT_FILES, $file"
                  else
                    MD_CONFLICT_FILES="$file"
                  fi
                  ;;

                *)
                  echo "Non-markdown conflict: $file"
                  NON_MD_CONFLICT=1
                  ;;

              esac
            done <<< "$CONFLICTED_FILES"

            # --------------------------------------------------
            # If at least one non-.md file has a conflict,
            # reject this entire commit.
            # --------------------------------------------------

            if [ "$NON_MD_CONFLICT" -eq 1 ]; then

              echo "Skipping $commit because of non-markdown conflict."

              git cherry-pick --abort

              REASON=$(echo "$CONFLICTED_FILES" | tr '\n' ',' | sed 's/,$//')

              echo "$commit | non-markdown conflict: $REASON" >> /tmp/skipped.log

              continue
            fi

            # --------------------------------------------------
            # Only .md files conflicted.
            #
            # The target branch version of those files has
            # already been restored above.
            #
            # All other changes from the original commit remain.
            # --------------------------------------------------

            echo "Only markdown conflicts detected."
            echo "Markdown changes will be excluded."

            git add -A

            # --------------------------------------------------
            # If nothing remains after removing .md changes,
            # there is nothing useful to commit.
            # --------------------------------------------------

            if git diff --cached --quiet; then

              echo "Nothing remains to commit."

              git cherry-pick --abort

              echo "$commit | only .md changes conflicted; nothing else to apply" >> /tmp/skipped.log

              continue
            fi

            # --------------------------------------------------
            # Create a NEW commit.
            # This commit is no longer the original commit.
            # Its author is the user who started the workflow.
            # --------------------------------------------------

            if git commit \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
              --file=/tmp/commit_message
            then

              echo "MODIFIED: $commit"

              echo "$commit | applied with .md conflicts excluded: $MD_CONFLICT_FILES" >> /tmp/modified.log

            else

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create modified commit" >> /tmp/skipped.log
            fi

          done

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"

      - name: Summary
        run: |
          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/applied.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/applied.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with modifications" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/modified.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/modified.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/skipped.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/skipped.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi
