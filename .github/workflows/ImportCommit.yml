name: Import selected commits

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by a space"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > /tmp/applied.log
          : > /tmp/modified.log
          : > /tmp/skipped.log

      - name: Import selected commits
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"

            # Make sure the commit exists locally.

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null || true

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: $commit"
                echo "$commit | commit not found or cannot be fetched" >> /tmp/skipped.log
                continue
              fi
            fi

            echo "Commit found: $commit"

            # Get original commit information.

            AUTHOR_NAME=$(git log -1 --format='%an' "$commit" 2>/dev/null || true)
            AUTHOR_EMAIL=$(git log -1 --format='%ae' "$commit" 2>/dev/null || true)
            AUTHOR_DATE=$(git log -1 --format='%aI' "$commit" 2>/dev/null || true)

            git log -1 --format=%B "$commit" > /tmp/commit_message

            # Fallback to github-actions[bot] if author cannot be determined.

            if [ -z "$AUTHOR_NAME" ] || [ -z "$AUTHOR_EMAIL" ]; then
              echo "Could not determine original author."
              echo "Using github-actions[bot] as author."

              AUTHOR_NAME="github-actions[bot]"
              AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
              AUTHOR_DATE=""
            fi

            echo "Author: $AUTHOR_NAME <$AUTHOR_EMAIL>"

            if [ -n "$AUTHOR_DATE" ]; then
              echo "Author date: $AUTHOR_DATE"
            else
              echo "Author date: current date"
            fi

            # Try to apply the commit without creating a commit.

            if git cherry-pick --no-commit "$commit"; then

              echo "Cherry-pick completed without conflicts."

              # Nothing changed.

              if git diff --cached --quiet && git diff --quiet; then
                echo "SKIPPED: $commit"
                echo "$commit | empty / changes already present" >> /tmp/skipped.log
                continue
              fi

              git add -A

              # Set original author.

              export GIT_AUTHOR_NAME="$AUTHOR_NAME"
              export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"

              if [ -n "$AUTHOR_DATE" ]; then
                export GIT_AUTHOR_DATE="$AUTHOR_DATE"
              else
                unset GIT_AUTHOR_DATE
              fi

              # Bot is always the committer.

              export GIT_COMMITTER_NAME="github-actions[bot]"
              export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

              if git commit --file=/tmp/commit_message; then

                NEW_SHA=$(git rev-parse HEAD)

                echo "APPLIED: $commit"
                echo "Created: $NEW_SHA"

                echo "$commit | applied | new: $NEW_SHA | author: $AUTHOR_NAME <$AUTHOR_EMAIL>" >> /tmp/applied.log

              else

                echo "SKIPPED: $commit"

                git reset --hard HEAD

                echo "$commit | failed to create commit" >> /tmp/skipped.log
              fi

              continue
            fi

            # Conflict detected.

            echo "Conflict detected for $commit"

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            echo "Conflicted files:"
            echo "$CONFLICTED_FILES"

            NON_MD_CONFLICT=0
            MD_CONFLICT_FILES=""

            # Analyze all conflicted files.

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in

                *.md)
                  echo "Markdown conflict: $file"
                  echo "Keeping target branch version."

                  git checkout --ours -- "$file"
                  git add -- "$file"

                  if [ -n "$MD_CONFLICT_FILES" ]; then
                    MD_CONFLICT_FILES="$MD_CONFLICT_FILES, $file"
                  else
                    MD_CONFLICT_FILES="$file"
                  fi
                  ;;

                *)
                  echo "Non-markdown conflict: $file"
                  NON_MD_CONFLICT=1
                  ;;

              esac

            done <<< "$CONFLICTED_FILES"

            # Non-markdown conflict.

            if [ "$NON_MD_CONFLICT" -eq 1 ]; then

              echo "Skipping $commit because of non-markdown conflict."

              git reset --hard HEAD

              REASON=$(echo "$CONFLICTED_FILES" | tr '\n' ',' | sed 's/,$//')

              echo "$commit | non-markdown conflict: $REASON" >> /tmp/skipped.log

              continue
            fi

            # Only markdown conflicts detected.

            echo "Only markdown conflicts detected."
            echo "Markdown changes will be excluded."

            git add -A

            # Check whether anything remains.

            if git diff --cached --quiet; then

              echo "Nothing remains to commit."

              git reset --hard HEAD

              echo "$commit | only .md changes conflicted; nothing else to apply" >> /tmp/skipped.log

              continue
            fi

            # Set original author.

            export GIT_AUTHOR_NAME="$AUTHOR_NAME"
            export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"

            if [ -n "$AUTHOR_DATE" ]; then
              export GIT_AUTHOR_DATE="$AUTHOR_DATE"
            else
              unset GIT_AUTHOR_DATE
            fi

            # Bot is always the committer.

            export GIT_COMMITTER_NAME="github-actions[bot]"
            export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

            # Create modified commit.

            if git commit --file=/tmp/commit_message; then

              NEW_SHA=$(git rev-parse HEAD)

              echo "MODIFIED: $commit"
              echo "Created: $NEW_SHA"

              echo "$commit | applied with .md conflicts excluded: $MD_CONFLICT_FILES | new: $NEW_SHA | author: $AUTHOR_NAME <$AUTHOR_EMAIL>" >> /tmp/modified.log

            else

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create modified commit" >> /tmp/skipped.log
            fi

          done

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"

      - name: Summary
        if: always()
        run: |
          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/applied.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/applied.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with modifications" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/modified.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/modified.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/skipped.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/skipped.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi
