name: Import selected commits

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository, example my-org/backend"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        default: "main"
        type: string

      target_branch:
        description: "Target branch"
        required: true
        type: string

      commits:
        description: "Commit SHA — separated by a space"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Add source repository
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git remote add source "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch source "$SOURCE_BRANCH" || true

      - name: Prepare logs
        run: |
          : > applied.log
          : > modified.log
          : > skipped.log

      - name: Import selected commits
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          for commit in $COMMITS; do

            echo ""
            echo "========================================"
            echo "Processing: $commit"
            echo "========================================"

            # --------------------------------------------------
            # Try to get the exact commit from source repository.
            # This also works if the commit is not in source_branch.
            # --------------------------------------------------

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "Commit is not available locally. Fetching..."

              git fetch source "$commit" 2>/dev/null

              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                echo "SKIPPED: $commit"
                echo "$commit | commit not found in source repository or cannot be fetched" >> skipped.log
                continue
              fi
            fi

            echo "Commit found: $commit"

            # Save original commit message.
            git log -1 --format=%B "$commit" > /tmp/commit_message

            # --------------------------------------------------
            # Try to apply commit without creating a commit.
            # --------------------------------------------------

            git cherry-pick --no-commit "$commit"

            PICK_RESULT=$?

            # --------------------------------------------------
            # Case 1: clean cherry-pick
            # --------------------------------------------------

            if [ $PICK_RESULT -eq 0 ]; then

              if git diff --cached --quiet && git diff --quiet; then
                echo "SKIPPED: $commit"
                echo "$commit | empty / changes already present" >> skipped.log
                continue
              fi

              git add -A

              git commit \
                --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
                --file=/tmp/commit_message

              if [ $? -eq 0 ]; then
                echo "APPLIED: $commit"
                echo "$commit | applied" >> applied.log
              else
                echo "SKIPPED: $commit"
                echo "$commit | failed to create commit" >> skipped.log
                git reset --hard HEAD
              fi

              continue
            fi

            # --------------------------------------------------
            # Case 2: conflict
            # --------------------------------------------------

            echo "Conflict detected for $commit"

            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            echo "Conflicted files:"
            echo "$CONFLICTED_FILES"

            NON_MD_CONFLICT=0
            MD_CONFLICT_FILES=""

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in

                *.md)
                  echo "Markdown conflict: $file"
                  echo "Keeping target branch version."

                  git checkout --ours -- "$file"
                  git add -- "$file"

                  MD_CONFLICT_FILES="$MD_CONFLICT_FILES $file"
                  ;;

                *)
                  echo "Non-markdown conflict: $file"
                  NON_MD_CONFLICT=1
                  ;;

              esac
            done <<< "$CONFLICTED_FILES"

            # --------------------------------------------------
            # Case 2a:
            # At least one non-.md file has a conflict.
            # Reject the whole commit.
            # --------------------------------------------------

            if [ "$NON_MD_CONFLICT" -eq 1 ]; then

              echo "Skipping $commit because of non-markdown conflict."

              git cherry-pick --abort

              REASON=$(echo "$CONFLICTED_FILES" | tr '\n' ',' | sed 's/,$//')

              echo "$commit | non-markdown conflict: $REASON" >> skipped.log

              continue
            fi

            # --------------------------------------------------
            # Case 2b:
            # Only .md files conflicted.
            # Keep target versions of all .md files.
            # Apply everything else.
            # --------------------------------------------------

            echo "Only markdown conflicts detected."
            echo "Markdown changes will be excluded."

            git add -A

            if git diff --cached --quiet; then

              git cherry-pick --abort

              echo "SKIPPED: $commit"
              echo "$commit | only .md changes conflicted; nothing else to apply" >> skipped.log

              continue
            fi

            git commit \
              --author="${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" \
              --file=/tmp/commit_message

            if [ $? -eq 0 ]; then

              echo "MODIFIED: $commit"
              echo "$commit | applied with .md conflicts excluded:$MD_CONFLICT_FILES" >> modified.log

            else

              echo "SKIPPED: $commit"

              git reset --hard HEAD

              echo "$commit | failed to create modified commit" >> skipped.log

            fi

          done

      - name: Push
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push origin "$TARGET_BRANCH"

      - name: Summary
        run: |
          echo "# Cherry-pick result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied" >> "$GITHUB_STEP_SUMMARY"

          if [ -s applied.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < applied.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Applied with modifications" >> "$GITHUB_STEP_SUMMARY"

          if [ -s modified.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < modified.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"

          if [ -s skipped.log ]; then
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < skipped.log
          else
            echo "None" >> "$GITHUB_STEP_SUMMARY"
          fi
