name: Build Code Patches

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch or commit (used by Reverse mode)"
        required: true
        default: "main"
        type: string

      commits:
        description: "Commit SHA list separated by spaces"
        required: true
        type: string

      reverse:
        description: "Exclude selected commits instead of including them"
        required: true
        default: false
        type: boolean

      author_mode:
        description: "Author information"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - none
          - custom

      custom_author:
        description: 'Custom author, e.g. "John Doe <john@example.com>"'
        required: false
        default: ""
        type: string

      include_message:
        description: "Include commit message"
        required: true
        default: true
        type: boolean

      context:
        description: "Number of context lines around changes"
        required: true
        default: "3"
        type: string

jobs:
  build-patches:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # Initial shallow checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      # ============================================================
      # Prepare required Git history
      # ============================================================

      - name: Prepare Git history
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configuration"
          echo "========================================"
          echo "BASE:    $BASE"
          echo "REVERSE: $REVERSE"
          echo "COMMITS: $COMMITS"
          echo

          # --------------------------------------------------------
          # Normal mode:
          #
          # Only selected commits are required.
          # We fetch each commit with its parent.
          # --------------------------------------------------------

          if [[ "$REVERSE" != "true" ]]; then

            echo "Mode: INCLUDE"
            echo "Fetching selected commits..."

            for commit in $COMMITS; do

              echo
              echo "Fetching: $commit"

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                echo "Already available."
                continue
              fi

              # Parent is required because the patch is:
              #
              #     commit^ -> commit
              #
              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null

              echo "Available:"
              git rev-parse "${commit}^{commit}"
            done

          # --------------------------------------------------------
          # Reverse mode:
          #
          # We need BASE..HEAD.
          # History is deepened gradually.
          # --------------------------------------------------------

          else

            echo "Mode: EXCLUDE"
            echo

            # ------------------------------------------------------
            # Resolve BASE.
            # ------------------------------------------------------

            if git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then

              BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

            elif git ls-remote --exit-code \
                --heads origin "$BASE" >/dev/null 2>&1; then

              echo "Fetching base branch: $BASE"

              git fetch \
                --no-tags \
                --depth=1 \
                origin \
                "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

              BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE}")"

            else

              echo "Fetching base commit: $BASE"

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$BASE"

              BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

            fi

            echo "BASE SHA: $BASE_SHA"

            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

            # ------------------------------------------------------
            # Current HEAD.
            # ------------------------------------------------------

            HEAD_SHA="$(git rev-parse HEAD)"

            echo "HEAD SHA: $HEAD_SHA"

            echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

            # ------------------------------------------------------
            # Gradually deepen repository until BASE is reachable.
            #
            # 100 -> 200 -> 400 -> 800 -> ...
            # ------------------------------------------------------

            DEPTH=100
            MAX_DEPTH=100000

            while ! git merge-base \
                --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; do

              echo
              echo "BASE is not reachable."
              echo "Deepening history by $DEPTH commits..."

              git fetch \
                --no-tags \
                --deepen="$DEPTH" \
                origin

              DEPTH=$((DEPTH * 2))

              if [[ "$DEPTH" -gt "$MAX_DEPTH" ]]; then
                echo "::error::Unable to find BASE in repository history."
                echo "::error::BASE: $BASE_SHA"
                echo "::error::HEAD: $HEAD_SHA"
                exit 1
              fi
            done

            echo
            echo "BASE is reachable."

            # ------------------------------------------------------
            # Make sure explicitly excluded commits are available.
            # ------------------------------------------------------

            for commit in $COMMITS; do

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                continue
              fi

              echo
              echo "Fetching excluded commit: $commit"

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null
            done
          fi

      # ============================================================
      # Generate patches
      # ============================================================

      - name: Generate patches
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
          AUTHOR_MODE: ${{ inputs.author_mode }}
          CUSTOM_AUTHOR: ${{ inputs.custom_author }}
          INCLUDE_MESSAGE: ${{ inputs.include_message }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail

          PATCH_DIR="patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          # ========================================================
          # Validate context
          # ========================================================

          if ! [[ "$CONTEXT" =~ ^[0-9]+$ ]]; then
            echo "::error::Context must be a non-negative integer."
            exit 1
          fi

          echo "Context lines: $CONTEXT"

          # ========================================================
          # Build commit list
          # ========================================================

          if [[ "$REVERSE" == "true" ]]; then

            echo
            echo "Building reverse commit list..."

            mapfile -t ALL_COMMITS < <(
              git rev-list \
                --reverse \
                "${BASE_SHA}..${HEAD_SHA}"
            )

            echo "Commits in BASE..HEAD: ${#ALL_COMMITS[@]}"

            # ------------------------------------------------------
            # Exclusion map
            # ------------------------------------------------------

            declare -A EXCLUDED=()

            for commit in $COMMITS; do

              SHA="$(git rev-parse "${commit}^{commit}")"

              EXCLUDED["$SHA"]=1

              echo "Exclude: $SHA"
            done

            # ------------------------------------------------------
            # Remove excluded commits
            # ------------------------------------------------------

            SELECTED_COMMITS=()

            for commit in "${ALL_COMMITS[@]}"; do

              if [[ -n "${EXCLUDED[$commit]+x}" ]]; then
                echo "EXCLUDED: $commit"
              else
                SELECTED_COMMITS+=("$commit")
              fi

            done

          else

            echo
            echo "Using explicitly selected commits."

            read -ra SELECTED_COMMITS <<< "$COMMITS"

          fi

          # ========================================================
          # Validate commit list
          # ========================================================

          if [[ ${#SELECTED_COMMITS[@]} -eq 0 ]]; then
            echo "::error::No commits selected."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Commits to process"
          echo "========================================"

          printf '  %s\n' "${SELECTED_COMMITS[@]}"

          # ========================================================
          # Metadata
          # ========================================================

          {
            echo "base=$BASE"
            echo "reverse=$REVERSE"
            echo "author_mode=$AUTHOR_MODE"
            echo "include_message=$INCLUDE_MESSAGE"
            echo "context=$CONTEXT"
            echo
            echo "commits:"
            printf '%s\n' "${SELECTED_COMMITS[@]}"
          } > "$PATCH_DIR/metadata.txt"

          # ========================================================
          # Generate one patch per commit
          # ========================================================

          NUMBER=1

          for commit in "${SELECTED_COMMITS[@]}"; do

            SHA="$(git rev-parse "${commit}^{commit}")"

            SUBJECT="$(
              git log \
                -1 \
                --format='%s' \
                "$SHA"
            )"

            MESSAGE="$(
              git log \
                -1 \
                --format='%b' \
                "$SHA"
            )"

            AUTHOR_NAME="$(
              git log \
                -1 \
                --format='%an' \
                "$SHA"
            )"

            AUTHOR_EMAIL="$(
              git log \
                -1 \
                --format='%ae' \
                "$SHA"
            )"

            ORIGINAL_AUTHOR="${AUTHOR_NAME} <${AUTHOR_EMAIL}>"

            # ------------------------------------------------------
            # Safe filename
            # ------------------------------------------------------

            SAFE_SUBJECT="$(
              printf '%s' "$SUBJECT" |
                tr '[:upper:]' '[:lower:]' |
                sed \
                  -e 's/[^a-z0-9._-]/-/g' \
                  -e 's/-\{2,\}/-/g' \
                  -e 's/^-//' \
                  -e 's/-$//'
            )"

            SAFE_SUBJECT="${SAFE_SUBJECT:0:80}"

            if [[ -z "$SAFE_SUBJECT" ]]; then
              SAFE_SUBJECT="patch"
            fi

            PATCH_FILE="$PATCH_DIR/$(printf '%04d' "$NUMBER")-${SAFE_SUBJECT}.patch"

            echo
            echo "========================================"
            echo "Patch #$NUMBER"
            echo "========================================"
            echo "Commit:  $SHA"
            echo "Subject: $SUBJECT"
            echo "Output:  $PATCH_FILE"

            # ======================================================
            # Build patch header
            # ======================================================

            {
              # ----------------------------------------------------
              # Author
              # ----------------------------------------------------

              case "$AUTHOR_MODE" in

                original)
                  printf 'Author: %s\n' "$ORIGINAL_AUTHOR"
                  ;;

                custom)
                  if [[ -z "$CUSTOM_AUTHOR" ]]; then
                    echo "::error::Custom author was selected but custom_author is empty."
                    exit 1
                  fi

                  printf 'Author: %s\n' "$CUSTOM_AUTHOR"
                  ;;

                none)
                  ;;

                *)
                  echo "::error::Unknown author mode: $AUTHOR_MODE"
                  exit 1
                  ;;
              esac

              # ----------------------------------------------------
              # Commit message
              # ----------------------------------------------------

              if [[ "$INCLUDE_MESSAGE" == "true" ]]; then

                if [[ "$AUTHOR_MODE" != "none" ]]; then
                  echo
                fi

                printf '%s\n' "$SUBJECT"

                if [[ -n "$MESSAGE" ]]; then
                  echo
                  printf '%s\n' "$MESSAGE"
                fi
              fi

              # ----------------------------------------------------
              # Separator
              # ----------------------------------------------------

              echo
              echo "---"

              # ----------------------------------------------------
              # Actual code changes.
              #
              # IMPORTANT:
              #
              # We compare:
              #
              #     commit^ -> commit
              #
              # This produces ONLY the changes introduced by this
              # particular commit.
              #
              # No cherry-pick is performed.
              # ----------------------------------------------------

              git diff \
                --no-ext-diff \
                --no-color \
                --patch \
                --binary=false \
                "-U${CONTEXT}" \
                "${SHA}^" \
                "$SHA"

            } > "$PATCH_FILE"

            # ======================================================
            # Verify patch
            # ======================================================

            if [[ ! -s "$PATCH_FILE" ]]; then
              echo "::error::Generated patch is empty."
              echo "::error::Commit: $SHA"
              rm -f "$PATCH_FILE"
              exit 1
            fi

            echo
            echo "Created:"
            ls -lh "$PATCH_FILE"

            NUMBER=$((NUMBER + 1))
          done

          # ========================================================
          # Summary
          # ========================================================

          echo
          echo "========================================"
          echo "Generated patches"
          echo "========================================"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "Total patches:"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.patch' |
            wc -l

          echo
          echo "Total size:"

          du -sh "$PATCH_DIR"

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload patches
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: patches/
          if-no-files-found: error
          retention-days: 30
