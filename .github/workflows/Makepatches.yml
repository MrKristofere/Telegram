name: Make Code Patches

on:
  workflow_dispatch:
    inputs:

      base:
        description: "Base branch or commit (used in Reverse mode)"
        required: true
        default: "main"
        type: string

      commits:
        description: "Commit SHA list separated by spaces"
        required: true
        type: string

      reverse:
        description: "Exclude selected commits instead of including them"
        required: true
        default: false
        type: boolean

      author_mode:
        description: "Author information"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - none
          - custom

      custom_author:
        description: 'Custom author, e.g. "John Doe <john@example.com>"'
        required: false
        default: ""
        type: string

      include_message:
        description: "Include commit message"
        required: true
        default: true
        type: boolean

      context:
        description: "Number of context lines around changes"
        required: true
        default: "3"
        type: string

      function_context:
        description: "Use whole function as context instead of fixed line count"
        required: true
        default: false
        type: boolean


jobs:

  build-patches:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false


      # ============================================================
      # SHOW CONFIGURATION
      # ============================================================

      - name: Show configuration
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
          AUTHOR_MODE: ${{ inputs.author_mode }}
          CUSTOM_AUTHOR: ${{ inputs.custom_author }}
          INCLUDE_MESSAGE: ${{ inputs.include_message }}
          CONTEXT: ${{ inputs.context }}
          FUNCTION_CONTEXT: ${{ inputs.function_context }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configuration"
          echo "========================================"
          echo "BASE:             $BASE"
          echo "REVERSE:          $REVERSE"
          echo "AUTHOR_MODE:      $AUTHOR_MODE"
          echo "CUSTOM_AUTHOR:    $CUSTOM_AUTHOR"
          echo "INCLUDE_MESSAGE:  $INCLUDE_MESSAGE"
          echo "CONTEXT:          $CONTEXT"
          echo "FUNCTION_CONTEXT: $FUNCTION_CONTEXT"
          echo
          echo "COMMITS:"
          for commit in $COMMITS; do
            echo "  $commit"
          done


      # ============================================================
      # PREPARE HISTORY
      # ============================================================

      - name: Prepare Git history
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Helper:
          #
          # Make sure a commit AND its first parent are available.
          #
          # We need:
          #
          #     COMMIT^
          #        |
          #        v
          #     COMMIT
          #
          # because the patch is generated from that diff.
          # --------------------------------------------------------

          ensure_commit_with_parent() {

            local SHA="$1"

            echo
            echo "----------------------------------------"
            echo "Preparing commit:"
            echo "$SHA"
            echo "----------------------------------------"

            # ------------------------------------------------------
            # Validate SHA format.
            # ------------------------------------------------------

            if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid commit SHA: $SHA"
              exit 1
            fi

            # ------------------------------------------------------
            # Fetch commit if it doesn't exist.
            # ------------------------------------------------------

            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then

              echo "Commit is not available."
              echo "Fetching commit..."

              git fetch \
                --no-tags \
                --depth=1 \
                origin \
                "$SHA"
            fi

            # ------------------------------------------------------
            # Verify commit.
            # ------------------------------------------------------

            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Unable to fetch commit: $SHA"
              exit 1
            fi

            # ------------------------------------------------------
            # Merge commits are not supported as independent
            # patches by this workflow.
            #
            # COMMIT^ means first parent.
            # ------------------------------------------------------

            PARENT=""

            if git rev-parse --verify "${SHA}^" >/dev/null 2>&1; then

              PARENT="$(git rev-parse "${SHA}^")"

            else

              echo "Parent is not available."
              echo "Deepening history..."

              DEPTH=2
              MAX_DEPTH=100000

              while ! git rev-parse --verify "${SHA}^" >/dev/null 2>&1; do

                echo
                echo "Deepening by $DEPTH commits..."

                git fetch \
                  --no-tags \
                  --deepen="$DEPTH" \
                  origin

                DEPTH=$((DEPTH * 2))

                if [[ "$DEPTH" -gt "$MAX_DEPTH" ]]; then
                  echo "::error::Unable to find parent of $SHA"
                  exit 1
                fi
              done

              PARENT="$(git rev-parse "${SHA}^")"
            fi

            # ------------------------------------------------------
            # Final verification.
            # ------------------------------------------------------

            git cat-file -e "${SHA}^{commit}"
            git cat-file -e "${PARENT}^{commit}"

            echo
            echo "Commit: $SHA"
            echo "Parent: $PARENT"
          }


          # ========================================================
          # NORMAL MODE
          # ========================================================

          if [[ "$REVERSE" != "true" ]]; then

            echo
            echo "========================================"
            echo "Mode: INCLUDE"
            echo "========================================"

            for commit in $COMMITS; do
              ensure_commit_with_parent "$commit"
            done

          fi


          # ========================================================
          # REVERSE MODE
          # ========================================================

          if [[ "$REVERSE" == "true" ]]; then

            echo
            echo "========================================"
            echo "Mode: EXCLUDE"
            echo "========================================"

            # ------------------------------------------------------
            # Resolve BASE.
            # ------------------------------------------------------

            BASE_SHA=""

            # First try local revision.

            if git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then

              BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

            else

              # ----------------------------------------------------
              # Try remote branch.
              # ----------------------------------------------------

              if git ls-remote \
                  --exit-code \
                  --heads \
                  origin \
                  "$BASE" >/dev/null 2>&1; then

                echo "Fetching base branch: $BASE"

                git fetch \
                  --no-tags \
                  --depth=1 \
                  origin \
                  "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

                BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE}")"

              else

                # --------------------------------------------------
                # Try commit SHA.
                # --------------------------------------------------

                echo "Fetching base commit: $BASE"

                git fetch \
                  --no-tags \
                  --depth=1 \
                  origin \
                  "$BASE"

                BASE_SHA="$(git rev-parse "${BASE}^{commit}")"
              fi
            fi

            echo
            echo "BASE SHA: $BASE_SHA"

            # ------------------------------------------------------
            # Current HEAD.
            # ------------------------------------------------------

            HEAD_SHA="$(git rev-parse HEAD)"

            echo "HEAD SHA: $HEAD_SHA"

            # ------------------------------------------------------
            # Make BASE reachable from HEAD.
            #
            # This is the only place where the entire branch history
            # may need to be progressively deepened.
            # ------------------------------------------------------

            DEPTH=100
            MAX_DEPTH=100000

            while ! git merge-base \
                --is-ancestor \
                "$BASE_SHA" \
                "$HEAD_SHA" \
                2>/dev/null; do

              echo
              echo "BASE is not reachable from HEAD."
              echo "Deepening history by $DEPTH commits..."

              git fetch \
                --no-tags \
                --deepen="$DEPTH" \
                origin

              DEPTH=$((DEPTH * 2))

              if [[ "$DEPTH" -gt "$MAX_DEPTH" ]]; then
                echo "::error::Unable to reach BASE from HEAD."
                echo "::error::BASE: $BASE_SHA"
                echo "::error::HEAD: $HEAD_SHA"
                exit 1
              fi
            done

            echo
            echo "BASE is reachable."

            # ------------------------------------------------------
            # The selected commits are exclusions.
            # They themselves also need to be available.
            # ------------------------------------------------------

            for commit in $COMMITS; do
              ensure_commit_with_parent "$commit"
            done

            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
            echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          fi


      # ============================================================
      # GENERATE PATCHES
      # ============================================================

      - name: Generate patches
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
          AUTHOR_MODE: ${{ inputs.author_mode }}
          CUSTOM_AUTHOR: ${{ inputs.custom_author }}
          INCLUDE_MESSAGE: ${{ inputs.include_message }}
          CONTEXT: ${{ inputs.context }}
          FUNCTION_CONTEXT: ${{ inputs.function_context }}
        run: |
          set -euo pipefail

          PATCH_DIR="patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"


          # ========================================================
          # VALIDATE OPTIONS
          # ========================================================

          if ! [[ "$CONTEXT" =~ ^[0-9]+$ ]]; then
            echo "::error::CONTEXT must be a non-negative integer."
            exit 1
          fi

          if [[ "$AUTHOR_MODE" == "custom" && -z "$CUSTOM_AUTHOR" ]]; then
            echo "::error::Custom author mode selected but CUSTOM_AUTHOR is empty."
            exit 1
          fi


          # ========================================================
          # BUILD COMMIT LIST
          # ========================================================

          SELECTED_COMMITS=()


          # --------------------------------------------------------
          # INCLUDE MODE
          # --------------------------------------------------------

          if [[ "$REVERSE" != "true" ]]; then

            read -ra SELECTED_COMMITS <<< "$COMMITS"

          fi


          # --------------------------------------------------------
          # REVERSE / EXCLUDE MODE
          # --------------------------------------------------------

          if [[ "$REVERSE" == "true" ]]; then

            echo
            echo "Building BASE..HEAD commit list..."

            mapfile -t ALL_COMMITS < <(
              git rev-list \
                --reverse \
                "${BASE_SHA}..${HEAD_SHA}"
            )

            echo "Total commits in range: ${#ALL_COMMITS[@]}"

            # ------------------------------------------------------
            # Build exclusion map.
            # ------------------------------------------------------

            declare -A EXCLUDED=()

            for commit in $COMMITS; do

              SHA="$(git rev-parse "${commit}^{commit}")"

              EXCLUDED["$SHA"]=1

              echo "Excluding: $SHA"
            done

            # ------------------------------------------------------
            # Select everything except excluded commits.
            # ------------------------------------------------------

            for commit in "${ALL_COMMITS[@]}"; do

              if [[ -n "${EXCLUDED[$commit]+x}" ]]; then

                echo "EXCLUDED: $commit"

              else

                SELECTED_COMMITS+=("$commit")

              fi
            done

          fi


          # ========================================================
          # CHECK RESULT
          # ========================================================

          if [[ ${#SELECTED_COMMITS[@]} -eq 0 ]]; then
            echo "::error::No commits selected."
            exit 1
          fi


          echo
          echo "========================================"
          echo "Commits to process"
          echo "========================================"

          printf '  %s\n' "${SELECTED_COMMITS[@]}"


          # ========================================================
          # SAVE METADATA
          # ========================================================

          {
            echo "base=$BASE"
            echo "reverse=$REVERSE"
            echo "author_mode=$AUTHOR_MODE"
            echo "include_message=$INCLUDE_MESSAGE"
            echo "context=$CONTEXT"
            echo "function_context=$FUNCTION_CONTEXT"
            echo
            echo "commits:"
            printf '%s\n' "${SELECTED_COMMITS[@]}"
          } > "$PATCH_DIR/metadata.txt"


          # ========================================================
          # GENERATE ONE PATCH PER COMMIT
          # ========================================================

          NUMBER=1


          for SHA_INPUT in "${SELECTED_COMMITS[@]}"; do

            SHA="$(git rev-parse "${SHA_INPUT}^{commit}")"

            # ------------------------------------------------------
            # Parent MUST exist.
            # ------------------------------------------------------

            if ! PARENT="$(git rev-parse "${SHA}^" 2>/dev/null)"; then

              echo "::error::Parent is unavailable for $SHA"
              exit 1

            fi


            # ------------------------------------------------------
            # Commit information.
            # ------------------------------------------------------

            SUBJECT="$(
              git log \
                -1 \
                --format='%s' \
                "$SHA"
            )"

            MESSAGE="$(
              git log \
                -1 \
                --format='%b' \
                "$SHA"
            )"

            AUTHOR_NAME="$(
              git log \
                -1 \
                --format='%an' \
                "$SHA"
            )"

            AUTHOR_EMAIL="$(
              git log \
                -1 \
                --format='%ae' \
                "$SHA"
            )"

            ORIGINAL_AUTHOR="${AUTHOR_NAME} <${AUTHOR_EMAIL}>"


            # ------------------------------------------------------
            # Check for merge commit.
            # ------------------------------------------------------

            PARENT_COUNT="$(
              git rev-list \
                --parents \
                -n 1 \
                "$SHA" |
                awk '{print NF-1}'
            )"

            if [[ "$PARENT_COUNT" -gt 1 ]]; then
              echo "::error::Commit $SHA is a merge commit."
              echo "::error::Independent patch generation is not supported for merge commits."
              exit 1
            fi


            # ------------------------------------------------------
            # Filename.
            # ------------------------------------------------------

            SAFE_SUBJECT="$(
              printf '%s' "$SUBJECT" |
                tr '[:upper:]' '[:lower:]' |
                sed \
                  -e 's/[^a-z0-9._-]/-/g' \
                  -e 's/-\{2,\}/-/g' \
                  -e 's/^-//' \
                  -e 's/-$//'
            )"

            SAFE_SUBJECT="${SAFE_SUBJECT:0:80}"

            if [[ -z "$SAFE_SUBJECT" ]]; then
              SAFE_SUBJECT="patch"
            fi

            PATCH_FILE="$PATCH_DIR/$(printf '%04d' "$NUMBER")-${SAFE_SUBJECT}.patch"


            echo
            echo "========================================"
            echo "Patch #$NUMBER"
            echo "========================================"
            echo "Commit:  $SHA"
            echo "Parent:  $PARENT"
            echo "Subject: $SUBJECT"
            echo "Output:  $PATCH_FILE"


            # ======================================================
            # PATCH HEADER
            # ======================================================

            {

              # ----------------------------------------------------
              # Author
              # ----------------------------------------------------

              case "$AUTHOR_MODE" in

                original)

                  printf 'Author: %s\n' "$ORIGINAL_AUTHOR"

                  ;;

                custom)

                  printf 'Author: %s\n' "$CUSTOM_AUTHOR"

                  ;;

                none)

                  ;;

                *)

                  echo "::error::Invalid AUTHOR_MODE: $AUTHOR_MODE"
                  exit 1

                  ;;
              esac


              # ----------------------------------------------------
              # Commit message
              # ----------------------------------------------------

              if [[ "$INCLUDE_MESSAGE" == "true" ]]; then

                # Add a blank line before the message if anything
                # precedes it.

                if [[ "$AUTHOR_MODE" != "none" ]]; then
                  echo
                fi

                printf '%s\n' "$SUBJECT"

                if [[ -n "$MESSAGE" ]]; then
                  echo
                  printf '%s\n' "$MESSAGE"
                fi

              fi


              # ----------------------------------------------------
              # Separator
              # ----------------------------------------------------

              echo
              echo "---"


              # ====================================================
              # ACTUAL CODE PATCH
              # ====================================================

              if [[ "$FUNCTION_CONTEXT" == "true" ]]; then

                git diff \
                  --no-ext-diff \
                  --no-color \
                  --patch \
                  --function-context \
                  "$PARENT" \
                  "$SHA"

              else

                git diff \
                  --no-ext-diff \
                  --no-color \
                  --patch \
                  "-U${CONTEXT}" \
                  "$PARENT" \
                  "$SHA"

              fi

            } > "$PATCH_FILE"


            # ======================================================
            # VALIDATE OUTPUT
            # ======================================================

            if [[ ! -s "$PATCH_FILE" ]]; then

              echo "::warning::Patch is empty: $SHA"

              rm -f "$PATCH_FILE"

            else

              echo
              echo "Created:"
              ls -lh "$PATCH_FILE"

            fi


            NUMBER=$((NUMBER + 1))

          done


          # ========================================================
          # FINAL SUMMARY
          # ========================================================

          echo
          echo "========================================"
          echo "Generated patches"
          echo "========================================"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          echo
          echo "Patch count:"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.patch' |
            wc -l


          echo
          echo "Total size:"

          du -sh "$PATCH_DIR"


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload patches
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: patches/
          if-no-files-found: error
          retention-days: 30
