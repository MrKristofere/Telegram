name: Make patches

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch or commit. Used as range start in reverse mode."
        required: true
        default: "main"
        type: string

      commits:
        description: "Commit SHA list, separated by spaces"
        required: true
        type: string

      reverse:
        description: "Exclude selected commits instead of including them"
        required: true
        default: false
        type: boolean

jobs:
  build-patches:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # Initial shallow checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      # ============================================================
      # Prepare Git objects
      # ============================================================
      - name: Prepare Git history
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Configuration"
          echo "========================================"
          echo "BASE:    $BASE"
          echo "REVERSE: $REVERSE"
          echo "COMMITS: $COMMITS"
          echo

          # --------------------------------------------------------
          # NORMAL MODE
          #
          # We don't need BASE at all.
          # Fetch only the requested commits.
          # --------------------------------------------------------

          if [[ "$REVERSE" != "true" ]]; then

            echo "Mode: INCLUDE"
            echo "Fetching selected commits..."

            for commit in $COMMITS; do

              echo
              echo "Fetching: $commit"

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                echo "Already available."
                continue
              fi

              # Fetch the commit and its parent.
              #
              # The parent is required because format-patch creates
              # the patch from parent -> commit.
              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null

              echo "Available:"
              git rev-parse "${commit}^{commit}"
            done

          # --------------------------------------------------------
          # REVERSE MODE
          #
          # We need all commits in:
          #
          #     BASE..HEAD
          #
          # and then remove the explicitly specified commits.
          # --------------------------------------------------------

          else

            echo "Mode: EXCLUDE"
            echo
            echo "Preparing history from BASE to HEAD..."

            # Resolve BASE.
            if git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then

              BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

            elif git ls-remote --exit-code \
                --heads origin "$BASE" >/dev/null 2>&1; then

              echo "Fetching base branch: $BASE"

              git fetch \
                --no-tags \
                --depth=1 \
                origin \
                "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

              BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE}")"

            else

              echo "Fetching base commit: $BASE"

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$BASE"

              BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

            fi

            echo "BASE SHA: $BASE_SHA"

            HEAD_SHA="$(git rev-parse HEAD)"

            echo "HEAD SHA: $HEAD_SHA"

            # ------------------------------------------------------
            # Gradually deepen the current branch until BASE becomes
            # reachable.
            # ------------------------------------------------------

            DEPTH=100
            MAX_DEPTH=100000

            while ! git merge-base \
                --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; do

              echo
              echo "BASE is not reachable."
              echo "Deepening history by $DEPTH commits..."

              git fetch \
                --no-tags \
                --deepen="$DEPTH" \
                origin

              DEPTH=$((DEPTH * 2))

              if [[ "$DEPTH" -gt "$MAX_DEPTH" ]]; then
                echo "::error::Unable to find BASE in current history."
                echo "::error::BASE: $BASE_SHA"
                echo "::error::HEAD: $HEAD_SHA"
                exit 1
              fi
            done

            echo
            echo "BASE is reachable."

            # ------------------------------------------------------
            # Fetch excluded commits that aren't already present.
            # ------------------------------------------------------

            for commit in $COMMITS; do

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                continue
              fi

              echo
              echo "Fetching excluded commit: $commit"

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null
            done

            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # Generate independent patches
      # ============================================================
      - name: Generate independent patches
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          PATCH_DIR="patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          # ========================================================
          # Determine commit list
          # ========================================================

          if [[ "$REVERSE" == "true" ]]; then

            echo "Building reverse commit list..."

            HEAD_SHA="$(git rev-parse HEAD)"

            # Get commits in chronological order.
            mapfile -t ALL_COMMITS < <(
              git rev-list \
                --reverse \
                "${BASE_SHA}..${HEAD_SHA}"
            )

            echo
            echo "Total commits in range: ${#ALL_COMMITS[@]}"

            # ------------------------------------------------------
            # Build exclusion map.
            # ------------------------------------------------------

            declare -A EXCLUDED=()

            for commit in $COMMITS; do

              SHA="$(git rev-parse "${commit}^{commit}")"

              EXCLUDED["$SHA"]=1

              echo "Exclude: $SHA"
            done

            # ------------------------------------------------------
            # Filter commits.
            # ------------------------------------------------------

            SELECTED_COMMITS=()

            for commit in "${ALL_COMMITS[@]}"; do

              if [[ -n "${EXCLUDED[$commit]+x}" ]]; then
                echo "EXCLUDED: $commit"
              else
                SELECTED_COMMITS+=("$commit")
              fi

            done

          else

            echo "Using explicitly selected commits."

            read -ra SELECTED_COMMITS <<< "$COMMITS"

          fi

          # ========================================================
          # Validate
          # ========================================================

          if [[ ${#SELECTED_COMMITS[@]} -eq 0 ]]; then
            echo "::error::No commits selected."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Commits to convert into patches"
          echo "========================================"

          printf '  %s\n' "${SELECTED_COMMITS[@]}"

          # ========================================================
          # Metadata
          # ========================================================

          {
            echo "base=$BASE"
            echo "reverse=$REVERSE"
            echo
            echo "commits:"
            printf '%s\n' "${SELECTED_COMMITS[@]}"
          } > "$PATCH_DIR/metadata.txt"

          # ========================================================
          # Generate patches
          # ========================================================

          NUMBER=1

          for commit in "${SELECTED_COMMITS[@]}"; do

            SHA="$(git rev-parse "${commit}^{commit}")"

            SUBJECT="$(
              git log \
                -1 \
                --format='%s' \
                "$SHA"
            )"

            # ------------------------------------------------------
            # Generate a filesystem-safe filename.
            # ------------------------------------------------------

            SAFE_SUBJECT="$(
              printf '%s' "$SUBJECT" |
                tr '[:upper:]' '[:lower:]' |
                sed \
                  -e 's/[^a-z0-9._-]/-/g' \
                  -e 's/-\{2,\}/-/g' \
                  -e 's/^-//' \
                  -e 's/-$//'
            )"

            # Keep filenames reasonably short.
            SAFE_SUBJECT="${SAFE_SUBJECT:0:80}"

            PATCH_FILE="$PATCH_DIR/$(printf '%04d' "$NUMBER")-${SAFE_SUBJECT}.patch"

            echo
            echo "========================================"
            echo "Patch #$NUMBER"
            echo "========================================"
            echo "Commit:  $SHA"
            echo "Subject: $SUBJECT"
            echo "Output:  $PATCH_FILE"

            # ------------------------------------------------------
            # Generate exactly ONE patch for exactly ONE commit.
            #
            # format-patch compares the commit with its parent.
            #
            # No cherry-pick is performed.
            # No merge is performed.
            # BASE is not used here.
            # ------------------------------------------------------

            git format-patch \
              -1 \
              --binary \
              --full-index \
              --no-stat \
              --no-numbered \
              --output="$PATCH_FILE" \
              "$SHA"

            # ------------------------------------------------------
            # Verify output.
            # ------------------------------------------------------

            if [[ ! -s "$PATCH_FILE" ]]; then
              echo "::error::Patch was not generated: $PATCH_FILE"
              exit 1
            fi

            echo "Created:"
            ls -lh "$PATCH_FILE"

            NUMBER=$((NUMBER + 1))
          done

          # ========================================================
          # Summary
          # ========================================================

          echo
          echo "========================================"
          echo "Generated patches"
          echo "========================================"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "Patch count:"
          find "$PATCH_DIR" \
            -maxdepth 1 \
            -name '*.patch' \
            -type f \
            | wc -l

      # ============================================================
      # Upload patches
      # ============================================================
      - name: Upload patches
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: patches/
          if-no-files-found: error
          retention-days: 30
