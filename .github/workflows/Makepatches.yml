name: Build patches

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch or commit"
        required: true
        default: "main"
        type: string

      commits:
        description: "Commits to include/exclude, separated by spaces"
        required: true
        type: string

      reverse:
        description: "Exclude selected commits instead of including them"
        required: true
        default: false
        type: boolean

jobs:
  build-patches:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      # ------------------------------------------------------------
      # Fetch selected commits.
      #
      # We don't cherry-pick them.
      # We only need the commit objects and their parents so that
      # git format-patch can generate independent patches.
      # ------------------------------------------------------------
      - name: Fetch selected commits
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          echo "BASE:    $BASE"
          echo "REVERSE: $REVERSE"
          echo "COMMITS: $COMMITS"

          # ----------------------------------------------------------
          # Resolve BASE.
          # ----------------------------------------------------------

          if git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            BASE_SHA="$(git rev-parse "${BASE}^{commit}")"

          elif git ls-remote --exit-code \
              --heads origin "$BASE" >/dev/null 2>&1; then

            echo "Fetching branch: $BASE"

            git fetch \
              --no-tags \
              --depth=1 \
              origin \
              "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

            BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE}")"

          else
            echo "Fetching base commit: $BASE"

            git fetch \
              --no-tags \
              --depth=2 \
              origin \
              "$BASE"

            BASE_SHA="$(git rev-parse "${BASE}^{commit}")"
          fi

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

          echo "Base SHA: $BASE_SHA"

          # ----------------------------------------------------------
          # Normal mode:
          #
          # Fetch only the selected commits.
          # ----------------------------------------------------------

          if [[ "$REVERSE" != "true" ]]; then

            echo
            echo "Mode: INCLUDE"

            for commit in $COMMITS; do
              echo "Fetching $commit"

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                echo "Already available."
                continue
              fi

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null
            done

          # ----------------------------------------------------------
          # Reverse mode:
          #
          # Get all commits from BASE..HEAD and exclude selected ones.
          # ----------------------------------------------------------

          else

            echo
            echo "Mode: EXCLUDE"

            HEAD_SHA="$(git rev-parse HEAD)"

            echo "HEAD: $HEAD_SHA"
            echo "BASE: $BASE_SHA"

            DEPTH=100
            MAX_DEPTH=100000

            while ! git merge-base \
                --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; do

              echo "Deepening history by $DEPTH..."

              git fetch \
                --no-tags \
                --deepen="$DEPTH" \
                origin

              DEPTH=$((DEPTH * 2))

              if [[ "$DEPTH" -gt "$MAX_DEPTH" ]]; then
                echo "::error::Unable to reach BASE from HEAD."
                exit 1
              fi
            done

            # Fetch selected commits in case they aren't in the
            # current branch history.
            for commit in $COMMITS; do

              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                continue
              fi

              echo "Fetching excluded commit $commit"

              git fetch \
                --no-tags \
                --depth=2 \
                origin \
                "$commit"

              git rev-parse --verify "${commit}^{commit}" >/dev/null
            done
          fi

      # ------------------------------------------------------------
      # Generate independent patches.
      # ------------------------------------------------------------
      - name: Generate patches
        env:
          BASE: ${{ inputs.base }}
          COMMITS: ${{ inputs.commits }}
          REVERSE: ${{ inputs.reverse }}
        run: |
          set -euo pipefail

          PATCH_DIR="patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          # ----------------------------------------------------------
          # Build list of commits.
          # ----------------------------------------------------------

          if [[ "$REVERSE" == "true" ]]; then

            echo "Building reverse commit list..."

            HEAD_SHA="$(git rev-parse HEAD)"

            mapfile -t ALL_COMMITS < <(
              git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}"
            )

            declare -A EXCLUDED=()

            for commit in $COMMITS; do
              SHA="$(git rev-parse "${commit}^{commit}")"
              EXCLUDED["$SHA"]=1
            done

            SELECTED_COMMITS=()

            for commit in "${ALL_COMMITS[@]}"; do
              if [[ -z "${EXCLUDED[$commit]+x}" ]]; then
                SELECTED_COMMITS+=("$commit")
              fi
            done

          else

            read -ra SELECTED_COMMITS <<< "$COMMITS"

          fi

          if [[ ${#SELECTED_COMMITS[@]} -eq 0 ]]; then
            echo "::error::No commits selected."
            exit 1
          fi

          echo
          echo "Commits:"
          printf '  %s\n' "${SELECTED_COMMITS[@]}"

          # ----------------------------------------------------------
          # Generate one independent patch per commit.
          # ----------------------------------------------------------

          NUMBER=1

          for commit in "${SELECTED_COMMITS[@]}"; do

            echo
            echo "========================================"
            echo "Generating patch for:"
            echo "$commit"
            echo "========================================"

            # Resolve full SHA.
            SHA="$(git rev-parse "${commit}^{commit}")"

            # Show commit information.
            git show \
              --no-patch \
              --format=fuller \
              "$SHA"

            # Generate one standalone Git patch.
            #
            # --binary:
            #   preserve binary file changes.
            #
            # --full-index:
            #   include complete blob IDs.
            #
            # -1:
            #   generate exactly this commit.
            #
            # --numbered-files:
            #   predictable filenames.
            git format-patch \
              -1 \
              --binary \
              --full-index \
              --numbered-files \
              --output-directory "$PATCH_DIR" \
              "$SHA"

            # Rename generated file to a deterministic name based
            # on commit subject.
            GENERATED="$(find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' \
              | sort \
              | tail -n 1)"

            SUBJECT="$(
              git log \
                -1 \
                --format='%s' \
                "$SHA"
            )"

            # Make filename safe.
            SAFE_SUBJECT="$(
              echo "$SUBJECT" \
                | tr '[:upper:]' '[:lower:]' \
                | sed 's/[^a-z0-9._-]/-/g' \
                | sed 's/-\+/-/g' \
                | sed 's/^-//; s/-$//'
            )"

            TARGET="$PATCH_DIR/$(printf '%04d' "$NUMBER")-${SAFE_SUBJECT}.patch"

            mv "$GENERATED" "$TARGET"

            NUMBER=$((NUMBER + 1))
          done

          # ----------------------------------------------------------
          # Save metadata.
          # ----------------------------------------------------------

          {
            echo "base=$BASE"
            echo "base_sha=$BASE_SHA"
            echo "reverse=$REVERSE"
            echo
            echo "commits:"
            printf '%s\n' "${SELECTED_COMMITS[@]}"
          } > "$PATCH_DIR/metadata.txt"

          echo
          echo "========================================"
          echo "Generated patches"
          echo "========================================"

          ls -lh "$PATCH_DIR"

      # ------------------------------------------------------------
      # Upload patches as artifact.
      # ------------------------------------------------------------
      - name: Upload patches
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: patches/
          if-no-files-found: error
          retention-days: 30
