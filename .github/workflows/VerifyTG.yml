name: Telegram Web APK Reproducible Build

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "How to select Telegram source"
        required: true
        type: choice
        default: commit
        options:
          - commit
          - latest
          - tag

      source:
        description: "Commit SHA, tag, or branch"
        required: true
        type: string
        default: "62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c"

      latest_branch:
        description: "Branch when source_type=latest"
        required: true
        type: string
        default: "master"

permissions:
  contents: read

env:
  TELEGRAM_REPO: https://github.com/DrKLO/Telegram.git
  TELEGRAM_APK_URL: https://telegram.org/dl/android/apk

  JDK_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

  ANDROID_NDK_VERSION_OLD: "21.4.7075529"
  ANDROID_NDK_VERSION_MIDDLE: "23.2.8568313"
  ANDROID_NDK_VERSION: "27.2.12479018"

  ANDROID_CMAKE_VERSION: "3.10.2.4988404"

jobs:
  reproducible-build:
    name: Verify Telegram Web APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Workspace
      # ============================================================

      - name: Create workspace
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/work"

      # ============================================================
      # Official APK
      # ============================================================

      - name: Download official Telegram APK
        working-directory: work
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output telegram_official.apk \
            "$TELEGRAM_APK_URL"

          echo "Official APK:"
          ls -lh telegram_official.apk

          echo
          echo "SHA-256:"
          sha256sum telegram_official.apk

      # ============================================================
      # Host APK tools
      # ============================================================

      - name: Locate aapt
        id: host_tools
        run: |
          set -euo pipefail

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found"
            exit 1
          fi

          echo "aapt=$AAPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # APK metadata
      # ============================================================

      - name: Read official APK metadata
        id: apk
        working-directory: work
        run: |
          set -euo pipefail

          BADGING="$(
            "${{ steps.host_tools.outputs.aapt }}" \
            dump badging \
            telegram_official.apk
          )"

          echo "$BADGING"

          PACKAGE="$(
            echo "$BADGING" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )"

          BUILD="$(
            echo "$BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"

          if [ -z "$PACKAGE" ]; then
            echo "::error::Could not determine package"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          if [ -z "$BUILD" ]; then
            echo "::error::Could not determine build"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Official APK"
          echo "=========================================="
          echo "Package: $PACKAGE"
          echo "Version: $VERSION"
          echo "Build:   $BUILD"
          echo "=========================================="

          if [ "$PACKAGE" != "org.telegram.messenger.web" ]; then
            echo "::error::Unexpected package: $PACKAGE"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Resolve source
      # ============================================================

      - name: Resolve source
        id: source
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE: ${{ inputs.source }}
          LATEST_BRANCH: ${{ inputs.latest_branch }}
        run: |
          set -euo pipefail

          case "$SOURCE_TYPE" in
            commit)
              RESOLVED="$SOURCE"
              ;;
            latest)
              RESOLVED="$LATEST_BRANCH"
              ;;
            tag)
              RESOLVED="$SOURCE"
              ;;
            *)
              echo "::error::Unknown source type"
              exit 1
              ;;
          esac

          if [ -z "$RESOLVED" ]; then
            echo "::error::Source is empty"
            exit 1
          fi

          echo "Requested source:"
          echo "$RESOLVED"

          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Clone Telegram
      # ============================================================

      - name: Clone Telegram source
        working-directory: work
        run: |
          set -euo pipefail

          git clone \
            --recursive \
            --shallow-submodules \
            "$TELEGRAM_REPO" \
            telegram

          cd telegram

          git fetch \
            --tags \
            --force \
            --prune

          git checkout "${{ steps.source.outputs.resolved }}"

          git submodule update \
            --init \
            --recursive \
            --depth=1

          echo
          echo "=========================================="
          echo "Resolved source"
          echo "=========================================="

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Short:"
          git rev-parse --short HEAD

          echo
          echo "Date:"
          git show -s --format='%ci' HEAD

          echo
          echo "Subject:"
          git show -s --format='%s' HEAD

      # ============================================================
      # Dockerfile
      # ============================================================

      - name: Create reproducible build Dockerfile
        working-directory: work
        run: |
          set -euo pipefail

          cat > Dockerfile.telegram-build <<'DOCKERFILE'
          FROM gradle:8.11.1-jdk17

          ENV DEBIAN_FRONTEND=noninteractive

          ENV ANDROID_HOME=/opt/android-sdk
          ENV ANDROID_SDK_ROOT=/opt/android-sdk

          ENV ANDROID_API_LEVEL=35
          ENV ANDROID_BUILD_TOOLS=35.0.0

          ENV ANDROID_NDK_VERSION_OLD=21.4.7075529
          ENV ANDROID_NDK_VERSION_MIDDLE=23.2.8568313
          ENV ANDROID_NDK_VERSION=27.2.12479018

          ENV ANDROID_CMAKE_VERSION=3.10.2.4988404

          ENV ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.2.12479018
          ENV CMAKE_HOME=/opt/android-sdk/cmake/3.10.2.4988404

          ENV PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/35.0.0:/opt/android-sdk/cmake/3.10.2.4988404/bin:/opt/android-sdk/ndk/27.2.12479018:$PATH

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                curl \
                unzip \
                git \
                ca-certificates \
                python3 \
                file \
                zip \
                rsync \
                build-essential \
                ninja-build \
                pkg-config \
                ccache \
                libc6-dev \
                libstdc++6 \
                zlib1g-dev \
                libncurses5 \
                libncurses6 \
                lib32z1 \
                lib32stdc++6 && \
              rm -rf /var/lib/apt/lists/*

          RUN git config --global --add safe.directory /home/source
          RUN git config --global --add safe.directory /home/gradle

          RUN mkdir -p "$ANDROID_HOME"

          ENV CMDLINE_TOOLS_URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          RUN mkdir -p /tmp/cmdline-tools && \
              curl -fsSL "$CMDLINE_TOOLS_URL" \
                -o /tmp/cmdline-tools.zip && \
              unzip -q /tmp/cmdline-tools.zip \
                -d /tmp/cmdline-tools && \
              mkdir -p "$ANDROID_HOME/cmdline-tools" && \
              mv /tmp/cmdline-tools/cmdline-tools \
                "$ANDROID_HOME/cmdline-tools/latest" && \
              rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip

          RUN yes | sdkmanager --licenses >/dev/null || true

          RUN sdkmanager \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "ndk;21.4.7075529" \
                "ndk;23.2.8568313" \
                "ndk;27.2.12479018" \
                "cmake;3.10.2.4988404"

          WORKDIR /home/gradle

          RUN java -version && \
              gradle --version && \
              cmake --version && \
              ninja --version

          CMD ["/bin/bash"]
          DOCKERFILE

      # ============================================================
      # Docker image
      # ============================================================

      - name: Build Docker image
        working-directory: work
        run: |
          set -euo pipefail

          docker build \
            --file Dockerfile.telegram-build \
            --tag telegram-reproducible-toolchain:latest \
            .

      # ============================================================
      # Verify toolchain
      # ============================================================

      - name: Verify Docker toolchain
        run: |
          set -euo pipefail

          docker run \
            --rm \
            telegram-reproducible-toolchain:latest \
            bash -lc '
              set -euo pipefail

              echo "=========================================="
              echo "BUILD TOOLCHAIN"
              echo "=========================================="

              echo
              echo "Java:"
              java -version

              echo
              echo "Gradle:"
              gradle --version

              echo
              echo "CMake:"
              which cmake
              cmake --version

              echo
              echo "Ninja:"
              which ninja
              ninja --version

              echo
              echo "SDK:"
              ls -la "$ANDROID_HOME/platforms/android-35"
              ls -la "$ANDROID_HOME/build-tools/35.0.0"

              echo
              echo "NDK:"
              ls -la "$ANDROID_HOME/ndk"

              echo
              echo "=========================================="
            '

      # ============================================================
      # Build
      #
      # IMPORTANT:
      # We intentionally follow Telegram's Docker build layout:
      #
      #   /home/source  = input repository
      #   /home/gradle  = actual Gradle build directory
      #
      # This matches Telegram's own Dockerfile.
      # ============================================================

      - name: Build Telegram
        working-directory: work
        run: |
          set -euo pipefail

          rm -rf telegram/TMessagesProj/build
          rm -rf telegram/TMessagesProj/.cxx
          rm -rf telegram/TMessagesProj_App/build
          rm -rf telegram/TMessagesProj_AppStandalone/build
          rm -rf telegram/TMessagesProj_AppHuawei/build
          rm -rf telegram/TMessagesProj_AppHockeyApp/build
          rm -rf telegram/.gradle

          mkdir -p telegram/TMessagesProj/build/outputs/apk
          mkdir -p telegram/TMessagesProj/build/outputs/native-debug-symbols

          docker run \
            --rm \
            --volume "$PWD/telegram:/home/source" \
            --workdir /home/gradle \
            telegram-reproducible-toolchain:latest \
            bash -lc '
              set -euo pipefail

              git config --global --add safe.directory /home/source
              git config --global --add safe.directory /home/gradle

              echo "=========================================="
              echo "TELEGRAM REPRODUCIBLE BUILD"
              echo "=========================================="

              echo
              echo "Source commit:"
              git -C /home/source rev-parse HEAD

              echo
              echo "Source subject:"
              git -C /home/source show -s --format="%s" HEAD

              echo
              echo "Java:"
              java -version

              echo
              echo "Gradle:"
              gradle --version

              echo
              echo "CMake:"
              which cmake
              cmake --version

              echo
              echo "Ninja:"
              which ninja
              ninja --version

              echo
              echo "NDK:"
              cat "$ANDROID_NDK_HOME/source.properties"

              echo
              echo "=========================================="
              echo "Copying source to Gradle workspace"
              echo "=========================================="

              rm -rf /home/gradle/TMessagesProj
              rm -rf /home/gradle/TMessagesProj_App
              rm -rf /home/gradle/TMessagesProj_AppStandalone
              rm -rf /home/gradle/TMessagesProj_AppHuawei
              rm -rf /home/gradle/TMessagesProj_AppHockeyApp
              rm -rf /home/gradle/TMessagesProj_AppTests
              rm -rf /home/gradle/buildSrc
              rm -rf /home/gradle/gradle

              cp -a /home/source/. /home/gradle/

              cd /home/gradle

              echo
              echo "Build workspace:"
              pwd

              echo
              echo "Workspace commit:"
              git rev-parse HEAD

              echo
              echo "=========================================="
              echo "Starting Gradle build"
              echo "=========================================="

              gradle \
                :TMessagesProj_AppStandalone:assembleAfatStandalone \
                --no-daemon \
                --stacktrace \
                --info

              echo
              echo "=========================================="
              echo "Gradle build completed"
              echo "=========================================="

              echo
              echo "Searching for generated APKs:"

              find /home/gradle \
                -type f \
                -name "*.apk" \
                -print \
                | sort

              echo
              echo "Copying APK output back to source..."

              mkdir -p /home/source/TMessagesProj/build/outputs/apk

              if [ -d "/home/gradle/TMessagesProj_AppStandalone/build/outputs/apk" ]; then
                cp -a \
                  /home/gradle/TMessagesProj_AppStandalone/build/outputs/apk/. \
                  /home/source/TMessagesProj/build/outputs/apk/
              fi

              if [ -d "/home/gradle/TMessagesProj/build/outputs/apk" ]; then
                cp -a \
                  /home/gradle/TMessagesProj/build/outputs/apk/. \
                  /home/source/TMessagesProj/build/outputs/apk/
              fi

              echo
              echo "Final APK files on source volume:"

              find /home/source/TMessagesProj/build/outputs/apk \
                -type f \
                -name "*.apk" \
                -print \
                | sort

              echo
              echo "=========================================="
              echo "BUILD COMPLETE"
              echo "=========================================="
            '

      # ============================================================
      # Locate APK
      # ============================================================

      - name: Locate generated standalone APK
        working-directory: work
        run: |
          set -euo pipefail

          APK_ROOT="telegram/TMessagesProj/build/outputs/apk"

          echo "APK output directory:"
          echo "$APK_ROOT"

          if [ ! -d "$APK_ROOT" ]; then
            echo "::error::APK output directory does not exist"

            echo
            echo "Build directory:"
            find telegram/TMessagesProj/build \
              -maxdepth 8 \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo
          echo "Generated APK files:"

          find "$APK_ROOT" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK="$APK_ROOT/afat/standalone/app.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Standalone APK not found:"
            echo "$APK"

            echo
            echo "Available APK files:"
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              -print \
              | sort

            exit 1
          fi

          cp "$APK" telegram_built.apk

          echo
          echo "Selected APK:"
          echo "$APK"

          echo
          echo "Built APK:"
          ls -lh telegram_built.apk

          echo
          echo "Built APK SHA-256:"
          sha256sum telegram_built.apk

      # ============================================================
      # Verify built APK metadata
      # ============================================================

      - name: Verify built APK metadata
        working-directory: work
        run: |
          set -euo pipefail

          BADGING="$(
            "${{ steps.host_tools.outputs.aapt }}" \
            dump badging \
            telegram_built.apk
          )"

          echo "$BADGING"

          PACKAGE="$(
            echo "$BADGING" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )"

          BUILD="$(
            echo "$BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"

          echo
          echo "Built package: $PACKAGE"
          echo "Built version: $VERSION"
          echo "Built build:   $BUILD"

          if [ "$PACKAGE" != "${{ steps.apk.outputs.package }}" ]; then
            echo "::error::Package mismatch"
            exit 1
          fi

          if [ "$VERSION" != "${{ steps.apk.outputs.version }}" ]; then
            echo "::error::versionName mismatch"
            exit 1
          fi

          if [ "$BUILD" != "${{ steps.apk.outputs.build }}" ]; then
            echo "::error::versionCode mismatch"
            exit 1
          fi

      # ============================================================
      # apkdiff
      # ============================================================

      - name: Run Telegram apkdiff.py
        working-directory: work/telegram
        run: |
          set -euo pipefail

          python3 apkdiff.py \
            "$GITHUB_WORKSPACE/work/telegram_official.apk" \
            "$GITHUB_WORKSPACE/work/telegram_built.apk"

      # ============================================================
      # Final result
      # ============================================================

      - name: Verification result
        if: success()
        working-directory: work
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "       REPRODUCIBLE BUILD VERIFIED"
          echo "================================================"

          echo
          echo "Telegram:"
          echo "  Version: ${{ steps.apk.outputs.version }}"
          echo "  Build:   ${{ steps.apk.outputs.build }}"
          echo "  Package: ${{ steps.apk.outputs.package }}"

          echo
          echo "Source:"
          echo "  Type:      ${{ inputs.source_type }}"
          echo "  Requested: ${{ inputs.source }}"
          echo "  Commit:    $(git -C telegram rev-parse HEAD)"
          echo "  Date:      $(git -C telegram show -s --format='%ci' HEAD)"
          echo "  Subject:   $(git -C telegram show -s --format='%s' HEAD)"

          echo
          echo "Toolchain:"
          echo "  JDK:         $JDK_VERSION"
          echo "  Gradle:      $GRADLE_VERSION"
          echo "  SDK:         $ANDROID_API_LEVEL"
          echo "  Build Tools: $ANDROID_BUILD_TOOLS"
          echo "  NDK 21:      $ANDROID_NDK_VERSION_OLD"
          echo "  NDK 23:      $ANDROID_NDK_VERSION_MIDDLE"
          echo "  NDK 27:      $ANDROID_NDK_VERSION"
          echo "  CMake:       $ANDROID_CMAKE_VERSION"

          echo
          echo "Official APK:"
          sha256sum telegram_official.apk

          echo
          echo "Built APK:"
          sha256sum telegram_built.apk

          echo
          echo "apkdiff.py: PASS"

          echo
          echo "================================================"

      # ============================================================
      # Artifacts
      # ============================================================

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-reproducible-${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.build }}-${{ github.run_id }}
          path: |
            work/telegram_official.apk
            work/telegram_built.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-build-metadata-${{ github.run_id }}
          path: |
            work/Dockerfile.telegram-build
          if-no-files-found: warn
          retention-days: 30
