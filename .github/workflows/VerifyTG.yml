name: Telegram Web APK Reproducible Build

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "How to select Telegram source"
        required: true
        type: choice
        default: commit
        options:
          - commit
          - latest
          - tag

      source:
        description: "Commit SHA, tag, or branch"
        required: true
        type: string
        default: "7df875ed136ef9f5c6b5263fc1c7788948587f4d"

      latest_branch:
        description: "Branch when source_type=latest"
        required: true
        type: string
        default: "master"

permissions:
  contents: read

env:
  TELEGRAM_REPO: https://github.com/DrKLO/Telegram.git
  TELEGRAM_APK_URL: https://telegram.org/dl/android/apk

  JDK_VERSION: "17"

  GRADLE_VERSION: "8.11.1"

  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

  ANDROID_NDK_VERSION_OLD: "21.4.7075529"
  ANDROID_NDK_VERSION_MIDDLE: "23.2.8568313"
  ANDROID_NDK_VERSION: "27.2.12479018"

  ANDROID_CMAKE_VERSION: "3.10.2.4988404"

jobs:
  reproducible-build:
    name: Verify Telegram Web APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Workspace
      # ============================================================

      - name: Create workspace
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/work"

      # ============================================================
      # 2. Download APK directly from Telegram website
      # ============================================================

      - name: Download official Telegram APK
        working-directory: work
        run: |
          set -euo pipefail

          echo "Downloading official Telegram APK..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output telegram_official.apk \
            "$TELEGRAM_APK_URL"

          echo
          echo "Official APK:"
          ls -lh telegram_official.apk

          echo
          echo "Official APK SHA-256:"
          sha256sum telegram_official.apk

      # ============================================================
      # 3. Install host Android tools needed to inspect APK
      # ============================================================

      - name: Locate host aapt
        id: host_tools
        run: |
          set -euo pipefail

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$AAPT" ]; then
            echo "::error::aapt was not found"
            exit 1
          fi

          echo "aapt=$AAPT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Read official APK metadata
      # ============================================================

      - name: Read official APK metadata
        id: apk
        working-directory: work
        run: |
          set -euo pipefail

          BADGING="$(
            "${{ steps.host_tools.outputs.aapt }}" \
            dump badging \
            telegram_official.apk
          )"

          echo "$BADGING"

          PACKAGE="$(
            echo "$BADGING" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )"

          BUILD="$(
            echo "$BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"

          if [ -z "$PACKAGE" ]; then
            echo "::error::Could not determine APK package"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine APK versionName"
            exit 1
          fi

          if [ -z "$BUILD" ]; then
            echo "::error::Could not determine APK versionCode"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Official Telegram APK"
          echo "=========================================="
          echo "Package: $PACKAGE"
          echo "Version: $VERSION"
          echo "Build:   $BUILD"
          echo "=========================================="

          if [ "$PACKAGE" != "org.telegram.messenger.web" ]; then
            echo "::error::Unexpected package: $PACKAGE"
            echo "Expected: org.telegram.messenger.web"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Resolve requested source
      # ============================================================

      - name: Resolve source
        id: source
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE: ${{ inputs.source }}
          LATEST_BRANCH: ${{ inputs.latest_branch }}
        run: |
          set -euo pipefail

          case "$SOURCE_TYPE" in
            commit)
              RESOLVED="$SOURCE"
              ;;

            latest)
              RESOLVED="$LATEST_BRANCH"
              ;;

            tag)
              RESOLVED="$SOURCE"
              ;;

            *)
              echo "::error::Unknown source type: $SOURCE_TYPE"
              exit 1
              ;;
          esac

          if [ -z "$RESOLVED" ]; then
            echo "::error::Resolved source is empty"
            exit 1
          fi

          echo "Source type:"
          echo "$SOURCE_TYPE"

          echo
          echo "Requested source:"
          echo "$RESOLVED"

          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. Clone Telegram repository
      # ============================================================

      - name: Clone Telegram source
        working-directory: work
        run: |
          set -euo pipefail

          git clone \
            --recursive \
            --shallow-submodules \
            "$TELEGRAM_REPO" \
            telegram

          cd telegram

          git fetch \
            --tags \
            --force \
            --prune

          git checkout "${{ steps.source.outputs.resolved }}"

          git submodule update \
            --init \
            --recursive \
            --depth=1

          echo
          echo "=========================================="
          echo "Resolved Telegram source"
          echo "=========================================="

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Short commit:"
          git rev-parse --short HEAD

          echo
          echo "Commit date:"
          git show -s --format='%ci' HEAD

          echo
          echo "Commit subject:"
          git show -s --format='%s' HEAD

          echo
          echo "=========================================="

      # ============================================================
      # 7. Create build Dockerfile
      # ============================================================

      - name: Create reproducible build Dockerfile
        working-directory: work
        run: |
          set -euo pipefail

          cat > Dockerfile.telegram-build <<'DOCKERFILE'
          FROM gradle:8.11.1-jdk17

          ENV DEBIAN_FRONTEND=noninteractive

          ENV ANDROID_HOME=/opt/android-sdk
          ENV ANDROID_SDK_ROOT=/opt/android-sdk

          ENV ANDROID_API_LEVEL=35
          ENV ANDROID_BUILD_TOOLS=35.0.0

          ENV ANDROID_NDK_VERSION_OLD=21.4.7075529
          ENV ANDROID_NDK_VERSION_MIDDLE=23.2.8568313
          ENV ANDROID_NDK_VERSION=27.2.12479018

          ENV ANDROID_CMAKE_VERSION=3.10.2.4988404

          ENV ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.2.12479018
          ENV CMAKE_HOME=/opt/android-sdk/cmake/3.10.2.4988404

          ENV PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/35.0.0:/opt/android-sdk/cmake/3.10.2.4988404/bin:/opt/android-sdk/ndk/27.2.12479018:$PATH

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                curl \
                unzip \
                git \
                ca-certificates \
                python3 \
                file \
                zip \
                rsync \
                build-essential \
                ninja-build \
                pkg-config \
                ccache \
                libc6-dev \
                libstdc++6 \
                zlib1g-dev \
                libncurses5 \
                libncurses6 \
                lib32z1 \
                lib32stdc++6 && \
              rm -rf /var/lib/apt/lists/*

          RUN git config --global --add safe.directory /home/source

          RUN mkdir -p "$ANDROID_HOME"

          ENV CMDLINE_TOOLS_URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          RUN mkdir -p /tmp/cmdline-tools && \
              curl -fsSL "$CMDLINE_TOOLS_URL" \
                -o /tmp/cmdline-tools.zip && \
              unzip -q /tmp/cmdline-tools.zip \
                -d /tmp/cmdline-tools && \
              mkdir -p "$ANDROID_HOME/cmdline-tools" && \
              mv /tmp/cmdline-tools/cmdline-tools \
                "$ANDROID_HOME/cmdline-tools/latest" && \
              rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip

          RUN yes | sdkmanager --licenses >/dev/null || true

          RUN sdkmanager \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "ndk;21.4.7075529" \
                "ndk;23.2.8568313" \
                "ndk;27.2.12479018" \
                "cmake;3.10.2.4988404"

          WORKDIR /home/source

          RUN java -version && \
              gradle --version && \
              cmake --version && \
              ninja --version

          CMD ["/bin/bash"]
          DOCKERFILE

          echo "Dockerfile created."

      # ============================================================
      # 8. Build Docker image
      # ============================================================

      - name: Build reproducible build image
        working-directory: work
        run: |
          set -euo pipefail

          docker build \
            --file Dockerfile.telegram-build \
            --tag telegram-reproducible-toolchain:latest \
            .

      # ============================================================
      # 9. Verify toolchain
      # ============================================================

      - name: Verify Docker toolchain
        run: |
          set -euo pipefail

          docker run \
            --rm \
            telegram-reproducible-toolchain:latest \
            bash -lc '
              set -euo pipefail

              echo "=========================================="
              echo "BUILD TOOLCHAIN"
              echo "=========================================="

              echo
              echo "Java:"
              java -version

              echo
              echo "Gradle:"
              gradle --version

              echo
              echo "CMake:"
              which cmake
              cmake --version

              echo
              echo "Ninja:"
              which ninja
              ninja --version

              echo
              echo "Android SDK:"
              ls -la "$ANDROID_HOME/platforms"
              ls -la "$ANDROID_HOME/build-tools"

              echo
              echo "NDK installations:"
              ls -la "$ANDROID_HOME/ndk"

              echo
              echo "NDK 21:"
              cat "$ANDROID_HOME/ndk/21.4.7075529/source.properties"

              echo
              echo "NDK 23:"
              cat "$ANDROID_HOME/ndk/23.2.8568313/source.properties"

              echo
              echo "NDK 27:"
              cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"

              echo
              echo "=========================================="
            '

      # ============================================================
      # 10. Build standalone Telegram APK
      # ============================================================

      - name: Build Telegram standalone APK
        working-directory: work
        run: |
          set -euo pipefail

          rm -rf telegram/TMessagesProj/build
          rm -rf telegram/TMessagesProj/.cxx
          rm -rf telegram/TMessagesProj_App*/build
          rm -rf telegram/.gradle

          docker run \
            --rm \
            --volume "$PWD/telegram:/home/source" \
            --workdir /home/source \
            telegram-reproducible-toolchain:latest \
            bash -lc '
              set -euo pipefail

              git config --global --add safe.directory /home/source

              cd /home/source

              echo "=========================================="
              echo "TELEGRAM REPRODUCIBLE BUILD"
              echo "=========================================="

              echo
              echo "Commit:"
              git rev-parse HEAD

              echo
              echo "Commit date:"
              git show -s --format="%ci" HEAD

              echo
              echo "Commit subject:"
              git show -s --format="%s" HEAD

              echo
              echo "Java:"
              java -version

              echo
              echo "Gradle:"
              gradle --version

              echo
              echo "CMake:"
              which cmake
              cmake --version

              echo
              echo "Ninja:"
              which ninja
              ninja --version

              echo
              echo "NDK:"
              cat "$ANDROID_NDK_HOME/source.properties"

              echo
              echo "=========================================="
              echo "Starting Gradle build"
              echo "=========================================="

              gradle \
                :TMessagesProj_AppStandalone:assembleAfatStandalone \
                --no-daemon \
                --stacktrace \
                --info

              echo
              echo "=========================================="
              echo "BUILD FINISHED"
              echo "=========================================="
            '

      # ============================================================
      # 11. Locate standalone APK
      # ============================================================

      - name: Locate generated standalone APK
        working-directory: work
        run: |
          set -euo pipefail

          echo "Generated APK files:"

          find telegram/TMessagesProj/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print \
            | sort

          APK=""

          if [ -f "telegram/TMessagesProj/build/outputs/apk/afat/standalone/app.apk" ]; then
            APK="telegram/TMessagesProj/build/outputs/apk/afat/standalone/app.apk"
          fi

          if [ -z "$APK" ]; then
            APK="$(
              find telegram/TMessagesProj/build/outputs/apk \
                -type f \
                -path '*/standalone/app.apk' \
                | head -n 1
            )"
          fi

          if [ -z "$APK" ]; then
            echo "::error::Could not find standalone APK"
            exit 1
          fi

          echo
          echo "Selected APK:"
          echo "$APK"

          cp \
            "$APK" \
            telegram_built.apk

          echo
          echo "Built APK:"
          ls -lh telegram_built.apk

          echo
          echo "Built APK SHA-256:"
          sha256sum telegram_built.apk

      # ============================================================
      # 12. Verify built APK metadata
      # ============================================================

      - name: Verify built APK metadata
        working-directory: work
        run: |
          set -euo pipefail

          BADGING="$(
            "${{ steps.host_tools.outputs.aapt }}" \
            dump badging \
            telegram_built.apk
          )"

          echo "$BADGING"

          PACKAGE="$(
            echo "$BADGING" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          VERSION="$(
            echo "$BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )"

          BUILD="$(
            echo "$BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"

          echo
          echo "Built package: $PACKAGE"
          echo "Built version: $VERSION"
          echo "Built build:   $BUILD"

          if [ "$PACKAGE" != "${{ steps.apk.outputs.package }}" ]; then
            echo "::error::Package mismatch"
            exit 1
          fi

          if [ "$VERSION" != "${{ steps.apk.outputs.version }}" ]; then
            echo "::error::versionName mismatch"
            exit 1
          fi

          if [ "$BUILD" != "${{ steps.apk.outputs.build }}" ]; then
            echo "::error::versionCode mismatch"
            exit 1
          fi

      # ============================================================
      # 13. Compare APKs
      # ============================================================

      - name: Run Telegram apkdiff.py
        working-directory: work/telegram
        run: |
          set -euo pipefail

          python3 apkdiff.py \
            "$GITHUB_WORKSPACE/work/telegram_official.apk" \
            "$GITHUB_WORKSPACE/work/telegram_built.apk"

      # ============================================================
      # 14. Final report
      # ============================================================

      - name: Verification result
        if: success()
        working-directory: work
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "       REPRODUCIBLE BUILD VERIFIED"
          echo "================================================"

          echo
          echo "Telegram:"
          echo "  Version: ${{ steps.apk.outputs.version }}"
          echo "  Build:   ${{ steps.apk.outputs.build }}"
          echo "  Package: ${{ steps.apk.outputs.package }}"

          echo
          echo "Source:"
          echo "  Type:      ${{ inputs.source_type }}"
          echo "  Requested: ${{ inputs.source }}"
          echo "  Commit:    $(git -C telegram rev-parse HEAD)"
          echo "  Date:      $(git -C telegram show -s --format='%ci' HEAD)"
          echo "  Subject:   $(git -C telegram show -s --format='%s' HEAD)"

          echo
          echo "Build environment:"
          echo "  JDK:          $JDK_VERSION"
          echo "  Gradle:       $GRADLE_VERSION"
          echo "  SDK:          $ANDROID_API_LEVEL"
          echo "  Build Tools:  $ANDROID_BUILD_TOOLS"
          echo "  NDK 21:       $ANDROID_NDK_VERSION_OLD"
          echo "  NDK 23:       $ANDROID_NDK_VERSION_MIDDLE"
          echo "  NDK 27:       $ANDROID_NDK_VERSION"
          echo "  CMake:        $ANDROID_CMAKE_VERSION"

          echo
          echo "Official APK SHA-256:"
          sha256sum telegram_official.apk

          echo
          echo "Built APK SHA-256:"
          sha256sum telegram_built.apk

          echo
          echo "apkdiff.py: PASS"

          echo
          echo "================================================"

      # ============================================================
      # 15. Upload APK artifacts
      # ============================================================

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-reproducible-${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.build }}-${{ github.run_id }}
          path: |
            work/telegram_official.apk
            work/telegram_built.apk
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. Upload build metadata
      # ============================================================

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-build-metadata-${{ github.run_id }}
          path: |
            work/Dockerfile.telegram-build
          if-no-files-found: warn
          retention-days: 30
