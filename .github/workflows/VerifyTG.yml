name: Verify Telegram Build

on:
  workflow_dispatch:
    inputs:
      source:
        description: "DrKLO/Telegram commit, tag or branch"
        required: true
        default: "master"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7

      - name: Checkout Telegram source
        run: |
          set -euo pipefail

          git clone --recursive https://github.com/DrKLO/Telegram.git work/telegram
          cd work/telegram

          git checkout "${{ inputs.source }}"
          git submodule update --init --recursive

      - name: Create build metadata
        if: always()
        run: |
          set -euo pipefail

          mkdir -p work

          {
            echo "Telegram source commit:"
            git -C work/telegram rev-parse HEAD
            echo

            echo "Telegram source:"
            git -C work/telegram remote get-url origin
            echo

            echo "Dockerfile:"
            cat work/telegram/Dockerfile
          } > work/telegram-build-metadata.txt

      - name: Download official APK
        run: |
          set -euo pipefail

          curl -fL https://telegram.org/dl/android/apk \
            -o work/telegram_official.apk

          sha256sum work/telegram_official.apk

      - name: Build official Docker image
        run: |
          set -euo pipefail

          docker build \
            --file work/telegram/Dockerfile \
            --tag telegram-reproducible \
            work/telegram

      - name: Build Telegram
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD/work/telegram:/home/source" \
            telegram-reproducible

      - name: Locate built APK
        run: |
          set -euo pipefail

          find work/telegram/TMessagesProj/build/outputs/apk \
            -type f -name '*.apk' -print

          APK="$(find \
            work/telegram/TMessagesProj/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | grep -E '/standalone/|app.*Standalone' \
            | head -n 1)"

          test -n "$APK"

          cp "$APK" work/telegram_built.apk

          sha256sum work/telegram_built.apk

      - name: Compare APKs
        run: |
          set -euo pipefail

          python3 apkdiff.py \
            work/telegram_official.apk \
            work/telegram_built.apk

      - name: Verify
        if: success()
        run: |
          echo "REPRODUCIBLE BUILD VERIFIED"

      - name: Upload APK built
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk
          archive: false
          path: work/telegram/TMessagesProj/build/outputs/apk/telegram_built.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK official
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk
          archive: false
          path: work/telegram/TMessagesProj/build/outputs/apk/telegram_official.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: work/telegram-build-metadata.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
