name: Telegram Reproducible Build

on:
  workflow_dispatch:
    inputs:
      source:
        description: "DrKLO/Telegram commit, tag or branch"
        required: true
        default: "master"
      verify-build:
        description: "Compare with the original"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout Telegram source
        run: |
          set -euo pipefail

          REPO="https://github.com/DrKLO/Telegram.git"
          DIR="work/telegram"
          REF="${{ inputs.source }}"

          mkdir -p work

          git init "$DIR"

          cd "$DIR"

          git remote add origin "$REPO"

          git fetch \
            --depth 1 \
            --no-tags \
            origin \
            "$REF"

          git checkout --detach FETCH_HEAD

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive \
            --depth 1

      - name: Create build metadata
        if: always()
        run: |
          set -euo pipefail

          mkdir -p work

          {
            echo "Telegram source commit:"
            git -C work/telegram rev-parse HEAD
            echo

            echo "Telegram source:"
            git -C work/telegram remote get-url origin
            echo

            echo "Dockerfile:"
            cat work/telegram/Dockerfile
          } > work/telegram-build-metadata.txt

      - name: Download official APK
        if: ${{ inputs.verify-build }}
        run: |
          set -euo pipefail

          mkdir -p work

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --continue-at - \
            --output work/telegram_official.apk \
            https://telegram.org/dl/android/apk

          test -s work/telegram_official.apk
          sha256sum work/telegram_official.apk

      - name: Build official Docker image
        run: |
          set -euo pipefail

          docker build \
            --file work/telegram/Dockerfile \
            --tag telegram-reproducible \
            work/telegram

      - name: Build Telegram APK
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD/work/telegram:/home/source" \
            telegram-reproducible \
            bash -c '
              mkdir -p /home/source/TMessagesProj/build/outputs/apk
              cp -R /home/source/. /home/gradle
              cd /home/gradle

              gradle \
                :TMessagesProj_AppStandalone:assembleAfatStandalone

              cp -R \
                /home/gradle/TMessagesProj_AppStandalone/build/outputs/apk/. \
                /home/source/TMessagesProj/build/outputs/apk/
            '

      - name: Locate built APK
        run: |
          set -euo pipefail

          find work/telegram/TMessagesProj/build/outputs/apk \
            -type f -name '*.apk' -print

          APK="$(find \
            work/telegram/TMessagesProj/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | grep -E '/standalone/|app.*Standalone' \
            | head -n 1)"

          test -n "$APK"

          sudo mv "$APK" work/telegram_built.apk

          sha256sum work/telegram_built.apk

      - name: Compare APKs
        if: ${{ inputs.verify-build }}
        working-directory: work
        run: |
          set -euo pipefail

          python3 apkdiff.py \
            telegram_official.apk \
            telegram_built.apk

      - name: Verify
        if: ${{ success() && inputs.verify-build }}
        run: |
          echo "REPRODUCIBLE BUILD VERIFIED"

      - name: Upload APK built
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk
          archive: false
          path: work/telegram_built.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK official
        if: ${{ inputs.verify-build }}
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk
          archive: false
          path: work/telegram_official.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          path: work/telegram-build-metadata.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
