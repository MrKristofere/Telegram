name: Verify Telegram Website APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Source revision to build"
        required: true
        type: choice
        default: tag
        options:
          - tag
          - commit
          - latest

      source:
        description: "Tag, commit SHA, or branch (used depending on Source revision)"
        required: true
        type: string
        default: "release-12.10.0_70319"

      latest_branch:
        description: "Branch used when Source revision = latest"
        required: true
        type: string
        default: "master"

permissions:
  contents: read

env:
  TELEGRAM_REPO: https://github.com/DrKLO/Telegram.git
  APK_URL: https://telegram.org/dl/android/apk

jobs:
  verify:
    name: Verify Telegram Website APK
    runs-on: ubuntu-24.04

    steps:
      # ----------------------------------------------------------
      # 1. Workspace
      # ----------------------------------------------------------
      - name: Create workspace
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/work"

      # ----------------------------------------------------------
      # 2. Download official APK from telegram.org
      # ----------------------------------------------------------
      - name: Download official Telegram APK
        working-directory: work
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output telegram_official.apk \
            "$APK_URL"

          echo "Official APK:"
          ls -lh telegram_official.apk

          echo
          echo "SHA-256:"
          sha256sum telegram_official.apk

      # ----------------------------------------------------------
      # 3. Find aapt
      # ----------------------------------------------------------
      - name: Locate aapt
        id: aapt
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found"
            exit 1
          fi

          echo "aapt=$AAPT" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 4. Read APK version/build
      # ----------------------------------------------------------
      - name: Read APK metadata
        id: apk
        working-directory: work
        run: |
          set -euo pipefail

          BADGING="$("${{ steps.aapt.outputs.aapt }}" \
            dump badging telegram_official.apk)"

          echo "$BADGING"

          PACKAGE="$(echo "$BADGING" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"

          VERSION="$(echo "$BADGING" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          BUILD="$(echo "$BADGING" \
            | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"

          if [ "$PACKAGE" != "org.telegram.messenger.web" ]; then
            echo "::error::Unexpected package: $PACKAGE"
            echo "Expected: org.telegram.messenger.web"
            exit 1
          fi

          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "::error::Could not determine Telegram version/build"
            exit 1
          fi

          RELEASE_TAG="release-${VERSION}_${BUILD}"

          echo "Package: $PACKAGE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Expected release tag: $RELEASE_TAG"

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 5. Resolve source revision
      # ----------------------------------------------------------
      - name: Resolve source revision
        id: source
        working-directory: work
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE: ${{ inputs.source }}
          LATEST_BRANCH: ${{ inputs.latest_branch }}
          RELEASE_TAG: ${{ steps.apk.outputs.release_tag }}
        run: |
          set -euo pipefail

          case "$SOURCE_TYPE" in

            tag)
              if [ "$SOURCE" = "auto" ]; then
                RESOLVED="$RELEASE_TAG"
              else
                RESOLVED="$SOURCE"
              fi
              ;;

            commit)
              RESOLVED="$SOURCE"
              ;;

            latest)
              RESOLVED="$LATEST_BRANCH"
              ;;

            *)
              echo "::error::Unknown source type: $SOURCE_TYPE"
              exit 1
              ;;
          esac

          echo "Requested source:"
          echo "$RESOLVED"

          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 6. Clone repository
      #
      # Full history is intentional. Telegram's reproducible-build
      # documentation notes that the correct source revision and
      # build environment matter for verification.
      # ----------------------------------------------------------
      - name: Clone Telegram source
        working-directory: work
        env:
          RESOLVED_SOURCE: ${{ steps.source.outputs.resolved }}
        run: |
          set -euo pipefail

          git clone \
            --recursive \
            "$TELEGRAM_REPO" \
            telegram

          cd telegram

          git fetch --tags --force

          git checkout "$RESOLVED_SOURCE"

          git submodule update --init --recursive

          echo
          echo "Resolved commit:"
          git rev-parse HEAD

          echo
          echo "Resolved source:"
          git describe --tags --always --decorate

      # ----------------------------------------------------------
      # 7. Build Docker image
      # ----------------------------------------------------------
      - name: Build Telegram Docker image
        working-directory: work/telegram
        run: |
          set -euo pipefail

          docker build \
            --tag telegram-reproducible:${GITHUB_SHA} \
            .

      # ----------------------------------------------------------
      # 8. Build APK
      # ----------------------------------------------------------
      - name: Build Telegram inside Docker
        working-directory: work/telegram
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --volume "$PWD:/home/source" \
            telegram-reproducible:${GITHUB_SHA}

      # ----------------------------------------------------------
      # 9. Locate standalone APK
      # ----------------------------------------------------------
      - name: Locate reproducible APK
        working-directory: work/telegram
        run: |
          set -euo pipefail

          APK="TMessagesProj/build/outputs/apk/afat/standalone/app.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Standalone APK was not generated"

            echo
            echo "Available APKs:"
            find TMessagesProj/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print \
              | sort

            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/work/telegram_built.apk"

          echo "Built APK:"
          ls -lh "$GITHUB_WORKSPACE/work/telegram_built.apk"

          echo
          echo "SHA-256:"
          sha256sum "$GITHUB_WORKSPACE/work/telegram_built.apk"

      # ----------------------------------------------------------
      # 10. Compare using Telegram's apkdiff.py
      # ----------------------------------------------------------
      - name: Compare APKs
        working-directory: work/telegram
        run: |
          set -euo pipefail

          python3 apkdiff.py \
            "$GITHUB_WORKSPACE/work/telegram_official.apk" \
            "$GITHUB_WORKSPACE/work/telegram_built.apk"

      # ----------------------------------------------------------
      # 11. Final result
      # ----------------------------------------------------------
      - name: Verification result
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "REPRODUCIBLE BUILD VERIFIED"
          echo "=============================================="

          echo "Telegram version: ${{ steps.apk.outputs.version }}"
          echo "Telegram build:   ${{ steps.apk.outputs.build }}"

          echo
          echo "Source mode:      ${{ inputs.source_type }}"
          echo "Source requested: ${{ inputs.source }}"
          echo "Source resolved:  ${{ steps.source.outputs.resolved }}"

          echo
          echo "Resolved commit:"
          git -C work/telegram rev-parse HEAD

          echo
          echo "Official APK SHA-256:"
          sha256sum work/telegram_official.apk

          echo
          echo "Built APK SHA-256:"
          sha256sum work/telegram_built.apk

          echo
          echo "Telegram apkdiff.py reported a successful match."
          echo "=============================================="

      # ----------------------------------------------------------
      # 12. Upload APKs
      # ----------------------------------------------------------
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-reproducible-${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.build }}
          path: |
            work/telegram_official.apk
            work/telegram_built.apk
          if-no-files-found: error
          retention-days: 30
