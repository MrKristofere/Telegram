name: Build Test Web

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name"
        type: string
        default: master
        required: true
      build-type: 
        description: "Application build type"
        type: choice
        options:
          - Web
          - Google Play
          - Web (Debug)
          - Google Play (Debug)
        default: Web
      pkg-name:
        description: "use another pkg name"
        type: string
        default: aex.telegram
        required: true
      appidhash:
        description: "use old APP_ID/APP_HASH"
        type: boolean
        default: true
      useoff:
        description: "use the official package name"
        type: boolean
        default: false
      app-name:
        description: "artifact name"
        type: string
        default: Telegram-mod
        required: true
      disable-minify:
        description: "Disable minify (R8)"
        type: boolean
        default: false
      disable-optimize:
        description: "Disable optimize R8"
        type: boolean
        default: true
      disable-obfuscate:
        description: "Disable obfuscate R8"
        type: boolean
        default: true

env:
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "3G"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:

      # ============================================================
      # SWAP SPACE
      # ============================================================

      - name: Set swap space
        if: false
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      # ============================================================
      # CONFIGURE BUILD TYPE
      # ============================================================

      - name: Configure build type
        id: build
        run: |
          set -euo pipefail

          case "${{ inputs.build-type }}" in
            "Web")
              MODULE="TMessagesProj_AppStandalone"
              TASK="assembleAfatStandalone"
              OUTPUT_DIR="TMessagesProj_AppStandalone/build/outputs"
              ARTIFACT_NAME="telegram-standalone-web"
              ;;

            "Web (Debug)")
              MODULE="TMessagesProj_AppStandalone"
              TASK="assembleAfatDebug"
              OUTPUT_DIR="TMessagesProj_AppStandalone/build/outputs"
              ARTIFACT_NAME="telegram-standalone-web-debug"
              ;;

            "Google Play")
              MODULE="TMessagesProj_App"
              TASK="assembleAfatRelease"
              OUTPUT_DIR="TMessagesProj_App/build/outputs"
              ARTIFACT_NAME="telegram-google-play"
              ;;

            "Google Play (Debug)")
              MODULE="TMessagesProj_App"
              TASK="assembleAfatDebug"
              OUTPUT_DIR="TMessagesProj_App/build/outputs"
              ARTIFACT_NAME="telegram-google-play-debug"
              ;;

            *)
              echo "Unknown build type: ${{ inputs.build-type }}"
              exit 1
              ;;
          esac

          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Build type: ${{ inputs.build-type }}"
          echo "Module: $MODULE"
          echo "Task: $TASK"
          echo "Output: $OUTPUT_DIR"

      # ============================================================
      # ISOLATE GRADLE USER HOME
      # ============================================================

      - name: Isolate Gradle User Home
        run: |
          set -euo pipefail

          GRADLE_HOME="$RUNNER_TEMP/gradle-user-home"

          mkdir -p "$GRADLE_HOME"

          echo "GRADLE_USER_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"

          echo "Gradle User Home isolated to runner temp directory."

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Configure package
        if: ${{ !inputs.useoff }}
        run: |
          set -euo pipefail

          echo "Original APP_PACKAGE:"
          grep '^APP_PACKAGE=' gradle.properties

          sed -i \
            's/^APP_PACKAGE=.*/APP_PACKAGE=${{ inputs.pkg-name }}/' \
            gradle.properties

          echo "Configured APP_PACKAGE:"
          grep '^APP_PACKAGE=' gradle.properties

      # ============================================================
      # FIREBASE
      # ============================================================

      - name: Configure Firebase for custom package
        if: ${{ !inputs.useoff }}
        run: |
          set -euo pipefail

          case "${{ inputs.build-type }}" in
            "Web"|"Web (Debug)")
              ORIGINAL_PACKAGE="org.telegram.messenger.web"
              CUSTOM_PACKAGE="${{ inputs.pkg-name }}.web"
              ;;

            "Google Play")
              ORIGINAL_PACKAGE="org.telegram.messenger"
              CUSTOM_PACKAGE="${{ inputs.pkg-name }}"
              ;;

            "Google Play (Debug)")
              ORIGINAL_PACKAGE="org.telegram.messenger.beta"
              CUSTOM_PACKAGE="${{ inputs.pkg-name }}"
              ;;

            *)
              echo "Unknown build type: ${{ inputs.build-type }}"
              exit 1
              ;;
          esac

          echo "Build type: ${{ inputs.build-type }}"
          echo "Original package: $ORIGINAL_PACKAGE"
          echo "Custom package: $CUSTOM_PACKAGE"

          sed -i \
            "s/${ORIGINAL_PACKAGE}/${CUSTOM_PACKAGE}/g" \
            "${{ steps.build.outputs.module }}/google-services.json"

          sed -i \
            "s/${ORIGINAL_PACKAGE}/${CUSTOM_PACKAGE}/g" \
            "TMessagesProj/google-services.json"

      # ============================================================
      # GRADLE OPTIMIZATIONS
      # ============================================================

      - name: Configure Gradle optimizations
        run: |
          set -euo pipefail

          sed -i \
            -e '/^org.gradle.caching=/d' \
            gradle.properties

          printf '%s\n' 'org.gradle.caching=true' >> gradle.properties

          echo "Gradle optimizations configured."

      # ============================================================
      # SDK VERSIONS
      # ============================================================

      - name: Extract Android SDK versions
        id: sdk
        run: |
          set -euo pipefail

          BUILD_GRADLE="${{ steps.build.outputs.module }}/build.gradle"

          echo "build_tools=$(grep -oP "buildToolsVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

          echo "compile_sdk=$(grep -oP "compileSdk(?:Version)?\s*=?\s*\K\d+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

          echo "ndk=$(grep -oP "ndkVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;${{ steps.sdk.outputs.build_tools }}
            ndk;${{ steps.sdk.outputs.ndk }}
            platforms;android-${{ steps.sdk.outputs.compile_sdk }}

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      # ============================================================
      # GRADLE JVM
      # ============================================================

      - name: Modify Gradle JVM Args
        run: |
          set -euo pipefail

          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))

          echo "Detected memory size: ${MEMORY_GB}GB"

          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties

            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      # ============================================================
      # BUILD VARS
      # ============================================================

      - name: Fill BuildVars
        if: ${{ inputs.appidhash }}
        run: |
          set -euo pipefail

          BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"

          sed -i -E \
            's/public static int APP_ID = [0-9]+;/public static int APP_ID = 6;/' \
            "$BUILD_VARS"

          sed -i -E \
            's/public static String APP_HASH = "[^"]*";/public static String APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e";/' \
            "$BUILD_VARS"

      # ============================================================
      # R8 Configuration
      # ============================================================

      - name: Disable minify (R8)
        if: ${{ inputs.disable-minify }}
        run: |
          sed -i \
            -e 's/minifyEnabled true/minifyEnabled false/' \
            -e 's/shrinkResources true/shrinkResources false/' \
             ${{ steps.build.outputs.module }}/build.gradle

      - name: Disable optimize R8
        if: ${{ inputs.disable-optimize && !inputs.disable-minify }}
        run: |
          sed -i 's/^#-dontoptimize/-dontoptimize/' TMessagesProj/proguard-rules.pro

      - name: Disable obfuscate R8
        if: ${{ inputs.disable-obfuscate && !inputs.disable-minify }}
        run: |
          sed -i 's/^#-dontobfuscate/-dontobfuscate/' TMessagesProj/proguard-rules.pro

      # ============================================================
      # RESTORE PRIVATE RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          KEYSTORE="TMessagesProj/config/release.keystore"

          mkdir -p "$(dirname "$KEYSTORE")"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: release.keystore was not created or is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE"

          echo "Release keystore restored."

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ steps.sdk.outputs.ndk }}

      # ============================================================
      # NATIVE CACHE
      # ============================================================

      - name: Cache native CMake / NDK build
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/cmake
          key: ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-${{ hashFiles('TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'TMessagesProj_AppStandalone/build.gradle') }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-${{ hashFiles('TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'TMessagesProj_AppStandalone/build.gradle') }}-

      # ============================================================
      # SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches/keyrings

      # ============================================================
      # CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is not configured."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is not configured."
            exit 1
          fi

          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD secret is not configured."
            exit 1
          fi

          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"

          # Remove repository/default signing values.
          sed -i '/^RELEASE_KEY_PASSWORD=/d' gradle.properties
          sed -i '/^RELEASE_KEY_ALIAS=/d' gradle.properties
          sed -i '/^RELEASE_STORE_PASSWORD=/d' gradle.properties

          # Store real signing values only in Gradle User Home.
          {
            printf '%s\n' "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            printf '%s\n' "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            printf '%s\n' "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } > "$GRADLE_USER_HOME/gradle.properties"

          chmod 600 "$GRADLE_USER_HOME/gradle.properties"

          echo "Release signing configured."

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"

          KEYSTORE="TMessagesProj/config/release.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: $KEYSTORE not found."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore verification passed."

      # ============================================================
      # BUILD SIGNED APK
      # ============================================================

      - name: Build Standalone APK
        run: |
          set -euo pipefail

          ./gradlew \
            :${{ steps.build.outputs.module }}:${{ steps.build.outputs.task }}

      - name: Rename APK
        run: |
          APK=$(find ${{ steps.build.outputs.module }}/build/outputs -type f -name 'app.apk' -print -quit)

          if [[ -z "$APK" ]]; then
            echo "APK not found"
            exit 1
          fi

          mv "$APK" "${{ steps.build.outputs.module }}/build/outputs/${{ inputs.app-name }}.apk"

      # ============================================================
      # VERIFY APK PACKAGE + SIGNATURE + SHA-256
      # ============================================================

      - name: Verify APK signature + certificate
        continue-on-error: true
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"

          KEYSTORE="TMessagesProj/config/release.keystore"

          APK=$(find ${{ steps.build.outputs.module }}/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK: $APK"

          # ----------------------------------------------------------
          # 1. Verify APK cryptographic signature
          # ----------------------------------------------------------

          APKSIGNER_OUTPUT=$(
            "${ANDROID_HOME}/build-tools/${{ steps.sdk.outputs.build_tools }}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "$APK"
          )

          echo "$APKSIGNER_OUTPUT"

          echo "APK signature verification passed."

          # ----------------------------------------------------------
          # 2. SHA-256 from release.keystore certificate
          # ----------------------------------------------------------

          KEYSTORE_SHA256=$(
            keytool -list \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}'
          )

          if [ -z "$KEYSTORE_SHA256" ]; then
            echo "ERROR: Could not determine keystore certificate SHA-256."
            exit 1
          fi

          # ----------------------------------------------------------
          # 3. SHA-256 from APK certificate
          # ----------------------------------------------------------

          APK_SHA256=$(
            echo "$APKSIGNER_OUTPUT" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}'
          )

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: Could not determine APK certificate SHA-256."
            exit 1
          fi

          # ----------------------------------------------------------
          # 4. Normalize fingerprints
          # ----------------------------------------------------------

          KEYSTORE_SHA256=$(
            echo "$KEYSTORE_SHA256" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          APK_SHA256=$(
            echo "$APK_SHA256" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          echo "Keystore certificate SHA-256: $KEYSTORE_SHA256"
          echo "APK certificate SHA-256:      $APK_SHA256"

          # ----------------------------------------------------------
          # 5. Compare certificates
          # ----------------------------------------------------------

          if [ "$KEYSTORE_SHA256" != "$APK_SHA256" ]; then
            echo "ERROR: APK is signed with a different certificate!"
            exit 1
          fi

          echo "Signing certificate SHA-256 verification passed."
          echo "APK is signed with the expected release.keystore."

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.module }}/build/outputs/**/*.apk
          if-no-files-found: error
          archive: false

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup signing files
        if: always()
        run: |
          set -euo pipefail

          rm -f TMessagesProj/config/release.keystore
          rm -f "$GRADLE_USER_HOME/gradle.properties"

          rm -f ${{ steps.build.outputs.module }}/google-services.json.original
          rm -f TMessagesProj/google-services.json.original

          echo "Signing files cleaned up."
