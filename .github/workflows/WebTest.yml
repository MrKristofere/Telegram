name: Build Test Web

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name"
        type: string
        default: master
        required: true

env:
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # FREE DISK SPACE
      # ============================================================

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      # ============================================================
      # ISOLATE GRADLE USER HOME
      # ============================================================

      - name: Isolate Gradle User Home
        run: |
          set -euo pipefail

          GRADLE_HOME="$RUNNER_TEMP/gradle-user-home"

          mkdir -p "$GRADLE_HOME"

          echo "GRADLE_USER_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"

          echo "Gradle User Home isolated to runner temp directory."

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Configure package
        run: |
          set -euo pipefail

          echo "Original APP_PACKAGE:"
          grep '^APP_PACKAGE=' gradle.properties

          sed -i \
            's/^APP_PACKAGE=.*/APP_PACKAGE=ft.telegram.messenger/' \
            gradle.properties

          echo "Configured APP_PACKAGE:"
          grep '^APP_PACKAGE=' gradle.properties

      # ============================================================
      # FIREBASE
      # ============================================================

      - name: Configure Firebase for custom package
        run: |
          set -euo pipefail

          FILE="TMessagesProj_AppStandalone/google-services.json"

          cp "$FILE" "${FILE}.original"

          python3 <<'PY'
          import json

          path = "TMessagesProj_AppStandalone/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          target = "org.telegram.messenger.web"
          replacement = "ft.telegram.messenger.web"

          found = False

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == target:
                  client["client_info"]["android_client_info"]["package_name"] = replacement
                  found = True
                  print(f"Changed Firebase package: {target} -> {replacement}")

          if not found:
              raise SystemExit(
                  f"Firebase client '{target}' was not found in {path}"
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          echo "Firebase package entries:"
          grep -n "package_name" "$FILE"

      # ============================================================
      # GRADLE OPTIMIZATIONS
      # ============================================================

      - name: Configure Gradle optimizations
        run: |
          set -euo pipefail

          sed -i '/^org.gradle.caching=/d' gradle.properties

          printf '%s\n' 'org.gradle.caching=true' >> gradle.properties

          echo "Gradle optimizations configured."

      # ============================================================
      # SDK VERSIONS
      # ============================================================

      - name: Extract Android SDK versions
        id: sdk
        run: |
          set -euo pipefail

          BUILD_GRADLE="TMessagesProj_AppStandalone/build.gradle"

          echo "build_tools=$(grep -oP "buildToolsVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

          echo "compile_sdk=$(grep -oP "compileSdk(?:Version)?\s*=?\s*\K\d+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

          echo "ndk=$(grep -oP "ndkVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;${{ steps.sdk.outputs.build_tools }}
            ndk;${{ steps.sdk.outputs.ndk }}
            platforms;android-${{ steps.sdk.outputs.compile_sdk }}

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      # ============================================================
      # GRADLE JVM
      # ============================================================

      - name: Modify Gradle JVM Args
        run: |
          set -euo pipefail

          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))

          echo "Detected memory size: ${MEMORY_GB}GB"

          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties

            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      # ============================================================
      # BUILD VARS
      # ============================================================

      - name: Fill BuildVars
        run: |
          set -euo pipefail

          BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"

          sed -i -E \
            's/public static int APP_ID = [0-9]+;/public static int APP_ID = 6;/' \
            "$BUILD_VARS"

          sed -i -E \
            's/public static String APP_HASH = "[^"]*";/public static String APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e";/' \
            "$BUILD_VARS"

      # ============================================================
      # RESTORE PRIVATE RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          KEYSTORE="TMessagesProj/config/release.keystore"

          mkdir -p "$(dirname "$KEYSTORE")"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: release.keystore was not created or is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE"

          echo "Release keystore restored."

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ steps.sdk.outputs.ndk }}

      # ============================================================
      # NATIVE CACHE
      # ============================================================

      - name: Cache native CMake / NDK build
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/cmake
            TMessagesProj/build/intermediates/ndkBuild
          key: ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-
            ${{ runner.os }}-ndk-

      # ============================================================
      # SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # ============================================================
      # CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is not configured."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is not configured."
            exit 1
          fi

          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD secret is not configured."
            exit 1
          fi

          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"

          # Remove repository/default signing values.
          sed -i '/^RELEASE_KEY_PASSWORD=/d' gradle.properties
          sed -i '/^RELEASE_KEY_ALIAS=/d' gradle.properties
          sed -i '/^RELEASE_STORE_PASSWORD=/d' gradle.properties

          # Store real signing values only in Gradle User Home.
          {
            printf '%s\n' "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            printf '%s\n' "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            printf '%s\n' "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } > "$GRADLE_USER_HOME/gradle.properties"

          chmod 600 "$GRADLE_USER_HOME/gradle.properties"

          echo "Release signing configured."

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"

          KEYSTORE="TMessagesProj/config/release.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: $KEYSTORE not found."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore verification passed."

      # ============================================================
      # BUILD SIGNED APK
      # ============================================================

      - name: Build Standalone APK
        run: |
          set -euo pipefail

          ./gradlew \
            --build-cache \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      # ============================================================
      # VERIFY APK PACKAGE + SIGNATURE + SHA-256
      # ============================================================

      - name: Verify APK signature + certificate
        continue-on-error: true
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_ALIAS"

          KEYSTORE="TMessagesProj/config/release.keystore"

          APK=$(find TMessagesProj_AppStandalone/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK: $APK"

          # ----------------------------------------------------------
          # 1. Verify APK cryptographic signature
          # ----------------------------------------------------------

          APKSIGNER_OUTPUT=$(
            "${ANDROID_HOME}/build-tools/${{ steps.sdk.outputs.build_tools }}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "$APK"
          )

          echo "$APKSIGNER_OUTPUT"

          echo "APK signature verification passed."

          # ----------------------------------------------------------
          # 2. SHA-256 from release.keystore certificate
          # ----------------------------------------------------------

          KEYSTORE_SHA256=$(
            keytool -list \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}'
          )

          if [ -z "$KEYSTORE_SHA256" ]; then
            echo "ERROR: Could not determine keystore certificate SHA-256."
            exit 1
          fi

          # ----------------------------------------------------------
          # 3. SHA-256 from APK certificate
          # ----------------------------------------------------------

          APK_SHA256=$(
            echo "$APKSIGNER_OUTPUT" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}'
          )

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: Could not determine APK certificate SHA-256."
            exit 1
          fi

          # ----------------------------------------------------------
          # 4. Normalize fingerprints
          # ----------------------------------------------------------

          KEYSTORE_SHA256=$(
            echo "$KEYSTORE_SHA256" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          APK_SHA256=$(
            echo "$APK_SHA256" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          echo "Keystore certificate SHA-256: $KEYSTORE_SHA256"
          echo "APK certificate SHA-256:      $APK_SHA256"

          # ----------------------------------------------------------
          # 5. Compare certificates
          # ----------------------------------------------------------

          if [ "$KEYSTORE_SHA256" != "$APK_SHA256" ]; then
            echo "ERROR: APK is signed with a different certificate!"
            exit 1
          fi

          echo "Signing certificate SHA-256 verification passed."
          echo "APK is signed with the expected release.keystore."

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: telegram-standalone-ft-web
          path: TMessagesProj_AppStandalone/build/outputs/**/*.apk
          if-no-files-found: error
          archive: false

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup signing files
        if: always()
        run: |
          set -euo pipefail

          rm -f TMessagesProj/config/release.keystore
          rm -f "$GRADLE_USER_HOME/gradle.properties"
          rm -f TMessagesProj_AppStandalone/google-services.json.original

          echo "Signing files cleaned up."
