name: Build (unsigned)

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned APK via Docker
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build -t vpgram-build .
          docker run --rm \
            -e COMMIT_SHA="$COMMIT_SHA" \
            -v "$(pwd):/home/source" \
            vpgram-build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: warn
